    /* =========================================================================
     * Canvas 座標轉換與 60fps Lerp 平滑動態標註追蹤框線
     * ========================================================================= */
    function resizeOverlayCanvas() {
      const rect = dom.viewport.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      dom.canvas.width = Math.round(rect.width * dpr);
      dom.canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeOverlayCanvas);
    resizeOverlayCanvas();

    // 將 Worker 偵測結果座標精準映射至 object-fit: cover 顯示中的螢幕 Canvas 座標
    function mapWorkerPointToCanvas(pt, procW, procH, cropRect) {
      const vw = dom.video.videoWidth || 1;
      const vh = dom.video.videoHeight || 1;
      const cw = dom.viewport.clientWidth;
      const ch = dom.viewport.clientHeight;

      const vx = cropRect.x + (pt.x / procW) * cropRect.w;
      const vy = cropRect.y + (pt.y / procH) * cropRect.h;

      const scale = Math.max(cw / vw, ch / vh);
      const offsetX = (cw - vw * scale) * 0.5;
      const offsetY = (ch - vh * scale) * 0.5;

      return {
        x: offsetX + vx * scale,
        y: offsetY + vy * scale
      };
    }

    function drawTrackingPolygon(corners, alpha) {
      if (!corners || corners.length < 4 || alpha <= 0.02) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      // 半透明科技感填充多邊形
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 255, 157, 0.14)';
      ctx.fill();

      // 螢光綠外發光追蹤框線
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = '#00ff9d';
      ctx.shadowColor = '#00ff9d';
      ctx.shadowBlur = 16;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 四個頂點高亮圓點與銳利角標
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#00e5ff';
      for (const p of corners) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* =========================================================================
     * Web Worker 初始化與主執行緒 60fps 影像調度迴圈
     * ========================================================================= */
    const workerBlob = new Blob([workerSource], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);
    const decoderWorker = new Worker(workerUrl);

    function updateEngineLabel(activeLabel = null) {
      if (state.enginePref === 'WASM') {
        dom.engineBtn.textContent = 'WASM Worker';
        dom.engineBtn.classList.add('active');
      } else if (state.enginePref === 'NATIVE' && state.hasNative) {
        dom.engineBtn.textContent = 'Native GPU';
        dom.engineBtn.classList.remove('active');
      } else {
        dom.engineBtn.textContent = activeLabel || (state.hasNative ? 'Native GPU' : 'WASM Worker');
        dom.engineBtn.classList.toggle('active', !state.hasNative);
      }
    }

    decoderWorker.onmessage = (e) => {
      const msg = e.data;
      if (!msg) return;

      if (msg.type === 'READY') {
        state.hasNative = !!msg.hasNative;
        updateEngineLabel();
        if (msg.wasmFailed && !msg.hasNative) {
          showToast('離線狀態無法載入 WASM，且瀏覽器不支援原生條碼引擎', 4500);
        }
        return;
      }

      if (msg.type === 'WASM_STATUS') {
        if (msg.wasmReady) showToast('ZXing WebAssembly C++ 引擎已就緒');
        return;
      }

      if (msg.type === 'RESULT') {
        state.workerBusy = false;

        // 統計真實解碼 FPS
        state.fpsCounter++;
        const now = performance.now();
        if (now - state.lastFpsTime >= 1000) {
          state.currentFps = Math.round((state.fpsCounter * 1000) / (now - state.lastFpsTime));
          dom.fpsLabel.textContent = `${state.currentFps} FPS`;
          state.fpsCounter = 0;
          state.lastFpsTime = now;
        }

        if (msg.usedEngine && msg.usedEngine !== 'Unavailable') {
          updateEngineLabel(msg.usedFilter && msg.usedFilter !== 'RAW' ? `${msg.usedEngine} · ${msg.usedFilter}` : msg.usedEngine);
        }

        if (!msg.isStatic) {
          evaluateAutoTorch(msg.luminance);
        }

        if (msg.results && msg.results.length > 0) {
          const hit = msg.results[0];

          if (!msg.isStatic && hit.corners && hit.corners.length === 4) {
            // 計算偵測框線寬度佔比以驅動 Auto-Zoom
            const xs = hit.corners.map(c => c.x);
            const boxW = Math.max(...xs) - Math.min(...xs);
            const effectiveRatio = (boxW / msg.procW) / state.swZoomFactor;
            applySmartZoom(effectiveRatio, true);

            state.targetCorners = hit.corners.map(pt =>
              mapWorkerPointToCanvas(pt, msg.procW, msg.procH, msg.cropRect)
            );
            state.boxAlpha = 1;
            dom.reticle.classList.add('hidden');
          }

          handleDecodedBarcode(hit);
        } else {
          if (msg.isStatic) {
            showToast('圖片中未偵測到有效的 QR Code，請嘗試裁切後重試');
          } else {
            applySmartZoom(0, false);
          }
        }
      }
    };

    decoderWorker.postMessage({ type: 'INIT' });

    // 60fps 主迴圈：繪製 Lerp 平滑動態框線 + 非阻塞轉移 ImageBitmap 至背景 Worker
    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const cw = dom.viewport.clientWidth;
      const ch = dom.viewport.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      // Lerp 內插法消除追蹤框抖動
      if (state.targetCorners) {
        if (!state.lerpCorners) {
          state.lerpCorners = state.targetCorners.map(p => ({ ...p }));
        } else {
          const smooth = 0.34;
          for (let i = 0; i < 4; i++) {
            state.lerpCorners[i].x += (state.targetCorners[i].x - state.lerpCorners[i].x) * smooth;
            state.lerpCorners[i].y += (state.targetCorners[i].y - state.lerpCorners[i].y) * smooth;
          }
        }
        drawTrackingPolygon(state.lerpCorners, state.boxAlpha);
        if (!state.paused) {
          state.boxAlpha = Math.max(0, state.boxAlpha - 0.04);
          if (state.boxAlpha <= 0.02) {
            state.targetCorners = null;
            state.lerpCorners = null;
            dom.reticle.classList.remove('hidden');
          }
        }
      }

      // 擷取影格並轉移至 Worker（確保上一幀已處理完畢才送下一幀，零佇列堆積）
      if (!state.paused && !state.workerBusy && dom.video.readyState >= 2 && dom.video.videoWidth > 0) {
        state.workerBusy = true;
        state.frameIndex++;

        const vw = dom.video.videoWidth;
        const vh = dom.video.videoHeight;

        // 若無硬體變焦而啟動軟體 ROI 放大，僅裁切中央區域進行 1:1 高密度解析
        const zoom = state.hwZoomSupported ? 1 : state.swZoomFactor;
        const cropW = Math.round(vw / zoom);
        const cropH = Math.round(vh / zoom);
        const cropX = Math.round((vw - cropW) * 0.5);
        const cropY = Math.round((vh - cropH) * 0.5);

        const maxDim = 960;
        const scale = Math.min(1, maxDim / Math.max(cropW, cropH));
        const outW = Math.max(64, Math.round(cropW * scale));
        const outH = Math.max(64, Math.round(cropH * scale));

        createImageBitmap(dom.video, cropX, cropY, cropW, cropH, {
          resizeWidth: outW,
          resizeHeight: outH,
          resizeQuality: 'medium'
        }).then(bitmap => {
          decoderWorker.postMessage({
            type: 'FRAME',
            bitmap,
            width: outW,
            height: outH,
            cropRect: { x: cropX, y: cropY, w: cropW, h: cropH },
            enginePref: state.enginePref,
            enhanceMode: state.enhanceMode,
            frameIndex: state.frameIndex,
            isStatic: false
          }, [bitmap]);
        }).catch(() => {
          state.workerBusy = false;
        });
      }
    }

    /* =========================================================================
     * 技術 9-A：全能輸入擴充（剪貼簿貼上、拖放圖片、檔案選取）
     * ========================================================================= */
    async function decodeImageBlob(blob) {
      if (!blob) return;
      showToast('正在以 WASM + CLAHE 強化解析圖片...');
      try {
        const rawBmp = await createImageBitmap(blob);
        const maxDim = 1600;
        const scale = Math.min(1, maxDim / Math.max(rawBmp.width, rawBmp.height));
        const w = Math.max(32, Math.round(rawBmp.width * scale));
        const h = Math.max(32, Math.round(rawBmp.height * scale));
        const bitmap = scale < 1
          ? await createImageBitmap(rawBmp, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' })
          : rawBmp;
        if (bitmap !== rawBmp) rawBmp.close();

        state.paused = false;
        decoderWorker.postMessage({
          type: 'FRAME',
          bitmap,
          width: w,
          height: h,
          cropRect: { x: 0, y: 0, w, h },
          enginePref: 'WASM',
          enhanceMode: 'ALWAYS',
          frameIndex: 0,
          isStatic: true
        }, [bitmap]);
      } catch (err) {
        showToast('圖片讀取失敗：' + err.message);
      }
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          decodeImageBlob(item.getAsFile());
          return;
        }
      }
    });

    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dom.dropOverlay.classList.add('show');
    });
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) dom.dropOverlay.classList.remove('show');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dom.dropOverlay.classList.remove('show');
      const file = e.dataTransfer?.files?.[0];
      if (file && file.type.startsWith('image/')) {
        decodeImageBlob(file);
      } else if (file) {
        showToast('請拖放圖片檔案 (PNG / JPG / WebP)');
      }
    });

    /* =========================================================================
     * UI 控制事件綁定
     * ========================================================================= */
    document.addEventListener('pointerdown', unlockAudio, { passive: true });

    dom.engineBtn.addEventListener('click', () => {
      if (!state.hasNative) {
        showToast('目前裝置不支援 Native BarcodeDetector，已啟用 WASM 引擎');
        return;
      }
      const order = ['AUTO', 'WASM', 'NATIVE'];
      const next = order[(order.indexOf(state.enginePref) + 1) % order.length];
      state.enginePref = next;
      if (next === 'WASM') decoderWorker.postMessage({ type: 'PRELOAD_WASM' });
      updateEngineLabel();
      showToast(
        next === 'AUTO' ? '引擎模式：智慧混合 (Native GPU + WASM)' :
        next === 'WASM' ? '引擎模式：強制 ZXing WebAssembly C++' :
                          '引擎模式：僅限 Native GPU'
      );
    });

    dom.filterBtn.addEventListener('click', () => {
      state.enhanceMode = state.enhanceMode === 'AUTO' ? 'ALWAYS' : 'AUTO';
      dom.filterBtn.classList.toggle('active', state.enhanceMode === 'ALWAYS');
      dom.filterBtn.textContent = state.enhanceMode === 'ALWAYS' ? '✨ 常駐增強' : '✨ 自動增強';
      showToast(state.enhanceMode === 'ALWAYS' ? '已常駐開啟 CLAHE + 自適應二值化濾鏡' : '濾鏡已設為智慧自動觸發');
    });

    dom.torchBtn.addEventListener('click', () => {
      if (!state.capabilities.torch) return;
      state.torchUserOverride = true;
      setTorch(!state.torchOn, false);
    });

    // 短按切換後置多鏡頭，長按 (>450ms) 切換微距對焦鎖定
    let camPressTimer = null;
    let camLongPressed = false;
    dom.cameraBtn.addEventListener('pointerdown', () => {
      camLongPressed = false;
      camPressTimer = setTimeout(() => {
        camLongPressed = true;
        toggleMacroFocus();
      }, 480);
    });
    dom.cameraBtn.addEventListener('pointerup', () => clearTimeout(camPressTimer));
    dom.cameraBtn.addEventListener('pointerleave', () => clearTimeout(camPressTimer));
    dom.cameraBtn.addEventListener('click', async () => {
      if (camLongPressed) return;
      if (state.rearCameras.length > 1) {
        state.activeCamIndex = (state.activeCamIndex + 1) % state.rearCameras.length;
        const target = state.rearCameras[state.activeCamIndex];
        await startCamera(target.deviceId);
      } else {
        await toggleMacroFocus();
      }
    });

    dom.uploadBtn.addEventListener('click', () => dom.fileInput.click());
    dom.errorUploadBtn.addEventListener('click', () => dom.fileInput.click());
    dom.fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) decodeImageBlob(file);
      dom.fileInput.value = '';
    });

    dom.autoJumpBtn.addEventListener('click', () => {
      state.autoJump = !state.autoJump;
      dom.autoJumpBtn.classList.toggle('active', state.autoJump);
      dom.autoJumpText.textContent = state.autoJump ? '自動跳轉' : '手動確認';
      showToast(state.autoJump ? '偵測安全網址後將倒數 1 秒自動跳轉' : '已切換為手動確認跳轉模式');
    });

    dom.closeSheetBtn.addEventListener('click', () => resumeScanning());
    dom.cooldownOverlay.addEventListener('click', () => resumeScanning());
    dom.retryCamBtn.addEventListener('click', () => startCamera());

    /* =========================================================================
     * 啟動入口：全自動開啟後置廣角相機 + 環境光偵測 + 60fps 渲染管線
     * ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      initAmbientLightSensor();
      requestAnimationFrame(renderLoop);
      startCamera();
    });
  })();
  </script>
</body>
</html>
