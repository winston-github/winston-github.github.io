<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時空急流 - V10 行動端完美版</title>
    <style>
        :root { --primary: #00e5ff; --danger: #ff3366; --warning: #ffcc00; --bg: #030308; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; color: white;}
        canvas { display: block; position: absolute; z-index: 1; outline: none; pointer-events: auto; }
        
        #damage-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255,0,50,0.8) 100%); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.3s ease-out; }
        .flash-red { opacity: 1 !important; transition: none !important; }
        
        .pointer-auto { pointer-events: auto; }
        .hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s; }
        svg.icon { width: 1.5rem; height: 1.5rem; fill: currentColor; vertical-align: middle; }
        
        /* 啟動與結算 */
        #screen-start, #screen-gameover { position: absolute; inset: 0; background: rgba(5, 10, 20, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(15px); transition: opacity 0.4s ease; }
        h1 { color: var(--primary); text-shadow: 0 0 25px var(--primary); margin-bottom: 10px; font-size: clamp(2rem, 6vw, 3.5rem); text-align: center; letter-spacing: 2px;}
        p.subtitle { font-size: 1.15rem; color: #d0f0ff; margin-bottom: 35px; text-align: center; line-height: 1.6; padding: 0 20px; max-width: 650px;}
        button.btn-main { display: flex; align-items: center; justify-content: center; background: rgba(0,229,255,0.1); border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-size: 1.25rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.1s; pointer-events: auto; box-shadow: 0 0 20px rgba(0,229,255,0.2); backdrop-filter: blur(5px); }
        button.btn-main:active { background: var(--primary); color: #000; transform: scale(0.95); box-shadow: 0 0 40px rgba(0,229,255,0.6); }

        .side-controls { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 20; pointer-events: auto; }
        .btn-icon { background: rgba(0,0,0,0.8); border: 1px solid var(--primary); color: var(--primary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.1s; box-shadow: 0 0 15px rgba(0,0,0,0.6);}
        .btn-icon:active { transform: scale(0.9); background: var(--primary); color: black; }

        /* 解說彈窗 */
        #explanation-screen, #kb-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.3s; }
        .exp-content { background: rgba(15,25,35,0.95); width: 85%; max-width: 800px; padding: 30px; border-radius: 15px; border: 1px solid #444; font-size: 1.1rem; line-height: 1.7; margin-bottom: 25px; box-shadow: 0 15px 50px rgba(0,0,0,1); max-height: 65vh; overflow-y: auto;}
        .exp-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid; padding-bottom: 8px; display: flex; align-items: center;}
        .correct-text { color: var(--primary); border-color: var(--primary); }
        .wrong-text { color: var(--danger); border-color: var(--danger); margin-top: 25px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .kb-item { background: rgba(0,0,0,0.6); padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--primary); font-size: 1rem; line-height: 1.6; border-radius: 6px;}
        
        #audio-hint { color: #ffcc00; font-size: 0.9rem; margin-top: 15px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19h16v2H4zM20 3H4v14h16zM6 5h12v2H6zm0 4h12v2H6zm0 4h8v2H6z"/></symbol>
        <symbol id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
        <symbol id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></symbol>
        <symbol id="icon-cross" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-skip" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
    </svg>

    <div id="damage-overlay"></div>

    <div id="screen-start" class="pointer-auto">
        <h1>時空急流 <span>V10 優化版</span></h1>
        <p class="subtitle">【行動端專屬 3D 視覺優化】<br>雙手觸控螢幕左右，感受絲滑物理側傾。<br>撞碎錯誤的歷史光門，修復時間線！</p>
        <button id="btn-start" class="btn-main"><svg class="icon"><use href="#icon-play"></use></svg> 點火躍遷</button>
        <div id="audio-hint">💡 建議開啟手機聲音以獲得最佳體驗</div>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title" style="color:var(--danger); text-shadow: 0 0 25px var(--danger);">時間線已崩塌</h1>
        <p class="subtitle">最終評級得分</p>
        <div id="go-score" style="color: var(--primary); font-size: 4rem; font-weight:900; margin-bottom: 30px;">0</div>
        <button id="btn-restart" class="btn-main">重啟迴圈</button>
    </div>

    <div class="side-controls">
        <div id="btn-kb" class="btn-icon" title="時空記憶庫"><svg class="icon"><use href="#icon-book"></use></svg></div>
        <div id="btn-mute" class="btn-icon" title="靜音切換">
            <svg class="icon" id="icon-sound-on-svg"><use href="#icon-sound-on"></use></svg>
            <svg class="icon hidden" id="icon-sound-off-svg"><use href="#icon-sound-off"></use></svg>
        </div>
    </div>

    <div id="kb-modal" class="hidden">
        <h2 style="color: var(--primary); margin-bottom: 15px;">阿卡西全紀錄</h2>
        <div class="exp-content" id="kb-list"></div>
        <div style="display:flex; gap: 20px;">
            <button id="btn-close-kb" class="btn-main">返回待機</button>
            <button id="btn-clear-kb" class="btn-main" style="border-color: var(--danger); color: var(--danger);">清除記憶</button>
        </div>
    </div>

    <div id="explanation-screen" class="hidden">
        <div class="exp-content" id="exp-scroll-area">
            <div id="exp-correct-title" class="exp-title correct-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-check"></use></svg> 歷史正道</div>
            <div id="exp-correct-text" style="margin-bottom: 25px;"></div>
            <div id="exp-wrong-title" class="exp-title wrong-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-cross"></use></svg> 平行盲點</div>
            <div id="exp-wrong-text"></div>
        </div>
        <button id="btn-skip-exp" class="btn-main" style="border-color: #666; color: #aaa;"><svg class="icon"><use href="#icon-skip"></use></svg> 強行躍遷</button>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
// ==========================================
// 1. 80 大精編核心歷史題庫 (濃縮以節省版面，確保功能完整)
// ==========================================
const BaseFacts = [
    { era: "商周革命", color: 0xffaa00, premise: "周武王滅商後，疆域擴大但交通不便，且商朝舊勢力仍存。", correctOpt: "實施「封建制度」，分封宗室功臣建立諸侯國防衛。", wrongOpt: "實施「郡縣制」，由中央直接指派流動官僚進行集權。", expCorrect: "西周初期缺乏強大官僚與交通，只能透過血緣分封鞏固控制。", expWrong: "郡縣制是秦朝統一天下後才具備條件實施的制度。" },

    { era: "秦滅六國", color: 0xaa2222, premise: "秦始皇統一天下後，發現各國文字、貨幣與度量衡皆不同。", correctOpt: "實施「書同文、車同軌」，統一貨幣與度量衡強化大一統。", wrongOpt: "實施「地方自治」，尊重六國原有文化並保留獨立貨幣。", expCorrect: "秦始皇的標準化政策打破了文化壁壘，奠定中國兩千年大一統基礎。", expWrong: "保留六國制度會導致國家迅速分裂，法家不允許地方分權。" },

    { era: "三國鼎立", color: 0x0088ff, premise: "赤壁之戰前夕，孫劉聯軍面對曹操號稱百萬的水陸大軍。", correctOpt: "利用長江天險與曹軍不熟水性的弱點，發動「火攻」大破敵軍。", wrongOpt: "放棄江南退守雲貴高原，利用高山地形打游擊戰。", expCorrect: "周瑜黃蓋利用東風放火，燒毀了用鐵索連環的戰船，奠定三分天下。", expWrong: "退守雲貴是南明政權末路做法。孫吳水軍強大，放棄長江等於自殺。" },

class UniverseGenerator {
    static getQueue(loopCount) {
        let pool = JSON.parse(JSON.stringify(BaseFacts));
        pool.sort(function() { return Math.random() - 0.5; }); 
        if(loopCount > 1) {
            pool = pool.map(function(baseQ) {
                let otherFacts = BaseFacts.filter(function(q) { return q.era !== baseQ.era && q.correctOpt !== baseQ.correctOpt; });
                let randomWrongQ = otherFacts[Math.floor(Math.random() * otherFacts.length)];
                if(!randomWrongQ) return baseQ;
                return Object.assign({}, baseQ, {
                    era: baseQ.era + " [異變]",
                    wrongOpt: randomWrongQ.correctOpt,
                    expWrong: "【時空錯亂】這是【" + randomWrongQ.era.replace(' (平行時空)','') + "】的做法！" + randomWrongQ.expCorrect
                });
            });
        }
        return pool;
    }
}

// 2. 音效與 TTS 系統 (iOS 100% 發聲原生列隊)
// ==========================================
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.ttsActive = false;
    }

    init() {
        try {
            if(!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if(this.ctx.state === 'suspended') this.ctx.resume();
            
            // iOS 必須在 user-gesture 同步執行 speak 才能獲得永久授權
            if(window.speechSynthesis) {
                let u = new SpeechSynthesisUtterance(''); u.volume = 0; 
                window.speechSynthesis.speak(u);
            }
        } catch(e) { console.warn("音訊初始化受阻", e); }
    }

    toggleMute() {
        this.isMuted = !this.isMuted;
        const son = document.getElementById('icon-sound-on-svg');
        const soff = document.getElementById('icon-sound-off-svg');
        if (son && soff) {
            son.classList.toggle('hidden', this.isMuted);
            soff.classList.toggle('hidden', !this.isMuted);
        }
        if(this.isMuted) this.stopTTS();
    }

    playTone(freqs, duration, type='sine', vol=0.1) {
        if(this.isMuted || !this.ctx) return;
        try {
            if(this.ctx.state === 'suspended') this.ctx.resume();
            const t = this.ctx.currentTime;
            freqs.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain); gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0, t + i*0.05);
                gain.gain.linearRampToValueAtTime(vol, t + i*0.05 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i*0.05 + duration);
                osc.start(t + i*0.05); osc.stop(t + i*0.05 + duration);
            });
        } catch(e) {}
    }

    playWin() { this.playTone([523.25, 659.25, 783.99, 1046.50], 1.5, 'sine', 0.1); }
    playLose() { this.playTone([150, 100, 50], 1.0, 'sawtooth', 0.2); }
    playWarp() { this.playTone([800, 1200, 1600], 0.8, 'sine', 0.05); }

    // 【iOS 修復】不使用 setTimeout 排程，直接塞入 native queue
    playPreReading(eraRaw, qText, lText, rText, fallbackMs, callbacks, onEnd) {
        this.stopTTS();
        this.ttsActive = true;
        
        if (!window.speechSynthesis || this.isMuted) {
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
            return;
        }

        const cleanEra = eraRaw.replace(/ \[(異變|平行時空)\].*/, '');
        const segments = [
            cleanEra + "，面臨情境：" + qText,
            "左方抉擇：" + lText,
            "右方抉擇：" + rText
        ];

        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));

        try {
            let u1 = new SpeechSynthesisUtterance(segments[0]);
            let u2 = new SpeechSynthesisUtterance(segments[1]);
            let u3 = new SpeechSynthesisUtterance(segments[2]);
            
            [u1, u2, u3].forEach((u, i) => {
                if(twVoice) u.voice = twVoice;
                u.rate = 1.15; u.pitch = 1.05;
                u.onstart = () => { if(this.ttsActive && callbacks[i]) callbacks[i](); };
            });

            u3.onend = () => { 
                clearTimeout(this.fallbackTimer);
                // 留 0.5 秒思考期
                setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, 500); 
            };
            u3.onerror = () => {
                clearTimeout(this.fallbackTimer);
                if(this.ttsActive && onEnd) onEnd();
            };

            window._ttsUtterances = [u1, u2, u3]; // 防回收
            window.speechSynthesis.speak(u1);
            window.speechSynthesis.speak(u2);
            window.speechSynthesis.speak(u3);
            
            this.fallbackTimer = setTimeout(() => {
                if(this.ttsActive && onEnd) { this.stopTTS(); onEnd(); }
            }, fallbackMs + 3000);
            
        } catch (e) {
            console.warn("TTS Queue Error", e);
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
        }
    }

    playExplanationTTS(correctText, wrongText, fallbackMs, onEnd) {
        this.stopTTS(); 
        this.ttsActive = true;
        
        if (this.isMuted || !window.speechSynthesis) { 
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
            return; 
        }

        const segments = ["歷史正道！" + correctText, "平行盲點！" + wrongText];
        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));
        
        try {
            let u1 = new SpeechSynthesisUtterance(segments[0]);
            let u2 = new SpeechSynthesisUtterance(segments[1]);
            
            [u1, u2].forEach((u) => {
                if(twVoice) u.voice = twVoice;
                u.rate = 1.15; u.pitch = 1.05;
            });

            u2.onend = () => { clearTimeout(this.fallbackTimer); if(onEnd) onEnd(); };
            u2.onerror = () => { clearTimeout(this.fallbackTimer); if(onEnd) onEnd(); };

            window._ttsUtterances = [u1, u2];
            window.speechSynthesis.speak(u1);
            window.speechSynthesis.speak(u2);
            
            this.fallbackTimer = setTimeout(() => {
                if(this.ttsActive && onEnd) { this.stopTTS(); onEnd(); }
            }, fallbackMs + 3000);
        } catch (e) {
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
        }
    }

    stopTTS() {
        this.ttsActive = false;
        clearTimeout(this.fallbackTimer);
        try { if(window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
    }
}
const AudioObj = new AudioSystem();

class KnowledgeBase {
    constructor() { try { this.records = JSON.parse(localStorage.getItem('chronos_v10_kb')) || []; } catch(e) { this.records = []; } }
    save(eventData) {
        const cleanEra = eventData.era.replace(/ \[(異變|平行時空)\].*/, '');
        if (!this.records.some(r => r.premise === eventData.premise)) {
            this.records.unshift(Object.assign({}, eventData, {era: cleanEra}));
            if(this.records.length > 100) this.records.pop();
            try { localStorage.setItem('chronos_v10_kb', JSON.stringify(this.records)); } catch(e){}
        }
    }
    clear() { this.records = []; localStorage.removeItem('chronos_v10_kb'); this.render(); }
    render() {
        const list = document.getElementById('kb-list');
        if(!list) return;
        list.innerHTML = this.records.length === 0 ? "<p style='text-align:center;'>尚未解鎖任何歷史記憶。</p>" : "";
        this.records.forEach(r => {
            const div = document.createElement('div'); div.className = 'kb-item';
            div.innerHTML = "<div style='color:var(--primary); font-weight:bold; margin-bottom:5px; font-size:1.1rem;'>" + r.era + "</div>" +
                            "<strong style='display:block; margin-bottom:10px; color:#fff;'>情境：" + r.premise + "</strong>" +
                            "<span style='color:var(--warning);'>✔️ 正解：" + r.correctOpt + "</span><br>" +
                            "<span style='color:var(--danger);'>❌ 盲點：" + r.wrongOpt + "</span>";
            list.appendChild(div);
        });
    }
}

class GameEngine {
    constructor() {
        this.state = { isPlaying: false, phase: 'explaining', health: 3, score: 0, displayScore: 0, qIndex: 0, loop: 1, baseSpeed: 200 };
        this.clock = new THREE.Clock();
        this.runQueue = [];
        
        this.timeScale = 1.0;
        this.targetTimeScale = 1.0;
        this.targetFov = 90;
        this.rafId = null; 
        
        this.targetInputX = 0; 
        this.gateApproachSpeed = 0; 
        
        this.isCorrectOnLeft = true;
        this.hitTriggered = false;
        this.particleTime = 0;

        this.els = {
            start: document.getElementById('screen-start'),
            gameover: document.getElementById('screen-gameover'),
            expScreen: document.getElementById('explanation-screen'),
            kbModal: document.getElementById('kb-modal'),
            dmgFlash: document.getElementById('damage-overlay')
        };

        this.init3D();
        this.bindEvents();
    }

    bindEvents() {
        const bindBtn = (id, callback) => {
            const btn = document.getElementById(id);
            if(btn) {
                const handler = (e) => {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    callback();
                };
                btn.addEventListener('click', handler);
                btn.addEventListener('touchstart', handler, {passive: false});
            }
        };

        bindBtn('btn-start', () => { 
            if(this.state.isPlaying) return;
            AudioObj.init(); 
            this.start(); 
        });

        bindBtn('btn-restart', () => { 
            if(this.els.gameover) this.els.gameover.classList.add('hidden'); 
            this.start(); 
        });
        
        bindBtn('btn-skip-exp', () => {
            if(!this.state.isPlaying || this.state.phase !== 'explaining') return;
            AudioObj.init(); AudioObj.stopTTS(); 
            this.resumeAfterExplanation();
        });
        
        bindBtn('btn-kb', () => { KB.render(); if(this.els.kbModal) this.els.kbModal.classList.remove('hidden'); });
        bindBtn('btn-close-kb', () => { if(this.els.kbModal) this.els.kbModal.classList.add('hidden'); });
        bindBtn('btn-clear-kb', () => { KB.clear(); });
        
        // 獨立綁定靜音按鈕
        const muteBtn = document.getElementById('btn-mute');
        if (muteBtn) {
            muteBtn.addEventListener('click', () => AudioObj.toggleMute());
            muteBtn.addEventListener('touchstart', (e) => { e.preventDefault(); AudioObj.toggleMute(); }, {passive: false});
        }

        const updateSteering = (clientX) => {
            if(!this.state.isPlaying || this.state.phase === 'explaining') return;
            const ratio = (clientX / window.innerWidth) - 0.5; 
            // 如果是直立螢幕，飛船的可移動範圍縮小一點以配合變窄的畫面
            const limit = (window.innerWidth < window.innerHeight) ? 20 : 28;
            this.targetInputX = ratio * limit; 
        };

        window.addEventListener('touchstart', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content') || e.target.closest('.side-controls')) return;
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => {
            if(!e.target.closest('.exp-content')) { if(e.cancelable) e.preventDefault(); }
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content') || e.target.closest('.side-controls')) return;
            updateSteering(e.clientX);
        });
        window.addEventListener('mousemove', (e) => {
            if(e.buttons > 0) updateSteering(e.clientX);
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.updateLayout(); // 螢幕旋轉時重新排版
            }, 200);
        });
    }

    // 【核心修復】自動縮放字體，保證絕不超出邊界
    updateTexture(tex, text, colorHex, isHUD, isHighlight) {
        isHUD = isHUD || false;
        isHighlight = isHighlight || false;
        
        try {
            const canvas = tex.image;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(!isHUD) {
                ctx.fillStyle = isHighlight ? 'rgba(20, 40, 60, 0.95)' : 'rgba(5, 10, 20, 0.75)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.strokeStyle = colorHex;
                ctx.lineWidth = isHighlight ? 35 : 15;
                ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
            }
            
            // 統一文字為白色，依靠發光營造顏色
            ctx.fillStyle = '#ffffff'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = isHighlight ? 50 : 20;

            const maxWidth = canvas.width - 60;
            const maxHeight = canvas.height - 40;
            
            // 自動縮放字體演算法
            let fontSize = isHUD ? 75 : 80; // 初始大字體
            let lines = [];
            let lh = fontSize * 1.2;
            
            while(fontSize > 20) {
                ctx.font = `bold ${fontSize}px "Segoe UI", sans-serif`;
                lh = fontSize * 1.2;
                lines = [];
                
                const paragraphs = text.split('\n');
                for(let p=0; p<paragraphs.length; p++) {
                    if(paragraphs[p] === '') { lines.push(''); continue; }
                    const words = paragraphs[p].split('');
                    let line = '';
                    for(let i=0; i<words.length; i++) {
                        let test = line + words[i];
                        if(ctx.measureText(test).width > maxWidth && i > 0) {
                            lines.push(line);
                            line = words[i];
                        } else { line = test; }
                    }
                    lines.push(line);
                }
                
                if(lines.length * lh <= maxHeight) {
                    break; // 裝得下，停止縮小
                }
                fontSize -= 5;
            }

            const startY = (canvas.height / 2) - ((lines.length - 1) * lh) / 2;
            for(let i=0; i<lines.length; i++) {
                ctx.fillText(lines[i], canvas.width / 2, startY + i*lh);
            }
            tex.needsUpdate = true;
        } catch (e) {
            console.warn("紋理渲染失敗", e);
        }
    }

        for(let i=0; i<3; i++) {
            let rMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.8 });
            let r = new THREE.Mesh(new THREE.TorusGeometry(3.0 + i*0.8, 0.1, 8, 32), rMat);
            r.rotation.x = Math.PI / 2;
            r.position.z = 1;
            this.shipGroup.add(r);
            this.healthRings.push(r);
        }

        // 光門
        this.gateGroup = new THREE.Group();
        this.scene.add(this.gateGroup);
        
        // 放大畫布以容納長文字
        this.gateL = createPlaneText(10, 12, 1024, 1024);
        this.gateR = createPlaneText(10, 12, 1024, 1024);
        
        // 【動態響應式佈局】
        this.updateLayout();

        const boxGeo = new THREE.BoxGeometry(1, 1, 2); // 基礎大小，後續依 scale 放大
        const edgeGeo = new THREE.EdgesGeometry(boxGeo);
        this.edgeLMat = new THREE.LineBasicMaterial({color: 0xffcc00, linewidth: 2});
        this.edgeRMat = new THREE.LineBasicMaterial({color: 0xff3366, linewidth: 2});
        this.gateL.mesh.add(new THREE.LineSegments(edgeGeo, this.edgeLMat));
        this.gateR.mesh.add(new THREE.LineSegments(edgeGeo, this.edgeRMat));
        
        this.gateGroup.add(this.gateL.mesh); 
        this.gateGroup.add(this.gateR.mesh);
        this.gateGroup.visible = false;

        this.particleGeo = new THREE.BufferGeometry();
        this.baseParticlePos = new Float32Array(300 * 3);
        this.particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.baseParticlePos), 3));
        this.particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 5, transparent: true });
        this.particles = new THREE.Points(this.particleGeo, this.particleMat);
        this.particles.visible = false;
        this.scene.add(this.particles);

        this.loop();
    }

    // 響應式 3D 排版：判斷手機或桌面
    updateLayout() {
        const isPortrait = window.innerWidth < window.innerHeight;
        
        if (isPortrait) {
            // 手機版：看板拉近、縮小寬度變正方形，避免超出螢幕
            this.holo.mesh.scale.set(0.6, 1.2, 1); 
            this.holo.mesh.position.set(0, 6, -18);
            
            // 光門：大幅拉近 (Z=-30)，且往中間靠攏
            this.gateL.mesh.scale.set(10, 12, 1);
            this.gateR.mesh.scale.set(10, 12, 1);
            this.gateL.mesh.position.set(-5.5, 2, -30); 
            this.gateR.mesh.position.set(5.5, 2, -30);
        } else {
            // 電腦版：寬闊視野
            this.holo.mesh.scale.set(1, 1, 1);
            this.holo.mesh.position.set(0, 6, -18);
            
            this.gateL.mesh.scale.set(18, 14, 1);
            this.gateR.mesh.scale.set(18, 14, 1);
            this.gateL.mesh.position.set(-10, 2, -40); 
            this.gateR.mesh.position.set(10, 2, -40);
        }
    }

    start() {
        try {
            if(this.rafId) window.cancelAnimationFrame(this.rafId);
            AudioObj.stopTTS();
            
            this.state = { isPlaying: true, phase: 'reading', health: 3, score: 0, displayScore: 0, qIndex: 0, loop: 1, baseSpeed: 200 };
            this.targetInputX = 0;
            this.shipGroup.position.x = 0;
            this.camera.position.x = 0;
            this.healthRings.forEach(r => r.visible = true);
            
            this.runQueue = UniverseGenerator.getQueue(this.state.loop);
            
            if(this.els.start) this.els.start.classList.add('hidden');
            if(this.els.gameover) this.els.gameover.classList.add('hidden');
            if(this.els.expScreen) this.els.expScreen.classList.add('hidden');
            
            this.updateTexture(this.scoreHolo.tex, `同步率: 0`, '#00e5ff', true);
            this.scheduleQuestion();
            this.loop();
        } catch(e) { console.error("引擎啟動異常", e); }
    }

    scheduleQuestion() {
        try {
            if(this.state.qIndex >= this.runQueue.length) { 
                this.state.loop++;
                this.state.qIndex = 0;
                this.runQueue = UniverseGenerator.getQueue(this.state.loop); 
            }
            
            const q = this.runQueue[this.state.qIndex];
            this.isCorrectOnLeft = Math.random() > 0.5; 
            const txtL = this.isCorrectOnLeft ? q.correctOpt : q.wrongOpt;
            const txtR = this.isCorrectOnLeft ? q.wrongOpt : q.correctOpt;

            this.updateTexture(this.holo.tex, `【第 ${this.state.loop} 宇宙】 ${q.era.replace(/ \[.*/, '')}\n\n${q.premise}`, '#00e5ff', true);
            this.updateTexture(this.gateL.tex, txtL, '#ffcc00', false, false);
            this.updateTexture(this.gateR.tex, txtR, '#ff3366', false, false);

            this.state.phase = 'reading';
            this.timeScale = 0.1; 
            this.targetTimeScale = 0.1;
            this.targetFov = 65; 
            
            // 光門停靠點 (配合 updateLayout)
            this.gateGroup.position.z = 0;
            this.gateGroup.visible = true;
            this.holo.mesh.visible = true;
            this.warn.mesh.visible = false;
            this.hitTriggered = false;

            const totalChars = q.era.length + q.premise.length + txtL.length + txtR.length;
            const fallbackMs = Math.max(4500, (totalChars / 5) * 1000);

            // 聚光燈回調
            const highlightCallbacks = [
                () => { this.updateTexture(this.holo.tex, `【第 ${this.state.loop} 宇宙】 ${q.era.replace(/ \[.*/, '')}\n\n${q.premise}`, '#00e5ff', true); },
                () => { 
                    this.updateTexture(this.gateL.tex, txtL, '#ffcc00', false, true); 
                    this.edgeLMat.color.setHex(0xffffff); 
                },
                () => { 
                    this.updateTexture(this.gateL.tex, txtL, '#ffcc00', false, false); 
                    this.edgeLMat.color.setHex(0xffcc00); 
                    this.updateTexture(this.gateR.tex, txtR, '#ff3366', false, true); 
                    this.edgeRMat.color.setHex(0xffffff); 
                }
            ];

            AudioObj.playPreReading(q.era, q.premise, txtL, txtR, fallbackMs, highlightCallbacks, () => {
                if(!this.state.isPlaying || this.state.phase !== 'reading') return;
                
                this.updateTexture(this.gateR.tex, txtR, '#ff3366', false, false);
                this.edgeRMat.color.setHex(0xff3366);

                this.state.phase = 'action';
                this.holo.mesh.visible = false;
                this.warn.mesh.visible = true;
                
                this.targetTimeScale = 1.0 + (this.state.loop * 0.1); 
                this.targetFov = 110; 
                
                // 絕對 3.0 秒抵達計算
                const distance = Math.abs(this.gateL.mesh.position.z) + 5; 
                this.gateApproachSpeed = distance / 3.0; 
            });
        } catch (err) {
            console.error("加載異常", err);
            this.state.phase = 'action';
            this.targetTimeScale = 1.0;
            this.gateApproachSpeed = 35.0 / 3.0;
        }
    }

    triggerExplosion(pos, isCorrect) {
        this.particles.position.copy(pos);
        this.particleMat.color.setHex(isCorrect ? 0x00e5ff : 0xff3366);
        this.particles.visible = true;
        
        const positions = this.particles.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i+1] = (Math.random() - 0.5) * 20;
            positions[i+2] = (Math.random() - 0.5) * 20;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;
        this.particleTime = 1.0;
    }

    resolveAnswer() {
        if(this.hitTriggered || this.state.phase === 'explaining') return;
        this.hitTriggered = true;
        this.state.phase = 'explaining'; 
        
        AudioObj.stopTTS(); 
        if(this.warn.mesh) this.warn.mesh.visible = false;
        
        const q = this.runQueue[this.state.qIndex];
        const hitSide = this.shipGroup.position.x < 0 ? 'left' : 'right';
        const isCorrect = (hitSide === 'left' && this.isCorrectOnLeft) || (hitSide === 'right' && !this.isCorrectOnLeft);
        
        const hitPos = new THREE.Vector3();
        if(hitSide === 'left') this.gateL.mesh.getWorldPosition(hitPos);
        else this.gateR.mesh.getWorldPosition(hitPos);
        hitPos.z = this.shipGroup.position.z; 

        this.triggerExplosion(hitPos, isCorrect);
        this.gateGroup.visible = false;
        this.targetFov = 85; 
        
        if(isCorrect) {
            AudioObj.playWin();
            this.state.score += (500 + this.state.loop * 100);
        } else {
            AudioObj.playLose();
            this.state.health -= 1;
            for(let i=0; i<this.healthRings.length; i++) {
                if(this.healthRings[i].visible) {
                    this.healthRings[i].visible = false;
                    break;
                }
            }
            if(this.els.dmgFlash) {
                this.els.dmgFlash.classList.add('flash-red');
                setTimeout(() => this.els.dmgFlash.classList.remove('flash-red'), 80);
            }
        }
        
        KB.save(q); 
        
        if(this.state.health <= 0) { 
            setTimeout(() => this.gameOver(), 1000); 
            return; 
        }

        const domCorrect = document.getElementById('exp-correct-text');
        const domWrong = document.getElementById('exp-wrong-text');
        if(domCorrect) domCorrect.innerText = q.expCorrect;
        if(domWrong) domWrong.innerText = q.expWrong;
        
        setTimeout(() => {
            if(this.els.expScreen) this.els.expScreen.classList.remove('hidden');
            const expChars = q.expCorrect.length + q.expWrong.length;
            const expFallbackMs = Math.max(4500, (expChars / 5) * 1000);

            AudioObj.playExplanationTTS(q.expCorrect, q.expWrong, expFallbackMs, () => {
                if(this.state.isPlaying && this.els.expScreen && !this.els.expScreen.classList.contains('hidden')) {
                    this.resumeAfterExplanation();
                }
            });
        }, 800);
    }

    resumeAfterExplanation() {
        if(this.els.expScreen) this.els.expScreen.classList.add('hidden');
        AudioObj.playWarp(); 
        this.state.qIndex++;
        this.state.baseSpeed = Math.min(400, 200 + (this.state.qIndex * 4)); 
        this.scheduleQuestion();
    }

    gameOver() {
        this.state.isPlaying = false;
        AudioObj.stopTTS();
        if(this.els.gameover) this.els.gameover.classList.remove('hidden');
        const domScore = document.getElementById('go-score');
        if(domScore) domScore.innerText = this.state.score;
    }

    loop() {
        this.rafId = requestAnimationFrame(() => this.loop());
        const dt = Math.min(this.clock.getDelta(), 0.1);
        
        if(this.state.displayScore < this.state.score) {
            this.state.displayScore += Math.ceil((this.state.score - this.state.displayScore) * 0.1);
            this.updateTexture(this.scoreHolo.tex, `同步率: ${this.state.displayScore}`, '#00e5ff', true);
        }

        const lerpFactor = 1.0 - Math.exp(-5.0 * dt);
        this.timeScale += (this.targetTimeScale - this.timeScale) * lerpFactor;
        this.camera.fov += (this.targetFov - this.camera.fov) * lerpFactor;
        this.camera.updateProjectionMatrix();

        if(this.particles.visible && this.particleTime > 0) {
            this.particleTime -= dt;
            const pos = this.particles.geometry.attributes.position.array;
            for(let i=0; i<pos.length; i+=3) { pos[i]*=1.05; pos[i+1]*=1.05; pos[i+2]*=1.05; }
            this.particles.geometry.attributes.position.needsUpdate = true;
            this.particleMat.opacity = this.particleTime;
            if(this.particleTime <= 0) this.particles.visible = false;
        }

        if (this.state.isPlaying && this.state.phase !== 'explaining') {
            const steerLerp = 1.0 - Math.exp(-12.0 * dt);
            this.shipGroup.position.x += (this.targetInputX - this.shipGroup.position.x) * steerLerp;
            
            const targetRoll = (this.shipGroup.position.x - this.targetInputX) * 0.08;
            this.shipGroup.rotation.z += (targetRoll - this.shipGroup.rotation.z) * steerLerp;
            
            this.camera.position.x = this.shipGroup.position.x * 0.35; 

            const moveDist = this.state.baseSpeed * dt * this.timeScale;
            this.grid.position.z = (this.grid.position.z + moveDist) % 50;

            const pos = this.stars.geometry.attributes.position.array;
            for(let i=2; i<pos.length; i+=3) {
                pos[i] += moveDist * 2.5; 
                if(pos[i] > 20) pos[i] -= 2000; 
            }
            this.stars.geometry.attributes.position.needsUpdate = true;
            
            this.rings.forEach(r => { 
                r.position.z += moveDist; 
                if(r.position.z > 20) r.position.z -= 1500; 
            });

            if(this.gateGroup.visible && this.state.phase === 'action') {
                const prevZ = this.gateGroup.position.z;
                this.gateGroup.position.z += this.gateApproachSpeed * dt;
                
                if(prevZ < 5 && this.gateGroup.position.z >= 5) {
                    this.resolveAnswer();
                }
            }
        }
        
        if(!this.state.isPlaying) {
            this.camera.position.x = Math.sin(Date.now() * 0.001) * 4;
            this.camera.position.y = 3 + Math.cos(Date.now() * 0.001) * 2;
            this.camera.lookAt(0,0,-20);
        } else {
            this.camera.lookAt(this.camera.position.x, 3, -100);
        }

        this.renderer.render(this.scene, this.camera);
    }
}

window.onload = () => {
    try {
        if(window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    } catch(e) {}
    window.gameEngine = new GameEngine();
};
</script>
