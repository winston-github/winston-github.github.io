<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歷史時空急流 - 完美節奏版</title>
    <style>
        :root { --primary: #00e5ff; --danger: #ff3366; --bg: #030308; --glass: rgba(10, 15, 30, 0.85); --glass-border: rgba(0,229,255,0.4); }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; position: absolute; z-index: 1; outline: none; }
        
        /* 視覺特效層 */
        #damage-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255,0,50,0.8) 100%); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.3s ease-out; }
        .flash-red { opacity: 1 !important; transition: none !important; }
        
        .ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        .pointer-auto { pointer-events: auto; }
        .hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s; }
        
        /* SVG 圖標通用設定 */
        svg { width: 1.4rem; height: 1.4rem; fill: currentColor; vertical-align: middle; margin-right: 8px; }
        
        /* 啟動與結算畫面 */
        #screen-start, #screen-gameover { position: absolute; inset: 0; background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; backdrop-filter: blur(15px); transition: opacity 0.4s ease; }
        h1 { color: var(--primary); text-shadow: 0 0 25px var(--primary); margin-bottom: 10px; font-size: clamp(2rem, 6vw, 3.5rem); text-align: center; letter-spacing: 2px; display: flex; align-items: center; justify-content: center;}
        p.subtitle { font-size: 1.15rem; color: #d0f0ff; margin-bottom: 35px; text-align: center; line-height: 1.6; padding: 0 20px; max-width: 650px;}
        
        button.btn-main { display: flex; align-items: center; justify-content: center; background: rgba(0,229,255,0.1); border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.2s; pointer-events: auto; box-shadow: 0 0 20px rgba(0,229,255,0.2); }
        button.btn-main:active { background: var(--primary); color: #000; transform: scale(0.95); box-shadow: 0 0 40px rgba(0,229,255,0.6); }
        
        /* HUD 介面 */
        #hud { padding: 20px 30px; display: flex; justify-content: space-between; align-items: flex-start; color: white; font-weight: bold; font-size: 1.2rem; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); text-shadow: 0 2px 4px black;}
        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; }
        .hud-right { align-items: flex-end; }
        
        #health-bar-bg { width: 150px; height: 14px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid rgba(255,255,255,0.4); overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00e5ff, #0088ff); transition: width 0.3s ease-out, background 0.3s; }
        .health-low { background: linear-gradient(90deg, #ff3366, #aa0000) !important; }
        
        /* 飛行中題目 UI */
        #question-ui { position: absolute; top: 12%; width: 100%; display: flex; flex-direction: column; align-items: center; color: white; opacity: 1; transition: opacity 0.3s; }
        #q-text { background: var(--glass); padding: 20px 30px; border-radius: 15px; border: 1px solid var(--glass-border); font-size: clamp(1.1rem, 4vw, 1.35rem); font-weight: bold; text-align: center; width: 85%; max-width: 750px; line-height: 1.6; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .choices-label { display: flex; width: 90%; max-width: 800px; justify-content: space-between; margin-top: 30px; font-weight: bold; font-size: 1.15rem; text-shadow: 0 2px 8px black; }
        .label-left { color: #ffcc00; text-align: left; width: 45%; line-height: 1.5; padding: 15px; background: rgba(0,0,0,0.65); border-left: 4px solid #ffcc00; border-radius: 8px;}
        .label-right { color: var(--danger); text-align: right; width: 45%; line-height: 1.5; padding: 15px; background: rgba(0,0,0,0.65); border-right: 4px solid var(--danger); border-radius: 8px;}
        
        /* 中央倒數計時器 */
        #countdown-ui { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; font-weight: 900; color: var(--primary); text-shadow: 0 0 40px var(--primary); z-index: 50; transition: transform 0.1s ease-out; opacity: 1; display:flex; justify-content:center; align-items:center;}
        
        /* 側邊控制鈕 */
        .side-controls { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 20; pointer-events: auto; }
        .btn-icon { background: rgba(0,0,0,0.8); border: 1px solid var(--primary); color: var(--primary); width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 0 15px rgba(0,0,0,0.6); }
        .btn-icon svg { margin: 0; width: 24px; height: 24px; }
        .btn-icon:active { transform: scale(0.9); background: var(--primary); color: black; }
        #btn-force-dash { border-color: #ffcc00; color: #ffcc00; }
        #btn-force-dash:active { background: #ffcc00; color: black; }
        
        /* 詳解與知識庫彈窗 */
        #explanation-screen, #kb-modal { position: absolute; inset: 0; background: rgba(5,5,12,0.95); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(12px); transition: opacity 0.3s; }
        .exp-content { background: rgba(20,30,50,0.85); width: 85%; max-width: 800px; padding: 35px 30px; border-radius: 15px; border: 1px solid #444; color: #eee; font-size: 1.15rem; line-height: 1.8; margin-bottom: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); max-height: 65vh; overflow-y: auto; scroll-behavior: smooth;}
        .exp-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid; padding-bottom: 8px; display: flex; align-items: center;}
        .correct-text { color: var(--primary); border-color: var(--primary); }
        .wrong-text { color: var(--danger); border-color: var(--danger); margin-top: 35px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .kb-item { background: rgba(0,0,0,0.6); padding: 25px; margin-bottom: 20px; border-left: 5px solid var(--primary); border-radius: 8px; font-size: 1.05rem; line-height: 1.7; color: #ddd; position: relative;}
        .kb-item .era-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,229,255,0.2); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        
        /* 語音波形指示器 */
        #tts-indicator { display: flex; gap: 4px; margin-top: 15px; align-items: flex-end; height: 24px; justify-content: center; width: 100%;}
        .bar { width: 5px; background: var(--primary); border-radius: 2px; animation: sound 0ms -800ms linear infinite alternate; transition: height 0.1s;}
        @keyframes sound { 0% { height: 4px; opacity: 0.5; } 100% { height: 24px; opacity: 1; box-shadow: 0 0 10px var(--primary); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="damage-overlay"></div>

    <div id="screen-start" class="pointer-auto">
        <h1>
            <svg viewBox="0 0 24 24" style="width:3rem;height:3rem;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            時空急流 <span>v4.0</span>
        </h1>
        <p class="subtitle">先聆聽歷史情境，獲得 3 秒思考時間，最後瞬間躍遷撞擊。<br>享受不疾不徐卻又極具張力的史詩級跑酷！</p>
        <button id="btn-start" class="btn-main">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 啟動時空引擎
        </button>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title">時間線已崩塌</h1>
        <p class="subtitle" style="margin-bottom: 10px;">歷史同步率 / 總分</p>
        <div id="go-score" style="color: var(--primary); font-size: 4rem; font-weight:900; margin-bottom: 30px;">0</div>
        <button id="btn-restart" class="btn-main">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> 重置迴圈
        </button>
    </div>

    <div class="side-controls">
        <div id="btn-force-dash" class="btn-icon hidden" title="跳過語音直接衝刺">
            <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div id="btn-kb" class="btn-icon" title="阿卡西記憶庫">
            <svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm-1 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
        </div>
        <div id="btn-mute" class="btn-icon" title="語音/音效切換">
            <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </div>
    </div>

    <!-- 知識庫彈窗 -->
    <div id="kb-modal" class="hidden">
        <h2 style="color: var(--primary); margin-bottom: 15px; font-size: 2rem; display:flex; align-items:center;">
            <svg viewBox="0 0 24 24" style="width:2.2rem; height:2.2rem;"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            阿卡西全紀錄
        </h2>
        <div class="exp-content" id="kb-list"></div>
        <div style="display:flex; gap: 20px; margin-bottom: 20px;">
            <button id="btn-close-kb" class="btn-main"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 返回</button>
            <button id="btn-clear-kb" class="btn-main" style="border-color: var(--danger); color: var(--danger);"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> 清除記憶</button>
        </div>
    </div>

    <!-- 詳解彈窗 -->
    <div id="explanation-screen" class="hidden">
        <div class="exp-content" id="exp-scroll-area">
            <div id="exp-correct-title" class="exp-title correct-text">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                【歷史正道】
            </div>
            <div id="exp-correct-text" style="margin-bottom: 25px;"></div>
            
            <div id="exp-wrong-title" class="exp-title wrong-text">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
                【平行宇宙盲點】
            </div>
            <div id="exp-wrong-text"></div>
            
            <div id="tts-indicator" class="hidden">
                <div class="bar" style="animation-duration: 0.3s;"></div>
                <div class="bar" style="animation-duration: 0.2s;"></div>
                <div class="bar" style="animation-duration: 0.5s;"></div>
                <div class="bar" style="animation-duration: 0.3s;"></div>
                <div class="bar" style="animation-duration: 0.4s;"></div>
            </div>
        </div>
        <button id="btn-skip-exp" class="btn-main">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg> 跳過並進入下個維度
        </button>
    </div>

    <!-- 遊戲中 HUD -->
    <div class="ui-layer hidden" id="ui-game">
        <div id="hud">
            <div class="hud-left">
                <span id="ui-era" style="color: var(--primary); font-size: 1.6rem; letter-spacing:1px;">加載中</span>
                <span style="font-size: 1rem; color: #aaa;">時空維度: 第 <span id="ui-loop" style="color:#fff;">1</span> 宇宙</span>
            </div>
            <div class="hud-right">
                <div style="font-size: 1.4rem; color: #fff;">評級: <span id="ui-score" style="color: #ffcc00;">0</span></div>
                <div style="display:flex; align-items:center; gap:10px; font-size: 1rem;">
                    護盾 <div id="health-bar-bg"><div id="health-bar"></div></div>
                </div>
            </div>
        </div>
        
        <div id="question-ui" class="hidden">
            <div id="q-text"></div>
            <div class="choices-label">
                <div class="label-left" id="c-left-text"></div>
                <div class="label-right" id="c-right-text"></div>
            </div>
        </div>
        
        <div id="countdown-ui" class="hidden"><span id="cd-text">3</span></div>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
// ==========================================
// 1. 50 大高質量多維度題庫庫 
// ==========================================
const BaseGameDB = [
    { era: "兩河流域", color: 0xff8855, premise: "西元前3000年的蘇美人，面臨底格里斯河氾濫，且缺乏石頭與木材。", correctOpt: "用泥土曬磚建造塔廟，並在泥板壓寫楔形文字", wrongOpt: "開鑿巨大的岩石山脈，修建地下陵墓與石窟", expCorrect: "美索不達米亞平原幾乎沒石頭，蘇美人發揮適應力，將泥土曬乾建塔廟，並在泥板壓出楔形文字", expWrong: "在泥土平原挖石頭是行不通的。開鑿岩石陵墓是古埃及文明的強項，因為埃及擁有豐富花崗岩" },
    { era: "古希臘雅典", color: 0x0088ff, premise: "西元前六世紀的雅典，面臨嚴重的貧富差距，無數平民因欠債淪為奴隸。", correctOpt: "梭倫實施解負令，廢除債務奴隸制並按財產劃分權力", wrongOpt: "實施重農抑商，沒收商人財產將人民綁在土地上", expCorrect: "梭倫廢除人身抵押債務讓平民重獲自由，挽救了雅典經濟與萌芽的民主", expWrong: "重農抑商在多山的希臘是致命的。這其實是中國商鞅變法的核心國策，利用廣大農耕腹地榨取兵源" },
    { era: "古羅馬帝國", color: 0xaa2222, premise: "羅馬帝國晚期，面臨疆域過於龐大、蠻族入侵的三世紀危機。", correctOpt: "戴克里先實施四帝共治制，將帝國劃分防區", wrongOpt: "實施分封制，將土地交給貴族世襲防守", expCorrect: "戴克里先將帝國分為東西由正副帝共治，暫時穩定了邊防與行政", expWrong: "實施分封制會讓中央集權瞬間瓦解。這是西周與歐洲中世紀缺乏官僚系統時的作法" },
    { era: "印加帝國", color: 0x228833, premise: "位於安地斯山脈的印加人，面臨崎嶇高山，且沒發明車輪與文字。", correctOpt: "修建高山驛道網，並使用結繩傳遞資訊", wrongOpt: "開鑿大運河，利用船隻在全國進行水路運輸", expCorrect: "印加人憑人力修建四萬公里路網，並發明奇普，透過結繩記錄龐大人口", expWrong: "在高山開運河違反重力！這是中國隋煬帝開鑿京杭大運河的壯舉，用來維繫大一統經濟" },
    { era: "大航海時代", color: 0x0044aa, premise: "15世紀鄂圖曼土耳其攻陷君士坦丁堡，壟斷了絲綢與香料貿易。", correctOpt: "轉向海洋，資助探險家尋找通往亞洲的新航路", wrongOpt: "實行海禁政策，禁止片板下海關閉國門", expCorrect: "面對陸路壟斷，歐洲人向未知海洋探索，達伽馬抵達印度，開啟歐洲稱霸全球的時代", expWrong: "這其實是明清時期中國的國策。中國地大物博選擇關閉國門防倭寇，卻錯失了工業革命" },

// ==========================================
// 2. 音效與無句號 TTS 陣列引擎
// ==========================================
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.ttsActive = false;
        this.currentUtterance = null;
        this.ttsIndicator = document.getElementById('tts-indicator');
        
        document.getElementById('btn-mute').addEventListener('click', () => this.toggleMute());
    }

    init() {
        if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(this.ctx.state === 'suspended') this.ctx.resume();
        if(window.speechSynthesis) {
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance('');
            u.volume = 0; window.speechSynthesis.speak(u);
        }
    }

    toggleMute() {
        this.isMuted = !this.isMuted;
        document.getElementById('icon-sound-on').classList.toggle('hidden', this.isMuted);
        document.getElementById('icon-sound-off').classList.toggle('hidden', !this.isMuted);
        if(this.isMuted) this.stopTTS();
    }

    playTone(freqs, duration, type='sine', vol=0.1) {
        if(this.isMuted || !this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        freqs.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(this.ctx.destination);
            gain.gain.setValueAtTime(0, t + i*0.05);
            gain.gain.linearRampToValueAtTime(vol, t + i*0.05 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i*0.05 + duration);
            osc.start(t + i*0.05); osc.stop(t + i*0.05 + duration);
        });
    }

    playWin() { this.playTone([523.25, 659.25, 783.99, 1046.50], 2.0, 'sine', 0.1); }
    playLose() { this.playTone([150, 100, 50], 1.5, 'sawtooth', 0.2); }
    playTick() { this.playTone([800], 0.1, 'sine', 0.05); }
    playDash() { this.playTone([1200, 1600], 0.5, 'square', 0.05); }

    // 【終極陣列唸稿機】：過濾所有標點，徹底解決「句號」Bug
    speakArray(textArray, onEndCallback) {
        this.stopTTS();
        if (this.isMuted || !window.speechSynthesis) { 
            if(onEndCallback) setTimeout(onEndCallback, 300); return; 
        }
        
        this.ttsActive = true;
        this.ttsIndicator.classList.remove('hidden');

        // 清理所有標點符號，用空格取代，確保引擎絕對不唸出標點
        const cleanTexts = textArray.map(t => t.replace(/[。！？；，,.;!?]/g, ' '));
        let currentIndex = 0;
        
        const speakNext = () => {
            if (!this.ttsActive || currentIndex >= cleanTexts.length) {
                this.stopTTS();
                if(onEndCallback) onEndCallback();
                return;
            }
            this.currentUtterance = new SpeechSynthesisUtterance(cleanTexts[currentIndex]);
            this.currentUtterance.lang = 'zh-TW'; 
            this.currentUtterance.rate = 1.25; // 節奏稍快避免拖沓
            this.currentUtterance.pitch = 1.05;
            this.currentUtterance.onend = () => { currentIndex++; speakNext(); };
            this.currentUtterance.onerror = () => { currentIndex++; speakNext(); };
            window.speechSynthesis.speak(this.currentUtterance);
        };
        speakNext();
    }

    stopTTS() {
        this.ttsActive = false;
        this.ttsIndicator.classList.add('hidden');
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        this.currentUtterance = null;
    }
}
const AudioObj = new AudioSystem();

// ==========================================
// 3. 知識庫防爆滿設計
// ==========================================
class KnowledgeBase {
    constructor() { this.records = JSON.parse(localStorage.getItem('chronos_v4_kb')) || []; }
    save(eventData) {
        if (!this.records.some(r => r.premise === eventData.premise)) {
            this.records.unshift(eventData);
            if(this.records.length > 50) this.records.pop(); 
            localStorage.setItem('chronos_v4_kb', JSON.stringify(this.records));
        }
    }
    clear() { this.records = []; localStorage.removeItem('chronos_v4_kb'); this.render(); }
    render() {
        const list = document.getElementById('kb-list');
        list.innerHTML = this.records.length === 0 ? "<p style='text-align:center;'>尚未解鎖任何歷史記憶。</p>" : "";
        this.records.forEach(r => {
            const div = document.createElement('div'); div.className = 'kb-item';
            div.innerHTML = `
                <div class="era-badge">${r.era}</div>
                <strong style="font-size:1.15rem; display:block; margin-bottom:10px; color:#fff;">情境：${r.premise}</strong>
                <span style="color:var(--primary); font-weight:bold;">✔️ 正解：${r.correctOpt}</span><br>
                <span style="color:var(--danger); font-weight:bold;">❌ 盲點：${r.wrongOpt}</span><br><br>
                <span style="color:#bbb; font-size:1rem;">${r.expCorrect}<br><br>${r.expWrong}</span>`;
            list.appendChild(div);
        });
    }
}
const KB = new KnowledgeBase();

// ==========================================
// 4. 無限平行宇宙 3D 遊戲引擎 (懸停廣播 + 倒數衝刺機制)
// ==========================================
class GameEngine {
    constructor() {
        // phase: 'reading' (朗讀) | 'countdown' (倒數) | 'dash' (衝刺) | 'transition' (過場/結算)
        this.state = { isPlaying: false, phase: 'transition', health: 100, score: 0, qIndex: 0, loop: 1 };
        this.clock = new THREE.Clock();
        this.runQueue = [];
        this.targetColor = new THREE.Color(0x030308);
        
        // 絕對平滑 Delta Drag
        this.inputX = 0; 
        this.isDragging = false;
        this.startX = 0;
        this.baseCamX = 0;
        
        this.isCorrectOnLeft = true;
        this.cdTimer = null; // 倒數計時器

        this.els = {
            start: document.getElementById('screen-start'),
            gameover: document.getElementById('screen-gameover'),
            ui: document.getElementById('ui-game'),
            qUI: document.getElementById('question-ui'),
            expScreen: document.getElementById('explanation-screen'),
            kbModal: document.getElementById('kb-modal'),
            dmgFlash: document.getElementById('damage-overlay'),
            cdUI: document.getElementById('countdown-ui'),
            cdText: document.getElementById('cd-text'),
            btnDash: document.getElementById('btn-force-dash')
        };

        this.init3D();
        this.bindEvents();
    }

    bindEvents() {
        document.getElementById('btn-start').addEventListener('click', () => { AudioObj.init(); this.start(); });
        document.getElementById('btn-restart').addEventListener('click', () => this.start());
        
        // 跳過解說進入下一題
        document.getElementById('btn-skip-exp').addEventListener('click', () => {
            if(this.state.phase !== 'transition' || !this.state.isPlaying) return;
            AudioObj.init(); 
            AudioObj.stopTTS(); 
            this.resumeAfterExplanation();
        });

        // 強制跳過語音直接衝刺按鈕
        this.els.btnDash.addEventListener('click', () => {
            if(this.state.phase === 'reading' || this.state.phase === 'countdown') {
                AudioObj.stopTTS();
                clearTimeout(this.cdTimer);
                this.els.cdUI.classList.add('hidden');
                this.startDash();
            }
        });
        
        document.getElementById('btn-kb').addEventListener('click', () => { KB.render(); this.els.kbModal.classList.remove('hidden'); });
        document.getElementById('btn-close-kb').addEventListener('click', () => this.els.kbModal.classList.add('hidden'));
        document.getElementById('btn-clear-kb').addEventListener('click', () => KB.clear());

        // 【極致滑順的相對觸控邏輯 Delta Drag】
        const startDrag = (clientX) => {
            if(!this.state.isPlaying || this.els.qUI.classList.contains('hidden')) return;
            this.isDragging = true;
            this.startX = clientX;
            this.baseCamX = this.inputX;
        };
        const moveDrag = (clientX) => {
            if(!this.isDragging) return;
            let delta = (clientX - this.startX) / window.innerWidth;
            this.inputX = this.baseCamX + (delta * 40); 
            this.inputX = Math.max(-13, Math.min(13, this.inputX)); 
        };

        window.addEventListener('touchstart', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content')) return;
            startDrag(e.touches[0].clientX);
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            if(!this.isDragging) return;
            if(!e.target.closest('.exp-content')) e.preventDefault(); 
            moveDrag(e.touches[0].clientX);
        }, {passive: false});
        window.addEventListener('touchend', () => this.isDragging = false);
        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content')) return;
            startDrag(e.clientX);
        });
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
        window.addEventListener('mouseup', () => this.isDragging = false);
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    init3D() {
        this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x030308);
        this.scene.fog = new THREE.FogExp2(0x030308, 0.003);

        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 0, 5);

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1500 * 3);
        for(let i=0; i<4500; i+=3) {
            starPos[i] = (Math.random()-0.5)*400;
            starPos[i+1] = (Math.random()-0.5)*400;
            starPos[i+2] = (Math.random()-0.5)*1000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        this.stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0.6}));
        this.scene.add(this.stars);

        this.rings = [];
        const ringGeo = new THREE.TorusGeometry(22, 0.1, 5, 24);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        for(let i=0; i<25; i++) {
            let r = new THREE.Mesh(ringGeo, ringMat);
            r.position.z = -Math.random() * 800;
            this.scene.add(r);
            this.rings.push(r);
        }

        this.sphereGeo = new THREE.SphereGeometry(3.5, 24, 24);
        this.matLeft = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent:true, opacity: 0.95 });
        this.matRight = new THREE.MeshBasicMaterial({ color: 0xff3366, transparent:true, opacity: 0.95 });
        this.sphereL = new THREE.Mesh(this.sphereGeo, this.matLeft);
        this.sphereR = new THREE.Mesh(this.sphereGeo, this.matRight);
        this.scene.add(this.sphereL); this.scene.add(this.sphereR);
        this.sphereL.visible = false; this.sphereR.visible = false;

        this.particleGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(200 * 3);
        this.particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        this.particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, transparent: true });
        this.particles = new THREE.Points(this.particleGeo, this.particleMat);
        this.particles.visible = false;
        this.scene.add(this.particles);

        this.loop();
    }

    start() {
        AudioObj.stopTTS();
        this.state = { isPlaying: true, phase: 'transition', health: 100, score: 0, qIndex: 0, loop: 1 };
        this.inputX = 0;
        this.camera.position.x = 0;
        this.generateInfiniteQueue(); 
        
        this.els.start.classList.add('hidden');
        this.els.gameover.classList.add('hidden');
        this.els.expScreen.classList.add('hidden');
        this.els.ui.classList.remove('hidden');
        
        this.updateHUD();
        this.scheduleQuestion();
    }

    generateInfiniteQueue() {
        let shuffled = JSON.parse(JSON.stringify(BaseGameDB));
        shuffled.sort(() => Math.random() - 0.5);
        if(this.state.loop > 1) {
            shuffled = shuffled.map(baseQ => {
                let pool = BaseGameDB.filter(q => q.era !== baseQ.era);
                let randomWrongQ = pool[Math.floor(Math.random() * pool.length)];
                return {
                    era: baseQ.era + " (平行宇宙)", color: baseQ.color,
                    premise: baseQ.premise, correctOpt: baseQ.correctOpt, wrongOpt: randomWrongQ.wrongOpt,
                    expCorrect: baseQ.expCorrect, expWrong: `其實這是 ${randomWrongQ.era} 的作法。` + randomWrongQ.expWrong
                };
            });
        }
        this.runQueue = shuffled;
    }

    scheduleQuestion() {
        if(this.state.qIndex >= this.runQueue.length) { 
            this.state.loop++; this.state.qIndex = 0; this.generateInfiniteQueue(); 
        }
        
        const q = this.runQueue[this.state.qIndex];
        document.getElementById('ui-era').innerText = q.era;
        document.getElementById('ui-loop').innerText = this.state.loop;
        this.targetColor.setHex(q.color);
        
        this.isCorrectOnLeft = Math.random() > 0.5; 
        const leftText = this.isCorrectOnLeft ? q.correctOpt : q.wrongOpt;
        const rightText = this.isCorrectOnLeft ? q.wrongOpt : q.correctOpt;
        
        document.getElementById('q-text').innerText = q.premise;
        document.getElementById('c-left-text').innerText = leftText;
        document.getElementById('c-right-text').innerText = rightText;
        
        // 讓星球停留在遠處「懸停」
        this.sphereL.position.set(-10, 0, -150); 
        this.sphereR.position.set(10, 0, -150);
        this.sphereL.visible = true; this.sphereR.visible = true;
        
        this.els.qUI.classList.remove('hidden');
        this.els.btnDash.classList.remove('hidden');
        this.state.phase = 'reading';

        // 播報情境與選項陣列 (完美防句號)
        AudioObj.speakArray([
            '請聽題', q.premise,
            '選項一', leftText,
            '選項二', rightText
        ], () => {
            if(this.state.phase === 'reading') this.startCountdown();
        });
    }

    // 給予 3 秒決策期
    startCountdown() {
        if(this.state.phase !== 'reading') return;
        this.state.phase = 'countdown';
        let count = 3;
        this.els.cdUI.classList.remove('hidden');
        
        const tick = () => {
            if(this.state.phase !== 'countdown') return;
            if(count > 0) {
                this.els.cdText.innerText = count;
                AudioObj.playTick();
                this.els.cdUI.style.transform = 'translate(-50%, -50%) scale(1.5)';
                setTimeout(() => this.els.cdUI.style.transform = 'translate(-50%, -50%) scale(1)', 100);
                count--;
                this.cdTimer = setTimeout(tick, 1000);
            } else {
                this.els.cdText.innerText = "躍遷!";
                this.els.cdUI.style.transform = 'translate(-50%, -50%) scale(2)';
                AudioObj.playDash();
                this.cdTimer = setTimeout(() => {
                    this.els.cdUI.classList.add('hidden');
                    this.startDash();
                }, 300);
            }
        };
        tick();
    }

    // 啟動光速衝刺
    startDash() {
        this.state.phase = 'dash';
        this.els.btnDash.classList.add('hidden');
        this.scene.fog.density = 0.003 + (this.state.loop * 0.0005); // 衝刺時迷霧變濃
    }

    triggerExplosion(pos, isCorrect) {
        this.particles.position.copy(pos);
        this.particleMat.color.setHex(isCorrect ? 0x00e5ff : 0xff3366);
        this.particles.visible = true;
        
        const positions = this.particles.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i] = (Math.random() - 0.5) * 6;
            positions[i+1] = (Math.random() - 0.5) * 6;
            positions[i+2] = (Math.random() - 0.5) * 6;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;
        this.particleTime = 0.8;
    }

    resolveAnswer() {
        if(this.state.phase !== 'dash') return;
        this.state.phase = 'transition'; 
        
        this.els.qUI.classList.add('hidden');
        const q = this.runQueue[this.state.qIndex];
        const hitSide = this.camera.position.x < 0 ? 'left' : 'right';
        const isCorrect = (hitSide === 'left' && this.isCorrectOnLeft) || (hitSide === 'right' && !this.isCorrectOnLeft);
        
        const hitPos = hitSide === 'left' ? this.sphereL.position : this.sphereR.position;
        this.triggerExplosion(hitPos, isCorrect);
        this.sphereL.visible = false; this.sphereR.visible = false;
        
        if(isCorrect) {
            AudioObj.playWin();
            this.state.score += (500 + this.state.loop * 100);
        } else {
            AudioObj.playLose();
            this.state.health = Math.max(0, this.state.health - 35);
            this.els.dmgFlash.classList.add('flash-red');
            setTimeout(() => this.els.dmgFlash.classList.remove('flash-red'), 80);
        }
        
        this.updateHUD(); KB.save(q); 
        if(this.state.health <= 0) { setTimeout(() => this.gameOver(), 800); return; }

        document.getElementById('exp-correct-text').innerText = q.expCorrect;
        document.getElementById('exp-wrong-text').innerText = q.expWrong;
        
        setTimeout(() => {
            document.getElementById('exp-scroll-area').scrollTop = 0;
            this.els.expScreen.classList.remove('hidden');
            
            AudioObj.speakArray([
                '歷史正道', q.expCorrect,
                '平行宇宙盲點', q.expWrong
            ]);
        }, 600);
    }

    updateHUD() {
        document.getElementById('ui-score').innerText = this.state.score;
        const hb = document.getElementById('health-bar');
        hb.style.width = this.state.health + '%';
        hb.classList.toggle('health-low', this.state.health <= 35);
    }

    resumeAfterExplanation() {
        this.els.expScreen.classList.add('hidden');
        AudioObj.playWarp(); 
        this.state.qIndex++;
        this.scheduleQuestion();
    }

    gameOver() {
        this.state.isPlaying = false;
        AudioObj.stopTTS();
        this.els.ui.classList.add('hidden');
        this.els.gameover.classList.remove('hidden');
        document.getElementById('go-score').innerText = this.state.score;
    }

    loop() {
        requestAnimationFrame(() => this.loop());
        const dt = Math.min(this.clock.getDelta(), 0.1);
        
        this.scene.fog.color.lerp(this.targetColor, 0.05);
        this.rings.forEach(r => r.material.color.lerp(this.targetColor, 0.05));

        if(this.particles.visible && this.particleTime > 0) {
            this.particleTime -= dt;
            const pos = this.particles.geometry.attributes.position.array;
            for(let i=0; i<pos.length; i+=3) { pos[i]*=1.06; pos[i+1]*=1.06; pos[i+2]*=1.06; }
            this.particles.geometry.attributes.position.needsUpdate = true;
            this.particleMat.opacity = this.particleTime;
            if(this.particleTime <= 0) this.particles.visible = false;
        }

        if (this.state.isPlaying) {
            // 玩家永遠可以左右移動飛船
            this.camera.position.x += (this.inputX - this.camera.position.x) * 10 * dt;
            this.camera.rotation.z = -(this.camera.position.x * 0.025);
            
            // 環境始終在前進 (給予飛行錯覺)
            let envSpeed = 100 + (this.state.loop * 10);
            let moveDist = envSpeed * dt;

            const pos = this.stars.geometry.attributes.position.array;
            for(let i=2; i<pos.length; i+=3) {
                pos[i] += moveDist * 2.0; 
                if(pos[i] > 100) pos[i] = -900;
            }
            this.stars.geometry.attributes.position.needsUpdate = true;
            this.rings.forEach(r => { r.position.z += moveDist; if(r.position.z > 20) r.position.z -= 800; });

            // 根據不同 Phase 決定星球的行為
            if (this.state.phase === 'reading' || this.state.phase === 'countdown') {
                // 懸停模式：星球在遠方微微漂浮
                this.sphereL.position.y = Math.sin(Date.now() * 0.003) * 0.5;
                this.sphereR.position.y = Math.cos(Date.now() * 0.003) * 0.5;
                this.camera.position.y = Math.sin(Date.now() * 0.002) * 0.2; // 飛船微震
            } 
            else if (this.state.phase === 'dash') {
                // 衝刺模式：星球以極高速度逼近
                let dashSpeed = 400 + (this.state.loop * 80); 
                let dashDist = dashSpeed * dt;
                
                if(this.sphereL.visible) {
                    const prevZ = this.sphereL.position.z;
                    this.sphereL.position.z += dashDist;
                    this.sphereR.position.z += dashDist;
                    
                    // 跨越 0 點立刻撞擊判定
                    if(prevZ < 0 && this.sphereL.position.z >= 0) {
                        this.resolveAnswer();
                    }
                }
            }
        }
        this.renderer.render(this.scene, this.camera);
    }
}

window.onload = () => new GameEngine();
</script>
