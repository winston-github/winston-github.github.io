<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歷史時空急流 - 專業重構版</title>
    <style>
        :root { --primary: #00ffcc; --danger: #ff3366; --bg: #0b0c10; }
        body, html { margin: 0; overflow: hidden; background: var(--bg); font-family: sans-serif; user-select: none; }
        canvas { display: block; position: absolute; z-index: 1; }
        
        /* UI 層剝離，減少與 WebGL 搶奪效能 */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        .pointer-auto { pointer-events: auto; }
        
        #screen-start, #screen-gameover { position: absolute; width: 100%; height: 100%; background: rgba(11,12,16,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
        
        h1 { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
        button { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-size: 1.5rem; border-radius: 30px; cursor: pointer; transition: 0.3s; pointer-events: auto; }
        button:hover { background: var(--primary); color: var(--bg); }
        
        #hud { padding: 20px; display: flex; justify-content: space-between; color: white; font-weight: bold; }
        #health-bar-bg { width: 150px; height: 15px; background: rgba(255,255,255,0.2); border-radius: 10px; border: 1px solid white; }
        #health-bar { width: 100%; height: 100%; background: var(--primary); transition: width 0.3s; }
        
        #question-ui { position: absolute; top: 15%; width: 100%; display: flex; flex-direction: column; align-items: center; color: white; }
        .choices { display: flex; width: 80%; max-width: 600px; justify-content: space-between; margin-top: 20px; }
        .choice-box { background: rgba(0,0,0,0.6); padding: 10px; border: 1px solid white; border-radius: 5px; width: 45%; text-align: center; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); border: 2px dashed rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        #crosshair::after { content: ''; width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%; }
        
        /* 避免操作 DOM classList 引發重繪，使用 opacity 控制特效 */
        #fx-damage { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.5) 100%); opacity: 0; z-index: 50; transition: opacity 0.2s; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="screen-start" class="pointer-auto">
        <h1>歷史時空急流 (V2)</h1>
        <p>專業重構版：物件池、防穿透物理、獨立 UI 管理器</p>
        <button id="btn-start">啟動引擎</button>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title">時間線崩塌</h1>
        <p>最終得分: <span id="go-score">0</span></p>
        <button id="btn-restart">重新挑戰</button>
    </div>

    <div class="ui-layer hidden" id="ui-game">
        <div id="hud">
            <div>紀元: <span id="ui-era">古埃及</span></div>
            <div>耐久: <div id="health-bar-bg"><div id="health-bar"></div></div></div>
            <div>分數: <span id="ui-score">0</span></div>
        </div>
        
        <div id="question-ui" class="hidden">
            <div id="q-text" style="background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--primary);">前提</div>
            <div class="choices" id="choices-container">
                <div class="choice-box" id="c-left" style="border-color: #ff9900;">⬅️ 選項1</div>
                <div class="choice-box" id="c-right" style="border-color: #ff3366;">➡️ 選項2</div>
            </div>
        </div>
    </div>

    <div id="crosshair" class="hidden"></div>
    <div id="fx-damage"></div>
    <canvas id="game-canvas"></canvas>

<script>
/**
 * ============================================================================
 * 模組 1：系統全域設定 (Configuration) - 消滅魔法數字
 * ============================================================================
 */
const CONFIG = {
    PLAYER: { MAX_HEALTH: 100, DAMAGE_PENALTY: 30, SCORE_REWARD: 500 },
    CAMERA: { SENSITIVITY_GYRO: 12, SENSITIVITY_TOUCH: 20, SMOOTHING: 5 },
    SPAWN: { Z_START: -300, Z_END: 20 }, // 物件生成與回收的 Z 軸邊界
    PHYSICS: { PLAYER_Z: 0 } // 玩家所在的 Z 軸，用於防穿透檢測
};

const GameDB = {
    eras: [
        { id: 0, name: "古埃及", color: 0xffaa00, speed: 1.0 },
        { id: 1, name: "羅馬帝國", color: 0xcccccc, speed: 1.3 }
    ],
    events: [
        { eraId: 0, type: "branch", premise: "尼羅河氾濫", left: "發展農業", right: "沙漠游牧", correct: "left" },
        { eraId: 1, type: "branch", premise: "凱撒遇刺", left: "羅馬和平", right: "屋大維崛起", correct: "right" }
    ]
};

/**
 * ============================================================================
 * 模組 2：物件池系統 (Object Pool Pattern) - 解決效能與擴展性問題
 * ============================================================================
 */
class ObjectPool {
    constructor(factoryFunc, initialSize) {
        this.factory = factoryFunc;
        this.pool = [];
        this.activeItems = [];
        for (let i = 0; i < initialSize; i++) {
            const item = this.factory();
            item.visible = false;
            this.pool.push(item);
        }
    }
    get() {
        const item = this.pool.length > 0 ? this.pool.pop() : this.factory();
        item.visible = true;
        this.activeItems.push(item);
        return item;
    }
    release(item) {
        item.visible = false;
        this.activeItems = this.activeItems.filter(i => i !== item);
        this.pool.push(item);
    }
}

/**
 * ============================================================================
 * 模組 3：UI 管理器 (UI Manager) - 抽離 DOM 操作，保持渲染純淨
 * ============================================================================
 */
class UIManager {
    constructor() {
        this.els = {
            start: document.getElementById('screen-start'),
            game: document.getElementById('ui-game'),
            gameover: document.getElementById('screen-gameover'),
            health: document.getElementById('health-bar'),
            score: document.getElementById('ui-score'),
            era: document.getElementById('ui-era'),
            qUI: document.getElementById('question-ui'),
            qText: document.getElementById('q-text'),
            cLeft: document.getElementById('c-left'),
            cRight: document.getElementById('c-right'),
            crosshair: document.getElementById('crosshair'),
            fxDamage: document.getElementById('fx-damage')
        };
    }
    
    showStart() { this.els.start.classList.remove('hidden'); this.els.gameover.classList.add('hidden'); }
    startGame() { this.els.start.classList.add('hidden'); this.els.game.classList.remove('hidden'); this.els.crosshair.classList.remove('hidden'); }
    showGameOver(score, isWin) { 
        this.els.game.classList.add('hidden'); this.els.crosshair.classList.add('hidden');
        this.els.gameover.classList.remove('hidden');
        document.getElementById('go-score').innerText = score;
        document.getElementById('go-title').innerText = isWin ? "任務成功" : "時間線崩塌";
    }
    
    updateHUD(health, score) {
        this.els.health.style.width = `${Math.max(0, health)}%`;
        this.els.health.style.background = health < 30 ? 'var(--danger)' : 'var(--primary)';
        this.els.score.innerText = score;
    }
    
    showDamageFx() {
        this.els.fxDamage.style.opacity = 1;
        setTimeout(() => this.els.fxDamage.style.opacity = 0, 300);
    }

    showQuestion(evt) {
        this.els.qUI.classList.remove('hidden');
        this.els.qText.innerText = evt.premise;
        this.els.cLeft.innerText = `⬅️ ${evt.left}`;
        this.els.cRight.innerText = `➡️ ${evt.right}`;
    }
    hideQuestion() { this.els.qUI.classList.add('hidden'); }
}

/**
 * ============================================================================
 * 模組 4：輸入管理器 (Input Manager) - 統一處理硬體差異
 * ============================================================================
 */
class InputManager {
    constructor() {
        this.targetX = 0;
        this.targetY = 2;
        this.isDragging = false;
        this.startX = 0;
        this.bindEvents();
    }

    bindEvents() {
        window.addEventListener('touchstart', (e) => { this.isDragging = true; this.startX = e.touches[0].clientX; }, {passive: true});
        window.addEventListener('touchmove', (e) => {
            if(!this.isDragging) return;
            this.targetX = ((e.touches[0].clientX - this.startX) / window.innerWidth) * CONFIG.CAMERA.SENSITIVITY_TOUCH; 
        }, {passive: true});
        window.addEventListener('touchend', () => this.isDragging = false);
        
        window.addEventListener('mousedown', (e) => { this.isDragging = true; this.startX = e.clientX; });
        window.addEventListener('mousemove', (e) => {
            if(!this.isDragging) return;
            this.targetX = ((e.clientX - this.startX) / window.innerWidth) * CONFIG.CAMERA.SENSITIVITY_TOUCH;
        });
        window.addEventListener('mouseup', () => this.isDragging = false);
    }

    requestGyro() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('deviceorientation', this.handleGyro.bind(this));
            }).catch(console.error);
        } else {
            window.addEventListener('deviceorientation', this.handleGyro.bind(this));
        }
    }

    handleGyro(e) {
        if(!e.gamma || !e.beta) return;
        let gamma = Math.max(-45, Math.min(45, e.gamma));
        this.targetX = (gamma / 45) * CONFIG.CAMERA.SENSITIVITY_GYRO; 
    }
}

/**
 * ============================================================================
 * 模組 5：場景與渲染器 (Scene Manager) - 負責 3D 世界的一切
 * ============================================================================
 */
class SceneManager {
    constructor(canvas) {
        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
        this.camera.position.set(0, 2, 0);

        this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dl = new THREE.DirectionalLight(0xffffff, 0.8);
        dl.position.set(0, 10, -10);
        this.scene.add(dl);

        this.scene.fog = new THREE.Fog(0x000000, 50, 250);
        
        // 地板網格
        this.grid = new THREE.GridHelper(100, 20, 0xffffff, 0xffffff);
        this.scene.add(this.grid);

        // 初始化物件池：柱子
        const pillarMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        this.pillarPool = new ObjectPool(() => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 20, 2), pillarMat);
            this.scene.add(mesh);
            return mesh;
        }, 40);

        // 初始化物件池：傳送門 (左右一組作為一個實體)
        const pGeo = new THREE.BoxGeometry(8, 10, 1);
        this.portalPool = new ObjectPool(() => {
            const group = new THREE.Group();
            const left = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xff9900, transparent: true, opacity: 0.5 }));
            const right = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.5 }));
            left.position.x = -6; right.position.x = 6;
            group.add(left); group.add(right);
            this.scene.add(group);
            return group;
        }, 3);

        this.initEnvironment();
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.fov = window.innerHeight > window.innerWidth ? 90 : 75;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    initEnvironment() {
        for(let i=0; i<40; i++) {
            const p = this.pillarPool.get();
            p.position.set((Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 20), 10, -Math.random() * 300);
        }
    }

    setEraStyle(eraConfig) {
        this.scene.fog.color.setHex(eraConfig.color);
        this.scene.background = new THREE.Color(eraConfig.color);
        this.grid.material.color.setHex(eraConfig.color);
        this.pillarPool.pool.forEach(p => p.material.color.setHex(eraConfig.color));
        this.pillarPool.activeItems.forEach(p => p.material.color.setHex(eraConfig.color));
    }
}

/**
 * ============================================================================
 * 模組 6：核心遊戲引擎 (Game Engine) - 狀態機與防穿透邏輯
 * ============================================================================
 */
class GameEngine {
    constructor() {
        this.ui = new UIManager();
        this.input = new InputManager();
        this.sceneMgr = new SceneManager(document.getElementById('game-canvas'));
        
        this.state = { isPlaying: false, health: 100, score: 0, eraIndex: 0 };
        this.clock = new THREE.Clock();
        this.speed = 60;
        
        this.activeEvent = null;
        this.activePortal = null;

        document.getElementById('btn-start').addEventListener('click', () => this.start());
        document.getElementById('btn-restart').addEventListener('click', () => location.reload());
        
        this.loop();
    }

    start() {
        this.input.requestGyro();
        this.ui.startGame();
        this.state = { isPlaying: true, health: CONFIG.PLAYER.MAX_HEALTH, score: 0, eraIndex: 0 };
        this.ui.updateHUD(this.state.health, this.state.score);
        this.changeEra(0);
        this.scheduleEvent();
    }

    changeEra(index) {
        if(index >= GameDB.eras.length) return this.gameOver(true);
        this.state.eraIndex = index;
        const era = GameDB.eras[index];
        this.ui.els.era.innerText = era.name;
        this.sceneMgr.setEraStyle(era);
        this.speed = 60 * era.speed;
    }

    scheduleEvent() {
        if(!this.state.isPlaying) return;
        setTimeout(() => {
            const evt = GameDB.events[this.state.eraIndex];
            if(!evt) return this.changeEra(this.state.eraIndex + 1);

            this.activeEvent = evt;
            this.activePortal = this.sceneMgr.portalPool.get();
            this.activePortal.position.set(0, 5, CONFIG.SPAWN.Z_START);
            
            // 記錄上一幀的 Z 座標，用於防穿透檢測 (Anti-Tunneling)
            this.activePortal.userData.prevZ = CONFIG.SPAWN.Z_START;
            
            this.ui.showQuestion(evt);
        }, 3000);
    }

    resolveBranch(playerX) {
        const choice = playerX < 0 ? "left" : "right";
        if (choice === this.activeEvent.correct) {
            this.state.score += CONFIG.PLAYER.SCORE_REWARD;
        } else {
            this.state.health -= CONFIG.PLAYER.DAMAGE_PENALTY;
            this.ui.showDamageFx();
        }
        
        this.ui.hideQuestion();
        this.ui.updateHUD(this.state.health, this.state.score);
        
        this.sceneMgr.portalPool.release(this.activePortal);
        this.activeEvent = null;
        this.activePortal = null;
        
        if(this.state.health <= 0) this.gameOver(false);
        else this.scheduleEvent();
    }

    gameOver(isWin) {
        this.state.isPlaying = false;
        this.ui.showGameOver(this.state.score, isWin);
    }

    loop() {
        requestAnimationFrame(() => this.loop());
        const dt = Math.min(this.clock.getDelta(), 0.1); // 限制最大 delta 避免切換分頁回來崩潰

        // 平滑相機移動 (Lerp)
        const cam = this.sceneMgr.camera;
        cam.position.x += (this.input.targetX - cam.position.x) * CONFIG.CAMERA.SMOOTHING * dt;
        cam.rotation.z = -(cam.position.x * 0.05);

        if (this.state.isPlaying) {
            const moveDist = this.speed * dt;
            
            // 軌道無限流動
            this.sceneMgr.grid.position.z += moveDist;
            if (this.sceneMgr.grid.position.z > 20) this.sceneMgr.grid.position.z -= 20;

            // 柱子回收
            this.sceneMgr.pillarPool.activeItems.forEach(p => {
                p.position.z += moveDist;
                if(p.position.z > CONFIG.SPAWN.Z_END) {
                    p.position.z = CONFIG.SPAWN.Z_START; // 重置到最遠端
                    p.position.x = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 20);
                }
            });

            // 實體碰撞檢測 (防穿透 Anti-Tunneling)
            if (this.activePortal) {
                const p = this.activePortal;
                p.userData.prevZ = p.position.z; // 記錄上一幀位置
                p.position.z += moveDist;
                
                // 穿越檢測：如果上一幀在相機前方，這一幀跑到相機後方，代表發生「穿越」！
                if (p.userData.prevZ <= CONFIG.PHYSICS.PLAYER_Z && p.position.z > CONFIG.PHYSICS.PLAYER_Z) {
                    this.resolveBranch(cam.position.x);
                }
            }
        }

        this.sceneMgr.renderer.render(this.sceneMgr.scene, cam);
    }
}

// 啟動應用程式
window.onload = () => new GameEngine();

</script>
</body>
</html>
