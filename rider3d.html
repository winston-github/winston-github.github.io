<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時空急流 - V9.3 絕對強制點火版</title>
    <style>
        :root { --primary: #00e5ff; --danger: #ff3366; --warning: #ffcc00; --bg: #030308; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; color: white;}
        canvas { display: block; position: absolute; z-index: 1; outline: none; pointer-events: auto; }
        
        #damage-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255,0,50,0.8) 100%); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.3s ease-out; }
        .flash-red { opacity: 1 !important; transition: none !important; }
        
        .pointer-auto { pointer-events: auto; }
        .hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s; }
        svg.icon { width: 1.5rem; height: 1.5rem; fill: currentColor; vertical-align: middle; }
        
        #screen-start, #screen-gameover { position: absolute; inset: 0; background: rgba(5, 10, 20, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(15px); transition: opacity 0.4s ease; }
        h1 { color: var(--primary); text-shadow: 0 0 25px var(--primary); margin-bottom: 10px; font-size: clamp(2rem, 6vw, 3.5rem); text-align: center; letter-spacing: 2px;}
        p.subtitle { font-size: 1.15rem; color: #d0f0ff; margin-bottom: 35px; text-align: center; line-height: 1.6; padding: 0 20px; max-width: 650px;}
        
        /* 加強按鈕觸控層級 */
        button.btn-main { position: relative; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(0,229,255,0.1); border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-size: 1.25rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.1s; pointer-events: auto; box-shadow: 0 0 20px rgba(0,229,255,0.2); backdrop-filter: blur(5px); }
        button.btn-main:active { background: var(--primary); color: #000; transform: scale(0.95); box-shadow: 0 0 40px rgba(0,229,255,0.6); }

        .side-controls { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; pointer-events: auto; }
        .btn-icon { background: rgba(0,0,0,0.8); border: 1px solid var(--primary); color: var(--primary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.1s; box-shadow: 0 0 15px rgba(0,0,0,0.6);}
        .btn-icon:active { transform: scale(0.9); background: var(--primary); color: black; }

        #explanation-screen, #kb-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.3s; }
        .exp-content { background: rgba(15,25,35,0.95); width: 85%; max-width: 800px; padding: 30px; border-radius: 15px; border: 1px solid #444; font-size: 1.1rem; line-height: 1.7; margin-bottom: 25px; box-shadow: 0 15px 50px rgba(0,0,0,1); max-height: 65vh; overflow-y: auto;}
        .exp-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid; padding-bottom: 8px; display: flex; align-items: center;}
        .correct-text { color: var(--primary); border-color: var(--primary); }
        .wrong-text { color: var(--danger); border-color: var(--danger); margin-top: 25px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .kb-item { background: rgba(0,0,0,0.6); padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--primary); font-size: 1rem; line-height: 1.6; border-radius: 6px;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 終極報錯系統：如果 iPad 卡死，會直接在畫面上印出紅字死因 -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = "position:absolute; top:0; left:0; width:100%; background:rgba(255,0,0,0.9); color:white; z-index:99999; padding:20px; font-size:14px; word-wrap:break-word; pointer-events:none;";
            errDiv.innerHTML = "<b>🚨 系統崩潰報告：</b><br>" + message + "<br>行號: " + lineno;
            document.body.appendChild(errDiv);
        };
    </script>

    <svg style="display: none;">
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19h16v2H4zM20 3H4v14h16zM6 5h12v2H6zm0 4h12v2H6zm0 4h8v2H6z"/></symbol>
        <symbol id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
        <symbol id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></symbol>
        <symbol id="icon-cross" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-skip" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
    </svg>

    <div id="damage-overlay"></div>

    <div id="screen-start" class="pointer-auto">
        <h1>時空急流 <span>V9.3 防呆版</span></h1>
        <p class="subtitle">【已排除 iOS 觸控死鎖】<br>雙手觸控螢幕左右，感受絲滑的物理側傾。<br>享受子彈時間的感官縮放，撞碎錯誤的歷史光門！</p>
        <!-- 加入 inline 強制啟動，雙重保險 -->
        <button id="btn-start" class="btn-main" onclick="if(window.gameEngine) window.gameEngine.start();"><svg class="icon"><use href="#icon-play"></use></svg> 點火躍遷</button>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title" style="color:var(--danger); text-shadow: 0 0 25px var(--danger);">時間線已崩塌</h1>
        <p class="subtitle">最終評級得分</p>
        <div id="go-score" style="color: var(--primary); font-size: 4rem; font-weight:900; margin-bottom: 30px;">0</div>
        <button id="btn-restart" class="btn-main" onclick="if(window.gameEngine) window.gameEngine.start();">重啟迴圈</button>
    </div>

    <div class="side-controls">
        <div id="btn-kb" class="btn-icon" title="時空記憶庫"><svg class="icon"><use href="#icon-book"></use></svg></div>
        <div id="btn-mute" class="btn-icon" title="靜音切換">
            <svg class="icon" id="icon-sound-on-svg"><use href="#icon-sound-on"></use></svg>
            <svg class="icon hidden" id="icon-sound-off-svg"><use href="#icon-sound-off"></use></svg>
        </div>
    </div>

    <div id="kb-modal" class="hidden">
        <h2 style="color: var(--primary); margin-bottom: 15px;">阿卡西全紀錄</h2>
        <div class="exp-content" id="kb-list"></div>
        <div style="display:flex; gap: 20px;">
            <button id="btn-close-kb" class="btn-main">返回待機</button>
            <button id="btn-clear-kb" class="btn-main" style="border-color: var(--danger); color: var(--danger);">清除記憶</button>
        </div>
    </div>

    <div id="explanation-screen" class="hidden">
        <div class="exp-content" id="exp-scroll-area">
            <div id="exp-correct-title" class="exp-title correct-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-check"></use></svg> 歷史正道</div>
            <div id="exp-correct-text" style="margin-bottom: 25px;"></div>
            <div id="exp-wrong-title" class="exp-title wrong-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-cross"></use></svg> 平行盲點</div>
            <div id="exp-wrong-text"></div>
        </div>
        <button id="btn-skip-exp" class="btn-main" style="border-color: #666; color: #aaa;"><svg class="icon"><use href="#icon-skip"></use></svg> 強行躍遷</button>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
// ==========================================
// 1. 80 大精編核心歷史題庫
// ==========================================
const BaseFacts = [
    { era: "商周革命", color: 0xffaa00, premise: "周武王滅商後，疆域擴大但交通不便，且商朝舊勢力仍存。", correctOpt: "實施「封建制度」，分封宗室功臣建立諸侯國防衛。", wrongOpt: "實施「郡縣制」，由中央直接指派流動官僚進行集權。", expCorrect: "西周初期缺乏強大官僚與交通，只能透過血緣分封鞏固控制。", expWrong: "郡縣制是秦朝統一天下後才具備條件實施的制度。" },

    { era: "楚漢相爭", color: 0x991111, premise: "劉邦在彭城慘敗給項羽，兵力與正面作戰能力遠不及楚軍。", correctOpt: "運用「統一戰線」拉攏韓信，並派人在敵後騷擾楚軍補給。", wrongOpt: "與項羽約定進行一對一的君王單挑來決定天下歸屬。", expCorrect: "劉邦知人善任，透過彭越游擊與韓信包抄，在垓下十面埋伏消滅項羽。", expWrong: "單挑是貴族騎士精神殘留，劉邦是實用主義者，絕不放棄戰略優勢。" },

    { era: "三國鼎立", color: 0x0088ff, premise: "赤壁之戰前夕，孫劉聯軍面對曹操號稱百萬的水陸大軍。", correctOpt: "利用長江天險與曹軍不熟水性的弱點，發動「火攻」大破敵軍。", wrongOpt: "放棄江南退守雲貴高原，利用高山地形打游擊戰。", expCorrect: "周瑜黃蓋利用東風放火，燒毀了用鐵索連環的戰船，奠定三分天下。", expWrong: "退守雲貴是南明政權末路做法。孫吳水軍強大，放棄長江等於自殺。" },
    { era: "三國蜀漢", color: 0x33aa55, premise: "諸葛亮在劉備死後，面臨蜀漢地狹人稀、國力遠不如曹魏的困境。", correctOpt: "採取「以攻代守」策略，六出祁山主動北伐以維持內部凝聚力。", wrongOpt: "全面裁軍，實施極端孤立主義，封閉劍閣不與外界往來。", expCorrect: "諸葛亮深知若不主動出擊，蜀漢遲早被魏國耗死，北伐也是政治手段。", expWrong: "全面裁軍會讓蜀漢徹底失去抵抗能力，最終輕易被魏國併吞。" },

    { era: "元朝擴張", color: 0x795548, premise: "蒙古騎兵野戰無敵，但面臨南宋防守嚴密的襄陽城等堅固堡壘。", correctOpt: "徵調阿拉伯波斯工匠，製造威力巨大的「回回砲」摧毀城牆。", wrongOpt: "強迫游牧騎兵下馬，穿上重達30公斤板甲進行步兵肉搏。", expCorrect: "蒙古帝國可怕之處在於極強吸收力，將西方重力拋石機技術用於東方攻城。", expWrong: "穿板甲步戰是歐洲騎士做法，這會徹底抹殺蒙古軍機動性。" },
    { era: "明朝海禁", color: 0x3f51b5, premise: "明初面臨東南沿海嚴重的倭寇與海盜侵擾問題。", correctOpt: "實施嚴格「海禁政策」，寸板不許下海，嚴格管制朝貢。", wrongOpt: "建立龐大無敵艦隊，主動出擊征服整個東南亞與日本。", expCorrect: "朱元璋為求穩定實施海禁壓制倭患，但使得中國錯失大航海時代。", expWrong: "明初剛驅逐蒙古，無力且無意願發動大規模跨海遠征。" },
    { era: "明末流寇", color: 0x882222, premise: "崇禎面臨西北大旱、農民軍作亂以及東北清軍逼近。", correctOpt: "因國庫空虛加派「三餉」，導致更多飢民加入叛軍。", wrongOpt: "開啟國庫大量發放黃金賑災，並與清軍簽訂和平條約。", expCorrect: "崇禎不斷加稅陷入越剿越叛的死亡螺旋，最終導致明朝滅亡。", expWrong: "明朝國庫見底，且不和親不賠款的祖訓讓崇禎不敢議和。" },
    { era: "清朝康熙", color: 0x009688, premise: "為消滅擁有強大海軍優勢的台灣鄭氏政權。", correctOpt: "實施殘酷的「遷界禁海」，強迫沿海居民內遷斷絕補給。", wrongOpt: "簽署大憲章，限制皇權並賦予沿海居民高度自治權。", expCorrect: "為困死鄭成功勢力，清廷徹底摧毀東南沿海經濟換取軍事勝利。", expWrong: "簽署大憲章限制王權是13世紀英國約翰王的妥協。" },
    { era: "清末洋務", color: 0x556677, premise: "鴉片戰爭與太平天國後，清廷體認到西方船堅炮利。", correctOpt: "推動「中學為體西學為用」的洋務運動，建立兵工廠與水師。", wrongOpt: "全面廢除漢字，改用英文為官方語言並全盤西化。", expCorrect: "洋務派引進西方技術帶來短暫同治中興，但未觸及政治體制改革。", expWrong: "全盤西化是激進派想法，洋務運動核心是維護清朝體制。" },
    { era: "古埃及", color: 0xffd54f, premise: "法老王為彰顯統治權與永生信仰，並解決農閒期勞力。", correctOpt: "動員人力修建宏偉「金字塔」陵墓，兼具國家工程賑災。", wrongOpt: "建立龐大的「兵馬俑」地下軍團來護衛死後世界。", expCorrect: "利用尼羅河氾濫農閒期僱農民修金字塔，加強國家向心力。", expWrong: "兵馬俑地下軍團是中國秦始皇打造的陵墓陪葬。" },
    { era: "兩河流域", color: 0xff8855, premise: "西元前3000年蘇美人面臨底格里斯河氾濫，缺乏石頭與木材。", correctOpt: "用泥土曬磚建造塔廟，並在泥板壓寫「楔形文字」。", wrongOpt: "開鑿巨大的岩石山脈，修建地下陵墓與石窟。", expCorrect: "美索不達米亞平原沒石頭，蘇美人發揮適應力創造泥土文明。", expWrong: "在泥土平原挖石頭行不通，開鑿岩石陵墓是古埃及專長。" },
    { era: "漢摩拉比", color: 0xff5522, premise: "古巴比倫王國疆域龐大民族眾多，需要統一法律維持秩序。", correctOpt: "頒布《漢摩拉比法典》，實施「以眼還眼」同態復仇。", wrongOpt: "實施現代的「無罪推定」原則與陪審團制度。", expCorrect: "雖然刑罰殘酷有階級差異，但這是人類最早成文法典之一。", expWrong: "無罪推定與陪審團是近代民主社會產物，古巴比倫不具備。" },
    { era: "猶太信仰", color: 0x3344aa, premise: "希伯來人流落為「巴比倫之囚」，面臨民族文化滅絕危機。", correctOpt: "編纂《舊約》，確立絕對「一神教」信仰凝聚民族認同。", wrongOpt: "全面放棄信仰，徹底融入巴比倫多神教文化體系。", expCorrect: "在苦難中猶太人堅定了唯一信仰，這是歷經千年不滅的精神支柱。", expWrong: "融入當地多神教會導致猶太民族在歷史長河中徹底消失。" },
    { era: "古希臘斯巴達", color: 0x444444, premise: "斯巴達人口極少，卻需奴役龐大農奴，面臨隨時叛亂風險。", correctOpt: "實施極端軍事化教育，男孩從小訓練成為無情戰士。", wrongOpt: "發放高額福利金與舉辦免費演唱會安撫農奴情緒。", expCorrect: "斯巴達將全國變成大軍營，以恐怖統治與絕對武力鎮壓農奴。", expWrong: "發放福利與娛樂是古羅馬帝國安撫首都平民的手段。" },
    { era: "古希臘雅典", color: 0x0088ff, premise: "西元前六世紀雅典，貧富差距嚴重，無數平民淪為奴隸。", correctOpt: "梭倫實施「解負令」，廢除債務奴隸制並按財產劃分權力。", wrongOpt: "實施「重農抑商」，沒收商人財產將人民綁在土地上。", expCorrect: "梭倫廢除人身抵押債務讓平民重獲自由，挽救雅典經濟與萌芽民主。", expWrong: "多山希臘無法重農抑商，這是中國商鞅變法國策。" },
    { era: "波斯帝國", color: 0x9c27b0, premise: "大流士一世統治橫跨歐亞非的龐大帝國，面臨各地宗教衝突。", correctOpt: "實施「寬容政策」，允許保留信仰，並修建御道加強通訊。", wrongOpt: "發動宗教裁判所，強迫所有被征服者改信拜火教。", expCorrect: "波斯帝國因寬容政策與發達驛道系統，成功維繫數百年統治。", expWrong: "強制宗教同化是歐洲中世紀異端裁判所做法，波斯相對寬容。" },
    { era: "亞歷山大", color: 0xe91e63, premise: "亞歷山大征服波斯與埃及，面臨如何統治多元文化領土。", correctOpt: "推動「東西方融合」，迎娶波斯公主鼓勵士兵與當地通婚。", wrongOpt: "將非希臘人貶為奴隸，全面銷毀波斯與埃及歷史書籍。", expCorrect: "亞歷山大以通婚與文化包容開啟「希臘化時代」，影響歐亞文明。", expWrong: "銷毀書籍與屠殺違背了亞歷山大試圖融合的宏大願景。" },
    { era: "羅馬共和國", color: 0x8b0000, premise: "在布匿戰爭中面臨迦太基名將漢尼拔的象軍與毀滅性打擊。", correctOpt: "發揮恐怖「動員能力」，全民皆兵死戰到底耗死迦太基。", wrongOpt: "花費重金雇傭高盧傭兵打仗，羅馬公民全面退居二線。", expCorrect: "羅馬最可怕武器是公民兵的韌性，慘敗也能迅速重建數個軍團。", expWrong: "依賴傭兵是迦太基做法。羅馬早期全靠公民兵捍衛國家。" },
    { era: "羅馬凱撒", color: 0xbb1133, premise: "凱撒在高盧取得巨大聲望，面臨元老院猜忌與解除兵權要求。", correctOpt: "說出「骰子已擲出」，率領軍隊越過盧比孔河進軍羅馬。", wrongOpt: "乖乖交出兵權，回到元老院接受審判並遭到流放。", expCorrect: "凱撒的決斷打破共和國禁忌，引發內戰並最終成為終身獨裁官。", expWrong: "交出兵權等於任人宰割，凱撒深知政治殘酷選擇武裝奪權。" },
    { era: "古羅馬帝國", color: 0xaa2222, premise: "帝國晚期，面臨疆域過於龐大、蠻族入侵的「三世紀危機」。", correctOpt: "戴克里先實施「四帝共治制」，將帝國劃分防區。", wrongOpt: "實施「分封制」，將土地交給貴族世襲防守。", expCorrect: "戴克里先將帝國分為東西由正副帝共治，暫時穩定邊防。", expWrong: "實施分封制會讓中央集權瞬間瓦解，這是中世紀歐洲作法。" },
    { era: "馬雅文明", color: 0x81c784, premise: "居住在熱帶雨林中，土壤貧瘠且缺乏地表河流。", correctOpt: "採用「刀耕火種」農業，依賴天然石灰岩陷穴蓄水。", wrongOpt: "依靠每年定期氾濫的巨大河流種植小麥。", expCorrect: "馬雅人焚燒林木作肥料種玉米，並利用地下水洞作為水源。", expWrong: "依靠大河定期氾濫是古埃及尼羅河的特徵。" },
    { era: "印加帝國", color: 0x228833, premise: "位於安地斯山脈，面臨崎嶇高山且沒發明車輪與文字。", correctOpt: "修建高山驛道網，並使用「奇普」(結繩)傳遞統計資訊。", wrongOpt: "開鑿大運河，利用大型船隻在全國進行水路運輸。", expCorrect: "印加人憑人力修建四萬公里路網，透過結繩記錄龐大資源。", expWrong: "在高山開運河違反重力，這是中國隋朝開鑿京杭大運河壯舉。" },
    { era: "阿茲特克", color: 0xd94436, premise: "阿茲特克帝國需要大量活人祭品，同時要威懾周邊部落。", correctOpt: "發動「花之戰」，以活捉俘虜為目標而非殺戮。", wrongOpt: "實施「屠城」，將敵對城市徹底夷為平地不留活口。", expCorrect: "透過儀式戰鬥獲取祭品，既滿足宗教需求又消耗附庸國實力。", expWrong: "屠城是蒙古帝國瓦解抵抗意志戰術。阿茲特克需要活人不宜殺光。" },
    { era: "拜占庭帝國", color: 0xc2185b, premise: "7世紀東羅馬面臨阿拉伯海軍圍攻首都君士坦丁堡的絕境。", correctOpt: "發明能在水上猛烈燃燒的秘密武器「希臘火」燒毀敵軍。", wrongOpt: "召喚海上神風(颱風)，將敵軍艦隊全部吹翻淹沒。", expCorrect: "「希臘火」是當時超級武器，成功保住了基督教世界的東方大門。", expWrong: "依靠神風摧毀敵艦是日本鎌倉幕府對抗蒙古入侵的歷史奇蹟。" },
    { era: "伊斯蘭黃金", color: 0xffb74d, premise: "8世紀阿拉伯帝國定都巴格達，統治融合多民族的龐大疆域。", correctOpt: "建立「智慧宮」，展開百年翻譯運動保存古希臘科學。", wrongOpt: "將所有異教書籍視為異端燒毀，使國家進入宗教黑暗時代。", expCorrect: "哈里發資助學者，阿拉伯人保留了希臘哲學，日後反哺歐洲文藝復興。", expWrong: "燒毀異端書籍進入封閉狀態是歐洲中世紀早期的狀況。" },
    { era: "維京時代", color: 0x4dd0e1, premise: "8世紀北歐氣候嚴寒耕地不足，但擁有優秀的造船技術。", correctOpt: "駕駛吃水淺的「龍船」沿海岸與內河對歐洲進行突襲劫掠。", wrongOpt: "耗費傾國之力，在邊境修築長達萬里的巨石防禦城牆。", expCorrect: "維京人利用龍船速度快能衝上沙灘特性，對缺乏海防的歐洲展開劫掠。", expWrong: "修築萬里長城防禦是中國歷代王朝國策。維京人是主動出擊狼群。" },
    { era: "中世紀歐洲", color: 0x5511aa, premise: "14世紀中葉，黑死病席捲全歐洲，導致高達三分之一人口死亡。", correctOpt: "勞力極度短缺使農奴獲得談判籌碼，加速封建莊園制瓦解。", wrongOpt: "實施極權「編戶齊民」，將所有人強制集中管理勞動。", expCorrect: "人口死亡讓勞力變珍貴，壓迫數百年的農奴制崩潰，為文藝復興提供勞力。", expWrong: "編戶齊民是秦漢帝國嚴密制度。中世紀歐洲無力實施集中管控。" },
    { era: "大航海時代", color: 0x0044aa, premise: "15世紀鄂圖曼土耳其攻陷君士坦丁堡，壟斷絲綢香料陸路貿易。", correctOpt: "轉向海洋，資助哥倫布與達伽馬尋找通往亞洲新航路。", wrongOpt: "實行「海禁政策」，禁止片板下海徹底關閉國門。", expCorrect: "面對陸路壟斷，歐洲人向未知海洋探索，開啟歐洲稱霸全球時代。", expWrong: "關閉國門是明清時期中國的保守國策，導致錯失世界霸權。" },
    { era: "西班牙帝國", color: 0xffa000, premise: "16世紀西班牙在美洲發現巨大銀礦，但開採需要大量人力。", correctOpt: "實施「米塔制」，殘酷壓榨當地印地安原住民挖銀礦。", wrongOpt: "研發全自動化的蒸汽挖礦機器人，實現零傷亡開採。", expCorrect: "西班牙透過血腥剝削原住民，將數萬噸白銀運回歐洲引發價格革命。", expWrong: "蒸汽機與自動化是18世紀工業革命產物，16世紀純靠血汗人力。" },
    { era: "日本戰國", color: 0xcc2255, premise: "織田信長兵力處劣勢，面臨武田家傳統無敵騎兵的威脅。", correctOpt: "引進西方火繩槍，發明防禦柵欄與「三段擊」戰術輪流射擊。", wrongOpt: "全面退守深山發動「焦土作戰」堅壁清野。", expCorrect: "長篠之戰中，織田利用現代化火器戰術，徹底粉碎舊時代武士騎兵。", expWrong: "日本領土狹小，焦土作戰只會讓自己失去補給敗亡。" },
    { era: "德川幕府", color: 0x607d8b, premise: "17世紀初德川統一天下，面臨西方傳教士與歐洲火器動搖統治。", correctOpt: "頒布「鎖國令」，僅允許荷蘭人在長崎進行有限貿易。", wrongOpt: "大力發展無敵艦隊，在全球建立龐大海外殖民地。", expCorrect: "為維持內部秩序幕府實行長達200多年鎖國，帶來和平但錯失世界大勢。", expWrong: "建立艦隊與殖民地是大英帝國做法。幕府無暇顧及海外。" },
    { era: "法國大革命", color: 0x1e88e5, premise: "18世紀末法國嚴重國債，貴族免稅，平民承擔沉重稅賦吃不飽。", correctOpt: "平民攻陷巴士底監獄，發布《人權宣言》推翻君主專制。", wrongOpt: "全國推廣種植馬鈴薯，並將全數農產出口賺取外匯。", expCorrect: "飢餓與極端不公引爆怒火，民眾推翻波旁王朝奠定近代民主基礎。", expWrong: "在饑荒時大量出口農產是導致19世紀愛爾蘭馬鈴薯大飢荒慘劇原因。" },
    { era: "美國獨立", color: 0xe91e63, premise: "18世紀北美十三州面臨英國母國「無代表權不納稅」重稅壓榨。", correctOpt: "將英國茶葉倒入波士頓港抗議，並發表《獨立宣言》武裝抗英。", wrongOpt: "發動「非暴力不合作運動」，全民靜坐罷工絕食抗議。", expCorrect: "波士頓茶黨事件點燃戰火，華盛頓領導大陸軍取得勝利建立共和國。", expWrong: "非暴力不合作運動是20世紀印度甘地對抗英國殖民的獨特和平手法。" },

class UniverseGenerator {
    static getQueue(loopCount) {
        let pool = JSON.parse(JSON.stringify(BaseFacts));
        pool.sort(function() { return Math.random() - 0.5; }); 
        if(loopCount > 1) {
            pool = pool.map(function(baseQ) {
                let otherFacts = BaseFacts.filter(function(q) { return q.era !== baseQ.era && q.correctOpt !== baseQ.correctOpt; });
                let randomWrongQ = otherFacts[Math.floor(Math.random() * otherFacts.length)];
                if(!randomWrongQ) return baseQ;
                
                // 【修復】移除展開運算子
                return Object.assign({}, baseQ, {
                    era: baseQ.era + " [異變]",
                    wrongOpt: randomWrongQ.correctOpt,
                    expWrong: "【時空錯亂】這是【" + randomWrongQ.era.replace(' (平行時空)','') + "】的做法！" + randomWrongQ.expCorrect
                });
            });
        }
        return pool;
    }
}

class AudioSystem {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.ttsActive = false;
        
        const muteBtn = document.getElementById('btn-mute');
        if (muteBtn) {
            muteBtn.addEventListener('click', () => this.toggleMute());
            muteBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.toggleMute(); }, {passive: false});
        }
    }

    init() {
        try {
            if(!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if(this.ctx.state === 'suspended') this.ctx.resume();
            if(window.speechSynthesis) {
                window.speechSynthesis.cancel();
                let u = new SpeechSynthesisUtterance(''); u.volume = 0; 
                window.speechSynthesis.speak(u);
            }
        } catch(e) { console.warn("音訊初始化受阻", e); }
    }

    toggleMute() {
        this.isMuted = !this.isMuted;
        const son = document.getElementById('icon-sound-on-svg');
        const soff = document.getElementById('icon-sound-off-svg');
        if (son && soff) {
            son.classList.toggle('hidden', this.isMuted);
            soff.classList.toggle('hidden', !this.isMuted);
        }
        if(this.isMuted) this.stopTTS();
    }

    playTone(freqs, duration, type='sine', vol=0.1) {
        if(this.isMuted || !this.ctx) return;
        try {
            if(this.ctx.state === 'suspended') this.ctx.resume();
            const t = this.ctx.currentTime;
            freqs.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain); gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0, t + i*0.05);
                gain.gain.linearRampToValueAtTime(vol, t + i*0.05 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i*0.05 + duration);
                osc.start(t + i*0.05); osc.stop(t + i*0.05 + duration);
            });
        } catch(e) {}
    }

    playWin() { this.playTone([523.25, 659.25, 783.99, 1046.50], 1.5, 'sine', 0.1); }
    playLose() { this.playTone([150, 100, 50], 1.0, 'sawtooth', 0.2); }
    playWarp() { this.playTone([800, 1200, 1600], 0.8, 'sine', 0.05); }

    playPreReading(eraRaw, qText, lText, rText, fallbackMs, onEnd) {
        this.stopTTS();
        this.ttsActive = true;
        
        if (!window.speechSynthesis || this.isMuted) {
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
            return;
        }

        const cleanEra = eraRaw.replace(/ \[(異變|平行時空)\].*/, '');
        const fullText = cleanEra + "面臨情境：" + qText + " 左方抉擇：" + lText + " 右方抉擇：" + rText;
        const parts = fullText.replace(/([。！？：])/g, "$1|").split("|").filter(s=>s.trim().length>0);

        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));

        let index = 0;
        window._ttsUtterances = [];
        
        const speakNext = () => {
            if(!this.ttsActive) return;
            if(index >= parts.length) {
                clearTimeout(this.fallbackTimer);
                if(onEnd) onEnd();
                return;
            }
            try {
                let u = new SpeechSynthesisUtterance(parts[index]);
                if(twVoice) u.voice = twVoice;
                u.rate = 1.15; u.pitch = 1.05;
                u.onend = () => { index++; speakNext(); };
                u.onerror = () => { index++; speakNext(); };
                window._ttsUtterances.push(u);
                if(window._ttsUtterances.length > 5) window._ttsUtterances.shift();
                window.speechSynthesis.speak(u);
            } catch (e) {
                index++; speakNext();
            }
        };
        setTimeout(speakNext, 50);

        this.fallbackTimer = setTimeout(() => {
            if(this.ttsActive && onEnd) { this.stopTTS(); onEnd(); }
        }, fallbackMs + 3000);
    }

    playExplanationTTS(correctText, wrongText, fallbackMs, onEnd) {
        this.stopTTS(); 
        this.ttsActive = true;
        
        if (this.isMuted || !window.speechSynthesis) { 
            this.fallbackTimer = setTimeout(() => { if(this.ttsActive && onEnd) onEnd(); }, fallbackMs);
            return; 
        }

        const rawText = "歷史正道！" + correctText + " 平行盲點！" + wrongText;
        const parts = rawText.replace(/([。！？])/g, "$1|").split("|").filter(s=>s.trim().length>0);
        
        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));
        
        let index = 0;
        window._ttsUtterances = [];
        
        const speakNext = () => {
            if(!this.ttsActive) return;
            if(index >= parts.length) {
                clearTimeout(this.fallbackTimer);
                if(onEnd) onEnd();
                return;
            }
            try {
                let u = new SpeechSynthesisUtterance(parts[index]);
                if(twVoice) u.voice = twVoice;
                u.rate = 1.15; u.pitch = 1.05;
                u.onend = () => { index++; speakNext(); };
                u.onerror = () => { index++; speakNext(); };
                window._ttsUtterances.push(u);
                if(window._ttsUtterances.length > 5) window._ttsUtterances.shift();
                window.speechSynthesis.speak(u);
            } catch (e) {
                index++; speakNext();
            }
        };
        setTimeout(speakNext, 50);

        this.fallbackTimer = setTimeout(() => {
            if(this.ttsActive && onEnd) { this.stopTTS(); onEnd(); }
        }, fallbackMs + 3000);
    }

    stopTTS() {
        this.ttsActive = false;
        clearTimeout(this.fallbackTimer);
        try { if(window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
    }
}
const AudioObj = new AudioSystem();

class KnowledgeBase {
    constructor() { try { this.records = JSON.parse(localStorage.getItem('chronos_v93_kb')) || []; } catch(e) { this.records = []; } }
    save(eventData) {
        const cleanEra = eventData.era.replace(/ \[(異變|平行時空)\].*/, '');
        if (!this.records.some(r => r.premise === eventData.premise)) {
            this.records.unshift(Object.assign({}, eventData, {era: cleanEra}));
            if(this.records.length > 100) this.records.pop();
            try { localStorage.setItem('chronos_v93_kb', JSON.stringify(this.records)); } catch(e){}
        }
    }
    clear() { this.records = []; localStorage.removeItem('chronos_v93_kb'); this.render(); }
    render() {
        const list = document.getElementById('kb-list');
        if(!list) return;
        list.innerHTML = this.records.length === 0 ? "<p style='text-align:center;'>尚未解鎖任何歷史記憶。</p>" : "";
        this.records.forEach(r => {
            const div = document.createElement('div'); div.className = 'kb-item';
            div.innerHTML = "<div style='color:var(--primary); font-weight:bold; margin-bottom:5px; font-size:1.1rem;'>" + r.era + "</div>" +
                            "<strong style='display:block; margin-bottom:10px; color:#fff;'>情境：" + r.premise + "</strong>" +
                            "<span style='color:var(--warning);'>✔️ 正解：" + r.correctOpt + "</span><br>" +
                            "<span style='color:var(--danger);'>❌ 盲點：" + r.wrongOpt + "</span>";
            list.appendChild(div);
        });
    }
}

class GameEngine {
    constructor() {
        this.state = { isPlaying: false, phase: 'explaining', health: 3, score: 0, displayScore: 0, qIndex: 0, loop: 1, baseSpeed: 200 };
        this.clock = new THREE.Clock();
        this.runQueue = [];
        this.timeScale = 1.0;
        this.targetTimeScale = 1.0;
        this.targetFov = 90;
        this.rafId = null; 
        
        // 彈簧物理參數
        this.targetInputX = 0; 
        this.isCorrectOnLeft = true;
        this.hitTriggered = false;
        this.particleTime = 0;

        this.els = {
            start: document.getElementById('screen-start'),
            gameover: document.getElementById('screen-gameover'),
            expScreen: document.getElementById('explanation-screen'),
            kbModal: document.getElementById('kb-modal'),
            dmgFlash: document.getElementById('damage-overlay')
        };

        this.init3D();
        this.bindEvents();
    }

    bindEvents() {
        // 【修復】iOS 雙重強制綁定
        const bindBtn = (id, callback) => {
            const btn = document.getElementById(id);
            if(btn) {
                const handler = (e) => {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    callback();
                };
                btn.addEventListener('click', handler);
                btn.addEventListener('touchstart', handler, {passive: false});
            }
        };

        bindBtn('btn-start', () => { 
            if(this.state.isPlaying) return;
            AudioObj.init(); 
            this.start(); 
        });

        bindBtn('btn-restart', () => { 
            if(this.els.gameover) this.els.gameover.classList.add('hidden'); 
            this.start(); 
        });
        
        bindBtn('btn-skip-exp', () => {
            if(!this.state.isPlaying || this.state.phase !== 'explaining') return;
            AudioObj.init(); AudioObj.stopTTS(); 
            this.resumeAfterExplanation();
        });
        
        bindBtn('btn-kb', () => { 
            KB.render(); 
            if(this.els.kbModal) this.els.kbModal.classList.remove('hidden'); 
        });

        bindBtn('btn-close-kb', () => { 
            if(this.els.kbModal) this.els.kbModal.classList.add('hidden'); 
        });

        bindBtn('btn-clear-kb', () => { 
            KB.clear(); 
        });

        const updateSteering = (clientX) => {
            if(!this.state.isPlaying || this.state.phase === 'explaining') return;
            const ratio = (clientX / window.innerWidth) - 0.5; 
            this.targetInputX = ratio * 32; 
        };

        window.addEventListener('touchstart', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content')) return;
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => {
            if(!e.target.closest('.exp-content')) { if(e.cancelable) e.preventDefault(); }
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content')) return;
            updateSteering(e.clientX);
        });
        window.addEventListener('mousemove', (e) => {
            if(e.buttons > 0) updateSteering(e.clientX);
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }, 100);
        });
    }

    updateTexture(tex, text, colorHex, isHUD) {
        isHUD = isHUD || false;
        try {
            const canvas = tex.image;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(!isHUD) {
                ctx.fillStyle = 'rgba(5, 10, 20, 0.85)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.strokeStyle = colorHex;
                ctx.lineWidth = 15;
                ctx.strokeRect(10, 10, canvas.width-20, canvas.height-20);
            }
            
            ctx.fillStyle = colorHex === '#ffffff' ? '#ffffff' : colorHex;
            ctx.font = isHUD ? 'bold 60px "Segoe UI", sans-serif' : 'bold 45px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = isHUD ? 15 : 30;

            const maxWidth = canvas.width - 60;
            let lines = [];
            
            const paragraphs = text.split('\n');
            for(let p=0; p<paragraphs.length; p++) {
                if(paragraphs[p] === '') { lines.push(''); continue; }
                const words = paragraphs[p].split('');
                let line = '';
                for(let i=0; i<words.length; i++) {
                    let test = line + words[i];
                    if(ctx.measureText(test).width > maxWidth && i > 0) {
                        lines.push(line);
                        line = words[i];
                    } else { line = test; }
                }
                lines.push(line);
            }

            const lh = isHUD ? 75 : 65;
            const startY = (canvas.height / 2) - ((lines.length - 1) * lh) / 2;
            for(let i=0; i<lines.length; i++) {
                ctx.fillText(lines[i], canvas.width / 2, startY + i*lh);
            }
            tex.needsUpdate = true;
        } catch (e) {
            console.warn("紋理渲染失敗", e);
        }
    }

    init3D() {
        this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true, alpha: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x030308);
        this.scene.fog = new THREE.FogExp2(0x030308, 0.0015);

        this.camera = new THREE.PerspectiveCamera(90, window.innerWidth/window.innerHeight, 0.1, 2000);
        this.camera.position.set(0, 3, 15); 
        this.scene.add(this.camera);

        const createPlaneText = (w, h, cw, ch) => {
            const cvs = document.createElement('canvas');
            cvs.width = cw; cvs.height = ch;
            const tex = new THREE.CanvasTexture(cvs);
            tex.minFilter = THREE.LinearFilter;
            const mat = new THREE.MeshBasicMaterial({map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false});
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
            return { mesh: mesh, tex: tex };
        };

        this.holo = createPlaneText(20, 10, 512, 256);
        this.holo.mesh.position.set(0, 4, -15);
        this.camera.add(this.holo.mesh);

        this.warn = createPlaneText(12, 4, 512, 128);
        this.warn.mesh.position.set(0, -5, -12);
        this.updateTexture(this.warn.tex, "⚡ 躍遷飆速！衝擊光門 ⚡", "#ff3366", true);
        this.warn.mesh.visible = false;
        this.camera.add(this.warn.mesh);

        this.scoreHolo = createPlaneText(5, 2.5, 256, 128);
        this.scoreHolo.mesh.position.set(0, 2.5, -2);
        
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i+=3) {
            starPos[i] = (Math.random()-0.5)*1000;
            starPos[i+1] = (Math.random()-0.5)*1000;
            starPos[i+2] = (Math.random()-0.5)*2000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        this.stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2, transparent: true, opacity: 0.8}));
        this.scene.add(this.stars);

        this.grid = new THREE.GridHelper(500, 50, 0x00e5ff, 0x002244);
        this.grid.position.y = -8;
        this.scene.add(this.grid);

        this.rings = [];
        const ringGeo = new THREE.TorusGeometry(40, 0.2, 8, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.15 });
        for(let i=0; i<30; i++) {
            let r = new THREE.Mesh(ringGeo, ringMat);
            r.position.z = -Math.random() * 1500;
            this.scene.add(r);
            this.rings.push(r);
        }

        this.shipGroup = new THREE.Group();
        this.shipGroup.position.set(0, -1.5, 5);
        this.scene.add(this.shipGroup);
        this.shipGroup.add(this.scoreHolo.mesh);

        const fuseGeom = new THREE.ConeGeometry(0.8, 5, 4);
        fuseGeom.rotateX(Math.PI / 2); fuseGeom.rotateZ(Math.PI / 4);
        const matDark = new THREE.MeshStandardMaterial({color: 0x111122, roughness: 0.2, metalness: 0.8});
        const fuselage = new THREE.Mesh(fuseGeom, matDark);
        
        const wingGeom = new THREE.BoxGeometry(7, 0.1, 2);
        const wings = new THREE.Mesh(wingGeom, matDark);
        wings.position.set(0, -0.2, 1);
        
        const glassGeom = new THREE.ConeGeometry(0.6, 2.5, 4);
        glassGeom.rotateX(Math.PI / 2); glassGeom.rotateZ(Math.PI / 4);
        const matGlass = new THREE.MeshStandardMaterial({color: 0x00e5ff, emissive: 0x005588, transparent: true, opacity: 0.9});
        const glass = new THREE.Mesh(glassGeom, matGlass);
        glass.position.set(0, 0.3, -0.5);

        const thrustGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.8, 16);
        thrustGeom.rotateX(Math.PI / 2);
        const matGlow = new THREE.MeshBasicMaterial({color: 0x00e5ff});
        const thrusterL = new THREE.Mesh(thrustGeom, matGlow); thrusterL.position.set(-1.8, -0.2, 2.0);
        const thrusterR = new THREE.Mesh(thrustGeom, matGlow); thrusterR.position.set(1.8, -0.2, 2.0);

        this.shipGroup.add(fuselage);
        this.shipGroup.add(wings);
        this.shipGroup.add(glass);
        this.shipGroup.add(thrusterL);
        this.shipGroup.add(thrusterR);

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(ambient);
        const pLight = new THREE.PointLight(0x00e5ff, 2, 20);
        pLight.position.set(0, 3, 5);
        this.shipGroup.add(pLight);

        this.healthRings = [];
        for(let i=0; i<3; i++) {
            let rMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.8 });
            let r = new THREE.Mesh(new THREE.TorusGeometry(3.0 + i*0.8, 0.1, 8, 32), rMat);
            r.rotation.x = Math.PI / 2;
            r.position.z = 1;
            this.shipGroup.add(r);

        }

        this.gateGroup = new THREE.Group();
        this.scene.add(this.gateGroup);
        
        this.gateL = createPlaneText(16, 12, 512, 512);
        this.gateR = createPlaneText(16, 12, 512, 512);
        
        const boxGeo = new THREE.BoxGeometry(16, 12, 2);
        const edgeGeo = new THREE.EdgesGeometry(boxGeo);
        this.gateL.mesh.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color: 0xffcc00, linewidth: 2})));
        this.gateR.mesh.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color: 0xff3366, linewidth: 2})));
        
        this.gateGroup.add(this.gateL.mesh); 
        this.gateGroup.add(this.gateR.mesh);
        this.gateGroup.visible = false;

        this.particleGeo = new THREE.BufferGeometry();
        this.baseParticlePos = new Float32Array(300 * 3);
        this.particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.baseParticlePos), 3));
        this.particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 5, transparent: true });
        this.particles = new THREE.Points(this.particleGeo, this.particleMat);
        this.particles.visible = false;
        this.scene.add(this.particles);

        this.loop();
    }

    start() {
        try {
            if(this.rafId) window.cancelAnimationFrame(this.rafId);
            AudioObj.stopTTS();
            
            this.state = { isPlaying: true, phase: 'reading', health: 3, score: 0, displayScore: 0, qIndex: 0, loop: 1, baseSpeed: 250 };
            this.targetInputX = 0;
            this.shipGroup.position.x = 0;
            this.camera.position.x = 0;
            this.healthRings.forEach(r => r.visible = true);
            
            this.runQueue = UniverseGenerator.getQueue(this.state.loop);
            
            if(this.els.start) this.els.start.classList.add('hidden');
            if(this.els.gameover) this.els.gameover.classList.add('hidden');
            if(this.els.expScreen) this.els.expScreen.classList.add('hidden');
            
            this.updateTexture(this.scoreHolo.tex, "同步率: 0", '#00e5ff', true);
            this.scheduleQuestion();
            this.loop();
        } catch(e) {
            console.error("引擎啟動異常", e);
        }
    }

    scheduleQuestion() {
        try {
            if(this.state.qIndex >= this.runQueue.length) { 
                this.state.loop++;
                this.state.qIndex = 0;
                this.runQueue = UniverseGenerator.getQueue(this.state.loop); 
            }
            
            const q = this.runQueue[this.state.qIndex];
            this.isCorrectOnLeft = Math.random() > 0.5; 
            const txtL = this.isCorrectOnLeft ? q.correctOpt : q.wrongOpt;
            const txtR = this.isCorrectOnLeft ? q.wrongOpt : q.correctOpt;

            this.updateTexture(this.holo.tex, "【第 " + this.state.loop + " 宇宙】 " + q.era.replace(/ \[.*/, '') + "\n\n" + q.premise, '#00e5ff', true);
            this.updateTexture(this.gateL.tex, txtL, '#ffcc00');
            this.updateTexture(this.gateR.tex, txtR, '#ff3366');

            this.state.phase = 'reading';
            this.timeScale = 0.2; 
            this.targetTimeScale = 0.2;
            this.targetFov = 65; 
            
            this.gateGroup.position.z = -400;
            this.gateL.mesh.position.set(-10, 2, 0); 
            this.gateR.mesh.position.set(10, 2, 0);
            this.gateGroup.visible = true;
            this.holo.mesh.visible = true;
            this.warn.mesh.visible = false;
            this.hitTriggered = false;

            const totalChars = q.era.length + q.premise.length + txtL.length + txtR.length;
            const fallbackMs = Math.max(4500, (totalChars / 5) * 1000);

            AudioObj.playPreReading(q.era, q.premise, txtL, txtR, fallbackMs, () => {
                if(!this.state.isPlaying || this.state.phase !== 'reading') return;
                
                this.state.phase = 'action';
                this.holo.mesh.visible = false;
                this.warn.mesh.visible = true;
                
                this.targetTimeScale = 1.0 + (this.state.loop * 0.1); 
                this.targetFov = 110; 
                
                const targetSpeed = this.state.baseSpeed * this.targetTimeScale;
                const impactDist = targetSpeed * 3.0; 
                this.gateGroup.position.z = 5 - impactDist;
            });
        } catch (err) {
            console.error("題目加載異常，強制啟動", err);
            this.state.phase = 'action';
            this.targetTimeScale = 1.0;
        }
    }

    triggerExplosion(pos, isCorrect) {
        this.particles.position.copy(pos);
        this.particleMat.color.setHex(isCorrect ? 0x00e5ff : 0xff3366);
        this.particles.visible = true;
        
        const positions = this.particles.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i+1] = (Math.random() - 0.5) * 20;
            positions[i+2] = (Math.random() - 0.5) * 20;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;
        this.particleTime = 1.0;
    }

    resolveAnswer() {
        if(this.hitTriggered || this.state.phase === 'explaining') return;
        this.hitTriggered = true;
        this.state.phase = 'explaining'; 
        
        AudioObj.stopTTS(); 
        if(this.warn.mesh) this.warn.mesh.visible = false;
        
        const q = this.runQueue[this.state.qIndex];
        const hitSide = this.shipGroup.position.x < 0 ? 'left' : 'right';
        const isCorrect = (hitSide === 'left' && this.isCorrectOnLeft) || (hitSide === 'right' && !this.isCorrectOnLeft);
        
        const hitPos = new THREE.Vector3();
        if(hitSide === 'left') this.gateL.mesh.getWorldPosition(hitPos);
        else this.gateR.mesh.getWorldPosition(hitPos);
        hitPos.z = this.shipGroup.position.z; 

        this.triggerExplosion(hitPos, isCorrect);
        this.gateGroup.visible = false;
        this.targetFov = 85; 
        
        if(isCorrect) {
            AudioObj.playWin();
            this.state.score += (500 + this.state.loop * 100);
        } else {
            AudioObj.playLose();
            this.state.health -= 1;
            // 相容性寫法
            for(let i=0; i<this.healthRings.length; i++) {
