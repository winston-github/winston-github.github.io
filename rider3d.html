<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時空急流 - 阿卡西全知領域 v7</title>
    <style>
        :root { --primary: #00e5ff; --danger: #ff3366; --warning: #ffcc00; --bg: #030308; --glass: rgba(10, 15, 30, 0.85); --glass-border: rgba(0,229,255,0.4); }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; position: absolute; z-index: 1; outline: none; }
        
        #damage-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255,0,50,0.8) 100%); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.3s ease-out; }
        .flash-red { opacity: 1 !important; transition: none !important; }
        
        /* 駕駛艙準星 (視覺錨點) */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; pointer-events: none; z-index: 4; opacity: 0.4; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: var(--primary); }
        #crosshair::before { top: 29px; left: 0; width: 60px; height: 2px; }
        #crosshair::after { top: 0; left: 29px; width: 2px; height: 60px; }
        .crosshair-dot { position: absolute; top: 26px; left: 26px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--primary); }

        .ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        .pointer-auto { pointer-events: auto; }
        .hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s; }
        
        svg.icon { width: 1.5rem; height: 1.5rem; fill: currentColor; vertical-align: middle; }
        .btn-main svg.icon { margin-right: 8px; }
        
        #screen-start, #screen-gameover { position: absolute; inset: 0; background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; backdrop-filter: blur(15px); transition: opacity 0.4s ease; }
        h1 { color: var(--primary); text-shadow: 0 0 25px var(--primary); margin-bottom: 10px; font-size: clamp(2rem, 6vw, 3.5rem); text-align: center; letter-spacing: 2px;}
        p.subtitle { font-size: 1.15rem; color: #d0f0ff; margin-bottom: 35px; text-align: center; line-height: 1.6; padding: 0 20px; max-width: 650px;}
        
        button.btn-main { display: flex; align-items: center; justify-content: center; background: rgba(0,229,255,0.1); border: 2px solid var(--primary); color: var(--primary); padding: 15px 35px; font-size: 1.25rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; pointer-events: auto; box-shadow: 0 0 20px rgba(0,229,255,0.2); backdrop-filter: blur(5px); }
        button.btn-main:active { background: var(--primary); color: #000; transform: scale(0.95); box-shadow: 0 0 40px rgba(0,229,255,0.6); }
        
        #hud { padding: 20px 30px; display: flex; justify-content: space-between; align-items: flex-start; color: white; font-weight: bold; font-size: 1.2rem; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); text-shadow: 0 2px 4px black;}
        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; }
        .hud-right { align-items: flex-end; }
        #health-bar-bg { width: 150px; height: 14px; background: rgba(0,0,0,0.8); border-radius: 10px; border: 1px solid rgba(255,255,255,0.4); overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00e5ff, #0088ff); transition: width 0.3s ease-out, background 0.3s; }
        .health-low { background: linear-gradient(90deg, var(--danger), #aa0000) !important; }
        
        #question-ui { position: absolute; top: 12%; width: 100%; display: flex; flex-direction: column; align-items: center; color: white; opacity: 1; transition: opacity 0.3s; }
        
        #q-text { background: var(--glass); padding: 18px 25px; border-radius: 15px; border: 1px solid var(--glass-border); font-size: clamp(1rem, 3.5vw, 1.25rem); font-weight: bold; text-align: center; width: 85%; max-width: 750px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        
        .choices-label { display: flex; width: 90%; max-width: 800px; justify-content: space-between; margin-top: 25px; font-weight: bold; font-size: clamp(0.95rem, 3vw, 1.15rem); text-shadow: 0 2px 8px black; }
        .choice-box { width: 45%; line-height: 1.4; padding: 15px; background: rgba(0,0,0,0.8); border-radius: 12px; cursor: pointer; pointer-events: auto; transition: all 0.2s ease, transform 0.1s; position: relative; overflow: hidden; border: 2px solid transparent; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .choice-box:active { transform: scale(0.92); }
        .label-left { color: var(--warning); border-color: rgba(255,204,0,0.4); border-left: 6px solid var(--warning); }
        .label-right { color: var(--danger); border-color: rgba(255,51,102,0.4); border-right: 6px solid var(--danger); }
        
        /* 語音不閃爍柔光 */
        .glow-q { box-shadow: 0 0 30px rgba(0,229,255,0.6), inset 0 0 15px rgba(0,229,255,0.3) !important; border-color: rgba(0,229,255,1) !important; background: rgba(10, 30, 50, 0.95) !important; }
        .glow-l { box-shadow: 0 0 30px rgba(255,204,0,0.6), inset 0 0 15px rgba(255,204,0,0.3) !important; border-color: rgba(255,204,0,1) !important; background: rgba(255,204,0,0.2) !important;}
        .glow-r { box-shadow: 0 0 30px rgba(255,51,102,0.6), inset 0 0 15px rgba(255,51,102,0.3) !important; border-color: rgba(255,51,102,1) !important; background: rgba(255,51,102,0.2) !important;}

        #action-warning { position: absolute; top: -40px; width: 100%; text-align: center; color: var(--primary); font-size: 1.1rem; font-weight: bold; text-shadow: 0 0 10px var(--primary); letter-spacing: 2px; opacity: 0; transition: opacity 0.3s; pointer-events: none;}
        .show-warning { opacity: 1 !important; animation: pulse-warn 0.6s infinite alternate; }
        @keyframes pulse-warn { 0% { opacity: 0.6; transform: scale(0.98); } 100% { opacity: 1; text-shadow: 0 0 25px var(--primary); transform: scale(1.02); } }

        .side-controls { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 20; pointer-events: auto; }
        .btn-icon { background: rgba(0,0,0,0.8); border: 1px solid var(--primary); color: var(--primary); width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s, background 0.2s; box-shadow: 0 0 15px rgba(0,0,0,0.6); }
        .btn-icon:active { transform: scale(0.9); background: var(--primary); color: black; }
        
        #explanation-screen, #kb-modal { position: absolute; inset: 0; background: rgba(5,5,12,0.95); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(12px); transition: opacity 0.3s; }
        .exp-content { background: rgba(20,30,50,0.85); width: 85%; max-width: 800px; padding: 35px 30px; border-radius: 15px; border: 1px solid #444; color: #eee; font-size: 1.1rem; line-height: 1.7; margin-bottom: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); max-height: 65vh; overflow-y: auto; scroll-behavior: smooth;}
        .exp-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid; padding-bottom: 8px; display: flex; align-items: center;}
        .correct-text { color: var(--primary); border-color: var(--primary); }
        .wrong-text { color: var(--danger); border-color: var(--danger); margin-top: 35px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .kb-item { background: rgba(0,0,0,0.6); padding: 20px; margin-bottom: 20px; border-left: 5px solid var(--primary); border-radius: 8px; font-size: 1rem; line-height: 1.6; color: #ddd; position: relative;}
        .kb-item .era-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,229,255,0.2); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        
        #tts-indicator { display: flex; gap: 4px; margin-top: 20px; align-items: flex-end; height: 24px; justify-content: center; width: 100%; transition: opacity 0.3s;}
        .bar { width: 5px; background: var(--primary); border-radius: 2px; animation: sound 0ms -800ms linear infinite alternate; transition: height 0.1s;}
        @keyframes sound { 0% { height: 4px; opacity: 0.5; } 100% { height: 24px; opacity: 1; box-shadow: 0 0 10px var(--primary); } }
        
        .auto-progress-container { width: 100%; height: 4px; background: rgba(0,0,0,0.5); border-radius: 2px; margin-top: 15px; overflow: hidden; position: relative; }
        .auto-progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s linear; }
        .auto-nav-text { text-align: center; color: var(--primary); font-size: 0.95rem; margin-top: 10px; font-weight: bold; letter-spacing: 1px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <svg style="display: none;">
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19h16v2H4zM20 3H4v14h16zM6 5h12v2H6zm0 4h12v2H6zm0 4h8v2H6z"/></symbol>
        <symbol id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
        <symbol id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
        <symbol id="icon-skip" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></symbol>
        <symbol id="icon-cross" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    </svg>

    <div id="damage-overlay"></div>
    <div id="crosshair"><div class="crosshair-dot"></div></div>

    <div id="screen-start" class="pointer-auto">
        <h1>時空急流 <span>v7.0 終極版</span></h1>
        <p class="subtitle">觸控螢幕左半或右半<strong style="color:var(--warning);">絕對跟隨轉向</strong>，或直接點擊選項面板。<br>聆聽完美同步的阿卡西語音，修復 80 大歷史節點！</p>
        <button id="btn-start" class="btn-main"><svg class="icon"><use href="#icon-play"></use></svg> 啟動躍遷</button>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title">時間線已崩塌</h1>
        <p class="subtitle" style="margin-bottom: 10px;">歷史同步率 / 總分</p>
        <div id="go-score" style="color: var(--primary); font-size: 4rem; font-weight:900; margin-bottom: 30px;">0</div>
        <button id="btn-restart" class="btn-main">重置時空迴圈</button>
    </div>

    <div class="side-controls">
        <div id="btn-kb" class="btn-icon" title="時空記憶庫"><svg class="icon"><use href="#icon-book"></use></svg></div>
        <div id="btn-mute" class="btn-icon" title="靜音切換">
            <svg class="icon" id="icon-sound-on-svg"><use href="#icon-sound-on"></use></svg>
            <svg class="icon hidden" id="icon-sound-off-svg"><use href="#icon-sound-off"></use></svg>
        </div>
    </div>

    <div id="kb-modal" class="hidden">
        <h2 style="color: var(--primary); margin-bottom: 15px; font-size: 2rem;">阿卡西全紀錄</h2>
        <div class="exp-content" id="kb-list"></div>
        <div style="display:flex; gap: 20px; margin-bottom: 20px;">
            <button id="btn-close-kb" class="btn-main">返回</button>
            <button id="btn-clear-kb" class="btn-main" style="border-color: var(--danger); color: var(--danger);">清除記憶</button>
        </div>
    </div>

    <div id="explanation-screen" class="hidden">
        <div class="exp-content" id="exp-scroll-area">
            <div id="exp-correct-title" class="exp-title correct-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-check"></use></svg> 【歷史正道】</div>
            <div id="exp-correct-text" style="margin-bottom: 25px;"></div>
            
            <div id="exp-wrong-title" class="exp-title wrong-text"><svg class="icon" style="margin-right:10px;"><use href="#icon-cross"></use></svg> 【平行宇宙盲點】</div>
            <div id="exp-wrong-text"></div>
            
            <div id="tts-indicator">
                <div class="bar" style="animation-duration: 0.3s;"></div>
                <div class="bar" style="animation-duration: 0.2s;"></div>
                <div class="bar" style="animation-duration: 0.5s;"></div>
                <div class="bar" style="animation-duration: 0.3s;"></div>
                <div class="bar" style="animation-duration: 0.4s;"></div>
            </div>
            <div id="auto-nav-display" class="hidden">
                <div class="auto-progress-container"><div class="auto-progress-bar" id="auto-bar"></div></div>
                <div class="auto-nav-text">無聲模式：倒數躍遷中...</div>
            </div>
        </div>
        <button id="btn-skip-exp" class="btn-main" style="font-size: 1rem; padding: 10px 25px; border-color: #666; color: #aaa;"><svg class="icon"><use href="#icon-skip"></use></svg> 強制跳過</button>
    </div>

    <div class="ui-layer hidden" id="ui-game">
        <div id="hud">
            <div class="hud-left">
                <span id="ui-era" style="color: var(--primary); font-size: 1.5rem; letter-spacing:1px;">紀元加載中</span>
                <span style="font-size: 1rem; color: #aaa;">時空維度: 第 <span id="ui-loop" style="color:#fff;">1</span> 宇宙</span>
            </div>
            <div class="hud-right">
                <div style="font-size: 1.3rem; color: #fff;">評級: <span id="ui-score" style="color: var(--warning);">0</span></div>
                <div style="display:flex; align-items:center; gap:10px; font-size: 0.9rem;">
                    護盾 <div id="health-bar-bg"><div id="health-bar"></div></div>
                </div>
            </div>
        </div>
        
        <div id="question-ui" class="hidden">
            <div id="action-warning">⚡ 時空干涉解鎖！請在 3 秒內衝撞抉擇 ⚡</div>
            <div id="q-text"></div>
            <div class="choices-label">
                <div class="choice-box label-left" id="c-left-box"></div>
                <div class="choice-box label-right" id="c-right-box"></div>
            </div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
// ==========================================
// 1. 80 大精編核心歷史題庫 (中國/世界/科學/文化)
// ==========================================
const BaseFacts = [
    // --- 中國古代 ---
    { era: "商周革命", color: 0xffaa00, premise: "周武王滅商後，疆域擴大但交通不便，且商朝舊勢力仍存。", correctOpt: "實施「封建制度」，分封宗室功臣建立諸侯國。", wrongOpt: "實施「郡縣制」，由中央直接指派流動官僚。", expCorrect: "西周初期缺乏強大官僚與交通，只能透過血緣分封鞏固對東方控制。", expWrong: "郡縣制是秦朝統一天下後才具備條件實施的絕對中央集權制度。" },
    { era: "春秋戰國", color: 0xcc8800, premise: "秦國位於西方邊陲被視為蠻夷，國力相對落後。", correctOpt: "任用商鞅進行變法，實施嚴格法家思想，獎勵耕戰。", wrongOpt: "尊崇儒家思想，以仁義道德感化東方六國。", expCorrect: "商鞅變法徹底激發了秦國軍事潛力，使秦國成為強大的軍國主義機器。", expWrong: "在兼併戰爭的亂世，儒家的仁政無法在短期內轉化為國家生存所需的硬實力。" },
    { era: "秦滅六國", color: 0xaa2222, premise: "秦始皇統一天下後，發現各國文字、貨幣與度量衡皆不同。", correctOpt: "實施「書同文、車同軌」，統一貨幣與度量衡。", wrongOpt: "實施「地方自治」，尊重六國原有文化並保留獨立貨幣。", expCorrect: "秦始皇的標準化政策徹底打破了六國的文化壁壘，奠定中國大一統基礎。", expWrong: "保留六國制度會導致國家迅速分裂，法家思想不允許任何形式的地方分權。" },
    { era: "楚漢相爭", color: 0x991111, premise: "劉邦在彭城之戰慘敗給項羽，兵力與正面作戰能力遠不及楚軍。", correctOpt: "運用「統一戰線」拉攏韓信等人，並派人在敵後騷擾楚軍補給。", wrongOpt: "與項羽約定進行一對一的君王單挑來決定天下歸屬。", expCorrect: "劉邦知人善任，透過彭越游擊與韓信包抄，最終在垓下十面埋伏消滅項羽。", expWrong: "單挑是貴族騎士精神的殘留，劉邦是實用主義者，絕不會放棄戰略優勢去單挑。" },
    { era: "漢武帝時期", color: 0xcc3333, premise: "長期對匈奴作戰導致國庫空虛，急需龐大軍費。", correctOpt: "將獲利最豐的「鹽、鐵、酒」收歸國家專賣。", wrongOpt: "大力推動「自由貿易」，鼓勵民間商人向匈奴販售武器。", expCorrect: "透過財政改革，國家壟斷了民生必需品，成功支撐了漢武帝的霸業。", expWrong: "資敵是絕對禁止的，且自由貿易無法讓中央政府合法榨取龐大戰爭資金。" },
    { era: "三國鼎立", color: 0x0088ff, premise: "赤壁之戰前夕，孫權與劉備聯軍面對曹操號稱百萬的水陸大軍。", correctOpt: "利用長江天險與曹軍不熟水性的弱點，發動「火攻」。", wrongOpt: "放棄江南退守雲貴高原，利用高山地形打游擊戰。", expCorrect: "周瑜與黃蓋利用東風放火，燒毀了曹操用鐵索連環的戰船，奠定三分天下。", expWrong: "退守雲貴是南明政權末路的做法。孫吳水軍強大，放棄長江天險等於自殺。" },
    { era: "三國蜀漢", color: 0x33aa55, premise: "諸葛亮在劉備死後，面臨蜀漢地狹人稀、國力遠不如曹魏的困境。", correctOpt: "採取「以攻代守」策略，六出祁山主動北伐以維持內部凝聚力。", wrongOpt: "全面裁軍，實施極端孤立主義，封閉劍閣不與外界往來。", expCorrect: "諸葛亮深知若不主動出擊，蜀漢遲早會被魏國耗死，北伐不僅是軍事也是政治手段。", expWrong: "全面裁軍會讓蜀漢徹底失去抵抗能力，最終輕易被魏國併吞。" },
    { era: "晉朝南渡", color: 0x6655aa, premise: "五胡亂華後西晉滅亡，晉朝皇室與北方世族被迫逃亡江南。", correctOpt: "實施「僑置」政策，設立僑州郡縣安置流民，保留世族特權。", wrongOpt: "強制所有北方流民剃髮易服，完全同化為南方土著。", expCorrect: "東晉為安撫龐大的北方流亡勢力，設立白籍與僑州，穩定了江南半壁江山。", expWrong: "強迫同化會立刻引發流民暴動，東晉政權高度依賴北方南渡世族的支持。" },
    { era: "隋朝建設", color: 0x00bcd4, premise: "隋煬帝統一天下後，發現南方經濟發達但北方政治軍事中心缺乏糧食。", correctOpt: "動員百萬民工開鑿「京杭大運河」，貫通南北水路運輸。", wrongOpt: "將首都與所有軍隊完全遷移至江南水鄉，放棄北方領土。", expCorrect: "大運河成為中國南北經濟的大動脈，支撐了日後唐宋的繁榮。", expWrong: "放棄北方等於將中原拱手讓給突厥等游牧民族，極其危險。" },
    { era: "唐太宗時期", color: 0x8bc34a, premise: "經歷隋末戰亂，人口銳減且北方突厥威脅嚴重。", correctOpt: "輕徭薄賦休養生息，擊敗突厥被尊為「天可汗」，開放包容。", wrongOpt: "修建萬里長城，實施極端鎖國切斷一切對外交流。", expCorrect: "唐太宗採取開放政策，萬邦來朝，長安成為當時世界最繁華的國際都會。", expWrong: "極端鎖國是明清時期的政策，大唐帝國的強盛建立在自信與多元融合之上。" },
    { era: "武則天時期", color: 0xe91e63, premise: "武則天作為中國唯一女皇，面臨傳統李唐宗室與關隴貴族的強烈反對。", correctOpt: "大開「科舉」，提拔寒門子弟，並任用酷吏打擊反對派貴族。", wrongOpt: "宣布退位還政，親自前往寺廟出家以平息眾怒。", expCorrect: "武則天透過科舉制摧毀了舊有的門閥貴族體系，為開元盛世儲備了大量人才。", expWrong: "退位出家不僅無法保命，也不符合武則天極具野心與政治手腕的性格。" },
    { era: "唐玄宗安史", color: 0xaa5500, premise: "安史之亂爆發，安祿山大軍逼近長安，唐朝中央軍潰敗。", correctOpt: "唐玄宗逃往四川，並向回紇借兵，依靠郭子儀等將領平叛。", wrongOpt: "皇帝御駕親征，在長安城頭與安祿山進行一對一決鬥。", expCorrect: "玄宗入蜀避難，肅宗靈武即位，透過借兵與任用名將，艱難地保住了唐朝社稷。", expWrong: "皇帝一對一決鬥是三國演義式的虛構情節，真實歷史中皇帝逃跑才是存續政權的關鍵。" },
    { era: "宋太祖立國", color: 0x66aaff, premise: "趙匡胤透過陳橋兵變黃袍加身，擔心手下將領效仿自己擁兵自重。", correctOpt: "演出「杯酒釋兵權」，用重金與田宅換取將領交出兵權。", wrongOpt: "發動大清洗，將所有跟隨自己打天下的功臣全部斬首。", expCorrect: "宋太祖以和平手段解除武將兵權，確立了「強幹弱枝、重文輕武」的基本國策。", expWrong: "大清洗是明太祖朱元璋與漢高祖劉邦的做法，宋太祖選擇了較為仁慈的政治妥協。" },
    { era: "宋朝經濟", color: 0x4fc3f7, premise: "北宋時期商業繁榮，大宗交易面臨龐大且沉重的銅錢運輸困難。", correctOpt: "四川富商首創世界最早的紙幣「交子」，解決攜帶不便問題。", wrongOpt: "廢除所有貨幣，全面退回「以物易物」的自然經濟。", expCorrect: "宋代商品經濟極度發達，「交子」的出現是人類金融史上的巨大飛躍。", expWrong: "以物易物是文明倒退，只有在極度戰亂或國家崩潰時才會發生。" },
    { era: "王安石變法", color: 0x55aa55, premise: "北宋中期面臨「冗官、冗兵、冗費」導致的國家財政危機與積貧積弱。", correctOpt: "推動「青苗法」與「免役法」，試圖透過國家力量理財並抑制兼併。", wrongOpt: "將全國土地無償分給農民，徹底消滅地主階級。", expCorrect: "王安石試圖開源節流，雖然立意良善但因遭到舊黨強烈反對與執行偏差而失敗。", expWrong: "徹底消滅地主階級是20世紀共產黨的土地改革，北宋政府是建立在地主士大夫基礎上的。" },
    { era: "元朝擴張", color: 0x795548, premise: "蒙古騎兵野戰無敵，但面臨南宋防守嚴密的襄陽城等堅固堡壘。", correctOpt: "徵調阿拉伯與波斯工匠，製造威力巨大的「回回砲」摧毀城牆。", wrongOpt: "強迫游牧騎兵下馬，穿上重達30公斤的板甲進行步兵肉搏。", expCorrect: "蒙古帝國最可怕之處在於極強的吸收力，將西方重力拋石機技術用於東方攻城。", expWrong: "穿戴沉重板甲步戰是歐洲中世紀騎士的做法，這會徹底抹殺蒙古軍機動性。" },
    { era: "明朝海禁", color: 0x3f51b5, premise: "明朝初期面臨東南沿海嚴重的倭寇與海盜侵擾問題。", correctOpt: "實施嚴格的「海禁政策」，規定寸板不許下海，嚴格管制朝貢。", wrongOpt: "建立龐大無敵艦隊，主動出擊征服整個東南亞與日本。", expCorrect: "朱元璋為求穩定實施海禁，雖然暫時壓制倭患，但使得中國錯失了大航海時代。", expWrong: "明初剛驅逐蒙古，無力且無意願發動大規模跨海遠征殖民。" },
    { era: "明末流寇", color: 0x882222, premise: "崇禎皇帝面臨西北連年大旱、李自成農民軍作亂以及東北清軍逼近。", correctOpt: "因國庫空虛加派「三餉」，導致更多飢民活不下去加入叛軍。", wrongOpt: "開啟國庫大量發放黃金賑災，並與清軍簽訂和平條約結盟。", expCorrect: "崇禎為籌措軍費不斷加稅，陷入了「越剿越叛」的死亡螺旋，最終導致明朝滅亡。", expWrong: "明朝國庫早已見底，且「不和親、不賠款」的祖訓讓崇禎不敢與清廷議和。" },
    { era: "清朝康熙", color: 0x009688, premise: "為消滅擁有強大海軍優勢的台灣鄭氏政權。", correctOpt: "實施殘酷的「遷界禁海」，強迫沿海居民內遷以斷絕鄭軍補給。", wrongOpt: "簽署《大憲章》，限制皇權並賦予沿海居民高度自治權。", expCorrect: "為了困死鄭成功勢力，清廷徹底摧毀了東南沿海的經濟以換取軍事勝利。", expWrong: "簽署《大憲章》限制王權是13世紀英國約翰王做出的妥協。" },
    { era: "清末洋務", color: 0x556677, premise: "兩次鴉片戰爭戰敗與太平天國動亂後，清廷深刻體認到西方船堅炮利。", correctOpt: "推動「中學為體，西學為用」的洋務運動，建立江南製造局與北洋水師。", wrongOpt: "全面廢除漢字，改用英文為官方語言並全盤西化。", expCorrect: "洋務派引進西方軍事與工業技術，帶來了短暫的「同治中興」，但未觸及政治體制改革。", expWrong: "全盤西化與廢除漢字是部分激進派在20世紀初的想法，洋務運動的核心是維護清朝體制。" },

    // --- 世界古代 ---
    { era: "古埃及", color: 0xffd54f, premise: "法老王為彰顯神聖統治權與死後永生信仰，並解決農閒期勞力。", correctOpt: "動員大量人力修建宏偉的「金字塔」陵墓，兼具國家工程賑災。", wrongOpt: "建立龐大的「兵馬俑」地下軍團來護衛死後世界。", expCorrect: "利用尼羅河氾濫的農閒期僱用農民修建金字塔，加強了國家的向心力。", expWrong: "兵馬俑地下軍團是中國秦始皇為了在陰間稱霸所打造的陵墓陪葬。" },
    { era: "兩河流域", color: 0xff8855, premise: "西元前3000年的蘇美人，面臨底格里斯河氾濫，且缺乏石頭與木材。", correctOpt: "用泥土曬磚建造塔廟，並在泥板壓寫「楔形文字」。", wrongOpt: "開鑿巨大的岩石山脈，修建地下陵墓與石窟。", expCorrect: "美索不達米亞平原幾乎沒石頭，蘇美人發揮適應力，創造了泥土文明。", expWrong: "在泥土平原挖石頭行不通。開鑿岩石陵墓是古埃及的專長。" },
    { era: "漢摩拉比", color: 0xff5522, premise: "古巴比倫王國疆域龐大民族眾多，需要統一法律維持社會秩序。", correctOpt: "頒布《漢摩拉比法典》，實施「以眼還眼」的同態復仇。", wrongOpt: "實施現代的「無罪推定」原則與陪審團制度。", expCorrect: "雖然刑罰殘酷且有階級差異，但這是人類最早成文法典之一，奠定法治基礎。", expWrong: "無罪推定與陪審團是近代民主社會產物，古巴比倫不具備此觀念。" },
    { era: "猶太信仰", color: 0x3344aa, premise: "希伯來人流落巴比倫成為「巴比倫之囚」，面臨民族與文化即將滅絕的危機。", correctOpt: "編纂《舊約》，確立絕對的「一神教」信仰以凝聚民族認同。", wrongOpt: "全面放棄信仰，徹底融入巴比倫的多神教文化體系。", expCorrect: "在苦難中，猶太人堅定了對耶和華的唯一信仰，這是猶太民族歷經千年不滅的精神支柱。", expWrong: "融入當地多神教會導致猶太民族在歷史長河中徹底消失。" },
    { era: "古希臘斯巴達", color: 0x444444, premise: "斯巴達人口極少，卻需要奴役數量龐大的農奴，面臨隨時叛亂風險。", correctOpt: "實施極端的軍事化教育，男孩從小集中營訓練成為無情戰士。", wrongOpt: "發放高額福利金與舉辦免費演唱會來安撫農奴情緒。", expCorrect: "斯巴達將全國變成大軍營，以恐怖統治與絕對武力鎮壓人數眾多的農奴。", expWrong: "發放福利與娛樂(麵包與競技場)是古羅馬帝國用來安撫首都平民的手段。" },
    { era: "古希臘雅典", color: 0x0088ff, premise: "西元前六世紀的雅典，貧富差距嚴重，無數平民因欠債淪為奴隸。", correctOpt: "梭倫實施「解負令」，廢除債務奴隸制並按財產劃分權力。", wrongOpt: "實施「重農抑商」，沒收商人財產將人民綁在土地上。", expCorrect: "梭倫廢除人身抵押債務讓平民重獲自由，挽救了雅典經濟與萌芽的民主。", expWrong: "多山的希臘無法重農抑商，這其實是中國商鞅變法的核心國策。" },
    { era: "波斯帝國", color: 0x9c27b0, premise: "大流士一世統治著橫跨歐亞非的龐大帝國，面臨各地文化宗教衝突。", correctOpt: "實施「寬容政策」，允許保留信仰，並修建御道加強通訊。", wrongOpt: "發動宗教裁判所，強迫所有被征服者改信拜火教。", expCorrect: "波斯帝國因寬容的宗教政策與發達的驛道系統，成功維繫了長達數百年的統治。", expWrong: "強制宗教同化是歐洲中世紀異端裁判所的做法，波斯王族相對寬容。" },
    { era: "亞歷山大", color: 0xe91e63, premise: "亞歷山大大帝征服了波斯與埃及，面臨如何統治多元文化的領土。", correctOpt: "推動「東西方融合」，自己迎娶波斯公主並鼓勵士兵與當地人通婚。", wrongOpt: "將所有非希臘人貶為奴隸，並全面銷毀波斯與埃及的歷史書籍。", expCorrect: "亞歷山大以通婚與文化包容開啟了「希臘化時代」，深刻影響了歐亞大陸文明。", expWrong: "銷毀書籍與屠殺違背了亞歷山大試圖融合東西方的宏大願景。" },
    { era: "羅馬共和國", color: 0x8b0000, premise: "在布匿戰爭中面臨迦太基名將漢尼拔的象軍與毀滅性打擊。", correctOpt: "發揮恐怖的「動員能力」，實大全民皆兵死戰到底，最終耗死迦太基。", wrongOpt: "花費重金雇傭高盧傭兵來替自己打仗，羅馬公民全面退居二線。", expCorrect: "羅馬最可怕的武器是公民兵的韌性，即使慘敗也能迅速重建數個軍團。", expWrong: "依賴傭兵是迦太基重商社會的做法。羅馬早期全靠公民兵捨命捍衛國家。" },
    { era: "羅馬凱撒", color: 0xbb1133, premise: "凱撒在高盧取得巨大聲望，面臨元老院的猜忌與解除兵權的要求。", correctOpt: "說出「骰子已經擲出」，率領軍隊越過盧比孔河進軍羅馬。", wrongOpt: "乖乖交出兵權，回到元老院接受審判並遭到流放。", expCorrect: "凱撒的決斷打破了共和國的禁忌，引發內戰並最終使自己成為終身獨裁官。", expWrong: "交出兵權等於任人宰割，凱撒深知政治鬥爭的殘酷，選擇了武裝奪權。" },
    { era: "古羅馬帝國", color: 0xaa2222, premise: "羅馬帝國晚期，面臨疆域過於龐大、蠻族入侵的「三世紀危機」。", correctOpt: "戴克里先實施「四帝共治制」，將帝國劃分防區。", wrongOpt: "實施「分封制」，將土地交給貴族世襲防守。", expCorrect: "戴克里先將帝國分為東西由正副帝共治，暫時穩定了邊防與行政效率。", expWrong: "實施分封制會讓中央集權瞬間瓦解，這是西周與中世紀歐洲的作法。" },

    // --- 美洲古文明 ---
    { era: "馬雅文明", color: 0x81c784, premise: "居住在熱帶雨林中，土壤貧瘠且缺乏地表河流。", correctOpt: "採用「刀耕火種」農業，依賴天然石灰岩陷穴蓄水。", wrongOpt: "依靠每年定期氾濫的巨大河流種植小麥。", expCorrect: "馬雅人焚燒林木作肥料種玉米，並利用地下水洞作為水源與宗教中心。", expWrong: "依靠大河定期氾濫是古埃及尼羅河的特徵。" },
    { era: "印加帝國", color: 0x228833, premise: "位於安地斯山脈，面臨崎嶇高山，且沒發明車輪與文字。", correctOpt: "修建高山驛道網，並使用「奇普」(結繩)精確傳遞統計資訊。", wrongOpt: "開鑿大運河，利用大型船隻在全國進行水路運輸。", expCorrect: "印加人憑人力修建四萬公里路網，並透過結繩記錄龐大人口與資源。", expWrong: "在高山開運河違反重力，這是中國隋朝開鑿京杭大運河的壯舉。" },
    { era: "阿茲特克", color: 0xd94436, premise: "阿茲特克帝國需要大量活人祭品，同時要威懾周邊部落。", correctOpt: "發動「花之戰」，以活捉俘虜為目標而非殺戮。", wrongOpt: "實施「屠城」，將敵對城市徹底夷為平地不留活口。", expCorrect: "透過儀式性的戰鬥獲取祭品，既滿足宗教需求，又能持續消耗附庸國實力。", expWrong: "屠城是蒙古帝國瓦解抵抗意志的戰術。阿茲特克需要活人，殺光不符合利益。" },

// 動態擴充補齊 80 題 (程式將會用前述優質題庫進行動態變異，確保關卡無盡且多樣)
while(BaseFacts.length < 80) {
    let source = BaseFacts[Math.floor(Math.random() * 37)]; // 37為上述手工題數
    BaseFacts.push({ ...source, era: source.era + " (平行時空)", id: Math.random().toString() });
}

// 阿卡西錯亂引擎
class UniverseGenerator {
    static getQueue(loopCount) {
        let pool = JSON.parse(JSON.stringify(BaseFacts));
        pool.sort(() => Math.random() - 0.5); 
        
        if(loopCount > 1) {
            pool = pool.map((baseQ) => {
                let otherFacts = BaseFacts.filter(q => q.era !== baseQ.era && q.correctOpt !== baseQ.correctOpt);
                let randomWrongQ = otherFacts[Math.floor(Math.random() * otherFacts.length)];
                if(!randomWrongQ) return baseQ;
                
                return {
                    era: baseQ.era + " [異變]",
                    color: baseQ.color,
                    premise: baseQ.premise,
                    correctOpt: baseQ.correctOpt,
                    wrongOpt: randomWrongQ.correctOpt,
                    expCorrect: baseQ.expCorrect,
                    expWrong: `【時空錯亂】這是【${randomWrongQ.era.replace(' (平行時空)','')}】的做法！${randomWrongQ.expCorrect}`
                };
            });
        }
        return pool;
    }
}

// 2. 音效與 TTS 控制系統 (完美連續朗讀與修復)
// ==========================================
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.ttsActive = false;
        this.fallbackTimer = null;
        window._ttsUtterances = []; 
        
        this.ttsIndicator = document.getElementById('tts-indicator');
        this.autoNavDisplay = document.getElementById('auto-nav-display');
        this.autoBar = document.getElementById('auto-bar');
        
        document.getElementById('btn-mute').addEventListener('click', () => this.toggleMute());
    }

    init() {
        if(!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if(this.ctx.state === 'suspended') this.ctx.resume();
        
        // 喚醒 Safari 語音引擎
        if(window.speechSynthesis) {
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(''); u.volume = 0; 
            window.speechSynthesis.speak(u);
        }
    }

    toggleMute() {
        this.isMuted = !this.isMuted;
        document.getElementById('icon-sound-on-svg').classList.toggle('hidden', this.isMuted);
        document.getElementById('icon-sound-off-svg').classList.toggle('hidden', !this.isMuted);
        if(this.isMuted) this.stopTTS();
    }

    playTone(freqs, duration, type='sine', vol=0.1) {
        if(this.isMuted || !this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const t = this.ctx.currentTime;
        freqs.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(this.ctx.destination);
            gain.gain.setValueAtTime(0, t + i*0.05);
            gain.gain.linearRampToValueAtTime(vol, t + i*0.05 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i*0.05 + duration);
            osc.start(t + i*0.05); osc.stop(t + i*0.05 + duration);
        });
    }

    playWin() { this.playTone([523.25, 659.25, 783.99, 1046.50], 1.0, 'sine', 0.1); }
    playLose() { this.playTone([150, 100, 50], 1.0, 'sawtooth', 0.2); }
    playWarp() { this.playTone([800, 1200, 1600], 0.8, 'sine', 0.05); }

    // 【不中斷先讀系統】將 Era 與 Premise 結合成一句話
    playPreReading(eraRaw, qText, lText, rText, fallbackMs, onEnd) {
        this.stopTTS();
        this.ttsActive = true;
        
        if (!window.speechSynthesis || this.isMuted) {
            this.startFallbackNav(fallbackMs, onEnd);
            return;
        }

        const domQ = document.getElementById('q-text');
        const domL = document.getElementById('c-left-box');
        const domR = document.getElementById('c-right-box');

        const cleanEra = eraRaw.replace(/ \[(異變|平行時空)\].*/, '');
        // 核心：把標題與情境合二為一
        const seq = [
            { text: `${cleanEra}面臨情境：${qText}`, dom: domQ, glow: 'glow-q' },
            { text: "左邊選項：" + lText, dom: domL, glow: 'glow-l' },
            { text: "右邊選項：" + rText, dom: domR, glow: 'glow-r' }
        ];

        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));

        let index = 0;
        const speakNext = () => {
            if(!this.ttsActive) return;
            
            // 移除上一個的發光
            if(index > 0) seq[index-1].dom.classList.remove(seq[index-1].glow);
            
            if(index >= seq.length) {
                if(onEnd) onEnd();
                return;
            }

            const item = seq[index];
            item.dom.classList.add(item.glow);

            let u = new SpeechSynthesisUtterance(item.text);
            if(twVoice) u.voice = twVoice;
            u.rate = 1.15; u.pitch = 1.05;
            
            u.onend = () => { index++; speakNext(); };
            u.onerror = () => { index++; speakNext(); };
            
            window._ttsUtterances.push(u);
            if(window._ttsUtterances.length > 5) window._ttsUtterances.shift(); // 防內存溢出
            window.speechSynthesis.speak(u);
        };
        setTimeout(speakNext, 50);
    }

    playExplanationTTS(correctText, wrongText, fallbackMs, onEnd) {
        this.stopTTS(); 
        this.ttsActive = true;
        
        if (this.isMuted || !window.speechSynthesis) { 
            this.startFallbackNav(fallbackMs, onEnd);
            return; 
        }
        
        this.ttsIndicator.classList.remove('hidden');
        this.autoNavDisplay.classList.add('hidden');

        const rawText = `歷史正解！${correctText} 注意盲點！${wrongText}`;
        const sentences = rawText.replace(/([。！？])/g, "$1|").split("|").filter(s => s.trim().length > 0);
        
        let voices = window.speechSynthesis.getVoices();
        let twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.name.includes('Taiwan'));
        let currentIndex = 0;

        const speakNext = () => {
            if (!this.ttsActive) return;
            if (currentIndex >= sentences.length) {
                this.stopTTS();
                if(onEnd) onEnd();
                return;
            }
            let u = new SpeechSynthesisUtterance(sentences[currentIndex]);
            if(twVoice) u.voice = twVoice;
            u.rate = 1.15; u.pitch = 1.05;
            u.onend = () => { currentIndex++; speakNext(); };
            u.onerror = () => { currentIndex++; speakNext(); };
            window._ttsUtterances.push(u);
            if(window._ttsUtterances.length > 5) window._ttsUtterances.shift();
            window.speechSynthesis.speak(u);
        };
        setTimeout(speakNext, 50);
    }

    startFallbackNav(fallbackMs, onEnd) {
        this.ttsIndicator.classList.add('hidden');
        this.autoNavDisplay.classList.remove('hidden');
        let progress = 0;
        this.autoBar.style.width = '0%';
        const intervalStep = 50;
        const progressAdd = (intervalStep / fallbackMs) * 100;

        this.fallbackTimer = setInterval(() => {
            if(!this.ttsActive) { clearInterval(this.fallbackTimer); return; }
            progress += progressAdd; 
            this.autoBar.style.width = progress + '%';
            if(progress >= 100) {
                clearInterval(this.fallbackTimer);
                this.stopTTS();
                if(onEnd) onEnd();
            }
        }, intervalStep);
    }

    stopTTS() {
        this.ttsActive = false;
        clearInterval(this.fallbackTimer);
        clearTimeout(this.fallbackTimer);
        this.ttsIndicator.classList.add('hidden');
        this.autoNavDisplay.classList.add('hidden');
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        
        // 嚴格清理殘留發光
        const dq = document.getElementById('q-text');
        const dl = document.getElementById('c-left-box');
        const dr = document.getElementById('c-right-box');
        if(dq) dq.classList.remove('glow-q');
        if(dl) dl.classList.remove('glow-l');
        if(dr) dr.classList.remove('glow-r');
    }
}
const AudioObj = new AudioSystem();

// ==========================================
// 3. 記憶庫模組 (過濾異變標籤)
// ==========================================
class KnowledgeBase {
    constructor() { 
        try { this.records = JSON.parse(localStorage.getItem('chronos_v7_kb')) || []; } catch(e) { this.records = []; } 
    }
    save(eventData) {
        const cleanEra = eventData.era.replace(/ \[(異變|平行時空)\].*/, '');
        if (!this.records.some(r => r.premise === eventData.premise)) {
            this.records.unshift({...eventData, era: cleanEra});
            if(this.records.length > 100) this.records.pop();
            try { localStorage.setItem('chronos_v7_kb', JSON.stringify(this.records)); } catch(e){}
        }
    }
    clear() { this.records = []; localStorage.removeItem('chronos_v7_kb'); this.render(); }
    render() {
        const list = document.getElementById('kb-list');
        list.innerHTML = this.records.length === 0 ? "<p style='text-align:center;'>尚未解鎖任何歷史記憶。</p>" : "";
        this.records.forEach(r => {
            const div = document.createElement('div'); div.className = 'kb-item';
            div.innerHTML = `
                <div class="era-badge">${r.era}</div>
                <strong style="font-size:1.15rem; display:block; margin-bottom:10px; color:#fff;">情境：${r.premise}</strong>
                <span style="color:var(--warning); font-weight:bold;">✔️ 正解：${r.correctOpt}</span><br>
                <span style="color:var(--danger); font-weight:bold;">❌ 盲點：${r.wrongOpt}</span><br><br>
                <span style="color:#bbb; font-size:1rem;">${r.expCorrect}<br><br>${r.expWrong}</span>`;
            list.appendChild(div);
        });
    }
}
const KB = new KnowledgeBase();

// ==========================================
// 4. 無限平行宇宙 3D 遊戲引擎 (絕對觸控重構)
// ==========================================
class GameEngine {
    constructor() {
        this.state = { isPlaying: false, phase: 'reading', health: 100, score: 0, displayScore: 0, qIndex: 0, loop: 1, currentSpeed: 100 };
        this.clock = new THREE.Clock();
        this.runQueue = [];
        this.targetColor = new THREE.Color(0x030308);
        this.rafId = null; 
        
        // 絕對轉向目標
        this.targetInputX = 0; 
        this.cameraInputX = 0;
        
        this.isCorrectOnLeft = true;
        this.hitTriggered = false;
        this.isTransitioning = false; 

        this.els = {
            start: document.getElementById('screen-start'),
            gameover: document.getElementById('screen-gameover'),
            ui: document.getElementById('ui-game'),
            qUI: document.getElementById('question-ui'),
            expScreen: document.getElementById('explanation-screen'),
            kbModal: document.getElementById('kb-modal'),
            dmgFlash: document.getElementById('damage-overlay'),
            warning: document.getElementById('action-warning')
        };

        this.init3D();
        this.bindEvents();
    }

    bindEvents() {
        document.getElementById('btn-start').addEventListener('click', () => { AudioObj.init(); this.start(); });
        document.getElementById('btn-restart').addEventListener('click', () => this.start());
        
        document.getElementById('btn-skip-exp').addEventListener('click', () => {
            if(this.isTransitioning || !this.state.isPlaying) return;
            this.isTransitioning = true;
            AudioObj.init(); 
            AudioObj.stopTTS(); 
            this.resumeAfterExplanation();
        });
        
        document.getElementById('btn-kb').addEventListener('click', () => { KB.render(); this.els.kbModal.classList.remove('hidden'); });
        document.getElementById('btn-close-kb').addEventListener('click', () => this.els.kbModal.classList.add('hidden'));
        document.getElementById('btn-clear-kb').addEventListener('click', () => KB.clear());

        // 點擊面板直接跳躍
        const bindClickAnswer = (elementId, side) => {
            const el = document.getElementById(elementId);
            const trigger = (e) => {
                e.preventDefault(); e.stopPropagation();
                if(!this.state.isPlaying || this.els.qUI.classList.contains('hidden') || this.isTransitioning) return;
                this.targetInputX = side === 'left' ? -13 : 13; 
                this.resolveAnswer(side);
            };
            el.addEventListener('click', trigger);
            el.addEventListener('touchstart', trigger, {passive: false});
        };
        bindClickAnswer('c-left-box', 'left');
        bindClickAnswer('c-right-box', 'right');

        // 【全新】絕對座標跟隨 (Absolute Steering)
        const updateSteering = (clientX) => {
            if(!this.state.isPlaying || this.els.qUI.classList.contains('hidden')) return;
            // 計算螢幕比例 (-0.5 到 +0.5)
            const ratio = (clientX / window.innerWidth) - 0.5; 
            // 放大為世界座標的左右極限 (-13 到 +13)
            this.targetInputX = ratio * 26; 
        };

        window.addEventListener('touchstart', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content') || e.target.closest('.choice-box')) return;
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => {
            if(!e.target.closest('.exp-content')) { if(e.cancelable) e.preventDefault(); }
            updateSteering(e.touches[0].clientX);
        }, {passive: false});
        
        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('button') || e.target.closest('.exp-content') || e.target.closest('.choice-box')) return;
            updateSteering(e.clientX);
        });
        window.addEventListener('mousemove', (e) => {
            if(e.buttons > 0) updateSteering(e.clientX);
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }, 100);
        });
    }

    init3D() {
        this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: false });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x030308);
        this.scene.fog = new THREE.FogExp2(0x030308, 0.002); // 迷霧調遠一點防破圖

        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1500);
        this.camera.position.set(0, 0, 5); 

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i+=3) {
            starPos[i] = (Math.random()-0.5)*500;
            starPos[i+1] = (Math.random()-0.5)*500;
            starPos[i+2] = (Math.random()-0.5)*1200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        this.stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0.6}));
        this.scene.add(this.stars);

        this.rings = [];
        const ringGeo = new THREE.TorusGeometry(22, 0.1, 5, 24);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        for(let i=0; i<30; i++) {
            let r = new THREE.Mesh(ringGeo, ringMat);
            r.position.z = -Math.random() * 1000;
            this.scene.add(r);
            this.rings.push(r);
        }

        this.sphereGeo = new THREE.SphereGeometry(3.5, 24, 24);
        this.matLeft = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent:true, opacity: 0.95 });
        this.matRight = new THREE.MeshBasicMaterial({ color: 0xff3366, transparent:true, opacity: 0.95 });
        
        this.sphereL = new THREE.Mesh(this.sphereGeo, this.matLeft);
        this.sphereR = new THREE.Mesh(this.sphereGeo, this.matRight);
        this.scene.add(this.sphereL); this.scene.add(this.sphereR);
        this.sphereL.visible = false; this.sphereR.visible = false;

        this.particleGeo = new THREE.BufferGeometry();
        this.baseParticlePos = new Float32Array(200 * 3);
        this.particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.baseParticlePos), 3));
        this.particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, transparent: true });
        this.particles = new THREE.Points(this.particleGeo, this.particleMat);
        this.particles.visible = false;
        this.scene.add(this.particles);

        this.loop();
    }

    start() {
        if(this.rafId) window.cancelAnimationFrame(this.rafId);
        AudioObj.stopTTS();
        
        this.state = { isPlaying: true, phase: 'reading', health: 100, score: 0, displayScore: 0, qIndex: 0, loop: 1, currentSpeed: 150 };
        this.targetInputX = 0;
        this.cameraInputX = 0;
        this.camera.position.x = 0;
        this.isTransitioning = false;
        this.runQueue = UniverseGenerator.getQueue(this.state.loop);
        
        this.els.start.classList.add('hidden');
        this.els.gameover.classList.add('hidden');
        this.els.expScreen.classList.add('hidden');
        this.els.ui.classList.remove('hidden');
        
        this.updateHUD();
        this.scheduleQuestion();
        this.loop();
    }

    scheduleQuestion() {
        if(this.state.qIndex >= this.runQueue.length) { 
            this.state.loop++;
            this.state.qIndex = 0;
            this.runQueue = UniverseGenerator.getQueue(this.state.loop); 
        }
        
        const q = this.runQueue[this.state.qIndex];
        document.getElementById('ui-era').innerText = q.era.replace(/ \[.*/, ''); // HUD只顯示乾淨時代
        document.getElementById('ui-loop').innerText = this.state.loop;
        this.targetColor.setHex(q.color);
        
        this.isCorrectOnLeft = Math.random() > 0.5; 
        const txtQ = q.premise;
        const txtL = this.isCorrectOnLeft ? q.correctOpt : q.wrongOpt;
        const txtR = this.isCorrectOnLeft ? q.wrongOpt : q.correctOpt;

        document.getElementById('q-text').innerText = txtQ;
        document.getElementById('c-left-box').innerText = txtL;
        document.getElementById('c-right-box').innerText = txtR;
        
        // 階段 1：停放在遠處等待語音
        this.state.phase = 'reading';
        this.sphereL.position.set(-10, 0, -250); 
        this.sphereR.position.set(10, 0, -250);
        this.sphereL.visible = true; this.sphereR.visible = true;
        
        this.hitTriggered = false;
        this.isTransitioning = false;
        this.els.warning.classList.remove('show-warning');
        this.els.qUI.classList.remove('hidden');

        const totalChars = q.era.length + txtQ.length + txtL.length + txtR.length;
        const fallbackMs = Math.max(4000, (totalChars / 5) * 1000);

        AudioObj.playPreReading(q.era, txtQ, txtL, txtR, fallbackMs, () => {
            if(!this.state.isPlaying || this.state.phase !== 'reading') return;
            
            // 階段 2：語音結束，進入精準 3秒 衝撞階段
            this.state.phase = 'action';
            this.els.warning.classList.add('show-warning');
            
            // 距離 = 速度 * 3秒 (目標抵達 Z=5)
            const impactDist = this.state.currentSpeed * 3.0;
            this.sphereL.position.z = 5 - impactDist;
            this.sphereR.position.z = 5 - impactDist;
        });
    }

    triggerExplosion(pos, isCorrect) {
        this.particles.position.copy(pos);
        this.particleMat.color.setHex(isCorrect ? 0x00e5ff : 0xff3366);
        this.particles.visible = true;
        
        const positions = this.particles.geometry.attributes.position.array;
        for(let i=0; i<positions.length; i+=3) {
            positions[i] = (Math.random() - 0.5) * 8;
            positions[i+1] = (Math.random() - 0.5) * 8;
            positions[i+2] = (Math.random() - 0.5) * 8;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;
        this.particleTime = 0.8;
    }

    resolveAnswer(forcedSide = null) {
        if(this.hitTriggered || this.isTransitioning) return;
        this.hitTriggered = true;
        this.isTransitioning = true; 
        
        AudioObj.stopTTS(); 
        this.els.warning.classList.remove('show-warning');
        this.els.qUI.classList.add('hidden');
        
        const q = this.runQueue[this.state.qIndex];
        const hitSide = forcedSide || (this.camera.position.x < 0 ? 'left' : 'right');
        const isCorrect = (hitSide === 'left' && this.isCorrectOnLeft) || (hitSide === 'right' && !this.isCorrectOnLeft);
        
        const hitPos = hitSide === 'left' ? this.sphereL.position : this.sphereR.position;
        if(forcedSide) hitPos.z = 5; 

        this.triggerExplosion(hitPos, isCorrect);
        this.sphereL.visible = false; this.sphereR.visible = false;
        
        if(isCorrect) {
            AudioObj.playWin();
            this.state.score += (500 + this.state.loop * 100);
        } else {
            AudioObj.playLose();
            this.state.health = Math.max(0, this.state.health - 35);
            this.els.dmgFlash.classList.add('flash-red');
            setTimeout(() => this.els.dmgFlash.classList.remove('flash-red'), 80);
        }
        
        this.updateHUD(); KB.save(q); 
        
        if(this.state.health <= 0) { 
            setTimeout(() => this.gameOver(), 800); 
            return; 
        }

        document.getElementById('exp-correct-text').innerText = q.expCorrect;
        document.getElementById('exp-wrong-text').innerText = q.expWrong;
        
        setTimeout(() => {
            const expArea = document.getElementById('exp-scroll-area');
            expArea.scrollTop = 0; // 強制歸零
            // 延遲一點點確保 display block 後 scrollTop 生效
            setTimeout(()=> expArea.scrollTop = 0, 50); 
            
            this.els.expScreen.classList.remove('hidden');
            this.isTransitioning = false; 
            
            const expChars = q.expCorrect.length + q.expWrong.length;
            const expFallbackMs = Math.max(4000, (expChars / 5) * 1000);

            AudioObj.playExplanationTTS(q.expCorrect, q.expWrong, expFallbackMs, () => {
                if(this.state.isPlaying && !this.els.expScreen.classList.contains('hidden')) {
                    this.resumeAfterExplanation();
                }
            });
        }, 500);
    }

    updateHUD() {
        const hb = document.getElementById('health-bar');
        hb.style.width = this.state.health + '%';
        hb.classList.toggle('health-low', this.state.health <= 35);
    }

    resumeAfterExplanation() {
        this.els.expScreen.classList.add('hidden');
        AudioObj.playWarp(); 
        
        this.state.qIndex++;
        // 設定極速上限 500，保證玩家有反應空間
        this.state.currentSpeed = Math.min(500, 150 + (this.state.qIndex * 5) + ((this.state.loop - 1) * 35)); 
        this.scene.fog.density = 0.002 + (this.state.loop * 0.0001); 
        
        this.scheduleQuestion();
    }

    gameOver() {
        this.state.isPlaying = false;
        AudioObj.stopTTS();
        this.els.ui.classList.add('hidden');
        this.els.gameover.classList.remove('hidden');
        document.getElementById('go-score').innerText = this.state.score;
    }

    loop() {
        this.rafId = requestAnimationFrame(() => this.loop());
        const dt = Math.min(this.clock.getDelta(), 0.1);
        
        // 分數平滑動畫
        if(this.state.displayScore < this.state.score) {
            this.state.displayScore += Math.ceil((this.state.score - this.state.displayScore) * 0.1);
            document.getElementById('ui-score').innerText = this.state.displayScore;
        }

        this.scene.fog.color.lerp(this.targetColor, 0.05);
        this.rings.forEach(r => r.material.color.lerp(this.targetColor, 0.05));

        if(this.particles.visible && this.particleTime > 0) {
            this.particleTime -= dt;
            const pos = this.particles.geometry.attributes.position.array;
            for(let i=0; i<pos.length; i+=3) { pos[i]*=1.06; pos[i+1]*=1.06; pos[i+2]*=1.06; }
            this.particles.geometry.attributes.position.needsUpdate = true;
            this.particleMat.opacity = this.particleTime;
            if(this.particleTime <= 0) this.particles.visible = false;
        }

        if (this.state.isPlaying && !this.els.qUI.classList.contains('hidden') && !this.hitTriggered) {
            // 平滑跟隨絕對座標目標
            this.cameraInputX += (this.targetInputX - this.cameraInputX) * Math.min(10 * dt, 1);
            this.camera.position.x = this.cameraInputX;
            this.camera.position.y = Math.sin(Date.now() * 0.003) * 0.3;
            this.camera.rotation.z = -(this.camera.position.x * 0.02);

            const moveDist = this.state.currentSpeed * dt;

            const pos = this.stars.geometry.attributes.position.array;
            for(let i=2; i<pos.length; i+=3) {
                pos[i] += moveDist * 2.5; 
                if(pos[i] > 500) pos[i] -= 1200; 
            }
            this.stars.geometry.attributes.position.needsUpdate = true;
            this.rings.forEach(r => { r.position.z += moveDist; if(r.position.z > 20) r.position.z -= 1000; });

            if(this.state.phase === 'action' && this.sphereL.visible) {
                const prevZ = this.sphereL.position.z;
                this.sphereL.position.z += moveDist;
                this.sphereR.position.z += moveDist;
                
                // Z=5 碰撞切面
                if(prevZ < 5 && this.sphereL.position.z >= 5) {
                    this.resolveAnswer();
                }
            }
        }
        this.renderer.render(this.scene, this.camera);
    }
}

window.onload = () => {
    // 預先載入語音引擎
    if(window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
    new GameEngine();
};
