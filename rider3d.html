<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歷史時空急流 - 高空躍遷典藏版</title>
    <style>
        :root { --primary: #00ffcc; --danger: #ff3366; --bg: #0b0c10; }
        body, html { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; position: absolute; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        .pointer-auto { pointer-events: auto; }
        
        #screen-start, #screen-gameover { position: absolute; width: 100%; height: 100%; background: rgba(10,15,30,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; backdrop-filter: blur(12px); }
        .hidden { display: none !important; }
        
        h1 { color: var(--primary); text-shadow: 0 0 20px var(--primary); margin-bottom: 5px; font-size: clamp(2.2rem, 6vw, 3.5rem); text-align: center; letter-spacing: 2px; }
        p { font-size: 1.15rem; color: #d0f0ff; margin-bottom: 30px; text-align: center; line-height: 1.6; padding: 0 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        button { background: rgba(0,255,204,0.1); border: 2px solid var(--primary); color: var(--primary); padding: 15px 45px; font-size: 1.5rem; font-weight: bold; border-radius: 40px; cursor: pointer; transition: 0.3s; pointer-events: auto; box-shadow: 0 0 20px rgba(0,255,204,0.3); text-transform: uppercase; letter-spacing: 1px; }
        button:hover, button:active { background: var(--primary); color: #000; transform: scale(1.05); box-shadow: 0 0 40px var(--primary); }
        
        #hud { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; font-size: 1.2rem; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); text-shadow: 0 2px 4px black; }
        #health-bar-bg { width: 130px; height: 14px; background: rgba(255,255,255,0.2); border-radius: 10px; border: 1px solid rgba(255,255,255,0.5); margin-top: 5px; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00bfff, var(--primary)); transition: width 0.3s, background 0.3s; border-radius: 8px;}
        
        #question-ui { position: absolute; top: 18%; width: 100%; display: flex; flex-direction: column; align-items: center; color: white; }
        #q-text { background: rgba(0,10,30,0.85); padding: 18px 30px; border-radius: 15px; border: 1px solid var(--primary); font-size: clamp(1.15rem, 4.5vw, 1.5rem); font-weight: bold; text-align: center; box-shadow: 0 0 30px rgba(0,255,204,0.4); width: 85%; max-width: 650px; line-height: 1.5; backdrop-filter: blur(5px); }
        
        .choices { display: flex; width: 95%; max-width: 700px; justify-content: space-between; margin-top: 25px; pointer-events: auto; gap: 15px; padding: 0 15px; box-sizing: border-box; }
        .choice-box { background: rgba(0,0,0,0.7); padding: 20px 15px; border: 2px solid white; border-radius: 12px; flex: 1; text-align: center; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: clamp(0.95rem, 3.8vw, 1.25rem); display: flex; align-items: center; justify-content: center; min-height: 80px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .choice-box:active { transform: scale(0.92); background: rgba(255,255,255,0.3); }
        
        #fx-damage { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(255,0,50,0.7) 100%); opacity: 0; z-index: 50; transition: opacity 0.2s; pointer-events: none; mix-blend-mode: multiply; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="screen-start" class="pointer-auto">
        <h1>時空躍遷引擎</h1>
        <p>告別壓抑地面，迎向高空時空蟲洞！<br>10 大紀元，120 個史詩歷史節點。<br>滑動螢幕飛行，或點擊選項抉擇歷史！</p>
        <button id="btn-start">啟動躍遷</button>
    </div>

    <div id="screen-gameover" class="hidden pointer-auto">
        <h1 id="go-title">時間線崩塌</h1>
        <p>歷史同步率 (得分): <br><span id="go-score" style="color: var(--primary); font-size: 2.5rem; font-weight:bold; text-shadow: 0 0 20px var(--primary);">0</span></p>
        <button id="btn-restart">重新修復歷史</button>
    </div>

    <div class="ui-layer hidden" id="ui-game">
        <div id="hud">
            <div><span id="ui-era" style="color: var(--primary); font-size: 1.3rem; text-transform: uppercase;">古埃及</span></div>
            <div>護盾 <div id="health-bar-bg"><div id="health-bar"></div></div></div>
            <div>得分: <span id="ui-score">0</span></div>
        </div>
        
        <div id="question-ui" class="hidden">
            <div id="q-text">前提</div>
            <div class="choices" id="choices-container">
                <div class="choice-box" id="c-left" style="border-color: #ffaa00; text-shadow: 0 0 10px #ffaa00;">⬅️ 選項1</div>
                <div class="choice-box" id="c-right" style="border-color: #ff3366; text-shadow: 0 0 10px #ff3366;">選項2 ➡️</div>
            </div>
        </div>
    </div>

    <div id="fx-damage"></div>
    <canvas id="game-canvas"></canvas>

<script>

        { eraId: 1, events: [{ premise: "底格里斯河與幼發拉底河氾濫無常", left: "蘇美人生產悲觀文學與史詩", right: "認為神明極度慈愛", correct: "left" }, { premise: "為了記錄神廟的龐大帳目", left: "在泥板上壓出楔形文字", right: "發明了打字機", correct: "left" }, { premise: "城市逐漸發展為城邦", left: "建立巨大塔廟(Ziggurat)", right: "所有人都搬到地下居住", correct: "left" }]},

class ObjectPool {
    constructor(factoryFunc, initialSize) {
        this.factory = factoryFunc;
        this.pool = [];
        this.activeItems = [];
        for (let i = 0; i < initialSize; i++) {
            const item = this.factory();
            item.visible = false;
            this.pool.push(item);
        }
    }
    get() {
        const item = this.pool.length > 0 ? this.pool.pop() : this.factory();
        item.visible = true;
        this.activeItems.push(item);
        return item;
    }
    release(item) {
        item.visible = false;
        this.activeItems = this.activeItems.filter(i => i !== item);
        this.pool.push(item);
    }
}

class UIManager {
    constructor() {
        this.els = {
            start: document.getElementById('screen-start'),
            game: document.getElementById('ui-game'),
            gameover: document.getElementById('screen-gameover'),
            health: document.getElementById('health-bar'),
            score: document.getElementById('ui-score'),
            era: document.getElementById('ui-era'),
            qUI: document.getElementById('question-ui'),
            qText: document.getElementById('q-text'),
            cLeft: document.getElementById('c-left'),
            cRight: document.getElementById('c-right'),
            fxDamage: document.getElementById('fx-damage')
        };
    }
    showStart() { this.els.start.classList.remove('hidden'); this.els.gameover.classList.add('hidden'); }
    startGame() { this.els.start.classList.add('hidden'); this.els.gameover.classList.add('hidden'); this.els.game.classList.remove('hidden'); }
    showGameOver(score, isWin) { 
        this.els.game.classList.add('hidden'); 
        this.els.gameover.classList.remove('hidden');
        document.getElementById('go-score').innerText = score;
        document.getElementById('go-title').innerText = isWin ? "時空躍遷完成！" : "歷史線已崩塌";
        document.getElementById('go-title').style.color = isWin ? "var(--primary)" : "var(--danger)";
    }
    updateHUD(health, score) {
        this.els.health.style.width = `${Math.max(0, health)}%`;
        this.els.health.style.background = health < 30 ? 'linear-gradient(90deg, #ff0000, #ff3366)' : 'linear-gradient(90deg, #00bfff, var(--primary))';
        this.els.score.innerText = score;
    }
    showDamageFx() {
        this.els.fxDamage.style.opacity = 1;
        setTimeout(() => this.els.fxDamage.style.opacity = 0, 300);
    }
    showQuestion(evt) {
        this.els.qUI.classList.remove('hidden');
        this.els.qText.innerText = evt.premise;
        this.els.cLeft.innerHTML = `⬅️ ${evt.left}`;
        this.els.cRight.innerHTML = `${evt.right} ➡️`;
    }
    hideQuestion() { this.els.qUI.classList.add('hidden'); }
}

class InputManager {
    constructor() {
        this.targetX = 0;
        this.isDragging = false;
        this.startX = 0;
        this.bindEvents();
    }
    bindEvents() {
        window.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.choice-box') || e.target.tagName === 'BUTTON') return;
            this.isDragging = true; this.startX = e.touches[0].clientX; 
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            if(!this.isDragging) return;
            this.targetX = ((e.touches[0].clientX - this.startX) / window.innerWidth) * CONFIG.CAMERA.SENSITIVITY_TOUCH; 
        }, {passive: true});
        window.addEventListener('touchend', () => this.isDragging = false);
        
        window.addEventListener('mousedown', (e) => { 
            if(e.target.closest('.choice-box') || e.target.tagName === 'BUTTON') return;
            this.isDragging = true; this.startX = e.clientX; 
        });
        window.addEventListener('mousemove', (e) => {
            if(!this.isDragging) return;
            this.targetX = ((e.clientX - this.startX) / window.innerWidth) * CONFIG.CAMERA.SENSITIVITY_TOUCH;
        });
        window.addEventListener('mouseup', () => this.isDragging = false);
    }
}

class SceneManager {
    constructor(canvas) {
        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 800);
        this.camera.position.set(0, 0, 0); // 相機置中，營造飛行感

        // 【高空飛行感：星空/雲海粒子系統】
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2500;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 400; // X
            starPos[i+1] = (Math.random() - 0.5) * 400; // Y
            starPos[i+2] = (Math.random() - 0.5) * 800; // Z
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8 });
        this.stars = new THREE.Points(starGeo, starMat);
        this.scene.add(this.stars);

        // 調整霧化範圍，去除壓抑感，變成深遠的時空隧道
        this.scene.fog = new THREE.Fog(0x000000, 100, 600);

        // 【時空環：取代原本的地板柱子】
        const ringGeo = new THREE.TorusGeometry(20, 0.3, 8, 30);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
        this.ringPool = new ObjectPool(() => {
            const mesh = new THREE.Mesh(ringGeo, ringMat);
            this.scene.add(mesh);
            return mesh;
        }, 30);

        // 時空隧道 Portal (左右抉擇門)
        const pGeo = new THREE.BoxGeometry(10, 15, 1);
        this.portalPool = new ObjectPool(() => {
            const group = new THREE.Group();
            const left = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 }));
            const right = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.6 }));
            left.position.x = -8; right.position.x = 8;
            group.add(left); group.add(right);
            this.scene.add(group);
            return group;
        }, 3);

        // 初始化佈置時空環
        for(let i=0; i<30; i++) {
            const r = this.ringPool.get();
            r.position.set(0, 0, -Math.random() * 600);
        }
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.fov = window.innerHeight > window.innerWidth ? 90 : 75;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    setEraStyle(eraConfig) {
        this.scene.fog.color.setHex(eraConfig.color);
        this.scene.background = new THREE.Color(eraConfig.color);
        this.ringPool.pool.forEach(r => r.material.color.setHex(eraConfig.color));
        this.ringPool.activeItems.forEach(r => r.material.color.setHex(eraConfig.color));
    }
}

class GameEngine {
    constructor() {
        this.ui = new UIManager();
        this.input = new InputManager();
        this.sceneMgr = new SceneManager(document.getElementById('game-canvas'));
        
        this.state = { isPlaying: false, health: 100, score: 0, eraIndex: 0, currentEventIndex: 0, time: 0 };
        this.runQueue = []; 
        this.clock = new THREE.Clock();
        this.speed = 60;
        
        this.activeEvent = null;
        this.activePortal = null;
        this.eventTimeoutId = null; 

        document.getElementById('btn-start').addEventListener('click', () => this.start());
        document.getElementById('btn-restart').addEventListener('click', () => this.start());
        
        const handleChoice = (dir) => {
            if(this.activeEvent) {
                this.input.targetX = dir === 'left' ? -10 : 10;
                this.resolveBranch(dir);
            }
        };
        this.ui.els.cLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); handleChoice("left"); });
        this.ui.els.cRight.addEventListener('pointerdown', (e) => { e.preventDefault(); handleChoice("right"); });

        this.loop();
    }

    generateRunQueue() {
        this.runQueue = [];
        for(let i = 0; i < GameDB.eras.length; i++) {
            const availableChains = GameDB.chains.filter(c => c.eraId === i);
            if(availableChains.length === 0) continue;
            const randomChain = availableChains[Math.floor(Math.random() * availableChains.length)];
            const eventsWithEra = randomChain.events.map(evt => ({...evt, eraId: i}));
            this.runQueue = this.runQueue.concat(eventsWithEra);
        }
    }

    start() {
        if(this.eventTimeoutId) clearTimeout(this.eventTimeoutId);
        
        const activePortals = [...this.sceneMgr.portalPool.activeItems];
        activePortals.forEach(p => this.sceneMgr.portalPool.release(p));

        this.generateRunQueue();
        this.ui.startGame();
        this.ui.hideQuestion();
        
        this.state = { isPlaying: true, health: CONFIG.PLAYER.MAX_HEALTH, score: 0, eraIndex: 0, currentEventIndex: 0, time: 0 };
        this.input.targetX = 0;
        this.sceneMgr.camera.position.set(0,0,0);
        this.activeEvent = null;
        this.activePortal = null;
        
        this.ui.updateHUD(this.state.health, this.state.score);
        this.changeEra(0);
        this.scheduleEvent();
    }

    changeEra(index) {
        this.state.eraIndex = index;
        const era = GameDB.eras[index];
        this.ui.els.era.innerText = era.name;
        this.sceneMgr.setEraStyle(era);
        this.speed = 80 * era.speed; // 基礎速度提升，強化高空躍遷感
    }

    scheduleEvent() {
        if(!this.state.isPlaying) return;
        
        this.eventTimeoutId = setTimeout(() => {
            const evt = this.runQueue[this.state.currentEventIndex];
            
            if(!evt) return this.gameOver(true);

            if(evt.eraId > this.state.eraIndex) {
                this.changeEra(evt.eraId);
            }

            this.activeEvent = evt;
            this.activePortal = this.sceneMgr.portalPool.get();
            this.activePortal.position.set(0, 0, CONFIG.SPAWN.Z_START);
            this.activePortal.userData.prevZ = CONFIG.SPAWN.Z_START;
            
            this.ui.showQuestion(evt);
        }, 1200); // 縮短節奏
    }

    resolveBranch(inputMethod) {
        if(!this.activeEvent) return;

        let choice = typeof inputMethod === "string" ? inputMethod : (inputMethod < 0 ? "left" : "right");

        if (choice === this.activeEvent.correct) {
            this.state.score += CONFIG.PLAYER.SCORE_REWARD;
        } else {
            this.state.health -= CONFIG.PLAYER.DAMAGE_PENALTY;
            this.ui.showDamageFx();
        }
        
        this.ui.hideQuestion();
        this.ui.updateHUD(this.state.health, this.state.score);
        
        if (this.activePortal) {
            this.sceneMgr.portalPool.release(this.activePortal);
            this.activePortal = null;
        }
        this.activeEvent = null;
        this.state.currentEventIndex++;
        
        this.input.targetX = 0; 
        
        if(this.state.health <= 0) this.gameOver(false);
        else this.scheduleEvent();
    }

    gameOver(isWin) {
        this.state.isPlaying = false;
        if(this.eventTimeoutId) clearTimeout(this.eventTimeoutId);
        this.ui.showGameOver(this.state.score, isWin);
    }

    loop() {
        requestAnimationFrame(() => this.loop());
        const dt = Math.min(this.clock.getDelta(), 0.1); 

        const cam = this.sceneMgr.camera;
        
        if (this.state.isPlaying) {
            this.state.time += dt;
            const moveDist = this.speed * dt;

            // 相機平滑跟隨 (X軸躲避) 與 Y軸微幅浮動 (飛行感)
            cam.position.x += (this.input.targetX - cam.position.x) * CONFIG.CAMERA.SMOOTHING * dt;
            cam.position.y = Math.sin(this.state.time * 2) * 0.8; 
            cam.rotation.z = -(cam.position.x * 0.03); // 微幅傾斜

            // 星辰高速流動
            const positions = this.sceneMgr.stars.geometry.attributes.position.array;
            for(let i=2; i<positions.length; i+=3) {
                positions[i] += moveDist * 1.5; 
                if(positions[i] > 50) positions[i] = -750; // 回收粒子
            }
            this.sceneMgr.stars.geometry.attributes.position.needsUpdate = true;

            // 時空環流動
            this.sceneMgr.ringPool.activeItems.forEach(r => {
                r.position.z += moveDist;
                if(r.position.z > CONFIG.SPAWN.Z_END) {
                    r.position.z -= 600; 
                }
            });

            // 抉擇傳送門碰撞檢測
            if (this.activePortal) {
                const p = this.activePortal;
                p.userData.prevZ = p.position.z; 
                p.position.z += moveDist;
                
                if (p.userData.prevZ <= CONFIG.PHYSICS.PLAYER_Z && p.position.z > CONFIG.PHYSICS.PLAYER_Z) {
                    this.resolveBranch(cam.position.x);
                }
            }
        }

        this.sceneMgr.renderer.render(this.sceneMgr.scene, cam);
    }
}

window.onload = () => new GameEngine();

</script>
