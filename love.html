<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Our Time - 專屬對話</title>
    
    <!-- Google 依賴 (隱藏且保留) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <style>
        :root {
            --vh: 1dvh;
            --bg-base: #0a0c10; 
            --bg-card: #161a22; 
            --text-main: #e5e7eb; 
            --text-sub: #6b7280;
            --accent-gold: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.2);
            --danger-red: #ef4444;
        }

        /* 觸控優化：防止雙擊放大、文字選取、橡皮筋效應 */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; touch-action: manipulation; }
        
        html, body { height: 100dvh; background-color: var(--bg-base); color: var(--text-main); overflow: hidden; position: fixed; inset: 0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }

        .svg-icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

        /* --- 視覺介面 --- */
        #app-wrapper { display: flex; flex-direction: column; height: 100dvh; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: calc(15px + env(safe-area-inset-top)) 25px 15px; z-index: 10; }
        .logo-text { font-size: 13px; font-weight: 400; letter-spacing: 5px; color: var(--text-sub); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        
        .icon-btn { color: var(--text-sub); background: transparent; border: none; padding: 10px; cursor: pointer; transition: color 0.3s, transform 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:active { color: var(--accent-gold); transform: scale(0.9); }

        #main-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; perspective: 1200px; padding: 20px; overflow: hidden; }

        .card-stack { position: relative; width: 100%; max-width: 340px; aspect-ratio: 3/4.2; }
        
        .question-card { position: absolute; inset: 0; background: var(--bg-card); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 40px 25px; opacity: 0; pointer-events: none; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s; transform: translateY(50px) scale(0.9) rotateX(10deg); border: 1px solid rgba(255,255,255,0.02); }
        .question-card.active { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1) rotateX(0deg); z-index: 5; }
        .question-card.prev { opacity: 0; transform: translateY(-50px) scale(0.9) rotateX(-10deg); z-index: 4; }
        
        .card-category { font-size: 11px; color: var(--accent-gold); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; text-align: center; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px;}
        /* 修正文字跑版元凶：拔掉 keep-all，改用 break-word */
        .card-text { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 300; line-height: 1.7; text-align: center; color: var(--text-main); letter-spacing: 0.5px; word-break: break-word; }
        .card-footer { font-size: 10px; color: var(--text-sub); text-align: center; letter-spacing: 2px; }

        .controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px calc(30px + env(safe-area-inset-bottom)); }
        
        .nav-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: var(--text-main); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); }
        .nav-btn:active { background: var(--accent-glow); color: var(--accent-gold); border-color: var(--accent-gold); transform: scale(0.92); }
        .nav-btn:disabled { opacity: 0.2; pointer-events: none; }

        /* --- 隱藏的底層硬核介面 --- */
        #secret-trigger { position: absolute; bottom: 0; right: 0; width: 60px; height: 60px; background: transparent; z-index: 9999; }
        
        .glass-overlay, .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 10000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; flex-direction: column; }
        .glass-overlay.active, .modal-overlay.open { opacity: 1; pointer-events: auto; }
        
        .modal-content { width: 85%; max-width: 340px; background: var(--bg-card); border-radius: 24px; padding: 30px 25px; border: 1px solid rgba(255,255,255,0.05); color: var(--text-main); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.open .modal-content, .glass-overlay.active .modal-content { transform: translateY(0); }

        .btn-system { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; margin-bottom: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: var(--text-main); font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .btn-system:active { background: rgba(255,255,255,0.1); }
        .btn-system.danger { color: var(--danger-red); border-color: rgba(239,68,68,0.2); margin-top: 25px; }
        .btn-system.primary { color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.3); }
        .btn-system.primary:active { background: rgba(212, 175, 55, 0.2); }

        #toast-container { position: fixed; top: env(safe-area-inset-top, 20px); left: 50%; transform: translateX(-50%); z-index: 20000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 320px; }
        
        #debug-console { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100000; flex-direction: column; padding: calc(20px + env(safe-area-inset-top)) 20px 20px; color: #fff; }
        #debug-console.active { display: flex !important; }
        #debug-console textarea { flex: 1; width: 100%; background: #000; color: #10b981; font-family: monospace; border: 1px solid #333; margin-top: 15px; padding: 15px; font-size: 11px; border-radius: 12px; resize: none; }

        /* Pin 密碼鎖樣式 */
        #pin-display { display: flex; justify-content: center; gap: 12px; margin-bottom: 35px; min-height: 14px; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-sub); transition: all 0.2s; }
        .pin-dot.filled { background: var(--accent-gold); border-color: var(--accent-gold); box-shadow: 0 0 10px var(--accent-glow); }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; max-width: 280px; margin: 0 auto; }
        .pin-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 300; color: #fff; cursor: pointer; background: rgba(255,255,255,0.03); transition: background 0.1s; }
        .pin-btn:active { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <header>
            <div class="logo-text">
                <svg class="svg-icon" style="width:16px;height:16px;color:var(--accent-gold)" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                OUR TIME
            </div>
            <!-- 觸發退場的電源按鈕 -->
            <button class="icon-btn" onclick="UI.showEndConfirm()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
            </button>
        </header>

        <main id="main-stage">
            <div class="card-stack" id="card-track">
                <!-- 卡片由 JS 動態生成 -->
            </div>
        </main>

        <div class="controls">
            <button class="nav-btn" id="btn-prev" onclick="Game.prevCard()">
                <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="nav-btn" id="btn-next" onclick="Game.nextCard()">
                <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>

        <!-- 秘密觸發熱區 (右下角長按) -->
        <div id="secret-trigger"></div>
    </div>

    <!-- 完美的自訂結束確認彈窗 (取代原生的 confirm) -->
    <div id="end-confirm-overlay" class="glass-overlay">
        <div class="modal-content" style="text-align: center; padding: 40px 25px;">
            <div style="font-size:18px; margin-bottom:15px; letter-spacing:2px; color: var(--text-main); font-weight: 300;">結束對話</div>
            <div style="font-size:13px; color:var(--text-sub); margin-bottom:30px; line-height:1.6;" id="end-confirm-msg"></div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-system" style="margin-bottom:0; flex:1;" onclick="document.getElementById('end-confirm-overlay').classList.remove('active')">取消</button>
                <button class="btn-system primary" style="margin-bottom:0; flex:1;" onclick="UI.executeEndSequence()">確定</button>
            </div>
        </div>
    </div>

    <!-- 隱藏的系統後台 Modal -->
    <div id="system-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 25px; text-align: center; color: var(--text-sub); font-weight: 300; letter-spacing: 3px; font-size: 12px;">SYSTEM SETTINGS</h3>
            
            <button class="btn-system" onclick="CoreManager.setupNewFlow(); closeSystemModal();">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                首次建立 (靜默綁定雲端)
            </button>

            <button class="btn-system" onclick="CoreManager.restoreFlow(); closeSystemModal();">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                還原舊進度 (從雲端)
            </button>
            
            <button class="btn-system" onclick="CoreManager.performFullSync(true); closeSystemModal();">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                手動強制同步
            </button>

            <button class="btn-system danger" onclick="closeSystemModal()">
                <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                關閉面板
            </button>
        </div>
    </div>

    <!-- 密碼鎖 -->
    <div id="pin-lock-overlay" class="glass-overlay">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none; padding: 0;">
            <div style="text-align:center; font-size:20px; font-weight:300; margin-bottom:10px; letter-spacing:2px;" id="pin-title">解鎖金鑰</div>
            <div style="text-align:center; font-size:12px; color:var(--text-sub); margin-bottom:35px; white-space:pre-wrap;" id="pin-desc">請輸入數字密碼</div>
            <div id="pin-display"></div>
            <div class="pin-grid" id="pin-grid"></div>
            <button class="btn-system" style="margin-top: 40px; justify-content:center; border:none; background:transparent; color:var(--text-sub);" id="btn-pin-cancel">取消驗證</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const QUESTIONS = [
            // 階段 1：破冰暖身
            { cat: "破冰", icon: "☕", text: "如果現在可以丟下小孩跟工作，瞬間移動到地球上任何一個地方發呆三天，妳想去哪？" },
            { cat: "破冰", icon: "☕", text: "回想我們剛認識的時候，我有哪一個舉動或特質，讓妳覺得『這個人好像還不錯』？" },
            { cat: "破冰", icon: "☕", text: "如果我們兩個人的個性可以互相交換一天，妳覺得妳最無法適應我的一點是什麼？" },
            { cat: "破冰", icon: "☕", text: "這半年來，有沒有哪一部電影、劇或是一首歌，讓妳看完/聽完後在心裡產生很大的共鳴？" },
            
            // 階段 2：看見妳的光
            { cat: "閃耀", icon: "✨", text: "妳知道嗎？當妳在工作上蟬聯業績第一時，我心裡其實最真實的想法是..." },
            { cat: "閃耀", icon: "✨", text: "這幾年看妳在職場跟家庭間切換，妳覺得自己長出了什麼以前根本沒有的『超能力』？" },
            { cat: "閃耀", icon: "✨", text: "如果妳的工作夥伴能看到妳在家裡的樣子，妳覺得他們最驚訝的會是什麼？" },
            { cat: "閃耀", icon: "✨", text: "我一直覺得妳有一種很棒的特質，是連妳自己可能都沒察覺的，妳猜猜是什麼？" },
            
            // 階段 3：育兒黑洞與卸下盔甲
            { cat: "卸防", icon: "🛡️", text: "老實說，當了這 7 年的媽媽，有沒有哪一個瞬間妳真的很想大喊『我不想管了』？" },
            { cat: "卸防", icon: "🛡️", text: "在教養觀念上，如果我哪一次的態度讓妳覺得『你在扯我後腿』，請現在坦白告訴我。" },
            { cat: "卸防", icon: "🛡️", text: "如果明天一整天妳都不用當『媽媽』也不用當『主管』，妳最想讓我為妳做的一件事是什麼？" },
            { cat: "卸防", icon: "🛡️", text: "當妳在外頭衝刺業績、回到家又看到滿地玩具覺得快崩潰時，妳最希望我對妳說什麼？" },
            { cat: "卸防", icon: "🛡️", text: "有沒有什麼事情是妳一直覺得委屈，但為了這個家，妳默默吞下去沒有說的？" },

            // 階段 4：靈魂深處
            { cat: "深處", icon: "🌌", text: "在我們結婚生子後的這些混亂日子裡，我有哪一次的舉動，讓妳覺得『有老公真好』？" },
            { cat: "深處", icon: "🌌", text: "反過來說，在這幾年裡，我有沒有哪句話或行為，曾經讓妳覺得特別孤單或失落？" },
            { cat: "深處", icon: "🌌", text: "輪到妳說了：拋開爸爸的角色，妳覺得『作為伴侶』的我，現在身上最讓妳依靠的特質是什麼？" },
            { cat: "深處", icon: "🌌", text: "如果我們兩個現在是第一次約會的陌生人，妳覺得我們還會愛上彼此嗎？為什麼？" },
            
            // 階段 5：未來與兩人世界
            { cat: "未來", icon: "🧭", text: "等兩個孩子都上國中，不用我們天天盯著的時候，妳最想和我一起去完成什麼瘋狂的事？" },
            { cat: "未來", icon: "🧭", text: "如果我們約定以後每個月都要有一次像今天這樣的『微約會』，妳最想制定的規則是什麼？" },
            { cat: "未來", icon: "🧭", text: "這個問題沒有標準答案：現在這一刻，坐在這裡，妳覺得我們的婚姻幸福指數有幾分？" }
        ];

        /* === 狀態管理 === */
        const GOOGLE_CLIENT_ID = '1044593447138-vvt8s9pubntng9vs557no1b57v82mbnh.apps.googleusercontent.com';
        const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile";
        let tokenClient; let gisInited = false;

        const STATE = {
            data: { gameContext: 'deep_couples_talk', currentIndex: 0, lastPlayed: Date.now() },
            cloud: { folderId: null, fileId: null, lastSyncTime: 0, isOffline: !navigator.onLine, accessToken: null }
        };

        /* === UI 工具 === */
        let _lastToastTime = 0;
        function showToast(msg, isError = false) {
            if (Date.now() - _lastToastTime < 1000) return; 
            _lastToastTime = Date.now();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.style.cssText = `background: ${isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(255, 255, 255, 0.1)'}; color: ${isError ? '#fff' : 'var(--accent-gold)'}; padding: 14px 20px; border-radius: 16px; font-size: 13px; text-align: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; align-items: center; justify-content: center; gap: 8px;`;
            
            const iconSvg = isError 
                ? `<svg class="svg-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>` 
                : `<svg class="svg-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
                
            toast.innerHTML = `${iconSvg} <span>${msg}</span>`;
            container.appendChild(toast);
            
            if (navigator.vibrate) navigator.vibrate(isError ? [50, 50, 50] : 20);
            requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        /* === 遊戲邏輯 === */
        const Game = {
            init: function() {
                const track = document.getElementById('card-track');
                track.innerHTML = QUESTIONS.map((q, i) => `
                    <div class="question-card" id="card-${i}">
                        <div class="card-category"><span>${q.icon}</span> ${q.cat}</div>
                        <div class="card-text">${q.text}</div>
                        <div class="card-footer">${i + 1} / ${QUESTIONS.length}</div>
                    </div>
                `).join('');
                if(STATE.data.currentIndex >= QUESTIONS.length) STATE.data.currentIndex = 0;
                this.render();
            },
            render: function() {
                QUESTIONS.forEach((_, i) => {
                    const card = document.getElementById(`card-${i}`);
                    card.className = 'question-card';
                    if (i === STATE.data.currentIndex) card.classList.add('active');
                    else if (i < STATE.data.currentIndex) card.classList.add('prev');
                });
                
                document.getElementById('btn-prev').disabled = (STATE.data.currentIndex === 0);
                document.getElementById('btn-next').disabled = (STATE.data.currentIndex === QUESTIONS.length - 1);
                CoreManager.saveLocal();
            },
            nextCard: function() {
                if (STATE.data.currentIndex < QUESTIONS.length - 1) {
                    STATE.data.currentIndex++; this.render();
                    if(navigator.vibrate) navigator.vibrate(10);
                }
            },
            prevCard: function() {
                if (STATE.data.currentIndex > 0) {
                    STATE.data.currentIndex--; this.render();
                    if(navigator.vibrate) navigator.vibrate(10);
                }
            }
        };

        const UI = {
            showEndConfirm: function() {
                const isCloudBound = STATE.cloud.folderId ? true : false;
                // 取代原本又醜又突兀的 confirm()
                const msg = isCloudBound 
                    ? "準備結束今晚的對話？<br><span style='font-size:11px;opacity:0.6;'>(系統將自動備份至雲端並無痕關閉)</span>" 
                    : "準備結束今晚的對話？<br><span style='font-size:11px;opacity:0.6;'>(將無痕關閉並清空暫存紀錄)</span>";
                
                document.getElementById('end-confirm-msg').innerHTML = msg;
                document.getElementById('end-confirm-overlay').classList.add('active');
                if(navigator.vibrate) navigator.vibrate(10);
            },
            executeEndSequence: async function() {
                document.getElementById('end-confirm-overlay').classList.remove('active');
                const isCloudBound = STATE.cloud.folderId ? true : false;
                
                if (isCloudBound) {
                    showToast("正在加密備份並準備關閉...");
                    await CoreManager.syncAndWipeAndClose();
                } else {
                    localStorage.removeItem('points_sys_data'); 
                    setTimeout(() => { window.close(); location.href = 'about:blank'; }, 500);
                }
            }
        };

        /* === 秘密選單觸發 === */
        let secretTimer;
        const secretBtn = document.getElementById('secret-trigger');
        const startSecret = (e) => { e.preventDefault(); secretTimer = setTimeout(() => { document.getElementById('system-modal').classList.add('open'); if(navigator.vibrate) navigator.vibrate([50,50]); }, 2000); };
        const cancelSecret = () => { clearTimeout(secretTimer); };
        secretBtn.addEventListener('touchstart', startSecret, {passive: false});
        secretBtn.addEventListener('touchend', cancelSecret);
        secretBtn.addEventListener('touchcancel', cancelSecret);
        secretBtn.addEventListener('mousedown', startSecret);
        secretBtn.addEventListener('mouseup', cancelSecret);
        secretBtn.addEventListener('mouseleave', cancelSecret);

        function closeSystemModal() { document.getElementById('system-modal').classList.remove('open'); }

        /* === Google Drive 與加密底層 === */
        function gisLoaded() { tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: SCOPES, callback: '' }); gisInited = true; }
        const gsiScript = document.createElement('script'); gsiScript.src = "https://accounts.google.com/gsi/client"; gsiScript.onload = gisLoaded; document.head.appendChild(gsiScript);

        const DriveAPI = {
            fetch: async function(url, options = {}) {
                if (!options.headers) options.headers = {};
                options.headers['Authorization'] = `Bearer ${STATE.cloud.accessToken}`;
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res;
            }
        };

        const CloudManager = {
            authorize: function() {
                return new Promise((resolve, reject) => {
                    if (!gisInited) { showToast("模組載入中，請稍候"); return reject(new Error("GIS_NOT_LOADED")); }
                    if (!STATE.cloud.accessToken) {
                        tokenClient.callback = (resp) => {
                            if (resp.error !== undefined) reject(resp);
                            else { STATE.cloud.accessToken = resp.access_token; resolve(); }
                        };
                        tokenClient.requestAccessToken({prompt: 'consent'});
                    } else { resolve(); }
                });
            },
            resumableUpload: async function(fileId, folderId, fileName, encryptedDataStr) {
                const mimeType = 'application/json'; const fileMetadata = fileId ? {} : { name: fileName, parents: [folderId] };
                const initMethod = fileId ? 'PATCH' : 'POST';
                const initUrl = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=resumable` : `https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable`;
                const initRes = await fetch(initUrl, { method: initMethod, headers: { 'Authorization': `Bearer ${STATE.cloud.accessToken}`, 'Content-Type': 'application/json', 'X-Upload-Content-Type': mimeType }, body: JSON.stringify(fileMetadata) });
                if (!initRes.ok) throw new Error(`Resumable Init Failed`);
                const uploadUrl = initRes.headers.get('Location');
                const uploadRes = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes 0-${new Blob([encryptedDataStr]).size - 1}/${new Blob([encryptedDataStr]).size}` }, body: encryptedDataStr });
                if ([200, 201, 308].includes(uploadRes.status)) {
                    if (uploadRes.status === 200 || uploadRes.status === 201) { const result = await uploadRes.json(); STATE.cloud.fileId = result.id; STATE.cloud.lastSyncTime = Date.now(); }
                    return true;
                }
                return false;
            }
        };

        const DriveUI = {
            fetchFolders: async function() {
                const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and trashed=false");
                const res = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=100`);
                const data = await res.json(); return data.files || [];
            },
            // 改寫：不再彈出醜陋的原生 prompt，自動靜默尋找或建立名為 OurTime 的資料夾
            getOrCreateTargetFolder: async function() {
                const folders = await this.fetchFolders();
                const targetName = "OurTime";
                const existing = folders.find(f => f.name === targetName);
                if(existing) return existing;
                
                showToast("正在配置您的專屬保險箱...");
                const res = await DriveAPI.fetch('https://www.googleapis.com/drive/v3/files?fields=id,name', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ name: targetName, mimeType: 'application/vnd.google-apps.folder' }) 
                });
                return await res.json();
            }
        };

        const CryptoEngine = {
            getKey: async function(passwordStr) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passwordStr), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
                return await crypto.subtle.deriveKey( { name: "PBKDF2", salt: enc.encode("DIGITAL_POINTS_SALT_CORE"), iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
            },
            encrypt: async function(dataStr, passwordStr) {
                const key = await this.getKey(passwordStr); const iv = crypto.getRandomValues(new Uint8Array(12));
                const enc = new TextEncoder(); const encryptedBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(dataStr));
                const finalArr = new Uint8Array(iv.length + encryptedBuf.byteLength); finalArr.set(iv, 0); finalArr.set(new Uint8Array(encryptedBuf), iv.length);
                let binStr = ""; for (let i = 0; i < finalArr.length; i += 10000) binStr += String.fromCharCode.apply(null, finalArr.subarray(i, i + 10000));
                return btoa(binStr);
            },
            decrypt: async function(base64Str, passwordStr) {
                const key = await this.getKey(passwordStr); const binaryStr = atob(base64Str);
                const finalArr = new Uint8Array(binaryStr.length); for(let i=0; i<binaryStr.length; i++) finalArr[i] = binaryStr.charCodeAt(i);
                const iv = finalArr.slice(0, 12); const encryptedData = finalArr.slice(12);
                const decryptedBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, encryptedData);
                return new TextDecoder().decode(decryptedBuf);
            }
        };

        const PinLock = {
            pin: '', resolveCallback: null,
            init: function() {
                const grid = document.getElementById('pin-grid'); grid.innerHTML = '';
                const layout = [ 
                    {v:'1', i:'1'}, {v:'2', i:'2'}, {v:'3', i:'3'}, 
                    {v:'4', i:'4'}, {v:'5', i:'5'}, {v:'6', i:'6'}, 
                    {v:'7', i:'7'}, {v:'8', i:'8'}, {v:'9', i:'9'}, 
                    {v:'del', i:'<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>'}, 
                    {v:'0', i:'0'}, 
                    {v:'submit', i:'<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'} 
                ];
                layout.forEach(k => {
                    const btn = document.createElement('div'); btn.className = 'pin-btn';
                    btn.innerHTML = k.i;
                    btn.onpointerdown = (e) => { e.preventDefault(); this.handleKey(k.v); };
                    grid.appendChild(btn);
                });
                document.getElementById('btn-pin-cancel').onclick = () => { this.close(); if(this.resolveCallback) this.resolveCallback(null); };
            },
            handleKey: function(key) {
                if (key === 'del') this.pin = this.pin.slice(0, -1);
                else if (key === 'submit') this.submitPin();
                else if (this.pin.length < 16) this.pin += key;
                this.updateDisplay(); if(navigator.vibrate) navigator.vibrate(10);
            },
            updateDisplay: function() {
                const display = document.getElementById('pin-display'); display.innerHTML = '';
                for (let i = 0; i < Math.max(4, this.pin.length + 1); i++) {
                    if (i > 15) break; const dot = document.createElement('div'); dot.className = 'pin-dot';
                    if (i < this.pin.length) dot.classList.add('filled'); display.appendChild(dot);
                }
            },
            submitPin: function() {
                if (this.pin.length < 4) return;
                if (this.resolveCallback) { const cb = this.resolveCallback; this.close(); cb(this.pin); }
            },
            open: function(title, desc) {
                return new Promise(resolve => {
                    document.getElementById('pin-title').innerText = title; document.getElementById('pin-desc').innerText = desc;
                    document.getElementById('pin-lock-overlay').classList.add('active'); this.pin = ''; this.updateDisplay(); this.resolveCallback = resolve;
                });
            },
            close: function() { document.getElementById('pin-lock-overlay').classList.remove('active'); this.resolveCallback = null; }
        };
        PinLock.init();

        const CoreManager = {
            init: async function() {
                const localStr = localStorage.getItem('points_sys_data');
                const cloudStr = localStorage.getItem('points_sys_cloud');
                if (localStr) {
                    try {
                        STATE.data = JSON.parse(localStr);
                        if(cloudStr) { const c = JSON.parse(cloudStr); STATE.cloud.folderId = c.folderId; STATE.cloud.fileId = c.fileId; }
                    } catch(e) {}
                }
                Game.init();
            },
            setupNewFlow: async function() {
                try {
                    await CloudManager.authorize();
                    // 改用靜默建立資料夾，不再彈出 prompt
                    const folder = await DriveUI.getOrCreateTargetFolder(); 
                    STATE.cloud.folderId = folder.id;
                    const pwd = await PinLock.open("設定專屬金鑰", "請輸入 4 位以上數字密碼\n(未來皆用此密碼解密，請務必牢記)");
                    if(!pwd) throw new Error("取消");
                    localStorage.setItem('sys_pin_cache', pwd);
                    await this.performFullSync(true);
                    showToast("綁定完成，資料已加密存放於雲端！");
                } catch(e) { if(e.message !== "取消" && e.message !== "GIS_NOT_LOADED") showToast("設定失敗，請確認已登入 Google", true); }
            },
            restoreFlow: async function() {
                try {
                    await CloudManager.authorize();
                    const folder = await DriveUI.getOrCreateTargetFolder(); 
                    STATE.cloud.folderId = folder.id;
                    const q = encodeURIComponent(`parents in '${folder.id}' and mimeType='application/json' and trashed=false`);
                    const res = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=modifiedTime desc&pageSize=1`);
                    const data = await res.json();
                    if (!data.files || data.files.length === 0) { showToast("找不到雲端備份檔", true); return; }
                    STATE.cloud.fileId = data.files[0].id;
                    
                    const pwd = await PinLock.open("解密備份", "請輸入當初設定的密碼");
                    if(!pwd) return;
                    const fileRes = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files/${STATE.cloud.fileId}?alt=media`);
                    const encStr = await fileRes.text();
                    const decStr = await CryptoEngine.decrypt(encStr, pwd);
                    localStorage.setItem('sys_pin_cache', pwd);
                    STATE.data = JSON.parse(decStr);
                    this.saveLocal(); Game.init(); showToast("還原成功！");
                } catch(e) { showToast("還原失敗，可能是密碼錯誤", true); }
            },
            saveLocal: function() {
                STATE.data.lastPlayed = Date.now();
                localStorage.setItem('points_sys_data', JSON.stringify(STATE.data));
                localStorage.setItem('points_sys_cloud', JSON.stringify({ folderId: STATE.cloud.folderId, fileId: STATE.cloud.fileId }));
            },
            performFullSync: async function(forceUpload = false) {
                if (STATE.cloud.isOffline) { showToast("目前處於離線狀態", true); return false; }
                try {
                    await CloudManager.authorize();
                    let pwd = localStorage.getItem('sys_pin_cache');
                    if (!pwd) { pwd = await PinLock.open("授權同步", "請輸入金鑰"); if(pwd) localStorage.setItem('sys_pin_cache', pwd); else return false; }

                    this.saveLocal();
                    const encStr = await CryptoEngine.encrypt(JSON.stringify(STATE.data), pwd);
                    const success = await CloudManager.resumableUpload(STATE.cloud.fileId, STATE.cloud.folderId, `OurTime_${new Date().toISOString().split('T')[0]}.json`, encStr);
                    return success;
                } catch(e) { showToast("同步失敗", true); return false; }
            },
            syncAndWipeAndClose: async function() {
                try {
                    const isSuccess = await this.performFullSync(true); 
                    if (isSuccess) {
                        localStorage.removeItem('points_sys_data'); 
                        localStorage.removeItem('points_sys_cloud'); 
                        setTimeout(() => { window.close(); location.href = 'about:blank'; }, 500);
                    }
                } catch(e) { showToast("關閉前同步失敗", true); }
            }
        };

        document.addEventListener('DOMContentLoaded', () => { CoreManager.init(); });

    </script>
</body>
