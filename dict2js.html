<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式防爆：超級完整版字典轉換器</title>
    <style>
        :root { --primary: #4a90e2; --success: #43a047; --border: #dddddd; }
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        .option-group { margin-bottom: 15px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; margin-top: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .success-btn { background: var(--success); }
        .log-box { margin-top: 15px; font-size: 13px; color: #555; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--border); max-height: 100px; overflow-y: auto;}
        progress { width: 100%; height: 20px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>超級完整版字典轉換器</h2>
    
    <div class="option-group">
        <label><input type="radio" name="source" value="B" checked> 預設遠端完整版網址 (16萬筆)</label>
        <input type="text" id="urlB" value="https://raw.githubusercontent.com/chyiro/moedict-data-chunker/master/moedict_data/dict-revised.json">
    </div>

    <button id="startBtn">開始串流處理 (Start Processing)</button>
    
    <div id="progressWrapper" style="display:none; margin-top: 15px;">
        <progress id="progressBar" value="0" max="100"></progress>
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#666; margin-top:5px;">
            <span id="progressText">準備中... 0%</span>
            <span id="etaText">ETA: --</span>
        </div>
    </div>

    <div class="log-box" id="logBox">系統已就緒，等待開始。</div>
    <button id="copyBtn" class="success-btn" style="display:none;">一鍵複製純淨 JS 代碼 (或自動下載)</button>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const copyBtn = document.getElementById('copyBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const logBox = document.getElementById('logBox');

    function log(msg) { logBox.innerText = msg; console.log(msg); }

    let PHRASE_BPMF_DICT = new Map();
    let TAIWAN_COMMON_CHARS = new Map();
    let BOPOMOFO_COMPRESSED_DICT = new Map();

    function processDictEntry(entry) {
        const title = entry.title;
        // 過濾掉含有 ASCII (英文、數字、符號) 或亂碼的怪異詞條
        if (!title || /[\u0000-\u007F]/.test(title) || /[{}？]/.test(title)) return;
        if (!entry.heteronyms || !Array.isArray(entry.heteronyms)) return;

        let validPronunciations = [];
        for (let het of entry.heteronyms) {
            if (!het.bopomofo) continue;
            let bpmf = het.bopomofo;

            // 1. 去除 HTML tag
            bpmf = bpmf.replace(/<[^>]+>/g, '');
            // 2. 【核心修復】徹底濾除 (讀音)、（語音）、（又音） 等括號註記 (支援全半形)
            bpmf = bpmf.replace(/[（(].*?[)）]/g, '');
            // 3. 清理多餘空白，轉為半形逗號
            bpmf = bpmf.replace(/[\s　]+/g, ','); 
            bpmf = bpmf.replace(/^,|,$/g, '');
            
            if (!bpmf) continue;

            // 4. 輕聲優化：將 ˙ㄇㄜ 轉為 ㄇㄜ˙
            let syllables = bpmf.split(',');
            for (let j = 0; j < syllables.length; j++) {
                if (syllables[j].startsWith('˙')) {
                    syllables[j] = syllables[j].substring(1) + '˙';
                }
            }
            bpmf = syllables.join(',');
            
            if (bpmf) validPronunciations.push(bpmf);
        }

        if (validPronunciations.length === 0) return;
        validPronunciations = [...new Set(validPronunciations)];

        if (title.length >= 2) {
            PHRASE_BPMF_DICT.set(title, validPronunciations.join('||'));
        } else if (title.length === 1) {
            // 單字處理
            if (!TAIWAN_COMMON_CHARS.has(title)) {
                TAIWAN_COMMON_CHARS.set(title, validPronunciations[0]);
            }
            for (let p of validPronunciations) {
                if (!BOPOMOFO_COMPRESSED_DICT.has(p)) {
                    BOPOMOFO_COMPRESSED_DICT.set(p, "");
                }
                // 緊密拼接破音字字集 (避免同一個字被重複加進同一個音)
                if (!BOPOMOFO_COMPRESSED_DICT.get(p).includes(title)) {
                    BOPOMOFO_COMPRESSED_DICT.set(p, BOPOMOFO_COMPRESSED_DICT.get(p) + title);
                }
            }
        }
    }

    async function startProcessing() {
        startBtn.disabled = true;
        copyBtn.style.display = 'none';
        document.getElementById('progressWrapper').style.display = 'block';
        
        PHRASE_BPMF_DICT.clear(); TAIWAN_COMMON_CHARS.clear(); BOPOMOFO_COMPRESSED_DICT.clear();
        
        try {
            const url = document.getElementById('urlB').value;
            const response = await fetch(url);
            if (!response.ok) throw new Error("網路請求失敗！");
            
            const totalSize = parseInt(response.headers.get('content-length') || 0, 10);
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            let buffer = "";
            let processedBytes = 0;
            let depth = 0;
            let objStartIndex = -1;
            let inString = false;
            let isEscape = false;
            let entryCount = 0;
            let i = 0; 

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                processedBytes += value.length;
                buffer += decoder.decode(value, { stream: true });

                if (totalSize) {
                    let percent = (processedBytes / totalSize * 100).toFixed(2);
                    progressBar.value = percent;
                    progressText.innerText = `${percent}%`;
                }

                while (i < buffer.length) {
                    const char = buffer[i];

                    if (isEscape) {
                        isEscape = false;
                    } else if (char === '\\') {
                        isEscape = true;
                    } else if (char === '"') {
                        inString = !inString;
                    } else if (!inString) {
                        if (char === '{') {
                            if (depth === 0) objStartIndex = i;
                            depth++;
                        } else if (char === '}') {
                            depth--;
                            if (depth === 0 && objStartIndex !== -1) {
                                const jsonStr = buffer.substring(objStartIndex, i + 1);
                                if (/"heteronyms"\s*:/.test(jsonStr)) {
                                    try {
                                        processDictEntry(JSON.parse(jsonStr));
                                        entryCount++;
                                    } catch (e) {}
                                }
                                buffer = buffer.substring(i + 1);
                                i = -1; 
                                objStartIndex = -1;
                            }
                        }
                    }
                    i++;
                }

                if (entryCount % 5000 === 0) {
                    log(`光速解析中... 已抓取 ${entryCount} 筆乾淨資料。`);
                }
            }

            log(`✅ 解析完畢！共成功抓取 ${entryCount} 筆，已剔除語音/又音雜質。`);
            progressText.innerText = "100% (完成)";
            progressBar.value = 100;
            copyBtn.style.display = 'block';

        } catch (err) {
            log(`[錯誤] ${err.message}`);
            startBtn.disabled = false;
        }
    }

    copyBtn.addEventListener('click', async () => {
        copyBtn.innerText = "組裝超級完整版代碼中 (請稍候)...";
        copyBtn.disabled = true;

        setTimeout(async () => {
            const phraseObj = Object.fromEntries(PHRASE_BPMF_DICT);
            const charsObj = Object.fromEntries(TAIWAN_COMMON_CHARS);
            const compressObj = Object.fromEntries(BOPOMOFO_COMPRESSED_DICT);

            const outputStr = `const PHRASE_BPMF_DICT = ${JSON.stringify(phraseObj)};\n\nconst TAIWAN_COMMON_CHARS = ${JSON.stringify(charsObj)};\n\nconst BOPOMOFO_COMPRESSED_DICT = ${JSON.stringify(compressObj)};`;

            try {
                await navigator.clipboard.writeText(outputStr);
                copyBtn.innerText = "✅ 成功複製 16 萬筆乾淨 JS 代碼！";
            } catch (err) {
                log("剪貼簿容量超載，已為您自動下載為 super_complete_dict.js 檔案！");
                const blob = new Blob([outputStr], { type: "text/javascript" });
                const urlObj = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = urlObj;
                a.download = "super_complete_dict.js";
                a.click();
                URL.revokeObjectURL(urlObj);
                copyBtn.innerText = "✅ 已自動下載超級完整版 JS";
            }
        }, 100);
    });

    startBtn.addEventListener('click', startProcessing);
</script>
</body>
</html>
