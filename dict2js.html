<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旗艦系統專屬：三區塊獨立字典轉換器</title>
    <style>
        :root { --primary: #4a90e2; --success: #43a047; --border: #dddddd; }
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        .option-group { margin-bottom: 15px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { filter: brightness(1.1); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .success-btn { background: var(--success); }
        .log-box { margin-top: 15px; font-size: 13px; color: #555; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--border); max-height: 120px; overflow-y: auto;}
        progress { width: 100%; height: 20px; border-radius: 10px; }
        .action-group { display: none; margin-top: 20px; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>旗艦系統：三區塊字典生成器</h2>
    
    <div class="option-group">
        <label><input type="radio" name="source" value="B" checked> 預設遠端完整版網址 (萌典 16萬筆)</label>
        <input type="text" id="urlB" value="https://raw.githubusercontent.com/chyiro/moedict-data-chunker/master/moedict_data/dict-revised.json">
    </div>

    <button id="startBtn">開始高度預處理與串流解析</button>
    
    <div id="progressWrapper" style="display:none; margin-top: 15px;">
        <progress id="progressBar" value="0" max="100"></progress>
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#666; margin-top:5px;">
            <span id="progressText">準備中... 0%</span>
        </div>
    </div>

    <div class="log-box" id="logBox">系統已就緒，等待開始。</div>

    <!-- 三個獨立的複製按鈕 -->
    <div class="action-group" id="actionGroup">
        <button id="btnCopy1" class="success-btn" style="background:#15803d">📋 複製第 1 區塊內容 (PHRASE 詞彙)</button>
        <button id="btnCopy2" class="success-btn" style="background:#166534">📋 複製第 2 區塊內容 (COMMON 單字)</button>
        <button id="btnCopy3" class="success-btn" style="background:#14532d">📋 複製第 3 區塊內容 (BOPOMOFO 壓縮)</button>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const logBox = document.getElementById('logBox');
    const actionGroup = document.getElementById('actionGroup');

    function log(msg) { logBox.innerText = msg; console.log(msg); }

    let PHRASE_BPMF_DICT = new Map();
    let TAIWAN_COMMON_CHARS = new Map();
    let BOPOMOFO_COMPRESSED_DICT = new Map();

    // 核心高度預處理演算法
    function processDictEntry(entry) {
        const title = entry.title;
        
        // 【嚴格過濾】只允許純中文字元，完美適配旗艦系統的分割正則
        if (!title || !/^[\u4e00-\u9fa5]+$/.test(title)) return;
        if (!entry.heteronyms || !Array.isArray(entry.heteronyms)) return;

        let validPronunciations = [];
        for (let het of entry.heteronyms) {
            if (!het.bopomofo) continue;
            let bpmf = het.bopomofo;

            bpmf = bpmf.replace(/<[^>]+>/g, '');
            bpmf = bpmf.replace(/[（(].*?[)）]/g, ''); // 徹底剔除 (語音) (讀音)
            bpmf = bpmf.replace(/[\s　_]+/g, ',');     // 對齊主程式替換空白為逗號
            bpmf = bpmf.replace(/^,|,$/g, '');
            
            if (!bpmf) continue;

            let syllables = bpmf.split(',');
            
            // 【長度攔截】音節數目必須與字元數目完美一致，否則直接丟棄減輕主程式負擔
            if (syllables.length !== title.length) continue;

            // 【輕聲優化】把開頭的輕聲點移到結尾
            for (let j = 0; j < syllables.length; j++) {
                if (syllables[j].startsWith('˙')) {
                    syllables[j] = syllables[j].substring(1) + '˙';
                }
            }
            bpmf = syllables.join(',');
            
            if (bpmf) validPronunciations.push(bpmf);
        }

        if (validPronunciations.length === 0) return;
        validPronunciations = [...new Set(validPronunciations)];

        if (title.length >= 2) {
            // 長詞：直接取首選發音，捨棄 ||，防止 split 產生陣列長度異常
            if (!PHRASE_BPMF_DICT.has(title)) {
                PHRASE_BPMF_DICT.set(title, validPronunciations[0]);
            }
        } else if (title.length === 1) {
            // 常用單字：取首選發音
            if (!TAIWAN_COMMON_CHARS.has(title)) {
                TAIWAN_COMMON_CHARS.set(title, validPronunciations[0]);
            }
            // 壓縮反向字庫：將字塞入對應注音中
            for (let p of validPronunciations) {
                if (p.includes(',')) continue; // 防呆
                if (!BOPOMOFO_COMPRESSED_DICT.has(p)) {
                    BOPOMOFO_COMPRESSED_DICT.set(p, "");
                }
                if (!BOPOMOFO_COMPRESSED_DICT.get(p).includes(title)) {
                    BOPOMOFO_COMPRESSED_DICT.set(p, BOPOMOFO_COMPRESSED_DICT.get(p) + title);
                }
            }
        }
    }

    async function startProcessing() {
        startBtn.disabled = true;
        actionGroup.style.display = 'none';
        document.getElementById('progressWrapper').style.display = 'block';
        
        PHRASE_BPMF_DICT.clear(); TAIWAN_COMMON_CHARS.clear(); BOPOMOFO_COMPRESSED_DICT.clear();
        
        try {
            const url = document.getElementById('urlB').value;
            const response = await fetch(url);
            if (!response.ok) throw new Error("網路請求失敗！");
            
            const totalSize = parseInt(response.headers.get('content-length') || 0, 10);
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            let buffer = ""; let processedBytes = 0;
            let depth = 0; let objStartIndex = -1;
            let inString = false; let isEscape = false;
            let entryCount = 0; let i = 0; 

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                processedBytes += value.length;
                buffer += decoder.decode(value, { stream: true });

                if (totalSize) {
                    let percent = (processedBytes / totalSize * 100).toFixed(2);
                    progressBar.value = percent;
                    progressText.innerText = `${percent}%`;
                }

                while (i < buffer.length) {
                    const char = buffer[i];

                    if (isEscape) { isEscape = false; } 
                    else if (char === '\\') { isEscape = true; } 
                    else if (char === '"') { inString = !inString; } 
                    else if (!inString) {
                        if (char === '{') {
                            if (depth === 0) objStartIndex = i;
                            depth++;
                        } else if (char === '}') {
                            depth--;
                            if (depth === 0 && objStartIndex !== -1) {
                                const jsonStr = buffer.substring(objStartIndex, i + 1);
                                if (/"heteronyms"\s*:/.test(jsonStr)) {
                                    try {
                                        processDictEntry(JSON.parse(jsonStr));
                                        entryCount++;
                                    } catch (e) {}
                                }
                                buffer = buffer.substring(i + 1);
                                i = -1; objStartIndex = -1;
                            }
                        }
                    }
                    i++;
                }
                if (entryCount % 5000 === 0) {
                    log(`深度清洗中... 已為旗艦系統優化 ${entryCount} 筆純淨詞彙。`);
                }
            }

            log(`✅ 解析完畢！共抓取 ${entryCount} 筆。請使用下方按鈕複製個別區塊內容。`);
            progressText.innerText = "100% (完成)";
            progressBar.value = 100;
            actionGroup.style.display = 'flex';

        } catch (err) {
            log(`[錯誤] ${err.message}`);
            startBtn.disabled = false;
        }
    }

    // 負責脫殼處理 (去除頭尾大括號) 並寫入剪貼簿
    async function copyInnerBlock(mapData, btnEl, dictName, label) {
        btnEl.innerText = "資料脫殼組裝中...";
        btnEl.disabled = true;

        setTimeout(async () => {
            const obj = Object.fromEntries(mapData);
            // 將 Map 轉為標準 JSON 字串 (如 {"媽媽":"ㄇㄚ,ㄇㄚ˙","爸爸":"ㄅㄚˋ,ㄅㄚ˙"})
            const fullJsonStr = JSON.stringify(obj);
            
            // 【核心邏輯】去除頭尾的 { 和 }，只留下內部的字串陣列內容
            const innerStr = fullJsonStr.substring(1, fullJsonStr.length - 1);

            try {
                await navigator.clipboard.writeText(innerStr);
                btnEl.innerText = `✅ 成功複製區塊 ${label} 內部內容！`;
            } catch (err) {
                // 如果字數大到剪貼簿當掉，自動改為下載 txt 檔，裡面同樣是脫殼後的字串
                log(`剪貼簿容量超載，已為您自動下載為 ${dictName}_純內容.txt`);
                const blob = new Blob([innerStr], { type: "text/plain" });
                const urlObj = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = urlObj;
                a.download = `${dictName}_純內容.txt`;
                a.click();
                URL.revokeObjectURL(urlObj);
                btnEl.innerText = `✅ 已自動下載 txt 檔`;
            }
            
            // 3秒後恢復按鈕狀態
            setTimeout(() => {
                btnEl.innerText = `📋 複製第 ${label} 區塊內容 (${dictName})`;
                btnEl.disabled = false;
            }, 3000);
        }, 50);
    }

    // 綁定三個獨立複製按鈕
    document.getElementById('btnCopy1').addEventListener('click', function() {
        copyInnerBlock(PHRASE_BPMF_DICT, this, "PHRASE_BPMF_DICT", "1");
    });
    document.getElementById('btnCopy2').addEventListener('click', function() {
        copyInnerBlock(TAIWAN_COMMON_CHARS, this, "TAIWAN_COMMON_CHARS", "2");
    });
    document.getElementById('btnCopy3').addEventListener('click', function() {
        copyInnerBlock(BOPOMOFO_COMPRESSED_DICT, this, "BOPOMOFO_COMPRESSED_DICT", "3");
    });

    startBtn.addEventListener('click', startProcessing);
</script>
</body>
</html>
