<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas Curves Ultra - 完美無暇鐵骨畫布</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid #333; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #bbb; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas Curves Ultra (防斷節高速焊接 · 完美書法骨肉)</b><br><span>已修正高速觸控事件中斷瑕疵！即使極速撇捺出鋒也絕對不脫節、不分叉成兩截</span></div>
        <canvas id="paintCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }

    let isPainting = false;
    let points = []; 
    let currentX = 0, currentY = 0;
    let currentWidth = 4.0;
    let lastAngle = null;
    let lastRawX = 0, lastRawY = 0; // 新增：記錄手指在未進行濾波前的「絕對最後真實座標」

    // 【大師級黃金物理參數配置】
    const MAX_WIDTH = 34;          
    const MIN_WIDTH = 4.0;         
    const POSITION_INERTIA = 0.26; 
    const WIDTH_INERTIA = 0.12;    

    const INK_COLOR = "rgba(15, 15, 15, 1.0)"; 

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        currentX = pos.x;
        currentY = pos.y;
        lastRawX = pos.x;
        lastRawY = pos.y;
        currentWidth = MIN_WIDTH; 
        
        points = [{ x: currentX, y: currentY, w: MIN_WIDTH }];
        lastAngle = null;
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        lastRawX = pos.x; // 即時更新手指物理真實終點，用作提筆時的斷裂焊接
        lastRawY = pos.y;

        const lastPt = points[points.length - 1];
        const dx = pos.x - lastPt.x;
        const dy = pos.y - lastPt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.4) return;

        const prevX = currentX;
        const prevY = currentY;
        
        // 物理位置濾波
        currentX = currentX + dx * POSITION_INERTIA;
        currentY = currentY + dy * POSITION_INERTIA;
        const moveAngle = Math.atan2(currentY - prevY, currentX - prevX);

        // 速度反比寬度演算
        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.5;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.24);
        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        points.push({ x: currentX, y: currentY, w: currentWidth });

        // 二階貝茲動態中點插值路徑
        if (points.length >= 3) {
            const p0 = points[points.length - 3];
            const p1 = points[points.length - 2];
            const p2 = points[points.length - 1];

            const xc = (p1.x + p2.x) / 2;
            const yc = (p1.y + p2.y) / 2;

            const chordLength = Math.sqrt((xc - p0.x) * (xc - p0.x) + (yc - p0.y) * (yc - p0.y));
            // 高精細度超採樣
            const steps = Math.ceil(chordLength * 4.5) || 1;

            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let bPrevX = p0.x;
            let bPrevY = p0.y;

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const curX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * xc;
                const curY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * yc;

                ctx.lineWidth = p0.w + (p1.w - p0.w) * t;

                ctx.beginPath();
                ctx.moveTo(bPrevX, bPrevY);
                ctx.lineTo(curX, curY);
                ctx.stroke();

                bPrevX = curX;
                bPrevY = curY;
            }

            if (points.length > 4) points.shift();
        }

        // 漢字捺腳特化外部塑形
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            const radius = currentWidth / 2;
            const nx = -Math.sin(moveAngle);
            const ny = Math.cos(moveAngle);
            ctx.fillStyle = INK_COLOR;
            ctx.beginPath();
            ctx.moveTo(currentX + nx * radius, currentY + ny * radius);
            ctx.lineTo(currentX + nx * radius * 1.26, currentY + ny * radius * 1.15); 
            ctx.lineTo(currentX - nx * radius, currentY - ny * radius);
            ctx.closePath();
            ctx.fill();
        }

        lastAngle = moveAngle;
    }

    // 【高速出鋒焊接函式 —— 徹底消滅兩截、斷頭漏洞】
    function stopDrawing() {
        if (!isPainting) return;

        const lastPt = points[points.length - 1];

        if (lastAngle !== null && currentWidth > MIN_WIDTH * 1.1) {
            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 【核心焊接魔法】：
            // 如果濾波器與手指真實離螢幕位置(lastRawX)落差太大（判定為高速撇捺掠出）
            // 在啟動錐形出鋒前，先強制拉一條過渡線段，把這個空間斷層「銲接咬死」，消滅兩截斷痕
            const gapDist = Math.sqrt((lastRawX - lastPt.x) * (lastRawX - lastPt.x) + (lastRawY - lastPt.y) * (lastRawY - lastPt.y));
            let startX = lastPt.x;
            let startY = lastPt.y;

            if (gapDist > 5.0) {
                ctx.lineWidth = currentWidth;
                ctx.beginPath();
                ctx.moveTo(lastPt.x, lastPt.y);
                ctx.lineTo(lastRawX, lastRawY);
                ctx.stroke();
                
                // 將出鋒的起始點移至真實物理離手點，保持力道慣性一體化
                startX = lastRawX;
                startY = lastRawY;
            }

            let tailX = startX;
            let tailY = startY;
            let tailW = currentWidth;
            const steps = 20; 

            for (let k = 1; k <= steps; k++) {
                const ratio = k / steps;
                const curveFactor = 1.0 - Math.pow(ratio, 0.6); 
                const nextW = MIN_WIDTH + (currentWidth - MIN_WIDTH) * curveFactor;

                const prevTailX = tailX;
                const prevTailY = tailY;
                
                // 順著最後軌跡的角度前進，拉出毛筆尖的利芒
                tailX += Math.cos(lastAngle) * (tailW * 0.16);
                tailY += Math.sin(lastAngle) * (tailW * 0.16);
                tailW = nextW;

                if (tailW < 1.2) {
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(prevTailX, prevTailY);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();
                    break;
                }

                ctx.lineWidth = tailW;
                ctx.beginPath();
                ctx.moveTo(prevTailX, prevTailY);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
            }
        }

        isPainting = false;
        points = [];
        lastAngle = null;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
</script>
</body>
</html>
