<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas Master - 正宗漢字風骨畫布</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        /* 嚴格純白，不論早晚 */
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid #333; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #bbb; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
        .info span { color: #ff453a; }
        button { position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 24px; font-size: 14px; background: #222; color: #ccc; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        button:active { background: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas Master (亞像素黑度修正 · 拋物線俐落出鋒)</b><br><span>已修正中段白線抗鋸齒瑕疵，提筆自動演示正統「刀鋒掠尾」，告別蠟燭火焰</span></div>
        <canvas id="paintCanvas"></canvas>
        <button onclick="clearCanvas()">洗筆清空</button>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        // 強制實心純白底色，防止透明干擾
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    let isPainting = false;
    let currentX = 0, currentY = 0;
    let currentWidth = 12;
    let lastLeftX = null, lastLeftY = null;
    let lastRightX = null, lastRightY = null;
    let lastAngle = null;

    // 【風骨特化物理參數】
    const MAX_WIDTH = 34;
    const MIN_WIDTH = 3.5;
    const POSITION_INERTIA = 0.28; // 位置平滑阻尼
    const WIDTH_INERTIA = 0.12;    // 寬度變化速度限制（杜絕突變）

    // 墨色設定：使用高飽和純焦墨，杜絕半透明重疊空隙
    const INK_COLOR = "rgba(12, 12, 12, 1.0)";

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        currentX = pos.x;
        currentY = pos.y;
        currentWidth = MAX_WIDTH * 0.45;
        
        lastLeftX = null; lastLeftY = null;
        lastRightX = null; lastRightY = null;
        lastAngle = null;

        ctx.fillStyle = INK_COLOR;
        ctx.beginPath();
        ctx.arc(currentX, currentY, currentWidth / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        const dx = pos.x - currentX;
        const dy = pos.y - currentY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < 0.4) return;

        // 軌跡慣性平滑化
        const prevX = currentX;
        const prevY = currentY;
        currentX = currentX + dx * POSITION_INERTIA;
        currentY = currentY + dy * POSITION_INERTIA;

        const moveAngle = Math.atan2(currentY - prevY, currentX - prevX);

        // 計算基礎目標寬度
        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.0;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        // 融入永字八法幾何優化（橫細直粗）
        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.25);

        // 限制寬度變化率
        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        const radius = currentWidth / 2;
        const nx = -Math.sin(moveAngle);
        const ny = Math.cos(moveAngle);

        // 計算目前包絡線外邊緣座標
        const curLeftX = currentX + nx * radius;
        const curLeftY = currentY + ny * radius;
        const curRightX = currentX - nx * radius;
        const curRightY = currentY - ny * radius;

        ctx.fillStyle = INK_COLOR;
        ctx.strokeStyle = INK_COLOR;

        if (lastLeftX !== null) {
            // 1. 【焊接修正：增設 0.2px 微幅外張，消滅橫向白線】
            ctx.beginPath();
            ctx.moveTo(lastLeftX - nx * 0.2, lastLeftY - ny * 0.2);
            ctx.lineTo(curLeftX + nx * 0.2, curLeftY + ny * 0.2);
            ctx.lineTo(curRightX - nx * 0.2, curRightY - ny * 0.2);
            ctx.lineTo(lastRightX + nx * 0.2, lastRightY + ny * 0.2);
            ctx.closePath();
            ctx.fill();

            // 2. 【核心雙保險：沿中軸線補實一條實心骨架】
            // 這一條線能徹底壓死所有焊接產生的抗鋸齒亞像素白邊，讓線條中段飽滿黑亮！
            ctx.lineWidth = currentWidth - 0.5;
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currentX, currentY);
            ctx.stroke();

            // 曲率過大時的流暢補弧
            if (lastAngle !== null && Math.abs(moveAngle - lastAngle) > 0.08) {
                ctx.beginPath();
                ctx.arc(currentX, currentY, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 捺腳特化外部塑形（朝右下，且筆劃變粗時）
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            ctx.beginPath();
            ctx.moveTo(curLeftX, curLeftY);
            ctx.lineTo(currentX + nx * radius * 1.28, currentY + ny * radius * 1.15); 
            ctx.lineTo(curRightX, curRightY);
            ctx.fill();
        }

        lastLeftX = curLeftX; lastLeftY = curLeftY;
        lastRightX = curRightX; lastRightY = curRightY;
        lastAngle = moveAngle;
    }

    // 【出鋒演算法大翻修：消除蠟燭火焰，重塑剛勁刀鋒掠尾】
    function stopDrawing() {
        if (!isPainting) return;

        if (lastLeftX !== null && currentWidth > MIN_WIDTH * 1.2) {
            ctx.fillStyle = INK_COLOR;
            let tailX = currentX;
            let tailY = currentY;
            let tailW = currentWidth;
            
            // 出鋒拉長的步數
            const steps = 15; 

            for (let k = 1; k <= steps; k++) {
                const ratio = k / steps;

                // 核心數學修正：不再使用直線等比縮小（火焰形）
                // 改用「反向平方根函數」，讓筆畫前半段維持飽滿度，最後 15% 瞬間聚攏收窄
                // 這完美對應了書法提筆時，筆毫先平滑過渡、最後俐落彈開的「刀鋒特徵」
                const curveFactor = 1.0 - Math.sqrt(ratio); 
                tailW = MIN_WIDTH + (currentWidth - MIN_WIDTH) * curveFactor;
                
                // 順著最後一幀的角度慣性前進
                tailX += Math.cos(lastAngle) * (tailW * 0.16);
                tailY += Math.sin(lastAngle) * (tailW * 0.16);

                if (tailW < 0.5) break;

                // 採用法線切面覆蓋出鋒，杜絕圓球收尾產生的肉疙瘩
                const r = tailW / 2;
                const tx = -Math.sin(lastAngle) * r;
                const ty = Math.cos(lastAngle) * r;

                ctx.beginPath();
                ctx.arc(tailX, tailY, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        isPainting = false;
        lastLeftX = null; lastLeftY = null;
        lastRightX = null; lastRightY = null;
        lastAngle = null;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function clearCanvas() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
</script>
</body>
</html>
