<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas IronCore - 漢字鐵骨畫布</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid #333; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #bbb; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas IronCore (100% 骨肉同步 · 切線錐形出鋒)</b><br><span>找回上一版完美粗細！全面封鎖橫白線，結尾導入剛性切線延伸，絕不禿頭</span></div>
        <canvas id="paintCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }

    let isPainting = false;
    let points = []; 
    let currentX = 0, currentY = 0;
    let currentWidth = 14; // 回歸饱滿的初始寬度
    
    let lastLeftX = null, lastLeftY = null;
    let lastRightX = null, lastRightY = null;
    let lastAngle = null;

    // 【回歸上一版完美骨肉感參數】
    const MAX_WIDTH = 34;          // 飽滿厚實最大寬度
    const MIN_WIDTH = 3.5;         // 鎖定扎實下限，過細會引發白線
    const POSITION_INERTIA = 0.28; // 軌跡平滑阻尼
    const WIDTH_INERTIA = 0.14;    // 變寬平滑阻尼

    const CORE_INK = "rgba(15, 15, 15, 1.0)";   
    const SMOOTH_INK = "rgba(15, 15, 15, 0.14)"; 

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        currentX = pos.x;
        currentY = pos.y;
        currentWidth = MAX_WIDTH * 0.45; // 起筆直接給予厚實肉感，消滅空心死結
        
        points = [{ x: currentX, y: currentY, w: currentWidth }];
        
        lastLeftX = null; lastLeftY = null;
        lastRightX = null; lastRightY = null;
        lastAngle = null;

        // 起筆雙層抗鋸齒圓點
        drawSmoothDot(currentX, currentY, currentWidth / 2);
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        const dx = pos.x - currentX;
        const dy = pos.y - currentY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.4) return;

        const prevX = currentX;
        const prevY = currentY;
        currentX = currentX + dx * POSITION_INERTIA;
        currentY = currentY + dy * POSITION_INERTIA;

        const moveAngle = Math.atan2(currentY - prevY, currentX - prevX);

        // 速度反比筆寬演算
        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.5;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        // 漢字橫細直粗約束
        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.24);

        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        points.push({ x: currentX, y: currentY, w: currentWidth });
        if (points.length > 3) points.shift();

        const radius = currentWidth / 2;
        const nx = -Math.sin(moveAngle);
        const ny = Math.cos(moveAngle);

        const curLeftX = currentX + nx * radius;
        const curLeftY = currentY + ny * radius;
        const curRightX = currentX - nx * radius;
        const curRightY = currentY - ny * radius;

        if (lastLeftX !== null) {
            // 1. 外圍羽化包絡線（消除硬邊鋸齒）
            const smoothLeftX = curLeftX + nx * 1.2;
            const smoothLeftY = curLeftY + ny * 1.2;
            const smoothRightX = curRightX - nx * 1.2;
            const smoothRightY = curRightY - ny * 1.2;
            const prevSmoothLeftX = lastLeftX + nx * 1.2;
            const prevSmoothLeftY = lastLeftY + ny * 1.2;
            const prevSmoothRightX = lastRightX - nx * 1.2;
            const prevSmoothRightY = lastRightY - ny * 1.2;

            ctx.fillStyle = SMOOTH_INK;
            ctx.beginPath();
            ctx.moveTo(prevSmoothLeftX, prevSmoothLeftY);
            ctx.lineTo(smoothLeftX, smoothLeftY);
            ctx.lineTo(smoothRightX, smoothRightY);
            ctx.lineTo(prevSmoothRightX, prevSmoothRightY);
            ctx.closePath();
            ctx.fill();

            // 2. 主核心實心多邊形（前後幀微幅重疊 0.3px）
            ctx.fillStyle = CORE_INK;
            ctx.beginPath();
            ctx.moveTo(lastLeftX - nx * 0.3, lastLeftY - ny * 0.3);
            ctx.lineTo(curLeftX + nx * 0.3, curLeftY + ny * 0.3);
            ctx.lineTo(curRightX - nx * 0.3, curRightY - ny * 0.3);
            ctx.lineTo(lastRightX + nx * 0.3, lastRightY + ny * 0.3);
            ctx.closePath();
            ctx.fill();

            // 3. 【一勞永逸：100% 骨肉同步中軸線】
            // 寬度直接與實體半徑同寬，從最底層徹底壓死所有抗鋸齒白邊，橫白線絕不可能死灰復燃
            ctx.strokeStyle = CORE_INK;
            ctx.lineWidth = currentWidth; 
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            if (points.length === 3) {
                const xc = (points.x + points.x) / 2;
                const yc = (points.y + points.y) / 2;
                ctx.quadraticCurveTo(points.x, points.y, xc, yc);
            } else {
                ctx.lineTo(currentX, currentY);
            }
            ctx.stroke();
        }

        // 捺腳特化外部塑形
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            ctx.fillStyle = CORE_INK;
            ctx.beginPath();
            ctx.moveTo(curLeftX, curLeftY);
            ctx.lineTo(currentX + nx * radius * 1.26, currentY + ny * radius * 1.15); 
            ctx.lineTo(curRightX, curRightY);
            ctx.fill();
        }

        lastLeftX = curLeftX; lastLeftY = curLeftY;
        lastRightX = curRightX; lastRightY = curRightY;
        lastAngle = moveAngle;
    }

    // 【出鋒算法全面兵變：引入剛性向量切面收尖，徹底斬斷蠟筆頭】
    function stopDrawing() {
        if (!isPainting) return;

        if (lastLeftX !== null && currentWidth > MIN_WIDTH) {
            ctx.fillStyle = CORE_INK;
            let tailX = currentX;
            let tailY = currentY;
            let tailW = currentWidth;
            
            // 增加步進密度，拉長出鋒距離
            const steps = 20; 
            const nx = -Math.sin(lastAngle);
            const ny = Math.cos(lastAngle);

            let lastTailLeftX = lastLeftX;
            let lastTailLeftY = lastLeftY;
            let lastTailRightX = lastRightX;
            let lastTailRightY = lastRightY;

            for (let k = 1; k <= steps; k++) {
                const ratio = k / steps;
                
                // 使用立方的流暢收束曲線，前半段維持厚度，後段流暢聚攏
                const curveFactor = 1.0 - Math.pow(ratio, 0.7); 
                tailW = currentWidth * curveFactor;

                // 順著切線方向大步邁進，給予筆尖拉長的骨架空間
                tailX += Math.cos(lastAngle) * (currentWidth * 0.15);
                tailY += Math.sin(lastAngle) * (currentWidth * 0.15);

                if (tailW < 0.2) break;

                const r = tailW / 2;
                const curTailLeftX = tailX + nx * r;
                const curTailLeftY = tailY + ny * r;
                const curTailRightX = tailX - nx * r;
                const curTailRightY = tailY - ny * r;

                // 改用「向量梯形焊接」來拉出結尾，廢除圓形堆疊，尾端直接收歸至無窮小點
                ctx.beginPath();
                ctx.moveTo(lastTailLeftX, lastTailLeftY);
                ctx.lineTo(curTailLeftX, curTailLeftY);
                ctx.lineTo(curTailRightX, curTailRightY);
                ctx.lineTo(lastTailRightX, lastTailRightY);
                ctx.closePath();
                ctx.fill();

                // 補齊邊緣抗鋸齒羽化層
                ctx.fillStyle = SMOOTH_INK;
                ctx.beginPath();
                ctx.arc(tailX, tailY, r + 1.0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = CORE_INK;

                lastTailLeftX = curTailLeftX;
                lastTailLeftY = curTailLeftY;
                lastTailRightX = curTailRightX;
                lastTailRightY = curTailRightY;
            }
        }

        isPainting = false;
        points = [];
        lastLeftX = null; lastLeftY = null;
        lastRightX = null; lastRightY = null;
        lastAngle = null;
    }

    function drawSmoothDot(cx, cy, r) {
        ctx.fillStyle = SMOOTH_INK;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 0.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = CORE_INK;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
</script>
</body>
</html>
