<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas Curves - 圓潤風骨書法畫布</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid #333; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #bbb; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas Curves (二階貝茲路徑插值 · 徹底消滅直線折角)</b><br><span>全面升級動態幾何控制點，曲線圓潤流暢如絲綢，起筆尖銳，出鋒剛勁</span></div>
        <canvas id="paintCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }

    let isPainting = false;
    let points = []; // 儲存歷史平滑點，用於計算貝茲曲線
    let currentWidth = 4.0;
    let lastAngle = null;

    // 【大師級書法配置參數】
    const MAX_WIDTH = 34;          
    const MIN_WIDTH = 4.0;         
    const POSITION_INERTIA = 0.26; // 位置平滑阻尼
    const WIDTH_INERTIA = 0.12;    // 變寬平滑阻尼

    const INK_COLOR = "rgba(15, 15, 15, 1.0)"; 

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        // 初始化點集合
        points = [{ x: pos.x, y: pos.y, w: MIN_WIDTH }];
        currentWidth = MIN_WIDTH; // 下筆極細，杜絕圓結
        lastAngle = null;
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        const lastPt = points[points.length - 1];
        
        // 1. 位置動量濾波（消除手震）
        const dx = pos.x - lastPt.x;
        const dy = pos.y - lastPt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.4) return;

        const nextX = lastPt.x + dx * POSITION_INERTIA;
        const nextY = lastPt.y + dy * POSITION_INERTIA;
        const moveAngle = Math.atan2(nextY - lastPt.y, nextX - lastPt.x);

        // 2. 寬度動量濾波（消除竹節蟲）
        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.5;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        // 漢字橫細直粗特徵
        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.24);
        
        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        // 將平滑後的點推入歷史集合
        points.push({ x: nextX, y: nextY, w: currentWidth });

        // 【核心優化：二階貝茲路徑微觀渲染 —— 徹底消滅直線折角】
        // 當收集滿 3 個平滑點時，利用前兩點的中點與當前點，建構一條完美的圓弧貝茲曲線
        if (points.length >= 3) {
            const p0 = points[points.length - 3];
            const p1 = points[points.length - 2];
            const p2 = points[points.length - 1];

            // 計算二次貝茲曲線的控制點（中點焊接法）
            const xc = (p1.x + p2.x) / 2;
            const yc = (p1.y + p2.y) / 2;

            // 依據這段弧線的弦長，決定超採樣的精細步數
            const chordLength = Math.sqrt((xc - p0.x) * (xc - p0.x) + (yc - p0.y) * (yc - p0.y));
            const steps = Math.ceil(chordLength * 2.5) || 1;

            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let prevX = p0.x;
            let prevY = p0.y;

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;

                // 標準二次貝茲曲線公式：將生硬折角完全融化為流暢圓弧
                const curX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * xc;
                const curY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * yc;

                // 筆寬沿著圓弧路徑流暢內插
                ctx.lineWidth = p0.w + (p1.w - p0.w) * t;

                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(curX, curY);
                ctx.stroke();

                prevX = curX;
                prevY = curY;
            }

            // 保持陣列長度，防止記憶體溢出
            if (points.length > 4) points.shift();
        }

        // 漢字捺腳特化外部塑形
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            const radius = currentWidth / 2;
            const nx = -Math.sin(moveAngle);
            const ny = Math.cos(moveAngle);
            ctx.fillStyle = INK_COLOR;
            ctx.beginPath();
            ctx.moveTo(nextX + nx * radius, nextY + ny * radius);
            ctx.lineTo(nextX + nx * radius * 1.26, nextY + ny * radius * 1.15); 
            ctx.lineTo(nextX - nx * radius, nextY - ny * radius);
            ctx.closePath();
            ctx.fill();
        }

        lastAngle = moveAngle;
    }

    // 拋物線動態延伸出鋒
    function stopDrawing() {
        if (!isPainting) return;

        const lastPt = points[points.length - 1];

        if (lastAngle !== null && currentWidth > MIN_WIDTH * 1.1) {
            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let tailX = lastPt.x;
            let tailY = lastPt.y;
            let tailW = currentWidth;
            const steps = 18; 

            for (let k = 1; k <= steps; k++) {
                const ratio = k / steps;
                const curveFactor = 1.0 - Math.pow(ratio, 0.6); 
                const nextW = MIN_WIDTH + (currentWidth - MIN_WIDTH) * curveFactor;

                const prevTailX = tailX;
                const prevTailY = tailY;
                tailX += Math.cos(lastAngle) * (tailW * 0.16);
                tailY += Math.sin(lastAngle) * (tailW * 0.16);
                tailW = nextW;

                if (tailW < 1.2) {
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(prevTailX, prevTailY);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();
                    break;
                }

                ctx.lineWidth = tailW;
                ctx.beginPath();
                ctx.moveTo(prevTailX, prevTailY);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
            }
        }

        isPainting = false;
        points = [];
        lastAngle = null;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
</script>
</body>
</html>
