<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KaiCanvas Final Fix</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #fff; touch-action: none; width: 95vw; height: 85vh; border: 2px solid #222; }
    </style>
</head>
<body>
    <canvas id="paintCanvas"></canvas>
<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false, points = [];
    
    // 初始化與高清設定
    function setup() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, rect.width, rect.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }
    setup();

    // 處理指標事件
    canvas.addEventListener('pointerdown', e => { isDrawing = true; points = [{x: e.offsetX, y: e.offsetY, w: 4}]; });
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', () => isDrawing = false);

    function draw(e) {
        if (!isDrawing) return;
        const x = e.offsetX, y = e.offsetY;
        const last = points[points.length - 1];
        const dist = Math.hypot(x - last.x, y - last.y);
        if (dist < 1) return;

        // 核心修正：動態切換連接方式，大彎用 round，急轉用 bevel
        const angle = Math.abs(Math.atan2(y - last.y, x - last.x));
        ctx.lineJoin = angle > 0.5 ? 'bevel' : 'round'; // 動態削平肉瘤
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(2, 30 - dist * 2);
        ctx.strokeStyle = '#000';

        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(x, y);
        ctx.stroke();
        points.push({x, y});
    }
</script>
</body>
</html>
