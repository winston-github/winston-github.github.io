<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas Master Supreme - 大成風骨書法畫布</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        /* 嚴格純白畫布，不受時間環境干擾 */
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 25px 70px rgba(0,0,0,0.6); border: 2px solid #222; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #aaa; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas Master Supreme (露鋒切入起筆 · 剛性線性出鋒)</b><br><span>徹底消滅起筆貢丸圓結與收尾內縮蠟筆頭！回歸正統繁體楷書之快刀長劍鋒芒</span></div>
        <canvas id="paintCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }

    let isPainting = false;
    let points = []; 
    let currentX = 0, currentY = 0;
    let currentWidth = 4.0;
    let lastAngle = null;
    let lastRawX = 0, lastRawY = 0; 

    // 【大師級完美書法粗細配置】
    const MAX_WIDTH = 34;          // 飽滿厚實最大肉感寬度
    const MIN_WIDTH = 4.0;         // 扎實銳利最小骨感寬度
    const POSITION_INERTIA = 0.26; // 位置阻尼
    const WIDTH_INERTIA = 0.12;    // 變寬阻尼

    const INK_COLOR = "rgba(15, 15, 15, 1.0)"; 

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        currentX = pos.x;
        currentY = pos.y;
        lastRawX = pos.x;
        lastRawY = pos.y;
        currentWidth = MIN_WIDTH; 
        
        // 【核心優化一：起筆完全不畫任何圖案】
        // 只記錄起始座標，徹底連根拔除起筆的貢丸大圓結
        points = [{ x: currentX, y: currentY, w: MIN_WIDTH }];
        lastAngle = null;
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        lastRawX = pos.x; 
        lastRawY = pos.y;

        const lastPt = points[points.length - 1];
        const dx = pos.x - lastPt.x;
        const dy = pos.y - lastPt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.4) return;

        const prevX = currentX;
        const prevY = currentY;
        
        currentX = currentX + dx * POSITION_INERTIA;
        currentY = currentY + dy * POSITION_INERTIA;
        const moveAngle = Math.atan2(currentY - prevY, currentX - prevX);

        // 計算目標筆寬
        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.5;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        // 漢字橫細直粗特徵約束
        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.24);

        // 寬度平滑逼近
        const prevWidth = currentWidth;
        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        // 【核心優化二：露鋒切入起筆過渡】
        // 如果剛開始動（歷史點少於 4 個），強迫筆寬從極細線性撐開
        // 配合手指移動的方向，會自然在起點拉出一條流暢優雅的「斜刀切鋒入筆」，精緻絕倫
        let renderWidth = currentWidth;
        if (points.length < 4) {
            renderWidth = MIN_WIDTH + (currentWidth - MIN_WIDTH) * (points.length / 4);
        }

        points.push({ x: currentX, y: currentY, w: renderWidth });

        // 二階向心貝茲骨架引擎（100% 免疫橫白線與竹節蟲，消滅直線折角）
        if (points.length >= 3) {
            const p0 = points[points.length - 3];
            const p1 = points[points.length - 2];
            const p2 = points[points.length - 1];

            const xc = (p1.x + p2.x) / 2;
            const yc = (p1.y + p2.y) / 2;

            const chordLength = Math.sqrt((xc - p0.x) * (xc - p0.x) + (yc - p0.y) * (yc - p0.y));
            const steps = Math.ceil(chordLength * 4.5) || 1;

            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let bPrevX = p0.x;
            let bPrevY = p0.y;

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const curX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * xc;
                const curY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * yc;

                ctx.lineWidth = p0.w + (p1.w - p0.w) * t;

                ctx.beginPath();
                ctx.moveTo(bPrevX, bPrevY);
                ctx.lineTo(curX, curY);
                ctx.stroke();

                bPrevX = curX;
                bPrevY = curY;
            }

            if (points.length > 4) points.shift();
        }

        // 漢字捺腳特化外部塑形
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            const radius = currentWidth / 2;
            const nx = -Math.sin(moveAngle);
            const ny = Math.cos(moveAngle);
            ctx.fillStyle = INK_COLOR;
            ctx.beginPath();
            ctx.moveTo(currentX + nx * radius, currentY + ny * radius);
            ctx.lineTo(currentX + nx * radius * 1.26, currentY + ny * radius * 1.15); 
            ctx.lineTo(currentX - nx * radius, currentY - ny * radius);
            ctx.closePath();
            ctx.fill();
        }

        lastAngle = moveAngle;
    }

    // 【核心優化三：長跨度剛性線性出鋒 —— 徹底斬斷蠟筆內縮頭】
    function stopDrawing() {
        if (!isPainting) return;

        if (points.length > 0) {
            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 數據不中斷清空焊接
            let lastDrawnPt = points[points.length - 1];
            ctx.lineWidth = currentWidth;

            if (points.length > 1) {
                ctx.beginPath();
                ctx.moveTo(points.x, points.y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineTo(lastRawX, lastRawY);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(lastDrawnPt.x, lastDrawnPt.y);
                ctx.lineTo(lastRawX, lastRawY);
                ctx.stroke();
            }

            let startX = lastRawX;
            let startY = lastRawY;

            // 啟動正統書法線性出尖
            if (lastAngle !== null && currentWidth > MIN_WIDTH * 1.1) {
                let tailX = startX;
                let tailY = startY;
                let tailW = currentWidth;
                
                // 將收尾長度大幅拉長到 28 步，給予線條充足的剛性舒展空間
                const steps = 28; 

                for (let k = 1; k <= steps; k++) {
                    const ratio = k / steps;
                    
                    // 關鍵修正：將原本內凹的等比收縮改為「絕對線性遞減（Linear Decay）」
                    // 這能保證筆尖兩側的包絡線像一把拉直的長劍劍刃，呈現出完美的剛勁挺直
                    // 當寬度縮小到 1.3 像素時（黃金圓面筆鋒），隨即俐落斷開，絕不留原子筆死細線
                    const curveFactor = 1.0 - ratio; 
                    const nextW = 1.3 + (currentWidth - 1.3) * curveFactor;

                    const prevTailX = tailX;
                    const prevTailY = tailY;
                    
                    // 順著切線幾何慣性穩步前進
                    tailX += Math.cos(lastAngle) * (currentWidth * 0.16);
                    tailY += Math.sin(lastAngle) * (currentWidth * 0.16);
                    tailW = nextW;

                    if (tailW <= 1.35) {
                        ctx.lineWidth = 1.3;
                        ctx.beginPath();
                        ctx.moveTo(prevTailX, prevTailY);
                        ctx.lineTo(tailX, tailY);
                        ctx.stroke();
                        break;
                    }

                    ctx.lineWidth = tailW;
                    ctx.beginPath();
                    ctx.moveTo(prevTailX, prevTailY);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();
                }
            }
        }

        isPainting = false;
        points = [];
        lastAngle = null;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
</script>
</body>
</html>
