<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KaiCanvas IronClad - 鐵證如山書法畫布</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 95vw; height: 85vh; }
        canvas { background: #ffffff !important; cursor: crosshair; touch-action: none; width: 100%; height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 2px solid #333; }
        .info { position: absolute; top: -55px; left: 0; width: 100%; color: #bbb; font-size: 14px; text-align: center; pointer-events: none; line-height: 1.5; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">✒️ <b>KaiCanvas IronClad (緩衝點全面清空焊接 · 物理絕對不斷節)</b><br><span>提筆瞬間強行封死二階貝茲留白漏洞！不論運筆速度多瘋狂，結尾都絕對 100% 完美相連</span></div>
        <canvas id="paintCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 2;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }

    let isPainting = false;
    let points = []; 
    let currentX = 0, currentY = 0;
    let currentWidth = 4.0;
    let lastAngle = null;
    let lastRawX = 0, lastRawY = 0; 

    // 【大師級黃金物理參數配置】
    const MAX_WIDTH = 34;          
    const MIN_WIDTH = 4.0;         
    const POSITION_INERTIA = 0.26; 
    const WIDTH_INERTIA = 0.12;    

    const INK_COLOR = "rgba(15, 15, 15, 1.0)"; 

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function startDrawing(e) {
        isPainting = true;
        const pos = getCanvasPos(e);
        
        currentX = pos.x;
        currentY = pos.y;
        lastRawX = pos.x;
        lastRawY = pos.y;
        currentWidth = MIN_WIDTH; 
        
        // 初始記錄點
        points = [{ x: currentX, y: currentY, w: MIN_WIDTH }];
        lastAngle = null;
    }

    function draw(e) {
        if (!isPainting) return;

        const pos = getCanvasPos(e);
        lastRawX = pos.x; 
        lastRawY = pos.y;

        const lastPt = points[points.length - 1];
        const dx = pos.x - lastPt.x;
        const dy = pos.y - lastPt.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.4) return;

        const prevX = currentX;
        const prevY = currentY;
        
        currentX = currentX + dx * POSITION_INERTIA;
        currentY = currentY + dy * POSITION_INERTIA;
        const moveAngle = Math.atan2(currentY - prevY, currentX - prevX);

        let targetWidth = MAX_WIDTH - Math.log1p(dist * 1.5) * 6.5;
        if (targetWidth < MIN_WIDTH) targetWidth = MIN_WIDTH;
        if (targetWidth > MAX_WIDTH) targetWidth = MAX_WIDTH;

        const angleDiff = Math.abs(Math.sin(moveAngle - (-Math.PI / 4))); 
        targetWidth = targetWidth * (1.0 - angleDiff * 0.24);
        currentWidth = currentWidth + (targetWidth - currentWidth) * WIDTH_INERTIA;

        points.push({ x: currentX, y: currentY, w: currentWidth });

        // 貝茲曲線主繪製引擎
        if (points.length >= 3) {
            const p0 = points[points.length - 3];
            const p1 = points[points.length - 2];
            const p2 = points[points.length - 1];

            const xc = (p1.x + p2.x) / 2;
            const yc = (p1.y + p2.y) / 2;

            const chordLength = Math.sqrt((xc - p0.x) * (xc - p0.x) + (yc - p0.y) * (yc - p0.y));
            const steps = Math.ceil(chordLength * 4.5) || 1;

            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let bPrevX = p0.x;
            let bPrevY = p0.y;

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const curX = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * xc;
                const curY = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * yc;

                ctx.lineWidth = p0.w + (p1.w - p0.w) * t;

                ctx.beginPath();
                ctx.moveTo(bPrevX, bPrevY);
                ctx.lineTo(curX, curY);
                ctx.stroke();

                bPrevX = curX;
                bPrevY = curY;
            }

            if (points.length > 4) points.shift();
        }

        // 漢字捺腳外部塑形
        if (moveAngle > 0.4 && moveAngle < 1.2 && currentWidth > MAX_WIDTH * 0.45) {
            const radius = currentWidth / 2;
            const nx = -Math.sin(moveAngle);
            const ny = Math.cos(moveAngle);
            ctx.fillStyle = INK_COLOR;
            ctx.beginPath();
            ctx.moveTo(currentX + nx * radius, currentY + ny * radius);
            ctx.lineTo(currentX + nx * radius * 1.26, currentY + ny * radius * 1.15); 
            ctx.lineTo(currentX - nx * radius, currentY - ny * radius);
            ctx.closePath();
            ctx.fill();
        }

        lastAngle = moveAngle;
    }

    // 【終極解決方案：強制全數據清空焊接】
    function stopDrawing() {
        if (!isPainting) return;

        if (points.length > 0) {
            ctx.strokeStyle = INK_COLOR;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. 【破壞斷層死穴的核心】：
            // 不管 points 裡面因為沒湊滿 3 個點剩下了多少軌跡，提筆瞬間一律「強制全部用直線一條拉通畫出來」
            // 並且強行一路連線連到手指最後離開螢幕的真實物理點(lastRawX/Y)，不留任何時空漏洞！
            let lastDrawnPt = points[points.length - 1];
            ctx.lineWidth = currentWidth;

            if (points.length > 1) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineTo(lastRawX, lastRawY);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(lastDrawnPt.x, lastDrawnPt.y);
                ctx.lineTo(lastRawX, lastRawY);
                ctx.stroke();
            }

            // 2. 確定出鋒的絕對無縫起點
            let startX = lastRawX;
            let startY = lastRawY;

            // 3. 順暢地延展拋物線利芒
            if (lastAngle !== null && currentWidth > MIN_WIDTH * 1.1) {
                let tailX = startX;
                let tailY = startY;
                let tailW = currentWidth;
                const steps = 18; 

                for (let k = 1; k <= steps; k++) {
                    const ratio = k / steps;
                    const curveFactor = 1.0 - Math.pow(ratio, 0.6); 
                    const nextW = MIN_WIDTH + (currentWidth - MIN_WIDTH) * curveFactor;

                    const prevTailX = tailX;
                    const prevTailY = tailY;
                    
                    tailX += Math.cos(lastAngle) * (tailW * 0.16);
                    tailY += Math.sin(lastAngle) * (tailW * 0.16);
                    tailW = nextW;

                    if (tailW < 1.2) {
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(prevTailX, prevTailY);
                        ctx.lineTo(tailX, tailY);
                        ctx.stroke();
                        break;
                    }

                    ctx.lineWidth = tailW;
                    ctx.beginPath();
                    ctx.moveTo(prevTailX, prevTailY);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();
                }
            }
        }

        isPainting = false;
        points = [];
        lastAngle = null;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
</script>
</body>
</html>
