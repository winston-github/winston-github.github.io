<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpertLingo | 頂級冷門語彙學習庫</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --border: rgba(255, 255, 255, 0.1);
            --btn-again: #ef4444; --btn-hard: #f59e0b;
            --btn-good: #10b981; --btn-easy: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-areas: 
                "header header header"
                "sidebar main aside"
                "footer footer footer";
            grid-template-rows: 60px 1fr 40px;
            grid-template-columns: 280px 1fr 380px;
            overflow: hidden;
        }

        /* ========== 1. Top Header (搜尋列) ========== */
        header {
            grid-area: header;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            z-index: 10;
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .search-container { flex: 1; max-width: 500px; position: relative; }
        .search-container input {
            width: 100%; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border);
            background: #0f172a; color: white; outline: none; transition: 0.3s;
        }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        /* ========== 2. Left Sidebar (多層跳轉目錄) ========== */
        nav {
            grid-area: sidebar;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 15px;
        }
        nav::-webkit-scrollbar { width: 5px; }
        nav::-webkit-scrollbar-thumb { background: #475569; }
        
        .category-group { margin-bottom: 10px; }
        .category-title {
            font-size: 0.95rem; font-weight: bold; color: var(--text-sub);
            padding: 10px; cursor: pointer; border-radius: 6px;
            display: flex; justify-content: space-between;
        }
        .category-title:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
        .topic-list { display: none; padding-left: 15px; margin-top: 5px; }
        .topic-item {
            font-size: 0.85rem; padding: 8px 10px; color: #cbd5e1; cursor: pointer; border-radius: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .topic-item:hover, .topic-item.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); }

        /* ========== 3. Center Main (練習核心區塊) ========== */
        main {
            grid-area: main;
            display: flex; justify-content: center; align-items: center;
            perspective: 1500px; padding: 20px; position: relative;
        }
        .flashcard {
            width: 100%; max-width: 500px; height: 60vh; max-height: 500px;
            position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: var(--bg-panel); border-radius: 20px; border: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; padding: 30px;
        }
        .card-front { }
        .card-back { transform: rotateY(180deg); }
        
        .word { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .phonetic { font-size: 1.2rem; color: var(--text-sub); margin: 10px 0 20px; font-style: italic; }
        .btn-speak { 
            background: none; border: 2px solid var(--accent); color: var(--accent);
            width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
            transition: 0.3s; box-shadow: 0 0 15px var(--accent-glow); margin-bottom: 20px;
        }
        .btn-speak:hover { background: var(--accent); color: #000; transform: scale(1.1); }
        
        .meaning-huge { font-size: 2rem; font-weight: bold; margin-bottom: 15px; color: var(--accent); }
        .meta-info { font-size: 1rem; color: var(--text-sub); margin-bottom: 20px; }
        
        /* Anki Controls */
        .anki-controls {
            display: flex; width: 100%; gap: 10px; margin-top: auto;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 12px 0; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .anki-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-again { background: var(--btn-again); } .btn-hard { background: var(--btn-hard); }
        .btn-good { background: var(--btn-good); } .btn-easy { background: var(--btn-easy); }
        
        /* ========== 4. Right Aside (背景教學面板) ========== */
        aside {
            grid-area: aside; background: var(--bg-panel); border-left: 1px solid var(--border);
            padding: 20px; overflow-y: auto; opacity: 0; transition: opacity 0.5s;
        }
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 5px; }
        aside::-webkit-scrollbar-thumb { background: #475569; }

        .panel-title { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px;}
        .panel-content { font-size: 1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 25px; }
        
        .dialogue-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent); margin-bottom: 10px;}
        .dialogue-en { font-weight: 500; cursor: pointer; margin-bottom: 5px; color: #fff; transition: color 0.2s; }
        .dialogue-en:hover { color: var(--accent); }
        .dialogue-zh { font-size: 0.9rem; color: var(--text-sub); }

        /* ========== 5. Bottom Footer (統計資料) ========== */
        footer {
            grid-area: footer; background: #0f172a; border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; font-size: 0.85rem; color: var(--text-sub);
        }
        .stat span { font-weight: bold; color: var(--accent); margin-left: 5px;}

        /* ========== RWD 處理 ========== */
        @media (max-width: 1024px) {
            body { grid-template-areas: "header header" "sidebar main" "footer footer"; grid-template-columns: 250px 1fr; }
            aside { position: absolute; right: -100%; top: 60px; height: calc(100vh - 100px); width: 300px; z-index: 20; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
            aside.active.mobile-show { right: 0; }
        }
        @media (max-width: 768px) {
            body { grid-template-areas: "header" "main" "footer"; grid-template-columns: 1fr; }
            nav { position: absolute; left: -100%; top: 60px; height: calc(100vh - 100px); width: 250px; z-index: 20; }
        }
    </style>
</head>

                    </div>
                    <div class="topic-list" id="menu-${index}">
                        ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.id}')">${t.title}</div>`).join('')}
                    </div>
                `;
                nav.appendChild(groupDiv);
            });
        }

        function toggleSubMenu(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // 搜尋過濾
        function filterTopics(keyword) {
            const items = document.querySelectorAll('.topic-item');
            items.forEach(item => {
                if(item.innerText.toLowerCase().includes(keyword.toLowerCase())) {
                    item.style.display = 'block';
                    item.parentElement.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ------------------------------------------------------------
        // 核心邏輯：載入 JSON 與 Anki 佇列
        // ------------------------------------------------------------
        async function loadTopic(id) {
            // 實際環境中，會根據 id fetch 對應的 JSON
            // 這裡模擬只提供 topic001.json
            if(id !== '001') {
                alert(`⚠️ 在完整系統中，將去伺服器讀取 topic${id}.json。現在為展示架構，僅載入 001。`);
                return;
            }

            try {
                const res = await fetch(`topic${id}.json`);
                currentData = await res.json();
                
                document.getElementById('stat-topic').innerText = currentData.title;
                buildQueue();
                renderCard();
            } catch (e) {
                console.error("無法載入 JSON。請確保使用 Local Server 環境。", e);
                alert("無法載入 topic001.json。請確認使用 Web Server (如 Live Server) 開啟。");
            }
        }

        function buildQueue() {
            const now = Date.now();
            learningQueue = currentData.items.filter(item => {
                const rec = srsDB[item.id];
                return !rec || rec.nextReview <= now;
            });
            if(learningQueue.length === 0) learningQueue = [...currentData.items]; // 演示用
            
            currentIndex = 0;
            document.getElementById('stat-queue').innerText = learningQueue.length;
        }

        // ------------------------------------------------------------
        // UI 渲染與互動
        // ------------------------------------------------------------
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                alert("🎉 本章節待複習卡片已清空！");
                buildQueue();
                return;
            }
            const item = learningQueue[currentIndex];
            const card = document.getElementById('flashcard');
            const aside = document.getElementById('right-panel');
            
            // 恢復卡片狀態
            card.classList.remove('flipped');
            aside.classList.remove('active');

            // 正面
            document.getElementById('front-word').innerText = item.word;
            document.getElementById('front-phonetic').innerText = item.phonetic;

            // 背面 (Flashcard 中心)
            document.getElementById('back-meaning').innerText = item.zh_tw_meaning;
            document.getElementById('back-meta').innerText = `${item.part_of_speech} | 變體: ${item.variations.length>0 ? item.variations.join(', ') : '無'}`;

            // 右側面板 (深度知識)
            document.getElementById('panel-bg').innerText = item.background_knowledge;
            document.getElementById('panel-context').innerText = item.context_of_use;
            
            const phtml = item.phrases.map(p => `<strong>${p.en}</strong>: ${p.zh}`).join('<br>');
            document.getElementById('panel-phrases').innerHTML = phtml;

            const dhtml = item.dialogues.map(d => `
                <div class="dialogue-box">
                    <div class="dialogue-en" onclick="speakText('${d.en.replace(/'/g, "\\'")}')">
                        ${d.speaker}: ${d.en} 🔊
                    </div>
                    <div class="dialogue-zh">${d.zh}</div>
                </div>
            `).join('');
            document.getElementById('panel-dialogue').innerHTML = dhtml;

            document.getElementById('stat-queue').innerText = (learningQueue.length - currentIndex);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.add('flipped');
            document.getElementById('right-panel').classList.add('active'); // 翻開後顯示右側資料
        }

        // ------------------------------------------------------------
        // 語音引擎 (TTS)
        // ------------------------------------------------------------
        function speakCurrent(e) {
            e.stopPropagation();
            if(!learningQueue[currentIndex]) return;
            speakText(learningQueue[currentIndex].word);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US'; utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        // ------------------------------------------------------------
        // SRS 間隔重複演算法 (簡化 SuperMemo-2)
        // ------------------------------------------------------------
        function processSRS(e, quality) {
            e.stopPropagation();
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.id] || { interval: 0, reps: 0, ease: 2.5 };

            if(quality === 0) {
                rec.reps = 0; rec.interval = 1;
            } else {
                if(rec.reps === 0) rec.interval = (quality===1)?12*60 : (quality===2)?2*24*60 : 4*24*60;
                else if(rec.reps === 1) rec.interval = 6*24*60;
                else rec.interval = Math.round(rec.interval * rec.ease);
                rec.reps++;
            }
            rec.ease = Math.max(1.3, rec.ease + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02)));
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            
            srsDB[item.id] = rec;
            localStorage.setItem('expertLingoSRS', JSON.stringify(srsDB));

            currentIndex++;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            setTimeout(renderCard, 300);
        }

        // Mobile Menu Toggle
        function toggleMenu() {
            const nav = document.getElementById('sidebar');
            nav.style.left = nav.style.left === '0px' ? '-100%' : '0px';
        }
    </script>
</body>
</html>
