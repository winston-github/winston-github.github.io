<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 頂級冷門語彙學習庫</title>
    <style>
        :root {
            --bg-base: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3); --border: rgba(255, 255, 255, 0.1);
            --btn-again: #ef4444; --btn-hard: #f59e0b; --btn-good: #10b981; --btn-easy: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh;
            display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: 280px 1fr 380px;
            transition: grid-template-columns 0.3s;
        }

        /* 若隱藏側邊欄的狀態 */
        body.sidebar-closed { grid-template-columns: 0px 1fr 380px; }
        body.aside-closed { grid-template-columns: 280px 1fr 0px; }
        body.focus-mode { grid-template-columns: 0px 1fr 0px; }

        /* ========== 1. Top Header ========== */
        header { grid-area: header; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 30; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin-right: 20px; cursor: pointer;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-right: 20px; }
        
        /* ========== 2. Left Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: 0.3s; }
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.95rem; font-weight: bold; color: var(--accent); padding: 10px; cursor: pointer; border-radius: 6px; margin-top: 5px; background: rgba(255,255,255,0.05);}
        .topic-list { display: none; padding-left: 10px; margin-top: 5px; }
        .topic-item { font-size: 0.85rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; }
        .topic-item:hover { background: rgba(56, 189, 248, 0.2); }

        /* ========== 3. Main Area (2 Views) ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        
        /* View A: Center Catalog (視覺中心首頁) */
        #view-catalog { padding: 30px; display: block; max-width: 1200px; margin: 0 auto; }
        .catalog-header { font-size: 2rem; margin-bottom: 20px; text-align: center; color: #fff; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: 0.2s; }
        .catalog-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 5px 15px var(--accent-glow); }
        .cat-badge { font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .cat-title { font-size: 1.1rem; font-weight: bold; }

        /* View B: Flashcard Study */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 1500px; padding: 20px; }
        .flashcard { width: 100%; max-width: 600px; height: 75vh; max-height: 650px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.4); padding: 30px; overflow-y: auto; }
        .card-face::-webkit-scrollbar { width: 4px; } .card-face::-webkit-scrollbar-thumb { background: #475569; }
        .card-front { justify-content: center; align-items: center; text-align: center; }
        .card-back { transform: rotateY(180deg); text-align: left; align-items: stretch; justify-content: flex-start; }

        /* Flashcard Content */
        .word { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;}
        .phonetic { font-size: 1.2rem; color: var(--text-sub); margin-bottom: 25px; font-style: italic; }
        .btn-speak { background: none; border: 2px solid var(--accent); color: var(--accent); width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px var(--accent-glow); margin: 0 auto;}
        .btn-speak:hover { background: var(--accent); color: #000; transform: scale(1.1); }

        /* Card Back (視覺中心放置片語與外部連結) */
        .meaning-huge { font-size: 1.8rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        .meta-info { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .section-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;}
        
        .center-phrases { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 3px solid var(--accent); }
        .center-phrases div { margin-bottom: 8px; font-size: 1.05rem; }
        .center-phrases strong { color: #fff; }

        .external-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .external-links a { text-decoration: none; font-size: 0.85rem; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--text-sub); color: var(--text-main); transition: 0.2s; display: flex; align-items: center; gap: 5px;}
        .external-links a:hover { background: var(--text-sub); color: #000; }
        .external-links a.btn-wiki:hover { background: #fff; border-color:#fff;}
        .external-links a.btn-google:hover { background: #4285F4; border-color:#4285F4; color:#fff;}

        .anki-controls { display: flex; width: 100%; gap: 10px; margin-top: auto; padding-top: 20px; opacity: 0; pointer-events: none; transition: 0.3s; }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 12px 0; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .anki-btn:active { transform: scale(0.95); }
        .btn-again { background: var(--btn-again); } .btn-hard { background: var(--btn-hard); }
        .btn-good { background: var(--btn-good); } .btn-easy { background: var(--btn-easy); }

        /* View C: Finish Screen */
        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .finish-icon { font-size: 4rem; margin-bottom: 20px; }
        .recommend-box { background: var(--bg-panel); border: 1px solid var(--accent); padding: 30px; border-radius: 15px; margin-top: 30px; max-width: 500px; box-shadow: 0 0 20px var(--accent-glow);}
        .recommend-btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }

        /* ========== 4. Right Aside (Background) ========== */
        aside { grid-area: aside; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 25px; overflow-y: auto; opacity: 0; transition: opacity 0.4s; }
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 4px; } aside::-webkit-scrollbar-thumb { background: #475569; }
        .aside-content { font-size: 1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 25px; }
        .dialogue-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);}
        .dialogue-en { font-weight: 500; cursor: pointer; margin-bottom: 5px; color: #fff; transition: 0.2s; display:flex; justify-content: space-between;}
        .dialogue-en:hover { color: var(--accent); }
        .dialogue-zh { font-size: 0.9rem; color: var(--text-sub); }

        /* ========== 5. Footer Stats ========== */
        footer { grid-area: footer; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.85rem; color: var(--text-sub); z-index: 30;}
        .stat span { font-weight: bold; color: var(--accent); margin-left: 5px;}

        /* ========== RWD ========== */
        @media (max-width: 1024px) {
            body { grid-template-areas: "header header" "main aside" "footer footer"; grid-template-columns: 1fr 300px; }
            nav { position: absolute; left: -100%; top: 60px; height: calc(100vh - 100px); width: 280px; z-index: 40; box-shadow: 5px 0 15px rgba(0,0,0,0.5);}
            body.sidebar-open nav { left: 0; }
        }
        @media (max-width: 768px) {
            body { grid-template-areas: "header" "main" "footer"; grid-template-columns: 1fr; }
            aside { position: absolute; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; z-index: 20; }
            body.aside-mobile-open aside { right: 0; }
            .flashcard { height: 65vh; }
            .word { font-size: 2.5rem; }
        }
    </style>
</head>
<body class="focus-mode"> <!-- 預設隱藏左右側邊欄，專注中央目錄 -->

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <div style="flex:1"></div>
        <div id="header-topic-title" style="color:var(--text-main); font-weight:bold; display:none;"></div>
    </header>

    <nav id="sidebar">
        <!-- JS 動態生成 -->
    </nav>

    <main>
        <!-- 視圖 A: 首頁 100 個主題的 Grid 選單 -->
        <div id="view-catalog">
            <h1 class="catalog-header">請選擇今日深造領域</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <!-- 視圖 B: 核心學習卡片區 -->
        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="word" id="front-word">Loading</div>
                    <div class="phonetic" id="front-phonetic"></div>
                    <button class="btn-speak" id="btn-front-speak" onclick="speakCurrent(event)">🔊</button>
                    <div style="font-size:0.85rem; color:var(--text-sub); position:absolute; bottom:20px;">點擊卡片翻面查閱核心用法</div>
                </div>
                
                <div class="card-face card-back">
                    <div class="meaning-huge" id="back-meaning">Meaning</div>
                    <div class="meta-info" id="back-meta"></div>
                    
                    <!-- 視覺中心：片語與俚語 -->
                    <div class="section-label">實戰片語與俚語 (Core Phrases)</div>
                    <div class="center-phrases" id="back-phrases"></div>

                    <!-- 視覺中心：外部字典快速跳轉 -->
                    <div class="section-label">外部查詢 (External Links)</div>
                    <div class="external-links" id="back-links"></div>

                    <div class="anki-controls" onclick="event.stopPropagation()">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">重來</button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">困難</button>
                        <button class="anki-btn btn-good" onclick="processSRS(2)">良好</button>
                        <button class="anki-btn btn-easy" onclick="processSRS(3)">簡單</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 視圖 C: 完成與隨機推薦 -->
        <div id="view-finish">
            <div class="finish-icon">🏆</div>
            <h2 style="color:var(--accent);">本章節卡片已全數清空！</h2>
            <p style="color:var(--text-sub); margin-top:10px;">強大的詞彙庫需要時間沉澱，我們下次見。</p>
            
            <div class="recommend-box">
                <div class="section-label">AI 演算法推薦下一個冷門主題</div>
                <h3 id="recommend-title" style="margin: 15px 0; font-size:1.5rem;">載入中...</h3>
                <button class="recommend-btn" onclick="startRecommendedTopic()">立即開始挑戰</button>
            </div>
            <button style="margin-top:20px; background:none; border:none; color:var(--text-sub); cursor:pointer; text-decoration:underline;" onclick="goHome()">返回主題目錄</button>
        </div>
    </main>

    <!-- 右側：深度背景知識與對話 -->
    <aside id="right-panel">
        <div class="section-label">深度背景知識 (Background)</div>
        <div class="aside-content" id="panel-bg"></div>

        <div class="section-label">精準使用時機 (Context)</div>
        <div class="aside-content" id="panel-context"></div>

        <div class="section-label">情境對話 (點擊發音)</div>
        <div id="panel-dialogue"></div>
    </aside>

    <footer>
        <div class="stat">佇列進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        // ------------------------------------------------------------
        // 1. 完整 100 主題資料清單 (整合為陣列以利亂數選取)
        // ------------------------------------------------------------
        const catalogData =[
            { group: "哲學與人文", topics:[ {id:'001', title:"1. 歐陸哲學與現象學"}, {id:'004', title:"4. 修辭學與古典辯論"}, {id:'005', title:"5. 邏輯與分析哲學謬誤"}, {id:'019', title:"19. 精神分析與深度心理學"} ] },
            { group: "法政與社會", topics:[ {id:'002', title:"2. 英美法系程序與令狀"}, {id:'011', title:"11. 地緣政治與戰略情報"}, {id:'028', title:"28. 博弈論與決策分析"}, {id:'043', title:"43. 非法經濟與洗錢防制"} ] },
            { group: "資訊與密碼學", topics:[ {id:'021', title:"21. 密碼學與零知識證明"}, {id:'045', title:"45. 數位鑑識與駭客攻防"}, {id:'067', title:"67. 系統架構與分散式邏輯"}, {id:'074', title:"74. 後量子密碼學"} ] },
            { group: "生物與醫學", topics:[ {id:'006', title:"6. 神經科學與認知障礙"}, {id:'017', title:"17. 演化生物學與分類學"}, {id:'026', title:"26. 毒物學與藥代動力學"}, {id:'087', title:"87. 基因編輯與合成生物學"} ] }
            // 由於篇幅限制，此處僅放部分做演示，可隨時擴充至 100 個
        ];

        const flatTopics = catalogData.flatMap(c => c.topics);

        // ------------------------------------------------------------
        // 系統狀態
        // ------------------------------------------------------------
        let currentTopicData = null;
        let learningQueue =[];
        let currentIndex = 0;
        let srsDB = JSON.parse(localStorage.getItem('expertLingoSRS_v2')) || {};
        let recommendedTopicId = null;

        // 初始化
        window.onload = () => {
            renderCatalog();
            renderSidebar();
            goHome();
        };

        // ------------------------------------------------------------
        // UI 切換邏輯
        // ------------------------------------------------------------
        function goHome() {
            document.body.className = 'focus-mode'; // 隱藏左右側邊欄
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            updateStats(0, 0);
        }

        function toggleSidebar() {
            if(document.body.classList.contains('sidebar-open')) {
                document.body.classList.remove('sidebar-open');
            } else {
                document.body.classList.add('sidebar-open');
                document.body.classList.remove('focus-mode');
            }
        }

        // 渲染首頁中央 100 主題
        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            catalogData.forEach(cat => {
                cat.topics.forEach(t => {
                    grid.innerHTML += `
                        <div class="catalog-card" onclick="loadTopic('${t.id}', '${t.title}')">
                            <div class="cat-badge">${cat.group}</div>
                            <div class="cat-title">${t.title}</div>
                        </div>
                    `;
                });
            });
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar');
            nav.innerHTML = catalogData.map((cat, i) => `
                <div class="category-title" onclick="document.getElementById('menu-${i}').style.display = document.getElementById('menu-${i}').style.display==='block'?'none':'block'">
                    ${cat.group} ▼
                </div>
                <div class="topic-list" id="menu-${i}">
                    ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.id}', '${t.title}')">${t.title}</div>`).join('')}
                </div>
            `).join('');
        }

        // ------------------------------------------------------------
        // 核心：載入主題與學習佇列
        // ------------------------------------------------------------
        async function loadTopic(id, title) {
            if(id !== '001') {
                alert(`⚠️ 在真實環境會抓取 topic${id}.json。現演示預設載入 Topic 001。`);
                id = '001'; 
            }

            try {
                const res = await fetch(`topic${id}.json`);
                currentTopicData = await res.json();
                
                // 切換介面：隱藏首頁，打開學習區，設定左右欄 Layout
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-finish').style.display = 'none';
                document.getElementById('view-study').style.display = 'flex';
                document.getElementById('header-topic-title').innerText = currentTopicData.title;
                document.getElementById('header-topic-title').style.display = 'block';
                
                document.body.className = ''; // 恢復三欄式 (預設隱藏右側，直到翻卡)
                document.body.classList.add('aside-closed'); // 一開始關閉右側
                if(window.innerWidth <= 1024) document.body.classList.remove('sidebar-open');

                buildQueue();
            } catch (e) {
                alert("無法載入 JSON。請確認在 Web Server 下執行。");
            }
        }

        function buildQueue() {
            const now = Date.now();
            learningQueue = currentTopicData.items.filter(item => {
                const rec = srsDB[item.id];
                return !rec || rec.nextReview <= now;
            });

            // 測試用：如果已學完，強制塞入
            if(learningQueue.length === 0) learningQueue = [...currentTopicData.items];

            currentIndex = 0;
            renderCard();
        }

        // ------------------------------------------------------------
        // 卡片渲染與互動
        // ------------------------------------------------------------
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                showFinishScreen();
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            document.body.classList.add('aside-closed'); // 關閉右邊欄

            // 正面
            document.getElementById('front-word').innerText = item.word;
            document.getElementById('front-phonetic').innerText = item.phonetic;

            // 背面 - 視覺中心
            document.getElementById('back-meaning').innerText = item.zh_tw_meaning;
            document.getElementById('back-meta').innerText = `${item.part_of_speech} | 變體: ${item.variations.join(', ') || '無'}`;
            
            document.getElementById('back-phrases').innerHTML = item.phrases.map(p => `
                <div><strong>${p.en}</strong><br><span style="color:var(--text-sub);font-size:0.9rem;">${p.zh}</span></div>
            `).join('');

            // 建立外部連結按鈕
            const searchStr = encodeURIComponent(item.word);
            document.getElementById('back-links').innerHTML = `
                <a href="https://en.wikipedia.org/wiki/Special:Search?search=${searchStr}" target="_blank" class="btn-wiki">🌐 Wiki</a>
                <a href="https://www.google.com/search?q=${searchStr}+meaning" target="_blank" class="btn-google">🔍 Google</a>
                <a href="https://dictionary.cambridge.org/dictionary/english/${searchStr}" target="_blank">📖 Dictionary</a>
            `;

            // 右側面板 - 深度教學
            document.getElementById('panel-bg').innerText = item.background_knowledge;
            document.getElementById('panel-context').innerText = item.context_of_use;
            
            document.getElementById('panel-dialogue').innerHTML = item.dialogues.map(d => `
                <div class="dialogue-box">
                    <div class="dialogue-en" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span>${d.speaker}: ${d.en}</span> <span>🔊</span>
                    </div>
                    <div class="dialogue-zh">${d.zh}</div>
                </div>
            `).join('');

            updateStats();
        }

        function flipCard() {
            document.getElementById('flashcard').classList.add('flipped');
            document.body.classList.remove('aside-closed'); // 打開右邊欄的網格空間
            
            // 延遲一點點讓右側內容 Fade-in
            setTimeout(() => {
                document.getElementById('right-panel').classList.add('active'); 
                if(window.innerWidth <= 768) document.body.classList.add('aside-mobile-open');
            }, 100);
        }

        // ------------------------------------------------------------
        // 精確的 TTS 語音綁定
        // ------------------------------------------------------------
        function speakCurrent(e) {
            e.stopPropagation();
            if(!learningQueue[currentIndex]) return;
            // 確保唸出的是「當下畫面上顯示的單字」，防止 index 先行跳動
            const textToSpeak = document.getElementById('front-word').innerText;
            speakExactText(textToSpeak, e);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 確實打斷上一句話
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US'; 
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        // ------------------------------------------------------------
        // SRS 與統計資料同步
        // ------------------------------------------------------------
        function processSRS(quality) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.id] || { interval: 0, reps: 0, ease: 2.5 };

            if(quality === 0) {
                rec.reps = 0; rec.interval = 1;
            } else {
                if(rec.reps === 0) rec.interval = (quality===1)?12*60 : (quality===2)?2*24*60 : 4*24*60;
                else if(rec.reps === 1) rec.interval = 6*24*60;
                else rec.interval = Math.round(rec.interval * rec.ease);
                rec.reps++;
            }
            rec.ease = Math.max(1.3, rec.ease + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02)));
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            
            srsDB[item.id] = rec;
            localStorage.setItem('expertLingoSRS_v2', JSON.stringify(srsDB));

            currentIndex++;
            updateStats(); // 在翻頁前就確實更新數字
            
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            if(window.innerWidth <= 768) document.body.classList.remove('aside-mobile-open');

            setTimeout(renderCard, 300);
        }

        function updateStats() {
            const total = learningQueue.length;
            const remain = total - currentIndex;
            // 解決數字失真：嚴格計算
            document.getElementById('stat-queue').innerText = Math.max(0, remain);
            document.getElementById('stat-progress').innerText = `${Math.min(currentIndex, total)} / ${total}`;
        }

        // ------------------------------------------------------------
        // 偽亂數推薦下一個主題
        // ------------------------------------------------------------
        function showFinishScreen() {
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'flex';
            document.body.className = 'focus-mode'; // 隱藏所有側欄

            // 過濾掉目前的主題
            const availableTopics = flatTopics.filter(t => t.id !== currentTopicData.topic_id);
            const randomTopic = availableTopics[Math.floor(Math.random() * availableTopics.length)];
            
            recommendedTopicId = randomTopic.id;
            document.getElementById('recommend-title').innerText = randomTopic.title;
        }

        function startRecommendedTopic() {
            const target = flatTopics.find(t => t.id === recommendedTopicId);
            if(target) loadTopic(target.id, target.title);
        }

    </script>
</body>
