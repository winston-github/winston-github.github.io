<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 極速心流引擎</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #05080f; --bg-panel: #0b111a; --bg-inner: #070a12;
            --text-main: #f8fafc; --text-sub: #94a3b8; --text-mut: #475569;
            --accent: #38bdf8; --border: rgba(255, 255, 255, 0.05);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            --sidebar-w: 280px; --aside-w: 380px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: var(--sidebar-w) 1fr var(--aside-w); 
            transition: grid-template-columns var(--transition);
        }

        body.hide-sidebar { --sidebar-w: 0px; } body.hide-aside { --aside-w: 0px; }
        .serif { font-family: var(--font-serif); }

        #top-progress-bar { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; z-index: 9999; transition: width 0.3s ease-out; }

        /* ========== 無痕點讀 (拔除虛線，改用微光背景) ========== */
        .en-click { cursor: pointer; display: inline-block; transition: var(--transition); border-radius: 4px; padding: 0 2px;}
        .en-click:hover { color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        /* 挖空提取 */
        .cloze-blank { display: inline-block; min-width: 80px; padding: 0 10px; margin: 0 4px; border-bottom: 2px solid var(--text-mut); color: transparent; cursor: pointer; transition: var(--transition); user-select: none; position: relative;}
        .cloze-blank:hover { border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
        .cloze-revealed { color: var(--accent); background: transparent; border-bottom: none; font-weight: bold; font-size: 1.05em; padding: 0;}

        /* ========== Header ========== */
        header { grid-area: header; background: var(--bg-base); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 25px; z-index: 50; }
        .logo { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-right: 30px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase;}
        .menu-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.9rem; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px; margin-right: 20px;}
        .menu-btn:hover { color: var(--accent); }
        
        .btn-global-review { margin-left: 20px; background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 4px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px;}
        .btn-global-review.has-review { background: rgba(239, 68, 68, 0.05); color: #ef4444; border-color: #ef4444; }
        .btn-global-review.has-review:hover { background: #ef4444; color: #fff; }
        #header-topic-title { color:var(--text-sub); font-size: 0.9rem; margin-left:auto; display: none; font-weight: 500; letter-spacing: 1px;}

        /* ========== Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-inner); border-right: 1px solid var(--border); overflow-y: auto; padding: 25px 20px; transition: var(--transition); position: relative; z-index: 40;}
        nav::-webkit-scrollbar { width: 3px; } nav::-webkit-scrollbar-thumb { background: var(--text-mut); }
        .category-title { font-size: 0.7rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 2px; padding: 0 10px; margin-bottom: 10px; margin-top: 20px;}
        .topic-list { margin-bottom: 20px; }
        .topic-item { font-size: 0.95rem; padding: 10px; color: var(--text-sub); cursor: pointer; border-radius: 6px; transition: var(--transition); line-height: 1.4;}
        .topic-item:hover { background: var(--bg-panel); color: var(--text-main);}
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.8); z-index: 35; }

        /* ========== Main App Area ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        
        /* 1. View Catalog (Redesigned) */
        #view-catalog { padding: 60px 5%; display: block; max-width: 1000px; margin: 0 auto; }
        .catalog-header { font-size: 2.5rem; margin-bottom: 50px; font-weight: 300; color: #fff; font-family: var(--font-serif);}
        .catalog-grid { display: flex; flex-direction: column; gap: 15px; }
        .catalog-card { background: transparent; border-bottom: 1px solid var(--border); padding: 25px 15px; cursor: pointer; transition: var(--transition); display: flex; justify-content: space-between; align-items: center;}
        .catalog-card:hover { background: rgba(255,255,255,0.02); padding-left: 25px;}
        .cat-info { flex: 1; }
        .cat-badge { font-size: 0.7rem; color: var(--text-mut); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
        .cat-title { font-size: 1.3rem; color: #fff; font-weight: 500;}
        .cat-action { color: var(--accent); font-size: 0.9rem; opacity: 0; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px;}
        .catalog-card:hover .cat-action { opacity: 1; }

        /* 2. View Topic */
        #view-topic { padding: 60px 5%; display: none; max-width: 800px; margin: 0 auto; text-align: center;}
        .topic-title-lg { font-size: 2.5rem; margin-bottom: 15px; color: var(--text-main); font-family: var(--font-serif);}
        .action-buttons { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 50px;}
        .btn-primary, .btn-secondary { border: 1px solid var(--border); padding: 15px 30px; font-size: 0.95rem; border-radius: 8px; cursor: pointer; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
        .btn-primary { background: var(--text-main); color: var(--bg-base); }
        .btn-primary:hover { background: #fff; transform: translateY(-2px);}
        .btn-secondary { background: transparent; color: var(--text-sub); }
        .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }

        /* 3. View Study (Flashcards) */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 2000px; padding: 20px; }
        .flashcard { width: 100%; max-width: 680px; height: 85vh; max-height: 800px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); cursor: default;}
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8); overflow: hidden; }
        
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 4.5rem; margin-bottom: 5px; color:#fff; font-weight: 500;}
        .phonetic-front { font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-size: 1.2rem; color: var(--text-mut); margin-bottom: 30px; font-weight: 300; letter-spacing: 1px;}
        .front-hint { position: absolute; bottom: 35px; font-size: 0.75rem; color: var(--text-mut); letter-spacing: 3px; text-transform: uppercase;}

        .card-back { transform: rotateY(180deg); }
        .back-sticky-header { padding: 25px 30px; background: var(--bg-inner); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; z-index: 10;}
        .back-word { font-size: 2rem; color:#fff; font-weight: 500;}
        .back-phonetic { font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-size: 0.9rem; color: var(--text-mut); margin-left: 15px;}
        .back-meaning { font-size: 1.1rem; color: var(--accent); font-weight: 500;}

        /* Tabs */
        .tab-nav { display: flex; padding: 15px 30px 0 30px; gap: 20px; background: var(--bg-inner); border-bottom: 1px solid var(--border); flex-shrink: 0;}
        .tab-btn { padding: 10px 0; font-size: 0.8rem; font-weight: 600; color: var(--text-mut); cursor: pointer; transition: var(--transition); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 1px;}
        .tab-btn:hover { color: var(--text-sub); }
        .tab-btn.active { color: var(--text-main); border-bottom-color: var(--text-main); }

        .tab-content-wrapper { flex: 1; overflow: hidden; position: relative; background: var(--bg-panel); }
        .tab-pane { position: absolute; top:0; left:0; width:100%; height:100%; padding: 30px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.2s;}
        .tab-pane.active { opacity: 1; pointer-events: auto; }
        .tab-pane::-webkit-scrollbar { width: 3px; } .tab-pane::-webkit-scrollbar-thumb { background: var(--text-mut); }

        .section-title { font-size: 0.7rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 8px;}

        /* Tab 1: Core */
        .ety-breakdown { font-size: 1.2rem; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; padding: 20px; background: var(--bg-base); border-radius: 8px;}
        .ety-part span { color: #fff; font-weight: 500;}
        .ety-part em { color: var(--text-sub); font-style: normal; margin-left: 8px; font-size: 0.85rem; font-family: var(--font-sans);}
        
        .lexical-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .lex-box { padding: 15px; border-left: 2px solid var(--border); }
        .lex-label { font-size: 0.65rem; color: var(--text-mut); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .lex-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .lex-tag { font-size: 0.9rem; color: #cbd5e1; }
        .nuance-box { padding: 15px; border-left: 2px solid var(--border);}
        .nuance-item { margin-bottom: 12px; font-size: 0.95rem; line-height: 1.6; color: var(--text-sub);}
        .nuance-item span.en-click { font-weight: bold; color: #fff; }

        /* Tab 2: Action (Focus Stepper) */
        .focus-outer { display: flex; flex-direction: column; height: 100%;}
        .focus-header-info { text-align: right; font-size: 0.75rem; color: var(--text-mut); margin-bottom: 15px; font-family: monospace;}
        .focus-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto;}
        
        .focus-stage { padding: 25px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; transition: var(--transition); background: var(--bg-base);}
        .focus-stage:hover { border-color: var(--text-mut); }
        .ex-en { font-size: 1.15rem; margin-bottom: 8px; line-height: 1.6; color:#fff;}
        .ex-zh { font-size: 0.95rem; color: var(--text-sub); }
        .ex-speaker { color: var(--text-mut); font-weight: bold; margin-right: 10px; font-size: 0.9rem;}

        /* SRS Buttons (Micro-SRS) */
        .anki-controls { display: flex; border-top: 1px solid var(--border); position: sticky; bottom: 0; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 20; background: var(--bg-base);}
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 20px 0; border: none; border-right: 1px solid var(--border); color: var(--text-sub); font-size: 0.9rem; cursor: pointer; transition: var(--transition); background: transparent; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
        .anki-btn:last-child { border-right: none; }
        .anki-btn:hover { background: var(--bg-panel); color: var(--text-main); }
        .btn-again:hover { box-shadow: inset 0 -3px 0 #ef4444;} 
        .btn-hard:hover { box-shadow: inset 0 -3px 0 #f59e0b;} 
        .btn-easy:hover { box-shadow: inset 0 -3px 0 #10b981;}

        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* ========== Right Aside (Context & Links) ========== */
        aside { grid-area: aside; background: var(--bg-inner); border-left: 1px solid var(--border); overflow: hidden; position: relative; z-index: 20;}
        .aside-scroll { padding: 30px; height: 100%; overflow-y: auto; display: flex; flex-direction: column;}
        .aside-scroll::-webkit-scrollbar { width: 3px; } .aside-scroll::-webkit-scrollbar-thumb { background: var(--text-mut); }
        .aside-block { margin-bottom: 40px; }
        .aside-content { font-size: 0.95rem; line-height: 1.8; color: #cbd5e1; }
        
        #right-panel-overlay { position: absolute; top:0; left:0; width:100%; height:100%; backdrop-filter: blur(15px); background: rgba(5, 8, 15, 0.6); z-index: 10; display: flex; justify-content: center; align-items: center; transition: opacity 0.4s ease-out; opacity: 1;}
        #right-panel-overlay.unlocked { opacity: 0; pointer-events: none; }

        /* External Links (Moved to Aside Bottom) */
        .external-links { margin-top: auto; display: flex; flex-direction: column; gap: 10px;}
        .external-links a { text-decoration: none; font-size: 0.85rem; padding: 12px; border-radius: 6px; color: var(--text-sub); border: 1px solid var(--border); transition: var(--transition); display: flex; justify-content: space-between;}
        .external-links a:hover { border-color: var(--text-mut); color: var(--text-main); background: rgba(255,255,255,0.02);}

        footer { grid-area: footer; background: var(--bg-base); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; font-size: 0.75rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 1px;}

        @media (max-width: 1024px) {
            :root { --sidebar-w: 0px; }
            nav { position: fixed; left: -280px; width: 280px; height: calc(100vh - 60px); top: 60px; }
            body.show-mobile-sidebar nav { left: 0; }
            body.show-mobile-sidebar #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            :root { --aside-w: 0px; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; transition: right 0.3s;}
            body.show-mobile-aside aside { right: 0; }
        }
    </style>
</head>
<body class="hide-sidebar hide-aside">

    <div id="top-progress-bar"></div>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">Menu</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <button id="btn-global-review" class="btn-global-review" onclick="startGlobalReview()">Review (0)</button>
        <div id="header-topic-title"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar"></nav>

    <main>
        <!-- Layer 1: Catalog -->
        <div id="view-catalog">
            <h1 class="catalog-header">Knowledge Domains</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <!-- Layer 2: Topic -->
        <div id="view-topic">
            <div class="topic-title-lg serif" id="topic-title-display">Title</div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="startStudy()">Enter Flow State</button>
                <button class="btn-secondary" onclick="goHome()">Back</button>
            </div>
        </div>

        <!-- Layer 3: Study Flashcards -->
        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <div class="card-face card-front">
                    <div class="word-front en-click serif" id="front-word" onclick="speakExactText(this.innerText, event)">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <div class="front-hint">Press Space to Reveal</div>
                </div>
                
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    <div class="back-sticky-header">
                        <div style="display:flex; align-items:baseline;">
                            <div class="back-word en-click serif" id="sticky-word" onclick="speakExactText(this.innerText, event)">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                        <div class="back-meaning" id="sticky-meaning">Meaning</div>
                    </div>

                    <div class="tab-nav">
                        <div class="tab-btn active" onclick="switchTab('core')">Core</div>
                        <div class="tab-btn" onclick="switchTab('action')">Action</div>
                    </div>
                    
                    <div class="tab-content-wrapper">
                        <!-- Tab 1: Core -->
                        <div class="tab-pane active" id="tab-core">
                            <div id="back-etymology"></div>
                            <div class="section-title" style="margin-top:20px;">Lexical Relations</div>
                            <div class="lexical-grid" id="lexical-grid"></div>
                            <div id="near-synonyms-container"></div>
                        </div>

                        <!-- Tab 2: Action -->
                        <div class="tab-pane" id="tab-action" style="display:flex; flex-direction:column;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:15px;">
                                <div class="section-title" style="margin:0; border:none;">Focus Stepper</div>
                                <div id="focus-header-info" class="focus-header-info"></div>
                            </div>
                            <div id="focus-wrapper-outer" style="flex:1; overflow:hidden;"></div>
                        </div>
                    </div>

                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">忘記 (1m)</button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">模糊 (5m)</button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">掌握 (10m)</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-finish">
            <h2 style="margin-bottom:30px; color:#fff; font-weight:300; font-family:var(--font-serif); font-size:2rem;">Session Complete</h2>
            <button style="background:transparent; border:1px solid var(--text-mut); color:var(--text-main); padding: 12px 25px; border-radius:6px; cursor:pointer; text-transform:uppercase; letter-spacing:1px; font-size:0.85rem;" onclick="goHome()">Return to Catalog</button>
        </div>
    </main>

    <aside id="right-panel">
        <div id="right-panel-overlay"></div>
        <div class="aside-scroll">
            <div class="aside-block">
                <div class="section-title">Background</div>
                <div class="aside-content" id="panel-bg"></div>
            </div>
            <div class="aside-block">
                <div class="section-title">Usage Context</div>
                <div class="aside-content" id="panel-context"></div>
            </div>
            <!-- 外部連結移至這裡 -->
            <div class="external-links" id="back-links"></div>
        </div>
    </aside>

    <footer>
        <div class="stat">Progress: <span id="stat-progress" style="color:var(--text-main); font-weight:bold;">0 / 0</span></div>
        <div class="stat">Due: <span id="stat-queue" style="color:var(--text-main); font-weight:bold;">0</span></div>
    </footer>

    <script>
        let catalogData =[]; let currentTopicWords =[]; let cardCache = {}; 
        let learningQueue =[]; let currentIndex = 0;
        
        // 儲存庫
        const SRS_KEY = 'expertLingoSRS_v12';
        let srsDB = JSON.parse(localStorage.getItem(SRS_KEY)) || {};

        let currentExIndex = 0; let currentExStage = 1;

        window.onload = async () => {
            updateGlobalReviewCount();
            await fetchCatalog();
            goHome();
        };

        // --- 全局鍵盤事件 (Arrow Keys 接管) ---
        document.addEventListener('keydown', (e) => {
            if(document.getElementById('view-study').style.display !== 'flex') return;
            const card = document.getElementById('flashcard');
            
            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (card.classList.contains('flipped')) {
                if (e.key === '1') { e.preventDefault(); processSRS(0); }
                else if (e.key === '2') { e.preventDefault(); processSRS(1); }
                else if (e.key === '3') { e.preventDefault(); processSRS(2); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); changeEx(-1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); changeEx(1); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); changeStage(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); changeStage(-1); }
            }
        });

        // --- Layout & Tabs ---
        function toggleSidebar() {
            if(window.innerWidth > 1024) document.body.classList.toggle('hide-sidebar');
            else document.body.classList.toggle('show-mobile-sidebar');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // --- Core Functions ---
        function updateGlobalReviewCount() {
            const now = Date.now(); let count = 0;
            for(let key in srsDB) { if(srsDB[key].nextReview <= now && srsDB[key].card_file) count++; }
            const btn = document.getElementById('btn-global-review');
            btn.innerText = `Review (${count})`;
            if(count > 0) btn.classList.add('has-review'); else btn.classList.remove('has-review');
        }

        async function startGlobalReview() {
            const now = Date.now(); let dueFiles =[];
            for(let key in srsDB) { if(srsDB[key].nextReview <= now && srsDB[key].card_file) dueFiles.push(srsDB[key].card_file); }
            if(dueFiles.length === 0) { alert("無須複習。"); return; }
            
            document.getElementById('view-catalog').style.display = 'none';
            document.getElementById('view-topic').style.display = 'none';
            
            learningQueue =[];
            for(let file of dueFiles) {
                try {
                    let res = await fetch(file); let card = await res.json();
                    card.card_file = file; learningQueue.push(card);
                } catch(e) {}
            }
            learningQueue.sort(() => Math.random() - 0.5); 
            document.getElementById('header-topic-title').innerText = `Review Session (${learningQueue.length})`;
            document.getElementById('header-topic-title').style.display = 'block';
            document.getElementById('view-study').style.display = 'flex';
            document.body.classList.add('hide-sidebar', 'hide-aside');
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
            currentIndex = 0; renderCard();
        }

        async function fetchCatalog() {
            try {
                const res = await fetch('index.json'); const data = await res.json();
                catalogData = data.catalog;
                document.getElementById('sidebar').innerHTML = catalogData.map((cat, i) => `
                    <div class="category-title">${cat.group_name}</div>
                    <div class="topic-list">${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">${t.title_zh}</div>`).join('')}</div>
                `).join('');
                document.getElementById('catalog-grid').innerHTML = catalogData.map(cat => cat.topics.map(t => `
                    <div class="catalog-card" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">
                        <div class="cat-info">
                            <div class="cat-badge">${cat.group_name}</div>
                            <div class="cat-title">${t.title_en}</div>
                        </div>
                        <div class="cat-action">Enter ➔</div>
                    </div>`).join('')).join('');
            } catch (e) {}
        }

        function goHome() {
            document.body.classList.remove('hide-sidebar'); document.body.classList.add('hide-aside'); 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
        }

        async function loadTopic(fileName, titleDisplay) {
            try {
                const res = await fetch(fileName); const topicData = await res.json();
                currentTopicWords = topicData.words;
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-topic').style.display = 'block';
                document.getElementById('header-topic-title').innerText = titleDisplay;
                document.getElementById('header-topic-title').style.display = 'block';
                document.getElementById('topic-title-display').innerText = topicData.title_en;
                document.body.classList.add('hide-sidebar');
                if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
                preloadCards(currentTopicWords);
            } catch (e) { alert(`無法載入主題包 ${fileName}`); }
        }

        async function preloadCards(words) {
            cardCache = {};
            for (let w of words) {
                try { let res = await fetch(w.card_file); let cardData = await res.json(); cardData.card_file = w.card_file; cardCache[w.word_en] = cardData; } 
                catch(e) {}
            }
        }

        function startStudy() {
            document.getElementById('view-topic').style.display = 'none'; document.getElementById('view-study').style.display = 'flex';
            const now = Date.now(); learningQueue = currentTopicWords.map(w => cardCache[w.word_en]).filter(Boolean); 
            let dueQueue = learningQueue.filter(item => !srsDB[item.word_en] || srsDB[item.word_en].nextReview <= now);
            if(dueQueue.length > 0) learningQueue = dueQueue; 
            currentIndex = 0; renderCard();
        }

        // --- 字串解析與挖空 (Cloze Deletion) ---
        function parseInlineTTS(text) {
            if(!text) return '';
            return text.replace(/\{\{(.*?)\}\}/g, '<span class="en-click" onclick="speakExactText(\'$1\', event)">$1</span>');
        }
        function applyCloze(text, targetWord) {
            if(!text || !targetWord) return text;
            const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapeRegExp(targetWord)})`, 'gi');
            return text.replace(regex, `<span class="cloze-blank" onclick="revealCloze(this, '$1', event)">&nbsp;</span>`);
        }
        window.revealCloze = function(el, word, e) {
            if(e) e.stopPropagation();
            el.className = 'en-click cloze-revealed serif';
            el.innerText = word;
            speakExactText(word);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s]/gi, '')); 
                utter.lang = 'en-US'; utter.rate = 0.95; window.speechSynthesis.speak(utter);
            }
        }

        // --- Render Functions ---
        function renderLexicalWeb(item) {
            let lexHtml = ''; let nearHtml = ''; let etyHtml = '';
            if(item.lexical_relations) {
                const {synonyms:syns, antonyms:ants, near_synonyms:nears} = item.lexical_relations;
                if(syns?.length) lexHtml += `<div class="lex-box"><div class="lex-label">Synonyms</div><div class="lex-tags">${syns.map(s => `<span class="lex-tag en-click" onclick="speakExactText('${s}', event)">${s}</span>`).join('')}</div></div>`;
                if(ants?.length) lexHtml += `<div class="lex-box"><div class="lex-label">Antonyms</div><div class="lex-tags">${ants.map(a => `<span class="lex-tag en-click" onclick="speakExactText('${a}', event)">${a}</span>`).join('')}</div></div>`;
                if(nears?.length) nearHtml = `<div class="nuance-box"><div class="lex-label" style="margin-bottom:10px;">Near-Synonyms</div>${nears.map(n => `<div class="nuance-item"><span class="en-click" onclick="speakExactText('${n.word}', event)">${n.word}</span>：${n.nuance}</div>`).join('')}</div>`;
            }
            document.getElementById('lexical-grid').innerHTML = lexHtml;
            document.getElementById('near-synonyms-container').innerHTML = nearHtml;

            if(item.etymology) {
                etyHtml += `<div class="section-title">Etymology</div><div class="ety-breakdown serif">`;
                etyHtml += item.etymology.breakdown.map(b => `<div class="ety-part"><span class="en-click" onclick="speakExactText('${b.part}', event)">${b.part}</span><em>${b.meaning}</em></div>`).join('<span style="color:var(--text-mut); margin: 0 5px; font-family:var(--font-sans);">+</span>'); 
                if(item.etymology.cognates?.length) etyHtml += `<div style="width:100%; margin-top:8px; font-size:0.85rem; color:var(--text-sub); border-top:1px dashed var(--border); padding-top:8px; font-family:var(--font-sans);">Cognates: ${item.etymology.cognates.map(c => `<span class="en-click serif" style="color:#cbd5e1; margin-right:8px;" onclick="speakExactText('${c}', event)">${c}</span>`).join('')}</div>`;
                etyHtml += `</div>`;
            }
            document.getElementById('back-etymology').innerHTML = etyHtml;
        }

        function renderFocusMode() {
            const item = learningQueue[currentIndex];
            const containerOuter = document.getElementById('focus-wrapper-outer');
            const infoText = document.getElementById('focus-header-info');
            
            if(!item.example_clusters?.length) { containerOuter.innerHTML = ''; infoText.innerText = ''; return; }

            const total = item.example_clusters.length; const cluster = item.example_clusters[currentExIndex];
            infoText.innerText = `Context: ${currentExIndex + 1} / ${total} | Stage: ${currentExStage}/3`;
            const targetWord = item.word_en;

            let html = `<div class="focus-outer"><div class="focus-container">`;

            // Stage 1: Phrase
            html += `<div class="focus-stage" onclick="speakExactText('${cluster.phrase.en.replace(/'/g, "\\'")}', event)">
                <div class="ex-en">${applyCloze(cluster.phrase.en, targetWord)}</div>
                <div class="ex-zh">${cluster.phrase.zh}</div>
            </div>`;

            // Stage 2: Sentence
            if(currentExStage >= 2) {
                html += `<div class="focus-stage" style="background:rgba(255,255,255,0.02);" onclick="speakExactText('${cluster.sentence.en.replace(/'/g, "\\'")}', event)">
                    <div class="ex-en">${applyCloze(cluster.sentence.en, targetWord)}</div>
                    <div class="ex-zh">${cluster.sentence.zh}</div>
                </div>`;
            }

            // Stage 3: Dialogue
            if(currentExStage >= 3) {
                html += `<div class="focus-stage" style="background:rgba(255,255,255,0.04); cursor:default;" onclick="event.stopPropagation()">`;
                cluster.dialogue.forEach(d => {
                    html += `<div style="margin-bottom:12px; cursor:pointer;" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span class="ex-speaker">${d.speaker}</span><span class="ex-en" style="font-size:0.95rem;">${applyCloze(d.en, targetWord)}</span>
                        <div class="ex-zh">${d.zh}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            html += `</div></div>`;
            containerOuter.innerHTML = html;
        }

        // 鍵盤操控 Logic
        function changeEx(dir) {
            const total = learningQueue[currentIndex].example_clusters.length;
            currentExIndex = Math.max(0, Math.min(total - 1, currentExIndex + dir));
            currentExStage = 1; renderFocusMode();
        }
        function changeStage(dir) {
            currentExStage = Math.max(1, Math.min(3, currentExStage + dir));
            renderFocusMode();
        }

        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                document.getElementById('view-study').style.display = 'none';
                document.getElementById('view-finish').style.display = 'flex';
                document.body.classList.add('hide-aside');
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel-overlay').classList.remove('unlocked');
            
            document.body.classList.add('hide-aside');
            if(window.innerWidth <= 768) document.body.classList.remove('show-mobile-aside');

            currentExIndex = 0; currentExStage = 1;
            document.getElementById('tab-core').classList.add('active');
            document.getElementById('tab-action').classList.remove('active');
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.remove('active');

            document.getElementById('front-word').innerText = item.word_en;
            document.getElementById('front-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-word').innerText = item.word_en;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-meaning').innerText = item.word_zh;
            
            renderLexicalWeb(item); renderFocusMode();

            // 外部連結移至 Aside
            const q = encodeURIComponent(item.word_en);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${q}/english" target="_blank">YouGlish 實境</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${q}" target="_blank">Wiktionary 詞典</a>
                <a href="https://www.google.com/search?q=${q}+meaning" target="_blank">Google 查詢</a>
            `;

            document.getElementById('panel-bg').innerHTML = parseInlineTTS(item.background);
            document.getElementById('panel-context').innerHTML = parseInlineTTS(item.context);
            updateStats();

            // ★ 雙重聽覺衝擊：卡片出現即發音
            speakExactText(item.word_en);
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            document.getElementById('right-panel-overlay').classList.add('unlocked');
            if(window.innerWidth <= 768) document.body.classList.add('show-mobile-aside');
            
            // ★ 雙重聽覺衝擊：翻卡瞬間再發音一次
            speakExactText(learningQueue[currentIndex].word_en);
        }

        function processSRS(qIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.word_en] || { interval: 0, reps: 0 };
            if(item.card_file) rec.card_file = item.card_file;

            // ★ 急速記憶引擎：改為分鐘級別 (1m, 5m, 10m)
            if(qIndex === 0) { rec.reps = 0; rec.interval = 1; }
            else if(qIndex === 1) { rec.reps++; rec.interval = 5; }
            else { rec.reps++; rec.interval = 10; }
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.word_en] = rec;
            localStorage.setItem(SRS_KEY, JSON.stringify(srsDB));

            currentIndex++; updateStats(); updateGlobalReviewCount(); 
            
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                renderCard();
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 250);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            document.getElementById('top-progress-bar').style.width = `${(currentIndex / total) * 100}%`;
            document.querySelector('.stat span:first-child').innerText = `${Math.min(currentIndex, total)} / ${total}`;
            document.getElementById('stat-queue').innerText = Math.max(0, total - currentIndex);
        }
    </script>
</body>
</html>
