<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 專業語彙引擎</title>
    <style>
        :root {
            /* 色彩系統 */
            --bg-base: #090e17; --bg-panel: #162032; --bg-inner: #0d131f;
            --text-main: #f1f5f9; --text-sub: #94a3b8; --text-mut: #475569;
            --accent: #38bdf8; --border: rgba(255, 255, 255, 0.08);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* 佈局系統 (動態變數) */
            --sidebar-w: 260px;
            --aside-w: 360px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        /* ========== 全新 CSS 變數佈局引擎 ========== */
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; 
            grid-template-columns: var(--sidebar-w) 1fr var(--aside-w); 
            transition: grid-template-columns var(--transition);
        }

        /* 透過改變變數，實現毫無 Bug 的側欄收合 */
        body.hide-sidebar { --sidebar-w: 0px; }
        body.hide-aside { --aside-w: 0px; }

        /* ========== 無痕點讀 (Invisible TTS) ========== */
        .en-click { cursor: pointer; border-bottom: 1px dashed rgba(56, 189, 248, 0.4); transition: var(--transition); display: inline-block;}
        .en-click:hover { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); border-radius: 2px;}

        /* ========== Header ========== */
        header { grid-area: header; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 50; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-right: 20px; cursor: pointer; letter-spacing: 0.5px;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-sub); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: var(--transition);}
        .menu-btn:hover { color: var(--text-main); border-color: var(--text-sub); background: rgba(255,255,255,0.05);}
        
        /* 全局複習按鈕 */
        .btn-global-review { margin-left: 15px; background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: var(--transition); display: flex; align-items: center;}
        .btn-global-review.has-review { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); animation: pulse-red 2s infinite;}
        .btn-global-review.has-review:hover { background: #ef4444; color: #fff; animation: none;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        #header-topic-title { color:var(--text-sub); font-size: 0.95rem; margin-left:auto; display: none;}

        /* ========== Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-inner); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: var(--transition); position: relative; z-index: 40;}
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.8rem; font-weight: bold; color: var(--text-sub); text-transform: uppercase; padding: 10px 5px; border-bottom: 1px solid var(--border); margin-top: 10px;}
        .topic-list { padding-left: 5px; margin-top: 5px; }
        .topic-item { font-size: 0.9rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; transition: var(--transition);}
        .topic-item:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent);}
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.6); z-index: 35; }

        /* ========== Main App Area ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        
        /* 1. View Catalog */
        #view-catalog { padding: 40px 5%; display: block; max-width: 1100px; margin: 0 auto; }
        .catalog-header { font-size: 1.8rem; margin-bottom: 30px; font-weight: 300; color: #fff;}
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; cursor: pointer; transition: var(--transition); }
        .catalog-card:hover { border-color: var(--text-sub); background: #233044; transform: translateY(-3px);}
        .cat-badge { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .cat-title { font-size: 1.1rem; margin-bottom: 10px; color: #fff;}

        /* 2. View Topic (Matching Game) */
        #view-topic { padding: 40px 5%; display: none; max-width: 800px; margin: 0 auto; text-align: center;}
        .topic-title-lg { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
        .matching-instructions { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 30px;}
        .matching-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px;}
        .match-tile { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; cursor: pointer; transition: 0.2s; font-size: 1rem; font-weight: bold; user-select: none;}
        .match-tile:hover { background: rgba(255,255,255,0.05); }
        .match-tile.selected { border-color: var(--accent); background: rgba(56,189,248,0.1); color: var(--accent); transform: scale(1.05);}
        .match-tile.matched { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; pointer-events: none; opacity: 0.6;}
        .match-tile.wrong { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
        .btn-start-study { background: var(--accent); color: #000; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; opacity: 0.5; pointer-events: none; transition: 0.3s;}
        .btn-start-study.active { opacity: 1; pointer-events: auto; box-shadow: 0 0 15px rgba(56,189,248,0.4);}

        /* 3. View Study (Flashcards) */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 2000px; padding: 20px; }
        .flashcard { width: 100%; max-width: 650px; height: 85vh; max-height: 800px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); cursor: default;}
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden; }
        
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 3.5rem; font-weight: 700; margin-bottom: 5px; color:#fff; }
        
        /* 優化後的音標字型 */
        .phonetic-front, .back-phonetic { font-family: "Lucida Sans Unicode", "Arial Unicode MS", "Segoe UI", sans-serif; color: var(--text-sub); font-weight: 300; letter-spacing: 0.5px; }
        .phonetic-front { font-size: 1.25rem; margin-bottom: 30px; }
        .back-phonetic { font-size: 0.95rem; margin-left: 12px; }

        .front-hint { position: absolute; bottom: 30px; font-size: 0.85rem; color: var(--text-mut); }

        .card-back { transform: rotateY(180deg); }
        .back-sticky-header { padding: 20px 25px; background: var(--bg-inner); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;}
        .back-word { font-size: 1.5rem; font-weight: bold; color:#fff;}
        .back-meaning { font-size: 1.1rem; color: var(--accent); font-weight: bold;}

        .back-scroll-area { padding: 25px; overflow-y: auto; flex: 1; }
        .back-scroll-area::-webkit-scrollbar { width: 4px; } .back-scroll-area::-webkit-scrollbar-thumb { background: #475569; }
        .section-title { font-size: 0.75rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 5px;}

        /* Lexical Relations */
        .lexical-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .lex-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
        .lex-label { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 8px; letter-spacing: 1px;}
        .lex-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .lex-tag { font-size: 0.85rem; background: var(--bg-inner); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; color: #cbd5e1; }
        .nuance-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 25px;}
        .nuance-item { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.4; color: #cbd5e1;}
        .nuance-item span.en-click { font-weight: bold; color: #fff; }

        /* Etymology */
        .ety-breakdown { font-size: 0.9rem; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; border-radius: 6px;}
        .ety-part em { color: var(--text-sub); font-style: normal; margin-left: 6px; font-size: 0.85rem;}

        /* Focus Stepper */
        .focus-container { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px;}
        .focus-nav { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 15px; font-size: 0.8rem; color: var(--text-sub); border-bottom: 1px solid var(--border);}
        .focus-nav-btn { cursor: pointer; padding: 2px 10px; border-radius: 4px; transition: var(--transition);}
        .focus-nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff;}
        .focus-nav-btn.hidden { visibility: hidden; pointer-events: none;}
        
        .focus-stage { padding: 15px; border-bottom: 1px dashed var(--border); cursor: pointer; transition: var(--transition); position: relative;}
        .focus-stage:hover { background: rgba(255,255,255,0.02); }
        .focus-stage:last-child { border-bottom: none; }
        .ex-en { font-size: 1.05rem; margin-bottom: 5px; line-height: 1.5; color:#fff;}
        .ex-zh { font-size: 0.9rem; color: var(--text-sub); }
        .ex-speaker { color: var(--text-mut); font-weight: bold; margin-right: 8px; font-size: 0.9rem;}
        
        .word-tts { display: inline-block; transition: var(--transition); border-radius: 2px; }
        .word-tts:hover { color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        .external-links { display: flex; gap: 10px; margin-bottom: 10px;}
        .external-links a { text-decoration: none; font-size: 0.8rem; padding: 6px 12px; border-radius: 4px; color: var(--text-sub); border: 1px solid var(--border); transition: var(--transition); }
        .external-links a:hover { color: #fff; border-color: var(--text-sub); }

        .anki-controls { display: flex; gap: 1px; background: var(--border); border-top: 1px solid var(--border); position: sticky; bottom: 0; opacity: 0; pointer-events: none; transition: 0.3s; }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 16px 0; border: none; color: var(--text-sub); font-size: 0.95rem; font-weight:bold; cursor: pointer; transition: var(--transition); background: var(--bg-panel); display: flex; justify-content: center; gap: 8px;}
        .anki-btn:hover { background: var(--bg-inner); color: #fff; }
        .btn-again:hover { border-bottom: 2px solid #ef4444; } 
        .btn-hard:hover { border-bottom: 2px solid #f59e0b; } 
        .btn-easy:hover { border-bottom: 2px solid #10b981; }

        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* ========== Aside Background ========== */
        aside { grid-area: aside; background: var(--bg-inner); border-left: 1px solid var(--border); padding: 30px 25px; overflow-y: auto; opacity: 0; transition: opacity 0.4s; z-index: 20;}
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 4px; } aside::-webkit-scrollbar-thumb { background: #475569; }
        .aside-block { margin-bottom: 35px; }
        .aside-content { font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; }

        footer { grid-area: footer; background: var(--bg-base); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; color: var(--text-mut);}
        .stat span { color: var(--text-sub); }

        /* ========== Responsive Mobile/Tablet ========== */
        @media (max-width: 1024px) {
            :root { --sidebar-w: 0px; }
            nav { position: fixed; left: -280px; width: 280px; height: calc(100vh - 60px); top: 60px; }
            body.show-mobile-sidebar nav { left: 0; }
            body.show-mobile-sidebar #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            :root { --aside-w: 0px; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; padding-bottom: 100px; transition: right 0.3s;}
            body.show-mobile-aside aside { right: 0; }
        }
    </style>
</head>
<body class="hide-sidebar hide-aside"> <!-- 預設隱藏側邊欄 -->

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">目錄</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <button id="btn-global-review" class="btn-global-review" onclick="startGlobalReview()">🔥 複習 (0)</button>
        <div id="header-topic-title"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar"></nav>

    <main>
        <!-- Layer 1: Catalog -->
        <div id="view-catalog">
            <h1 class="catalog-header">選擇領域</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <!-- Layer 2: Topic & Matching Game -->
        <div id="view-topic">
            <div class="topic-title-lg" id="topic-title-display">Title</div>
            <div class="matching-instructions">在開始學習前，請先完成中英文配對解鎖記憶迴路。</div>
            <div class="matching-grid" id="matching-grid"></div>
            <button class="btn-start-study" id="btn-start-study" onclick="startStudy()">開始深度學習</button>
        </div>

        <!-- Layer 3: Study Flashcards -->
        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <div class="card-face card-front">
                    <div class="word-front en-click" id="front-word" onclick="speakExactText(this.innerText, event)">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <div class="front-hint">點擊卡片空白處翻面</div>
                </div>
                
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    
                    <div class="back-sticky-header">
                        <div style="display:flex; align-items:baseline;">
                            <div class="back-word en-click" id="sticky-word" onclick="speakExactText(this.innerText, event)">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                        <div class="back-meaning" id="sticky-meaning">Meaning</div>
                    </div>
                    
                    <div class="back-scroll-area">
                        
                        <div class="section-title">Lexical Relations</div>
                        <div class="lexical-grid" id="lexical-grid"></div>
                        <div id="near-synonyms-container"></div>
                        
                        <div id="back-etymology"></div>

                        <!-- 改善後的 Focus Stepper (帶有完整的 Prev/Next 控制) -->
                        <div class="section-title" style="margin-top:10px;">Contextual Focus</div>
                        <div class="focus-container" id="focus-container"></div>

                        <div class="section-title" style="margin-top:20px;">External References</div>
                        <div class="external-links" id="back-links"></div>
                    </div>

                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">忘記 <span>(1m)</span></button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">模糊 <span>(12h)</span></button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">掌握 <span>(3d)</span></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-finish">
            <h2 style="margin-bottom:20px; color:#fff; font-weight:300;">學習完成</h2>
            <button style="background:none; border:1px solid var(--text-sub); color:var(--text-main); padding: 8px 16px; border-radius:4px; cursor:pointer;" onclick="goHome()">返回目錄</button>
        </div>
    </main>

    <aside id="right-panel">
        <div class="aside-block">
            <div class="section-title">Background</div>
            <div class="aside-content" id="panel-bg"></div>
        </div>
        <div class="aside-block">
            <div class="section-title">Usage Context</div>
            <div class="aside-content" id="panel-context"></div>
        </div>
    </aside>

    <footer>
        <div class="stat">進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        // Data Caches
        let catalogData =[];
        let currentTopicWords =[]; 
        let cardCache = {}; 
        let learningQueue =[];
        let currentIndex = 0;
        
        // 更換儲存庫名稱以確保新資料結構乾淨寫入
        const SRS_KEY = 'expertLingoSRS_v9';
        let srsDB = JSON.parse(localStorage.getItem(SRS_KEY)) || {};

        // Focus Mode States
        let currentExIndex = 0;
        let currentExStage = 1;

        // Matching Game States
        let matchSelection = null;
        let matchedCount = 0;

        window.onload = async () => {
            updateGlobalReviewCount();
            await fetchCatalog();
            goHome();
        };

        // --- Layout Controls (CSS Variables based) ---
        function toggleSidebar() {
            if(window.innerWidth > 1024) {
                document.body.classList.toggle('hide-sidebar');
            } else {
                document.body.classList.toggle('show-mobile-sidebar');
            }
        }

        // --- Global Review Logic ---
        function updateGlobalReviewCount() {
            const now = Date.now();
            let count = 0;
            for(let key in srsDB) {
                if(srsDB[key].nextReview <= now && srsDB[key].card_file) count++;
            }
            const btn = document.getElementById('btn-global-review');
            btn.innerText = `🔥 複習 (${count})`;
            if(count > 0) btn.classList.add('has-review');
            else btn.classList.remove('has-review');
        }

        async function startGlobalReview() {
            const now = Date.now();
            let dueFiles =[];
            for(let key in srsDB) {
                if(srsDB[key].nextReview <= now && srsDB[key].card_file) {
                    dueFiles.push(srsDB[key].card_file);
                }
            }
            if(dueFiles.length === 0) { alert("你太強了！目前沒有需要複習的卡片。"); return; }
            
            // 隱藏其他 View
            document.getElementById('view-catalog').style.display = 'none';
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-study').style.display = 'none';
            
            learningQueue =[];
            for(let file of dueFiles) {
                try {
                    let res = await fetch(file);
                    let card = await res.json();
                    card.card_file = file; // 保留路徑以利回存
                    learningQueue.push(card);
                } catch(e) { console.warn("Failed to load review card", file); }
            }
            
            learningQueue.sort(() => Math.random() - 0.5); // 打亂順序
            
            document.getElementById('header-topic-title').innerText = `總複習模式 (${learningQueue.length})`;
            document.getElementById('header-topic-title').style.display = 'block';
            document.getElementById('view-study').style.display = 'flex';
            
            document.body.classList.add('hide-sidebar');
            document.body.classList.add('hide-aside');
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');

            currentIndex = 0;
            renderCard();
        }

        // --- Layer 1: Catalog ---
        async function fetchCatalog() {
            try {
                const res = await fetch('index.json');
                const data = await res.json();
                catalogData = data.catalog;
                
                document.getElementById('sidebar').innerHTML = catalogData.map((cat, i) => `
                    <div class="category-title">${cat.group_name}</div>
                    <div class="topic-list">
                        ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">${t.title_zh}</div>`).join('')}
                    </div>
                `).join('');

                document.getElementById('catalog-grid').innerHTML = catalogData.map(cat => cat.topics.map(t => `
                    <div class="catalog-card" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">
                        <div class="cat-badge">${cat.group_name}</div>
                        <div class="cat-title">${t.title_en}</div>
                    </div>`).join('')).join('');
            } catch (e) {
                console.log("未檢測到 index.json 或是格式有誤");
            }
        }

        function goHome() {
            document.body.classList.remove('hide-sidebar'); 
            document.body.classList.add('hide-aside'); 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
        }

        // --- Layer 2: Load Topic & Preload & Matching Game ---
        async function loadTopic(fileName, titleDisplay) {
            try {
                const res = await fetch(fileName);
                const topicData = await res.json();
                currentTopicWords = topicData.words;
                
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-topic').style.display = 'block';
                document.getElementById('header-topic-title').innerText = titleDisplay;
                document.getElementById('header-topic-title').style.display = 'block';
                document.getElementById('topic-title-display').innerText = topicData.title_zh;
                
                document.body.classList.add('hide-sidebar');
                if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
                
                initMatchingGame();
                preloadCards(currentTopicWords);

            } catch (e) { alert(`無法載入主題包 ${fileName}。可能是路徑錯誤或尚未產出該 JSON。`); }
        }

        async function preloadCards(words) {
            cardCache = {};
            for (let w of words) {
                try {
                    let res = await fetch(w.card_file);
                    let cardData = await res.json();
                    cardData.card_file = w.card_file; // 重要：注入檔案路徑
                    cardCache[w.word_en] = cardData;
                } catch(e) { console.error("Preload failed", w.card_file); }
            }
        }

        function initMatchingGame() {
            const grid = document.getElementById('matching-grid');
            const btn = document.getElementById('btn-start-study');
            grid.innerHTML = '';
            btn.classList.remove('active');
            matchSelection = null;
            matchedCount = 0;

            let tiles =[];
            currentTopicWords.forEach((w, index) => {
                tiles.push({ id: index, type: 'en', text: w.word_en });
                tiles.push({ id: index, type: 'zh', text: w.word_zh });
            });
            tiles = tiles.sort(() => Math.random() - 0.5);

            tiles.forEach(t => {
                const div = document.createElement('div');
                div.className = 'match-tile';
                div.innerText = t.text;
                div.onclick = () => handleMatchClick(div, t.id, t.type);
                grid.appendChild(div);
            });
        }

        function handleMatchClick(el, id, type) {
            if(el.classList.contains('matched') || el.classList.contains('selected')) return;

            if(!matchSelection) {
                matchSelection = { el, id, type };
                el.classList.add('selected');
            } else {
                if(matchSelection.id === id && matchSelection.type !== type) {
                    el.classList.add('matched');
                    matchSelection.el.classList.remove('selected');
                    matchSelection.el.classList.add('matched');
                    matchedCount += 2;
                    if(matchedCount === currentTopicWords.length * 2) {
                        document.getElementById('btn-start-study').classList.add('active');
                    }
                } else {
                    el.classList.add('wrong');
                    matchSelection.el.classList.remove('selected');
                    matchSelection.el.classList.add('wrong');
                    setTimeout(() => {
                        el.classList.remove('wrong');
                        if(matchSelection) matchSelection.el.classList.remove('wrong');
                        matchSelection = null;
                    }, 400);
                    return;
                }
                matchSelection = null;
            }
        }

        // --- Layer 3: Start Study ---
        function startStudy() {
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-study').style.display = 'flex';
            
            const now = Date.now();
            learningQueue = currentTopicWords.map(w => cardCache[w.word_en]).filter(Boolean); 
            let dueQueue = learningQueue.filter(item => !srsDB[item.word_en] || srsDB[item.word_en].nextReview <= now);
            if(dueQueue.length > 0) learningQueue = dueQueue; 
            
            currentIndex = 0;
            renderCard();
        }

        // --- String Parsing ---
        function createWordLevelTTS(text) {
            return text.split(/\s+/).map(word => `<span class="word-tts" onclick="speakExactText('${word.replace(/'/g, "\\'").replace(/"/g, "&quot;")}', event)">${word}</span>`).join(' ');
        }
        function parseInlineTTS(text) {
            if(!text) return '';
            return text.replace(/\{\{(.*?)\}\}/g, '<span class="en-click" onclick="speakExactText(\'$1\', event)">$1</span>');
        }

        // --- Renders ---
        function renderLexicalWeb(item) {
            let lexHtml = '';
            if(item.lexical_relations) {
                const syns = item.lexical_relations.synonyms;
                const ants = item.lexical_relations.antonyms;
                const nears = item.lexical_relations.near_synonyms;

                if(syns && syns.length > 0) {
                    lexHtml += `<div class="lex-box"><div class="lex-label">Synonyms</div><div class="lex-tags">` + 
                        syns.map(s => `<span class="lex-tag en-click" onclick="speakExactText('${s}', event)">${s}</span>`).join('') + `</div></div>`;
                }
                if(ants && ants.length > 0) {
                    lexHtml += `<div class="lex-box"><div class="lex-label">Antonyms</div><div class="lex-tags">` + 
                        ants.map(a => `<span class="lex-tag en-click" onclick="speakExactText('${a}', event)">${a}</span>`).join('') + `</div></div>`;
                }
                document.getElementById('lexical-grid').innerHTML = lexHtml;

                if(nears && nears.length > 0) {
                    document.getElementById('near-synonyms-container').innerHTML = `<div class="nuance-box"><div class="lex-label" style="margin-bottom:10px;">Near-Synonyms & Nuance</div>` +
                        nears.map(n => `<div class="nuance-item"><span class="en-click" onclick="speakExactText('${n.word}', event)">${n.word}</span>：${n.nuance}</div>`).join('') + `</div>`;
                } else { document.getElementById('near-synonyms-container').innerHTML = ''; }
            } else {
                document.getElementById('lexical-grid').innerHTML = '';
                document.getElementById('near-synonyms-container').innerHTML = '';
            }

            let etyHtml = '';
            if(item.etymology) {
                etyHtml += `<div class="section-title">Etymology</div><div class="ety-breakdown">`;
                etyHtml += item.etymology.breakdown.map(b => 
                    `<div class="ety-part"><span class="en-click" style="font-weight:bold; color:#fff;" onclick="speakExactText('${b.part}', event)">${b.part}</span><em>${b.meaning}</em></div>`
                ).join('<span style="color:var(--text-mut); margin: 0 5px;">+</span>'); 
                if(item.etymology.cognates && item.etymology.cognates.length > 0){
                    etyHtml += `<div style="width:100%; margin-top:5px; font-size:0.8rem; color:var(--text-sub); border-top:1px dashed var(--border); padding-top:8px;">Cognates: ` + 
                        item.etymology.cognates.map(c => `<span class="en-click" style="color:#cbd5e1; margin-right:8px;" onclick="speakExactText('${c}', event)">${c}</span>`).join('') + `</div>`;
                }
                etyHtml += `</div>`;
            }
            document.getElementById('back-etymology').innerHTML = etyHtml;
        }

        // --- 沉浸焦點控制器 (修復了 Prev/Next 按鈕隱藏與顯示的邏輯) ---
        function renderFocusMode() {
            const item = learningQueue[currentIndex];
            const container = document.getElementById('focus-container');
            if(!item.example_clusters || item.example_clusters.length === 0) {
                container.innerHTML = ''; return;
            }

            const total = item.example_clusters.length;
            const cluster = item.example_clusters[currentExIndex];

            // 嚴格控制上下頁按鈕的可視性
            const prevClass = currentExIndex === 0 ? 'hidden' : '';
            const nextClass = currentExIndex === total - 1 ? 'hidden' : '';

            let html = `<div class="focus-nav">
                <span class="focus-nav-btn ${prevClass}" onclick="changeEx(-1, event)">&#8592; Prev</span>
                <span>Context ${currentExIndex + 1} / ${total}</span>
                <span class="focus-nav-btn ${nextClass}" onclick="changeEx(1, event)">Next &#8594;</span>
            </div>`;

            // Stage 1: Phrase
            html += `<div class="focus-stage" onclick="handleStageClick(1, '${cluster.phrase.en.replace(/'/g, "\\'")}', event)">
                <div class="ex-en">${createWordLevelTTS(cluster.phrase.en)}</div>
                <div class="ex-zh">${cluster.phrase.zh}</div>
            </div>`;

            // Stage 2: Sentence
            if(currentExStage >= 2) {
                html += `<div class="focus-stage" style="background:rgba(0,0,0,0.2);" onclick="handleStageClick(2, '${cluster.sentence.en.replace(/'/g, "\\'")}', event)">
                    <div class="ex-en">${createWordLevelTTS(cluster.sentence.en)}</div>
                    <div class="ex-zh">${cluster.sentence.zh}</div>
                </div>`;
            }

            // Stage 3: Dialogue
            if(currentExStage >= 3) {
                html += `<div class="focus-stage revealed" style="background:rgba(0,0,0,0.4); cursor:default;" onclick="event.stopPropagation()">`;
                cluster.dialogue.forEach(d => {
                    html += `<div style="margin-bottom:10px; cursor:pointer;" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span class="ex-speaker">${d.speaker}</span><span class="ex-en" style="font-size:0.95rem;">${d.en}</span>
                        <div class="ex-zh">${d.zh}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function handleStageClick(clickedStage, text, e) {
            e.stopPropagation();
            if(!e.target.classList.contains('word-tts')) speakExactText(text);
            if(clickedStage === 1 && currentExStage < 2) { currentExStage = 2; renderFocusMode(); } 
            else if (clickedStage === 2 && currentExStage < 3) { currentExStage = 3; renderFocusMode(); }
        }

        function changeEx(dir, e) {
            e.stopPropagation();
            const total = learningQueue[currentIndex].example_clusters.length;
            currentExIndex = Math.max(0, Math.min(total - 1, currentExIndex + dir));
            currentExStage = 1;
            renderFocusMode();
        }

        // --- Card Mechanics ---
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                document.getElementById('view-study').style.display = 'none';
                document.getElementById('view-finish').style.display = 'flex';
                document.body.classList.add('hide-aside');
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            
            document.body.classList.add('hide-aside');
            if(window.innerWidth <= 768) document.body.classList.remove('show-mobile-aside');

            currentExIndex = 0; currentExStage = 1;

            document.getElementById('front-word').innerText = item.word_en;
            document.getElementById('front-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-word').innerText = item.word_en;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-meaning').innerText = item.word_zh;
            
            renderLexicalWeb(item);
            renderFocusMode();

            const q = encodeURIComponent(item.word_en);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${q}/english" target="_blank">YouGlish</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${q}" target="_blank">Wiktionary</a>
            `;

            document.getElementById('panel-bg').innerHTML = parseInlineTTS(item.background);
            document.getElementById('panel-context').innerHTML = parseInlineTTS(item.context);

            updateStats();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            
            document.body.classList.remove('hide-aside'); 
            setTimeout(() => {
                document.getElementById('right-panel').classList.add('active'); 
                if(window.innerWidth <= 768) document.body.classList.add('show-mobile-aside');
            }, 100);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s]/gi, '')); 
                utter.lang = 'en-US'; utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function processSRS(qIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.word_en] || { interval: 0, reps: 0 };
            
            // 重要：儲存對應的卡片路徑，才能在「總複習」時抓回來
            if(item.card_file) rec.card_file = item.card_file;

            if(qIndex === 0) { rec.reps = 0; rec.interval = 1; }
            else if(qIndex === 1) { rec.reps++; rec.interval = rec.reps === 1 ? 12*60 : rec.interval * 1.5; }
            else { rec.reps++; rec.interval = rec.reps === 1 ? 3*24*60 : rec.interval * 2.5; }
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.word_en] = rec;
            localStorage.setItem(SRS_KEY, JSON.stringify(srsDB));

            currentIndex++;
            updateStats();
            updateGlobalReviewCount(); // 立即更新右上角紅字
            
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                renderCard();
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 250);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            document.querySelector('.stat span:first-child').innerText = `${Math.min(currentIndex, total)} / ${total}`;
            document.getElementById('stat-queue').innerText = Math.max(0, total - currentIndex);
        }
    </script>
</body>
</html>
