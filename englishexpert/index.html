<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 終極心流語彙引擎</title>
    <!-- 引入學術襯線體 Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 終極深色主題 */
            --bg-base: #05080f; --bg-panel: #111827; --bg-inner: #0b0f19;
            --text-main: #f8fafc; --text-sub: #94a3b8; --text-mut: #475569;
            --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* 字體定義 */
            --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            
            /* 動態佈局變數 */
            --sidebar-w: 260px; --aside-w: 360px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: var(--sidebar-w) 1fr var(--aside-w); 
            transition: grid-template-columns var(--transition);
        }

        body.hide-sidebar { --sidebar-w: 0px; } body.hide-aside { --aside-w: 0px; }

        /* 學術字體 Class */
        .serif { font-family: var(--font-serif); }

        /* 頂部霓虹進度條 */
        #top-progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0%; z-index: 9999; transition: width 0.4s ease-out; box-shadow: 0 0 10px var(--accent); }

        /* ========== 無痕點讀 (Invisible TTS) ========== */
        .en-click { cursor: pointer; border-bottom: 1px dashed rgba(56, 189, 248, 0.4); transition: var(--transition); display: inline-block;}
        .en-click:hover { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); border-radius: 2px;}

        /* ========== 挖空提取 (Cloze Deletion) ========== */
        .cloze-blank { display: inline-block; min-width: 60px; padding: 0 10px; margin: 0 4px; border-bottom: 2px solid var(--accent); color: transparent; cursor: pointer; transition: var(--transition); user-select: none; background: rgba(56,189,248,0.05); border-radius: 4px 4px 0 0; position: relative;}
        .cloze-blank::after { content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--accent); opacity: 0.5; font-size: 0.9rem;}
        .cloze-blank:hover { background: rgba(56, 189, 248, 0.2); }
        .cloze-revealed { color: var(--accent); background: transparent; border-bottom: none; font-weight: bold; font-size: 1.1em;}
        .cloze-revealed::after { display: none; }

        /* ========== Header ========== */
        header { grid-area: header; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 50; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-right: 20px; cursor: pointer; letter-spacing: 0.5px;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-sub); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: var(--transition);}
        .menu-btn:hover { color: var(--text-main); border-color: var(--text-sub); background: rgba(255,255,255,0.05);}
        
        .btn-global-review { margin-left: 15px; background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: var(--transition); display: flex; align-items: center;}
        .btn-global-review.has-review { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); animation: pulse-red 2s infinite;}
        .btn-global-review.has-review:hover { background: #ef4444; color: #fff; animation: none;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        #header-topic-title { color:var(--text-sub); font-size: 0.95rem; margin-left:auto; display: none;}

        /* ========== Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-inner); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: var(--transition); position: relative; z-index: 40;}
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.75rem; font-weight: bold; color: var(--text-sub); text-transform: uppercase; padding: 10px 5px; border-bottom: 1px solid var(--border); margin-top: 10px; letter-spacing: 1px;}
        .topic-list { padding-left: 5px; margin-top: 5px; }
        .topic-item { font-size: 0.9rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; transition: var(--transition);}
        .topic-item:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent);}
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.6); z-index: 35; }

        /* ========== Main App Area ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        
        #view-catalog { padding: 40px 5%; display: block; max-width: 1100px; margin: 0 auto; }
        .catalog-header { font-size: 1.8rem; margin-bottom: 30px; font-weight: 300; color: #fff;}
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; cursor: pointer; transition: var(--transition); }
        .catalog-card:hover { border-color: var(--text-sub); background: #1f2937; transform: translateY(-3px);}
        .cat-badge { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .cat-title { font-size: 1.1rem; margin-bottom: 10px; color: #fff;}

        #view-topic { padding: 40px 5%; display: none; max-width: 800px; margin: 0 auto; text-align: center;}
        .topic-title-lg { font-size: 2rem; margin-bottom: 10px; color: var(--accent); font-weight: bold;}
        .matching-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px; margin-top:30px;}
        .match-tile { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; cursor: pointer; transition: 0.2s; font-size: 1rem; font-weight: bold; user-select: none;}
        .match-tile:hover { background: rgba(255,255,255,0.05); }
        .match-tile.selected { border-color: var(--accent); background: rgba(56,189,248,0.1); color: var(--accent); transform: scale(1.05);}
        .match-tile.matched { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; pointer-events: none; opacity: 0.6;}
        .match-tile.wrong { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
        
        .action-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-primary, .btn-secondary { border: none; padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: var(--transition);}
        .btn-primary { background: var(--accent); color: #000; opacity: 0.5; pointer-events: none; }
        .btn-primary.active { opacity: 1; pointer-events: auto; box-shadow: 0 0 15px rgba(56,189,248,0.4);}
        .btn-secondary { background: transparent; border: 1px solid var(--text-mut); color: var(--text-sub); }
        .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }

        /* ========== Flashcards ========== */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 2000px; padding: 20px; }
        .flashcard { width: 100%; max-width: 650px; height: 85vh; max-height: 800px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); cursor: default;}
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); overflow: hidden; }
        
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 4rem; margin-bottom: 5px; color:#fff; letter-spacing: 1px; }
        .phonetic-front { font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-size: 1.25rem; color: var(--text-sub); margin-bottom: 30px; font-weight: 300;}
        .front-hint { position: absolute; bottom: 30px; font-size: 0.85rem; color: var(--text-mut); letter-spacing: 2px; text-transform: uppercase;}

        .card-back { transform: rotateY(180deg); }
        .back-sticky-header { padding: 20px 25px; background: var(--bg-inner); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .back-word { font-size: 1.8rem; color:#fff; letter-spacing: 0.5px;}
        .back-phonetic { font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-size: 0.95rem; color: var(--text-sub); margin-left: 12px; font-weight: 300;}
        .back-meaning { font-size: 1.1rem; color: var(--accent); font-weight: bold;}

        /* --- 膠囊分頁系統 (Pill Tabs) --- */
        .tab-nav { display: flex; padding: 15px 25px 0 25px; gap: 10px; background: var(--bg-inner); border-bottom: 1px solid var(--border); flex-shrink: 0;}
        .tab-btn { padding: 8px 16px; font-size: 0.85rem; font-weight: bold; color: var(--text-mut); cursor: pointer; border-radius: 20px 20px 0 0; transition: var(--transition); border: 1px solid transparent; border-bottom: none; text-transform: uppercase; letter-spacing: 1px;}
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { background: var(--bg-panel); color: var(--accent); border-color: var(--border); position: relative; bottom: -1px; }

        .tab-content-wrapper { flex: 1; overflow: hidden; position: relative; background: var(--bg-panel); }
        .tab-pane { position: absolute; top:0; left:0; width:100%; height:100%; padding: 25px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.3s;}
        .tab-pane.active { opacity: 1; pointer-events: auto; }
        .tab-pane::-webkit-scrollbar { width: 4px; } .tab-pane::-webkit-scrollbar-thumb { background: #475569; }

        .section-title { font-size: 0.75rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: bold;}

        /* Tab 1: Core (Lexical & Etymology) */
        .ety-breakdown { font-size: 1.1rem; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 15px; border-radius: 8px;}
        .ety-part span { color: #fff; font-weight: bold; letter-spacing: 0.5px;}
        .ety-part em { color: var(--text-sub); font-style: normal; margin-left: 6px; font-size: 0.85rem; font-family: var(--font-sans);}
        
        .lexical-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .lex-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
        .lex-label { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 8px; letter-spacing: 1px;}
        .lex-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .lex-tag { font-size: 0.85rem; background: var(--bg-inner); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; color: #cbd5e1; }
        .nuance-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 15px;}
        .nuance-item { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.5; color: #cbd5e1;}
        .nuance-item span.en-click { font-weight: bold; color: #fff; }

        /* Tab 2: Action (Focus Stepper) */
        .focus-outer { display: flex; align-items: stretch; gap: 10px; height: 100%;}
        .nav-arrow { flex-shrink: 0; width: 40px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center;}
        .nav-arrow:hover:not(:disabled) { background: rgba(56, 189, 248, 0.1); color: var(--accent); border-color: var(--accent);}
        .nav-arrow:disabled { opacity: 0.1; cursor: not-allowed; }
        
        .focus-container { flex: 1; background: var(--bg-inner); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow-y: auto;}
        .focus-container::-webkit-scrollbar { width: 4px; } .focus-container::-webkit-scrollbar-thumb { background: #475569; }
        
        .focus-stage { padding: 20px; border-bottom: 1px dashed var(--border); cursor: pointer; transition: var(--transition); position: relative;}
        .focus-stage:hover { background: rgba(255,255,255,0.02); }
        .focus-stage:last-child { border-bottom: none; }
        .ex-en { font-size: 1.1rem; margin-bottom: 8px; line-height: 1.6; color:#fff;}
        .ex-zh { font-size: 0.95rem; color: var(--text-sub); }
        .ex-speaker { color: var(--text-mut); font-weight: bold; margin-right: 8px; font-size: 0.95rem;}

        /* Tab 3: Links */
        .external-links { display: flex; flex-direction: column; gap: 10px;}
        .external-links a { text-decoration: none; font-size: 1rem; padding: 12px 15px; border-radius: 8px; color: var(--text-main); background: rgba(255,255,255,0.03); border: 1px solid var(--border); transition: var(--transition); display: flex; align-items: center; justify-content: space-between;}
        .external-links a:hover { background: rgba(255,255,255,0.08); border-color: var(--text-sub); color: #fff;}
        .external-links a::after { content: "↗"; font-size: 0.8rem; color: var(--text-mut); }

        /* SRS Buttons */
        .anki-controls { display: flex; gap: 1px; background: var(--border); border-top: 1px solid var(--border); position: sticky; bottom: 0; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 20; flex-shrink: 0;}
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 18px 0; border: none; color: var(--text-sub); font-size: 0.95rem; font-weight:bold; cursor: pointer; transition: var(--transition); background: var(--bg-panel); display: flex; justify-content: center; align-items: center; gap: 8px;}
        .anki-btn:hover { background: var(--bg-inner); color: #fff; }
        .btn-again:hover { border-bottom: 3px solid #ef4444; box-shadow: inset 0 -10px 20px -10px rgba(239,68,68,0.3);} 
        .btn-hard:hover { border-bottom: 3px solid #f59e0b; box-shadow: inset 0 -10px 20px -10px rgba(245,158,11,0.3);} 
        .btn-easy:hover { border-bottom: 3px solid #10b981; box-shadow: inset 0 -10px 20px -10px rgba(16,185,129,0.3);}

        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* ========== Right Aside (Skeleton Blur) ========== */
        aside { grid-area: aside; background: var(--bg-inner); border-left: 1px solid var(--border); overflow: hidden; position: relative; z-index: 20;}
        .aside-scroll { padding: 30px 25px; height: 100%; overflow-y: auto; }
        .aside-scroll::-webkit-scrollbar { width: 4px; } .aside-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .aside-block { margin-bottom: 35px; }
        .aside-content { font-size: 0.95rem; line-height: 1.8; color: #cbd5e1; }
        
        /* 毛玻璃鎖定遮罩 */
        #right-panel-overlay { position: absolute; top:0; left:0; width:100%; height:100%; backdrop-filter: blur(10px); background: rgba(11, 15, 25, 0.7); z-index: 10; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-out; opacity: 1;}
        #right-panel-overlay.unlocked { opacity: 0; pointer-events: none; }
        .lock-icon { font-size: 2rem; color: var(--text-mut); margin-bottom: 10px; text-align: center;}
        .lock-text { color: var(--text-sub); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase;}

        footer { grid-area: footer; background: var(--bg-base); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; color: var(--text-mut);}

        @media (max-width: 1024px) {
            :root { --sidebar-w: 0px; }
            nav { position: fixed; left: -280px; width: 280px; height: calc(100vh - 60px); top: 60px; }
            body.show-mobile-sidebar nav { left: 0; }
            body.show-mobile-sidebar #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            :root { --aside-w: 0px; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; transition: right 0.3s;}
            body.show-mobile-aside aside { right: 0; }
        }
    </style>
</head>
<body class="hide-sidebar hide-aside">

    <div id="top-progress-bar"></div>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">目錄</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <button id="btn-global-review" class="btn-global-review" onclick="startGlobalReview()">🔥 複習 (0)</button>
        <div id="header-topic-title"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar"></nav>

    <main>
        <!-- Layer 1: Catalog -->
        <div id="view-catalog">
            <h1 class="catalog-header">選擇領域</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <!-- Layer 2: Topic & Dual Mode -->
        <div id="view-topic">
            <div class="topic-title-lg" id="topic-title-display">Title</div>
            <div class="matching-instructions">在開始學習前，請先完成配對解鎖記憶迴路。或直接進入心流。</div>
            <div class="matching-grid" id="matching-grid"></div>
            <div class="action-buttons">
                <button class="btn-primary" id="btn-start-study" onclick="startStudy()">🔰 盲測解鎖 (完成配對)</button>
                <button class="btn-secondary" onclick="forceStartStudy()">⚡ 進入心流 (跳過配對)</button>
            </div>
        </div>

        <!-- Layer 3: Study Flashcards -->
        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <div class="card-face card-front">
                    <div class="word-front en-click serif" id="front-word" onclick="speakExactText(this.innerText, event)">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <div class="front-hint">[ 空白鍵 ] 翻面</div>
                </div>
                
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    
                    <div class="back-sticky-header">
                        <div style="display:flex; align-items:baseline;">
                            <div class="back-word en-click serif" id="sticky-word" onclick="speakExactText(this.innerText, event)">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                        <div class="back-meaning" id="sticky-meaning">Meaning</div>
                    </div>

                    <!-- 膠囊分頁導航 -->
                    <div class="tab-nav">
                        <div class="tab-btn active" onclick="switchTab('core')">🎯 核心</div>
                        <div class="tab-btn" onclick="switchTab('action')">⚡ 實戰</div>
                        <div class="tab-btn" onclick="switchTab('links')">🔗 外部</div>
                    </div>
                    
                    <div class="tab-content-wrapper">
                        <!-- Tab 1: Core -->
                        <div class="tab-pane active" id="tab-core">
                            <div id="back-etymology"></div>
                            <div class="section-title" style="margin-top:20px;">Lexical Relations</div>
                            <div class="lexical-grid" id="lexical-grid"></div>
                            <div id="near-synonyms-container"></div>
                        </div>

                        <!-- Tab 2: Action -->
                        <div class="tab-pane" id="tab-action" style="display:flex; flex-direction:column; padding-top:15px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;">
                                <div class="section-title" style="margin:0; border:none;">Focus Stepper (挖空提取)</div>
                                <div id="focus-header-info" style="font-size:0.75rem; color:var(--text-mut); font-weight:bold; letter-spacing:1px;"></div>
                            </div>
                            <div id="focus-wrapper-outer" style="flex:1; overflow:hidden;"></div>
                        </div>

                        <!-- Tab 3: Links -->
                        <div class="tab-pane" id="tab-links">
                            <div class="section-title">Authority References</div>
                            <div class="external-links" id="back-links"></div>
                        </div>
                    </div>

                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">[ 1 ] 忘記</button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">[ 2 ] 模糊</button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">[ 3 ] 掌握</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-finish">
            <h2 style="margin-bottom:20px; color:#fff; font-weight:300;">學習完成</h2>
            <button style="background:none; border:1px solid var(--text-sub); color:var(--text-main); padding: 8px 16px; border-radius:4px; cursor:pointer;" onclick="goHome()">返回目錄</button>
        </div>
    </main>

    <aside id="right-panel">
        <div id="right-panel-overlay">
            <div>
                <div class="lock-icon">🔒</div>
                <div class="lock-text">翻卡解鎖脈絡</div>
            </div>
        </div>
        <div class="aside-scroll">
            <div class="aside-block">
                <div class="section-title">Background (背景知識)</div>
                <div class="aside-content" id="panel-bg"></div>
            </div>
            <div class="aside-block">
                <div class="section-title">Usage Context (使用時機)</div>
                <div class="aside-content" id="panel-context"></div>
            </div>
        </div>
    </aside>

    <footer>
        <div class="stat">進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        let catalogData =[]; let currentTopicWords =[]; let cardCache = {}; 
        let learningQueue =[]; let currentIndex = 0;
        const SRS_KEY = 'expertLingoSRS_v11';
        let srsDB = JSON.parse(localStorage.getItem(SRS_KEY)) || {};

        let currentExIndex = 0; let currentExStage = 1;
        let matchSelection = null; let matchedCount = 0;

        window.onload = async () => {
            updateGlobalReviewCount();
            await fetchCatalog();
            goHome();
        };

        // --- 全局快捷鍵 (Power User Shortcuts) ---
        document.addEventListener('keydown', (e) => {
            if(document.getElementById('view-study').style.display !== 'flex') return;
            const card = document.getElementById('flashcard');
            
            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (card.classList.contains('flipped')) {
                if (e.key === '1') { e.preventDefault(); processSRS(0); }
                else if (e.key === '2') { e.preventDefault(); processSRS(1); }
                else if (e.key === '3') { e.preventDefault(); processSRS(2); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); changeEx(-1, e); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); changeEx(1, e); }
            }
        });

        // --- Layout & Tabs ---
        function toggleSidebar() {
            if(window.innerWidth > 1024) document.body.classList.toggle('hide-sidebar');
            else document.body.classList.toggle('show-mobile-sidebar');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // --- Core Functions ---
        function updateGlobalReviewCount() {
            const now = Date.now(); let count = 0;
            for(let key in srsDB) { if(srsDB[key].nextReview <= now && srsDB[key].card_file) count++; }
            const btn = document.getElementById('btn-global-review');
            btn.innerText = `🔥 複習 (${count})`;
            if(count > 0) btn.classList.add('has-review'); else btn.classList.remove('has-review');
        }

        async function startGlobalReview() {
            const now = Date.now(); let dueFiles =[];
            for(let key in srsDB) { if(srsDB[key].nextReview <= now && srsDB[key].card_file) dueFiles.push(srsDB[key].card_file); }
            if(dueFiles.length === 0) { alert("目前沒有需要複習的卡片。"); return; }
            
            document.getElementById('view-catalog').style.display = 'none';
            document.getElementById('view-topic').style.display = 'none';
            
            learningQueue =[];
            for(let file of dueFiles) {
                try {
                    let res = await fetch(file); let card = await res.json();
                    card.card_file = file; learningQueue.push(card);
                } catch(e) {}
            }
            learningQueue.sort(() => Math.random() - 0.5); 
            document.getElementById('header-topic-title').innerText = `總複習模式 (${learningQueue.length})`;
            document.getElementById('header-topic-title').style.display = 'block';
            document.getElementById('view-study').style.display = 'flex';
            document.body.classList.add('hide-sidebar', 'hide-aside');
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
            currentIndex = 0; renderCard();
        }

        async function fetchCatalog() {
            try {
                const res = await fetch('index.json'); const data = await res.json();
                catalogData = data.catalog;
                document.getElementById('sidebar').innerHTML = catalogData.map((cat, i) => `
                    <div class="category-title">${cat.group_name}</div>
                    <div class="topic-list">${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">${t.title_zh}</div>`).join('')}</div>
                `).join('');
                document.getElementById('catalog-grid').innerHTML = catalogData.map(cat => cat.topics.map(t => `
                    <div class="catalog-card" onclick="loadTopic('${t.file_name}', '${t.title_zh}')">
                        <div class="cat-badge">${cat.group_name}</div>
                        <div class="cat-title">${t.title_en}</div>
                    </div>`).join('')).join('');
            } catch (e) { console.log("未檢測到 index.json"); }
        }

        function goHome() {
            document.body.classList.remove('hide-sidebar'); document.body.classList.add('hide-aside'); 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-topic').style.display = 'none';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
        }

        async function loadTopic(fileName, titleDisplay) {
            try {
                const res = await fetch(fileName); const topicData = await res.json();
                currentTopicWords = topicData.words;
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-topic').style.display = 'block';
                document.getElementById('header-topic-title').innerText = titleDisplay;
                document.getElementById('header-topic-title').style.display = 'block';
                document.getElementById('topic-title-display').innerText = topicData.title_zh;
                document.body.classList.add('hide-sidebar');
                if(window.innerWidth <= 1024) document.body.classList.remove('show-mobile-sidebar');
                initMatchingGame(); preloadCards(currentTopicWords);
            } catch (e) { alert(`無法載入主題包 ${fileName}`); }
        }

        async function preloadCards(words) {
            cardCache = {};
            for (let w of words) {
                try { let res = await fetch(w.card_file); let cardData = await res.json(); cardData.card_file = w.card_file; cardCache[w.word_en] = cardData; } 
                catch(e) {}
            }
        }

        function initMatchingGame() {
            const grid = document.getElementById('matching-grid'); const btn = document.getElementById('btn-start-study');
            grid.innerHTML = ''; btn.classList.remove('active'); matchSelection = null; matchedCount = 0;
            let tiles =[];
            currentTopicWords.forEach((w, i) => { tiles.push({id:i, type:'en', text:w.word_en}); tiles.push({id:i, type:'zh', text:w.word_zh}); });
            tiles.sort(() => Math.random() - 0.5).forEach(t => {
                const div = document.createElement('div'); div.className = 'match-tile'; div.innerText = t.text;
                div.onclick = () => handleMatchClick(div, t.id, t.type); grid.appendChild(div);
            });
        }

        function handleMatchClick(el, id, type) {
            if(el.classList.contains('matched') || el.classList.contains('selected')) return;
            if(!matchSelection) { matchSelection = { el, id, type }; el.classList.add('selected'); } 
            else {
                if(matchSelection.id === id && matchSelection.type !== type) {
                    el.classList.add('matched'); matchSelection.el.classList.replace('selected','matched');
                    matchedCount += 2; if(matchedCount === currentTopicWords.length * 2) document.getElementById('btn-start-study').classList.add('active');
                } else {
                    el.classList.add('wrong'); matchSelection.el.classList.replace('selected','wrong');
                    setTimeout(() => { el.classList.remove('wrong'); if(matchSelection) matchSelection.el.classList.remove('wrong'); matchSelection = null; }, 400); return;
                }
                matchSelection = null;
            }
        }

        function startStudy() {
            document.getElementById('view-topic').style.display = 'none'; document.getElementById('view-study').style.display = 'flex';
            const now = Date.now(); learningQueue = currentTopicWords.map(w => cardCache[w.word_en]).filter(Boolean); 
            let dueQueue = learningQueue.filter(item => !srsDB[item.word_en] || srsDB[item.word_en].nextReview <= now);
            if(dueQueue.length > 0) learningQueue = dueQueue; 
            currentIndex = 0; renderCard();
        }

        function forceStartStudy() { startStudy(); } // Bypass matching

        // --- 字串解析與挖空 (Cloze Deletion) ---
        function parseInlineTTS(text) {
            if(!text) return '';
            return text.replace(/\{\{(.*?)\}\}/g, '<span class="en-click" onclick="speakExactText(\'$1\', event)">$1</span>');
        }
        function applyCloze(text, targetWord) {
            if(!text || !targetWord) return text;
            const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapeRegExp(targetWord)})`, 'gi');
            return text.replace(regex, `<span class="cloze-blank" onclick="revealCloze(this, '$1', event)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
        }
        window.revealCloze = function(el, word, e) {
            e.stopPropagation();
            el.className = 'en-click cloze-revealed serif';
            el.innerText = word;
            speakExactText(word);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s]/gi, '')); 
                utter.lang = 'en-US'; utter.rate = 0.9; window.speechSynthesis.speak(utter);
            }
        }

        // --- Render Functions ---
        function renderLexicalWeb(item) {
            let lexHtml = ''; let nearHtml = ''; let etyHtml = '';
            if(item.lexical_relations) {
                const {synonyms:syns, antonyms:ants, near_synonyms:nears} = item.lexical_relations;
                if(syns?.length) lexHtml += `<div class="lex-box"><div class="lex-label">Synonyms</div><div class="lex-tags">${syns.map(s => `<span class="lex-tag en-click" onclick="speakExactText('${s}', event)">${s}</span>`).join('')}</div></div>`;
                if(ants?.length) lexHtml += `<div class="lex-box"><div class="lex-label">Antonyms</div><div class="lex-tags">${ants.map(a => `<span class="lex-tag en-click" onclick="speakExactText('${a}', event)">${a}</span>`).join('')}</div></div>`;
                if(nears?.length) nearHtml = `<div class="nuance-box"><div class="lex-label" style="margin-bottom:10px;">Near-Synonyms & Nuance</div>${nears.map(n => `<div class="nuance-item"><span class="en-click" onclick="speakExactText('${n.word}', event)">${n.word}</span>：${n.nuance}</div>`).join('')}</div>`;
            }
            document.getElementById('lexical-grid').innerHTML = lexHtml;
            document.getElementById('near-synonyms-container').innerHTML = nearHtml;

            if(item.etymology) {
                etyHtml += `<div class="section-title">Etymology (詞源拆解)</div><div class="ety-breakdown serif">`;
                etyHtml += item.etymology.breakdown.map(b => `<div class="ety-part"><span class="en-click" onclick="speakExactText('${b.part}', event)">${b.part}</span><em>${b.meaning}</em></div>`).join('<span style="color:var(--text-mut); margin: 0 5px; font-family:var(--font-sans);">+</span>'); 
                if(item.etymology.cognates?.length) etyHtml += `<div style="width:100%; margin-top:8px; font-size:0.85rem; color:var(--text-sub); border-top:1px dashed var(--border); padding-top:8px; font-family:var(--font-sans);">Cognates: ${item.etymology.cognates.map(c => `<span class="en-click serif" style="color:#cbd5e1; margin-right:8px; font-weight:bold;" onclick="speakExactText('${c}', event)">${c}</span>`).join('')}</div>`;
                etyHtml += `</div>`;
            }
            document.getElementById('back-etymology').innerHTML = etyHtml;
        }

        function renderFocusMode() {
            const item = learningQueue[currentIndex];
            const containerOuter = document.getElementById('focus-wrapper-outer');
            const infoText = document.getElementById('focus-header-info');
            
            if(!item.example_clusters?.length) { containerOuter.innerHTML = ''; infoText.innerText = ''; return; }

            const total = item.example_clusters.length; const cluster = item.example_clusters[currentExIndex];
            infoText.innerText = `${currentExIndex + 1} / ${total}`;
            const targetWord = item.word_en;

            let html = `<div class="focus-outer">
                <button class="nav-arrow" onclick="changeEx(-1, event)" ${currentExIndex===0?'disabled':''}>&#10094;</button>
                <div class="focus-container">`;

            html += `<div class="focus-stage" onclick="speakExactText('${cluster.phrase.en.replace(/'/g, "\\'")}', event)">
                <div class="ex-en">${applyCloze(cluster.phrase.en, targetWord)}</div>
                <div class="ex-zh">${cluster.phrase.zh}</div>
            </div>`;

            if(currentExStage >= 2) {
                html += `<div class="focus-stage" style="background:rgba(0,0,0,0.2);" onclick="speakExactText('${cluster.sentence.en.replace(/'/g, "\\'")}', event)">
                    <div class="ex-en">${applyCloze(cluster.sentence.en, targetWord)}</div>
                    <div class="ex-zh">${cluster.sentence.zh}</div>
                </div>`;
            }

            if(currentExStage >= 3) {
                html += `<div class="focus-stage" style="background:rgba(0,0,0,0.4); cursor:default;" onclick="event.stopPropagation()">`;
                cluster.dialogue.forEach(d => {
                    html += `<div style="margin-bottom:10px; cursor:pointer;" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span class="ex-speaker">${d.speaker}</span><span class="ex-en" style="font-size:0.95rem;">${applyCloze(d.en, targetWord)}</span>
                        <div class="ex-zh">${d.zh}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            html += `</div><button class="nav-arrow" onclick="changeEx(1, event)" ${currentExIndex===total-1?'disabled':''}>&#10095;</button></div>`;
            containerOuter.innerHTML = html;
        }

        window.changeEx = function(dir, e) {
            if(e) e.stopPropagation();
            const total = learningQueue[currentIndex].example_clusters.length;
            currentExIndex = Math.max(0, Math.min(total - 1, currentExIndex + dir));
            currentExStage = 1; renderFocusMode();
        }

        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                document.getElementById('view-study').style.display = 'none';
                document.getElementById('view-finish').style.display = 'flex';
                document.body.classList.add('hide-aside');
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel-overlay').classList.remove('unlocked');
            
            document.body.classList.remove('hide-aside');
            if(window.innerWidth <= 768) document.body.classList.remove('show-mobile-aside');

            currentExIndex = 0; currentExStage = 1;
            switchTab('core'); // Reset tab

            document.getElementById('front-word').innerText = item.word_en;
            document.getElementById('front-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-word').innerText = item.word_en;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-meaning').innerText = item.word_zh;
            
            renderLexicalWeb(item); renderFocusMode();

            const q = encodeURIComponent(item.word_en);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${q}/english" target="_blank">YouGlish 實境發音</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${q}" target="_blank">Wiktionary 詞源與釋義</a>
                <a href="https://www.google.com/search?q=${q}+中文意思" target="_blank">Google 泛用搜尋</a>
            `;

            document.getElementById('panel-bg').innerHTML = parseInlineTTS(item.background);
            document.getElementById('panel-context').innerHTML = parseInlineTTS(item.context);
            updateStats();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            document.getElementById('right-panel-overlay').classList.add('unlocked');
            if(window.innerWidth <= 768) document.body.classList.add('show-mobile-aside');
        }

        function processSRS(qIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.word_en] || { interval: 0, reps: 0 };
            if(item.card_file) rec.card_file = item.card_file;

            if(qIndex === 0) { rec.reps = 0; rec.interval = 1; }
            else if(qIndex === 1) { rec.reps++; rec.interval = rec.reps === 1 ? 12*60 : rec.interval * 1.5; }
            else { rec.reps++; rec.interval = rec.reps === 1 ? 3*24*60 : rec.interval * 2.5; }
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.word_en] = rec;
            localStorage.setItem(SRS_KEY, JSON.stringify(srsDB));

            currentIndex++; updateStats(); updateGlobalReviewCount(); 
            
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                renderCard();
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 250);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            document.getElementById('top-progress-bar').style.width = `${(currentIndex / total) * 100}%`;
            document.querySelector('.stat span:first-child').innerText = `${Math.min(currentIndex, total)} / ${total}`;
            document.getElementById('stat-queue').innerText = Math.max(0, total - currentIndex);
        }
    </script>
</body>
</html>
