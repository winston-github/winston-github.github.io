<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 頂級冷門語彙學習庫</title>
    <style>
        :root {
            --bg-base: #0b1120; --bg-panel: #1e293b; --bg-inner: #0f172a;
            --text-main: #f8fafc; --text-sub: #94a3b8; --text-mut: #475569;
            --accent: #38bdf8; --border: rgba(255, 255, 255, 0.08);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh;
            display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: 280px 1fr 380px;
            transition: grid-template-columns var(--transition);
        }

        body.focus-mode { grid-template-columns: 0px 1fr 0px; }
        body.aside-closed { grid-template-columns: 280px 1fr 0px; }

        /* ========== 無痕發音文字樣式 (取代喇叭圖標) ========== */
        .en-click { 
            cursor: pointer; position: relative; display: inline-block; transition: color var(--transition); 
            border-bottom: 1px dashed rgba(56, 189, 248, 0.4);
        }
        .en-click:hover { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); border-radius: 2px;}

        /* ========== Header ========== */
        header { grid-area: header; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 50; }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-right: 20px; cursor: pointer; letter-spacing: 1px;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-sub); padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-right: 20px; font-size: 0.9rem;}
        .menu-btn:hover { color: var(--text-main); border-color: var(--text-sub);}
        #header-topic-title { color:var(--text-sub); font-size: 0.95rem; display:none; flex: 1; text-align: right; }

        /* ========== Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-inner); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: var(--transition); z-index: 40;}
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; padding: 10px 5px; margin-top: 10px; border-bottom: 1px solid var(--border);}
        .topic-list { padding-left: 5px; margin-top: 5px; }
        .topic-item { font-size: 0.9rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; transition: var(--transition);}
        .topic-item:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent);}
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.6); z-index: 35; }

        /* ========== Main Catalog ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        #view-catalog { padding: 40px 20px; display: block; max-width: 1000px; margin: 0 auto; }
        .catalog-header { font-size: 1.8rem; margin-bottom: 30px; color: #fff; font-weight: 300; letter-spacing: 1px;}
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; cursor: pointer; transition: var(--transition); }
        .catalog-card:hover { border-color: var(--text-sub); background: #233044;}
        .cat-badge { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .cat-title { font-size: 1.1rem; color: #fff; margin-bottom: 15px;}
        .cat-preview { font-size: 0.85rem; color: var(--text-sub); border-top: 1px dashed var(--border); padding-top: 10px;}
        .cat-preview span { display: block; margin-bottom: 4px; }
        .cat-preview span strong { color: #cbd5e1; font-weight: 500;}

        /* ========== Flashcard Study ========== */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 2000px; padding: 20px; }
        .flashcard { width: 100%; max-width: 650px; height: 85vh; max-height: 800px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); cursor: default;}
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden; }
        
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 4rem; font-weight: 700; color: #fff; margin-bottom: 5px; letter-spacing: -1px;}
        .phonetic-front { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 30px; font-family: monospace; }
        .front-hint { position: absolute; bottom: 30px; font-size: 0.85rem; color: var(--text-mut); letter-spacing: 1px;}

        /* Back of Card */
        .card-back { transform: rotateY(180deg); }
        .back-sticky-header { padding: 20px 25px; background: var(--bg-inner); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;}
        .back-word { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .back-phonetic { font-size: 0.9rem; color: var(--text-sub); font-family: monospace; margin-left: 10px;}
        .back-meaning { font-size: 1.1rem; color: var(--accent); font-weight: 500; text-align: right;}

        .back-scroll-area { padding: 25px; overflow-y: auto; flex: 1; }
        .back-scroll-area::-webkit-scrollbar { width: 4px; } .back-scroll-area::-webkit-scrollbar-thumb { background: #475569; }
        
        .section-title { font-size: 0.75rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 5px;}

        /* --- 網彙關聯區 (Lexical Web) --- */
        .lexical-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .lex-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
        .lex-label { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        .lex-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .lex-tag { font-size: 0.85rem; background: var(--bg-inner); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; color: #cbd5e1; }
        
        .nuance-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 25px;}
        .nuance-item { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.4;}
        .nuance-item:last-child { margin-bottom: 0;}
        .nuance-item span.en-click { font-weight: bold; color: #fff; }

        /* 拆文解字區 */
        .ety-breakdown { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; border-radius: 6px;}
        .ety-part { display: flex; align-items: center; }
        .ety-part em { color: var(--text-sub); font-style: normal; margin-left: 6px; font-size: 0.85rem;}

        /* --- 沉浸焦點模式 (Focus Stepper) --- */
        .focus-container { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px;}
        .focus-nav { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 15px; font-size: 0.8rem; color: var(--text-sub); border-bottom: 1px solid var(--border);}
        .focus-nav-btn { cursor: pointer; padding: 2px 10px; border-radius: 4px; transition: var(--transition);}
        .focus-nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff;}
        
        .focus-stage { padding: 15px; border-bottom: 1px dashed var(--border); cursor: pointer; transition: background var(--transition); position: relative;}
        .focus-stage:hover { background: rgba(255,255,255,0.02); }
        .focus-stage:last-child { border-bottom: none; }
        .focus-stage::after { content: "點擊發音與展開"; position: absolute; right: 15px; bottom: 15px; font-size: 0.7rem; color: var(--text-mut); opacity: 0; transition: opacity 0.2s;}
        .focus-stage:hover::after { opacity: 1; }
        .focus-stage.revealed::after { display: none; } /* 已展開不提示展開，僅發音 */

        .ex-en { font-size: 1.05rem; color: #fff; margin-bottom: 5px; line-height: 1.5;}
        .ex-zh { font-size: 0.9rem; color: var(--text-sub); }
        .ex-speaker { color: var(--text-mut); font-weight: bold; margin-right: 8px; font-size: 0.9rem;}
        
        .word-tts { display: inline-block; transition: var(--transition); border-radius: 2px; }
        .word-tts:hover { color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        /* 外部連結 */
        .external-links { display: flex; gap: 10px; margin-bottom: 10px;}
        .external-links a { text-decoration: none; font-size: 0.8rem; padding: 6px 12px; border-radius: 4px; color: var(--text-sub); border: 1px solid var(--border); transition: var(--transition); }
        .external-links a:hover { color: #fff; border-color: var(--text-sub); }

        /* 極簡底部按鈕 */
        .anki-controls { display: flex; gap: 1px; background: var(--border); border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 10; opacity: 0; pointer-events: none; transition: 0.3s; }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 16px 0; border: none; color: var(--text-sub); font-size: 0.9rem; cursor: pointer; transition: var(--transition); background: var(--bg-panel); display: flex; justify-content: center; align-items: center; gap: 8px;}
        .anki-btn:hover { background: var(--bg-inner); color: #fff; }
        .anki-btn span { font-size: 0.75rem; color: var(--text-mut); }
        .btn-again:hover { border-bottom: 2px solid #ef4444; } 
        .btn-hard:hover { border-bottom: 2px solid #f59e0b; } 
        .btn-easy:hover { border-bottom: 2px solid #10b981; }

        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        /* ========== Right Aside (Background) ========== */
        aside { grid-area: aside; background: var(--bg-inner); border-left: 1px solid var(--border); padding: 30px 25px; overflow-y: auto; opacity: 0; transition: opacity 0.4s; }
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 4px; } aside::-webkit-scrollbar-thumb { background: #475569; }
        .aside-block { margin-bottom: 35px; }
        .aside-content { font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; }

        footer { grid-area: footer; background: var(--bg-base); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.8rem; color: var(--text-mut); z-index: 50;}

        @media (max-width: 1024px) {
            body { grid-template-columns: 0px 1fr 320px; }
            nav { position: fixed; left: -280px; top: 60px; height: calc(100vh - 60px); width: 280px; z-index: 60;}
            body.sidebar-open nav { left: 0; }
            body.sidebar-open #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            body { grid-template-areas: "header" "main" "footer"; grid-template-columns: 1fr; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; z-index: 20; padding-bottom: 100px;}
            body.aside-mobile-open aside { right: 0; }
        }
    </style>
</head>
<body class="focus-mode">

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">目錄</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <div id="header-topic-title"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar"></nav>

    <main>
        <div id="view-catalog">
            <h1 class="catalog-header">知識領域</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <div class="card-face card-front">
                    <div class="word-front en-click" id="front-word" onclick="speakExactText(this.innerText, event)">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <div class="front-hint">點擊卡片空白處翻面</div>
                </div>
                
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    
                    <div class="back-sticky-header">
                        <div style="display:flex; align-items:baseline;">
                            <div class="back-word en-click" id="sticky-word" onclick="speakExactText(this.innerText, event)">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                        <div class="back-meaning" id="sticky-meaning">Meaning</div>
                    </div>
                    
                    <div class="back-scroll-area">
                        
                        <!-- 網彙關聯區 -->
                        <div class="section-title">Lexical Relations (字彙網絡)</div>
                        <div class="lexical-grid" id="lexical-grid"></div>
                        <div id="near-synonyms-container"></div>
                        <div id="back-etymology"></div>

                        <!-- 沉浸焦點模式區 -->
                        <div class="section-title" style="margin-top:10px;">Contextual Focus (沉浸語境)</div>
                        <div class="focus-container" id="focus-container"></div>

                        <div class="section-title" style="margin-top:20px;">External References</div>
                        <div class="external-links" id="back-links"></div>
                    </div>

                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">忘記 <span>(1m)</span></button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">模糊 <span>(12h)</span></button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">掌握 <span>(3d)</span></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-finish">
            <h2 style="font-weight:300; letter-spacing:1px; margin-bottom:20px;">章節完成</h2>
            <button style="background:none; border:1px solid var(--text-sub); color:var(--text-main); padding: 8px 16px; border-radius:4px; cursor:pointer;" onclick="goHome()">返回目錄</button>
        </div>
    </main>

    <aside id="right-panel">
        <div class="aside-block">
            <div class="section-title">Background (背景知識)</div>
            <div class="aside-content" id="panel-bg"></div>
        </div>
        <div class="aside-block">
            <div class="section-title">Usage Context (使用時機)</div>
            <div class="aside-content" id="panel-context"></div>
        </div>
    </aside>

    <footer>
        <div class="stat">佇列進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        let catalogData =[];
        let currentTopicData = null;
        let learningQueue =[];
        let currentIndex = 0;
        let srsDB = JSON.parse(localStorage.getItem('expertLingoSRS_v7')) || {};

        // Focus Mode States
        let currentExIndex = 0;
        let currentExStage = 1;

        window.onload = async () => {
            await fetchCatalog();
            goHome();
        };

        async function fetchCatalog() {
            try {
                const res = await fetch('index.json');
                const data = await res.json();
                catalogData = data.catalog;
                
                document.getElementById('sidebar').innerHTML = catalogData.map((cat, i) => `
                    <div class="category-title">${cat.group}</div>
                    <div class="topic-list" id="menu-${i}">
                        ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.id}')">${t.title}</div>`).join('')}
                    </div>
                `).join('');

                document.getElementById('catalog-grid').innerHTML = catalogData.map(cat => cat.topics.map(t => `
                    <div class="catalog-card" onclick="loadTopic('${t.id}')">
                        <div class="cat-badge">${cat.group}</div>
                        <div class="cat-title">${t.title}</div>
                        <div class="cat-preview">
                            ${t.preview_words.map(w => `<span><strong>${w.en}</strong> - ${w.zh}</span>`).join('')}
                        </div>
                    </div>`).join('')).join('');

            } catch (e) {
                alert("無法載入目錄。請確認環境。");
            }
        }

        function goHome() {
            document.body.className = 'focus-mode'; 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            document.body.classList.remove('sidebar-open');
            updateStats();
        }

        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        async function loadTopic(id) {
            try {
                const res = await fetch(`${id}.json`);
                currentTopicData = await res.json();
                
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-finish').style.display = 'none';
                document.getElementById('view-study').style.display = 'flex';
                document.getElementById('header-topic-title').innerText = currentTopicData.title;
                document.getElementById('header-topic-title').style.display = 'block';
                document.body.className = 'aside-closed'; 
                
                buildQueue();
            } catch (e) { 
                alert(`無法載入內容檔 ${id}.json。`); 
            }
        }

        function buildQueue() {
            const now = Date.now();
            learningQueue = currentTopicData.items.filter(item => !srsDB[item.id] || srsDB[item.id].nextReview <= now);
            if(learningQueue.length === 0) learningQueue = [...currentTopicData.items];
            currentIndex = 0;
            renderCard();
        }

        // --- 字串解析工具 ---
        function createWordLevelTTS(text) {
            return text.split(/\s+/).map(word => 
                `<span class="word-tts" onclick="speakExactText('${word.replace(/'/g, "\\'").replace(/"/g, "&quot;")}', event)">${word}</span>`
            ).join(' ');
        }

        function parseInlineTTS(text) {
            if(!text) return '';
            return text.replace(/\{\{(.*?)\}\}/g, '<span class="en-click" onclick="speakExactText(\'$1\', event)">$1</span>');
        }

        // --- 渲染 Lexical Relations ---
        function renderLexicalWeb(item) {
            // Syn/Ant
            let lexHtml = '';
            if(item.synonyms && item.synonyms.length > 0) {
                lexHtml += `<div class="lex-box"><div class="lex-label">Synonyms (同義)</div><div class="lex-tags">` + 
                    item.synonyms.map(s => `<span class="lex-tag en-click" onclick="speakExactText('${s}', event)">${s}</span>`).join('') + `</div></div>`;
            }
            if(item.antonyms && item.antonyms.length > 0) {
                lexHtml += `<div class="lex-box"><div class="lex-label">Antonyms (反義)</div><div class="lex-tags">` + 
                    item.antonyms.map(a => `<span class="lex-tag en-click" onclick="speakExactText('${a}', event)">${a}</span>`).join('') + `</div></div>`;
            }
            document.getElementById('lexical-grid').innerHTML = lexHtml;

            // Near Synonyms
            let nearHtml = '';
            if(item.near_synonyms && item.near_synonyms.length > 0) {
                nearHtml += `<div class="nuance-box"><div class="lex-label" style="margin-bottom:10px;">Near-Synonyms & Nuance (近義語境比較)</div>`;
                nearHtml += item.near_synonyms.map(n => `<div class="nuance-item"><span class="en-click" onclick="speakExactText('${n.word}', event)">${n.word}</span>：${n.nuance}</div>`).join('');
                nearHtml += `</div>`;
            }
            document.getElementById('near-synonyms-container').innerHTML = nearHtml;

            // Etymology
            let etyHtml = '';
            if(item.etymology) {
                etyHtml += `<div class="ety-breakdown">`;
                etyHtml += `<div style="width:100%; font-size:0.7rem; color:var(--text-sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">Etymology Breakdown</div>`;
                etyHtml += item.etymology.breakdown.map(b => 
                    `<div class="ety-part"><span class="en-click" style="font-weight:bold; color:#fff;" onclick="speakExactText('${b.part}', event)">${b.part}</span><em>${b.meaning}</em></div>`
                ).join('<span style="color:var(--text-mut);">+</span>'); 
                if(item.etymology.cognates && item.etymology.cognates.length > 0){
                    etyHtml += `<div style="width:100%; margin-top:8px; font-size:0.8rem; color:var(--text-sub); border-top:1px dashed var(--border); padding-top:8px;">同源：` + 
                        item.etymology.cognates.map(c => `<span class="en-click" style="color:#cbd5e1; margin-right:8px;" onclick="speakExactText('${c}', event)">${c}</span>`).join('') + `</div>`;
                }
                etyHtml += `</div>`;
            }
            document.getElementById('back-etymology').innerHTML = etyHtml;
        }

        // --- 沉浸焦點模式 (Focus Stepper) ---
        function renderFocusMode() {
            const item = learningQueue[currentIndex];
            const container = document.getElementById('focus-container');
            
            if(!item.example_clusters || item.example_clusters.length === 0) {
                container.innerHTML = ''; return;
            }

            const total = item.example_clusters.length;
            const cluster = item.example_clusters[currentExIndex];

            let html = `<div class="focus-nav">
                <span class="focus-nav-btn" onclick="changeEx(-1, event)">&#8592; Prev</span>
                <span>Context ${currentExIndex + 1} of ${total}</span>
                <span class="focus-nav-btn" onclick="changeEx(1, event)">Next &#8594;</span>
            </div>`;

            // Stage 1: Phrase
            const s1Class = currentExStage >= 1 ? (currentExStage > 1 ? 'revealed' : '') : '';
            html += `<div class="focus-stage ${s1Class}" onclick="handleStageClick(1, '${cluster.phrase.en.replace(/'/g, "\\'")}', event)">
                <div class="ex-en">${createWordLevelTTS(cluster.phrase.en)}</div>
                <div class="ex-zh">${cluster.phrase.zh}</div>
            </div>`;

            // Stage 2: Sentence
            if(currentExStage >= 2) {
                const s2Class = currentExStage > 2 ? 'revealed' : '';
                html += `<div class="focus-stage ${s2Class}" style="background:rgba(0,0,0,0.2);" onclick="handleStageClick(2, '${cluster.sentence.en.replace(/'/g, "\\'")}', event)">
                    <div class="ex-en">${createWordLevelTTS(cluster.sentence.en)}</div>
                    <div class="ex-zh">${cluster.sentence.zh}</div>
                </div>`;
            }

            // Stage 3: Dialogue
            if(currentExStage >= 3) {
                html += `<div class="focus-stage revealed" style="background:rgba(0,0,0,0.4); cursor:default;" onclick="event.stopPropagation()">`;
                cluster.dialogue.forEach(d => {
                    html += `<div style="margin-bottom:10px; cursor:pointer;" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span class="ex-speaker">${d.speaker}</span><span class="ex-en" style="font-size:0.95rem;">${d.en}</span>
                        <div class="ex-zh">${d.zh}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function handleStageClick(clickedStage, text, e) {
            e.stopPropagation();
            // 發音整句 (如果使用者沒有點擊到具體的 .word-tts 的話，由 CSS/HTML 結構自然覆蓋或由 JS 執行)
            // 不過既然使用了 createWordLevelTTS，點擊空白處會念整句
            if(!e.target.classList.contains('word-tts')){
                speakExactText(text);
            }

            // 推進展開邏輯
            if(clickedStage === 1 && currentExStage < 2) {
                currentExStage = 2; renderFocusMode();
            } else if (clickedStage === 2 && currentExStage < 3) {
                currentExStage = 3; renderFocusMode();
            }
        }

        function changeEx(dir, e) {
            e.stopPropagation();
            const item = learningQueue[currentIndex];
            const total = item.example_clusters.length;
            currentExIndex = (currentExIndex + dir + total) % total;
            currentExStage = 1; // 切換組別時，重置為第一階
            renderFocusMode();
        }

        // --- 主卡片渲染 ---
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                document.getElementById('view-study').style.display = 'none';
                document.getElementById('view-finish').style.display = 'flex';
                document.body.className = 'focus-mode';
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            document.body.classList.add('aside-closed');
            if(window.innerWidth <= 768) document.body.classList.remove('aside-mobile-open');

            // Reset States
            currentExIndex = 0;
            currentExStage = 1;

            document.getElementById('front-word').innerText = item.word;
            document.getElementById('front-phonetic').innerText = item.phonetic;

            document.getElementById('sticky-word').innerText = item.word;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;
            document.getElementById('sticky-meaning').innerText = item.zh_tw_meaning;
            
            renderLexicalWeb(item);
            renderFocusMode();

            const q = encodeURIComponent(item.word);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${q}/english" target="_blank">YouGlish 實境</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${q}" target="_blank">Wiktionary 詞典</a>
            `;

            document.getElementById('panel-bg').innerHTML = parseInlineTTS(item.background_knowledge);
            document.getElementById('panel-context').innerHTML = parseInlineTTS(item.context_of_use);

            updateStats();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            document.body.classList.remove('aside-closed'); 
            setTimeout(() => {
                document.getElementById('right-panel').classList.add('active'); 
                if(window.innerWidth <= 768) document.body.classList.add('aside-mobile-open');
            }, 100);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s]/gi, '')); 
                utter.lang = 'en-US'; 
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function processSRS(qIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.id] || { interval: 0, reps: 0 };
            
            if(qIndex === 0) { rec.reps = 0; rec.interval = 1; }
            else if(qIndex === 1) { rec.reps++; rec.interval = rec.reps === 1 ? 12*60 : rec.interval * 1.5; }
            else { rec.reps++; rec.interval = rec.reps === 1 ? 3*24*60 : rec.interval * 2.5; }
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.id] = rec;
            localStorage.setItem('expertLingoSRS_v7', JSON.stringify(srsDB));

            currentIndex++;
            updateStats();
            
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                renderCard();
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 250);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            document.getElementById('stat-queue').innerText = Math.max(0, total - currentIndex);
            document.getElementById('stat-progress').innerText = `${Math.min(currentIndex, total)} / ${total}`;
        }
    </script>
</body>
</html>
