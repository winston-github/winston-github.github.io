<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 頂級冷門語彙學習庫</title>
    <style>
        :root {
            --bg-base: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent: #38bdf8; --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh;
            display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: 280px 1fr 380px;
            transition: grid-template-columns 0.3s;
        }

        body.focus-mode { grid-template-columns: 0px 1fr 0px; }
        body.aside-closed { grid-template-columns: 280px 1fr 0px; }

        /* ========== Header ========== */
        header { grid-area: header; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 50; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin-right: 20px; cursor: pointer;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 20px;}
        #header-topic-title { color:var(--text-main); font-weight:bold; display:none; flex: 1; text-align: right; }

        /* ========== Sidebar ========== */
        nav { grid-area: sidebar; background: var(--bg-panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: 0.3s; z-index: 40;}
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.95rem; font-weight: bold; color: var(--accent); padding: 10px; cursor: pointer; border-radius: 6px; margin-top: 5px; background: rgba(255,255,255,0.05);}
        .topic-list { display: none; padding-left: 10px; margin-top: 5px; }
        .topic-item { font-size: 0.85rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; }
        .topic-item:hover { background: rgba(56, 189, 248, 0.2); }
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.5); z-index: 35; }

        /* ========== Main Catalog ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        #view-catalog { padding: 40px 20px; display: block; max-width: 1200px; margin: 0 auto; }
        .catalog-header { font-size: 2rem; margin-bottom: 30px; text-align: center; color: #fff; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: 0.2s; }
        .catalog-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 5px 15px rgba(56,189,248,0.2);}
        .cat-badge { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; font-weight: bold; }
        .cat-title { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 12px;}
        .cat-preview { font-size: 0.85rem; color: #cbd5e1; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }
        .cat-preview span { display: block; margin-bottom: 4px; }
        .cat-preview span strong { color: #fff; }

        /* ========== Flashcard Study ========== */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 1500px; padding: 20px; }
        .flashcard { width: 100%; max-width: 600px; height: 85vh; max-height: 750px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); cursor: default;}
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.4); overflow: hidden; }
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 3.5rem; font-weight: 800; color: #fff; margin-bottom: 10px;}
        .phonetic-front { font-size: 1.2rem; color: var(--text-sub); margin-bottom: 30px; font-style: italic; }
        .front-hint { position: absolute; bottom: 25px; font-size: 0.9rem; color: var(--text-sub); opacity: 0.5;}

        /* Back of Card */
        .card-back { transform: rotateY(180deg); }
        .back-sticky-header { padding: 15px 25px; background: rgba(30, 41, 59, 0.98); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; cursor: pointer; transition: 0.2s;}
        .back-sticky-header:hover { background: rgba(56, 189, 248, 0.1); }
        .back-word { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .back-phonetic { font-size: 0.85rem; color: var(--text-sub); font-style: italic; }
        
        .back-scroll-area { padding: 25px; overflow-y: auto; flex: 1; }
        .back-scroll-area::-webkit-scrollbar { width: 4px; } .back-scroll-area::-webkit-scrollbar-thumb { background: #475569; }
        .meaning-huge { font-size: 1.8rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        .meta-info { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px;}
        .section-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold;}
        
        /* 拆文解字區 (Etymology) */
        .etymology-box { background: rgba(2, 132, 199, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 15px; margin-bottom: 25px; }
        .ety-desc { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.5; }
        .ety-breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .ety-part { background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 6px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); }
        .ety-cognates { font-size: 0.85rem; color: var(--text-sub); }

        /* 中英夾雜發音小按鈕 (Inline TTS) */
        .inline-tts { color: #fff; background: rgba(56, 189, 248, 0.2); border: 1px solid var(--accent); padding: 1px 6px; border-radius: 4px; cursor: pointer; font-size: 0.9em; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; margin: 0 3px;}
        .inline-tts:hover { background: var(--accent); color: #000; }

        /* 3 階段網狀記憶區 (Phrase -> Sentence -> Dialogue) */
        .ex-cluster { background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 15px; border-left: 2px solid var(--accent); overflow: hidden; }
        
        .ex-stage { padding: 12px 15px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; transition: 0.2s; }
        .ex-stage:hover { background: rgba(255,255,255,0.05); }
        .ex-stage.level-2 { background: rgba(0,0,0,0.15); border-top: 1px dashed rgba(255,255,255,0.1); display: none; }
        .ex-stage.level-3 { background: rgba(0,0,0,0.3); border-top: 1px dashed rgba(255,255,255,0.1); display: none; flex-direction: column; cursor: default;}
        
        .ex-content { flex: 1; }
        .ex-en { font-size: 1.05rem; color: #fff; margin-bottom: 4px; line-height: 1.4;}
        .ex-zh { font-size: 0.9rem; color: var(--text-sub); }
        .ex-speaker { color: var(--accent); font-weight: bold; margin-right: 5px; }
        
        .btn-drill { background: rgba(56,189,248,0.15); color: var(--accent); border: 1px solid rgba(56,189,248,0.3); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; margin-left: 10px; white-space: nowrap; }
        .btn-drill:hover { background: var(--accent); color: #000; }
        
        .word-tts:hover { background: rgba(56, 189, 248, 0.4); border-radius: 3px; color: #fff;}

        /* 外部連結與底部控制 */
        .external-links { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 20px;}
        .external-links a { text-decoration: none; font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; font-weight: bold; color: var(--text-main); background: rgba(255,255,255,0.05); border: 1px solid var(--border); transition: 0.2s; }
        .external-links a:hover { background: rgba(255,255,255,0.15); border-color: #fff; }

        .anki-controls { display: flex; gap: 10px; padding: 15px; background: rgba(30, 41, 59, 0.98); border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 10; opacity: 0; pointer-events: none; transition: 0.3s; }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 12px 0; border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: 0.15s; background: rgba(0,0,0,0.2); }
        .anki-btn:hover { background: rgba(255,255,255,0.1); }
        .btn-again { border-bottom: 3px solid #ef4444; } 
        .btn-hard { border-bottom: 3px solid #f59e0b; } 
        .btn-easy { border-bottom: 3px solid #10b981; }

        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        /* ========== Right Aside ========== */
        aside { grid-area: aside; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 25px; overflow-y: auto; opacity: 0; transition: opacity 0.4s; }
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 4px; } aside::-webkit-scrollbar-thumb { background: #475569; }
        .aside-block { margin-bottom: 30px; }
        .aside-content { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; }

        footer { grid-area: footer; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.85rem; color: var(--text-sub); z-index: 50;}
        .stat span { font-weight: bold; color: var(--accent); margin-left: 5px;}

        @media (max-width: 1024px) {
            body { grid-template-columns: 0px 1fr 320px; }
            nav { position: fixed; left: -280px; top: 60px; height: calc(100vh - 60px); width: 280px; z-index: 60;}
            body.sidebar-open nav { left: 0; }
            body.sidebar-open #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            body { grid-template-areas: "header" "main" "footer"; grid-template-columns: 1fr; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; z-index: 20; padding-bottom: 100px;}
            body.aside-mobile-open aside { right: 0; }
        }
    </style>
</head>
<body class="focus-mode">

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <div id="header-topic-title"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar"></nav>

    <main>
        <div id="view-catalog">
            <h1 class="catalog-header">選擇專業領域</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <div class="card-face card-front">
                    <div class="word-front" id="front-word">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <div class="front-hint">點擊任意處翻面</div>
                </div>
                
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    
                    <div class="back-sticky-header" onclick="speakExactText(document.getElementById('sticky-word').innerText, event)">
                        <div>
                            <div class="back-word" id="sticky-word">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                    </div>
                    
                    <div class="back-scroll-area">
                        <div class="meaning-huge" id="back-meaning">Meaning</div>
                        <div class="meta-info" id="back-meta"></div>
                        
                        <!-- 拆文解字區 -->
                        <div class="etymology-box" id="back-etymology" style="display:none;">
                            <div class="section-label">❖ 拆文解字 (Etymology)</div>
                            <div class="ety-desc" id="ety-desc"></div>
                            <div class="ety-breakdown" id="ety-breakdown"></div>
                            <div class="ety-cognates"><strong>同源構型字：</strong><span id="ety-cognates"></span></div>
                        </div>

                        <div class="section-label">3階段網狀記憶 (短詞 ➔ 例句 ➔ 對話)</div>
                        <div id="back-examples"></div>

                        <div class="section-label" style="margin-top:25px;">外部權威字典</div>
                        <div class="external-links" id="back-links"></div>
                    </div>

                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">忘記 (1m)</button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">模糊 (12h)</button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">掌握 (3d)</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-finish">
            <h2>本章節完成</h2>
            <button style="margin-top:20px; background:none; border:none; color:var(--accent); cursor:pointer; font-size:1.1rem;" onclick="goHome()">返回目錄</button>
        </div>
    </main>

    <aside id="right-panel">
        <div class="aside-block">
            <div class="section-label">背景知識</div>
            <div class="aside-content" id="panel-bg"></div>
        </div>
        <div class="aside-block">
            <div class="section-label">使用時機</div>
            <div class="aside-content" id="panel-context"></div>
        </div>
    </aside>

    <footer>
        <div class="stat">進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        let catalogData = [];
        let currentTopicData = null;
        let learningQueue =[];
        let currentIndex = 0;
        let srsDB = JSON.parse(localStorage.getItem('expertLingoSRS_v6')) || {};

        window.onload = async () => {
            await fetchCatalog();
            goHome();
        };

        // 1. 讀取 index.json 產生首頁與側邊欄
        async function fetchCatalog() {
            try {
                const res = await fetch('index.json');
                const data = await res.json();
                catalogData = data.catalog;
                
                // Render Sidebar
                document.getElementById('sidebar').innerHTML = catalogData.map((cat, i) => `
                    <div class="category-title" onclick="document.getElementById('menu-${i}').style.display = document.getElementById('menu-${i}').style.display==='block'?'none':'block'">
                        ${cat.group}
                    </div>
                    <div class="topic-list" id="menu-${i}">
                        ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.id}')">${t.title}</div>`).join('')}
                    </div>
                `).join('');

                // Render Homepage Cards
                const grid = document.getElementById('catalog-grid');
                grid.innerHTML = catalogData.map(cat => cat.topics.map(t => `
                    <div class="catalog-card" onclick="loadTopic('${t.id}')">
                        <div class="cat-badge">${cat.group}</div>
                        <div class="cat-title">${t.title}</div>
                        <div class="cat-preview">
                            ${t.preview_words.map(w => `<span><strong>${w.en}</strong> - ${w.zh}</span>`).join('')}
                        </div>
                    </div>`).join('')).join('');

            } catch (e) {
                console.error("無法載入 index.json", e);
                alert("無法載入目錄，請確認伺服器或 GitHub Pages 設定。");
            }
        }

        function goHome() {
            document.body.className = 'focus-mode'; 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            document.body.classList.remove('sidebar-open');
            updateStats();
        }

        function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

        // 2. 載入獨立的 000000.json
        async function loadTopic(id) {
            try {
                const res = await fetch(`${id}.json`);
                currentTopicData = await res.json();
                
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-finish').style.display = 'none';
                document.getElementById('view-study').style.display = 'flex';
                document.getElementById('header-topic-title').innerText = currentTopicData.title;
                document.getElementById('header-topic-title').style.display = 'block';
                document.body.className = 'aside-closed'; 
                
                buildQueue();
            } catch (e) { 
                alert(`無法載入內容檔 ${id}.json。請確認檔案是否存在。`); 
            }
        }

        function buildQueue() {
            const now = Date.now();
            learningQueue = currentTopicData.items.filter(item => !srsDB[item.id] || srsDB[item.id].nextReview <= now);
            if(learningQueue.length === 0) learningQueue = [...currentTopicData.items]; // 防呆，全會了就重來
            currentIndex = 0;
            renderCard();
        }

        // 解析單字級 TTS
        function createWordLevelTTS(text) {
            return text.split(/\s+/).map(word => 
                `<span class="word-tts" onclick="speakExactText('${word.replace(/'/g, "\\'").replace(/"/g, "&quot;")}', event)">${word}</span>`
            ).join(' ');
        }

        // 解析 Inline {{英文}} TTS
        function parseInlineTTS(text) {
            if(!text) return '';
            return text.replace(/\{\{(.*?)\}\}/g, '<span class="inline-tts" onclick="speakExactText(\'$1\', event)" title="點擊發音">$1 🔊</span>');
        }

        // 解析 Etymology 成為可點擊的 TTS
        function renderEtymology(etymology) {
            const etyBox = document.getElementById('back-etymology');
            if (!etymology) { etyBox.style.display = 'none'; return; }
            
            etyBox.style.display = 'block';
            document.getElementById('ety-desc').innerHTML = parseInlineTTS(etymology.description);
            
            // 拆解字發音
            document.getElementById('ety-breakdown').innerHTML = etymology.breakdown.map(b => 
                `<div class="ety-part"><strong class="inline-tts" onclick="speakExactText('${b.part}', event)">${b.part} 🔊</strong><em style="color:var(--text-sub); font-style:normal; margin-left:5px;">${b.meaning}</em></div>`
            ).join('➔ '); 

            // 同源字發音
            document.getElementById('ety-cognates').innerHTML = etymology.cognates.map(c => 
                `<span class="inline-tts" onclick="speakExactText('${c}', event)">${c} 🔊</span>`
            ).join(' ');
        }

        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                document.getElementById('view-study').style.display = 'none';
                document.getElementById('view-finish').style.display = 'flex';
                document.body.className = 'focus-mode';
                return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            document.body.classList.add('aside-closed');
            if(window.innerWidth <= 768) document.body.classList.remove('aside-mobile-open');

            document.getElementById('front-word').innerText = item.word;
            document.getElementById('front-phonetic').innerText = item.phonetic;
            speakExactText(item.word, null);

            document.getElementById('sticky-word').innerText = item.word;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;
            document.getElementById('back-meaning').innerText = item.zh_tw_meaning;
            document.getElementById('back-meta').innerText = `${item.part_of_speech} | 變體: ${item.variations.join(', ') || '無'}`;
            
            renderEtymology(item.etymology);

            // 渲染 3 階段網狀例句
            if(item.example_clusters) {
                document.getElementById('back-examples').innerHTML = item.example_clusters.map((cluster, idx) => {
                    const phraseHtml = createWordLevelTTS(cluster.phrase.en);
                    const sentHtml = createWordLevelTTS(cluster.sentence.en);
                    const dialogHtml = cluster.dialogue.map(d => `
                        <div style="margin-bottom:8px;" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                            <span class="ex-speaker">${d.speaker}:</span><span class="ex-en" style="cursor:pointer;">${d.en}</span>
                            <div class="ex-zh">${d.zh}</div>
                        </div>
                    `).join('');

                    return `
                        <div class="ex-cluster">
                            <!-- 第一階: 短詞 -->
                            <div class="ex-stage level-1" onclick="speakExactText('${cluster.phrase.en.replace(/'/g, "\\'")}', event)">
                                <div class="ex-content"><div class="ex-en">${phraseHtml}</div><div class="ex-zh">${cluster.phrase.zh}</div></div>
                                <button class="btn-drill" onclick="toggleStage('sent-${idx}', event)">➡️ 例句</button>
                            </div>
                            <!-- 第二階: 例句 -->
                            <div class="ex-stage level-2" id="sent-${idx}" onclick="speakExactText('${cluster.sentence.en.replace(/'/g, "\\'")}', event)">
                                <div class="ex-content"><div class="ex-en">${sentHtml}</div><div class="ex-zh">${cluster.sentence.zh}</div></div>
                                <button class="btn-drill" onclick="toggleStage('dlg-${idx}', event)">💬 情境</button>
                            </div>
                            <!-- 第三階: 真實對話 -->
                            <div class="ex-stage level-3" id="dlg-${idx}">
                                ${dialogHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                document.getElementById('back-examples').innerHTML = '';
            }

            const q = encodeURIComponent(item.word);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${q}/english" target="_blank">YouGlish</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${q}" target="_blank">Wiktionary</a>
                <a href="https://www.google.com/search?q=${q}+中文意思+用法" target="_blank">Google</a>
            `;

            document.getElementById('panel-bg').innerHTML = parseInlineTTS(item.background_knowledge);
            document.getElementById('panel-context').innerHTML = parseInlineTTS(item.context_of_use);

            updateStats();
        }

        function toggleStage(targetId, e) {
            e.stopPropagation(); // 避免點擊按鈕時觸發 TTS
            const el = document.getElementById(targetId);
            el.style.display = (el.style.display === 'flex' || el.style.display === 'block') ? 'none' : (targetId.startsWith('dlg') ? 'block' : 'flex');
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            document.body.classList.remove('aside-closed'); 
            setTimeout(() => {
                document.getElementById('right-panel').classList.add('active'); 
                if(window.innerWidth <= 768) document.body.classList.add('aside-mobile-open');
            }, 100);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s]/gi, '')); 
                utter.lang = 'en-US'; 
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        function processSRS(qIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.id] || { interval: 0, reps: 0 };
            
            if(qIndex === 0) { rec.reps = 0; rec.interval = 1; }
            else if(qIndex === 1) { rec.reps++; rec.interval = rec.reps === 1 ? 12*60 : rec.interval * 1.5; }
            else { rec.reps++; rec.interval = rec.reps === 1 ? 3*24*60 : rec.interval * 2.5; }
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.id] = rec;
            localStorage.setItem('expertLingoSRS_v6', JSON.stringify(srsDB));

            currentIndex++;
            updateStats();
            
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                renderCard();
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 250);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            document.getElementById('stat-queue').innerText = Math.max(0, total - currentIndex);
            document.getElementById('stat-progress').innerText = `${Math.min(currentIndex, total)} / ${total}`;
        }
    </script>
</body>
</html>
