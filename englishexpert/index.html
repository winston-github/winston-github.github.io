<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 頂級冷門語彙學習庫</title>
    <style>
        :root {
            --bg-base: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3); --border: rgba(255, 255, 255, 0.1);
            --btn-fail: #ef4444; --btn-hard: #f59e0b; --btn-easy: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-base); color: var(--text-main); height: 100vh;
            display: grid; overflow: hidden;
            grid-template-areas: "header header header" "sidebar main aside" "footer footer footer";
            grid-template-rows: 60px 1fr 40px; grid-template-columns: 280px 1fr 380px;
            transition: grid-template-columns 0.3s;
        }

        /* 專注模式與側邊欄控制 */
        body.focus-mode { grid-template-columns: 0px 1fr 0px; }
        body.aside-closed { grid-template-columns: 280px 1fr 0px; }
        body.sidebar-closed { grid-template-columns: 0px 1fr 380px; }

        /* ========== 1. Top Header ========== */
        header { grid-area: header; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 50; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin-right: 20px; cursor: pointer;}
        .menu-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 20px; transition: 0.2s;}
        .menu-btn:hover { background: rgba(255,255,255,0.1); }
        
        /* ========== 2. Left Sidebar (抽屜式) ========== */
        nav { grid-area: sidebar; background: var(--bg-panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 15px; transition: 0.3s; z-index: 40;}
        nav::-webkit-scrollbar { width: 4px; } nav::-webkit-scrollbar-thumb { background: #475569; }
        .category-title { font-size: 0.95rem; font-weight: bold; color: var(--accent); padding: 10px; cursor: pointer; border-radius: 6px; margin-top: 5px; background: rgba(255,255,255,0.05);}
        .topic-list { display: none; padding-left: 10px; margin-top: 5px; }
        .topic-item { font-size: 0.85rem; padding: 8px; color: #cbd5e1; cursor: pointer; border-radius: 4px; }
        .topic-item:hover { background: rgba(56, 189, 248, 0.2); }

        /* 左側遮罩 (Mobile) */
        #sidebar-overlay { display: none; position: fixed; top:60px; left:0; width:100%; height:calc(100vh - 60px); background: rgba(0,0,0,0.5); z-index: 35; }

        /* ========== 3. Main Area ========== */
        main { grid-area: main; position: relative; overflow-y: auto; overflow-x: hidden; }
        
        /* 視圖 A: 100 主題全螢幕選單 */
        #view-catalog { padding: 40px 20px; display: block; max-width: 1200px; margin: 0 auto; }
        .catalog-header { font-size: 2rem; margin-bottom: 30px; text-align: center; color: #fff; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .catalog-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: 0.2s; }
        .catalog-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 5px 15px var(--accent-glow); }
        .cat-badge { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; font-weight: bold; }
        .cat-title { font-size: 1.1rem; font-weight: bold; color: var(--accent);}

        /* 視圖 B: 卡片學習區 */
        #view-study { display: none; height: 100%; justify-content: center; align-items: center; perspective: 1500px; padding: 20px; }
        .flashcard { width: 100%; max-width: 550px; height: 80vh; max-height: 700px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        /* 卡片共用 */
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--bg-panel); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.4); overflow: hidden; }
        
        /* 卡片正面 */
        .card-front { justify-content: center; align-items: center; text-align: center; padding: 30px;}
        .word-front { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;}
        .phonetic-front { font-size: 1.2rem; color: var(--text-sub); margin-bottom: 30px; font-style: italic; }
        .btn-speak-large { background: none; border: 2px solid var(--accent); color: var(--accent); width: 70px; height: 70px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px var(--accent-glow); display:flex; justify-content:center; align-items:center; }
        .btn-speak-large:hover { background: var(--accent); color: #000; transform: scale(1.1); }
        .front-hint { position: absolute; bottom: 25px; font-size: 0.9rem; color: var(--text-sub); animation: pulse 2s infinite;}

        @keyframes pulse { 0% { opacity:0.5; } 50% { opacity:1; } 100% { opacity:0.5; } }

        /* 卡片背面 (嚴格的三層式架構) */
        .card-back { transform: rotateY(180deg); }
        
        /* 1. 背面頂部: 常駐視覺錨點 (Sticky Header) */
        .back-sticky-header { padding: 15px 25px; background: rgba(30, 41, 59, 0.98); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(5px);}
        .back-word-group { display: flex; flex-direction: column; }
        .back-word { font-size: 1.6rem; font-weight: bold; color: #fff; }
        .back-phonetic { font-size: 0.9rem; color: var(--text-sub); font-style: italic; }
        .btn-speak-small { background: var(--accent); border: none; color: #000; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display:flex; justify-content:center; align-items:center; }

        /* 2. 背面中段: 滾動內容區 */
        .back-scroll-area { padding: 25px; overflow-y: auto; flex: 1; }
        .back-scroll-area::-webkit-scrollbar { width: 4px; } .back-scroll-area::-webkit-scrollbar-thumb { background: #475569; }
        .meaning-huge { font-size: 2rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        .meta-info { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        
        .section-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold;}
        
        /* 片語區 (帶發音按鈕) */
        .phrase-item { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; border-left: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: center;}
        .phrase-text { flex: 1; }
        .phrase-en { font-size: 1.05rem; font-weight: bold; color: #fff; margin-bottom: 4px;}
        .phrase-zh { font-size: 0.9rem; color: var(--text-sub); }
        .btn-phrase-speak { background: none; border: 1px solid var(--text-sub); color: var(--text-sub); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; margin-left: 10px; transition: 0.2s;}
        .btn-phrase-speak:hover { background: var(--text-sub); color: #000; }

        /* 外部連結區 */
        .external-links { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; margin-bottom: 30px;}
        .external-links a { text-decoration: none; font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-youglish { background: #E62117; border: 1px solid #E62117; } .btn-youglish:hover { filter: brightness(1.2); }
        .btn-wiki { background: #334155; border: 1px solid #475569; } .btn-wiki:hover { background: #475569; }
        .btn-google { background: #4285F4; border: 1px solid #4285F4; } .btn-google:hover { filter: brightness(1.2); }

        /* 3. 背面底部: 常駐 3 按鈕決策區 (Sticky Footer) */
        .anki-controls { display: flex; gap: 10px; padding: 15px; background: rgba(30, 41, 59, 0.98); border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 10; opacity: 0; pointer-events: none; transition: 0.3s; }
        .flashcard.flipped .anki-controls { opacity: 1; pointer-events: auto; }
        .anki-btn { flex: 1; padding: 15px 0; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.15s; display: flex; flex-direction: column; align-items: center;}
        .anki-btn span { font-size: 0.7rem; font-weight: normal; opacity: 0.8; margin-top: 4px; }
        .anki-btn:active { transform: scale(0.95); }
        .btn-again { background: var(--btn-fail); } 
        .btn-hard { background: var(--btn-hard); color: #000;} 
        .btn-easy { background: var(--btn-easy); }

        /* 視圖 C: 完賽畫面 */
        #view-finish { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .finish-icon { font-size: 5rem; margin-bottom: 20px; text-shadow: 0 0 20px var(--accent-glow);}
        .recommend-btn { background: var(--accent); color: #000; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px; box-shadow: 0 5px 15px var(--accent-glow);}

        /* ========== 4. Right Aside (漸進式揭露教學) ========== */
        aside { grid-area: aside; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 25px; overflow-y: auto; opacity: 0; transition: opacity 0.4s; }
        aside.active { opacity: 1; }
        aside::-webkit-scrollbar { width: 4px; } aside::-webkit-scrollbar-thumb { background: #475569; }
        
        .aside-content { font-size: 1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 25px; }
        
        /* 漸進式揭露 Accordion */
        details.deep-bg { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 25px; }
        details.deep-bg summary { padding: 12px 15px; font-weight: bold; color: var(--accent); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;}
        details.deep-bg summary::-webkit-details-marker { display: none; }
        details.deep-bg summary::after { content: "▼"; font-size: 0.8rem; transition: 0.3s; }
        details.deep-bg[open] summary::after { transform: rotate(180deg); }
        details.deep-bg > div { padding: 0 15px 15px 15px; font-size: 0.95rem; color: var(--text-sub); line-height: 1.6;}

        .dialogue-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--accent);}
        .dialogue-en { font-weight: 500; cursor: pointer; margin-bottom: 6px; color: #fff; display:flex; justify-content: space-between; align-items: center; transition: 0.2s;}
        .dialogue-en:hover { color: var(--accent); }
        .dialogue-zh { font-size: 0.9rem; color: var(--text-sub); }

        /* ========== 5. Footer Stats ========== */
        footer { grid-area: footer; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.85rem; color: var(--text-sub); z-index: 50;}
        .stat span { font-weight: bold; color: var(--accent); margin-left: 5px;}

        /* ========== RWD ========== */
        @media (max-width: 1024px) {
            body { grid-template-columns: 0px 1fr 320px; } /* 預設收合左側 */
            nav { position: fixed; left: -280px; top: 60px; height: calc(100vh - 60px); width: 280px; z-index: 60; box-shadow: 5px 0 15px rgba(0,0,0,0.5);}
            body.sidebar-open nav { left: 0; }
            body.sidebar-open #sidebar-overlay { display: block; }
        }
        @media (max-width: 768px) {
            body { grid-template-areas: "header" "main" "footer"; grid-template-columns: 1fr; }
            aside { position: fixed; right: -100%; top: 60px; height: calc(100vh - 100px); width: 100%; z-index: 20; padding-bottom: 100px;}
            body.aside-mobile-open aside { right: 0; }
            .flashcard { height: 75vh; }
        }
    </style>
</head>
<body class="focus-mode">

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰ 目錄</button>
        <div class="logo" onclick="goHome()">ExpertLingo</div>
        <div style="flex:1"></div>
        <div id="header-topic-title" style="color:var(--text-main); font-weight:bold; display:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;"></div>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar">
        <!-- JS 動態生成 -->
    </nav>

    <main>
        <!-- 視圖 A: 首頁 100 個主題 Grid -->
        <div id="view-catalog">
            <h1 class="catalog-header">選擇專業領域降維打擊</h1>
            <div class="catalog-grid" id="catalog-grid"></div>
        </div>

        <!-- 視圖 B: 核心學習區 -->
        <div id="view-study">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                
                <!-- 卡片正面 -->
                <div class="card-face card-front">
                    <div class="word-front" id="front-word">Loading</div>
                    <div class="phonetic-front" id="front-phonetic"></div>
                    <button class="btn-speak-large" onclick="speakFromElement('front-word', event)">🔊</button>
                    <div class="front-hint">點擊卡片翻面</div>
                </div>
                
                <!-- 卡片背面 (極致優化 UX) -->
                <div class="card-face card-back" onclick="event.stopPropagation()">
                    
                    <!-- 1. 常駐頂部：不怕視覺失憶 -->
                    <div class="back-sticky-header">
                        <div class="back-word-group">
                            <div class="back-word" id="sticky-word">Word</div>
                            <div class="back-phonetic" id="sticky-phonetic">/phonetic/</div>
                        </div>
                        <button class="btn-speak-small" onclick="speakFromElement('sticky-word', event)">🔊</button>
                    </div>
                    
                    <!-- 2. 滾動核心區 -->
                    <div class="back-scroll-area">
                        <div class="meaning-huge" id="back-meaning">Meaning</div>
                        <div class="meta-info" id="back-meta"></div>
                        
                        <!-- 視覺中心：片語與語音 -->
                        <div class="section-label">實戰片語與俚語 (Phrases)</div>
                        <div id="back-phrases"></div>

                        <!-- 視覺中心：精準外部查詢 -->
                        <div class="section-label" style="margin-top:20px;">外部權威驗證 (External)</div>
                        <div class="external-links" id="back-links"></div>
                    </div>

                    <!-- 3. 常駐底部：三選項決策 -->
                    <div class="anki-controls">
                        <button class="anki-btn btn-again" onclick="processSRS(0)">🔴 忘了<span>絕對需要複習</span></button>
                        <button class="anki-btn btn-hard" onclick="processSRS(1)">🟡 模糊<span>差點想不起來</span></button>
                        <button class="anki-btn btn-easy" onclick="processSRS(2)">🟢 秒懂<span>已完全掌握</span></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 視圖 C: 完成畫面 -->
        <div id="view-finish">
            <div class="finish-icon">🏆</div>
            <h2 style="color:var(--accent);">本章節卡片已全數清空！</h2>
            <p style="color:var(--text-sub); margin-top:10px;">強大的詞彙庫需要時間沉澱，我們下次見。</p>
            <button class="recommend-btn" onclick="startRandomTopic()">🎲 隨機挑戰下一個冷門主題</button>
            <button style="margin-top:20px; background:none; border:none; color:var(--text-sub); cursor:pointer; text-decoration:underline;" onclick="goHome()">返回首頁目錄</button>
        </div>
    </main>

    <!-- 右側：漸進式教學面板 -->
    <aside id="right-panel">
        <div class="section-label">精準使用時機 (Context)</div>
        <div class="aside-content" id="panel-context"></div>

        <!-- 漸進式揭露 -->
        <details class="deep-bg">
            <summary>📖 展開深度學術背景</summary>
            <div id="panel-bg"></div>
        </details>

        <div class="section-label">情境對話 (點擊跟讀)</div>
        <div id="panel-dialogue"></div>
    </aside>

    <footer>
        <div class="stat">佇列進度: <span id="stat-progress">0 / 0</span></div>
        <div class="stat">待複習: <span id="stat-queue">0</span></div>
    </footer>

    <script>
        // ------------------------------------------------------------
        // 1. 100 主題資料清單 (精簡演示版)
        // ------------------------------------------------------------
        const catalogData =[
            { group: "哲學與人文", topics:[ {id:'001', title:"1. 歐陸哲學與現象學"}, {id:'004', title:"4. 修辭學與古典辯論"}, {id:'005', title:"5. 邏輯與分析哲學謬誤"} ] },
            { group: "法政與社會", topics:[ {id:'002', title:"2. 英美法系程序與令狀"}, {id:'011', title:"11. 地緣政治與戰略情報"}, {id:'028', title:"28. 博弈論與決策分析"} ] },
            { group: "資訊與密碼學", topics:[ {id:'021', title:"21. 密碼學與零知識證明"}, {id:'045', title:"45. 數位鑑識與駭客攻防"}, {id:'074', title:"74. 後量子密碼學"} ] }
        ];
        const flatTopics = catalogData.flatMap(c => c.topics);

        // ------------------------------------------------------------
        // 系統狀態變數
        // ------------------------------------------------------------
        let currentTopicData = null;
        let learningQueue =[];
        let currentIndex = 0;
        let srsDB = JSON.parse(localStorage.getItem('expertLingoSRS_v3')) || {};

        window.onload = () => {
            renderCatalog();
            renderSidebar();
            goHome();
        };

        // ------------------------------------------------------------
        // UI 佈局切換
        // ------------------------------------------------------------
        function goHome() {
            document.body.className = 'focus-mode'; 
            document.getElementById('view-catalog').style.display = 'block';
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'none';
            document.getElementById('header-topic-title').style.display = 'none';
            document.body.classList.remove('sidebar-open');
            updateStats();
        }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            catalogData.forEach(cat => {
                cat.topics.forEach(t => {
                    grid.innerHTML += `
                        <div class="catalog-card" onclick="loadTopic('${t.id}')">
                            <div class="cat-badge">${cat.group}</div>
                            <div class="cat-title">${t.title}</div>
                        </div>
                    `;
                });
            });
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar');
            nav.innerHTML = catalogData.map((cat, i) => `
                <div class="category-title" onclick="document.getElementById('menu-${i}').style.display = document.getElementById('menu-${i}').style.display==='block'?'none':'block'">
                    ${cat.group} ▼
                </div>
                <div class="topic-list" id="menu-${i}">
                    ${cat.topics.map(t => `<div class="topic-item" onclick="loadTopic('${t.id}')">${t.title}</div>`).join('')}
                </div>
            `).join('');
        }

        // ------------------------------------------------------------
        // 核心邏輯：載入 JSON 與構建記憶佇列
        // ------------------------------------------------------------
        async function loadTopic(id) {
            if(id !== '001') {
                alert(`⚠️ 真實環境將抓取 topic${id}.json。現預設為 001 展示。`);
                id = '001'; 
            }

            try {
                const res = await fetch(`topic${id}.json`);
                currentTopicData = await res.json();
                
                // UI 切換至學習模式
                document.getElementById('view-catalog').style.display = 'none';
                document.getElementById('view-finish').style.display = 'none';
                document.getElementById('view-study').style.display = 'flex';
                document.getElementById('header-topic-title').innerText = currentTopicData.title;
                document.getElementById('header-topic-title').style.display = 'block';
                
                document.body.className = 'aside-closed'; // 三欄式，但先關閉右側
                
                buildQueue();
            } catch (e) {
                alert("無法載入 JSON。請確保使用 Local Web Server。");
            }
        }

        function buildQueue() {
            const now = Date.now();
            learningQueue = currentTopicData.items.filter(item => {
                const rec = srsDB[item.id];
                return !rec || rec.nextReview <= now;
            });
            // 演示用防呆：若已學完強制塞入
            if(learningQueue.length === 0) learningQueue = [...currentTopicData.items];
            currentIndex = 0;
            renderCard();
        }

        // ------------------------------------------------------------
        // 卡片渲染
        // ------------------------------------------------------------
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                showFinishScreen(); return;
            }

            const item = learningQueue[currentIndex];
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('right-panel').classList.remove('active');
            document.body.classList.add('aside-closed');
            if(window.innerWidth <= 768) document.body.classList.remove('aside-mobile-open');

            // 正面
            document.getElementById('front-word').innerText = item.word;
            document.getElementById('front-phonetic').innerText = item.phonetic;

            // 背面 - Sticky Header
            document.getElementById('sticky-word').innerText = item.word;
            document.getElementById('sticky-phonetic').innerText = item.phonetic;

            // 背面 - 意義與片語
            document.getElementById('back-meaning').innerText = item.zh_tw_meaning;
            document.getElementById('back-meta').innerText = `${item.part_of_speech} | 變體: ${item.variations.join(', ') || '無'}`;
            
            // 片語加上 TTS 綁定
            document.getElementById('back-phrases').innerHTML = item.phrases.map((p, i) => `
                <div class="phrase-item">
                    <div class="phrase-text">
                        <div class="phrase-en">${p.en}</div>
                        <div class="phrase-zh">${p.zh}</div>
                    </div>
                    <button class="btn-phrase-speak" onclick="speakExactText('${p.en.replace(/'/g, "\\'")}', event)">🔊</button>
                </div>
            `).join('');

            // 外部精準連結 (URL Encode)
            const searchStr = encodeURIComponent(item.word);
            document.getElementById('back-links').innerHTML = `
                <a href="https://youglish.com/pronounce/${searchStr}/english" target="_blank" class="btn-youglish">📺 YouGlish 真人語境</a>
                <a href="https://en.wiktionary.org/w/index.php?search=${searchStr}" target="_blank" class="btn-wiki">📖 Wiktionary 辭典</a>
                <a href="https://www.google.com/search?q=${searchStr}+中文意思+用法" target="_blank" class="btn-google">🔍 Google 中文解析</a>
            `;

            // 右側 - 漸進式揭露教學
            document.getElementById('panel-context').innerText = item.context_of_use;
            document.getElementById('panel-bg').innerText = item.background_knowledge;
            // 預設將 details 收合
            document.querySelector('details.deep-bg').removeAttribute('open');
            
            document.getElementById('panel-dialogue').innerHTML = item.dialogues.map(d => `
                <div class="dialogue-box">
                    <div class="dialogue-en" onclick="speakExactText('${d.en.replace(/'/g, "\\'")}', event)">
                        <span>${d.speaker}: ${d.en}</span> <span>🔊</span>
                    </div>
                    <div class="dialogue-zh">${d.zh}</div>
                </div>
            `).join('');

            updateStats();
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            if(card.classList.contains('flipped')) return; // 避免重複觸發

            card.classList.add('flipped');
            document.body.classList.remove('aside-closed'); // 展開右側網格
            
            setTimeout(() => {
                document.getElementById('right-panel').classList.add('active'); 
                if(window.innerWidth <= 768) document.body.classList.add('aside-mobile-open');
            }, 150);
        }

        // ------------------------------------------------------------
        // 精準語音引擎 (TTS)
        // ------------------------------------------------------------
        function speakFromElement(elementId, e) {
            e.stopPropagation();
            const text = document.getElementById(elementId).innerText;
            speakExactText(text, null);
        }

        function speakExactText(text, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 嚴格打斷，防止佇列堆疊錯亂
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US'; 
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        }

        // ------------------------------------------------------------
        // 簡化版 3 按鈕 SRS 演算法 (🔴 Fail / 🟡 Hard / 🟢 Easy)
        // ------------------------------------------------------------
        function processSRS(qualityIndex) {
            const item = learningQueue[currentIndex];
            let rec = srsDB[item.id] || { interval: 0, reps: 0, ease: 2.5 };

            if(qualityIndex === 0) { // 🔴 忘了
                rec.reps = 0; rec.interval = 1; // 1分鐘後
            } else {
                if(rec.reps === 0) {
                    rec.interval = (qualityIndex === 1) ? 60 * 12 : 60 * 24 * 3; // 🟡 12h, 🟢 3天
                } else {
                    const modifier = (qualityIndex === 1) ? 1.2 : rec.ease;
                    rec.interval = Math.round(rec.interval * modifier);
                }
                rec.reps++;
            }
            
            // Ease factor 調整
            const q = (qualityIndex === 0) ? 1 : (qualityIndex === 1) ? 3 : 5;
            rec.ease = Math.max(1.3, rec.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
            
            rec.nextReview = Date.now() + rec.interval * 60 * 1000;
            srsDB[item.id] = rec;
            localStorage.setItem('expertLingoSRS_v3', JSON.stringify(srsDB));

            currentIndex++;
            updateStats();
            
            // 平滑過場動畫
            document.getElementById('flashcard').style.transform = 'scale(0.95) rotateY(180deg)';
            document.getElementById('flashcard').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('flashcard').style.transition = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                document.getElementById('flashcard').style.transform = '';
                
                renderCard();
                
                setTimeout(() => {
                    document.getElementById('flashcard').style.transition = 'transform 0.6s, opacity 0.3s';
                    document.getElementById('flashcard').style.opacity = '1';
                }, 50);
            }, 300);
        }

        function updateStats() {
            if(!learningQueue) return;
            const total = learningQueue.length;
            const remain = total - currentIndex;
            document.getElementById('stat-queue').innerText = Math.max(0, remain);
            document.getElementById('stat-progress').innerText = `${Math.min(currentIndex, total)} / ${total}`;
        }

        // ------------------------------------------------------------
        // 隨機推薦系統
        // ------------------------------------------------------------
        function showFinishScreen() {
            document.getElementById('view-study').style.display = 'none';
            document.getElementById('view-finish').style.display = 'flex';
            document.body.className = 'focus-mode';
        }

        function startRandomTopic() {
            const available = flatTopics.filter(t => currentTopicData && t.id !== currentTopicData.topic_id);
            const random = available[Math.floor(Math.random() * available.length)];
            loadTopic(random.id);
        }
    </script>
</body>
