<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORBITAL INTEL TERMINAL</title>
    <!-- PWA Setup -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>

    <style>
        /* ==========================================================================
           CORE & RESET
           ========================================================================== */
        :root {
            --neon-green: #00FFCC; --tac-orange: #FF9900; --alert-red: #FF3B30; --bg-black: #050505;
            --hud-glow: 0 0 5px rgba(0, 255, 204, 0.5);
            --safe-t: env(safe-area-inset-top, 20px); --safe-b: env(safe-area-inset-bottom, 20px);
            --safe-l: env(safe-area-inset-left, 15px); --safe-r: env(safe-area-inset-right, 15px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        body, html { width: 100vw; height: 100dvh; background: var(--bg-black); overflow: hidden; font-family: "SF Mono", "Courier New", monospace; color: var(--neon-green); }

        /* AR LAYER */
        #bg-camera { position: absolute; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; opacity: 0; transition: opacity 1s; }
        .vfx-layer { position: absolute; width: 100vw; height: 100dvh; pointer-events: none; }
        #vfx-scanlines { z-index: 2; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); background-size: 100% 4px, 3px 100%; mix-blend-mode: overlay; opacity: 0.8; }
        #vfx-flash { z-index: 9000; background: var(--neon-green); opacity: 0; mix-blend-mode: screen; transition: opacity 0.5s; }
        #webgl-canvas { position: absolute; z-index: 3; pointer-events: none; }

        /* AUTO-LABELS */
        #labels-container { position: absolute; top:0; left:0; width: 100vw; height: 100dvh; z-index: 4; pointer-events: none; }
        .ar-label { position: absolute; transform: translate(-50%, -50%); color: var(--neon-green); font-size: 10px; font-weight: bold; text-shadow: 1px 1px 3px #000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; will-change: transform; white-space: nowrap;}
        .ar-label::before { content: '⌜'; position: absolute; top: -6px; left: -6px; font-size: 12px; }
        .ar-label::after { content: '⌟'; position: absolute; bottom: -6px; right: -6px; font-size: 12px; }
        
        .ar-label.bounty { color: var(--tac-orange) !important; z-index: 5; font-size: 12px; text-shadow: 0 0 5px var(--tac-orange); }
        .ar-label.bounty::before, .ar-label.bounty::after { font-size: 18px; top: -8px; left: -8px; bottom:-8px; right:-8px; color: var(--tac-orange); }
        
        .ar-label.celestial { text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .ar-label.celestial::before, .ar-label.celestial::after { color: inherit; }
        .ar-label.cardinal { font-size: 18px; color: rgba(0,255,204,0.6); text-shadow: none; font-weight: 900;}
        .ar-label.cardinal::before, .ar-label.cardinal::after { display: none; }
        .ar-dist { font-size: 8px; opacity: 0.8; margin-top: 2px;}

        /* HUD CORE */
        #hud-container { position: absolute; width: 100vw; height: 100dvh; z-index: 5; pointer-events: none; filter: drop-shadow(var(--hud-glow)); }
        .svg-icon { vector-effect: non-scaling-stroke; stroke-width: 1.2px; fill: none; stroke: var(--neon-green); }
        .text-svg { fill: var(--neon-green); stroke: none; font-size: 10px; font-weight: bold; text-anchor: middle; }

        #center-reticle { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; transform: translate(-50%, -50%); transition: transform 0.1s; }
        #scan-ring { stroke: var(--tac-orange); stroke-width: 4px; stroke-dasharray: 251; stroke-dashoffset: 251; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 0.1s linear; }
        
        #target-box { position: absolute; top: 0; left: 0; width: 100px; height: 100px; transform: translate(-50%, -50%); z-index: 6; display: none; }
        .tgt-corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--alert-red); }
        .tgt-tl { top:0; left:0; border-right:none; border-bottom:none; } .tgt-tr { top:0; right:0; border-left:none; border-bottom:none; }
        .tgt-bl { bottom:0; left:0; border-right:none; border-top:none; } .tgt-br { bottom:0; right:0; border-left:none; border-top:none; }
        #tgt-lock-msg { position: absolute; top: -20px; width: 100%; text-align: center; color: var(--tac-orange); font-size: 10px; font-weight: bold; animation: blink 0.5s infinite; }

        #compass-tape-container { position: absolute; top: calc(var(--safe-t) + 10px); left: 50%; transform: translateX(-50%); width: 200px; height: 20px; overflow: hidden; border-left: 2px solid var(--neon-green); border-right: 2px solid var(--neon-green); }
        #compass-tape { display: flex; position: absolute; left: 100px; height: 100%; align-items: flex-end; }
        .compass-tick { width: 2px; height: 8px; background: var(--neon-green); position: absolute; bottom: 0; transform: translateX(-50%); }
        .compass-label { position: absolute; bottom: 10px; color: var(--neon-green); font-size: 10px; transform: translateX(-50%); }
        #compass-arrow { position: absolute; top: calc(var(--safe-t) + 32px); left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--tac-orange); }

        #mission-banner { position: absolute; top: calc(var(--safe-t) + 50px); left: 50%; transform: translateX(-50%); border: 1px solid var(--tac-orange); background: rgba(255,153,0,0.1); padding: 5px 15px; color: var(--tac-orange); font-size: 11px; font-weight: bold; text-align: center; backdrop-filter: blur(4px); white-space: nowrap; }
        #manual-align-hint { position: absolute; top: calc(var(--safe-t) + 75px); left: 50%; transform: translateX(-50%); color: rgba(0,255,204,0.7); font-size: 9px; white-space: nowrap;}
        
        #xp-bar-container { position: absolute; bottom: calc(var(--safe-b) + 50px); left: 50%; transform: translateX(-50%); width: 200px; height: 4px; background: rgba(0,255,204,0.2); }
        #xp-bar-fill { height: 100%; width: 0%; background: var(--neon-green); transition: width 0.5s ease; box-shadow: 0 0 8px var(--neon-green); }
        #rank-display { position: absolute; bottom: calc(var(--safe-b) + 60px); left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--neon-green); font-weight: bold; }

        .panel { position: absolute; z-index: 6; font-size: 11px; font-weight: 600; line-height: 1.6; text-shadow: var(--hud-glow); pointer-events: none; display: flex; flex-direction: column; }
        #panel-top-left { top: calc(var(--safe-t) + 10px); left: var(--safe-l); }
        #panel-top-right { top: calc(var(--safe-t) + 10px); right: var(--safe-r); text-align: right; align-items: flex-end; }
        #panel-bottom-left { bottom: calc(var(--safe-b) + 10px); left: var(--safe-l); }
        #panel-bottom-right { bottom: calc(var(--safe-b) + 10px); right: var(--safe-r); text-align: right; align-items: flex-end; }
        .data-row { display: flex; justify-content: space-between; gap: 10px; width: 100%; white-space: nowrap; }
        .data-label { color: rgba(0, 255, 204, 0.7); } .data-val { color: var(--neon-green); }
        
        .tac-btn { pointer-events: auto; cursor: pointer; width: 40px; height: 40px; margin-bottom: 10px; background: rgba(0, 255, 204, 0.05); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 4px; display: flex; justify-content: center; align-items: center; }
        .tac-btn:active { background: rgba(0, 255, 204, 0.3); transform: scale(0.95); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ==========================================================================
           INTEL CODEX & BACKPACK (DATABASE)
           ========================================================================== */
        #intel-overlay, #backpack-overlay { position: absolute; top:0; left:0; width: 100vw; height: 100dvh; background: rgba(5,5,5,0.95); z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; pointer-events: auto; }
        
        .intel-box { border: 1px solid var(--neon-green); background: rgba(0,255,204,0.05); padding: 20px; max-width: 500px; width: 100%; box-shadow: 0 0 30px rgba(0,255,204,0.2); display: flex; flex-direction: column;}
        .intel-header { border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; margin-bottom: 15px; font-size: 16px; color: var(--neon-green); font-weight: bold; display: flex; justify-content: space-between;}
        
        /* Image Display */
        .intel-img-container { width: 100%; height: 180px; background: #000; border: 1px solid var(--neon-green); margin-bottom: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;}
        .intel-img { max-width: 100%; max-height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; display: none; }
        .intel-dl-hint { position: absolute; color: var(--tac-orange); font-size: 12px; animation: blink 1s infinite; text-align: center; width: 100%; z-index: 0; }
        
        .intel-body { font-size: 12px; line-height: 1.6; margin-bottom: 20px; min-height: 80px; color: var(--neon-green); }
        .intel-reward { color: var(--tac-orange); font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 5px var(--tac-orange); font-size: 14px; text-align: center; animation: blink 1s infinite;}
        .intel-btn { width: 100%; padding: 12px; background: var(--neon-green); color: var(--bg-black); border: none; font-weight: bold; cursor: pointer; letter-spacing: 2px; }

        /* Backpack Grid */
        .bp-header { width: 100%; text-align: center; color: var(--tac-orange); font-size: 18px; border-bottom: 1px solid var(--tac-orange); padding-bottom: 10px; margin-bottom: 15px;}
        .bp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 500px; overflow-y: auto; max-height: 60vh; padding: 5px;}
        .bp-item { border: 1px solid rgba(0,255,204,0.3); background: rgba(0,255,204,0.05); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .bp-item.locked { filter: grayscale(100%) brightness(30%); border-color: #555; }
        .bp-item-img { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; opacity: 0.5;}
        .bp-item-name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 9px; text-align: center; padding: 3px 0; z-index: 2; color: var(--neon-green);}
        .bp-item.locked .bp-item-name { color: #888; }
        .bp-item.locked::after { content: '?'; font-size: 30px; color: #888; z-index: 2;}
        .bp-close { margin-top: 20px; width: 100%; max-width: 500px; padding: 12px; background: transparent; border: 1px solid var(--tac-orange); color: var(--tac-orange); font-weight: bold; cursor: pointer; }

        #dialog-layer { position: absolute; top:0; left:0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .mil-box { border: 2px solid var(--tac-orange); padding: 25px; width: 85%; max-width: 400px; text-align: center; background: rgba(10,10,10,0.9); }
        .mil-box h2 { color: var(--tac-orange); font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,153,0,0.3); padding-bottom: 10px; }
        .mil-box p { color: var(--neon-green); font-size: 13px; margin-bottom: 20px; line-height: 1.6; text-align: left;}
        .dialog-btn { width: 100%; padding: 12px; border: 1px solid var(--tac-orange); background: transparent; color: var(--tac-orange); font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .dialog-btn:active { background: var(--tac-orange); color: var(--bg-black); }
    </style>
</head>
<body>

    <video id="bg-camera" autoplay playsinline muted></video>
    <div id="vfx-scanlines" class="vfx-layer"></div>
    <div id="vfx-flash" class="vfx-layer"></div>
    <canvas id="webgl-canvas"></canvas>
    <div id="labels-container"></div>

    <div id="target-box">
        <div class="tgt-corner tgt-tl"></div><div class="tgt-corner tgt-tr"></div>
        <div class="tgt-corner tgt-bl"></div><div class="tgt-corner tgt-br"></div>
        <div id="tgt-lock-msg" style="display:none;" data-i18n="msg_scanning">DOWNLOADING...</div>
    </div>

    <div id="hud-container">
        <div id="mission-banner"><span data-i18n="bounty">MISSION:</span> <span id="bounty-name">---</span></div>
        <div id="manual-align-hint" data-i18n="hint_swipe">滑動螢幕微調方位 / 雙擊重置</div>
        <div id="compass-tape-container"><div id="compass-tape"></div></div>
        <div id="compass-arrow"></div>

        <svg id="center-reticle" viewBox="0 0 240 240">
            <circle id="scan-ring" cx="120" cy="120" r="40" fill="none" />
            <circle cx="120" cy="120" r="110" class="svg-icon" stroke-dasharray="2, 6" stroke-opacity="0.5"/>
            <circle cx="120" cy="120" r="80" class="svg-icon" id="reticle-inner"/>
            <line x1="120" y1="10" x2="120" y2="30" class="svg-icon"/><line x1="120" y1="210" x2="120" y2="230" class="svg-icon"/>
            <line x1="10" y1="120" x2="30" y2="120" class="svg-icon"/><line x1="210" y1="120" x2="230" y2="120" class="svg-icon"/>
            <text x="120" y="28" class="text-svg" data-i18n="hud_up">TGT</text>
            <text x="120" y="218" class="text-svg" id="hud-txt-bottom" data-i18n="hint_scan">對準目標 3 秒以攔截情報</text>
        </svg>

        <div id="rank-display"><span id="txt-rank">Rookie</span> [XP: <span id="txt-xp">0</span>]</div>
        <div id="xp-bar-container"><div id="xp-bar-fill"></div></div>
    </div>

    <div id="panel-top-left" class="panel">
        <div class="tac-btn" id="btn-lang"><svg viewBox="0 0 24 24" class="svg-icon" style="width:20px"><path d="M12 2L2 22h20z"/><circle cx="12" cy="15" r="2"/></svg></div>
        <!-- BACKPACK BUTTON -->
        <div class="tac-btn" id="btn-backpack"><svg viewBox="0 0 24 24" class="svg-icon" style="width:20px"><path d="M4 6h16v14H4z M8 6V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2 M12 11v4 M10 13h4"/></svg></div>
    </div>
    
    <div id="panel-top-right" class="panel">
        <div class="tac-btn" id="btn-audio"><svg viewBox="0 0 24 24" class="svg-icon" id="audio-icon" style="width:20px"><path d="M11 5L6 9H2v6h4l5 4V5z M15.5 12c0-1.5-1-2.8-2.5-3.3v6.6c1.5-.5 2.5-1.8 2.5-3.3z"/></svg></div>
        <div class="data-row"><span class="data-label" data-i18n="lbl_az">AZ</span><span class="data-val" id="tel-az">000.0°</span></div>
        <div class="data-row"><span class="data-label" data-i18n="lbl_el">EL</span><span class="data-val" id="tel-el">00.0°</span></div>
        <div class="data-row"><span class="data-label" data-i18n="lbl_fov">FOV</span><span class="data-val" id="tel-fov">75°</span></div>
    </div>
    
    <div id="panel-bottom-left" class="panel">
        <div class="data-row"><span class="data-label" data-i18n="lbl_tme">TME</span><span class="data-val" id="tel-time">00:00:00</span></div>
        <div id="tel-warn" style="color:var(--tac-orange); animation:blink 1s infinite"></div>
    </div>
    <div id="panel-bottom-right" class="panel">
        <div class="data-row"><span class="data-label" data-i18n="lbl_sat">TRK</span><span class="data-val" id="tel-sat-count">0</span></div>
        <div class="data-row"><span class="data-label" data-i18n="lbl_rng">RNG</span><span class="data-val" id="tel-rng">--- km</span></div>
    </div>

    <!-- INTEL OVERLAY -->
    <div id="intel-overlay">
        <div class="intel-box">
            <div class="intel-header"><span data-i18n="intel_title">機密情報解鎖</span> <span id="intel-class">[CLASS]</span></div>
            <div class="intel-img-container">
                <div class="intel-dl-hint" id="intel-dl-hint" data-i18n="hint_dl">ESTABLISHING SECURE LINK...</div>
                <!-- 加上 crossorigin 屬性防止 canvas 被污染 -->
                <img src="" id="intel-img" class="intel-img" crossorigin="anonymous">
            </div>
            <div class="intel-body" id="intel-text"></div>
            <div class="intel-reward">+<span id="intel-xp">0</span> XP</div>
            <button class="intel-btn" id="btn-close-intel" data-i18n="btn_continue">繼續執行任務</button>
        </div>
    </div>

    <!-- BACKPACK OVERLAY -->
    <div id="backpack-overlay">
        <div class="bp-header" data-i18n="bp_title">DATA ARCHIVE // 軌道圖鑑</div>
        <div class="bp-grid" id="bp-grid"></div>
        <button class="bp-close" id="btn-close-bp" data-i18n="btn_close">關閉檔案 (CLOSE)</button>
    </div>

    <!-- BOOT DIALOG -->
    <div id="dialog-layer">
        <div class="mil-box" id="dialog-box">
            <h2 id="dialog-title" data-i18n="title_boot">軌道情報局終端機</h2>
            <p id="dialog-text" data-i18n="desc_boot">歡迎。<br>所有天體與目標資料庫已載入。<br>掃描解鎖圖鑑，資料將永久保存在終端機中。</p>
            <button class="dialog-btn" id="dialog-btn-ok" data-i18n="btn_accept">授權並登入 (INITIATE)</button>
        </div>
    </div>

<script>
/**
 * ORBITAL INTEL TERMINAL - Ultimate Collection Edition
 * With Multi-CDN Proxy System & Save Corruption Auto-Repair
 */

const SYS = {
    locale: "zh-Hant", audio: true, zoom: 1.0, maxZoom: 8.0, 
    geo: { lat: 0, lon: 0, alt: 0 }, 
    deviceQ: new THREE.Quaternion(), currentQ: new THREE.Quaternion(), yawOffset: 0,
    sats: [], celestials: [], targetObj: null, bountySat: null,
    scanProgress: 0, isScanning: false, isPaused: false, downloadingImg: false,
    labelPool: [] 
};

// Player Storage
const PLAYER = { xp: 0, level: 0, scannedIDs: [], images: {} };
const RANKS = ["Rookie (新兵)", "Field Agent (外勤)", "Analyst (分析師)", "Commander (指揮官)", "Overlord (星際霸主)"];

const ASTRO_TARGETS = [
    { id: 'Sun', color: '#FFD700', radius: 25, 'zh-Hant': 'SUN (太陽)', en: 'SUN', class: 'STAR (G-Type)', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/320px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg', desc: { 'zh-Hant': '太陽是距離我們最近的恆星，直徑約為地球的 109 倍，它的核融合反應為整個太陽系提供了能量。', en: 'The Sun is a G-type main-sequence star. It contains 99.8% of the mass in the Solar System.' } },
    { id: 'Moon', color: '#E0E0E0', radius: 20, 'zh-Hant': 'MOON (月球)', en: 'MOON', class: 'SATELLITE (Natural)', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/320px-FullMoon2010.jpg', desc: { 'zh-Hant': '月球是地球唯一的天然衛星，引發了地球的潮汐現象。它正以每年 3.8 公分的速度遠離我們。', en: 'The Moon is Earth\'s only natural satellite, responsible for our ocean tides.' } },
    { id: 'Mercury', color: '#A8A8A8', radius: 8, 'zh-Hant': 'MERCURY (水星)', en: 'MERCURY', class: 'PLANET (Terrestrial)', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mercury_in_true_color.jpg/320px-Mercury_in_true_color.jpg', desc: { 'zh-Hant': '水星是太陽系最小的行星，沒有大氣層保溫，日夜溫差極端高達 600 度。', en: 'Mercury is the smallest planet. Without an atmosphere to retain heat, it experiences extreme temperature fluctuations.' } },

const Audio = {
    ctx: null, master: null, scanOsc: null, scanGain: null,
    init: () => {
        if(!SYS.audio) return;
        try {
            Audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); Audio.master = Audio.ctx.createGain(); Audio.master.connect(Audio.ctx.destination);
            if(Audio.ctx.state === 'suspended') Audio.ctx.resume();
            document.getElementById('btn-audio').onclick = () => { SYS.audio = !SYS.audio; Audio.master.gain.value = SYS.audio ? 1 : 0; document.getElementById('audio-icon').style.opacity = SYS.audio ? 1 : 0.3; };
        } catch(e) { SYS.audio = false; }
    },
    beep: (f=800, t='square', d=0.1, v=0.1) => {
        if(!SYS.audio || !Audio.ctx) return;
        const o = Audio.ctx.createOscillator(); const g = Audio.ctx.createGain(); o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0, Audio.ctx.currentTime); g.gain.linearRampToValueAtTime(v, Audio.ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.001, Audio.ctx.currentTime + d);
        o.connect(g); g.connect(Audio.master); o.start(); o.stop(Audio.ctx.currentTime + d);
    },
    startScan: () => {
        if(!SYS.audio || !Audio.ctx || Audio.scanOsc) return;
        Audio.scanOsc = Audio.ctx.createOscillator(); Audio.scanGain = Audio.ctx.createGain();
        Audio.scanOsc.type = 'triangle'; Audio.scanOsc.frequency.setValueAtTime(200, Audio.ctx.currentTime); Audio.scanOsc.frequency.linearRampToValueAtTime(800, Audio.ctx.currentTime + 3);
        Audio.scanGain.gain.setValueAtTime(0.05, Audio.ctx.currentTime); Audio.scanOsc.connect(Audio.scanGain); Audio.scanGain.connect(Audio.master); Audio.scanOsc.start();
    },
    stopScan: () => { if(Audio.scanOsc) { Audio.scanOsc.stop(); Audio.scanOsc = null; } },
    success: () => { Audio.stopScan(); Audio.beep(1200, 'square', 0.1, 0.2); setTimeout(()=>Audio.beep(1800, 'square', 0.4, 0.2), 100); }
};

const Game = {
    assignBounty: () => {
        if(SYS.sats.length === 0) return;
        SYS.bountySat = SYS.sats[Math.floor(Math.random() * SYS.sats.length)];
        Game.updateBountyUI();
    },
    updateBountyUI: () => {
        if(!SYS.bountySat) return;
        document.getElementById('bounty-name').innerText = `${I18N[SYS.locale]['bounty_find']} [${SYS.bountySat.displayName[SYS.locale]}]`;
        UI.flash('rgba(255,153,0,0.5)');
    },
    
    // 【多重代理靜默快取】在背景透過多個可靠來源將圖片轉存為 Base64
    cacheImageToBase64: (id, urls) => {
        if(PLAYER.images[id] && PLAYER.images[id].startsWith('data:')) return; 
        
        const tryCache = (index) => {
            if(index >= urls.length) return;
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                const b64 = getBase64Image(img);
                if(b64 && b64.startsWith('data:')) {
                    PLAYER.images[id] = b64;
                    localStorage.setItem('TAC_SAVE', JSON.stringify(PLAYER));
                }
            };
            img.onerror = () => tryCache(index + 1); // 失敗則嘗試下一個代理網址
            img.src = urls[index];
        };
        tryCache(0);
    },

    processScan: (delta) => {
        if(SYS.isPaused) return;
        const ring = document.getElementById('scan-ring'); const hint = document.getElementById('hud-txt-bottom');
        const lockMsg = document.getElementById('tgt-lock-msg');

        if(SYS.isScanning && SYS.targetObj) {
            
            // 掃描開始時，背景預先偷跑圖片下載 (使用多重 CDN 備援)
            if(!SYS.downloadingImg) {
                SYS.downloadingImg = true;
                const rawId = SYS.targetObj.isCelestial ? SYS.targetObj.id : SYS.targetObj.typeKey;
                const rawUrl = SYS.targetObj.isCelestial ? ASTRO_TARGETS.find(t=>t.id===rawId).img : KNOWN_TARGETS[rawId].img;
                const cleanUrl = rawUrl.replace(/^https?:\/\//, ''); // 移除協定給 proxy 使用
                
                // 強制穿透防火牆與防盜鏈的 CDN 組合
                const urlsToTry = [
                    `https://wsrv.nl/?url=${cleanUrl}&w=400&output=webp`,
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`,
                    rawUrl
                ];
                Game.cacheImageToBase64(rawId, urlsToTry);
            }

            SYS.scanProgress += delta;
            if(SYS.scanProgress >= 3000) {
                SYS.scanProgress = 3000; Game.unlockIntel(SYS.targetObj);
            } else {
                ring.style.strokeDashoffset = 251 - (251 * (SYS.scanProgress/3000)); ring.style.stroke = 'var(--neon-green)';
                hint.innerText = I18N[SYS.locale]['hint_scanning']; hint.style.fill = 'var(--tac-orange)'; lockMsg.style.display = 'block';
                document.getElementById('target-box').style.transform = `translate(-50%, -50%) translate(${(Math.random()-0.5)*4}px, ${(Math.random()-0.5)*4}px)`;
            }
        } else {
            SYS.scanProgress = Math.max(0, SYS.scanProgress - delta * 2);
            ring.style.strokeDashoffset = 251 - (251 * (SYS.scanProgress/3000)); ring.style.stroke = 'var(--tac-orange)';
            hint.innerText = I18N[SYS.locale]['hint_scan']; hint.style.fill = 'var(--neon-green)'; lockMsg.style.display = 'none';
            SYS.downloadingImg = false;
        }
    },
    
    unlockIntel: (obj) => {
        SYS.isPaused = true; Audio.success(); UI.flash();
        let isBounty = (SYS.bountySat === obj); let xpGained = isBounty ? 150 : (obj.isCelestial ? 100 : 50);
        
        const rawId = obj.isCelestial ? obj.id : obj.typeKey;
        if(PLAYER.scannedIDs.includes(rawId)) xpGained = 10; else PLAYER.scannedIDs.push(rawId);
        PLAYER.xp += xpGained;
        
        if(PLAYER.xp >= (PLAYER.level + 1) * 200) {
            PLAYER.level++; setTimeout(() => { UI.flash('rgba(255,215,0,0.8)'); Audio.beep(2000, 'square', 0.5); document.getElementById('dialog-title').innerText = I18N[SYS.locale]['rank_up']; }, 500);
        }
        UI.updateRank(); localStorage.setItem('TAC_SAVE', JSON.stringify(PLAYER));
        
        let loreData = obj.isCelestial ? ASTRO_TARGETS.find(t=>t.id===obj.id) : KNOWN_TARGETS[obj.typeKey];
        document.getElementById('intel-class').innerText = `[${loreData.class}]`; document.getElementById('intel-xp').innerText = xpGained;
        
        // --- 圖片載入核心邏輯 ---
        const imgEl = document.getElementById('intel-img'); 
        const hintEl = document.getElementById('intel-dl-hint');
        
        // 重置狀態 (移除舊圖片以防顯示藍色問號)
        imgEl.style.opacity = 0; 
        imgEl.style.display = 'none'; 
        imgEl.removeAttribute('src');
        hintEl.style.display = 'block'; 
        hintEl.innerText = I18N[SYS.locale]['hint_dl'];

        // 如果在快取階段就已經成功轉成 Base64，直接載入本地檔案 (秒開且永不失敗)
        if (PLAYER.images[rawId] && PLAYER.images[rawId].startsWith('data:')) {
            imgEl.style.display = 'block';
            imgEl.src = PLAYER.images[rawId];
            imgEl.onload = () => { imgEl.style.opacity = 1; hintEl.style.display = 'none'; };
        } else {
            // 如果本地沒抓好，啟動即時的多重 CDN 備援下載
            const rawUrl = loreData.img;
            const cleanUrl = rawUrl.replace(/^https?:\/\//, '');
            const fallbackUrls = [
                `https://wsrv.nl/?url=${cleanUrl}&w=400&output=webp`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`,
                rawUrl
            ];

            const tryDisplayImage = (index) => {
                if (index >= fallbackUrls.length) {
                    hintEl.innerText = "[ERROR] CONNECTION BLOCKED"; // 所有備援都失效時，不會顯示醜圖示
                    return;
                }
                imgEl.style.display = 'block';
                imgEl.crossOrigin = "anonymous";
                imgEl.src = fallbackUrls[index];
                
                imgEl.onload = () => {
                    imgEl.style.opacity = 1;
                    hintEl.style.display = 'none';
                    // 順手把成功的圖片存成 Base64 放進資料庫
                    const b64 = getBase64Image(imgEl);
                    if(b64 && b64.startsWith('data:')) {
                        PLAYER.images[rawId] = b64;
                        localStorage.setItem('TAC_SAVE', JSON.stringify(PLAYER));
                    }
                };
                imgEl.onerror = () => {
                    imgEl.style.display = 'none'; // 隱藏藍色問號破圖圖示
                    tryDisplayImage(index + 1); // 嘗試下一個伺服器
                };
            };
            tryDisplayImage(0);
        }
        
        document.getElementById('intel-overlay').style.display = 'flex';
        
        const nameDisp = obj.isCelestial ? loreData[SYS.locale] : obj.displayName[SYS.locale];
        const textEl = document.getElementById('intel-text'); textEl.innerHTML = `<strong>TARGET: ${nameDisp}</strong><br><br>`;
        let i = 0; const txt = loreData.desc[SYS.locale];
        const typeWriter = setInterval(() => {
            if(i < txt.length) { textEl.innerHTML += txt.charAt(i); i++; Audio.beep(3000 + Math.random()*500, 'square', 0.02, 0.01); }
            else clearInterval(typeWriter);
        }, 20);

        document.getElementById('btn-close-intel').onclick = () => {
            clearInterval(typeWriter); document.getElementById('intel-overlay').style.display = 'none'; imgEl.src = "";
            SYS.isPaused = false; SYS.scanProgress = 0; SYS.isScanning = false;
            document.getElementById('target-box').style.transform = `translate(-50%, -50%)`;
            if(isBounty) Game.assignBounty();
        };
    }
};

// 增加安全防呆的 Base64 轉換函數
function getBase64Image(img) {
    try { 
        const canvas = document.createElement("canvas"); 
        canvas.width = img.naturalWidth || img.width || 320; 
        canvas.height = img.naturalHeight || img.height || 320; 
        const ctx = canvas.getContext("2d"); 
        ctx.drawImage(img, 0, 0); 
        return canvas.toDataURL("image/jpeg", 0.6); 
    } catch(e) { 
        return null; 
    }
}

const Graphics = {
    scene: null, camera: null, camGroup: null, renderer: null, satMesh: null,
    init: () => {
        const cvs = document.getElementById('webgl-canvas');
        Graphics.renderer = new THREE.WebGLRenderer({ canvas: cvs, alpha: true, antialias: true });
        Graphics.renderer.setSize(window.innerWidth, window.innerHeight); Graphics.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        Graphics.scene = new THREE.Scene(); Graphics.camGroup = new THREE.Group(); Graphics.scene.add(Graphics.camGroup);
        Graphics.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000); Graphics.camGroup.add(Graphics.camera); 

        // Colored Satellite Meshes
        const geo = new THREE.PlaneGeometry(3, 3); const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide, transparent: true });
        Graphics.satMesh = new THREE.InstancedMesh(geo, mat, 500); Graphics.satMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); Graphics.scene.add(Graphics.satMesh);

        // Holographic Horizon
        const horizGeo = new THREE.BufferGeometry(); const horizPts = [];
        for(let i=0; i<=64; i++){ const a = (i/64)*Math.PI*2; horizPts.push(new THREE.Vector3(500 * Math.sin(a), 0, -500 * Math.cos(a))); }
        horizGeo.setFromPoints(horizPts); Graphics.scene.add(new THREE.Line(horizGeo, new THREE.LineBasicMaterial({ color: 0x00FFCC, transparent: true, opacity: 0.4 })));

        // Celestial Wireframes (Specific Colors)
        SYS.celestials = ASTRO_TARGETS.map(c => {
            const pts = []; for(let i=0; i<=32; i++){ const a = (i/32)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*c.radius, Math.sin(a)*c.radius, 0)); }
            const mesh = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: new THREE.Color(c.color), transparent: true, opacity: 0.8 }));
            Graphics.scene.add(mesh); return { ...c, mesh, isCelestial: true };
        });
        
        window.addEventListener('resize', () => { Graphics.camera.aspect = window.innerWidth/window.innerHeight; Graphics.camera.updateProjectionMatrix(); Graphics.renderer.setSize(window.innerWidth, window.innerHeight); });
    },
    update: () => {
        if(SYS.isPaused) return;
        const date = new Date(); const R = 500; const camDir = new THREE.Vector3(); Graphics.camera.getWorldDirection(camDir);
        let dummy = new THREE.Object3D(); let closestDist = Infinity; let newTarget = null;
        SYS.labelPool.forEach(l => l.active = false); let onScreenItems = [];

        // 1. Astronomy Elements
        if(typeof Astronomy !== 'undefined') {
            const observer = new Astronomy.Observer(SYS.geo.lat, SYS.geo.lon, SYS.geo.alt / 1000);
            SYS.celestials.forEach(c => {
                let equ = Astronomy.Equator(c.id, date, observer, true, true); let hor = Astronomy.Horizon(date, observer, equ.ra, equ.dec, 'normal');
                const az = hor.azimuth * Math.PI/180; const el = hor.altitude * Math.PI/180;
                const x = R * Math.sin(az) * Math.cos(el); const y = R * Math.sin(el); const z = -R * Math.cos(az) * Math.cos(el);
                
                c.mesh.position.set(x, y, z); c.mesh.lookAt(0,0,0);
                const objDir = new THREE.Vector3(x,y,z).normalize(); const distToCenter = camDir.distanceTo(objDir);
                
                if(distToCenter < 1.5) onScreenItems.push({ obj: c, distToCenter, distStr: '[ ASTRO ]', vec: c.mesh.position.clone(), isCelestial: true, color: c.color });
                if(distToCenter < closestDist && distToCenter < (0.25 / SYS.zoom)) { closestDist = distToCenter; newTarget = { obj: c, distStr: '[ ASTRO ]', vec: c.mesh.position.clone() }; }
            });
        }

        // 2. Satellites
        if(SYS.sats.length > 0) {
            const obsGd = { longitude: SYS.geo.lon * Math.PI/180, latitude: SYS.geo.lat * Math.PI/180, height: SYS.geo.alt/1000 };
            const gmst = satellite.gstime(date);

            for(let i=0; i<SYS.sats.length; i++) {
                const sat = SYS.sats[i]; const pv = satellite.propagate(sat.satrec, date);
                if(!pv.position || isNaN(pv.position.x)) { dummy.position.set(0,-1000,0); dummy.updateMatrix(); Graphics.satMesh.setMatrixAt(i, dummy.matrix); continue; }
                
                const posEcf = satellite.eciToEcf(pv.position, gmst); const look = satellite.ecfToLookAngles(obsGd, posEcf);
                
                if(look.elevation > 0) {
                    const x = R * Math.sin(look.azimuth) * Math.cos(look.elevation); const y = R * Math.sin(look.elevation); const z = -R * Math.cos(look.azimuth) * Math.cos(look.elevation);
                    dummy.position.set(x, y, z); dummy.lookAt(0,0,0);
                    
                    const baseColor = KNOWN_TARGETS[sat.typeKey].color;
                    if(sat === SYS.bountySat) Graphics.satMesh.setColorAt(i, new THREE.Color(0xFF9900)); else Graphics.satMesh.setColorAt(i, new THREE.Color(baseColor));
                    dummy.updateMatrix(); Graphics.satMesh.setMatrixAt(i, dummy.matrix);

                    const satDir = new THREE.Vector3(x,y,z).normalize(); const distToCenter = camDir.distanceTo(satDir);
                    if(distToCenter < 1.5) onScreenItems.push({ obj: sat, distToCenter, distStr: `${look.rangeSat.toFixed(0)} km`, vec: dummy.position.clone(), isCelestial: false, color: baseColor });
                    if(distToCenter < closestDist && distToCenter < (0.25 / SYS.zoom)) { closestDist = distToCenter; newTarget = { obj: sat, distStr: `${look.rangeSat.toFixed(1)} km`, vec: dummy.position.clone() }; }
                } else { dummy.position.set(0,-1000,0); dummy.updateMatrix(); Graphics.satMesh.setMatrixAt(i, dummy.matrix); }
            }
            Graphics.satMesh.instanceMatrix.needsUpdate = true; if(Graphics.satMesh.instanceColor) Graphics.satMesh.instanceColor.needsUpdate = true;
        }

        // 3. Horizon Cardinals
        const cardinals = [ { t: 'N', a: 0 }, { t: 'E', a: 90 }, { t: 'S', a: 180 }, { t: 'W', a: 270 } ];
        cardinals.forEach(c => {
            const rad = c.a * Math.PI/180; const vec = new THREE.Vector3(R * Math.sin(rad), 0, -R * Math.cos(rad));
            if(camDir.distanceTo(vec.clone().normalize()) < 1.5) onScreenItems.push({ obj: { displayName: { 'zh-Hant': c.t, en: c.t } }, distToCenter: 99, distStr: '', vec: vec, isCardinal: true });
        });

        // 4. Update HUD Labels
        onScreenItems.sort((a,b) => a.distToCenter - b.distToCenter); 
        let labelIndex = 0;
        for(let s of onScreenItems) {
            if(labelIndex >= SYS.labelPool.length) break;
            const p = s.vec.project(Graphics.camera);
            if(p.z < 1) { 
                const l = SYS.labelPool[labelIndex];
                l.el.style.transform = `translate(-50%, -50%) translate(${(p.x*.5+.5)*window.innerWidth}px, ${(p.y*-.5+.5)*window.innerHeight}px)`;
                
                if(s.isCardinal) { l.el.className = 'ar-label cardinal'; l.nameSpan.innerText = s.obj.displayName.en; l.distSpan.innerText = ''; l.el.style.color = ''; } 
                else if(s.isCelestial) { l.el.className = 'ar-label celestial'; l.nameSpan.innerText = s.obj[SYS.locale]; l.distSpan.innerText = s.distStr; l.el.style.color = s.color; } 
                else { 
                    l.el.className = s.obj === SYS.bountySat ? 'ar-label bounty' : 'ar-label'; 
                    l.nameSpan.innerText = s.obj.displayName[SYS.locale]; l.distSpan.innerText = s.distStr; 
                    l.el.style.color = s.obj === SYS.bountySat ? '' : s.color;
                }
                
                l.el.style.opacity = 1; l.active = true; labelIndex++;
            }
        }
        SYS.labelPool.forEach(l => { if(!l.active) l.el.style.opacity = 0; });

        // 5. Target Box
        const box = document.getElementById('target-box');
        if(newTarget && !newTarget.isCardinal) {
            if(SYS.targetObj !== newTarget.obj) { 
                SYS.targetObj = newTarget.obj; Audio.beep(1200, 'square', 0.1); 
                document.getElementById('reticle-inner').style.stroke = 'var(--alert-red)';
                document.getElementById('center-reticle').style.transform = `translate(-50%, -50%) scale(1.1)`; setTimeout(()=>document.getElementById('center-reticle').style.transform = `translate(-50%, -50%) scale(1)`, 100);
            }
            document.getElementById('tel-rng').innerText = newTarget.distStr;
            const p = newTarget.vec.clone().project(Graphics.camera);
            if(p.z < 1) {
                if(!SYS.isScanning || SYS.scanProgress === 0) box.style.transform = `translate(-50%, -50%) translate(${(p.x * .5 + .5) * window.innerWidth}px, ${(p.y * -.5 + .5) * window.innerHeight}px)`;
                box.style.display = 'block';
                if(!SYS.isScanning) { SYS.isScanning = true; Audio.startScan(); } 
            } else box.style.display = 'none';
        } else {
            SYS.targetObj = null; box.style.display = 'none'; document.getElementById('tel-rng').innerText = '---';
            document.getElementById('reticle-inner').style.stroke = 'var(--neon-green)';
            if(SYS.isScanning) { SYS.isScanning = false; Audio.stopScan(); }
        }

        Graphics.renderer.render(Graphics.scene, Graphics.camera);
    }
};

/* ==========================================================================
   MAIN LOOP & BOOT
   ========================================================================== */
let lastTime = performance.now();

function loop() {
    requestAnimationFrame(loop);
    const now = performance.now(); const delta = now - lastTime; lastTime = now;
    if(SYS.isPaused) return;

    SYS.currentQ.slerp(SYS.deviceQ, 0.2);
    if(Graphics.camera) { Graphics.camera.quaternion.copy(SYS.currentQ); Graphics.camGroup.rotation.y = SYS.yawOffset; }

    const dir = new THREE.Vector3();
    if(Graphics.camera) {
        Graphics.camera.getWorldDirection(dir);
        let az = Math.atan2(dir.x, -dir.z) * 180 / Math.PI; if(az < 0) az += 360;
        let el = Math.asin(dir.y) * 180 / Math.PI;
        document.getElementById('compass-tape').style.transform = `translateX(${-az * 4}px)`;
        document.getElementById('tel-az').innerText = az.toFixed(1) + '°'; document.getElementById('tel-el').innerText = el.toFixed(1) + '°';
    }
    const d = new Date(); document.getElementById('tel-time').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    Graphics.update(); Game.processScan(delta);
}

window.onload = () => {
    UI.init();
    const mc = new Hammer(document.body); mc.get('pinch').set({ enable: true }); mc.get('pan').set({ direction: Hammer.DIRECTION_HORIZONTAL });
    let startZ = 1.0;
    
    mc.on('pinchstart', () => { startZ = SYS.zoom; });
    mc.on('pinchmove', e => { SYS.zoom = Math.max(1.0, Math.min(SYS.maxZoom, startZ * e.scale)); if(Graphics.camera) { Graphics.camera.fov = 75 / SYS.zoom; Graphics.camera.updateProjectionMatrix(); document.getElementById('tel-fov').innerText = Graphics.camera.fov.toFixed(1)+'°';} });
    mc.on('panmove', e => { SYS.yawOffset -= e.velocityX * 0.05; });
    mc.on('doubletap', () => { SYS.yawOffset = 0; UI.flash('var(--tac-orange)'); Audio.beep(1500, 'square', 0.2); });

    document.getElementById('dialog-btn-ok').onclick = () => {
        document.getElementById('dialog-layer').style.display = 'none';
        const deg2rad = Math.PI / 180;
        
        const handleOrientation = (e) => {
            if (e.alpha === null) return;
            let alpha = e.alpha || 0; if (e.webkitCompassHeading !== undefined) alpha = 360 - e.webkitCompassHeading;
            const orient = (window.orientation || 0) * deg2rad;
            const euler = new THREE.Euler((e.beta || 0) * deg2rad, alpha * deg2rad, -(e.gamma || 0) * deg2rad, 'YXZ');
            const q = new THREE.Quaternion().setFromEuler(euler);
            q.multiply(new THREE.Quaternion(-0.70710678, 0, 0, 0.70710678)); 
            q.multiply(new THREE.Quaternion(0, 0, Math.sin(-orient/2), Math.cos(-orient/2))); 
            SYS.deviceQ.copy(q);
        };

        if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(r => { if(r === 'granted') window.addEventListener('deviceorientation', handleOrientation); }).catch(()=>{});
        } else {
            if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation);
            else window.addEventListener('deviceorientation', handleOrientation);
        }

        Audio.init(); Audio.beep();
        if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});

        Graphics.init(); lastTime = performance.now(); loop(); 

        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                SYS.geo.lat = p.coords.latitude; SYS.geo.lon = p.coords.longitude; SYS.geo.alt = p.coords.altitude || 0;
                document.getElementById('tel-lat').innerText = SYS.geo.lat.toFixed(4); document.getElementById('tel-lon').innerText = SYS.geo.lon.toFixed(4);
            }, () => { document.getElementById('tel-warn').innerText = '[GPS_ERR]'; }, { enableHighAccuracy: true });
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }).then(stream => {
            const vid = document.getElementById('bg-camera'); vid.srcObject = stream; vid.style.opacity = 1;
        }).catch(() => { document.getElementById('tel-warn').innerText = '[CAM_ERR]'; });

        Promise.all([
            fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle').then(r=>r.text()).catch(()=>""),
            fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle').then(r=>r.text()).catch(()=>"")
        ]).then(results => {
            const lines = (results[0] + "\n" + results[1]).split(/\r?\n/); const seen = new Set();
            for(let i=0; i<lines.length; i+=3) {
                if(!lines[i+2]) continue; const rawName = lines[i].trim();
                if(seen.has(rawName)) continue; seen.add(rawName);
                
                let matchedKey = Object.keys(KNOWN_TARGETS).find(k => rawName.includes(k));
                if(!matchedKey) continue; 
                try { 
                    const satrec = satellite.twoline2satrec(lines[i+1].trim(), lines[i+2].trim());
                    // Verify if valid immediately (removes undefined calculations)
                    if(satrec) SYS.sats.push({ rawName: rawName, typeKey: matchedKey, displayName: { 'zh-Hant': KNOWN_TARGETS[matchedKey]['zh-Hant'], en: KNOWN_TARGETS[matchedKey].en }, satrec: satrec }); 
                } catch(e){}
            }
            document.getElementById('tel-sat-count').innerText = SYS.sats.length; Game.assignBounty(); UI.flash();
        }).catch(() => { document.getElementById('tel-warn').innerText = '[DATA_ERR]'; });
    };
};
</script>
