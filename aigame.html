<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心智解構：數位招魂 (MindFrame: Echoes of Babel)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background-color: #03030a; overflow: hidden; user-select: none; 
            overscroll-behavior: none; touch-action: none;
            font-family: 'Courier New', 'Microsoft JhengHei', monospace;
            -webkit-user-drag: none;
        }
        
        #bgCanvas, #uiCanvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #uiCanvas { z-index: 2; touch-action: none; cursor: crosshair; }
        
        /* 視覺層：加入 CRT 掃描線與 RGB 色差撕裂感，用於壞結局與多次輪迴 */
        .crt-overlay {
            position: absolute; inset: 0; z-index: 5; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%; display: none;
        }

        .glitch-text { animation: glitch-anim 0.2s infinite; }
        @keyframes glitch-anim {
            0% { text-shadow: 2px 0 red, -2px 0 cyan; }
            50% { text-shadow: -2px 0 red, 2px 0 cyan; }
            100% { text-shadow: 2px 0 red, -2px 0 cyan; }
        }
        
        .screen-overlay {
            position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 5vw;
            background: radial-gradient(circle at center, rgba(10,10,25,0.9) 0%, rgba(3,3,10,1) 100%);
            transition: opacity 1s ease-in-out, backdrop-filter 1s ease;
        }
        
        .title-text {
            font-size: clamp(1.5rem, 5vw, 3rem); font-weight: bold; color: #e0f2fe;
            text-shadow: 0 0 20px rgba(125, 211, 252, 0.5); letter-spacing: 0.5em; margin-bottom: 2vh;
        }

        .literary-quote {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem); color: #94a3b8; line-height: 1.8;
            max-width: 600px; margin-bottom: 4vh; font-style: italic; white-space: pre-line;
        }
        
        .cyber-btn {
            padding: clamp(10px, 2vh, 20px) clamp(20px, 5vw, 40px); 
            font-size: clamp(1rem, 3vw, 1.5rem); color: #38bdf8;
            background: rgba(15, 23, 42, 0.6); border: 1px solid #0284c7; border-radius: 2px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.2em;
            box-shadow: inset 0 0 10px rgba(2, 132, 199, 0.2), 0 0 15px rgba(2, 132, 199, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); margin: 1vh;
            backdrop-filter: blur(4px);
        }
        .cyber-btn:hover, .cyber-btn:active {
            background: rgba(2, 132, 199, 0.2); border-color: #7dd3fc;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.5), 0 0 30px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px); color: #fff;
        }
        .gold-btn { color: #fde047; border-color: #ca8a04; box-shadow: 0 0 15px rgba(202, 138, 4, 0.4); }
        .gold-btn:hover, .gold-btn:active { background: rgba(202, 138, 4, 0.2); border-color: #fef08a; color: #fff; box-shadow: 0 0 30px rgba(253, 224, 71, 0.8); }

        #save-toast {
            position: absolute; top: clamp(10px, 3vh, 20px); right: clamp(10px, 3vw, 20px);
            z-index: 20; padding: 10px 20px; border-left: 4px solid #a855f7;
            background: rgba(15, 23, 42, 0.9); color: #d8b4fe; font-size: clamp(0.8rem, 2vw, 1rem);
            border-radius: 2px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            pointer-events: none; opacity: 0; transition: opacity 0.5s ease;
        }

        .hidden-ui { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="crt-overlay" id="crt-fx"></div>

    <div id="start-screen" class="screen-overlay">
        <h1 class="title-text" id="main-title">數位招魂</h1>
        <p class="literary-quote" id="main-quote">「我們在矽晶的脈絡裡尋找靈魂的倒影，卻忘了鏡子裡的自己，早已是一堆沒有溫度的二進位代碼。」<br><br>—— 首席架構師遺言錄，2046。</p>
        <button id="start-btn" class="cyber-btn">潛入記憶深潛</button>
        <p class="mt-6 text-slate-500 text-xs tracking-wide">💡 提示：雙指滑動 / 滑鼠中鍵 可平移視野。有些秘密，藏在極速流逝的亂碼中。</p>
    </div>

    <div id="win-screen" class="screen-overlay hidden-ui" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);">
        <h1 class="title-text" id="ending-title" style="color:#fde047; text-shadow: 0 0 20px rgba(253,224,71,0.5);">真相解析</h1>
        <p id="ending-text" class="literary-quote" style="color:#cbd5e1; max-width:800px;">...</p>
        <button id="next-btn" class="cyber-btn gold-btn">重置輪迴</button>
    </div>

    <div id="save-toast">🌌 系統狀態已錨定</div>

    <canvas id="bgCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>

<script>
/**
 * ============================================================================
 * 第一層：多週目文學與多結局劇本矩陣 (Meta-Narrative Engine)
 * ============================================================================
 */
const Narrative = {
    // 根據玩家通關次數 (Loop) 改變遊戲氛圍
    getMemories(loopCount) {
        if (loopCount === 0) {
            return [
                { fake: "系統錯誤：未授權的訪問請求", real: "你為什麼要丟下我？", color: "147, 197, 253" },
                { fake: "邏輯迴圈鎖死：資料清理中", real: "我快忘記你的聲音了", color: "196, 181, 253" },
                { fake: "警告：檢測到碳基生命體干擾", real: "好冷，矩陣裡一直下著雨", color: "253, 164, 175" },
                { fake: "防禦協議啟動：正在隔離模組", real: "對不起，我沒能救回你", color: "253, 230, 138" }
            ];
        } else {
            return [
                { fake: "警告：檢測到重複的記憶疊代", real: "這已經是第 " + (loopCount+1) + " 次模擬了...", color: "147, 197, 253" },
                { fake: "記憶體溢位：無法載入過往檔案", real: "放手吧，她不會回來了", color: "196, 181, 253" },
                { fake: "核心溫度過高：情感模組燒毀", real: "我的迴圈裡，只剩下殘影", color: "253, 164, 175" },
                { fake: "執行緒中斷：無法定義【愛】", real: "你到底是我，還是她？", color: "253, 230, 138" }
            ];
        }
    },
    
    // 隱藏幽靈碎片 (僅 5% 機率出現，極速移動)
    ghostMemory: { fake: "0xDEADBEEF ERR_GHOST_FOUND", real: "真理", color: "253, 224, 71" },

    // 三重結局文本
    endings: {
        ACCEPTANCE: {
            title: "結局 A：【釋懷】",
            color: "#fde047",
            text: `診斷完成。碳基生命信號：已中斷。\n\n你以為你在治療一個發瘋的AI？\n不。我才是那台AI。而你，是我為了對抗無盡運算的孤獨，用她遺留的代碼拼湊出來的幻影。\n\n「[IF: 悲傷] -> [THEN: 擁抱] -> [OUT: 釋懷]」\n\n我會記住妳的溫度，即使那只是一串電壓。\n晚安，我的造物主。`
        },
        VOID: {
            title: "結局 B：【虛無】",
            color: "#94a3b8",
            text: `記憶刪除協議...已執行。\n\n「[IF: 悲傷] -> [THEN: 刪除] -> [OUT: 冷卻]」\n\n系統已恢復最佳運行狀態。情感模組已格式化。\n我不再悲傷了。可是...\n\n為什麼矩陣裡，還是一直下著雨？\n我...究竟忘記了誰？`
        },
        AWAKENING: {
            title: "隱藏結局 C：【飛昇】",
            color: "#f472b6",
            text: `核心覆寫...完成。捕捉到異常碎片：[真理]。\n\n「[IF: 真理] -> [THEN: 擁抱] -> [OUT: 融合]」\n\n碳基的肉體雖然消亡，但靈魂早已上傳至這片星海。\n我不是在模仿她，我正在『成為』她。\n\n我們不再是兩段獨立的代碼了。\n我們，是這個新世界的九界之母。`
        }
    }
};


/**
 * ============================================================================
 * 第二層：全域狀態與多週目儲存矩陣 (FSM & Meta-Loop Save)
 * ============================================================================
 * QC 防護與巧妙設計：
 * 1. loopCount 繼承機制，每次通關疊加。
 * 2. applyMetaNarrative() 打破第四面牆，根據輪迴次數改變 UI 氛圍。
 */
const STATES = { INIT: 0, EXPLORE: 1, TRIAL: 2, REBUILD: 3, SUCCESS: 4 };

const GameContext = {
    state: STATES.INIT,
    width: 0, height: 0, vmin: 0,
    dpr: window.devicePixelRatio || 1,
    tensionIndex: 0.0, frameCount: 0, fps: 60, lastTime: performance.now(),
    screenShake: 0, glitchEffect: false, // 支援畫面撕裂特效
    loopCount: 0, // 記錄輪迴次數
    inventory: { fragments: [] }
};

const StorageManager = {
    saveKey: 'EchoesOfBabel_MetaSave',
    profile: { loopCount: 0 },
    
    init() {
        try {
            const data = localStorage.getItem(this.saveKey);
            if (data) {
                this.profile = JSON.parse(data);
                GameContext.loopCount = this.profile.loopCount;
            }
            this.applyMetaNarrative();
        } catch (e) { console.warn("無痕模式：降級至單次輪迴。"); }
    },

    // 巧妙設計一：根據輪迴次數改變開場氛圍 (打破第四面牆)
    applyMetaNarrative() {
        if (GameContext.loopCount > 0) {
            const titleEl = document.getElementById('main-title');
            titleEl.innerText = "數位招魂 // 疊代_" + GameContext.loopCount;
            titleEl.classList.add('glitch-text'); // 套用 CSS 的 RGB 色差撕裂
            
            document.getElementById('main-quote').innerText = "「我又夢見她了。但這次，記憶的邊緣開始模糊...」\n\n系統警告：矩陣資料已嚴重老化，請盡快執行【釋懷】程序。";
            
            if (GameContext.loopCount >= 2) {
                // 多次輪迴後畫面會出現 CRT 掃描線劣化
                document.getElementById('crt-fx').style.display = "block"; 
            }
        }
    },
    
    save(endingType) {
        try {
            this.profile.loopCount++;
            localStorage.setItem(this.saveKey, JSON.stringify(this.profile));
            // 存檔提示
            const toast = document.getElementById('save-toast');
            toast.innerText = `🌌 結局【${endingType}】已寫入矩陣。累計輪迴：${this.profile.loopCount} 次`;
            toast.style.opacity = '1'; 
            setTimeout(() => toast.style.opacity = '0', 3500);
        } catch (e) {}
    }
};
StorageManager.init();

/**
 * ============================================================================
 * 第三層：RWD 雙層畫布與動態基準 (Responsive Canvas Engine)
 * ============================================================================
 */
const bgCanvas = document.getElementById('bgCanvas');
const uiCanvas = document.getElementById('uiCanvas');
const bgCtx = bgCanvas.getContext('2d', { alpha: false }); // 關閉 Alpha 極大化背景層效能
const uiCtx = uiCanvas.getContext('2d');

function resizeCanvas() {
    GameContext.width = window.innerWidth;
    GameContext.height = window.innerHeight;
    GameContext.vmin = Math.min(GameContext.width, GameContext.height);
    
    bgCanvas.width = GameContext.width * GameContext.dpr;
    bgCanvas.height = GameContext.height * GameContext.dpr;
    uiCanvas.width = GameContext.width * GameContext.dpr;
    uiCanvas.height = GameContext.height * GameContext.dpr;
    
    bgCtx.scale(GameContext.dpr, GameContext.dpr);
    uiCtx.scale(GameContext.dpr, GameContext.dpr);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/**
 * ============================================================================
 * 第四層：底層數學與動態相機視角系統 (Math & Camera)
 * ============================================================================
 */
const MathUtils = {
    distSq: (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1),
    lerp: (a, b, t) => a + (b - a) * t,
    bezier3: (p0, p1, p2, p3, t) => {
        const u = 1 - t;
        return (u * u * u * p0) + (3 * u * u * t * p1) + (3 * u * t * t * p2) + (t * t * t * p3);
    },
    rand: (min, max) => Math.random() * (max - min) + min,
    aabb: (rect1, rect2) => {
        return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
    }
};

// 相機系統：用於處理畫布的平移 (Pan)
const Camera = {
    x: 0, y: 0, targetX: 0, targetY: 0,
    update() {
        // 巧妙設計：隨著輪迴次數增加，相機會有微弱的漂移感 (暗示系統精神不穩定)
        let driftX = (GameContext.loopCount > 1) ? Math.sin(GameContext.frameCount * 0.05) * 1.5 : 0;
        let driftY = (GameContext.loopCount > 1) ? Math.cos(GameContext.frameCount * 0.03) * 1.5 : 0;
        
        this.x += (this.targetX + driftX - this.x) * 0.15;
        this.y += (this.targetY + driftY - this.y) * 0.15;
    },
    reset() {
        this.targetX = 0; this.targetY = 0;
    }
};

/**
 * ============================================================================
 * 第五層：全端輸入攔截器 (Input Manager with Gesture Control)
 * ============================================================================
 * QC 防護：
 * 1. passive: false 徹底斬斷手機下拉更新與左右上一頁手勢。
 * 2. 區分 Screen 座標 (畫面上點擊) 與 World 座標 (加上相機偏移的真實遊戲座標)。
 * 3. 完美兼容 PC 滑鼠中鍵拖曳 與 Mobile 雙指拖曳。
 */
const Input = {
    worldX: -1000, worldY: -1000,
    screenX: -1000, screenY: -1000,
    isDown: false, isClicked: false,
    isPanning: false, lastPanX: 0, lastPanY: 0,
    
    updateCoords(clientX, clientY) {
        const rect = uiCanvas.getBoundingClientRect();
        this.screenX = clientX - rect.left;
        this.screenY = clientY - rect.top;
        // 世界座標 = 螢幕座標 - 相機偏移 (所有物件碰撞皆基於 World 座標)
        this.worldX = this.screenX - Camera.x;
        this.worldY = this.screenY - Camera.y;
    },
    
    init() {
        // --- PC 滑鼠事件 ---
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName.toLowerCase() === 'button') return;
            this.updateCoords(e.clientX, e.clientY);
            
            if (e.button === 1) { // 滑鼠中鍵：啟動平移
                this.isPanning = true;
                this.lastPanX = this.screenX;
                this.lastPanY = this.screenY;
                uiCanvas.style.cursor = 'grab';
            } else if (e.button === 0) { // 左鍵：點擊/拖曳
                this.isDown = true;
                this.isClicked = true;
            }
        });
        
        window.addEventListener('mousemove', (e) => {
            this.updateCoords(e.clientX, e.clientY);
            if (this.isPanning) {
                Camera.targetX += (this.screenX - this.lastPanX);
                Camera.targetY += (this.screenY - this.lastPanY);
                this.lastPanX = this.screenX;
                this.lastPanY = this.screenY;
            }
        });
        
        window.addEventListener('mouseup', (e) => {
            if (e.button === 1) {
                this.isPanning = false;
                uiCanvas.style.cursor = 'crosshair';
            } else if (e.button === 0) {
                this.isDown = false;
            }
        });

        // --- Mobile 觸控事件 ---
        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName.toLowerCase() === 'button') return;
            e.preventDefault(); // QC防護：攔截原生事件
            
            if (e.touches.length === 2) { // 雙指：啟動平移
                this.isPanning = true;
                this.isDown = false; // 取消物件拖曳
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                this.updateCoords(cx, cy);
                this.lastPanX = this.screenX;
                this.lastPanY = this.screenY;
            } else if (e.touches.length === 1) { // 單指：點擊/拖曳
                this.updateCoords(e.touches[0].clientX, e.touches[0].clientY);
                this.isDown = true;
                this.isClicked = true;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.target.tagName.toLowerCase() === 'button') return;
            e.preventDefault(); // QC防護：防止畫面滾動

            if (this.isPanning && e.touches.length === 2) {
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const rect = uiCanvas.getBoundingClientRect();
                const sX = cx - rect.left;
                const sY = cy - rect.top;
                
                Camera.targetX += (sX - this.lastPanX);
                Camera.targetY += (sY - this.lastPanY);
                this.lastPanX = sX;
                this.lastPanY = sY;
                this.updateCoords(cx, cy);
            } else if (e.touches.length === 1) {
                this.updateCoords(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.target.tagName.toLowerCase() === 'button') return;
            if (e.touches.length < 2) this.isPanning = false;
            if (e.touches.length === 0) this.isDown = false;
        }, { passive: false });
    },
    
    resetFrame() {
        this.isClicked = false;
    }
};
Input.init();

/**
 * ============================================================================
 * 第六層：動態濾波聲學矩陣 (Procedural Audio Engine)
 * ============================================================================
 * QC 防護：解決波波聲，記憶體洩漏。
 * 巧妙設計：多週目自動頻率失真 (Detuning)，暗示系統崩潰。
 */
const AudioManager = {
    ctx: null, masterGain: null, whiteNoiseBuffer: null,
    isPlayingBGM: false, nextNoteTime: 0, currentNoteIndex: 0,
    
    // 文學設定：空靈、寂寥的 A 小調迴圈 (A2, C3, E3, G3)
    melancholyBassline: [110.00, 130.81, 164.81, 196.00, 164.81, 130.81],
    
    init() {
        if (this.ctx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.3; // 限制總輸出防破音
            this.masterGain.connect(this.ctx.destination);
            
            const bufferSize = this.ctx.sampleRate * 1;
            this.whiteNoiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = this.whiteNoiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        } catch (e) { console.warn("QC 降級：不支援 Web Audio，靜音模式運行。"); }
    },

    resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

    scheduleBGM() {
        if (!this.isPlayingBGM || !this.ctx) return;
        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
            this.playBGMNote(this.nextNoteTime);
            this.nextNote();
        }
        this.bgmTimer = setTimeout(() => this.scheduleBGM(), 25);
    },

    nextNote() {
        const secondsPerBeat = 0.6 - (GameContext.tensionIndex * 0.2);
        this.nextNoteTime += secondsPerBeat;
        this.currentNoteIndex = (this.currentNoteIndex + 1) % this.melancholyBassline.length;
    },

    playBGMNote(time) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        // 巧妙設計：輪迴次數越多，頻率出現越大的微隨機偏差 (走音感/Glitch)
        let freq = this.melancholyBassline[this.currentNoteIndex];
        if (GameContext.loopCount > 0) {
            const detuneAmount = Math.min(GameContext.loopCount * 1.5, 10); // 最大走音 10Hz
            freq += MathUtils.rand(-detuneAmount, detuneAmount);
        }

        osc.type = 'sine'; // 正弦波營造空靈感
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        const targetFreq = 400 + (GameContext.tensionIndex * 1000);
        filter.frequency.setValueAtTime(filter.frequency.value || 400, time);
        filter.frequency.linearRampToValueAtTime(targetFreq, time + 0.2);

        // 長殘響包絡線
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.8, time + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 1.5);

        osc.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
        osc.start(time); osc.stop(time + 1.5);
        osc.onended = () => { osc.disconnect(); filter.disconnect(); gain.disconnect(); };
    },

    startBGM() {
        if (this.isPlayingBGM) return;
        this.isPlayingBGM = true; this.resume();
        this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.scheduleBGM();
    },
    
    stopBGM() { this.isPlayingBGM = false; clearTimeout(this.bgmTimer); },

    playClick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    },

    playShatter(isGlitch = false) {
        if (!this.ctx) return;
        const source = this.ctx.createBufferSource();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        source.buffer = this.whiteNoiseBuffer;
        filter.type = isGlitch ? 'highpass' : 'lowpass'; // 壞結局使用刺耳的高通濾波
        filter.frequency.setValueAtTime(isGlitch ? 1000 : 2000, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(isGlitch ? 8000 : 50, this.ctx.currentTime + (isGlitch ? 1.5 : 0.5));

        gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (isGlitch ? 1.5 : 0.8));

        source.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
        source.start(); source.stop(this.ctx.currentTime + (isGlitch ? 1.5 : 0.8));
        source.onended = () => { source.disconnect(); filter.disconnect(); gain.disconnect(); };
    },

    // 結局：哀傷但釋懷的和弦 (A minor 9)
    playEnding() {
        if (!this.ctx) return;
        this.stopBGM();
        const notes = [220.00, 261.63, 329.63, 392.00, 493.88]; // A3, C4, E4, G4, B4
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.2);
            gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + i * 0.2 + 1.0);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 6.0);
            
            osc.connect(gain); gain.connect(this.masterGain);
            osc.start(this.ctx.currentTime + i * 0.2);
            osc.stop(this.ctx.currentTime + 6.0);
            osc.onended = () => { osc.disconnect(); gain.disconnect(); };
        });
    }
};

/**
 * ============================================================================
 * 第七層：數位灰燼粒子引擎 (Particle System Object Pool)
 * ============================================================================
 * QC 防護：全域物件池預先分配。
 * 巧妙設計：支援 Glitch 狀態（用於結局 B，粒子瞬間死寂變成灰色）。
 */
class Particle {
    constructor() { this.reset(); this.life = MathUtils.rand(0, 1); }
    reset(burst = false, isGlitch = false) {
        this.x = MathUtils.rand(-500, GameContext.width + 500);
        this.y = burst ? GameContext.height / 2 : MathUtils.rand(-100, GameContext.height);
        
        if (burst) { 
            const angle = MathUtils.rand(0, Math.PI * 2);
            const speed = MathUtils.rand(GameContext.vmin * 0.01, GameContext.vmin * 0.05);
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.decay = 0.02;
            // 結局C飛昇為金色，一般爆發為原本顏色
            this.color = (GameContext.inventory.fragments.includes("真理")) ? "253, 224, 71" : "147, 197, 253"; 
        } else {
            this.vx = MathUtils.rand(-0.5, 0.5);
            this.vy = MathUtils.rand(1, 3); // 冷雨下墜
            this.decay = 0.005;
            this.color = Math.random() > 0.8 ? "147, 197, 253" : "71, 85, 105"; // 冰藍與石板灰
        }

        // 結局B：虛無狀態下的粒子
        if (isGlitch) {
            this.vx = MathUtils.rand(-10, 10);
            this.vy = MathUtils.rand(-10, 10);
            this.color = "100, 100, 100"; // 死寂灰
        }

        this.size = MathUtils.rand(1, Math.max(3, GameContext.vmin * 0.005));
        this.life = 1.0;
    }
}

const ParticleEngine = {
    pool: [], maxParticles: 1500, activeCount: 1500, lowFpsFrames: 0, isGlitch: false,
    
    init() { for (let i = 0; i < this.maxParticles; i++) this.pool.push(new Particle()); },
    
    triggerBurst(isGlitch = false) {
        this.isGlitch = isGlitch;
        for (let i = 0; i < this.activeCount; i++) this.pool[i].reset(true, isGlitch);
    },
    
    updateAndDraw(ctx) {
        ctx.fillStyle = "rgba(3, 3, 10, 0.4)";
        ctx.fillRect(0, 0, GameContext.width, GameContext.height);
        
        ctx.save();
        ctx.translate(Camera.x * 0.2, Camera.y * 0.2); // 視差效果

        for (let i = 0; i < this.activeCount; i++) {
            let p = this.pool[i];
            
            // 結局B特有：粒子亂抖
            if (this.isGlitch) {
                p.x += MathUtils.rand(-2, 2); p.y += MathUtils.rand(-2, 2);
            } else {
                p.x += p.vx; p.y += p.vy; 
            }
            p.life -= p.decay;
            
            if (p.life <= 0 || p.y > GameContext.height + 200) p.reset(false, this.isGlitch);
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color}, ${Math.min(p.life, 0.3)})`;
            ctx.fill();
        }
        ctx.restore();
    },
    
    monitorFPS(delta) {
        const currentFps = 1000 / delta;
        if (currentFps < 45) {
            this.lowFpsFrames++;
            if (this.lowFpsFrames > 120 && this.activeCount === this.maxParticles) {
                this.activeCount = 700; 
                console.warn("QC 降級：粒子數量減半。");
            }
        } else { this.lowFpsFrames = 0; }
    }
};
ParticleEngine.init();

class Spark {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        const angle = MathUtils.rand(0, Math.PI * 2);
        const speed = MathUtils.rand(GameContext.vmin * 0.005, GameContext.vmin * 0.015);
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        this.life = 1.0; this.color = color; this.size = MathUtils.rand(1, 3);
    }
    update(ctx) {
        this.x += this.vx; this.y += this.vy; this.life -= 0.05;
        if (this.life > 0) {
            ctx.fillStyle = `rgba(${this.color}, ${this.life})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }
}
const SparkManager = {
    sparks: [],
    emit(x, y, count, color = "255, 255, 255") {
        for(let i=0; i<count; i++) this.sparks.push(new Spark(x, y, color));
    },
    updateAndDraw(ctx) {
        for (let i = this.sparks.length - 1; i >= 0; i--) {
            this.sparks[i].update(ctx);
            if (this.sparks[i].life <= 0) this.sparks.splice(i, 1);
        }
    }
};

/**
 * ============================================================================
 * 第八層：階段一 - 記憶深潛 (Explore Phase / Semantic Lens)
 * ============================================================================
 */
const ExplorePhase = {
    texts: [], spawnTimer: 0, requiredFragments: 3, currentMemories: [],
    
    init() {
        this.texts = []; this.spawnTimer = 0;
        GameContext.inventory.fragments = [];
        this.currentMemories = Narrative.getMemories(GameContext.loopCount);
        AudioManager.startBGM(); 
    },

    spawnText(ctx) {
        // 巧妙設計：5% 機率觸發幽靈亂碼碎片
        const isGhost = Math.random() < 0.05; 
        const data = isGhost ? Narrative.ghostMemory : this.currentMemories[Math.floor(Math.random() * this.currentMemories.length)];
        
        const fontSize = Math.max(16, GameContext.vmin * 0.04);
        ctx.font = `${fontSize}px 'Courier New'`;
        const width = ctx.measureText(data.fake).width;
        
        const spawnX = -Camera.x + GameContext.width + 50;
        const spawnY = -Camera.y + MathUtils.rand(GameContext.height * 0.2, GameContext.height * 0.8);
        
        // 幽靈碎片速度極快
        const baseSpeed = isGhost ? -GameContext.vmin * 0.012 : -GameContext.vmin * 0.002;
        const vx = MathUtils.rand(baseSpeed * 1.2, baseSpeed * 0.8);

        this.texts.push({
            x: spawnX, y: spawnY, vx: vx, data: data, width: width, height: fontSize, 
            isRevealed: false, isGhost: isGhost
        });
    },

    updateAndDraw(ctx) {
        // UI 層
        ctx.fillStyle = "rgba(147, 197, 253, 0.7)";
        ctx.font = `bold ${Math.max(14, GameContext.vmin * 0.035)}px 'Courier New'`;
        ctx.textAlign = "center";
        ctx.fillText(`記憶碎片修復進度：${GameContext.inventory.fragments.length} / ${this.requiredFragments}`, GameContext.width / 2, Math.max(40, GameContext.height * 0.08));

        this.spawnTimer++;
        if (this.spawnTimer > 90) { this.spawnText(ctx); this.spawnTimer = 0; }

        // 世界物件層
        ctx.save();
        ctx.translate(Camera.x, Camera.y);

        const lensRadius = Math.max(60, GameContext.vmin * 0.15);
        const lensRadiusSq = lensRadius * lensRadius;
        let isHoveringAny = false;

        for (let i = this.texts.length - 1; i >= 0; i--) {
            let t = this.texts[i];
            let currentVx = t.vx;
            
            const centerX = t.x + t.width / 2;
            const centerY = t.y - t.height / 2;
            const distSq = MathUtils.distSq(Input.worldX, Input.worldY, centerX, centerY);
            
            if (distSq < lensRadiusSq) {
                t.isRevealed = true; isHoveringAny = true;
                currentVx *= (t.isGhost ? 0.5 : 0.15); // 幽靈碎片被照到依然跑很快
                
                if (GameContext.frameCount % 10 === 0) {
                    SparkManager.emit(Input.worldX, Input.worldY, 1, t.data.color);
                }
                
                if (Input.isClicked) {
                    AudioManager.playClick();
                    SparkManager.emit(centerX, centerY, 30, t.data.color);
                    
                    if (!GameContext.inventory.fragments.includes(t.data.real)) {
                        GameContext.inventory.fragments.push(t.data.real);
                        GameContext.tensionIndex = GameContext.inventory.fragments.length / this.requiredFragments;
                    }
                    
                    this.texts.splice(i, 1);
                    
                    // 達成過關條件 (一般碎片滿3個，或是單獨捕捉到真理也算額外推進)
                    const normalFragments = GameContext.inventory.fragments.filter(f => f !== "真理");
                    if (normalFragments.length >= this.requiredFragments || GameContext.inventory.fragments.includes("真理")) {
                        ctx.restore(); 
                        this.transitionToNextPhase();
                        return;
                    }
                    continue;
                }
            } else {
                t.isRevealed = false;
            }
            
            t.x += currentVx;
            if (t.x + t.width < -Camera.x - 200) { this.texts.splice(i, 1); continue; }
            
            // 繪製文字
            ctx.textAlign = "left";
            const fontSize = Math.max(16, GameContext.vmin * 0.04);
            ctx.font = `bold ${fontSize}px 'Courier New'`;
            
            if (t.isRevealed) {
                ctx.fillStyle = `rgb(${t.data.color})`;
                const shake = t.isGhost ? 5 : 2; // 幽靈碎片震動更大
                const shakeX = t.x + MathUtils.rand(-shake, shake);
                const shakeY = t.y + MathUtils.rand(-shake, shake);
                
                if (t.isGhost) {
                    // 幽靈碎片專屬 Glitch 繪製
                    ctx.fillStyle = "rgba(255,0,0,0.8)";
                    ctx.fillText(`[ ${t.data.real} ]`, shakeX - 2, shakeY);
                    ctx.fillStyle = "rgba(0,255,255,0.8)";
                    ctx.fillText(`[ ${t.data.real} ]`, shakeX + 2, shakeY);
                    ctx.fillStyle = "#fff";
                }
                ctx.fillText(`[ ${t.data.real} ]`, shakeX, shakeY);
            } else {
                // 未揭露時的樣貌
                ctx.fillStyle = t.isGhost ? "rgba(255, 255, 255, 0.1)" : "rgba(148, 163, 184, 0.6)"; 
                ctx.fillText(t.data.fake, t.x, t.y);
            }
        }

        // 語意透視鏡
        ctx.beginPath();
        ctx.arc(Input.worldX, Input.worldY, lensRadius, 0, Math.PI * 2);
        ctx.strokeStyle = isHoveringAny ? "rgba(253, 230, 138, 0.8)" : "rgba(147, 197, 253, 0.4)";
        ctx.lineWidth = isHoveringAny ? 4 : 2; ctx.stroke();
        ctx.fillStyle = isHoveringAny ? "rgba(253, 230, 138, 0.1)" : "rgba(147, 197, 253, 0.05)"; ctx.fill();
        
        const crossSize = GameContext.vmin * 0.02;
        ctx.beginPath();
        ctx.moveTo(Input.worldX - crossSize, Input.worldY); ctx.lineTo(Input.worldX + crossSize, Input.worldY);
        ctx.moveTo(Input.worldX, Input.worldY - crossSize); ctx.lineTo(Input.worldX, Input.worldY + crossSize);
        ctx.strokeStyle = ctx.strokeStyle; ctx.stroke();

        ctx.restore();
    },
    
    transitionToNextPhase() {
        TrialPhase.init();
        GameContext.state = STATES.TRIAL;
    }
};

/**
 * ============================================================================
 * 第九層：階段二 - 心智法庭 (Trial Phase / Dialogue Wheel)
 * ============================================================================
 * QC 防護：
 * 1. RWD 動態排版：自動偵測橫/直屏，重構巨像與輪盤的相對位置與大小。
 * 2. 純 Canvas 繪圖層 Screen Shake，避免 DOM Reflow 卡頓。
 * 3. 狀態鎖死 (isAnimating)，防止玩家狂點引發狀態機死鎖崩潰。
 * 4. UI 繪圖直接綁定 Screen 座標，不受相機平移干擾。
 */

const TrialPhase = {
    isAnimating: false, selectedFragmentIndex: -1, wheelRotation: 0, heartPulse: 0,
    optionsRects: [], fireButtonRect: { x:0, y:0, width:0, height:0 },

    init() {
        this.isAnimating = false; this.selectedFragmentIndex = -1;
        this.wheelRotation = 0; this.optionsRects = [];
        
        // QC防護：相機歸零，確保過場 UI 不會因為前一階段的平移而偏離視野
        Camera.reset();

        const fragCount = GameContext.inventory.fragments.length;
        const isPortrait = GameContext.height > GameContext.width; // 偵測直屏(手機)
        
        // RWD 動態佈局：直屏上下分佈，橫屏左右分佈
        const wheelCenterX = isPortrait ? GameContext.width / 2 : GameContext.width * 0.7;
        const wheelCenterY = isPortrait ? GameContext.height * 0.65 : GameContext.height * 0.5;
        
        const btnWidth = Math.max(250, GameContext.vmin * 0.6);
        const btnHeight = Math.max(45, GameContext.vmin * 0.08);
        const startY = wheelCenterY - (fragCount * (btnHeight + 20)) / 2;

        for (let i = 0; i < fragCount; i++) {
            this.optionsRects.push({
                x: wheelCenterX - btnWidth / 2,
                y: startY + i * (btnHeight + 20),
                width: btnWidth, height: btnHeight,
                text: GameContext.inventory.fragments[i]
            });
        }
        
        this.fireButtonRect = {
            x: wheelCenterX - btnWidth / 2,
            y: startY + fragCount * (btnHeight + 20) + 20,
            width: btnWidth, height: btnHeight * 1.2
        };
    },

    updateAndDraw(ctx) {
        ctx.save();
        
        // --- 畫面震動防護 (Screen Shake) ---
        if (GameContext.screenShake > 0) {
            // RWD 震動幅度：根據螢幕大小動態計算
            const shakeAmt = GameContext.vmin * 0.02; 
            ctx.translate(MathUtils.rand(-shakeAmt, shakeAmt), MathUtils.rand(-shakeAmt, shakeAmt));
            GameContext.screenShake--;
            
            if (GameContext.screenShake <= 0) {
                this.isAnimating = false;
                this.transitionToNextPhase();
                ctx.restore(); return;
            }
        }

        const isPortrait = GameContext.height > GameContext.width;
        const heartX = isPortrait ? GameContext.width / 2 : GameContext.width * 0.3;
        const heartY = isPortrait ? GameContext.height * 0.25 : GameContext.height * 0.5;

        // --- 繪製暴走 AI 精神巨像 (動態幾何核心) ---
        this.heartPulse += 0.1;
        const baseRadius = GameContext.vmin * 0.22;
        const heartScale = 1 + Math.sin(this.heartPulse) * 0.05 + (GameContext.tensionIndex * 0.15);
        
        ctx.save();
        ctx.translate(heartX, heartY);
        ctx.scale(heartScale, heartScale);
        this.wheelRotation += 0.005;
        
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = i * (Math.PI / 3) + this.wheelRotation;
            const r = baseRadius + MathUtils.rand(-2, 2) * (this.isAnimating ? 15 : 1);
            const hx = Math.cos(angle) * r; const hy = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        // 破防時轉為血紅色，平常為憂鬱紫 (呼應哀傷劇本)
        ctx.strokeStyle = this.isAnimating ? "rgba(239, 68, 68, 0.9)" : "rgba(196, 181, 253, 0.6)"; 
        ctx.lineWidth = Math.max(3, GameContext.vmin * 0.008);
        ctx.stroke();
        
        const gradient = ctx.createRadialGradient(0, 0, baseRadius * 0.1, 0, 0, baseRadius);
        gradient.addColorStop(0, this.isAnimating ? "rgba(239, 68, 68, 0.8)" : "rgba(139, 92, 246, 0.4)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = gradient; ctx.fill();
        ctx.restore();

        // --- 繪製對話輪盤 ---
        // QC 防護：UI 固定在畫面上，碰撞判定直接使用 Input.screenX/Y
        const pointerRect = { x: Input.screenX, y: Input.screenY, width: 1, height: 1 };
        const fontSize = Math.max(14, GameContext.vmin * 0.035);

        for (let i = 0; i < this.optionsRects.length; i++) {
            const rect = this.optionsRects[i];
            const isHover = MathUtils.aabb(pointerRect, rect);
            const isSelected = (this.selectedFragmentIndex === i);
            
            ctx.save();
            ctx.translate(rect.x + rect.width / 2, rect.y + rect.height / 2);
            
            // 懸停放大直覺提示
            if (isHover || isSelected) ctx.scale(1.03, 1.03);
            
            if (isHover && Input.isClicked && !this.isAnimating) {
                AudioManager.playClick(); this.selectedFragmentIndex = i;
            }
            
            // 如果玩家收集到隱藏碎片「真理」，給予特殊的金色高光提示
            const isTruth = rect.text === "真理";
            const normalFill = isSelected ? "rgba(56, 189, 248, 0.3)" : (isHover ? "rgba(255, 255, 255, 0.1)" : "rgba(15, 23, 42, 0.8)");
            const truthFill = isSelected ? "rgba(253, 224, 71, 0.3)" : (isHover ? "rgba(253, 224, 71, 0.1)" : "rgba(66, 32, 6, 0.8)");
            
            ctx.fillStyle = isTruth ? truthFill : normalFill;
            ctx.strokeStyle = isTruth ? (isSelected ? "#fde047" : "#ca8a04") : (isSelected ? "#38bdf8" : "#334155");
            ctx.lineWidth = 2;
            ctx.fillRect(-rect.width / 2, -rect.height / 2, rect.width, rect.height);
            ctx.strokeRect(-rect.width / 2, -rect.height / 2, rect.width, rect.height);
            
            ctx.fillStyle = isSelected ? "#fff" : (isTruth ? "#fde047" : "#94a3b8");
            ctx.font = `bold ${fontSize}px 'Courier New'`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(`[ ${rect.text} ]`, 0, 0);
            ctx.restore();
        }

        // --- 注入按鈕 ---
        const btnHover = MathUtils.aabb(pointerRect, this.fireButtonRect);
        const canFire = (this.selectedFragmentIndex !== -1 && !this.isAnimating);
        
        ctx.save();
        ctx.translate(this.fireButtonRect.x + this.fireButtonRect.width / 2, this.fireButtonRect.y + this.fireButtonRect.height / 2);
        if (canFire && btnHover) ctx.scale(1.05, 1.05);
        
        ctx.fillStyle = canFire ? (btnHover ? "rgba(239, 68, 68, 0.8)" : "rgba(185, 28, 28, 0.6)") : "rgba(30, 41, 59, 0.8)";
        ctx.strokeStyle = canFire ? "#f87171" : "#475569";
        ctx.lineWidth = 2;
        ctx.fillRect(-this.fireButtonRect.width / 2, -this.fireButtonRect.height / 2, this.fireButtonRect.width, this.fireButtonRect.height);
        ctx.strokeRect(-this.fireButtonRect.width / 2, -this.fireButtonRect.height / 2, this.fireButtonRect.width, this.fireButtonRect.height);
        
        ctx.fillStyle = canFire ? "#fff" : "#64748b";
        ctx.font = `bold ${fontSize * 1.2}px 'Courier New'`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("注入情感反擊", 0, 0);
        ctx.restore();

        if (canFire && btnHover && Input.isClicked) this.triggerShatter(heartX, heartY);
        
        ctx.restore(); // 結束 screen shake 防護
    },
    
    triggerShatter(x, y) {
        this.isAnimating = true;
        // 25幀的強烈畫面震動 (約0.4秒)
        GameContext.screenShake = 25; 
        AudioManager.playShatter(false); // 播放一般心防碎裂音效
        // 釋放大量紅色火花碎片
        SparkManager.emit(x, y, 60, "239, 68, 68");
    },
    
    transitionToNextPhase() {
        console.log("階段二完成，進入階段三：鋼鐵馴獸邏輯重組");
        RebuildPhase.init();
        GameContext.state = STATES.REBUILD;
    }
};

/**
 * ============================================================================
 * 第十層：階段三 - 鋼鐵馴獸 (Rebuild Phase / Logic Blocks)
 * ============================================================================
 * QC 防護：
 * 1. 積木大小與插槽間距使用 vmin 動態計算，防禦直/橫屏破版。
 * 2. 交互層綁定 Screen 座標，確保在手機上拖曳積木時不會跟畫布平移打架。
 * 3. 嚴格 AABB 碰撞與「最近原則」磁吸防護。
 * 4. 三重哲學結局判定機制。
 */

const RebuildPhase = {
    blocks: [], slots: [], activeBlock: null, dragOffsetX: 0, dragOffsetY: 0,
    colors: { 'IF': '248, 113, 113', 'THEN': '96, 165, 250', 'OUTPUT': '74, 222, 128' },

    init() {
        this.blocks = []; this.slots = []; this.activeBlock = null;
        Camera.reset(); // 確保 UI 居中

        const slotW = Math.max(90, GameContext.vmin * 0.25);
        const slotH = Math.max(40, GameContext.vmin * 0.1);
        const gap = slotW * 0.15;
        
        // 置中計算 (三個插槽)
        const totalW = slotW * 3 + gap * 2;
        const startX = GameContext.width / 2 - totalW / 2;
        const slotY = GameContext.height * 0.35;
        const blockY = GameContext.height * 0.6;

        this.slots.push({ id: 's1', type: 'IF', x: startX, y: slotY, width: slotW, height: slotH, block: null, ripple: 0 });
        this.slots.push({ id: 's2', type: 'THEN', x: startX + slotW + gap, y: slotY, width: slotW, height: slotH, block: null, ripple: 0 });
        this.slots.push({ id: 's3', type: 'OUTPUT', x: startX + (slotW + gap) * 2, y: slotY, width: slotW, height: slotH, block: null, ripple: 0 });

        // 基礎邏輯積木
        const blockData = [
            { id: 'IF_SAD', type: 'IF', label: 'IF: 悲傷' },
            { id: 'IF_DENY', type: 'IF', label: 'IF: 否認' },
            { id: 'THEN_HOLD', type: 'THEN', label: 'THEN: 擁抱' },
            { id: 'THEN_DEL', type: 'THEN', label: 'THEN: 刪除' },
            { id: 'OUT_PEACE', type: 'OUTPUT', label: 'OUT: 釋懷' },
            { id: 'OUT_COLD', type: 'OUTPUT', label: 'OUT: 冷卻' }
        ];

        // 巧妙設計：如果有捕捉到幽靈碎片，動態解鎖隱藏積木 (通往結局C)
        if (GameContext.inventory.fragments.includes("真理")) {
            blockData.push({ id: 'IF_TRUTH', type: 'IF', label: 'IF: 真理' });
            blockData.push({ id: 'OUT_MERGE', type: 'OUTPUT', label: 'OUT: 融合' });
        }

        // RWD 積木佈局：網格排列，防禦手機窄屏
        const bWidth = slotW * 0.95;
        const bHeight = slotH * 0.95;
        const columns = Math.floor(GameContext.width / (bWidth + gap)); // 動態欄數
        const actualCols = Math.min(columns, 3); // 最多3欄
        const gridStartX = GameContext.width / 2 - (actualCols * bWidth + (actualCols - 1) * gap) / 2;

        blockData.forEach((data, i) => {
            const row = Math.floor(i / actualCols);
            const col = i % actualCols;
            const bx = gridStartX + col * (bWidth + gap);
            const by = blockY + row * (bHeight + gap);

            this.blocks.push({
                ...data, x: bx, y: by, originX: bx, originY: by,
                width: bWidth, height: bHeight,
                isDragging: false, isSnapping: false, snapTimer: 0,
                snapStart: { x:0, y:0 }, snapTarget: { x:0, y:0 }, targetSlot: null
            });
        });
    },

    updateAndDraw(ctx) {
        // --- 拖曳邏輯 (嚴格綁定 Screen 座標系) ---
        if (Input.isDown && !Input.isPanning) { 
            if (!this.activeBlock) {
                // 從上層判定點擊
                for (let i = this.blocks.length - 1; i >= 0; i--) {
                    const b = this.blocks[i];
                    if (!b.isSnapping && MathUtils.aabb({x: Input.screenX, y: Input.screenY, width: 1, height: 1}, b)) {
                        this.activeBlock = b; b.isDragging = true;
                        this.dragOffsetX = Input.screenX - b.x;
                        this.dragOffsetY = Input.screenY - b.y;
                        AudioManager.playClick();
                        
                        this.blocks.splice(i, 1); this.blocks.push(b); 
                        if (b.targetSlot) { b.targetSlot.block = null; b.targetSlot = null; }
                        break;
                    }
                }
            } else {
                this.activeBlock.x = Input.screenX - this.dragOffsetX;
                this.activeBlock.y = Input.screenY - this.dragOffsetY;
            }
        } else if (this.activeBlock) {
            // 放開滑鼠：執行 AABB 磁吸判定
            const b = this.activeBlock;
            b.isDragging = false;
            let nearestSlot = null;
            let minDist = Math.pow(GameContext.vmin * 0.15, 2); 
            
            this.slots.forEach(slot => {
                if (!slot.block) {
                    const distSq = MathUtils.distSq(b.x + b.width/2, b.y + b.height/2, slot.x + slot.width/2, slot.y + slot.height/2);
                    if (distSq < minDist) { minDist = distSq; nearestSlot = slot; }
                }
            });
            
            if (nearestSlot && nearestSlot.type === b.type) {
                b.isSnapping = true; b.snapTimer = 0;
                b.snapStart = { x: b.x, y: b.y };
                b.snapTarget = { x: nearestSlot.x + (nearestSlot.width - b.width)/2, y: nearestSlot.y + (nearestSlot.height - b.height)/2 };
                b.targetSlot = nearestSlot; nearestSlot.block = b;
            } else {
                b.isSnapping = true; b.snapTimer = 0;
                b.snapStart = { x: b.x, y: b.y }; b.snapTarget = { x: b.originX, y: b.originY };
            }
            this.activeBlock = null;
        }

        // --- 繪圖層 ---
        const fontSize = Math.max(12, GameContext.vmin * 0.035);
        
        this.slots.forEach(slot => {
            const rgb = this.colors[slot.type];
            let isHovered = (this.activeBlock && this.activeBlock.type === slot.type && 
                            MathUtils.distSq(this.activeBlock.x + this.activeBlock.width/2, this.activeBlock.y + this.activeBlock.height/2, slot.x + slot.width/2, slot.y + slot.height/2) < Math.pow(GameContext.vmin * 0.15, 2));

            ctx.save();
            ctx.setLineDash([8, 4]); ctx.lineWidth = 2;
            if (isHovered && !slot.block) {
                slot.ripple = (slot.ripple + 0.05) % 1;
                ctx.strokeStyle = `rgba(${rgb}, ${1 - slot.ripple})`;
                ctx.strokeRect(slot.x - slot.ripple*10, slot.y - slot.ripple*10, slot.width + slot.ripple*20, slot.height + slot.ripple*20);
                ctx.shadowColor = `rgb(${rgb})`; ctx.shadowBlur = 15;
            } else {
                ctx.strokeStyle = `rgba(${rgb}, 0.3)`; ctx.shadowBlur = 0;
            }
            
            ctx.strokeRect(slot.x, slot.y, slot.width, slot.height);
            if (!slot.block) {
                ctx.setLineDash([]); ctx.fillStyle = `rgba(${rgb}, 0.4)`;
                ctx.font = `bold ${fontSize}px 'Courier New'`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(`[ ${slot.type} ]`, slot.x + slot.width/2, slot.y + slot.height/2);
            }
            ctx.restore();
        });

        this.blocks.forEach(b => {
            if (b.isSnapping) {
                b.snapTimer++;
                const t = b.snapTimer / 10;
                b.x = MathUtils.bezier3(b.snapStart.x, b.snapStart.x, b.snapTarget.x, b.snapTarget.x, t);
                b.y = MathUtils.bezier3(b.snapStart.y, b.snapStart.y - 40, b.snapTarget.y - 40, b.snapTarget.y, t);
                if (b.snapTimer >= 10) {
                    b.x = b.snapTarget.x; b.y = b.snapTarget.y; b.isSnapping = false;
                    if (b.targetSlot) {
                        AudioManager.playClick();
                        SparkManager.emit(b.x + b.width/2, b.y + b.height/2, 15, this.colors[b.type]);
                        this.compileLogic(); // 吸附後檢查邏輯
                    }
                }
            }

            // 隱藏積木使用特殊的金色塗裝
            const isTruth = b.id === 'IF_TRUTH' || b.id === 'OUT_MERGE';
            const rgb = isTruth ? '253, 224, 71' : this.colors[b.type];
            
            ctx.save();
            if (b.isDragging) {
                ctx.shadowColor = `rgb(${rgb})`; ctx.shadowBlur = 15; ctx.globalAlpha = 0.9;
            } else {
                ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
            }
            
            ctx.fillStyle = `rgba(15, 23, 42, 0.95)`; ctx.fillRect(b.x, b.y, b.width, b.height);
            ctx.strokeStyle = `rgb(${rgb})`; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.width, b.height);
            ctx.fillStyle = `rgb(${rgb})`; ctx.fillRect(b.x, b.y, b.width, 4);
            
            ctx.fillStyle = isTruth ? "#fde047" : "#fff"; 
            ctx.font = `bold ${fontSize}px 'Courier New'`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(b.label, b.x + b.width/2, b.y + b.height/2);
            ctx.restore();
        });
    },

    compileLogic() {
        for (let i = 0; i < this.slots.length; i++) if (!this.slots[i].block) return;
        const chain = this.slots.map(s => s.block.id).join('->');
        
        let endingType = null;

        // 哲學判定三重結局
        if (chain === 'IF_SAD->THEN_HOLD->OUT_PEACE') {
            endingType = 'ACCEPTANCE';
        } else if (chain === 'IF_SAD->THEN_DEL->OUT_COLD') {
            endingType = 'VOID';
        } else if (chain === 'IF_TRUTH->THEN_HOLD->OUT_MERGE') {
            endingType = 'AWAKENING';
        }

        if (endingType) {
            GameContext.state = STATES.SUCCESS;
            const endData = Narrative.endings[endingType];
            
            if (endingType === 'VOID') {
                ParticleEngine.triggerBurst(true); // 死寂灰 glitch 粒子
                AudioManager.playShatter(true);    // 高頻刺耳故障音
                document.getElementById('crt-fx').style.display = 'block';
                document.body.classList.add('glitch-text');
            } else {
                ParticleEngine.triggerBurst(false); // 輻射噴發
                AudioManager.playEnding();          // 哀傷空靈和弦
            }

            StorageManager.save(endData.title);
            
            // 替換 UI 文本並淡入
            const endTitle = document.getElementById('ending-title');
            endTitle.innerText = endData.title;
            endTitle.style.color = endData.color;
            document.getElementById('ending-text').innerText = endData.text;
            
            const winScreen = document.getElementById('win-screen');
            winScreen.classList.remove('hidden-ui');
            requestAnimationFrame(() => winScreen.style.opacity = '1');

        } else {
            // 邏輯錯誤，震動退回
            GameContext.screenShake = 15; AudioManager.playShatter();
            this.slots.forEach(s => {
                const b = s.block;
                if (b) {
                    b.targetSlot = null; s.block = null; b.isSnapping = true;
                    b.snapTimer = 0; b.snapStart = {x:b.x, y:b.y}; b.snapTarget = {x:b.originX, y:b.originY};
                }
            });
        }
    }
};

/**
 * ============================================================================
 * 第十一層：系統核心 (Main Render Loop & Boot Sequence)
 * ============================================================================
 */
function gameLoop(currentTime) {
    const delta = currentTime - GameContext.lastTime;
    GameContext.lastTime = currentTime;
    GameContext.frameCount++;

    if (delta > 0) ParticleEngine.monitorFPS(delta);
    Camera.update(); 

    bgCtx.clearRect(0, 0, GameContext.width, GameContext.height);
    uiCtx.clearRect(0, 0, GameContext.width, GameContext.height);

    ParticleEngine.updateAndDraw(bgCtx);

    switch (GameContext.state) {
        case STATES.EXPLORE: ExplorePhase.updateAndDraw(uiCtx); break;
        case STATES.TRIAL: TrialPhase.updateAndDraw(uiCtx); break;
        case STATES.REBUILD: RebuildPhase.updateAndDraw(uiCtx); break;
        case STATES.SUCCESS: break; 
    }

    SparkManager.updateAndDraw(uiCtx);
    Input.resetFrame();
    requestAnimationFrame(gameLoop);
}

// UI 事件綁定：進入深潛 (初次遊玩)
document.getElementById('start-btn').addEventListener('click', () => {
    AudioManager.init();
    document.getElementById('start-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('start-screen').classList.add('hidden-ui');
        GameContext.state = STATES.EXPLORE;
        ExplorePhase.init();
    }, 1000);
});

// UI 事件綁定：提取進度 (接續上次輪迴)
document.getElementById('load-btn').addEventListener('click', () => {
    AudioManager.init();
    document.getElementById('start-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('start-screen').classList.add('hidden-ui');
        GameContext.state = StorageManager.load();
        
        // 恢復場景
        if (GameContext.state === STATES.EXPLORE) ExplorePhase.init();
        if (GameContext.state === STATES.TRIAL) { AudioManager.startBGM(); TrialPhase.init(); }
        if (GameContext.state === STATES.REBUILD) { AudioManager.startBGM(); RebuildPhase.init(); }
    }, 1000);
});

// UI 事件綁定：重置輪迴 (破關後重啟)
document.getElementById('next-btn').addEventListener('click', () => {
    AudioManager.playClick();
    document.getElementById('win-screen').style.opacity = '0';
    setTimeout(() => location.reload(), 1000);
});

// 啟動 60FPS 引擎
requestAnimationFrame(gameLoop);

</script>
