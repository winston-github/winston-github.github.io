<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>聲音 P2P 白板 - CRC 短句互唱</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f5;touch-action:none;user-select:none}.board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#base{z-index:1}#live{z-index:2}#cursor{z-index:3;pointer-events:none}#wrap{position:relative;width:100vw;height:100vh;background:#fff}#grid{position:absolute;inset:0;background-image:radial-gradient(#d7d7d7 1px,transparent 1px);background-size:20px 20px}#bar{position:absolute;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fffffff2;border:1px solid #ddd;border-radius:999px;padding:9px 12px;box-shadow:0 8px 28px #0002}button{border:0;border-radius:999px;padding:10px 14px;font-weight:750;background:#fff;box-shadow:inset 0 0 0 1px #ddd}button.active{background:#e7f1ff;color:#06f;box-shadow:inset 0 0 0 2px #07f}button:disabled{opacity:.45}#color{width:36px;height:36px;border:0;background:transparent}#connect{background:#07f;color:#fff;box-shadow:none}.on#connect{background:#f33}#toast{position:absolute;z-index:999;top:-80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;border-radius:999px;padding:12px 20px;transition:.25s;white-space:nowrap}#toast.show{top:24px}#modal{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#081026,#16244a);color:#fff;overflow:auto;padding:22px 14px 100px}#modal.show{display:block}.card{width:min(800px,94vw);margin:auto;background:#ffffff14;border:1px solid #ffffff24;border-radius:28px;padding:18px;box-shadow:0 18px 60px #0006}.top{text-align:center;padding:8px 0 14px}.top h1{font-size:22px;margin:0 0 8px}.top p{margin:0;color:#ffffffb8;font-size:13px;line-height:1.55}.stage{display:none!important}.stage.show{display:block!important}.box{background:#0004;border:1px solid #ffffff22;border-radius:20px;padding:16px;margin:12px 0;text-align:center;line-height:1.65;white-space:pre-wrap}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.blue{background:#07f;color:#fff;box-shadow:none}.green{background:#28cd41;color:#fff;box-shadow:none}.red{background:#ff3b30;color:#fff;box-shadow:none}.ghost{background:#ffffff1f;color:#fff;box-shadow:inset 0 0 0 1px #fff4}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meter{background:#ffffff14;border-radius:15px;padding:11px;font-size:12px;color:#fffc}.meter.off{opacity:.38;filter:grayscale(1)}.track{height:10px;border-radius:999px;background:#ffffff24;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:#28cd41}.track.bad i{background:#fc0}.track.hot i{background:#f33}.track.tx i{background:#00d4ff}.count{font-size:36px;font-weight:900;text-align:center;text-shadow:0 0 28px #0df9;word-break:break-all}.prog{height:12px;background:#ffffff24;border-radius:999px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0df,#28cd41)}.viz{height:225px;overflow:auto;background:#0005;border-radius:16px;padding:12px;margin-top:12px;text-align:left;color:#fffd;font:12px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;white-space:pre-wrap}details{margin-top:12px;color:#fffb;font-size:12px;text-align:center}textarea{width:100%;height:74px;background:#0005;color:#fff;border:1px solid #fff3;border-radius:12px;padding:10px;font:11px ui-monospace,monospace}@media(max-width:560px){.meters{grid-template-columns:1fr}#bar{gap:5px}button{padding:9px 11px;font-size:13px}.viz{height:190px}}</style></head><body><div id="toast"></div><div id="wrap"><div id="grid"></div><canvas id="base" class="board"></canvas><canvas id="live" class="board"></canvas><canvas id="cursor" class="board"></canvas></div><div id="bar"><input id="color" type="color" value="#000000"><button id="pen" class="active">✏️</button><button id="eraser">🧹</button><button id="clear">🗑️</button><button id="connect">🔊 聲音連線</button></div><div id="modal"><div class="card"><div class="top"><h1>🔊 聲音 P2P 白板</h1><p>短句互唱 + CRC32 + 逐段 ACK。自己說時關閉對方音量條；聽對方時關閉自己音量條。</p></div><section id="stageCheck" class="stage show"><div id="checkStatus" class="box">請先做自我檢查。\n通過後不需要選 Host / Visitor，兩台一起按同步即可。</div><div class="meters"><div class="meter" id="selfMeter0">本機播放/回授<div id="selfBar0" class="track tx"><i></i></div></div><div class="meter" id="peerMeter0">本機麥克風收到<div id="peerBar0" class="track"><i></i></div></div></div><div class="actions"><button class="blue" id="selfBtn">1. 自我檢查</button><button class="green" id="syncReady" disabled>2. 進入同步</button><button class="red cancel">放棄</button></div></section><section id="stageSync" class="stage"><div class="box" id="readyText">本機 HASH：計算中...</div><div class="count" id="count">READY</div><div class="actions"><button class="green" id="syncBtn">兩人一起按：開始同步</button><button class="red cancel">放棄同步</button></div><div class="box">流程：短呼號 → CRC 驗證 → ACK 收到 → Offer / Answer 分段傳輸。每段都帶 CRC32。</div></section><section id="stageRun" class="stage"><div class="box" id="runStatus">準備中...</div><div class="meters"><div class="meter" id="selfMeter">自己說話音量<div id="selfBar" class="track tx"><i></i></div></div><div class="meter" id="peerMeter">對方說話音量<div id="peerBar" class="track"><i></i></div></div></div><div class="prog"><i id="prog"></i></div><div class="viz" id="viz"></div><div class="actions"><button class="ghost" id="replay">重播上一句</button><button class="red cancel">停止同步</button></div><details><summary>進階資訊 / 備援文字封包</summary><textarea id="manual"></textarea><div class="actions"><button class="ghost" id="applyManual">套用文字封包</button></div></details></section></div></div><script>
'use strict';const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),3000)}function now(){return new Date().toTimeString().slice(0,8).replaceAll(':','')}function viz(s){$('viz').textContent+='['+now()+'] '+s+'\n';$('viz').scrollTop=$('viz').scrollHeight}function status(s){$('runStatus').textContent=s;viz(s)}async function shortHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).slice(0,4).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}function showStage(id){['stageCheck','stageSync','stageRun'].forEach(x=>{const e=$(x);const on=x===id;e.classList.toggle('show',on);e.style.display=on?'block':'none'})}
const CRC_TABLE=(()=>{let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=((c&1)?(0xEDB88320^(c>>>1)):(c>>>1));t[n]=c>>>0}return t})();function crc32(str){let c=0^(-1);for(let i=0;i<str.length;i++)c=(c>>>8)^CRC_TABLE[(c^str.charCodeAt(i))&255];return ((c^(-1))>>>0).toString(16).toUpperCase().padStart(8,'0')}function bodyForCrc(o){let x={...o};delete x.crc;return JSON.stringify(x)}function addCrc(o){o.crc=crc32(bodyForCrc(o));return o}function validCrc(o){return o&&o.crc&&crc32(bodyForCrc(o))===o.crc}
const S={id:uid(),hash:'',peer:null,tool:'pen',color:'#000',w:4,hist:[],stroke:null,drawing:false,cursors:{},pc:null,rel:null,fast:null,selfOK:false,role:null};shortHash(S.id).then(h=>{S.hash=h;$('readyText').textContent='本機 HASH 末八碼：'+h+'\n兩台都到這畫面後，一起按開始同步。'});
const cvs={base:$('base'),live:$('live'),cursor:$('cursor')},ctx={base:cvs.base.getContext('2d',{alpha:false}),live:cvs.live.getContext('2d'),cursor:cvs.cursor.getContext('2d')};function size(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});ctx.base.fillStyle='#fff';ctx.base.fillRect(0,0,w,h);S.hist.forEach(s=>draw(ctx.base,s))}function draw(x,s){if(!s.points?.length)return;x.beginPath();x.strokeStyle=s.tool==='eraser'?'#fff':s.color;x.lineWidth=s.tool==='eraser'?s.w*8:s.w;x.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length-1;i++)x.quadraticCurveTo(s.points[i].x,s.points[i].y,(s.points[i].x+s.points[i+1].x)/2,(s.points[i].y+s.points[i+1].y)/2);if(s.points.length>1)x.lineTo(s.points.at(-1).x,s.points.at(-1).y);x.stroke()}function curs(){ctx.cursor.clearRect(0,0,innerWidth,innerHeight);const n=Date.now();for(const [id,c] of Object.entries(S.cursors)){if(n-c.t>3000){delete S.cursors[id];continue}ctx.cursor.beginPath();ctx.cursor.arc(c.p.x,c.p.y,6,0,7);ctx.cursor.fillStyle=c.tool==='eraser'?'#bbb':c.color;ctx.cursor.fill();ctx.cursor.strokeStyle='#fff';ctx.cursor.lineWidth=2;ctx.cursor.stroke()}requestAnimationFrame(curs)}function pnt(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function send(o){if(S.rel?.readyState==='open')S.rel.send(JSON.stringify(o))}function sendFast(o){if(S.fast?.readyState==='open'&&S.fast.bufferedAmount<2048)S.fast.send(JSON.stringify(o))}function onMsg(e){const d=JSON.parse(e.data);if(d.type==='CLEAR'){S.hist=[];size();toast('對方清空白板')}if(d.type==='STROKE'&&!S.hist.find(x=>x.id===d.stroke.id)){S.hist.push(d.stroke);draw(ctx.base,d.stroke)}if(d.type==='SYNC'){const ids=new Set(S.hist.map(x=>x.id));let ch=false;d.hist.forEach(x=>{if(!ids.has(x.id)){S.hist.push(x);ch=true}});if(ch)size()}if(d.type==='CURSOR')S.cursors[d.id]={p:d.p,t:Date.now(),tool:d.tool,color:d.color}}function bind(rel,fast){S.rel=rel;S.fast=fast;rel.onopen=()=>{viz('資料通道已開啟：ACK，開始同步白板。');send({type:'SYNC',hist:S.hist});connected()};rel.onmessage=onMsg;fast.onmessage=onMsg}function newPC(){const p=new RTCPeerConnection({iceServers:[]});S.pc=p;p.oniceconnectionstatechange=()=>{viz('WebRTC 狀態：'+p.iceConnectionState);if(['connected','completed'].includes(p.iceConnectionState))connected();if(['failed','disconnected','closed'].includes(p.iceConnectionState))disconnected()};return p}function waitIce(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();let t=setTimeout(r,1400);p.onicegatheringstatechange=()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);r()}}})}function connected(){toast('🎉 已連線');$('connect').textContent='❌ 斷開';$('connect').classList.add('on');closeModal()}function disconnected(){toast('已斷線');$('connect').textContent='🔊 聲音連線';$('connect').classList.remove('on');S.pc=S.rel=S.fast=null}async function pack(o){const s=JSON.stringify(o);try{if('CompressionStream'in window){const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'));const b=new Uint8Array(await new Response(st).arrayBuffer());let bin='';for(const x of b)bin+=String.fromCharCode(x);return'D:'+btoa(bin)}}catch(e){}return'J:'+btoa(unescape(encodeURIComponent(s)))}async function unpack(t){if(t.startsWith('D:')){const bin=atob(t.slice(2)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text())}return JSON.parse(decodeURIComponent(escape(atob(t.slice(2)))))}
let AC,stream,src,an,proc,rms=0,clip=0,rx='',rxResolve=null,rxNeed='',lastObj=null,tx=false,txLevel=0,mode='idle';const freqs=[900,1300,1700,2100],sym=.018,prefix='<<<WBA3>>>',suffix='<<<END>>>';async function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await AC.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});src=AC.createMediaStreamSource(stream);an=AC.createAnalyser();an.fftSize=2048;proc=AC.createScriptProcessor(2048,1,1);src.connect(an);src.connect(proc);proc.connect(AC.destination);proc.onaudioprocess=e=>{if(!tx)decode(e.inputBuffer.getChannelData(0))};meters()}function meters(){if(!an)return requestAnimationFrame(meters);const a=new Float32Array(an.fftSize);an.getFloatTimeDomainData(a);let sum=0,cl=0;for(const v of a){sum+=v*v;if(Math.abs(v)>.92)cl++}rms=Math.sqrt(sum/a.length);clip=cl/a.length;let q=Math.max(0,Math.min(1,(rms-.003)/.045))*(clip>.05?.5:1);setMeter('peerBar',rms/.08,clip>.05?'hot':rms<.004?'bad':'');setMeter('peerBar0',rms/.08,clip>.05?'hot':rms<.004?'bad':'');setMeter('selfBar',txLevel,tx?'':'bad');setMeter('selfBar0',txLevel,tx?'':'bad');['selfMeter','selfMeter0'].forEach(id=>$(id).classList.toggle('off',mode==='listen'));['peerMeter','peerMeter0'].forEach(id=>$(id).classList.toggle('off',mode==='speak'));requestAnimationFrame(meters)}function setMeter(id,v,c){const e=$(id);e.className='track '+(c||'');e.firstElementChild.style.width=Math.max(0,Math.min(100,v*100))+'%'}function prog(v){$('prog').style.width=Math.max(0,Math.min(100,v*100))+'%'}function goertzel(buf,f){const w=2*Math.PI*f/AC.sampleRate,co=2*Math.cos(w);let s0=0,s1=0,s2=0;for(const x of buf){s0=x+co*s1-s2;s2=s1;s1=s0}return s1*s1+s2*s2-co*s1*s2}let db=[];function decode(input){if(!rxResolve)return;for(const x of input)db.push(x);const N=Math.floor(AC.sampleRate*sym);while(db.length>=N){const c=db.splice(0,N);let ps=freqs.map(f=>goertzel(c,f)),m=0;for(let i=1;i<4;i++)if(ps[i]>ps[m])m=i;rx+=String(m);parseRx()}}function enc(txt){const b=new TextEncoder().encode(txt);let s='';for(const x of b){s+=(x>>6)&3;s+=(x>>4)&3;s+=(x>>2)&3;s+=x&3}return s}function dec(s){const out=[];for(let i=0;i+3<s.length;i+=4)out.push((+s[i]<<6)|(+s[i+1]<<4)|(+s[i+2]<<2)|(+s[i+3]));return new TextDecoder().decode(new Uint8Array(out))}function parseRx(){try{const txt=dec(rx.slice(Math.max(0,rx.length-70000))),a=txt.indexOf(prefix),b=txt.indexOf(suffix,a+prefix.length);if(a>=0&&b>a){const o=JSON.parse(txt.slice(a+prefix.length,b));if(o.from!==S.hash&&validCrc(o)&&(!rxNeed||o.t===rxNeed)){const f=rxResolve;rxResolve=null;rxNeed='';rx='';viz('我聽到你說：'+human(o)+' CRC=OK');f(o)}else if(o.from!==S.hash&&o.crc&&!validCrc(o)){viz('我聽到一段，但 CRC 錯誤，丟棄。')}}}catch(e){if(rx.length>100000)rx=rx.slice(-60000)}}function human(o){if(o.t==='CALL')return '我叫 '+o.from+'；請你說。';if(o.t==='ACK')return 'ACK '+o.k+' #'+(o.i+1)+' crc '+(o.c||'');if(o.t==='PART')return o.k+' #'+(o.i+1)+'/'+o.n+' crc '+o.pc;return o.t+' '+(o.from||'')}function tone(f,d,g=.1,t=AC.currentTime){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.004);gn.gain.setValueAtTime(g,t+d-.008);gn.gain.linearRampToValueAtTime(0,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.01);return t+d}async function chirp(g=.055){await audio();let t=AC.currentTime+.025;[523,784].forEach(f=>t=tone(f,.055,g,t+.006));return new Promise(r=>setTimeout(r,160))}async function speak(o,g=.09){await audio();o=addCrc(o);lastObj=o;const text=prefix+JSON.stringify(o)+suffix;$('manual').value=text;tx=true;mode='speak';txLevel=g/.12;viz('我說：'+human(o)+' CRC='+o.crc);await chirp();const sy=enc(text);let t=AC.currentTime+.025;for(let i=0;i<sy.length;i++){t=tone(freqs[+sy[i]],sym,g,t);if(i%70===0)prog(i/sy.length)}return new Promise(r=>setTimeout(()=>{tx=false;mode='idle';txLevel=0;prog(1);r()},(t-AC.currentTime+.035)*1000))}async function hear(type,timeout=1400){await audio();tx=false;mode='listen';rx='';db=[];rxNeed=type;viz('我閉嘴，只開麥克風；等待 '+type+'。');return new Promise((res,rej)=>{rxResolve=res;const st=Date.now(),ti=setInterval(()=>prog((Date.now()-st)/timeout),120);setTimeout(()=>{clearInterval(ti);mode='idle';if(rxResolve){rxResolve=null;rej(Error('timeout'))}},timeout)})}async function selfCheck(){try{$('selfBtn').disabled=true;$('checkStatus').textContent='自我檢查中：先量背景音，再播放短校準音。';await audio();let base=0;for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,55));base+=rms}base/=8;let mx=0,mc=0,done=false,t0=Date.now();const m=setInterval(()=>{mx=Math.max(mx,rms);mc=Math.max(mc,clip);if(Date.now()-t0>2600){clearInterval(m);done=true}},45);mode='speak';await chirp(.18);mode='listen';while(!done)await new Promise(r=>setTimeout(r,55));mode='idle';const ok=(mx>=.0025||mx-base>=.0012||mx>=base*1.28)&&mc<.10;S.selfOK=ok;if(ok){$('syncReady').disabled=false;$('selfBtn').disabled=false;$('checkStatus').textContent='✅ 自我檢查通過。\n本機 HASH 末八碼：'+S.hash+'\n背景 '+base.toFixed(4)+'，峰值 '+mx.toFixed(4)+'。';toast('可進入同步')}else{$('selfBtn').disabled=false;$('checkStatus').textContent='⚠️ 自我檢查未偵測到足夠聲音變化。\n背景 '+base.toFixed(4)+'，峰值 '+mx.toFixed(4)+'。'}}catch(e){$('selfBtn').disabled=false;$('checkStatus').textContent='無法開啟麥克風：'+e.message}}async function discover(){showStage('stageRun');$('viz').textContent='';status('短呼號互相發現。每句帶 CRC。');const slots=5,slotMs=760,seed=parseInt(S.hash.slice(-2),16),step=(parseInt(S.hash[0],16)%4)+1,end=Date.now()+45000;let round=0;while(Date.now()<end&&!S.peer){const mySlot=(seed+round*step)%slots;for(let s=0;s<slots&&!S.peer;s++){if(s===mySlot){await speak({t:'CALL',from:S.hash,at:now()},.10);viz('我閉嘴；請你說。')}else{try{const o=await hear('CALL',slotMs);if(o.from&&o.from!==S.hash){S.peer=o.from;break}}catch(e){}}await new Promise(r=>setTimeout(r,25))}round++}if(!S.peer)throw Error('沒有聽到對方 HASH');S.role=S.hash<S.peer?'offer':'answer';status('收到對方 HASH：'+S.peer+'。\n自動判定：'+(S.role==='offer'?'我先說 Offer':'我先聽 Offer，再回 Answer')+'。');return S.role}function chunks(s,n=120){let a=[];for(let i=0;i<s.length;i+=n)a.push(s.slice(i,i+n));return a}async function sendChunks(kind,text){const arr=chunks(text,120);for(let i=0;i<arr.length;i++){const pc=crc32(arr[i]);let ok=false;for(let retry=0;retry<4&&!ok;retry++){viz('我將說 '+kind+' #'+(i+1)+'/'+arr.length+'，CRC '+pc+'。');await speak({t:'PART',from:S.hash,k:kind,i,n:arr.length,b:arr[i],pc},.09);try{const ack=await hear('ACK',1600);ok=ack.k===kind&&ack.i===i&&ack.c===pc;if(ok)viz('對方 ACK '+kind+' #'+(i+1)+' CRC 一致。')}catch(e){viz('沒有 ACK，重送 '+kind+' #'+(i+1)+'。')}}if(!ok)throw Error(kind+' #'+(i+1)+' 未收到正確 ACK')}}async function recvChunks(kind){let total=null,parts=[];while(total===null||parts.filter(x=>x!==undefined).length<total){const o=await hear('PART',50000);if(o.k!==kind)continue;if(crc32(o.b)!==o.pc){viz('收到 '+kind+' #'+(o.i+1)+' 但 payload CRC 錯，要求重送。');continue}total=o.n;parts[o.i]=o.b;viz('收到 '+kind+' #'+(o.i+1)+'/'+o.n+' CRC 正確，回 ACK。');await speak({t:'ACK',from:S.hash,k:kind,i:o.i,c:o.pc},.10)}return parts.join('')}async function duetSync(){try{await audio();const role=await discover();if(role==='offer'){const p=newPC(),rel=p.createDataChannel('rel',{ordered:true}),fast=p.createDataChannel('fast',{ordered:false,maxRetransmits:0});bind(rel,fast);await p.setLocalDescription(await p.createOffer());await waitIce(p);await sendChunks('OFFER',await pack(p.localDescription));const ans=await recvChunks('ANSWER');await p.setRemoteDescription(await unpack(ans));status('已套用 Answer，等待連線。')}else{const off=await recvChunks('OFFER'),p=newPC();p.ondatachannel=e=>{if(e.channel.label==='rel')S.rel=e.channel;if(e.channel.label==='fast')S.fast=e.channel;if(S.rel&&S.fast)bind(S.rel,S.fast)};await p.setRemoteDescription(await unpack(off));await p.setLocalDescription(await p.createAnswer());await waitIce(p);await sendChunks('ANSWER',await pack(p.localDescription));status('Answer 已全部送出，等待連線。')}}catch(e
