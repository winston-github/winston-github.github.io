<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>光學 P2P 白板 - Host Visitor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f4f4;touch-action:none;user-select:none}#wrap{position:relative;width:100vw;height:100vh;background:#fff;overflow:hidden}#grid{position:absolute;inset:0;background-image:radial-gradient(#d6d6d6 1px,transparent 1px);background-size:20px 20px}.board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#base{z-index:1}#live{z-index:2}#cursor{z-index:3;pointer-events:none}#bar{position:absolute;z-index:10;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fffffff2;border:1px solid #ddd;border-radius:999px;padding:9px 12px;box-shadow:0 8px 28px #0002}button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;background:#fff;box-shadow:inset 0 0 0 1px #ddd}button.active{background:#e7f1ff;color:#06f;box-shadow:inset 0 0 0 2px #07f}button:disabled{opacity:.45}#color{width:36px;height:36px;border:0;background:transparent}.host{background:#07f;color:#fff;box-shadow:none}.join{background:#28cd41;color:#fff;box-shadow:none}.on{background:#f33!important;color:#fff!important}#toast{position:absolute;z-index:999;top:-80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;border-radius:999px;padding:12px 20px;transition:.25s;white-space:nowrap}#toast.show{top:24px}#modal{display:none;position:fixed;inset:0;z-index:100;background:#050914;color:#fff;overflow:hidden}#modal.show{display:block}#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.shade{position:absolute;inset:0;background:linear-gradient(#000b,#0004,#000b)}#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:14px;right:14px;text-align:center}.title{font-size:20px;font-weight:900;margin-bottom:8px}.hint{display:inline-block;background:#000b;border:1px solid #fff3;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:800;line-height:1.35}.stage{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:14px;right:14px;text-align:center}.stage button{margin:4px}.danger{background:#ff3b30;color:#fff;box-shadow:none}.ghost{background:#ffffff22;color:#fff;box-shadow:inset 0 0 0 1px #fff4}#frame{width:min(78vw,58vh,430px);height:min(78vw,58vh,430px);border:6px solid #fff;border-radius:26px;box-shadow:0 0 0 999px #0006,0 0 30px #fff5;display:flex;align-items:center;justify-content:center;transition:border-color .25s,box-shadow .25s;background:#ffffff10;position:relative;overflow:hidden}#frame.finding{border-color:#ffcc00;box-shadow:0 0 0 999px #0006,0 0 35px #ffcc00aa}#frame.ok{border-color:#28cd41;box-shadow:0 0 0 999px #0006,0 0 45px #28cd41cc}#codeCanvas{width:100%;height:100%;background:#fff;display:none}#scanText{position:absolute;bottom:12px;left:12px;right:12px;background:#0009;border-radius:14px;padding:9px;font-size:12px;line-height:1.35;white-space:pre-wrap}.bar{height:10px;background:#ffffff26;border-radius:999px;overflow:hidden;margin:10px auto 0;width:min(430px,78vw)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00d4ff,#28cd41)}#debug{display:none;position:absolute;left:12px;right:12px;bottom:86px;max-height:130px;overflow:auto;text-align:left;background:#0009;border:1px solid #fff2;border-radius:14px;padding:10px;font:10px ui-monospace,monospace;color:#fffb;white-space:pre-wrap}@media(max-width:560px){#bar{gap:5px;padding:8px}button{padding:9px 11px;font-size:13px}.hint{font-size:14px}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="wrap"><div id="grid"></div><canvas id="base" class="board"></canvas><canvas id="live" class="board"></canvas><canvas id="cursor" class="board"></canvas></div>
<div id="bar"><input id="color" type="color" value="#000000"><button id="pen" class="active">✏️</button><button id="eraser">🧹</button><button id="clear">🗑️</button><button id="btnHost" class="host">↑ Host</button><button id="btnJoin" class="join">↓ Visitor</button></div>
<div id="modal"><video id="video" autoplay playsinline muted></video><div class="shade"></div><div id="panel"><div class="top"><div class="title">光學 P2P 連線</div><div class="hint" id="hint">準備中</div><div class="bar"><i id="prog"></i></div></div><div id="frame"><canvas id="codeCanvas" width="420" height="420"></canvas><div id="scanText">白框中間是攝影機視野。</div></div><div id="debug"></div><div class="stage"><button class="ghost" id="retry">重試本步</button><button class="danger" id="cancel">取消</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),3000)}function log(s){$('debug').textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n';$('debug').scrollTop=$('debug').scrollHeight}function setHint(s){$('hint').textContent=s;log(s)}function prog(v){$('prog').style.width=Math.max(0,Math.min(100,v*100))+'%'}function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}
const S={id:uuid(),tool:'pen',color:'#000',w:4,hist:[],stroke:null,drawing:false,cursors:{},pc:null,rel:null,fast:null,role:null};
const cvs={base:$('base'),live:$('live'),cursor:$('cursor')},ctx={base:cvs.base.getContext('2d',{alpha:false}),live:cvs.live.getContext('2d'),cursor:cvs.cursor.getContext('2d')};function size(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});ctx.base.fillStyle='#fff';ctx.base.fillRect(0,0,w,h);S.hist.forEach(s=>draw(ctx.base,s))}function draw(x,s){if(!s.points?.length)return;x.beginPath();x.strokeStyle=s.tool==='eraser'?'#fff':s.color;x.lineWidth=s.tool==='eraser'?s.w*8:s.w;x.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length-1;i++)x.quadraticCurveTo(s.points[i].x,s.points[i].y,(s.points[i].x+s.points[i+1].x)/2,(s.points[i].y+s.points[i+1].y)/2);if(s.points.length>1)x.lineTo(s.points.at(-1).x,s.points.at(-1).y);x.stroke()}function curs(){ctx.cursor.clearRect(0,0,innerWidth,innerHeight);const n=Date.now();for(const [id,c] of Object.entries(S.cursors)){if(n-c.t>3000){delete S.cursors[id];continue}ctx.cursor.beginPath();ctx.cursor.arc(c.p.x,c.p.y,6,0,7);ctx.cursor.fillStyle=c.tool==='eraser'?'#bbb':c.color;ctx.cursor.fill();ctx.cursor.strokeStyle='#fff';ctx.cursor.lineWidth=2;ctx.cursor.stroke()}requestAnimationFrame(curs)}function pnt(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function send(o){if(S.rel?.readyState==='open')S.rel.send(JSON.stringify(o))}function sendFast(o){if(S.fast?.readyState==='open'&&S.fast.bufferedAmount<2048)S.fast.send(JSON.stringify(o))}function onMsg(e){const d=JSON.parse(e.data);if(d.type==='CLEAR'){S.hist=[];size();toast('對方清空白板')}if(d.type==='STROKE'&&!S.hist.find(x=>x.id===d.stroke.id)){S.hist.push(d.stroke);draw(ctx.base,d.stroke)}if(d.type==='SYNC'){const ids=new Set(S.hist.map(x=>x.id));let ch=false;d.hist.forEach(x=>{if(!ids.has(x.id)){S.hist.push(x);ch=true}});if(ch)size()}if(d.type==='CURSOR')S.cursors[d.id]={p:d.p,t:Date.now(),tool:d.tool,color:d.color}}function bind(rel,fast){S.rel=rel;S.fast=fast;rel.onopen=()=>{send({type:'SYNC',hist:S.hist});connected()};rel.onmessage=onMsg;fast.onmessage=onMsg}function newPC(){const p=new RTCPeerConnection({iceServers:[]});S.pc=p;p.oniceconnectionstatechange=()=>{log('ICE '+p.iceConnectionState);if(['connected','completed'].includes(p.iceConnectionState))connected();if(['failed','disconnected','closed'].includes(p.iceConnectionState))disconnected()};return p}function waitIce(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();let t=setTimeout(r,1600);p.onicegatheringstatechange=()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);r()}}})}function connected(){toast('🎉 已連線');$('btnHost').textContent='❌';$('btnJoin').textContent='❌';$('btnHost').classList.add('on');$('btnJoin').classList.add('on');closeModal()}function disconnected(){toast('已斷線');$('btnHost').textContent='↑ Host';$('btnJoin').textContent='↓ Visitor';$('btnHost').classList.remove('on');$('btnJoin').classList.remove('on');S.pc=S.rel=S.fast=null}
async function pack(o){const s=JSON.stringify(o);try{if('CompressionStream'in window){const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'));const b=new Uint8Array(await new Response(st).arrayBuffer());let bin='';for(const x of b)bin+=String.fromCharCode(x);return'D:'+btoa(bin)}}catch(e){}return'J:'+btoa(unescape(encodeURIComponent(s)))}async function unpack(t){if(t.startsWith('D:')){const bin=atob(t.slice(2)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text())}return JSON.parse(decodeURIComponent(escape(atob(t.slice(2)))))}
const CRC_TABLE=(()=>{let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();function crc32(str){let c=0^(-1);for(let i=0;i<str.length;i++)c=(c>>>8)^CRC_TABLE[(c^str.charCodeAt(i))&255];return ((c^(-1))>>>0).toString(16).toUpperCase().padStart(8,'0')}
const N=44,INNER=40,CAP=155;const code=$('codeCanvas'),cc=code.getContext('2d');function bytesToBits(bytes){let bits=[];for(const b of bytes)for(let i=7;i>=0;i--)bits.push((b>>i)&1);return bits}function bitsToBytes(bits){let out=[];for(let i=0;i+7<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];out.push(b)}return new Uint8Array(out)}function packetObj(kind,idx,total,body){const o={v:1,k:kind,i:idx,n:total,b:body};o.c=crc32(JSON.stringify(o));return o}function validPkt(o){if(!o||!o.c)return false;const c=o.c;const x={...o};delete x.c;return crc32(JSON.stringify(x))===c}function makeChunks(kind,text){let arr=[];for(let i=0;i<text.length;i+=CAP)arr.push(text.slice(i,i+CAP));return arr.map((b,i)=>packetObj(kind,i,arr.length,b))}
function drawPacket(o){$('codeCanvas').style.display='block';$('video').style.display='none';$('frame').className='ok';$('scanText').textContent='';const txt=JSON.stringify(o);const data=new TextEncoder().encode(txt);if(data.length>198)throw Error('packet too large '+data.length);const bytes=new Uint8Array(2+data.length);bytes[0]=data.length>>8;bytes[1]=data.length&255;bytes.set(data,2);const bits=bytesToBits(bytes);cc.fillStyle='#fff';cc.fillRect(0,0,420,420);const m=420/N;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let col='#fff';if((x<3&&y<3)||(x>N-4&&y<3)||(x<3&&y>N-4)||(x>N-4&&y>N-4))col=['#ff3b30','#28cd41','#007aff','#ffcc00'][(x>N/2?1:0)+(y>N/2?2:0)];else{const ix=x-2,iy=y-2;if(ix>=0&&iy>=0&&ix<INNER&&iy<INNER){const bit=bits[iy*INNER+ix]||0;col=bit?'#000':'#fff'}}cc.fillStyle=col;cc.fillRect(x*m,y*m,Math.ceil(m),Math.ceil(m))}cc.strokeStyle='#111';cc.lineWidth=2;cc.strokeRect(0,0,420,420)}
let stream=null,scanCanvas=document.createElement('canvas'),scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true});async function startCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;$('video').style.display='block';$('codeCanvas').style.display='none';await $('video').play()}function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function samplePacket(){const v=$('video'),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return null;const side=Math.floor(Math.min(vw,vh)*0.68),sx=Math.floor((vw-side)/2),sy=Math.floor((vh-side)/2);scanCanvas.width=side;scanCanvas.height=side;scanCtx.drawImage(v,sx,sy,side,side,0,0,side,side);const m=side/N,bits=[];for(let y=0;y<INNER;y++){for(let x=0;x<INNER;x++){const px=Math.floor((x+2.5)*m),py=Math.floor((y+2.5)*m);const d=scanCtx.getImageData(px,py,1,1).data;const lum=(d[0]+d[1]+d[2])/3;bits.push(lum<128?1:0)}}const lenBytes=bitsToBytes(bits.slice(0,16));const len=(lenBytes[0]<<8)|lenBytes[1];if(len<20||len>198)return null;const bytes=bitsToBytes(bits.slice(16,16+len*8));try{const txt=new TextDecoder().decode(bytes);const o=JSON.parse(txt);return validPkt(o)?o:null}catch(e){return null}}
async function scanKind(kind){await startCam();$('frame').className='';setHint('拍對方的框');$('scanText').textContent='把白框對準對方畫面。\n找到東西會變黃，CRC 正確會變綠。';let got={},total=null,last='';return new Promise((res,rej)=>{let stop=false;$('retry').onclick=()=>{stop=true;res(scanKind(kind))};const tick=()=>{if(stop)return;const o=samplePacket();if(o&&o.k===kind){$('frame').className='finding';last=kind+' '+(o.i+1)+'/'+o.n;got[o.i]=o.b;total=o.n;$('scanText').textContent='找到 '+last+'\nCRC 正確。';const count=Object.keys(got).length;prog(count/total);if(count===total){$('frame').className='ok';stop=true;setTimeout(()=>res(Array.from({length:total},(_,i)=>got[i]).join('')),350);return}}else{$('frame').className='';if(last)$('scanText').textContent='繼續拍對方的框。\n已收到 '+Object.keys(got).length+'/'+(total||'?')}requestAnimationFrame(tick)};tick()})}
async function showChunks(kind,text){stopCam();const chunks=makeChunks(kind,text);setHint('讓對方拍這個框');let i=0;return new Promise(res=>{const show=()=>{drawPacket(chunks[i]);$('scanText').textContent='顯示 '+kind+' '+(i+1)+'/'+chunks.length+'\n請對方拍這個框。';prog((i+1)/chunks.length);i=(i+1)%chunks.length;window.showTimer=setTimeout(show,520)};show();$('retry').onclick=()=>{clearTimeout(window.showTimer);show()};res.stop=()=>clearTimeout(window.showTimer)})}
function openModal(){if(S.pc&&['connected','completed'].includes(S.pc.iceConnectionState)){if(confirm('確定斷開？'))S.pc.close();return}$('modal').classList.add('show');$('debug').textContent='';prog(0)}function closeModal(){clearTimeout(window.showTimer);stopCam();$('modal').classList.remove('show')}async function runHost(){S.role='host';openModal();try{setHint('讓對方拍這個框');const p=newPC(),rel=p.createDataChannel('rel',{ordered:true}),fast=p.createDataChannel('fast',{ordered:false,maxRetransmits:0});bind(rel,fast);await p.setLocalDescription(await p.createOffer());await waitIce(p);await showChunks('OFFER',await pack(p.localDescription));setTimeout(async()=>{setHint('拍對方的框');const ans=await scanKind('ANSWER');await p.setRemoteDescription(await unpack(ans));setHint('等待連線完成')},800)}catch(e){setHint('失敗：'+e.message)}}async function runJoin(){S.role='join';openModal();try{setHint('拍對方的框');const offer=await scanKind('OFFER');const p=newPC();p.ondatachannel=e=>{if(e.channel.label==='rel')S.rel=e.channel;if(e.channel.label==='fast')S.fast=e.channel;if(S.rel&&S.fast)bind(S.rel,S.fast)};await p.setRemoteDescription(await unpack(offer));await p.setLocalDescription(await p.createAnswer());await waitIce(p);setHint('讓對方拍這個框');await showChunks('ANSWER',await pack(p.localDescription))}catch(e){setHint('失敗：'+e.message)}}
$('btnHost').onclick=runHost;$('btnJoin').onclick=runJoin;$('cancel').onclick=closeModal;$('retry').onclick=()=>location.reload();$('wrap').addEventListener('pointerdown',e=>{if(!e.isPrimary)return;S.drawing=true;const p=pnt(e);S.stroke={id:uuid(),tool:S.tool,color:S.color,w:S.w,points:[p]};sendFast({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color})});addEventListener('pointermove',e=>{const p=pnt(e);if(S.drawing&&S.stroke&&e.isPrimary){const pts=S.stroke.points,l=pts.at(-1);if(Math.hypot(p.x-l.x,p.y-l.y)>2){pts.push(p);ctx.live.clearRect(0,0,innerWidth,innerHeight);draw(ctx.live,S.stroke)}}sendFast({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color})});function up(e){if(!S.drawing||!e.isPrimary)return;S.drawing=false;if(S.stroke?.points.length){S.hist.push(S.stroke);draw(ctx.base,S.stroke);ctx.live.clearRect(0,0,innerWidth,innerHeight);send({type:'STROKE',stroke:S.stroke})}S.stroke=null}addEventListener('pointerup',up);addEventListener('pointercancel',up);$('color').oninput=e=>{S.color=e.target.value;S.tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('pen').onclick=()=>{S.tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('eraser').onclick=()=>{S.tool='eraser';$('eraser').classList.add('active');$('pen').classList.remove('active')};$('clear').onclick=()=>{if(confirm('清空白板？')){S.hist=[];size();send({type:'CLEAR'})}};addEventListener('resize',size);size();curs();
</script>
<!-- 系統防禦與存取計數模組 (完全靜默 / 防拷貝 / 防衝突) -->
<script>
(function(){
    // 1. 嚴格網域白名單檢查 (防止原始碼被盜用執行)
    if (window.location.hostname !== 'winston-github.github.io') return;
    
    // 2. 自動精準萃取檔名作為 ID (支援任意路徑與任意副檔名)
    var file = window.location.pathname.split('/').pop();
    var pageId = file ? file.split('.')[0] : 'index';
    if (!pageId) return;

    // 3. 靜默發送破快取請求 (移除所有 Console 輸出，確保無痕)
    var url = 'https://api.counterapi.dev/v1/winston-github-io/page-' + pageId + '/up?_=' + new Date().getTime();
    fetch(url).catch(function(){});
})();
</script>
</body>
