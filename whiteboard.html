<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>共用白板</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root {
  --ink: #1a1a2e;
  --paper: #fafaf7;
  --accent: #e84855;
  --accent2: #3a86ff;
  --muted: #9a9a8a;
  --panel-bg: rgba(250,250,247,0.96);
  --shadow: 0 8px 40px rgba(26,26,46,0.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;touch-action:none;user-select:none}

/* Canvas stack */
#wrap{position:absolute;inset:0}
#grid{position:absolute;inset:0;background-image:radial-gradient(circle,#d8d8cc 1px,transparent 1px);background-size:24px 24px;opacity:.7}
.board{position:absolute;inset:0;width:100%;height:100%}
#base{z-index:1}#live{z-index:2}#cur{z-index:3;pointer-events:none}

/* Toolbar */
#tb{
  position:fixed;z-index:20;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:var(--panel-bg);border:1px solid rgba(26,26,46,.1);
  border-radius:999px;padding:8px 10px;
  box-shadow:var(--shadow);backdrop-filter:blur(12px);
}
.tbtn{
  border:none;background:transparent;border-radius:999px;
  width:40px;height:40px;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.tbtn:hover{background:rgba(26,26,46,.07)}
.tbtn:active{transform:scale(.9)}
.tbtn.active-pen{background:#1a1a2e;color:white}
.tbtn.active-eraser{background:#3a86ff;color:white}
#colorpick{width:40px;height:40px;border:none;background:transparent;cursor:pointer;border-radius:999px;padding:4px}
.divider{width:1px;height:28px;background:rgba(26,26,46,.12);margin:0 2px}
#connbtn{
  border:none;border-radius:999px;padding:8px 18px;
  font-size:13px;font-weight:700;cursor:pointer;
  background:var(--ink);color:var(--paper);
  transition:opacity .2s,background .2s;white-space:nowrap;
}
#connbtn:hover{opacity:.85}
#connbtn.connected{background:#2ecc71}

/* Status pill */
#statuspill{
  position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);
  background:var(--panel-bg);border:1px solid rgba(26,26,46,.1);
  border-radius:999px;padding:7px 16px;
  box-shadow:var(--shadow);backdrop-filter:blur(12px);
  font-size:13px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
#dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .4s,box-shadow .4s;flex-shrink:0}
#dot.live{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25);animation:pulse 2s infinite}
#dot.waiting{background:#f39c12;box-shadow:0 0 0 3px rgba(243,156,18,.2)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(46,204,113,.25)}50%{box-shadow:0 0 0 7px rgba(46,204,113,.08)}}

/* Modal */
#modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(26,26,46,.5);backdrop-filter:blur(8px);
  padding:20px;
}
#modal.show{display:flex}
#card{
  background:var(--paper);border-radius:24px;
  padding:32px 28px 28px;width:100%;max-width:400px;
  box-shadow:0 24px 80px rgba(26,26,46,.25);
  position:relative;
}
#card h2{margin:0 0 6px;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
#card p.sub{margin:0 0 22px;font-size:14px;color:var(--muted);line-height:1.5}

/* Tabs */
#tabs{display:flex;gap:6px;margin-bottom:22px}
.tab{
  flex:1;border:none;border-radius:999px;padding:10px;
  font-size:14px;font-weight:700;cursor:pointer;
  background:rgba(26,26,46,.06);color:var(--muted);
  transition:all .2s;
}
.tab.active{background:var(--ink);color:var(--paper)}

/* Panels */
.panel{display:none}
.panel.show{display:block}

/* Host */
.room-display{
  background:var(--ink);border-radius:14px;padding:22px;
  text-align:center;margin-bottom:14px;
}
.room-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:10px}
.room-code{
  font-size:52px;font-weight:900;color:white;
  letter-spacing:.2em;font-variant-numeric:tabular-nums;line-height:1;
}
.room-sub{font-size:12px;color:rgba(255,255,255,.35);margin-top:10px}
.waiting-row{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--muted);padding:10px 0;
}
.spin{width:16px;height:16px;border:2px solid rgba(26,26,46,.1);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Join */
.input-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
#roomInput{
  width:100%;border:2px solid rgba(26,26,46,.12);border-radius:12px;
  padding:16px;font-size:36px;font-weight:900;letter-spacing:.2em;
  text-align:center;text-transform:uppercase;color:var(--ink);
  background:transparent;outline:none;transition:border-color .2s;
  font-variant-numeric:tabular-nums;
}
#roomInput:focus{border-color:var(--accent2)}
#joinBtn{
  width:100%;border:none;border-radius:12px;padding:15px;
  font-size:15px;font-weight:800;cursor:pointer;
  background:var(--accent2);color:white;
  margin-top:12px;transition:opacity .2s,transform .1s;
}
#joinBtn:hover{opacity:.9}
#joinBtn:active{transform:scale(.98)}
#joinBtn:disabled{opacity:.35;cursor:default}

#modalStatus{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;min-height:18px}
#modalStatus.err{color:var(--accent)}
#modalStatus.ok{color:#2ecc71}

#closeBtn{
  position:absolute;top:16px;right:16px;
  border:none;background:rgba(26,26,46,.07);border-radius:999px;
  width:32px;height:32px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .15s;
}
#closeBtn:hover{background:rgba(26,26,46,.14)}

.connected-card{
  background:rgba(46,204,113,.08);border:1.5px solid rgba(46,204,113,.25);
  border-radius:14px;padding:20px;text-align:center;
}
.connected-card strong{display:block;font-size:18px;font-weight:800;color:#27ae60;margin-bottom:6px}
.connected-card span{font-size:13px;color:var(--muted)}

/* Toast */
#toast{
  position:fixed;z-index:200;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--paper);
  border-radius:999px;padding:10px 22px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .room-code{font-size:38px}
  #roomInput{font-size:28px}
  #card{padding:24px 18px 20px}
  #tb{gap:4px;padding:7px 8px}
  .tbtn{width:36px;height:36px;font-size:16px}
  #connbtn{padding:7px 14px;font-size:12px}
}
</style>
</head>
<body>

<div id="wrap">
  <div id="grid"></div>
  <canvas id="base" class="board"></canvas>
  <canvas id="live" class="board"></canvas>
  <canvas id="cur" class="board"></canvas>
</div>

<div id="statuspill">
  <div id="dot"></div>
  <span id="statustext">未連線</span>
</div>

<div id="tb">
  <input id="colorpick" type="color" value="#1a1a2e" title="顏色">
  <div class="divider"></div>
  <button class="tbtn active-pen" id="penBtn" title="畫筆">✏️</button>
  <button class="tbtn" id="eraserBtn" title="橡皮擦">🧹</button>
  <button class="tbtn" id="clearBtn" title="清空">🗑️</button>
  <div class="divider"></div>
  <button id="connbtn">🔗 連線</button>
</div>

<div id="modal">
  <div id="card">
    <button id="closeBtn" aria-label="關閉">✕</button>
    <h2>建立連線</h2>
    <p class="sub">同一個 WiFi 下，Host 產生房間碼，Visitor 輸入後即可共用白板。</p>
    <div id="tabs">
      <button class="tab active" id="tabHost">🖥 我是 Host</button>
      <button class="tab" id="tabJoin">📱 我是 Visitor</button>
    </div>
    <div id="host-panel" class="panel show">
      <div class="room-display">
        <div class="room-label">房間碼</div>
        <div class="room-code" id="roomCode">……</div>
        <div class="room-sub" id="roomSub">正在初始化…</div>
      </div>
      <div class="waiting-row" id="waitingRow">
        <div class="spin"></div>
        <span>等待 Visitor 輸入房間碼…</span>
      </div>
    </div>
    <div id="join-panel" class="panel">
      <div class="input-label">輸入 Host 的房間碼</div>
      <input id="roomInput" maxlength="6" placeholder="123456" autocomplete="off" inputmode="numeric">
      <button id="joinBtn" disabled>加入白板</button>
    </div>
    <div id="modalStatus"></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);

// Toast
let _tt;
const toast=msg=>{$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>$('toast').classList.remove('show'),3200)};

// Status pill
function setStatus(txt,state){
  $('statustext').textContent=txt;
  $('dot').className=state==='live'?'live':state==='waiting'?'waiting':'';
}

// Modal status
function setModalStatus(txt,cls){
  $('modalStatus').textContent=txt;
  $('modalStatus').className=cls||'';
}

// ── Canvas ─────────────────────────────────────────────────────────────────
const cvs={base:$('base'),live:$('live'),cur:$('cur')};
const ctx={
  base:cvs.base.getContext('2d',{alpha:false}),
  live:cvs.live.getContext('2d'),
  cur:cvs.cur.getContext('2d')
};

const S={
  id:crypto.randomUUID(),
  tool:'pen',color:'#1a1a2e',w:4,
  hist:[],stroke:null,drawing:false,cursors:{},
  peer:null,conn:null,_cursorThrottle:false
};

function resize(){
  const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;
  Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});
  Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});
  ctx.base.fillStyle='#fafaf7';ctx.base.fillRect(0,0,w,h);
  S.hist.forEach(s=>drawStroke(ctx.base,s));
}

function drawStroke(x,s){
  if(!s.pts?.length)return;
  x.beginPath();
  x.strokeStyle=s.tool==='eraser'?'#fafaf7':s.color;
  x.lineWidth=s.tool==='eraser'?s.w*7:s.w;
  x.moveTo(s.pts[0].x,s.pts[0].y);
  for(let i=1;i<s.pts.length-1;i++){
    x.quadraticCurveTo(s.pts[i].x,s.pts[i].y,(s.pts[i].x+s.pts[i+1].x)/2,(s.pts[i].y+s.pts[i+1].y)/2);
  }
  if(s.pts.length>1)x.lineTo(s.pts.at(-1).x,s.pts.at(-1).y);
  x.stroke();
}

function renderCursors(){
  ctx.cur.clearRect(0,0,innerWidth,innerHeight);
  const now=Date.now();
  for(const[id,c]of Object.entries(S.cursors)){
    if(now-c.t>4000){delete S.cursors[id];continue}
    ctx.cur.beginPath();
    ctx.cur.arc(c.p.x,c.p.y,6,0,Math.PI*2);
    ctx.cur.fillStyle=c.tool==='eraser'?'#bbb':c.color;
    ctx.cur.fill();
    ctx.cur.strokeStyle='white';ctx.cur.lineWidth=2;ctx.cur.stroke();
  }
  requestAnimationFrame(renderCursors);
}

function ptFrom(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

// ── Messaging ──────────────────────────────────────────────────────────────
function send(o){if(S.conn?.open)S.conn.send(o)}

function handleData(d){
  if(d.type==='STROKE'){
    if(!S.hist.find(x=>x.id===d.s.id)){S.hist.push(d.s);drawStroke(ctx.base,d.s)}
  }else if(d.type==='CURSOR'){
    S.cursors[d.id]={p:d.p,t:Date.now(),tool:d.tool,color:d.color};
  }else if(d.type==='CLEAR'){
    S.hist=[];resize();toast('對方清空了白板');
  }else if(d.type==='SYNC'){
    const ids=new Set(S.hist.map(x=>x.id));let ch=false;
    d.hist.forEach(s=>{if(!ids.has(s.id)){S.hist.push(s);ch=true}});
    if(ch)resize();
  }
}

function onConnected(){
  setStatus('已連線 ✓','live');
  $('connbtn').textContent='● 已連線';
  $('connbtn').classList.add('connected');
  toast('🎉 連線成功！可以開始共用白板了');
  closeModal();
  // Sync history to the other side
  send({type:'SYNC',hist:S.hist});
}

function onDisconnected(){
  S.conn=null;
  setStatus('連線已斷開','idle');
  $('connbtn').textContent='🔗 連線';
  $('connbtn').classList.remove('connected');
  toast('連線已斷開');
}

function setupConn(conn){
  S.conn=conn;
  conn.on('open',onConnected);
  conn.on('data',handleData);
  conn.on('close',onDisconnected);
  conn.on('error',err=>{toast('連線錯誤: '+(err.message||err));setStatus('錯誤','idle')});
}

// ── PeerJS ─────────────────────────────────────────────────────────────────
function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
function codeToId(c){return'wb-'+c}
function idToCode(id){return id.replace(/^wb-/,'')}

let _peer=null;

function destroyPeer(){
  if(_peer&&!_peer.destroyed){_peer.destroy()}
  _peer=null;S.peer=null;
}

function initHost(code){
  destroyPeer();
  const peer=new Peer(codeToId(code),{debug:0});
  _peer=peer;S.peer=peer;

  peer.on('open',id=>{
    const c=idToCode(id);
    $('roomCode').textContent=c;
    $('roomSub').textContent='把這個碼告訴 Visitor';
    setModalStatus('');
    setStatus('等待 Visitor 加入…','waiting');
  });

  peer.on('connection',conn=>{
    $('waitingRow').innerHTML='<span style="font-size:14px;font-weight:700;color:#27ae60">✓ Visitor 已加入！</span>';
    setupConn(conn);
  });

  peer.on('error',err=>{
    if(err.type==='unavailable-id'){
      // Room code collision — retry
      destroyPeer();
      setTimeout(()=>initHost(makeCode()),400);
    }else{
      setModalStatus('伺服器錯誤: '+(err.message||err.type),'err');
      setStatus('錯誤','idle');
    }
  });
}

function joinRoom(code){
  destroyPeer();
  const peer=new Peer(undefined,{debug:0});
  _peer=peer;S.peer=peer;

  $('joinBtn').disabled=true;
  $('joinBtn').textContent='連線中…';
  setModalStatus('正在連線，請稍候…');

  let timedOut=false;
  const timeout=setTimeout(()=>{
    timedOut=true;
    setModalStatus('連線逾時。請確認：房間碼正確、Host 頁面仍開著。','err');
    $('joinBtn').disabled=false;$('joinBtn').textContent='加入白板';
  },10000);

  peer.on('open',()=>{
    const conn=peer.connect(codeToId(code),{reliable:true,serialization:'json'});
    setupConn(conn);
    conn.on('open',()=>{clearTimeout(timeout)});
    conn.on('error',err=>{
      clearTimeout(timeout);
      if(!timedOut){
        setModalStatus('無法連線：'+(err.message||err)+'。請確認房間碼正確。','err');
        $('joinBtn').disabled=false;$('joinBtn').textContent='加入白板';
      }
    });
  });

  peer.on('error',err=>{
    clearTimeout(timeout);
    setModalStatus('錯誤: '+(err.message||err.type),'err');
    $('joinBtn').disabled=false;$('joinBtn').textContent='加入白板';
  });
}

// ── Modal ──────────────────────────────────────────────────────────────────
let _tab='host';

function switchTab(t){
  _tab=t;
  $('tabHost').className='tab'+(_tab==='host'?' active':'');
  $('tabJoin').className='tab'+(_tab==='join'?' active':'');
  $('host-panel').className='panel'+(_tab==='host'?' show':'');
  $('join-panel').className='panel'+(_tab==='join'?' show':'');
  setModalStatus('');
}

function openModal(){
  // If already connected, show connected state
  if(S.conn?.open){
    $('host-panel').innerHTML='<div class="connected-card"><strong>✓ 已連線中</strong><span>白板正在同步，點右上角 ✕ 回到白板</span></div>';
    $('join-panel').innerHTML='<div class="connected-card"><strong>✓ 已連線中</strong><span>白板正在同步，點右上角 ✕ 回到白板</span></div>';
    $('modal').classList.add('show');
    return;
  }
  $('modal').classList.add('show');
  // Auto-start hosting if not already running
  if(!_peer||_peer.destroyed){
    $('roomCode').textContent='……';
    $('roomSub').textContent='正在初始化…';
    $('waitingRow').innerHTML='<div class="spin"></div><span>等待 Visitor 輸入房間碼…</span>';
    initHost(makeCode());
  }
}

function closeModal(){$('modal').classList.remove('show')}

$('connbtn').onclick=openModal;
$('closeBtn').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('tabHost').onclick=()=>switchTab('host');
$('tabJoin').onclick=()=>switchTab('join');

$('roomInput').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
  $('joinBtn').disabled=e.target.value.length!==6;
  setModalStatus('');
});
$('roomInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!$('joinBtn').disabled)joinRoom($('roomInput').value);
});
$('joinBtn').onclick=()=>{
  const c=$('roomInput').value.trim();
  if(c.length===6)joinRoom(c);
};

// ── Drawing ────────────────────────────────────────────────────────────────
$('wrap').addEventListener('pointerdown',e=>{
  if(!e.isPrimary)return;
  S.drawing=true;
  const p=ptFrom(e);
  S.stroke={id:crypto.randomUUID(),tool:S.tool,color:S.color,w:S.w,pts:[p]};
  send({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color});
});

addEventListener('pointermove',e=>{
  const p=ptFrom(e);
  if(S.drawing&&S.stroke&&e.isPrimary){
    const l=S.stroke.pts.at(-1);
    if(Math.hypot(p.x-l.x,p.y-l.y)>2){
      S.stroke.pts.push(p);
      ctx.live.clearRect(0,0,innerWidth,innerHeight);
      drawStroke(ctx.live,S.stroke);
    }
  }
  if(!S._cursorThrottle){
    S._cursorThrottle=true;
    setTimeout(()=>S._cursorThrottle=false,50);
    send({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color});
  }
});

function pointerUp(e){
  if(!S.drawing||!e.isPrimary)return;
  S.drawing=false;
  if(S.stroke?.pts.length){
    S.hist.push(S.stroke);
    drawStroke(ctx.base,S.stroke);
    ctx.live.clearRect(0,0,innerWidth,innerHeight);
    send({type:'STROKE',s:S.stroke});
  }
  S.stroke=null;
}
addEventListener('pointerup',pointerUp);
addEventListener('pointercancel',pointerUp);

// ── Toolbar ────────────────────────────────────────────────────────────────
$('colorpick').oninput=e=>{
  S.color=e.target.value;S.tool='pen';
  $('penBtn').className='tbtn active-pen';$('eraserBtn').className='tbtn';
};
$('penBtn').onclick=()=>{S.tool='pen';$('penBtn').className='tbtn active-pen';$('eraserBtn').className='tbtn'};
$('eraserBtn').onclick=()=>{S.tool='eraser';$('eraserBtn').className='tbtn active-eraser';$('penBtn').className='tbtn'};
$('clearBtn').onclick=()=>{
  if(confirm('確定清空白板？所有人的內容都會消失。')){
    S.hist=[];resize();send({type:'CLEAR'});
  }
};

// ── Boot ───────────────────────────────────────────────────────────────────
addEventListener('resize',resize);
resize();
renderCursors();
setStatus('未連線','idle');
setTimeout(openModal,300);
</script>
<!-- 系統防禦與存取計數模組 (完全靜默 / 防拷貝 / 防衝突) -->
<script>
(function(){
    // 1. 嚴格網域白名單檢查 (防止原始碼被盜用執行)
    if (window.location.hostname !== 'winston-github.github.io') return;
    
    // 2. 自動精準萃取檔名作為 ID (支援任意路徑與任意副檔名)
    var file = window.location.pathname.split('/').pop();
    var pageId = file ? file.split('.')[0] : 'index';
    if (!pageId) return;

    // 3. 靜默發送破快取請求 (移除所有 Console 輸出，確保無痕)
