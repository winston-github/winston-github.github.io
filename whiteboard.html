<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>無伺服器 P2P 光學白板</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f0f0f0;
    touch-action: none;
    user-select: none;
}

/* 畫布 */
#canvas-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#bg-grid {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(#d0d0d0 1px, transparent 1px);
    background-size: 20px 20px;
}

/* 只套用白板 canvas，不要汙染 QRCode.js 產生的 canvas */
#baseCanvas,
#activeCanvas,
#cursorCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#baseCanvas { z-index: 1; }
#activeCanvas { z-index: 2; }
#cursorCanvas { z-index: 3; pointer-events: none; }

/* 工具列 */
#toolbar {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 10px 15px;
    border-radius: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    display: flex;
    gap: 10px;
    z-index: 10;
    align-items: center;
    border: 1px solid #e0e0e0;
}

button {
    background: #fff;
    border: 2px solid transparent;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: #444;
}

button:hover { background: #f5f5f5; }

button.active {
    background: #e3f2fd;
    color: #007AFF;
}

#tool-color {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
    background: none;
}

#tool-color::-webkit-color-swatch-wrapper { padding: 0; }

#tool-color::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
}

#btn-connect {
    background: #007AFF;
    color: white;
    border-radius: 20px;
    padding: 10px 25px;
    box-shadow: 0 4px 15px rgba(0,122,255,0.3);
}

#btn-connect.connected {
    background: #ff3b30;
    box-shadow: none;
}

/* Toast */
#toast {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.82);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    z-index: 1000;
    transition: top 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
    font-size: 14px;
}

#toast.show { top: 30px; }

/* 連線 Modal */
#camera-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}

#camera-modal.show {
    opacity: 1;
    pointer-events: auto;
}

#cam-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* 角色選擇 */
#role-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: linear-gradient(160deg, #0a0a1a 0%, #12122a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 24px;
}

#role-screen h2 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
}

#role-screen p {
    color: rgba(255,255,255,0.62);
    font-size: 14px;
    text-align: center;
    max-width: 300px;
    line-height: 1.6;
}

.role-btn {
    width: 100%;
    max-width: 320px;
    padding: 20px 24px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.15s;
}

.role-btn:active { transform: scale(0.97); }

#btn-role-host {
    background: linear-gradient(135deg, #007AFF, #0055CC);
    color: white;
    box-shadow: 0 8px 28px rgba(0,122,255,0.45);
}

#btn-role-join {
    background: linear-gradient(135deg, #28cd41, #1a8f2e);
    color: white;
    box-shadow: 0 8px 28px rgba(40,205,65,0.45);
}

.role-icon {
    font-size: 32px;
    flex-shrink: 0;
}

.role-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.role-title { font-size: 17px; }

.role-desc {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.82;
}

#btn-cancel-role {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
    padding: 12px 32px;
}

/* 步驟畫面 */
#step-screen {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    flex-direction: column;
    align-items: center;
    padding-top: max(50px, env(safe-area-inset-top, 20px));
    overflow-y: auto;
}

.step-indicator {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}

.step-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: all 0.3s;
}

.step-dot.active {
    background: #fff;
    transform: scale(1.4);
}

.step-dot.done {
    background: #28cd41;
}

#step-hint {
    color: white;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(10px);
    padding: 12px 22px;
    border-radius: 24px;
    max-width: 88vw;
    margin-bottom: 18px;
}

/* spinner */
#processing-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

#processing-area.vis { display: flex; }

.spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #007AFF;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.proc-lbl {
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    text-align: center;
    max-width: 280px;
}

/* QR 展示 */
#qr-display-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

#qr-display-area.vis { display: flex; }

#qr-box {
    position: relative;
    background: white;
    width: min(420px, 86vw, 60vh);
    height: min(420px, 86vw, 60vh);
    padding: 14px;
    border-radius: 20px;
    border: 4px solid #007AFF;
    box-shadow: 0 0 0 8px rgba(0,122,255,0.18), 0 12px 40px rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* 這段是重點：強制還原 QRCode.js 產生的 canvas/img */
#qr-box canvas,
#qr-box img {
    position: static !important;
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
    object-fit: contain !important;
}

.qr-cap {
    color: rgba(255,255,255,0.78);
    font-size: 13px;
    text-align: center;
    max-width: 82vw;
    line-height: 1.5;
}

/* 掃描框 */
#scan-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

#scan-area.vis { display: flex; }

.sfwrap {
    position: relative;
    width: min(280px, 76vw, 42vh);
    height: min(280px, 76vw, 42vh);
}

.sfbox {
    width: 100%;
    height: 100%;
    position: relative;
}

.sfbox::before,
.sfbox::after,
.sfi::before,
.sfi::after {
    content: '';
    position: absolute;
    width: 36px;
    height: 36px;
    border-color: #fff;
    border-style: solid;
    transition: border-color 0.4s;
}

.sfbox::before {
    top: 0;
    left: 0;
    border-width: 4px 0 0 4px;
    border-radius: 6px 0 0 0;
}

.sfbox::after {
    top: 0;
    right: 0;
    border-width: 4px 4px 0 0;
    border-radius: 0 6px 0 0;
}

.sfi {
    width: 100%;
    height: 100%;
    position: relative;
}

.sfi::before {
    bottom: 0;
    left: 0;
    border-width: 0 0 4px 4px;
    border-radius: 0 0 0 6px;
}

.sfi::after {
    bottom: 0;
    right: 0;
    border-width: 0 4px 4px 0;
    border-radius: 0 0 6px 0;
}

.scan-line {
    position: absolute;
    left: 6px;
    right: 6px;
    height: 3px;
    background: linear-gradient(to right, transparent, #00d4ff, transparent);
    animation: scanAnim 2s linear infinite;
    box-shadow: 0 0 12px #00d4ff;
}

@keyframes scanAnim {
    0% { top: 6px; }
    50% { top: calc(100% - 9px); }
    100% { top: 6px; }
}

.scan-lbl {
    color: rgba(255,255,255,0.78);
    font-size: 12px;
    text-align: center;
    max-width: 82vw;
}

.sfwrap.ok .sfbox::before,
.sfwrap.ok .sfbox::after,
.sfwrap.ok .sfi::before,
.sfwrap.ok .sfi::after {
    border-color: #28cd41;
}

/* 下一步按鈕 */
#btn-next-step {
    display: none;
    margin-top: 18px;
    background: #28cd41;
    color: white;
    border: none;
    padding: 16px 44px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 6px 22px rgba(40,205,65,0.5);
    animation: pulseBtn 1.2s ease infinite;
}

#btn-next-step.vis { display: block; }

@keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* 除錯 */
#debug-panel {
    display: none;
    margin: 12px 16px;
    padding: 14px 16px;
    background: rgba(255,30,30,0.12);
    border: 1px solid rgba(255,80,80,0.45);
    border-radius: 14px;
    max-width: 88vw;
    width: 88vw;
    backdrop-filter: blur(6px);
}

#debug-panel.vis { display: block; }

#debug-title {
    color: #ff7070;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}

#debug-body {
    color: rgba(255,210,210,0.95);
    font-size: 10px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 130px;
    overflow-y: auto;
    line-height: 1.4;
}

#btn-retry {
    margin-top: 10px;
    background: rgba(255,100,100,0.25);
    color: #ffaaaa;
    border: 1px solid rgba(255,100,100,0.4);
    padding: 8px 20px;
    font-size: 13px;
    border-radius: 16px;
}

/* 底部控制 */
.cam-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 5;
    padding: 14px 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    display: flex;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 60%, transparent);
}

.ccbtn {
    background: rgba(255,255,255,0.15);
    color: white;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 12px 22px;
    font-size: 14px;
    border-radius: 22px;
}

#btn-close-cam {
    background: rgba(255,59,48,0.75);
    border-color: rgba(255,59,48,0.5);
}

/* 手動 fallback */
#fallback-ui {
    display: none;
    margin-top: 10px;
    width: 88vw;
    max-width: 360px;
}

#fallback-ui textarea {
    width: 100%;
    height: 54px;
    font-size: 11px;
    margin-bottom: 6px;
    border-radius: 8px;
    padding: 6px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
}

#btn-fallback {
    width: 100%;
    background: #28cd41;
    color: white;
    padding: 10px;
    border-radius: 12px;
    font-size: 14px;
}
</style>
</head>

<body>
<div id="toast">系統訊息</div>

<div id="canvas-container">
    <div id="bg-grid"></div>
    <canvas id="baseCanvas"></canvas>
    <canvas id="activeCanvas"></canvas>
    <canvas id="cursorCanvas"></canvas>
</div>

<div id="toolbar">
    <input type="color" id="tool-color" value="#000000">
    <button id="tool-pen" class="active">✏️</button>
    <button id="tool-eraser">🧹</button>
    <div style="width:1px;height:24px;background:#ddd;margin:0 5px;"></div>
    <button id="tool-clear">🗑️</button>
    <button id="btn-connect">📷 鏡頭連線</button>
</div>

<div id="camera-modal">
    <video id="cam-video" autoplay playsinline muted></video>

    <div id="role-screen">
        <h2>📡 光學 P2P 連線</h2>
        <p>選擇角色後，兩台裝置用<strong>後鏡頭</strong>輪流掃描對方螢幕，三步驟完成連線。</p>

        <button class="role-btn" id="btn-role-host">
            <span class="role-icon">🖥️</span>
            <span class="role-text">
                <span class="role-title">我是主機（Host）</span>
                <span class="role-desc">先產生 QR，讓加入者掃</span>
            </span>
        </button>

        <button class="role-btn" id="btn-role-join">
            <span class="role-icon">📱</span>
            <span class="role-text">
                <span class="role-title">我要加入（Join）</span>
                <span class="role-desc">先掃主機的 QR Code</span>
            </span>
        </button>

        <button class="ccbtn" id="btn-cancel-role">取消</button>
    </div>

    <div id="step-screen">
        <div class="step-indicator">
            <div class="step-dot" id="dot-1"></div>
            <div class="step-dot" id="dot-2"></div>
            <div class="step-dot" id="dot-3"></div>
        </div>

        <div id="step-hint">準備中...</div>

        <div id="processing-area">
            <div class="spinner"></div>
            <div class="proc-lbl" id="proc-lbl">處理中...</div>
        </div>

        <div id="qr-display-area">
            <div id="qr-box"></div>
            <div class="qr-cap" id="qr-cap">📲 讓對方用後鏡頭掃我的螢幕</div>
        </div>

        <div id="scan-area">
            <div class="sfwrap" id="sfwrap">
                <div class="sfbox">
                    <div class="sfi">
                        <div class="scan-line"></div>
                    </div>
                </div>
            </div>
            <div class="scan-lbl" id="scan-lbl">後鏡頭對準對方螢幕的 QR Code</div>
        </div>

        <button id="btn-next-step">✅ 確認，進入下一步 →</button>

        <div id="debug-panel">
            <div id="debug-title">⚠️ 發生錯誤</div>
            <div id="debug-body"></div>
            <button id="btn-retry" class="ccbtn">🔄 重試此步驟</button>
        </div>

        <div id="fallback-ui">
            <textarea id="fallback-out" readonly placeholder="我的代碼（可複製或截圖給對方）"></textarea>
            <textarea id="fallback-in" placeholder="貼上對方代碼，再按手動連線"></textarea>
            <button id="btn-fallback">手動連線</button>
        </div>
    </div>

    <div class="cam-controls">
        <button class="ccbtn" id="btn-close-cam">❌ 取消連線</button>
    </div>
</div>

<script>
const AppState = {
    userId: genUUID(),
    tool: 'pen',
    color: '#000000',
    lineWidth: 4,
    isDrawing: false,
    currentStroke: null,
    history: [],
    remoteCursors: {},
    width: window.innerWidth,
    height: window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    webrtc: {
        pc: null,
        reliable: null,
        fast: null
    }
};

function genUUID() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
    );
}

let _toastTmr;

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(_toastTmr);
    _toastTmr = setTimeout(() => t.classList.remove('show'), 3500);
}

/* 白板 */
const CVS = {
    base: document.getElementById('baseCanvas'),
    active: document.getElementById('activeCanvas'),
    cursor: document.getElementById('cursorCanvas')
};

const CTX = {
    base: CVS.base.getContext('2d', { alpha: false }),
    active: CVS.active.getContext('2d'),
    cursor: CVS.cursor.getContext('2d')
};

function initCanvases() {
    AppState.width = window.innerWidth;
    AppState.height = window.innerHeight;
    AppState.dpr = window.devicePixelRatio || 1;

    Object.values(CVS).forEach(c => {
        c.style.width = AppState.width + 'px';
        c.style.height = AppState.height + 'px';
        c.width = Math.floor(AppState.width * AppState.dpr);
        c.height = Math.floor(AppState.height * AppState.dpr);
    });

    Object.values(CTX).forEach(ctx => {
        ctx.setTransform(AppState.dpr, 0, 0, AppState.dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    });

    CTX.base.fillStyle = '#fff';
    CTX.base.fillRect(0, 0, AppState.width, AppState.height);

    AppState.history.forEach(s => renderStroke(CTX.base, s));
}

function renderStroke(ctx, s) {
    if (!s.points || !s.points.length) return;

    ctx.beginPath();
    ctx.strokeStyle = s.tool === 'eraser' ? '#fff' : s.color;
    ctx.lineWidth = s.tool === 'eraser' ? s.width * 8 : s.width;
    ctx.moveTo(s.points[0].x, s.points[0].y);

    if (s.points.length < 3) {
        for (let i = 1; i < s.points.length; i++) {
            ctx.lineTo(s.points[i].x, s.points[i].y);
        }
    } else {
        for (let i = 1; i < s.points.length - 1; i++) {
            ctx.quadraticCurveTo(
                s.points[i].x,
                s.points[i].y,
                (s.points[i].x + s.points[i + 1].x) / 2,
                (s.points[i].y + s.points[i + 1].y) / 2
            );
        }
        ctx.lineTo(s.points[s.points.length - 1].x, s.points[s.points.length - 1].y);
    }

    ctx.stroke();
}

function renderCursors() {
    CTX.cursor.clearRect(0, 0, AppState.width, AppState.height);
    const now = Date.now();

    for (const [id, c] of Object.entries(AppState.remoteCursors)) {
        if (now - c.lastUpdate > 3000) {
            delete AppState.remoteCursors[id];
            continue;
        }

        if (c.isDrawing && c.points.length) {
            renderStroke(CTX.cursor, {
                tool: c.tool,
                color: c.color,
                width: c.width,
                points: c.points
            });
        }

        CTX.cursor.beginPath();
        CTX.cursor.arc(c.pos.x, c.pos.y, 6, 0, Math.PI * 2);
        CTX.cursor.fillStyle = c.tool === 'eraser' ? '#ccc' : c.color;
        CTX.cursor.fill();
        CTX.cursor.strokeStyle = '#fff';
        CTX.cursor.lineWidth = 2;
        CTX.cursor.stroke();
    }

    requestAnimationFrame(renderCursors);
}

/* 壓縮 */
async function compress(obj) {
    const json = JSON.stringify(obj);

    try {
        if (!('CompressionStream' in window)) throw new Error('CompressionStream unsupported');

        const stream = new Blob([json])
            .stream()
            .pipeThrough(new CompressionStream('deflate'));

        const buf = new Uint8Array(await new Response(stream).arrayBuffer());
        let bin = '';
        for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
        return 'D:' + btoa(bin);
    } catch (e) {
        return 'J:' + btoa(unescape(encodeURIComponent(json)));
    }
}

async function decompress(token) {
    if (token.startsWith('D:')) {
        const b64 = token.slice(2);
        const bin = atob(b64.trim());
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

        const text = await new Response(
            new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'))
        ).text();

        return JSON.parse(text);
    }

    if (token.startsWith('J:')) {
        const b64 = token.slice(2);
        return JSON.parse(decodeURIComponent(escape(atob(b64.trim()))));
    }

    try {
        const bin = atob(token.trim());
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

        const text = await new Response(
            new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'))
        ).text();

        return JSON.parse(text);
    } catch (e) {
        return JSON.parse(decodeURIComponent(escape(atob(token.trim()))));
    }
}

/* WebRTC */
function handleChannelMsg(e) {
    const d = JSON.parse(e.data);

    if (d.type === 'CLEAR') {
        AppState.history = [];
        initCanvases();
        showToast('對方清空了白板');
        return;
    }

    if (d.type === 'SYNC') {
        const existing = new Set(AppState.history.map(s => s.id));
        let changed = false;

        d.history.forEach(s => {
            if (!existing.has(s.id)) {
                AppState.history.push(s);
                changed = true;
            }
        });

        if (changed) initCanvases();
        return;
    }

    if (d.type === 'STROKE') {
        if (!AppState.history.find(s => s.id === d.stroke.id)) {
            AppState.history.push(d.stroke);
            renderStroke(CTX.base, d.stroke);
        }
    }
}

function bindChannels(rel, fast) {
    AppState.webrtc.reliable = rel;
    AppState.webrtc.fast = fast;

    rel.onopen = () => {
        dbg('[DC] reliable open');
        rel.send(JSON.stringify({
            type: 'SYNC',
            history: AppState.history
        }));
    };

    rel.onmessage = handleChannelMsg;

    fast.onopen = () => dbg('[DC] fast open');

    fast.onmessage = e => {
        const d = JSON.parse(e.data);
        if (d.type !== 'CURSOR') return;

        if (!AppState.remoteCursors[d.userId]) {
            AppState.remoteCursors[d.userId] = { points: [] };
        }

        const c = AppState.remoteCursors[d.userId];
        c.pos = d.pos;
        c.lastUpdate = Date.now();
        c.tool = d.tool;
        c.color = d.color;
        c.width = d.width;

        if (d.isDrawing) {
            if (!c.isDrawing) c.points = [];
            c.points.push(d.pos);
            c.isDrawing = true;
        } else {
            c.isDrawing = false;
            c.points = [];
        }
    };
}

function newPC() {
    const pc = new RTCPeerConnection({
        iceServers: navigator.onLine ? [{ urls: 'stun:stun.l.google.com:19302' }] : []
    });

    pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        dbg('[ICE] ' + s);

        const btn = document.getElementById('btn-connect');

        if (s === 'connected' || s === 'completed') {
            showToast('🎉 光學交握成功！已連線');
            stopCamera();
            btn.innerText = '❌ 斷開';
            btn.classList.add('connected');
        }

        if (s === 'disconnected' || s === 'failed' || s === 'closed') {
            showToast('⚠️ 已斷線');
            btn.innerText = '📷 鏡頭連線';
            btn.classList.remove('connected');
            AppState.webrtc.pc = null;
            AppState.webrtc.reliable = null;
            AppState.webrtc.fast = null;
        }
    };

    pc.onconnectionstatechange = () => {
        dbg('[PC] connectionState=' + pc.connectionState);
    };

    return pc;
}

function waitICE(pc) {
    return new Promise(resolve => {
        dbg('[ICE] gathering=' + pc.iceGatheringState);

        if (pc.iceGatheringState === 'complete') {
            dbg('[ICE] complete');
            resolve();
            return;
        }

        const timeout = setTimeout(() => {
            dbg('[ICE] timeout, continue');
            resolve();
        }, navigator.onLine ? 1800 : 150);

        pc.onicegatheringstatechange = () => {
            dbg('[ICE] gathering → ' + pc.iceGatheringState);
            if (pc.iceGatheringState === 'complete') {
                clearTimeout(timeout);
                resolve();
            }
        };
    });
}

function sendCursor(pos) {
    const ch = AppState.webrtc.fast;

    if (ch && ch.readyState === 'open' && ch.bufferedAmount < 1024) {
        ch.send(JSON.stringify({
            type: 'CURSOR',
            userId: AppState.userId,
            pos,
            isDrawing: AppState.isDrawing,
            tool: AppState.tool,
            color: AppState.color,
            width: AppState.lineWidth
        }));
    }
}

async function startCam() {
    dbg('[CAM] 啟動後鏡頭');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('此瀏覽器不支援 getUserMedia，請使用 Chrome / Edge / Safari 新版。');
    }

    if (_stream) _stream.getTracks().forEach(t => t.stop());

    try {
        _stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        _vidEl.srcObject = _stream;
        _vidEl.style.transform = 'none';

        await _vidEl.play().catch(e => dbg('[CAM] play(): ' + e));

        dbg('[CAM] 成功 video=' + _vidEl.videoWidth + 'x' + _vidEl.videoHeight);
    } catch (err) {
        const msg = err.name + ': ' + err.message;
        dbg('[CAM] 錯誤：' + msg);
        throw new Error('相機啟動失敗：' + msg);
    }
}

function stopCamera() {
    _isScanning = false;
    _manualResolve = null;

    if (_stream) {
        _stream.getTracks().forEach(t => t.stop());
        _stream = null;
    }

    _modal.classList.remove('show');
    _roleScr.style.display = 'flex';
    _stepScr.style.display = 'none';

    document.getElementById('debug-panel').classList.remove('vis');
    document.getElementById('fallback-ui').style.display = 'none';
    document.getElementById('btn-next-step').classList.remove('vis');
}

/* QR 掃描 */
function waitScan(prefix) {
    _isScanning = true;
    dbg('[SCAN] 等待前綴=' + prefix);

    if (!_scanCvs) {
        _scanCvs = document.createElement('canvas');
        _scanCtx = _scanCvs.getContext('2d', { willReadFrequently: true });
    }

    return new Promise((resolve, reject) => {
        let frame = 0;
        let last = null;
        let same = 0;
        const NEED = 2;

        const accept = val => {
            if (prefix && !val.startsWith(prefix)) {
                dbg('[SCAN] 前綴不符 actual=' + val.substring(0, 10) + ', expected=' + prefix);
                return false;
            }

            _isScanning = false;
            resolve(val);
            return true;
        };

        const tick = () => {
            if (!_isScanning) {
                reject(new Error('掃描已中止'));
                return;
            }

            const vw = _vidEl.videoWidth;
            const vh = _vidEl.videoHeight;
            frame++;

            if (!vw || !vh) {
                if (frame % 15 === 0) dbg('[SCAN] 等待畫面 frame=' + frame);
                setTimeout(() => requestAnimationFrame(tick), 200);
                return;
            }

            _scanCvs.width = vw;
            _scanCvs.height = vh;
            _scanCtx.drawImage(_vidEl, 0, 0, vw, vh);

            const img = _scanCtx.getImageData(0, 0, vw, vh);
            let val = null;

            if (typeof jsQR === 'function') {
                const r = jsQR(img.data, img.width, img.height, {
                    inversionAttempts: 'attemptBoth'
                });
                if (r && r.data) val = r.data;
            }

            if (val) {
                if (val === last) {
                    same++;
                    dbg('[SCAN] 連續 ' + same + '/' + NEED + ' frame: ' + val.substring(0, 40));

                    if (same >= NEED) {
                        if (accept(val)) return;
                        last = null;
                        same = 0;
                    }
                } else {
                    last = val;
                    same = 1;
                }
            }

            if (frame % 40 === 0) {
                dbg('[SCAN] 掃描中 frame=' + frame + ' ' + vw + 'x' + vh);
            }

            setTimeout(() => requestAnimationFrame(tick), 120);
        };

        if ('BarcodeDetector' in window) {
            try {
                dbg('[BD] 並行啟動');
                const det = new BarcodeDetector({ formats: ['qr_code'] });

                const bdTick = () => {
                    if (!_isScanning) return;

                    det.detect(_vidEl).then(bs => {
                        if (bs.length) {
                            const v = bs[0].rawValue;
                            dbg('[BD] ' + v.substring(0, 40));
                            if (accept(v)) return;
                        }

                        if (_isScanning) setTimeout(bdTick, 180);
                    }).catch(() => {
                        if (_isScanning) setTimeout(bdTick, 300);
                    });
                };

                setTimeout(bdTick, 500);
            } catch (e) {
                dbg('[BD] 不可用：' + e);
            }
        }

        if (_vidEl.readyState >= _vidEl.HAVE_ENOUGH_DATA) {
            tick();
        } else {
            dbg('[SCAN] 等 canplay...');
            const onCanPlay = () => {
                _vidEl.removeEventListener('canplay', onCanPlay);
                tick();
            };
            _vidEl.addEventListener('canplay', onCanPlay);
        }
    });
}

function waitScanOrManual(prefix) {
    return new Promise((resolve, reject) => {
        _manualResolve = val => {
            if (!prefix || val.startsWith(prefix)) {
                resolve(val);
            } else {
                showToast('代碼格式不符，期望前綴：' + prefix);
                _manualResolve = null;
            }
        };

        waitScan(prefix)
            .then(v => {
                _manualResolve = null;
                resolve(v);
            })
            .catch(e => {
                _manualResolve = null;
                reject(e);
            });
    });
}

document.getElementById('btn-fallback').addEventListener('click', () => {
    const v = document.getElementById('fallback-in').value.trim();

    if (!v) {
        showToast('請先貼上對方代碼');
        return;
    }

    if (typeof _manualResolve === 'function') {
        const f = _manualResolve;
        _manualResolve = null;
        _isScanning = false;
        f(v);
        showToast('手動代碼已套用');
    } else {
        showToast('目前步驟不需要手動輸入');
    }
});

async function runHost() {
    _roleScr.style.display = 'none';
    _stepScr.style.display = 'flex';
    document.getElementById('debug-panel').classList.remove('vis');
    document.getElementById('fallback-ui').style.display = 'none';
    _log.length = 0;

    dbg('[HOST] 開始');

    try {
        showSpinner('啟動後鏡頭...');
        setHint('啟動後鏡頭...');
        await startCam();
        hideSpinner();
    } catch (err) {
        _retryFn = runHost;
        showError('無法啟動後鏡頭', err.message);
        return;
    }

    let pc = null;

    const s1 = async () => {
        setDots(1);
        setHint('步驟 1／3 &nbsp;📲 讓加入者用後鏡頭掃這個 QR Code');
        showSpinner('產生 Offer 密鑰...');

        dbg('[H1] 建立 WebRTC + Offer');

        try {
            if (pc) try { pc.close(); } catch (e) {}

            pc = newPC();
            AppState.webrtc.pc = pc;

            const rel = pc.createDataChannel('rel', { ordered: true });
            const fast = pc.createDataChannel('fast', { ordered: false, maxRetransmits: 0 });

            bindChannels(rel, fast);

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            dbg('[H1] setLocalDescription OK');

            await waitICE(pc);

            const tok = await compress(pc.localDescription);

            dbg('[H1] offer token=' + tok.length + ' bytes');

            showQR('H1|' + tok, '📲 讓加入者（Join）用後鏡頭掃此 QR Code');
            setHint('步驟 1／3 &nbsp;⏳ 等加入者掃完後，按下方按鈕繼續');

            await awaitConfirm('✅ 加入者已掃到，繼續步驟 2 →');

            dbg('[H1] 使用者確認 → S2');
            s2();
        } catch (err) {
            dbg('[H1] 錯誤：' + err);
            _retryFn = s1;
            showError('步驟 1 失敗', err.toString());
        }
    };

    const s2 = async () => {
        setDots(2);
        setHint('步驟 2／3 &nbsp;📷 用後鏡頭掃加入者螢幕的 QR Code');
        showScan('後鏡頭對準加入者螢幕的 QR Code（J2 開頭）');

        dbg('[H2] 等待掃描 J2');

        try {
            const raw = await waitScanOrManual('J2|');

            dbg('[H2] 掃到 J2 len=' + raw.length);

            setHint('步驟 2／3 &nbsp;🟢 掃描成功！確認後繼續');

            await awaitConfirm('✅ 掃描成功，繼續步驟 3 →');

            showSpinner('解析加入者資訊...');

            const remoteDesc = await decompress(raw.slice(3));
            await pc.setRemoteDescription(remoteDesc);

            dbg('[H2] setRemoteDescription OK');

            hideSpinner();
            s3();
        } catch (err) {
            dbg('[H2] 錯誤：' + err);
            _retryFn = s2;
            showError('步驟 2 掃描失敗', err.toString());
        }
    };

    const s3 = async () => {
        setDots(3);
        setHint('步驟 3／3 &nbsp;📲 讓加入者再掃一次，完成連線');

        try {
            showQR('H3|' + Date.now(), '📲 讓加入者用後鏡頭掃此 QR Code（最後一步）');
            setHint('步驟 3／3 &nbsp;⏳ 等加入者掃完後，按下方按鈕');

            await awaitConfirm('✅ 加入者已掃，等待連線...');

            showSpinner('正在建立 P2P 連線...');
            setHint('⏳ 等待 WebRTC 連線建立...');
            dbg('[H3] 等待 ICE');
        } catch (err) {
            dbg('[H3] 錯誤：' + err);
            _retryFn = s3;
            showError('步驟 3 失敗', err.toString());
        }
    };

    s1();
}

/* Drawing events */
const _cont = document.getElementById('canvas-container');

function getP(e) {
    const r = CVS.active.getBoundingClientRect();
    return {
        x: e.clientX - r.left,
        y: e.clientY - r.top
    };
}

_cont.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;

    AppState.isDrawing = true;

    const p = getP(e);

    AppState.currentStroke = {
        id: genUUID(),
        tool: AppState.tool,
        color: AppState.color,
        width: AppState.lineWidth,
        points: [p]
    };

    try { _cont.setPointerCapture(e.pointerId); } catch (err) {}

    sendCursor(p);
});

window.addEventListener('pointermove', e => {
    const p = getP(e);

    if (AppState.isDrawing && AppState.currentStroke && e.isPrimary) {
        const pts = AppState.currentStroke.points;
        const last = pts[pts.length - 1];

        if (Math.hypot(p.x - last.x, p.y - last.y) > 2) {
            pts.push(p);
            CTX.active.clearRect(0, 0, AppState.width, AppState.height);
            renderStroke(CTX.active, AppState.currentStroke);
        }
    }

    sendCursor(p);
});

function stopDraw(e) {
    if (!AppState.isDrawing || !e.isPrimary) return;

    AppState.isDrawing = false;

    if (AppState.currentStroke && AppState.currentStroke.points.length) {
        AppState.history.push(AppState.currentStroke);

        renderStroke(CTX.base, AppState.currentStroke);
        CTX.active.clearRect(0, 0, AppState.width, AppState.height);

        if (AppState.webrtc.reliable && AppState.webrtc.reliable.readyState === 'open') {
            AppState.webrtc.reliable.send(JSON.stringify({
                type: 'STROKE',
                stroke: AppState.currentStroke
            }));
        }
    }

    AppState.currentStroke = null;
    sendCursor(getP(e));
}

window.addEventListener('pointerup', stopDraw);
window.addEventListener('pointercancel', stopDraw);

document.getElementById('tool-color').addEventListener('input', e => {
    AppState.color = e.target.value;
    AppState.tool = 'pen';

    document.getElementById('tool-pen').classList.add('active');
    document.getElementById('tool-eraser').classList.remove('active');
});

document.getElementById('tool-pen').onclick = () => {
    AppState.tool = 'pen';
    document.getElementById('tool-pen').classList.add('active');
    document.getElementById('tool-eraser').classList.remove('active');
};

document.getElementById('tool-eraser').onclick = () => {
    AppState.tool = 'eraser';
    document.getElementById('tool-eraser').classList.add('active');
    document.getElementById('tool-pen').classList.remove('active');
};

document.getElementById('tool-clear').onclick = () => {
    if (confirm('確定要清空整個白板嗎？')) {
        AppState.history.length = 0;
        initCanvases();

        if (AppState.webrtc.reliable && AppState.webrtc.reliable.readyState === 'open') {
            AppState.webrtc.reliable.send(JSON.stringify({ type: 'CLEAR' }));
        }
    }
};

window.addEventListener('resize', () => {
    initCanvases();
});

initCanvases();
renderCursors();
</script>

<script>
(function(){

    if (window.location.hostname !== 'winston-github.github.io') return;
    
    // 2. 自動精準萃取檔名作為 ID (支援任意路徑與任意副檔名)
    var file = window.location.pathname.split('/').pop();
    var pageId = file ? file.split('.')[0] : 'index';
    if (!pageId) return;

    // 3. 靜默發送破快取請求 (移除所有 Console 輸出，確保無痕)
    var url = 'https://api.counterapi.dev/v1/winston-github-io/page-' + pageId + '/up?_=' + new Date().getTime();
    fetch(url).catch(function(){});
})();
</script>
