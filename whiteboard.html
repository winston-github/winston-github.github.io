*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f5;touch-action:none;user-select:none}.board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#base{z-index:1}#live{z-index:2}#cursor{z-index:3;pointer-events:none}#wrap{position:relative;width:100vw;height:100vh;background:#fff}#grid{position:absolute;inset:0;background-image:radial-gradient(#d7d7d7 1px,transparent 1px);background-size:20px 20px}#bar{position:absolute;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fffffff2;border:1px solid #ddd;border-radius:999px;padding:9px 12px;box-shadow:0 8px 28px #0002}button{border:0;border-radius:999px;padding:10px 14px;font-weight:750;background:#fff;box-shadow:inset 0 0 0 1px #ddd}button.active{background:#e7f1ff;color:#06f;box-shadow:inset 0 0 0 2px #07f}button:disabled{opacity:.45}#color{width:36px;height:36px;border:0;background:transparent}#connect{background:#07f;color:#fff;box-shadow:none}.on#connect{background:#f33}#toast{position:absolute;z-index:999;top:-80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;border-radius:999px;padding:12px 20px;transition:.25s;white-space:nowrap}#toast.show{top:24px}#modal{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#081026,#16244a);color:#fff;overflow:auto;padding:22px 14px 100px}#modal.show{display:block}.card{width:min(760px,94vw);margin:auto;background:#ffffff14;border:1px solid #ffffff24;border-radius:28px;padding:18px;box-shadow:0 18px 60px #0006}.top{text-align:center;padding:8px 0 14px}.top h1{font-size:22px;margin:0 0 8px}.top p{margin:0;color:#ffffffb8;font-size:13px;line-height:1.55}.stage{display:none!important}.stage.show{display:block!important}.box{background:#0004;border:1px solid #ffffff22;border-radius:20px;padding:16px;margin:12px 0;text-align:center;line-height:1.65;white-sp <div id="modal"><div class="card"><div class="top"><h1>🔊 聲音 P2P 白板</h1><p>先自我檢查，再選 Host / Visitor，最後兩台裝置一起按「開始同步」。</p></div>
<section id="stageCheck" class="stage show"><div id="checkStatus" class="box">請先做自我檢查。\n這會播放短校準音，確認本機喇叭聲音可被本機麥克風收到。</div><div class="meters"><div class="meter">本機聽到音量<div id="rmsBar" class="track"><i></i></div></div><div class="meter">聲音品質<div id="qBar" class="track"><i></i></div></div></div><div class="actions"><button class="blue" id="selfBtn">1. 自我檢查</button><button class="green" id="roleNext" disabled>2. 繼續選角色</button><button class="red cancel">放棄</button></div></section>
<section id="stageRole" class="stage"><div class="box">請兩個人先講好角色：\n一台選 Host，另一台選 Visitor。</div><div class="roles"><button class="role" id="hostBtn"><b>我是 Host</b><span>先播放連線資訊</span></button><button class="role" id="joinBtn"><b>我是 Visitor</b><span>先聽 Host 的聲音</span></button></div><div class="actions"><button class="ghost" id="backCheck">返回</button><button class="red cancel">放棄</button></div></section>
<section id="stageReady" class="stage"><div class="box" id="readyText">角色已選好。</div><div class="count" id="count">READY</div><div class="actions"><button class="green" id="syncBtn">兩人一起按：開始同步</button><button class="red cancel">放棄同步</button></div><div class="box">請兩台裝置距離 10–50 公分。倒數後系統會自動校準與交換 WebRTC 資訊。</div></section>
<section id="stageRun" class="stage"><div class="box" id="runStatus">準備中...</div><div class="meters"><div class="meter">目前音量<div id="rmsBar2" class="track"><i></i></div></div><div class="meter">清楚度<div id="qBar2" class="track"><i></i></div></div><div class="prog"><i id="prog"></i></div><div class="actions"><button class="ghost" id="replay">重播上一段</button><button class="red cancel">停止同步</button></div><details><summary>進階資訊 / 備援文字封包</summary><textarea id="manual"></textarea><div class="actions"><button class="ghost" id="applyManual">套用文字封包</button></div><div id="log" class="log"></div></details></section>
</div></div><script>
'use strict';const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),3000)}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}function showStage(id){['stageCheck','stageRole','stageReady','stageRun'].forEach(x=>{const e=$(x);const on=x===id;e.classList.toggle('show',on);e.style.display=on?'block':'none'});setTimeout(()=>{if(!$(id).classList.contains('show')){$(id).classList.add('show');$(id).style.display='block'}},0)}
const S={id:uid(),tool:'pen',color:'#000',w:4,hist:[],stroke:null,drawing:false,cursors:{},pc:null,rel:null,fast:null,role:null,selfOK:false};const cvs={base:$('base'),live:$('live'),cursor:$('cursor')},ctx={base:cvs.base.getContext('2d',{alpha:false}),live:cvs.live.getContext('2d'),cursor:cvs.cursor.getContext('2d')};
function size(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});ctx.base.fillStyle='#fff';ctx.base.fillRect(0,0,w,h);S.hist.forEach(s=>draw(ctx.base,s))}function draw(x,s){if(!s.points?.length)return;x.beginPath();x.strokeStyle=s.tool==='eraser'?'#fff':s.color;x.lineWidth=s.tool==='eraser'?s.w*8:s.w;x.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length-1;i++)x.quadraticCurveTo(s.points[i].x,s.points[i].y,(s.points[i].x+s.points[i+1].x)/2,(s.points[i].y+s.points[i+1].y)/2);if(s.points.length>1)x.lineTo(s.points.at(-1).x,s.points.at(-1).y);x.stroke()}function curs(){ctx.cursor.clearRect(0,0,innerWidth,innerHeight);const n=Date.now();for(const [id,c] of Object.entries(S.cursors)){if(n-c.t>3000){delete S.cursors[id];continue}ctx.cursor.beginPath();ctx.cursor.arc(c.p.x,c.p.y,6,0,7);ctx.cursor.fillStyle=c.tool==='eraser'?'#bbb':c.color;ctx.cursor.fill();ctx.cursor.strokeStyle='#fff';ctx.cursor.lineWidth=2;ctx.cursor.stroke()}requestAnimationFrame(curs)}function pnt(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function send(o){if(S.rel?.readyState==='open')S.rel.send(JSON.stringify(o))}function sendFast(o){if(S.fast?.readyState==='open'&&S.fast.bufferedAmount<2048)S.fast.send(JSON.stringify(o))}function onMsg(e){const d=JSON.parse(e.data);if(d.type==='CLEAR'){S.hist=[];size();toast('對方清空白板')}if(d.type==='STROKE'&&!S.hist.find(x=>x.id===d.stroke.id)){S.hist.push(d.stroke);draw(ctx.base,d.stroke)}if(d.type==='SYNC'){const ids=new Set(S.hist.map(x=>x.id));let ch=false;d.hist.forEach(x=>{if(!ids.has(x.id)){S.hist.push(x);ch=true}});if(ch)size()}if(d.type==='CURSOR')S.cursors[d.id]={p:d.p,t:Date.now(),tool:d.tool,color:d.color}}
function bind(rel,fast){S.rel=rel;S.fast=fast;rel.onopen=()=>{log('DataChannel open');send({type:'SYNC',hist:S.hist});connected()};rel.onmessage=onMsg;fast.onmessage=onMsg}function newPC(){const p=new RTCPeerConnection({iceServers:[]});S.pc=p;p.oniceconnectionstatechange=()=>{log('ICE '+p.iceConnectionState);if(['connected','completed'].includes(p.iceConnectionState))connected();if(['failed','disconnected','closed'].includes(p.iceConnectionState))disconnected()};return p}function waitIce(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();let t=setTimeout(r,2200);p.onicegatheringstatechange=()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);r()}}})}function connected(){toast('🎉 已連線');$('connect').textContent='❌ 斷開';$('connect').classList.add('on');closeModal()}function disconnected(){toast('已斷線');$('connect').textContent='🔊 聲音連線';$('connect').classList.remove('on');S.pc=S.rel=S.fast=null}
async function pack(o){const s=JSON.stringify(o);try{if('CompressionStream'in window){const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'));const b=new Uint8Array(await new Response(st).arrayBuffer());let bin='';for(const x of b)bin+=String.fromCharCode(x);return'D:'+btoa(bin)}}catch(e){}return'J:'+btoa(unescape(encodeURIComponent(s)))}async function unpack(t){if(t.startsWith('D:')){const bin=atob(t.slice(2)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text())}return JSON.parse(decodeURIComponent(escape(atob(t.slice(2)))))}
let AC,stream,src,an,proc,rms=0,clip=0,rx='',rxResolve=null,rxNeed='',lastTx='';const freqs=[900,1300,1700,2100],sym=.032,prefix='<<<WBAP1>>>',suffix='<<<END>>>';function log(s){$('log').textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function status(s){$('runStatus').textContent=s;log(s)}async function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await AC.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});src=AC.createMediaStreamSource(stream);an=AC.createAnalyser();an.fftSize=2048;proc=AC.createScriptProcessor(2048,1,1);src.connect(an);src.connect(proc);proc.connect(AC.destination);proc.onaudioprocess=e=>decode(e.inputBuffer.getChannelData(0));meters()}function meters(){if(!an)return requestAnimationFrame(meters);const a=new Float32Array(an.fftSize);an.getFloatTimeDomainData(a);let sum=0,cl=0;for(const v of a){sum+=v*v;if(Math.abs(v)>.92)cl++}rms=Math.sqrt(sum/a.length);clip=cl/a.length;let q=Math.max(0,Math.min(1,(rms-.006)/.07))*(clip>.03?.45:1);['rmsBar','rmsBar2'].forEach(id=>bar(id,rms/.12,clip>.03?'hot':rms<.012?'bad':''));['qBar','qBar2'].forEach(id=>bar(id,q,q<.35?'bad':''));requestAnimationFrame(meters)}function bar(id,v,c){const e=$(id);e.className='track '+(c||'');e.firstElementChild.style.width=Math.max(0,Math.min(100,v*100))+'%'}function prog(v){$('prog').style.width=Math.max(0,Math.min(100,v*100))+'%'}
function goertzel(buf,f){const w=2*Math.PI*f/AC.sampleRate,co=2*Math.cos(w);let s0=0,s1=0,s2=0;for(const x of buf){s0=x+co*s1-s2;s2=s1;s1=s0}return s1*s1+s2*s2-co*s1*s2}let db=[];function decode(input){if(!rxResolve)return;for(const x of input)db.push(x);const N=Math.floor(AC.sampleRate*sym);while(db.length>=N){const c=db.splice(0,N);let ps=freqs.map(f=>goertzel(c,f)),m=0;for(let i=1;i<4;i++)if(ps[i]>ps[m])m=i;rx+=String(m);parseRx()}}function enc(txt){const b=new TextEncoder().encode(txt);let s='';for(const x of b){s+=(x>>6)&3;s+=(x>>4)&3;s+=(x>>2)&3;s+=x&3}return s}function dec(s){const out=[];for(let i=0;i+3<s.length;i+=4)out.push((+s[i]<<6)|(+s[i+1]<<4)|(+s[i+2]<<2)|(+s[i+3]));return new TextDecoder().decode(new Uint8Array(out))}function parseRx(){try{const txt=dec(rx.slice(Math.max(0,rx.length-90000))),a=txt.indexOf(prefix),b=txt.indexOf(suffix,a+prefix.length);if(a>=0&&b>a){const o=JSON.parse(txt.slice(a+prefix.length,b));if(!rxNeed||o.kind===rxNeed){const f=rxResolve;rxResolve=null;rxNeed='';rx='';status('已收到 '+o.kind);f(o)}}}catch(e){if(rx.length>120000)rx=rx.slice(-80000)}}
function tone(f,d,g=.1,t=AC.currentTime){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.01);gn.gain.setValueAtTime(g,t+d-.02);gn.gain.linearRampToValueAtTime(0,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);return t+d}async function chime(g=.08){await audio();let t=AC.currentTime+.08;[523,659,784,1046].forEach(f=>t=tone(f,.18,g,t+.02));return new Promise(r=>setTimeout(r,1000))}async function play(kind,data){await audio();const text=prefix+JSON.stringify({kind,data,from:S.id,t:Date.now()})+suffix;lastTx=text;$('manual').value=text;status('正在播放 '+kind+'，請對方保持聆聽。');await chime();const sy=enc(text);let t=AC.currentTime+.15;for(let i=0;i<sy.length;i++){t=tone(freqs[+sy[i]],sym,.09,t);if(i%80===0)prog(i/sy.length)}return new Promise(r=>setTimeout(()=>{prog(1);r()},(t-AC.currentTime+.2)*1000))}async function listen(kind,timeout=180000){await audio();rx='';db=[];rxNeed=kind;status('正在聆聽 '+kind+'。\n如果沒有反應，請對方調大聲或靠近。');return new Promise((res,rej)=>{rxResolve=res;const st=Date.now(),ti=setInterval(()=>prog((Date.now()-st)/timeout),300);setTimeout(()=>{clearInterval(ti);if(rxResolve){rxResolve=null;rej(Error('聆聽逾時'))}},timeout)})}
async function selfCheck(){try{$('selfBtn').disabled=true;$('checkStatus').textContent='自我檢查中：正在播放短校準音。';await audio();let mx=0,mc=0,done=false,t0=Date.now();const m=setInterval(()=>{mx=Math.max(mx,rms);mc=Math.max(mc,clip);if(Date.now()-t0>4500){clearInterval(m);done=true}},80);await chime(.12);while(!done)await new Promise(r=>setTimeout(r,80));if(mx>=.012&&mx<=.16&&mc<.06){S.selfOK=true;$('roleNext').disabled=false;$('checkStatus').textContent='✅ 自我檢查通過。\n可以繼續選角色。';toast('自我檢查通過')}else{$('selfBtn').disabled=false;$('checkStatus').textContent=mx<.012?'⚠️ 本機收到音量太小，請調大聲後重試。':'⚠️ 聲音可能過大或失真，請調小聲後重試。'}}catch(e){$('selfBtn').disabled=false;$('checkStatus').textContent='無法開啟麥克風：'+e.message+'\n請使用 HTTPS 或 localhost，並允許麥克風。'}}
async function calHost(){status('Host 播放校準音，等待 Visitor 回報。');await play('CAL',{role:'host'});try{const r=await listen('CALACK',45000),m=r.data||{};status(m.rms<.012?'Visitor 聽到太小，請 Host 調大聲。':(m.clip>.03||m.rms>.12)?'Visitor 聽到太大，請 Host 調小聲。':'聲音品質可用，開始交換。');return m.rms>=.012&&m.rms<=.14&&m.clip<.04}catch(e){status('未收到 Visitor 校準回報。');return false}}async function calJoin(){status('Visitor 等待 Host 校準音。');try{await listen('CAL',90000);const m={rms,clip};status(m.rms<.012?'聽到太小，請 Host 調大聲。':(m.clip>.03||m.rms>.12)?'聽到太大，請 Host 調小聲。':'聲音品質可用，回報 Host。');await play('CALACK',m);return m.rms>=.012&&m.rms<=.14&&m.clip<.04}catch(e){status('尚未收到 Host 校準音。');return false}}
async function runHost(){showStage('stageRun');try{await audio();let ok=false;for(let i=0;i<3&&!ok;i++)ok=await calHost();if(!ok)return;const p=newPC(),rel=p.createDataChannel('rel',{ordered:true}),fast=p.createDataChannel('fast',{ordered:false,maxRetransmits:0});bind(rel,fast);await p.setLocalDescription(await p.createOffer());await waitIce(p);await play('OFFER',await pack(p.localDescription));const ans=await listen('ANSWER',240000);await p.setRemoteDescription(await unpack(ans.data));status('已套用 Visitor 回覆，等待連線。')}catch(e){status('Host 失敗：'+e.message)}}async function runJoin(){showStage('stageRun');try{await audio();let ok=false;for(let i=0;i<3&&!ok;i++)ok=await calJoin();if(!ok)return;const off=await listen('OFFER',240000),p=newPC();p.ondatachannel=e=>{if(e.channel.label==='rel')S.rel=e.channel;if(e.channel.label==='fast')S.fast=e.channel;if(S.rel&&S.fast)bind(S.rel,S.fast)};await p.setRemoteDescription(await unpack(off.data));await p.setLocalDescription(await p.createAnswer());await waitIce(p);await play('ANSWER',await pack(p.localDescription));status('Answer 已播放，等待連線。')}catch(e){status('Visitor 失敗：'+e.message)}}

<script>

})();
