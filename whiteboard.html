<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>聲音 P2P 白板 Duet</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f5;touch-action:none;user-select:none}.board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#base{z-index:1}#live{z-index:2}#cursor{z-index:3;pointer-events:none}#wrap{position:relative;width:100vw;height:100vh;background:#fff}#grid{position:absolute;inset:0;background-image:radial-gradient(#d7d7d7 1px,transparent 1px);background-size:20px 20px}#bar{position:absolute;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fffffff2;border:1px solid #ddd;border-radius:999px;padding:9px 12px;box-shadow:0 8px 28px #0002}button{border:0;border-radius:999px;padding:10px 14px;font-weight:750;background:#fff;box-shadow:inset 0 0 0 1px #ddd}button.active{background:#e7f1ff;color:#06f;box-shadow:inset 0 0 0 2px #07f}button:disabled{opacity:.45}#color{width:36px;height:36px;border:0;background:transparent}#connect{background:#07f;color:#fff;box-shadow:none}.on#connect{background:#f33}#toast{position:absolute;z-index:999;top:-80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;border-radius:999px;padding:12px 20px;transition:.25s;white-space:nowrap}#toast.show{top:24px}#modal{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#081026,#16244a);color:#fff;overflow:auto;padding:22px 14px 100px}#modal.show{display:block}.card{width:min(760px,94vw);margin:auto;background:#ffffff14;border:1px solid #ffffff24;border-radius:28px;padding:18px;box-shadow:0 18px 60px #0006}.top{text-align:center;padding:8px 0 14px}.top h1{font-size:22px;margin:0 0 8px}.top p{margin:0;color:#ffffffb8;font-size:13px;line-height:1.55}.stage{display:none!important}.stage.show{display:block!important}.box{background:#0004;border:1px solid #ffffff22;border-radius:20px;padding:16px;margin:12px 0;text-align:center;line-height:1.65;white-space:pre-wrap}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.blue{background:#07f;color:#fff;box-shadow:none}.green{background:#28cd41;color:#fff;box-shadow:none}.red{background:#ff3b30;color:#fff;box-shadow:none}.ghost{background:#ffffff1f;color:#fff;box-shadow:inset 0 0 0 1px #fff4}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meter{background:#ffffff14;border-radius:15px;padding:11px;font-size:12px;color:#fffc}.track{height:10px;border-radius:999px;background:#ffffff24;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;width:0;background:#28cd41}.track.bad i{background:#fc0}.track.hot i{background:#f33}.count{font-size:38px;font-weight:900;text-align:center;text-shadow:0 0 28px #0df9;word-break:break-all}.prog{height:12px;background:#ffffff24;border-radius:999px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0df,#28cd41)}details{margin-top:12px;color:#fffb;font-size:12px;text-align:center}textarea{width:100%;height:74px;background:#0005;color:#fff;border:1px solid #fff3;border-radius:12px;padding:10px;font:11px ui-monospace,monospace}.log{text-align:left;height:115px;overflow:auto;background:#0004;border-radius:12px;padding:10px;white-space:pre-wrap;font:10px ui-monospace,monospace;color:#fffb;margin-top:8px}@media(max-width:560px){.meters{grid-template-columns:1fr}#bar{gap:5px}button{padding:9px 11px;font-size:13px}}</style></head><body><div id="toast"></div><div id="wrap"><div id="grid"></div><canvas id="base" class="board"></canvas><canvas id="live" class="board"></canvas><canvas id="cursor" class="board"></canvas></div><div id="bar"><input id="color" type="color" value="#000000"><button id="pen" class="active">✏️</button><button id="eraser">🧹</button><button id="clear">🗑️</button><button id="connect">🔊 聲音連線</button></div><div id="modal"><div class="card"><div class="top"><h1>🔊 聲音 P2P 白板</h1><p>兩階段：1 自我檢查；2 兩台一起按同步後，裝置會用自己的 HASH 呼號，自動協調誰唱誰聽。</p></div><section id="stageCheck" class="stage show"><div id="checkStatus" class="box">請先做自我檢查。\n此版使用「互相唱歌模式」：不再手動選 Host / Visitor。</div><div class="meters"><div class="meter">本機聽到音量<div id="rmsBar" class="track"><i></i></div></div><div class="meter">聲音品質<div id="qBar" class="track"><i></i></div></div></div><div class="actions"><button class="blue" id="selfBtn">1. 自我檢查</button><button class="green" id="syncReady" disabled>2. 進入同步</button><button class="red cancel">放棄</button></div></section><section id="stageSync" class="stage"><div class="box" id="readyText">本機 HASH：計算中...</div><div class="count" id="count">READY</div><div class="actions"><button class="green" id="syncBtn">兩人一起按：開始同步</button><button class="red cancel">放棄同步</button></div><div class="box">同步後雙方會先輪流呼號自己的 HASH。\n抓到對方 HASH 後，HASH 較小者自動負責 Offer，較大者自動負責 Answer。</div></section><section id="stageRun" class="stage"><div class="box" id="runStatus">準備中...</div><div class="meters"><div class="meter">目前音量<div id="rmsBar2" class="track"><i></i></div></div><div class="meter">清楚度<div id="qBar2" class="track"><i></i></div></div><div class="prog"><i id="prog"></i></div><div class="actions"><button class="ghost" id="replay">重播上一段</button><button class="red cancel">停止同步</button></div><details><summary>進階資訊 / 備援文字封包</summary><textarea id="manual"></textarea><div class="actions"><button class="ghost" id="applyManual">套用文字封包</button></div><div id="log" class="log"></div></details></section></div></div><script>
'use strict';const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),3000)}async function shortHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).slice(0,6).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}function showStage(id){['stageCheck','stageSync','stageRun'].forEach(x=>{const e=$(x);const on=x===id;e.classList.toggle('show',on);e.style.display=on?'block':'none'})}
const S={id:uid(),hash:'',peer:null,tool:'pen',color:'#000',w:4,hist:[],stroke:null,drawing:false,cursors:{},pc:null,rel:null,fast:null,selfOK:false,role:null};shortHash(S.id).then(h=>{S.hash=h;$('readyText').textContent='本機 HASH：'+h+'\n請另一台也完成自我檢查後，一起按開始同步。'});
const cvs={base:$('base'),live:$('live'),cursor:$('cursor')},ctx={base:cvs.base.getContext('2d',{alpha:false}),live:cvs.live.getContext('2d'),cursor:cvs.cursor.getContext('2d')};function size(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});ctx.base.fillStyle='#fff';ctx.base.fillRect(0,0,w,h);S.hist.forEach(s=>draw(ctx.base,s))}function draw(x,s){if(!s.points?.length)return;x.beginPath();x.strokeStyle=s.tool==='eraser'?'#fff':s.color;x.lineWidth=s.tool==='eraser'?s.w*8:s.w;x.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length-1;i++)x.quadraticCurveTo(s.points[i].x,s.points[i].y,(s.points[i].x+s.points[i+1].x)/2,(s.points[i].y+s.points[i+1].y)/2);if(s.points.length>1)x.lineTo(s.points.at(-1).x,s.points.at(-1).y);x.stroke()}function curs(){ctx.cursor.clearRect(0,0,innerWidth,innerHeight);const n=Date.now();for(const [id,c] of Object.entries(S.cursors)){if(n-c.t>3000){delete S.cursors[id];continue}ctx.cursor.beginPath();ctx.cursor.arc(c.p.x,c.p.y,6,0,7);ctx.cursor.fillStyle=c.tool==='eraser'?'#bbb':c.color;ctx.cursor.fill();ctx.cursor.strokeStyle='#fff';ctx.cursor.lineWidth=2;ctx.cursor.stroke()}requestAnimationFrame(curs)}function pnt(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function send(o){if(S.rel?.readyState==='open')S.rel.send(JSON.stringify(o))}function sendFast(o){if(S.fast?.readyState==='open'&&S.fast.bufferedAmount<2048)S.fast.send(JSON.stringify(o))}function onMsg(e){const d=JSON.parse(e.data);if(d.type==='CLEAR'){S.hist=[];size();toast('對方清空白板')}if(d.type==='STROKE'&&!S.hist.find(x=>x.id===d.stroke.id)){S.hist.push(d.stroke);draw(ctx.base,d.stroke)}if(d.type==='SYNC'){const ids=new Set(S.hist.map(x=>x.id));let ch=false;d.hist.forEach(x=>{if(!ids.has(x.id)){S.hist.push(x);ch=true}});if(ch)size()}if(d.type==='CURSOR')S.cursors[d.id]={p:d.p,t:Date.now(),tool:d.tool,color:d.color}}function bind(rel,fast){S.rel=rel;S.fast=fast;rel.onopen=()=>{log('DataChannel open');send({type:'SYNC',hist:S.hist});connected()};rel.onmessage=onMsg;fast.onmessage=onMsg}function newPC(){const p=new RTCPeerConnection({iceServers:[]});S.pc=p;p.oniceconnectionstatechange=()=>{log('ICE '+p.iceConnectionState);if(['connected','completed'].includes(p.iceConnectionState))connected();if(['failed','disconnected','closed'].includes(p.iceConnectionState))disconnected()};return p}function waitIce(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();let t=setTimeout(r,2200);p.onicegatheringstatechange=()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);r()}}})}function connected(){toast('🎉 已連線');$('connect').textContent='❌ 斷開';$('connect').classList.add('on');closeModal()}function disconnected(){toast('已斷線');$('connect').textContent='🔊 聲音連線';$('connect').classList.remove('on');S.pc=S.rel=S.fast=null}async function pack(o){const s=JSON.stringify(o);try{if('CompressionStream'in window){const st=new Blob([s]).stream().pipeThrough(new CompressionStream('deflate'));const b=new Uint8Array(await new Response(st).arrayBuffer());let bin='';for(const x of b)bin+=String.fromCharCode(x);return'D:'+btoa(bin)}}catch(e){}return'J:'+btoa(unescape(encodeURIComponent(s)))}async function unpack(t){if(t.startsWith('D:')){const bin=atob(t.slice(2)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text())}return JSON.parse(decodeURIComponent(escape(atob(t.slice(2)))))}
let AC,stream,src,an,proc,rms=0,clip=0,rx='',rxResolve=null,rxNeed='',lastTx='',tx=false;const freqs=[900,1300,1700,2100],sym=.032,prefix='<<<WBAP1>>>',suffix='<<<END>>>';function log(s){$('log').textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function status(s){$('runStatus').textContent=s;log(s)}async function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await AC.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});src=AC.createMediaStreamSource(stream);an=AC.createAnalyser();an.fftSize=2048;proc=AC.createScriptProcessor(2048,1,1);src.connect(an);src.connect(proc);proc.connect(AC.destination);proc.onaudioprocess=e=>{if(!tx)decode(e.inputBuffer.getChannelData(0))};meters()}function meters(){if(!an)return requestAnimationFrame(meters);const a=new Float32Array(an.fftSize);an.getFloatTimeDomainData(a);let sum=0,cl=0;for(const v of a){sum+=v*v;if(Math.abs(v)>.92)cl++}rms=Math.sqrt(sum/a.length);clip=cl/a.length;let q=Math.max(0,Math.min(1,(rms-.003)/.045))*(clip>.05?.5:1);['rmsBar','rmsBar2'].forEach(id=>bar(id,rms/.08,clip>.05?'hot':rms<.004?'bad':''));['qBar','qBar2'].forEach(id=>bar(id,q,q<.25?'bad':''));requestAnimationFrame(meters)}function bar(id,v,c){const e=$(id);e.className='track '+(c||'');e.firstElementChild.style.width=Math.max(0,Math.min(100,v*100))+'%'}function prog(v){$('prog').style.width=Math.max(0,Math.min(100,v*100))+'%'}function goertzel(buf,f){const w=2*Math.PI*f/AC.sampleRate,co=2*Math.cos(w);let s0=0,s1=0,s2=0;for(const x of buf){s0=x+co*s1-s2;s2=s1;s1=s0}return s1*s1+s2*s2-co*s1*s2}let db=[];function decode(input){if(!rxResolve)return;for(const x of input)db.push(x);const N=Math.floor(AC.sampleRate*sym);while(db.length>=N){const c=db.splice(0,N);let ps=freqs.map(f=>goertzel(c,f)),m=0;for(let i=1;i<4;i++)if(ps[i]>ps[m])m=i;rx+=String(m);parseRx()}}function enc(txt){const b=new TextEncoder().encode(txt);let s='';for(const x of b){s+=(x>>6)&3;s+=(x>>4)&3;s+=(x>>2)&3;s+=x&3}return s}function dec(s){const out=[];for(let i=0;i+3<s.length;i+=4)out.push((+s[i]<<6)|(+s[i+1]<<4)|(+s[i+2]<<2)|(+s[i+3]));return new TextDecoder().decode(new Uint8Array(out))}function parseRx(){try{const txt=dec(rx.slice(Math.max(0,rx.length-90000))),a=txt.indexOf(prefix),b=txt.indexOf(suffix,a+prefix.length);if(a>=0&&b>a){const o=JSON.parse(txt.slice(a+prefix.length,b));if(o.from!==S.hash&&(!rxNeed||o.kind===rxNeed)){const f=rxResolve;rxResolve=null;rxNeed='';rx='';status('已收到 '+o.kind+'：'+(o.from||''));f(o)}}}catch(e){if(rx.length>120000)rx=rx.slice(-80000)}}function tone(f,d,g=.1,t=AC.currentTime){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.01);gn.gain.setValueAtTime(g,t+d-.02);gn.gain.linearRampToValueAtTime(0,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);return t+d}async function chime(g=.08){await audio();let t=AC.currentTime+.08;[523,659,784,1046].forEach(f=>t=tone(f,.14,g,t+.015));return new Promise(r=>setTimeout(r,800))}async function play(kind,data,g=.09){await audio();const text=prefix+JSON.stringify({kind,data,from:S.hash,t:Date.now()})+suffix;lastTx=text;$('manual').value=text;tx=true;status('唱出 '+kind+'；本機暫停聆聽，避免聽到自己。');await chime();const sy=enc(text);let t=AC.currentTime+.1;for(let i=0;i<sy.length;i++){t=tone(freqs[+sy[i]],sym,g,t);if(i%80===0)prog(i/sy.length)}return new Promise(r=>setTimeout(()=>{tx=false;prog(1);r()},(t-AC.currentTime+.15)*1000))}async function listen(kind,timeout=180000){await audio();tx=false;rx='';db=[];rxNeed=kind;status('專心聆聽 '+kind+'。');return new Promise((res,rej)=>{rxResolve=res;const st=Date.now(),ti=setInterval(()=>prog((Date.now()-st)/timeout),300);setTimeout(()=>{clearInterval(ti);if(rxResolve){rxResolve=null;rej(Error('聆聽逾時'))}},timeout)})}async function selfCheck(){try{$('selfBtn').disabled=true;$('checkStatus').textContent='自我檢查中：先量背景音，再播放短校準音。';await audio();let base=0;for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,80));base+=rms}base/=12;let mx=0,mc=0,done=false,t0=Date.now();const m=setInterval(()=>{mx=Math.max(mx,rms);mc=Math.max(mc,clip);if(Date.now()-t0>5200){clearInterval(m);done=true}},60);await chime(.18);while(!done)await new Promise(r=>setTimeout(r,80));const strong=mx>=.0045&&mc<.08,weak=(mx>=.0025||mx-base>=.0012||mx>=base*1.28)&&mc<.10;S.selfOK=strong||weak;if(S.selfOK){$('syncReady').disabled=false;$('selfBtn').disabled=false;$('checkStatus').textContent=(strong?'✅ 自我檢查通過。':'⚠️ 偵測到微弱回授，已允許繼續。')+'\n本機 HASH：'+S.hash+'\n背景 '+base.toFixed(4)+'，峰值 '+mx.toFixed(4)+'。';toast('可進入同步')}else{$('selfBtn').disabled=false;$('checkStatus').textContent='⚠️ 自我檢查仍未偵測到足夠聲音變化。\n背景 '+base.toFixed(4)+'，峰值 '+mx.toFixed(4)+'。'}}catch(e){$('selfBtn').disabled=false;$('checkStatus').textContent='無法開啟麥克風：'+e.message}}async function discover(){showStage('stageRun');status('互相呼號中。\n兩台裝置會依 HASH 自動錯開：該唱時唱，該聽時聽。');const slots=8,slotMs=1200,mySlot=parseInt(S.hash.slice(-2),16)%slots;const end=Date.now()+90000;while(Date.now()<end&&!S.peer){for(let s=0;s<slots&&!S.peer;s++){if(s===mySlot){await play('HELLO',{hash:S.hash,slot:mySlot},.10)}else{try{const o=await listen('HELLO',slotMs);if(o.data?.hash&&o.data.hash!==S.hash){S.peer=o.data.hash;break}}catch(e){}}await new Promise(r=>setTimeout(r,80))}}if(!S.peer)throw Error('找不到對方 HASH');S.role=S.hash<S.peer?'offer':'answer';status('找到對方 HASH：'+S.peer+'\n本機角色自動判定：'+(S.role==='offer'?'Offer':'Answer'));return S.role}async function duetSync(){try{await audio();const role=await discover();if(role==='offer'){const p=newPC(),rel=p.createDataChannel('rel',{ordered:true}),fast=p.createDataChannel('fast',{ordered:false,maxRetransmits:0});bind(rel,fast);await p.setLocalDescription(await p.createOffer());await waitIce(p);await play('OFFER',await pack(p.localDescription),.09);const ans=await listen('ANSWER',240000);await p.setRemoteDescription(await unpack(ans.data));status('已套用 Answer，等待連線。')}else{const off=await listen('OFFER',240000),p=newPC();p.ondatachannel=e=>{if(e.channel.label==='rel')S.rel=e.channel;if(e.channel.label==='fast')S.fast=e.channel;if(S.rel&&S.fast)bind(S.rel,S.fast)};await p.setRemoteDescription(await unpack(off.data));await p.setLocalDescription(await p.createAnswer());await waitIce(p);await play('ANSWER',await pack(p.localDescription),.09);status('Answer 已唱出，等待連線。')}}catch(e){status('同步失敗：'+e.message)}}function openModal(){if(S.pc&&['connected','completed'].includes(S.pc.iceConnectionState)){if(confirm('確定斷開？'))S.pc.close();return}$('modal').classList.add('show');showStage(S.selfOK?'stageSync':'stageCheck')}function closeModal(){$('modal').classList.remove('show')}function stopAudio(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(AC){AC.close();AC=null}AC=null;rxResolve=null;tx=false}$('connect').onclick=openModal;$('selfBtn').onclick=selfCheck;$('syncReady').onclick=()=>showStage('stageSync');$('syncBtn').onclick=()=>{let n=3;$('syncBtn').disabled=true;const tick=()=>{$('count').textContent=n>0?n:'GO';if(n-->=0)setTimeout(tick,650);else{duetSync();$('syncBtn').disabled=false}};tick()};document.querySelectorAll('.cancel').forEach(b=>b.onclick=()=>{stopAudio();closeModal()});$('replay').onclick=()=>{try{if(!lastTx)return toast('沒有可重播內容');const o=JSON.parse(lastTx.slice(prefix.length,lastTx.indexOf(suffix)));play(o.kind,o.data)}catch(e){toast('重播失敗')}};$('applyManual').onclick=async()=>{try{const txt=$('manual').value.trim(),a=txt.indexOf(prefix),b=txt.indexOf(suffix,a+prefix.length),o=JSON.parse(txt.slice(a+prefix.length,b));if(o.kind==='OFFER'){const p=newPC();p.ondatachannel=e=>{if(e.channel.label==='rel')S.rel=e.channel;if(e.channel.label==='fast')S.fast=e.channel;if(S.rel&&S.fast)bind(S.rel,S.fast)};await p.setRemoteDescription(await unpack(o.data));await p.setLocalDescription(await p.createAnswer());await waitIce(p);await play('ANSWER',await pack(p.localDescription))}else if(o.kind==='ANSWER'&&S.pc)await S.pc.setRemoteDescription(await unpack(o.data));else toast('封包無法套用')}catch(e){toast('文字封包無法套用')}};$('wrap').addEventListener('pointerdown',e=>{if(!e.isPrimary)return;S.drawing=true;const p=pnt(e);S.stroke={id:uid(),tool:S.tool,color:S.color,w:S.w,points:[p]};sendFast({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color})});addEventListener('pointermove',e=>{const p=pnt(e);if(S.drawing&&S.stroke&&e.isPrimary){const pts=S.stroke.points,l=pts.at(-1);if(Math.hypot(p.x-l.x,p.y-l.y)>2){pts.push(p);ctx.live.clearRect(0,0,innerWidth,innerHeight);draw(ctx.live,S.stroke)}}sendFast({type:'CURSOR',id:S.id,p,tool:S.tool,color:S.color})});function up(e){if(!S.drawing||!e.isPrimary)return;S.drawing=false;if(S.stroke?.points.length){S.hist.push(S.stroke);draw(ctx.base,S.stroke);ctx.live.clearRect(0,0,innerWidth,innerHeight);send({type:'STROKE',stroke:S.stroke})}S.stroke=null}addEventListener('pointerup',up);addEventListener('pointercancel',up);$('color').oninput=e=>{S.color=e.target.value;S.tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('pen').onclick=()=>{S.tool='pen';$('pen').classList.add('active');$('eraser').classList.remove('active')};$('eraser').onclick=()=>{S.tool='eraser';$('eraser').classList.add('active');$('pen').classList.remove('active')};$('clear').onclick=()=>{if(confirm('清空白板？')){S.hist=[];size();send({type:'CLEAR'})}};addEventListener('resize',size);size();curs();</script>
