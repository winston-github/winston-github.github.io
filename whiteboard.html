const S={id:uuid(),tool:'pen',color:'#000',w:4,hist:[],stroke:null,drawing:false,cursors:{},pc:null,rel:null,fast:null};const cvs={base:$('base'),live:$('live'),cur:$('cur')},ctx={base:cvs.base.getContext('2d',{alpha:false}),live:cvs.live.getContext('2d'),cur:cvs.cur.getContext('2d')};function resize(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;Object.values(cvs).forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'});Object.values(ctx).forEach(x=>{x.setTransform(d,0,0,d,0,0);x.lineCap='round';x.lineJoin='round'});ctx.base.fillStyle='#fff';ctx.base.fillRect(0,0,w,h);S.hist.forEach(s=>draw(ctx.base,s))}function draw(x,s){if(!s.points?.length)return;x.beginPath();x.strokeStyle=s.tool==='eraser'?'#fff':s.color;x.lineWidth=s.tool==='eraser'?s.w*8:s.w;x.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length-1;i++)x.quadraticCurveTo(s.points[i].x,s.points[i].y,(s.points[i].x+s.points[i+1].x)/2,(s.points[i].y+s.points[i+1].y)/2);if(s.points.length>1)x.lineTo(s.points.at(-1).x,s.points.at(-1).y);x.stroke()}function curs(){ctx.cur.clearRect(0,0,innerWidth,innerHeight);const n=Date.now();for(const[id,c]of Object.entries(S.cursors)){if(n-c.t>3000){delete S.cursors[id];continue}ctx.cur.beginPath();ctx.cur.arc(c.p.x,c.p.y,6,0,7);ctx.cur.fillStyle=c.tool==='eraser'?'#bbb':c.color;ctx.cur.fill();ctx.cur.strokeStyle='#fff';ctx.cur.lineWidth=2;ctx.cur.stroke()}requestAnimationFrame(curs)}function pnt(e){const r=cvs.live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function send(o){if(S.rel?.readyState==='open')S.rel.send(JSON.stringify(o))}function sendFast(o){if(S.fast?.readyState==='open'&&S.fast.bufferedAmount<2048)S.fast.send(JSON.stringify(o))}function onMsg(e){const d=JSON.parse(e.data);if(d.type==='CLEAR'){S.hist=[];resize();toast('對方清空白板')}else if(d.type==='STROKE'&&!S.hist.find(x=>x.id===d.stroke.id)){S.hist.push(d.stroke);draw(ctx.base,d.stroke)}else if(d.type==='SYNC'){const ids=new Set(S.hist.map(x= let stream=null,scanCanvas=document.createElement('canvas'),scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true}),stat={};function resetStat(){stat={frames:0,markers:0,lenBad:0,jsonBad:0,crcBad:0,kindBad:0,lastLen:0,lastKind:'',lastMsg:'',scores:{}}}function line(kind,got,total){const c=Object.keys(got||{}).length,p=total?Math.round(c/total*100):0;return`狀態：找 ${kind}\n已收：${c} / ${total||'?'}（${p}%）\nFrame：${stat.frames}；角點：${stat.markers}/4\nLenBad：${stat.lenBad}；JSONBad：${stat.jsonBad}；CRCBad：${stat.crcBad}；KindBad：${stat.kindBad}\nLast：kind=${stat.lastKind} len=${stat.lastLen}\n角點分數 R/G/B/Y：${stat.scores.tl||0}/${stat.scores.tr||0}/${stat.scores.bl||0}/${stat.scores.br||0}\n${stat.lastMsg||''}`}async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;$('video').style.display='block';code.style.display='none';$('frame').className='';await $('video').play()}function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function score(r,g,b,k){if(k==='tl')return Math.max(0,r*1.4-g*.65-b*.65);if(k==='tr')return Math.max(0,g*1.35-r*.55-b*.55);if(k==='bl')return Math.max(0,b*1.35-r*.55-g*.35);return Math.max(0,(r+g)*.82-b*.75-Math.abs(r-g)*.25)}function corner(img,w,h,k,x0,y0,x1,y1){let sx=w*x0|0,sy=h*y0|0,ex=w*x1|0,ey=h*y1|0,sum=0,xx=0,yy=0,cnt=0;for(let y=sy;y<ey;y+=2)for(let x=sx;x<ex;x+=2){const p=(y*w+x)*4,sc=score(img[p],img[p+1],img[p+2],k);if(sc>70){sum+=sc;xx+=x*sc;yy+=y*sc;cnt++}}stat.scores[k]=Math.round(sum/1000);return cnt<8||sum<1200?null:{x:xx/sum,y:yy/sum}}function markers(img,w,h){let tl=corner(img,w,h,'tl',0,0,.42,.42),tr=corner(img,w,h,'tr',.58,0,1,.42),bl=corner(img,w,h,'bl',0,.58,.42,1),br=corner(img,w,h,'br',.58,.58,1,1),f=[tl,tr,bl,br].filter(Boolean).length;stat.markers=f;return f===4?{tl,tr,bl,br}:null}function interp(c,gx,gy){const qx async function scan(kind){await cam();resetStat();$('next').textContent='重掃本步';hint('拍對方的框');let got={},total=null;return new Promise(res=>{let stop=false;$('next').onclick=()=>{stop=true;res(scan(kind))};const tick=()=>{if(stop)return;const o=readPkt();if(o){if(o.k===kind){got[o.i]=o.b;total=o.n;const c=Object.keys(got).length;progress(c/total,true);$('info').textContent=line(kind,got,total);if(c===total){$('frame').className='ok';stop=true;setTimeout(()=>res(Array.from({length:total},(_,i)=>got[i]).join('')),300);return}}else{stat.kindBad++;stat.lastMsg='讀到 '+o.k+'，但目前要找 '+kind;$('info').textContent=line(kind,got,total)}}else $('info').textContent=line(kind,got,total);requestAnimationFrame(tick)};tick()})}function show(kind,text){stopCam();const cs=chunks(kind,text);hint('讓對方拍這個框');let i=0,timer=null;const step=()=>{drawPkt(cs[i]);$('info').textContent=`顯示 ${kind} ${i+1}/${cs.length}\n請對方拍框內光學碼。\n每包 payload 已降到 ${CAP}，避免 packet too large。`;progress((i+1)/cs.length,false);i=(i+1)%cs.length;timer=setTimeout(step,1050)};step();return()=>clearTimeout(timer)}function waitNext(label){$('next').textContent=label;return new Promise(r=>$('next').onclick=()=>r())}function openModal(){if(S.pc&&['connected','completed'].includes(S.pc.iceConnectionState)){if(confirm('確定斷開？'))S.pc.close();return}$('modal').classList.add('show');progress(0,true)}function closeModal(){clearTimeout(window.showTimer);stopCam();$('modal').classList.remove('show')}async function runHost(){openModal();try{hint('讓對方拍這個框');const p=pc(),rel=p.createDataChannel('rel',{ordered:true}),fast=p.createDataChannel('fast',{ordered:false,maxRetransmits:0});bind(rel,fast);await p.setLocalDescription(await p.createOffer());await waitIce(p);const stop=show('OFFER',await pack(p.localDescription));await waitNext('對方拍完，下一步');stop();hint('拍對方的框');const ans=await scan('ANSWER');await p.setRemoteDescription(await unpack(ans));hint('等待連線完成')}catch(e){hint('失敗: '+e.message)}}async function runJoin(){openModal();try{hint('拍對方
