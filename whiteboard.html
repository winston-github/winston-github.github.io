<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>共用白板</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --ink:#1a1a2e;--paper:#fafaf7;--accent:#e84855;--blue:#3a86ff;--muted:#9a9a8a;
  --panel:#ffffffee;--shadow:0 4px 24px rgba(0,0,0,.12);--r:12px;--green:#2ecc71;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#e8e8e4;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;touch-action:none;}

/* ── Canvas & Viewport layers ─────────────────────────────── */
#gridCanvas{position:fixed;top:0;left:0;pointer-events:none;z-index:0}
.draw-layer{position:fixed;top:0;left:0;pointer-events:none;z-index:1;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;z-index:2}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#textLayer{position:absolute;top:0;left:0;pointer-events:none}
#uiLayer{position:fixed;top:0;left:0;pointer-events:none;z-index:10}

/* ── Text editing ──────────────────────────────── */
#textEditorWrap{
  position:fixed;display:none;z-index:50;
}
#textEditorBox{
  position:relative;
  border:2px solid var(--blue);
  border-radius:8px;
  background:rgba(255,255,255,.98);
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  overflow:visible;
  min-width:80px;
  min-height:40px;
}
#textEditor{
  display:block;
  border:none;
  border-radius:6px;
  background:transparent;
  font-size:18px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  color:var(--ink);outline:none;resize:none;padding:8px 10px;
  white-space:pre-wrap;word-break:break-word;overflow:hidden;
  line-height:1.5;cursor:text;
  width:100%;height:100%;
  -webkit-user-select:text;user-select:text;
}
/* 8 resize handles */
.res-handle{
  position:absolute;width:10px;height:10px;background:#3a86ff;border:2px solid #fff;
  border-radius:2px;z-index:60;box-shadow:0 1px 4px rgba(0,0,0,.25);
  touch-action:none;
}
.res-handle[data-h="nw"]{left:-6px;top:-6px;cursor:nw-resize;}
.res-handle[data-h="n"] {left:calc(50% - 5px);top:-6px;cursor:n-resize;}
.res-handle[data-h="ne"]{right:-6px;top:-6px;cursor:ne-resize;}
.res-handle[data-h="e"] {right:-6px;top:calc(50% - 5px);cursor:e-resize;}
.res-handle[data-h="se"]{right:-6px;bottom:-6px;cursor:se-resize;}
.res-handle[data-h="s"] {left:calc(50% - 5px);bottom:-6px;cursor:s-resize;}
.res-handle[data-h="sw"]{left:-6px;bottom:-6px;cursor:sw-resize;}
.res-handle[data-h="w"] {left:-6px;top:calc(50% - 5px);cursor:w-resize;}

#textEditorTools{
  display:flex;gap:6px;margin-top:6px;align-items:center;
}
#textConfirm{
  border:none;border-radius:6px;padding:6px 14px;
  background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 8px rgba(46,204,113,.4);transition:transform .1s;
  touch-action:manipulation;
}
#textConfirm:active{transform:scale(.95)}
#textCancel{
  border:none;border-radius:6px;padding:6px 12px;
  background:rgba(0,0,0,.08);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;
  touch-action:manipulation;
}
#textFontSize{
  border:1.5px solid rgba(0,0,0,.12);border-radius:6px;padding:5px 8px;
  font-size:12px;font-weight:700;color:var(--ink);background:white;cursor:pointer;
  outline:none;touch-action:manipulation;
}

/* ── Toolbar ──────────────────────────────────── */
#tb{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:3px;
  background:var(--panel);border:1px solid rgba(0,0,0,.1);
  border-radius:999px;padding:7px 10px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px);z-index:30;flex-wrap:nowrap;max-width:calc(100vw - 20px);
  overflow-x:auto;overflow-y:visible;scrollbar-width:none;touch-action:pan-x;
}
#tb::-webkit-scrollbar{display:none}
.tbtn{
  border:none;background:none;border-radius:999px;
  width:38px;height:38px;cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .08s;color:var(--ink);flex-shrink:0;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.tbtn:hover{background:rgba(0,0,0,.06)}
.tbtn:active{transform:scale(.88)}
.tbtn.sel{background:var(--ink);color:#fff}
.tbtn.sel2{background:var(--accent);color:#fff}
.tbtn.selg{background:#4a9a6a;color:#fff}
.sep{width:1px;height:26px;background:rgba(0,0,0,.1);margin:0 2px;flex-shrink:0}

/* Color swatch */
#colorSwatch{
  width:28px;height:28px;border-radius:50%;border:3px solid rgba(0,0,0,.15);
  cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;
  background:#1a1a2e;transition:transform .1s;touch-action:manipulation;
}
#colorSwatch:hover{transform:scale(1.1)}
#colorpick{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── Brush size ──────────────────────────────── */
#sizeCtrl{
  display:flex;align-items:center;gap:2px;flex-shrink:0;
  background:rgba(0,0,0,.04);border-radius:999px;padding:3px 4px;
}
.szBtn{
  border:none;background:none;border-radius:50%;
  width:28px;height:28px;cursor:pointer;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);transition:background .1s;flex-shrink:0;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.szBtn:hover{background:rgba(0,0,0,.08)}
.szBtn:active{background:rgba(0,0,0,.14)}
#szLabel{font-size:11px;font-weight:700;color:var(--muted);min-width:26px;text-align:center;flex-shrink:0}
#szDotPreview{border-radius:50%;background:var(--ink);flex-shrink:0;transition:width .15s,height .15s}

/* ─── Right-top area ────────────────────────── */
#topRight{
  position:fixed;top:14px;right:16px;z-index:30;
  display:flex;align-items:center;gap:8px;
}
#pill{
  background:var(--panel);border:1px solid rgba(0,0,0,.1);
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px);font-size:12px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;
  transition:background .15s;
}
#pill:hover{background:rgba(255,255,255,.95)}
#dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.3s;flex-shrink:0}
#dot.live{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.2);animation:pulse 2s infinite}
#dot.wait{background:#f39c12;box-shadow:0 0 0 3px rgba(243,156,18,.2)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(46,204,113,.2)}50%{box-shadow:0 0 0 7px rgba(46,204,113,.06)}}

/* ── Shape snap indicator ─────────────────────── */
#snapIndicator{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:rgba(58,134,255,.9);color:#fff;
  border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:29;
  backdrop-filter:blur(8px);
}
#snapIndicator.show{opacity:1}

/* ── Modal ────────────────────────────────────── */
#modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(26,26,46,.45);backdrop-filter:blur(10px);padding:20px;
}
#modal.show{display:flex}
#card{
  background:var(--paper);border-radius:22px;
  padding:30px 26px 26px;width:100%;max-width:390px;
  box-shadow:0 24px 80px rgba(0,0,0,.22);position:relative;
}
#card h2{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-bottom:5px}
#card .sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
#tabs{display:flex;gap:5px;margin-bottom:20px}
.tab{flex:1;border:none;border-radius:999px;padding:9px;font-size:13px;font-weight:700;
  cursor:pointer;background:rgba(0,0,0,.05);color:var(--muted);transition:.18s;touch-action:manipulation;}
.tab.active{background:var(--ink);color:#fff}
.panel{display:none}.panel.show{display:block}
.rdisplay{background:var(--ink);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.rlabel{font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:8px}
.rcode{font-size:48px;font-weight:900;color:#fff;letter-spacing:.2em;line-height:1;font-variant-numeric:tabular-nums}
.rsub{font-size:11px;color:rgba(255,255,255,.35);margin-top:8px}
.wrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);padding:8px 0}
.spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--ink);
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ilabel{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
#roomInput{
  width:100%;border:2px solid rgba(0,0,0,.1);border-radius:10px;
  padding:14px;font-size:34px;font-weight:900;letter-spacing:.2em;
  text-align:center;color:var(--ink);background:transparent;outline:none;
  transition:border-color .18s;font-variant-numeric:tabular-nums;
}
#roomInput:focus{border-color:var(--blue)}
#joinBtn{
  width:100%;border:none;border-radius:10px;padding:14px;
  font-size:14px;font-weight:800;cursor:pointer;
  background:var(--blue);color:#fff;margin-top:10px;transition:.18s;touch-action:manipulation;
}
#joinBtn:hover{opacity:.9}#joinBtn:active{transform:scale(.98)}
#joinBtn:disabled{opacity:.35;cursor:default}
#mstatus{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;min-height:16px}
#mstatus.err{color:var(--accent)}#mstatus.ok{color:#2ecc71}
#xbtn{position:absolute;top:14px;right:14px;border:none;background:rgba(0,0,0,.06);
  border-radius:999px;width:30px;height:30px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:manipulation;}
#xbtn:hover{background:rgba(0,0,0,.11)}
.concard{background:rgba(46,204,113,.08);border:1.5px solid rgba(46,204,113,.25);
  border-radius:12px;padding:18px;text-align:center}
.concard strong{display:block;font-size:16px;font-weight:800;color:#27ae60;margin-bottom:5px}
.concard span{font-size:12px;color:var(--muted)}

#modalFooter{
  display:flex;align-items:center;justify-content:center;margin-top:18px;
  padding-top:14px;border-top:1px solid rgba(0,0,0,.07);gap:8px;
}
#langToggle{
  border:1.5px solid rgba(0,0,0,.15);border-radius:999px;padding:5px 16px;
  font-size:12px;font-weight:700;cursor:pointer;background:transparent;
  color:var(--muted);transition:.18s;touch-action:manipulation;
}
#langToggle:hover{background:rgba(0,0,0,.05);color:var(--ink)}
#langLabel{font-size:11px;color:var(--muted)}

/* ── Toast ────────────────────────────────────── */
#toast{
  position:fixed;z-index:200;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;
  border-radius:999px;padding:9px 20px;font-size:12px;font-weight:600;
  opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Text object divs */
.textObj{
  position:absolute;cursor:move;white-space:pre;
  line-height:1.5;pointer-events:all;border-radius:4px;
  -webkit-user-select:none;user-select:none;
  overflow:hidden;
}
.textObj.selected{outline:2px dashed #3a86ff;outline-offset:4px}
</style>
</head>
<body>

<canvas id="gridCanvas"></canvas>
<!-- 將巨型 Canvas 改為基於視窗大小的雙層渲染引擎 -->
<canvas id="baseCanvas" class="draw-layer"></canvas>
<canvas id="activeCanvas" class="draw-layer"></canvas>

<div id="viewport">
  <div id="canvas">
    <div id="textLayer"></div>
  </div>
</div>
<canvas id="uiLayer"></canvas>

<!-- Text editor with 8 resize handles -->
<div id="textEditorWrap">
  <div id="textEditorBox">
    <textarea id="textEditor" spellcheck="false"></textarea>
    <div class="res-handle" data-h="nw"></div>
    <div class="res-handle" data-h="n"></div>
    <div class="res-handle" data-h="ne"></div>
    <div class="res-handle" data-h="e"></div>
    <div class="res-handle" data-h="se"></div>
    <div class="res-handle" data-h="s"></div>
    <div class="res-handle" data-h="sw"></div>
    <div class="res-handle" data-h="w"></div>
  </div>
  <div id="textEditorTools">
    <select id="textFontSize">
      <option value="12">12px</option>
      <option value="16">16px</option>
      <option value="20" selected>20px</option>
      <option value="28">28px</option>
      <option value="36">36px</option>
      <option value="48">48px</option>
    </select>
    <button id="textConfirm" data-i="confirm">✓ 確認</button>
    <button id="textCancel" data-i="cancel">✕</button>
  </div>
</div>

<!-- Top-right: pill + connect -->
<div id="topRight">
  <div id="pill">
    <div id="dot"></div>
    <span id="statustext" data-i="offline">未連線</span>
  </div>
</div>

<!-- Snap indicator -->
<div id="snapIndicator"></div>

<!-- Toolbar -->
<div id="tb">
  <button class="tbtn" id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
  <button class="tbtn" id="redoBtn" title="Redo (Ctrl+Y)">↪</button>
  <div class="sep"></div>
  <div id="colorSwatch" title="Color">
    <input id="colorpick" type="color" value="#1a1a2e">
  </div>
  <div class="sep"></div>
  <button class="tbtn sel" id="tpen">✏️</button>
  <button class="tbtn" id="tline">╱</button>
  <button class="tbtn" id="trect">▭</button>
  <button class="tbtn" id="tellipse">◯</button>
  <button class="tbtn" id="ttext">T</button>
  <button class="tbtn" id="teraser">🧹</button>
  <div class="sep"></div>
  <div id="sizeCtrl">
    <button class="szBtn" id="szMinus">−</button>
    <div id="szDotPreview" style="width:8px;height:8px"></div>
    <span id="szLabel">4</span>
    <button class="szBtn" id="szPlus">+</button>
  </div>
  <div class="sep"></div>
  <button class="tbtn" id="tgrid" title="Toggle Grid">⊞</button>
  <button class="tbtn" id="tselect">↖</button>
  <button class="tbtn" id="tclear">🗑️</button>
</div>

<!-- Connect modal -->
<div id="modal">
  <div id="card">
    <button id="xbtn">✕</button>
    <h2 data-i="modal_title">建立連線</h2>
    <p class="sub" data-i="modal_sub">Host 產生房間碼，Visitor 輸入後即可共用白板。</p>
    <div id="tabs">
      <button class="tab active" id="tabH" data-i="tab_host">🖥 Host</button>
      <button class="tab" id="tabV" data-i="tab_visitor">📱 Visitor</button>
    </div>
    <div id="hpanel" class="panel show">
      <div class="rdisplay">
        <div class="rlabel" data-i="room_code">房間碼</div>
        <div class="rcode" id="rcode">……</div>
        <div class="rsub" id="rsub" data-i="initializing">初始化中…</div>
      </div>
      <div class="wrow" id="wrow"><div class="spin"></div><span data-i="waiting">等待 Visitor 加入…</span></div>
    </div>
    <div id="vpanel" class="panel">
      <div class="ilabel" data-i="enter_code">輸入 Host 的房間碼</div>
      <input id="roomInput" maxlength="6" placeholder="123456" autocomplete="off" inputmode="numeric">
      <button id="joinBtn" disabled data-i="join">加入白板</button>
    </div>
    <div id="mstatus"></div>
    <div id="modalFooter">
      <span id="langLabel" data-i="lang_label">語言 / Language</span>
      <button id="langToggle">EN / 中文</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   LANGUAGE
═══════════════════════════════════════════════════════ */
const STRINGS={
  zh:{
    offline:'未連線', waiting_visitor:'等待 Visitor…', connected:'已連線 ✓',
    disconnected:'連線斷開',
    modal_title:'建立連線',
    modal_sub:'Host 產生房間碼，Visitor 輸入後即可共用白板。',
    tab_host:'🖥 Host', tab_visitor:'📱 Visitor',
    room_code:'房間碼',
    initializing:'初始化中…',
    waiting:'等待 Visitor 加入…',
    enter_code:'輸入 Host 的房間碼',
    join:'加入白板',
    confirm:'✓ 確認', cancel:'✕ 取消',
    lang_label:'語言 / Language',
    clear_confirm:'確定清空白板？',
    connected_toast:'🎉 連線成功！',
    disconnected_toast:'連線已斷開',
    cleared_toast:'對方清空了白板',
    visitor_joined:'✓ Visitor 已加入！',
    connecting:'連線中…',
    timeout:'逾時，請確認房間碼正確',
    snap_line:'📐 識別為直線',
    snap_circle:'⚪ 識別為正圓',
    snap_ellipse:'◯ 識別為橢圓',
    snap_square:'⬛ 識別為正方形',
    snap_rect:'▭ 識別為矩形',
    snap_line2:'📐 吸附為直線',
    snap_square2:'⬛ 吸附為正方形',
    snap_rect2:'▭ 吸附為矩形',
    snap_circle2:'⚪ 吸附為正圓',
    snap_ellipse2:'◯ 吸附為橢圓',
    already_connected:'✓ 已連線中',
    back:'點 ✕ 回到白板',
    share_code:'把這個碼告訴 Visitor',
    grid_on:'網格已開啟',
    grid_off:'網格已關閉',
  },
  en:{
    offline:'Offline', waiting_visitor:'Waiting for Visitor…', connected:'Connected ✓',
    disconnected:'Disconnected',
    modal_title:'Connect',
    modal_sub:'Host generates a room code; Visitor enters it to share the whiteboard.',
    tab_host:'🖥 Host', tab_visitor:'📱 Visitor',
    room_code:'ROOM CODE',
    initializing:'Initializing…',
    waiting:'Waiting for Visitor…',
    enter_code:"Enter Host's Room Code",
    join:'Join Whiteboard',
    confirm:'✓ Done', cancel:'✕ Cancel',
    lang_label:'Language / 語言',
    clear_confirm:'Clear the whiteboard?',
    connected_toast:'🎉 Connected!',
    disconnected_toast:'Connection closed',
    cleared_toast:'Peer cleared the whiteboard',
    visitor_joined:'✓ Visitor joined!',
    connecting:'Connecting…',
    timeout:'Timed out. Check the room code.',
    snap_line:'📐 Recognized: Line',
    snap_circle:'⚪ Recognized: Circle',
    snap_ellipse:'◯ Recognized: Ellipse',
    snap_square:'⬛ Recognized: Square',
    snap_rect:'▭ Recognized: Rectangle',
    snap_line2:'📐 Snapped: Line',
    snap_square2:'⬛ Snapped: Square',
    snap_rect2:'▭ Snapped: Rectangle',
    snap_circle2:'⚪ Snapped: Circle',
    snap_ellipse2:'◯ Snapped: Ellipse',
    already_connected:'✓ Connected',
    back:'Tap ✕ to return',
    share_code:'Share this code with Visitor',
    grid_on:'Grid on',
    grid_off:'Grid off',
  }
};

function detectLang(){
  try{const s=localStorage.getItem('wb_lang');if(s==='zh'||s==='en')return s}catch(e){}
  const langs=(navigator.languages||[navigator.language||'en']).map(l=>l.toLowerCase());
  for(const l of langs){if(l.startsWith('zh'))return 'zh';if(l.startsWith('en'))return 'en'}
  return 'en';
}
let lang=detectLang();
const t=k=>STRINGS[lang][k]||STRINGS.en[k]||k;

function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el=>{
    const key=el.getAttribute('data-i');if(el.tagName==='INPUT')return;
    el.textContent=t(key);
  });
  $('statustext').textContent=currentStatusKey?t(currentStatusKey):t('offline');
  $('langToggle').textContent=lang==='zh'?'Switch to EN':'切換中文';
  document.documentElement.lang=lang==='zh'?'zh-TW':'en';
}
let currentStatusKey='offline';
function setStatus(key,cls){currentStatusKey=key;$('statustext').textContent=t(key);$('dot').className=cls||''}

/* ═══════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
let _tt;
const toast=m=>{$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>$('toast').classList.remove('show'),3000)};
const setMS=(txt,c)=>{$('mstatus').textContent=txt;$('mstatus').className=c||''};
const uid=()=>crypto.randomUUID();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ═══════════════════════════════════════════════════════
   CAMERA
═══════════════════════════════════════════════════════ */
const cam={x:0,y:0,z:1};
function initCam(){cam.x=window.innerWidth/2;cam.y=window.innerHeight/2;cam.z=1;applyCam()}
function applyCam(){
  $('canvas').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  redrawGrid();
  redrawBaseCanvas();
  redrawActiveCanvas();
  redrawUI();
}
function s2w(sx,sy){return{x:(sx-cam.x)/cam.z,y:(sy-cam.y)/cam.z}}
function w2s(wx,wy){return{x:wx*cam.z+cam.x,y:wy*cam.z+cam.y}}

/* ═══════════════════════════════════════════════════════
   GRID — default OFF
═══════════════════════════════════════════════════════ */
let gridVisible=false;
const gc=$('gridCanvas');
const gctx=gc.getContext('2d');
function resizeGrid(){
  const dpr=window.devicePixelRatio||1;
  gc.width=window.innerWidth*dpr;gc.height=window.innerHeight*dpr;
  gc.style.width=window.innerWidth+'px';gc.style.height=window.innerHeight+'px';
  gctx.scale(dpr,dpr);
}
function redrawGrid(){
  const W=window.innerWidth,H=window.innerHeight;
  gctx.clearRect(0,0,W,H);
  if(!gridVisible)return;
  const spacing=24*cam.z;
  const ox=((cam.x%spacing)+spacing)%spacing,oy=((cam.y%spacing)+spacing)%spacing;
  gctx.strokeStyle='rgba(0,0,0,.08)';gctx.lineWidth=0.5;
  gctx.beginPath();
  for(let x=ox;x<W;x+=spacing){gctx.moveTo(x,0);gctx.lineTo(x,H)}
  for(let y=oy;y<H;y+=spacing){gctx.moveTo(0,y);gctx.lineTo(W,y)}
  gctx.stroke();
  gctx.strokeStyle='rgba(0,0,0,.18)';gctx.lineWidth=1;
  gctx.beginPath();
  const ax=cam.x,ay=cam.y;
  if(ax>=0&&ax<=W){gctx.moveTo(ax,0);gctx.lineTo(ax,H)}
  if(ay>=0&&ay<=H){gctx.moveTo(0,ay);gctx.lineTo(W,ay)}
  gctx.stroke();
}
$('tgrid').addEventListener('click',()=>{
  gridVisible=!gridVisible;
  $('tgrid').classList.toggle('selg',gridVisible);
  redrawGrid();
  toast(t(gridVisible?'grid_on':'grid_off'));
});

/* ═══════════════════════════════════════════════════════
   DRAW CANVAS (絲滑雙層渲染引擎 & 真實橡皮擦)
═══════════════════════════════════════════════════════ */
const bc=$('baseCanvas');
const bctx=bc.getContext('2d');
const ac=$('activeCanvas');
const actx=ac.getContext('2d');

function resizeDrawCanvas(){
  const dpr=window.devicePixelRatio||1;
  const W=window.innerWidth, H=window.innerHeight;
  
  bc.width=W*dpr; bc.height=H*dpr;
  bc.style.width=W+'px'; bc.style.height=H+'px';
  bctx.scale(dpr,dpr);

  ac.width=W*dpr; ac.height=H*dpr;
  ac.style.width=W+'px'; ac.style.height=H+'px';
  actx.scale(dpr,dpr);
}

function redrawBaseCanvas(){
  bctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  bctx.save();
  bctx.translate(cam.x, cam.y);
  bctx.scale(cam.z, cam.z);
  for(const o of objects) renderObj(bctx, o);
  bctx.restore();
}

function redrawActiveCanvas(){
  actx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(!liveObj && Object.keys(remoteLiveStrokes).length === 0) return;
  
  actx.save();
  actx.translate(cam.x, cam.y);
  actx.scale(cam.z, cam.z);
  
  if(liveObj && liveObj.color !== 'eraser') renderObj(actx, liveObj);
  for(const o of Object.values(remoteLiveStrokes)) {
    if (o.color !== 'eraser') renderObj(actx, o);
  }
  actx.restore();

  // 橡皮擦：實時所見即所得擦除底層 (Destination Out)
  if ((liveObj && liveObj.color === 'eraser') || Object.values(remoteLiveStrokes).some(o => o.color === 'eraser')) {
    bctx.save();
    bctx.translate(cam.x, cam.y);
    bctx.scale(cam.z, cam.z);
    if(liveObj && liveObj.color === 'eraser') renderObj(bctx, liveObj);
    for(const o of Object.values(remoteLiveStrokes)) {
      if (o.color === 'eraser') renderObj(bctx, o);
    }
    bctx.restore();
  }
}

function styleCtx(ctx,o){
  if(o.color === 'eraser' || o._eraser){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = '#000'; // 顏色不重要，直接破壞像素
    ctx.lineWidth = o.w || 20;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = o.color || '#1a1a2e';
    ctx.lineWidth = o.w || 4;
  }
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.fillStyle='transparent';
}

function renderObj(ctx,o){
  if(o.type==='stroke') drawStroke(ctx,o);
  else if(o.type==='line') drawLine(ctx,o);
  else if(o.type==='rect') drawRect(ctx,o);
  else if(o.type==='ellipse') drawEllipse(ctx,o);
}
function drawStroke(ctx,o){
  if(!o.pts?.length)return;
  styleCtx(ctx,o);
  ctx.beginPath();ctx.moveTo(o.pts[0].x,o.pts[0].y);
  for(let i=1;i<o.pts.length-1;i++){
    const mx=(o.pts[i].x+o.pts[i+1].x)/2,my=(o.pts[i].y+o.pts[i+1].y)/2;
    ctx.quadraticCurveTo(o.pts[i].x,o.pts[i].y,mx,my);
  }
  if(o.pts.length>1)ctx.lineTo(o.pts.at(-1).x,o.pts.at(-1).y);
  ctx.stroke();
}
function drawLine(ctx,o){styleCtx(ctx,o);ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}
function drawRect(ctx,o){styleCtx(ctx,o);ctx.strokeRect(o.x,o.y,o.w2,o.h2)}
function drawEllipse(ctx,o){
  styleCtx(ctx,o);ctx.beginPath();
  ctx.ellipse(o.cx,o.cy,Math.max(0.01,Math.abs(o.rx)),Math.max(0.01,Math.abs(o.ry)),0,0,Math.PI*2);
  ctx.stroke();
}

let objects=[];
let selectedId=null;
let liveObj=null;
function objById(id){return objects.find(o=>o.id===id)}

/* ═══════════════════════════════════════════════════════
   UNDO / REDO
═══════════════════════════════════════════════════════ */
const MAX_HISTORY=30;
let undoStack=[],redoStack=[];
function snapshot(){
  undoStack.push(JSON.stringify(objects));
  if(undoStack.length>MAX_HISTORY)undoStack.shift();
  redoStack=[];updateUndoRedo();
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(JSON.stringify(objects));
  if(redoStack.length>MAX_HISTORY)redoStack.shift();
  objects=JSON.parse(undoStack.pop());
  redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();updateUndoRedo();
  send({type:'SYNC_ALL',objs:objects});
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(JSON.stringify(objects));
  objects=JSON.parse(redoStack.pop());
  redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();updateUndoRedo();
  send({type:'SYNC_ALL',objs:objects});
}
function updateUndoRedo(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}
$('undoBtn').addEventListener('click',undo);
$('redoBtn').addEventListener('click',redo);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo()}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo()}
});
updateUndoRedo();

/* ═══════════════════════════════════════════════════════
   TEXT OBJECTS (DOM)
═══════════════════════════════════════════════════════ */
const textLayer=$('textLayer');
function renderTextObjects(){
  const existing=new Map([...textLayer.children].map(d=>[d.dataset.id,d]));
  const current=new Set(objects.filter(o=>o.type==='text').map(o=>o.id));
  for(const [id,div] of existing)if(!current.has(id))div.remove();
  for(const o of objects){
    if(o.type!=='text')continue;
    let div=textLayer.querySelector(`[data-id="${o.id}"]`);
    if(!div){
      div=document.createElement('div');
      div.dataset.id=o.id;div.className='textObj';
      textLayer.appendChild(div);
      bindTextDiv(div,o);
    }
    div.textContent=o.text||'';
    div.style.left=o.x+'px';div.style.top=o.y+'px';
    div.style.width=o.boxW?(o.boxW+'px'):'';
    div.style.height=o.boxH?(o.boxH+'px'):'';
    div.style.fontSize=(o.fontSize||20)+'px';
    div.style.color=o.color||'#1a1a2e';
    div.style.fontFamily="'Helvetica Neue',Helvetica,Arial,sans-serif";
    div.style.fontWeight=o.bold?'700':'400';
    div.style.minWidth='40px';
    div.style.whiteSpace=o.boxW?'pre-wrap':'pre';
    div.classList.toggle('selected',o.id===selectedId);
    div.style.visibility=(editingObj&&editingObj.id===o.id)?'hidden':'visible';
  }
}

function bindTextDiv(div,o){
  let didMove=false,startX,startY,ox,oy;
  let pdown=false,pdownTime=0,pdownId=null;

  div.addEventListener('pointerdown',e=>{
    if(activeTool!=='select'&&activeTool!=='text')return;
    e.stopPropagation();
    pdown=true;pdownId=e.pointerId;pdownTime=Date.now();
    didMove=false;startX=e.clientX;startY=e.clientY;ox=o.x;oy=o.y;
    div.setPointerCapture(e.pointerId);
    selectObj(o.id);
  });
  div.addEventListener('pointermove',e=>{
    if(!pdown||e.pointerId!==pdownId)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.hypot(dx,dy)>6){
      didMove=true;
      o.x=ox+dx/cam.z;o.y=oy+dy/cam.z;
      renderTextObjects();redrawUI();
    }
  });
  div.addEventListener('pointerup',e=>{
    if(!pdown||e.pointerId!==pdownId)return;
    pdown=false;
    if(didMove){snapshot();send({type:'UPD',o})}
    else if(Date.now()-pdownTime<400){openTextEditor(o)}
  });
  div.addEventListener('pointercancel',()=>{pdown=false});
}

/* ─── Text editor with resize handles ─────────── */
const teWrap=$('textEditorWrap');
const teBox=$('textEditorBox');
const te=$('textEditor');
const tc=$('textConfirm');
const tcancel=$('textCancel');
const tfs=$('textFontSize');
let editingObj=null;
let editorCommitting=false;

let edX=0,edY=0,edW=200,edH=60;

function applyEditorGeometry(){
  teWrap.style.left=edX+'px';
  teWrap.style.top=edY+'px';
  teBox.style.width=edW+'px';
  teBox.style.height=edH+'px';
  te.style.width=edW+'px';
  te.style.height=edH+'px';
}

function openTextEditor(o){
  if(editingObj)closeTextEditor(true);
  editingObj=o;

  const sp=w2s(o.x,o.y);
  edX=sp.x; edY=sp.y;
  edW=o.boxW?(o.boxW*cam.z):Math.max(200,40*cam.z);
  edH=o.boxH?(o.boxH*cam.z):Math.max(60,30*cam.z);

  teWrap.style.display='block';
  applyEditorGeometry();

  te.style.fontSize=(o.fontSize||20)*cam.z+'px';
  te.style.color=o.color||'#1a1a2e';
  te.style.lineHeight='1.5';
  tfs.value=o.fontSize||20;
  te.value=o.text||'';
  renderTextObjects();
  te.focus();
  te.select();
  tc.textContent=t('confirm');
  tcancel.textContent=t('cancel');
}

function closeTextEditor(commit){
  if(!editingObj)return;
  if(commit){
    const txt=te.value;
    editingObj.boxW=edW/cam.z;
    editingObj.boxH=edH/cam.z;
    editingObj.x=(edX-cam.x)/cam.z;
    editingObj.y=(edY-cam.y)/cam.z;
    if(txt.trim()!==''){
      snapshot();
      editingObj.text=txt;
      editingObj.fontSize=parseInt(tfs.value)||20;
      send({type:'UPD',o:editingObj});
    } else {
      snapshot();
      objects=objects.filter(o=>o.id!==editingObj.id);
      send({type:'DEL',id:editingObj.id});
    }
  }
  editingObj=null;
  teWrap.style.display='none';
  renderTextObjects();
  redrawBaseCanvas();
}

teBox.querySelectorAll('.res-handle').forEach(handle=>{
  const dir=handle.dataset.h;
  let startPX,startPY,startEdX,startEdY,startEdW,startEdH;
  let resizing=false,rpid=null;

  handle.addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    resizing=true;rpid=e.pointerId;
    handle.setPointerCapture(e.pointerId);
    startPX=e.clientX;startPY=e.clientY;
    startEdX=edX;startEdY=edY;startEdW=edW;startEdH=edH;
  });
  handle.addEventListener('pointermove',e=>{
    if(!resizing||e.pointerId!==rpid)return;
    e.stopPropagation();e.preventDefault();
    const dx=e.clientX-startPX,dy=e.clientY-startPY;
    let nx=startEdX,ny=startEdY,nw=startEdW,nh=startEdH;
    if(dir.includes('e'))nw=Math.max(80,startEdW+dx);
    if(dir.includes('s'))nh=Math.max(40,startEdH+dy);
    if(dir.includes('w')){nw=Math.max(80,startEdW-dx);nx=startEdX+startEdW-nw}
    if(dir.includes('n')){nh=Math.max(40,startEdH-dy);ny=startEdY+startEdH-nh}
    edX=nx;edY=ny;edW=nw;edH=nh;
    applyEditorGeometry();
  });
  handle.addEventListener('pointerup',e=>{
    if(e.pointerId!==rpid)return;
    resizing=false;rpid=null;
  });
  handle.addEventListener('pointercancel',e=>{
    if(e.pointerId!==rpid)return;
    resizing=false;rpid=null;
  });
});

let edDragging=false,edDragPid=null,edDragStartX,edDragStartY,edDragX0,edDragY0;
teBox.addEventListener('pointerdown',e=>{
  if(e.target===te||e.target.classList.contains('res-handle'))return;
  e.stopPropagation();e.preventDefault();
  edDragging=true;edDragPid=e.pointerId;
  teBox.setPointerCapture(e.pointerId);
  edDragStartX=e.clientX;edDragStartY=e.clientY;
  edDragX0=edX;edDragY0=edY;
});
teBox.addEventListener('pointermove',e=>{
  if(!edDragging||e.pointerId!==edDragPid)return;
  e.stopPropagation();
  edX=edDragX0+(e.clientX-edDragStartX);
  edY=edDragY0+(e.clientY-edDragStartY);
  applyEditorGeometry();
});
teBox.addEventListener('pointerup',e=>{if(e.pointerId===edDragPid){edDragging=false;edDragPid=null}});
teBox.addEventListener('pointercancel',e=>{if(e.pointerId===edDragPid){edDragging=false;edDragPid=null}});

tfs.addEventListener('change',()=>{
  if(editingObj)editingObj.fontSize=parseInt(tfs.value)||20;
  te.style.fontSize=(parseInt(tfs.value)||20)*cam.z+'px';
});
tc.addEventListener('pointerdown',e=>{e.stopPropagation();editorCommitting=true});
tc.addEventListener('click',()=>{closeTextEditor(true);editorCommitting=false});
tcancel.addEventListener('pointerdown',e=>{e.stopPropagation();editorCommitting=true});
tcancel.addEventListener('click',()=>{closeTextEditor(false);editorCommitting=false});
te.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeTextEditor(false)}});
te.addEventListener('blur',()=>{
  setTimeout(()=>{
    if(!editorCommitting&&document.activeElement!==tc&&document.activeElement!==tcancel&&document.activeElement!==tfs){
      closeTextEditor(true);
    }
    editorCommitting=false;
  },200);
});

function createTextObj(wx,wy){
  snapshot();
  const fontSize=parseInt(tfs.value)||20;
  const o={id:uid(),type:'text',x:wx,y:wy,text:'',color:S.color,fontSize,boxW:200/cam.z,boxH:60/cam.z};
  objects.push(o);
  renderTextObjects();
  openTextEditor(o);
}

/* ═══════════════════════════════════════════════════════
   SELECTION & UI LAYER
═══════════════════════════════════════════════════════ */
const uiCanvas=$('uiLayer');
const uictx=uiCanvas.getContext('2d');
function resizeUI(){
  const dpr=window.devicePixelRatio||1;
  uiCanvas.width=window.innerWidth*dpr;uiCanvas.height=window.innerHeight*dpr;
  uiCanvas.style.width=window.innerWidth+'px';uiCanvas.style.height=window.innerHeight+'px';
  uictx.scale(dpr,dpr);
}
function redrawUI(){
  uictx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(!selectedId)return;
  const o=objById(selectedId);if(!o)return;
  const bbox=getBBox(o);if(!bbox)return;
  const p1=w2s(bbox.x,bbox.y),p2=w2s(bbox.x+bbox.w,bbox.y+bbox.h);
  uictx.save();
  uictx.strokeStyle='#3a86ff';uictx.lineWidth=1.5;uictx.setLineDash([5,4]);
  uictx.strokeRect(p1.x-6,p1.y-6,p2.x-p1.x+12,p2.y-p1.y+12);
  uictx.restore();
}
function getBBox(o){
  if(o.type==='stroke'){
    if(!o.pts?.length)return null;
    let mx=Infinity,my=Infinity,xx=-Infinity,xy=-Infinity;
    for(const p of o.pts){mx=Math.min(mx,p.x);my=Math.min(my,p.y);xx=Math.max(xx,p.x);xy=Math.max(xy,p.y)}
    return{x:mx,y:my,w:xx-mx,h:xy-my};
  }
  if(o.type==='line')return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};
  if(o.type==='rect')return{x:o.x,y:o.y,w:o.w2,h:o.h2};
  if(o.type==='ellipse')return{x:o.cx-Math.abs(o.rx),y:o.cy-Math.abs(o.ry),w:Math.abs(o.rx)*2,h:Math.abs(o.ry)*2};
  if(o.type==='text')return{x:o.x,y:o.y,w:o.boxW||120,h:o.boxH||30};
  return null;
}
function selectObj(id){selectedId=id;redrawUI()}
function deselect(){selectedId=null;redrawUI()}

/* ═══════════════════════════════════════════════════════
   SHAPE RECOGNITION
═══════════════════════════════════════════════════════ */
function recognizeShape(pts){
  if(!pts||pts.length<4)return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}
  const bw=maxX-minX,bh=maxY-minY;
  if(bw<5&&bh<5)return null;
  const first=pts[0],last=pts.at(-1);
  const closeThreshold=Math.max(bw,bh)*0.25;
  const isClosed=Math.hypot(last.x-first.x,last.y-first.y)<closeThreshold;
  if(!isClosed){
    const dx=last.x-first.x,dy=last.y-first.y;
    const len=Math.hypot(dx,dy);if(len<5)return null;
    let maxDist=0;
    for(const p of pts){
      const d=Math.abs((last.y-first.y)*p.x-(last.x-first.x)*p.y+last.x*first.y-last.y*first.x)/len;
      maxDist=Math.max(maxDist,d);
    }
    if(maxDist<len*0.12&&len>20)return{shape:'line',x1:first.x,y1:first.y,x2:last.x,y2:last.y};
    return null;
  }
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2,rx=bw/2,ry=bh/2;
  let ellipseScore=0;
  for(const p of pts){const dx=(p.x-cx)/rx,dy=(p.y-cy)/ry;ellipseScore+=Math.abs(Math.hypot(dx,dy)-1)}
  ellipseScore/=pts.length;
  let rectScore=0;
  for(const p of pts){
    const dl=Math.abs(p.x-minX),dr=Math.abs(p.x-maxX),dt=Math.abs(p.y-minY),db=Math.abs(p.y-maxY);
    rectScore+=Math.min(dl,dr,dt,db)/Math.max(bw,bh);
  }
  rectScore/=pts.length;
  if(ellipseScore<rectScore&&ellipseScore<0.3){
    if(Math.min(bw,bh)/Math.max(bw,bh)>0.85){const r=(rx+ry)/2;return{shape:'circle',cx,cy,r}}
    return{shape:'ellipse',cx,cy,rx,ry};
  }
  if(rectScore<0.25){
    if(Math.min(bw,bh)/Math.max(bw,bh)>0.85){const s=Math.max(bw,bh)/2;return{shape:'square',x:cx-s,y:cy-s,size:s*2}}
    return{shape:'rect',x:minX,y:minY,w:bw,h:bh};
  }
  return null;
}

/* ═══════════════════════════════════════════════════════
   TOOL STATE
═══════════════════════════════════════════════════════ */
const S={color:'#1a1a2e',w:4,conn:null};
let activeTool='pen';
const toolBtns={pen:'tpen',line:'tline',rect:'trect',ellipse:'tellipse',text:'ttext',eraser:'teraser',select:'tselect'};
function setTool(tool){
  activeTool=tool;
  Object.values(toolBtns).forEach(id=>$(id)?.classList.remove('sel','sel2'));
  $(toolBtns[tool])?.classList.add(tool==='eraser'?'sel2':'sel');
  deselect();
  $('viewport').style.cursor=tool==='pen'?'crosshair':tool==='eraser'?'cell':tool==='select'?'default':'crosshair';
}
Object.entries(toolBtns).forEach(([k,id])=>$(id)?.addEventListener('click',()=>setTool(k)));
setTool('pen');

$('colorpick').oninput=e=>{S.color=e.target.value;$('colorSwatch').style.background=e.target.value};
$('colorSwatch').style.background=S.color;

const SIZE_STEPS=[1,2,3,4,6,8,10,14,18,24,32,40];
let szIdx=SIZE_STEPS.indexOf(4);
function updateSizeDisplay(){
  S.w=SIZE_STEPS[szIdx];$('szLabel').textContent=S.w;
  const vis=clamp(S.w,4,24);
  $('szDotPreview').style.width=vis+'px';$('szDotPreview').style.height=vis+'px';
}
$('szMinus').addEventListener('click',e=>{e.stopPropagation();if(szIdx>0){szIdx--;updateSizeDisplay()}});
$('szPlus').addEventListener('click',e=>{e.stopPropagation();if(szIdx<SIZE_STEPS.length-1){szIdx++;updateSizeDisplay()}});
updateSizeDisplay();

/* ═══════════════════════════════════════════════════════
   POINTER HANDLING (完美相容雙指與所有手機)
═══════════════════════════════════════════════════════ */
const vp=$('viewport');
const activePointers=new Map();

let panPointerId=null;
let panStart={};
let pinchActive=false;
let pinchDist0=0,pinchMid0=null,pinchCam0=null;

let drawPointerId=null;
let liveObjStarted=false;
let holdTimer=null;
let snapApplied=false;

function isUITarget(el){
  return el.closest('#tb')||el.closest('#topRight')||el.closest('#textEditorWrap')||el.closest('#modal');
}

function getPinchDist(){
  const pts=[...activePointers.values()];
  if(pts.length<2)return 0;
  return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
}
function getPinchMid(){
  const pts=[...activePointers.values()];
  if(pts.length<2)return{x:0,y:0};
  return{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
}

vp.addEventListener('pointerdown', e => {
  if(isUITarget(e.target)) return;
  
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const nptrs=activePointers.size;

  if(nptrs>=2){
    if(drawPointerId!==null) cancelDraw();
    panPointerId=null;
    pinchActive=true;
    pinchDist0=getPinchDist();
    pinchMid0=getPinchMid();
    pinchCam0={...cam};
    return;
  }

  if(pinchActive) return;

  const w=s2w(e.clientX,e.clientY);

  if(activeTool==='select'){
    panPointerId=e.pointerId;
    panStart={px:e.clientX,py:e.clientY,cx:cam.x,cy:cam.y};
    return;
  }

  if(activeTool==='text'){
    createTextObj(w.x,w.y);
    return;
  }

  drawPointerId=e.pointerId;
  liveObjStarted=true;
  snapApplied=false;

  if(activeTool==='pen'){
    liveObj={id:uid(),type:'stroke',pts:[{...w}],color:S.color,w:S.w};
  } else if(activeTool==='eraser'){
    liveObj={id:uid(),type:'stroke',pts:[{...w}],color:'eraser',w:S.w*5};
  } else if(activeTool==='line'){
    liveObj={id:uid(),type:'line',x1:w.x,y1:w.y,x2:w.x,y2:w.y,color:S.color,w:S.w};
  } else if(activeTool==='rect'){
    liveObj={id:uid(),type:'rect',x:w.x,y:w.y,w2:0,h2:0,color:S.color,w:S.w,_ox:w.x,_oy:w.y};
  } else if(activeTool==='ellipse'){
    liveObj={id:uid(),type:'ellipse',cx:w.x,cy:w.y,rx:0,ry:0,_ox:w.x,_oy:w.y,color:S.color,w:S.w};
  }

  if(activeTool==='pen'){
    holdTimer=setTimeout(()=>{
      if(liveObjStarted&&liveObj?.pts?.length>3&&!snapApplied){
        const r=recognizeShape(liveObj.pts);if(r)applyRecognizedShape(r);
      }
    },500);
  }
  if(activeTool==='line'||activeTool==='rect'||activeTool==='ellipse'){
    holdTimer=setTimeout(()=>{if(liveObjStarted&&liveObj&&!snapApplied)snapCurrentShape()},500);
  }
});

window.addEventListener('pointermove', e => {
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const nptrs=activePointers.size;

  if(nptrs>=2&&pinchActive){
    const dist=getPinchDist(),mid=getPinchMid();
    if(pinchDist0===0)return;
    const ratio=dist/pinchDist0;
    const newZ=clamp(pinchCam0.z*ratio,.08,12);
    const wx=(mid.x-pinchCam0.x)/pinchCam0.z;
    const wy=(mid.y-pinchCam0.y)/pinchCam0.z;
    const panDx=mid.x-pinchMid0.x,panDy=mid.y-pinchMid0.y;
    cam.z=newZ;
    cam.x=mid.x-wx*newZ+panDx;
    cam.y=mid.y-wy*newZ+panDy;
    applyCam();renderTextObjects();
    return;
  }

  if(panPointerId!==null&&e.pointerId===panPointerId){
    cam.x=panStart.cx+(e.clientX-panStart.px);
    cam.y=panStart.cy+(e.clientY-panStart.py);
    applyCam();renderTextObjects();
    return;
  }

  if(drawPointerId!==null&&e.pointerId===drawPointerId&&liveObj){
    if(snapApplied)return;
    const w=s2w(e.clientX,e.clientY);
    if(liveObj.type==='stroke'){
      const last=liveObj.pts.at(-1);
      if(Math.hypot(w.x-last.x,w.y-last.y)>1.5/cam.z){
        liveObj.pts.push({...w});
        if(activeTool==='pen'){
          const startPt=liveObj.pts[0];
          if(Math.hypot(w.x-startPt.x,w.y-startPt.y)>30/cam.z)clearTimeout(holdTimer);
        }
      }
    } else if(liveObj.type==='line'){
      liveObj.x2=w.x;liveObj.y2=w.y;
    } else if(liveObj.type==='rect'){
      liveObj.w2=w.x-liveObj._ox;liveObj.h2=w.y-liveObj._oy;
    } else if(liveObj.type==='ellipse'){
      liveObj.rx=(w.x-liveObj._ox)/2;liveObj.ry=(w.y-liveObj._oy)/2;
      liveObj.cx=liveObj._ox+liveObj.rx;liveObj.cy=liveObj._oy+liveObj.ry;
    }
    redrawActiveCanvas();
    if(liveObj.type==='stroke'&&S.conn?.open){
      S.conn.send({type:'LIVE',o:{...liveObj,pts:[...liveObj.pts]}});
    }
  }
});

window.addEventListener('pointerup', e => {
  if(!activePointers.has(e.pointerId)) return;
  activePointers.delete(e.pointerId);
  const nptrs=activePointers.size;

  if(nptrs<2) pinchActive=false;

  if(e.pointerId===panPointerId){
    panPointerId=null;
    return;
  }

  if(e.pointerId===drawPointerId){
    clearTimeout(holdTimer);
    const wasDrawing=liveObjStarted&&liveObj!==null;
    drawPointerId=null;
    liveObjStarted=false;

    if(wasDrawing){
      if(liveObj.color==='eraser'||activeTool==='eraser'){
        finishDraw();
      } else if(liveObj.type==='stroke'&&!snapApplied){
        const r=recognizeShape(liveObj.pts);
        if(r){applyRecognizedShape(r)}
        else{finishDraw()}
      } else {
        finishDraw();
      }
    }
    return;
  }

  if(nptrs===1&&pinchActive===false){
    const remaining=[...activePointers.entries()][0];
    if(remaining){
      const[pid,pos]=remaining;
      if(activeTool==='select'){
        panPointerId=pid;
        panStart={px:pos.x,py:pos.y,cx:cam.x,cy:cam.y};
      }
    }
  }
});

window.addEventListener('pointercancel', e => {
  if(!activePointers.has(e.pointerId)) return;
  activePointers.delete(e.pointerId);
  const nptrs=activePointers.size;
  if(nptrs<2) pinchActive=false;

  if(e.pointerId===panPointerId){
    panPointerId=null;
  }
  if(e.pointerId===drawPointerId){
    cancelDraw();
  }
});

vp.addEventListener('contextmenu', e => e.preventDefault());

vp.addEventListener('wheel', e => {
  e.preventDefault();
  const delta=e.deltaY>0?0.9:1.1;
  const newZ=clamp(cam.z*delta,.08,12);
  const wx=(e.clientX-cam.x)/cam.z,wy=(e.clientY-cam.y)/cam.z;
  cam.z=newZ;cam.x=e.clientX-wx*newZ;cam.y=e.clientY-wy*newZ;
  applyCam();renderTextObjects();
},{passive:false});
  
function cancelDraw(){
  clearTimeout(holdTimer);
  drawPointerId=null;
  liveObjStarted=false;
  liveObj=null;
  snapApplied=false;
  redrawBaseCanvas();
  redrawActiveCanvas();
}

let _snapHideTimer;
function showSnapIndicator(msg){
  const el=$('snapIndicator');el.textContent=msg;el.classList.add('show');
  clearTimeout(_snapHideTimer);_snapHideTimer=setTimeout(()=>el.classList.remove('show'),2000);
}

function snapCurrentShape(){
  if(!liveObj||snapApplied)return;
  snapApplied=true;
  if(liveObj.type==='line'){
    const dx=liveObj.x2-liveObj.x1,dy=liveObj.y2-liveObj.y1;
    const angle=Math.atan2(dy,dx)*(180/Math.PI);
    const snapAngles=[0,45,90,135,180,-45,-90,-135];
    const dist=Math.hypot(dx,dy);
    let best=null,bestD=20;
    for(const a of snapAngles){const d=Math.abs(((angle-a+540)%360)-180);if(d<bestD){bestD=d;best=a}}
    if(best!==null){const r=best*Math.PI/180;liveObj.x2=liveObj.x1+dist*Math.cos(r);liveObj.y2=liveObj.y1+dist*Math.sin(r);showSnapIndicator(t('snap_line2'))}
  } else if(liveObj.type==='rect'){
    const s=Math.max(Math.abs(liveObj.w2),Math.abs(liveObj.h2));
    const aspect=Math.min(Math.abs(liveObj.w2),Math.abs(liveObj.h2))/s;
    if(aspect>0.7){liveObj.w2=Math.sign(liveObj.w2)*s;liveObj.h2=Math.sign(liveObj.h2)*s;showSnapIndicator(t('snap_square2'))}
    else showSnapIndicator(t('snap_rect2'));
  } else if(liveObj.type==='ellipse'){
    const r=Math.max(Math.abs(liveObj.rx),Math.abs(liveObj.ry));
    const aspect=Math.min(Math.abs(liveObj.rx),Math.abs(liveObj.ry))/r;
    if(aspect>0.7){liveObj.rx=r;liveObj.ry=r;showSnapIndicator(t('snap_circle2'))}
    else showSnapIndicator(t('snap_ellipse2'));
  }
  redrawActiveCanvas();
}

function applyRecognizedShape(recognized){
  if(!liveObj)return;
  const color=liveObj.color,w=liveObj.w;let newObj;
  if(recognized.shape==='line'){newObj={id:liveObj.id,type:'line',x1:recognized.x1,y1:recognized.y1,x2:recognized.x2,y2:recognized.y2,color,w};showSnapIndicator(t('snap_line'))}
  else if(recognized.shape==='circle'){newObj={id:liveObj.id,type:'ellipse',cx:recognized.cx,cy:recognized.cy,rx:recognized.r,ry:recognized.r,color,w};showSnapIndicator(t('snap_circle'))}
  else if(recognized.shape==='ellipse'){newObj={id:liveObj.id,type:'ellipse',cx:recognized.cx,cy:recognized.cy,rx:recognized.rx,ry:recognized.ry,color,w};showSnapIndicator(t('snap_ellipse'))}
  else if(recognized.shape==='square'){const{x,y,size}=recognized;newObj={id:liveObj.id,type:'rect',x,y,w2:size,h2:size,color,w};showSnapIndicator(t('snap_square'))}
  else if(recognized.shape==='rect'){newObj={id:liveObj.id,type:'rect',x:recognized.x,y:recognized.y,w2:recognized.w,h2:recognized.h,color,w};showSnapIndicator(t('snap_rect'))}
  if(newObj){liveObj=newObj;snapApplied=true;redrawActiveCanvas();setTimeout(()=>finishDraw(),120)}
  else finishDraw();
}

function finishDraw(){
  if(!liveObj)return;
  clearTimeout(holdTimer);
  if(liveObj.type==='line'&&!snapApplied&&liveObj.color!=='eraser'){
    const dx=liveObj.x2-liveObj.x1,dy=liveObj.y2-liveObj.y1;
    const angle=Math.atan2(dy,dx)*(180/Math.PI);
    const snapAngles=[0,45,90,135,180,-45,-90,-135];
    const dist=Math.hypot(dx,dy);
    let best=null,bestD=10;
    for(const a of snapAngles){const d=Math.abs(((angle-a+540)%360)-180);if(d<bestD){bestD=d;best=a}}
    if(best!==null){const r=best*Math.PI/180;liveObj.x2=liveObj.x1+dist*Math.cos(r);liveObj.y2=liveObj.y1+dist*Math.sin(r)}
  }
  const o={...liveObj};delete o._ox;delete o._oy;
  snapshot();
  objects.push(o);
  liveObj=null;
  snapApplied=false;
  drawPointerId=null;
  liveObjStarted=false;
  redrawBaseCanvas();
  redrawActiveCanvas();
  renderTextObjects();
  send({type:'ADD',o});
}

/* ═══════════════════════════════════════════════════════
   NETWORKING
═══════════════════════════════════════════════════════ */
let _peer=null;
let remoteLiveStrokes={};
function send(o){if(S.conn?.open)S.conn.send(o)}

function handleData(d){
  if(d.type==='ADD'){
    if(!objects.find(o=>o.id===d.o.id))objects.push(d.o);
    delete remoteLiveStrokes[d.o.id];
    redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();
  } else if(d.type==='UPD'){
    const idx=objects.findIndex(o=>o.id===d.o.id);
    if(idx>=0)objects[idx]=d.o;else objects.push(d.o);
    redrawBaseCanvas();renderTextObjects();
  } else if(d.type==='DEL'){
    objects=objects.filter(o=>o.id!==d.id);
    redrawBaseCanvas();renderTextObjects();
  } else if(d.type==='CLEAR'){
    objects=[];remoteLiveStrokes={};
    redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();toast(t('cleared_toast'));
  } else if(d.type==='SYNC'){
    const ids=new Set(objects.map(o=>o.id));
    d.objs.forEach(o=>{if(!ids.has(o.id))objects.push(o)});
    redrawBaseCanvas();renderTextObjects();
  } else if(d.type==='SYNC_ALL'){
    objects=d.objs;redrawBaseCanvas();renderTextObjects();
  } else if(d.type==='LIVE'){
    remoteLiveStrokes[d.o.id]=d.o;redrawActiveCanvas();
  }
}

function setupConn(conn){
  S.conn=conn;
  conn.on('open',()=>{
    setStatus('connected','live');
    $('pill').style.background='';
    toast(t('connected_toast'));closeModal();
    conn.send({type:'SYNC',objs:objects});
  });
  conn.on('data',handleData);
  conn.on('close',()=>{
    S.conn=null;remoteLiveStrokes={};
    setStatus('disconnected','');toast(t('disconnected_toast'));
  });
  conn.on('error',err=>toast('Error: '+(err.message||err)));
}

const makeCode=()=>String(Math.floor(100000+Math.random()*900000));
const codeToId=c=>'wb-'+c,idToCode=id=>id.replace(/^wb-/,'');
function destroyPeer(){if(_peer&&!_peer.destroyed)_peer.destroy();_peer=null;S.conn=null}

function initHost(code){
  destroyPeer();
  const peer=new Peer(codeToId(code),{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
  _peer=peer;
  peer.on('open',id=>{
    $('rcode').textContent=idToCode(id);
    $('rsub').textContent=t('share_code');
    setStatus('waiting_visitor','wait');
  });
  peer.on('connection',conn=>{
    $('wrow').innerHTML=`<span style="color:#27ae60;font-weight:700">${t('visitor_joined')}</span>`;
    setupConn(conn);
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){destroyPeer();setTimeout(()=>initHost(makeCode()),400)}
    else setMS('Error: '+(err.message||err.type),'err');
  });
}

function joinRoom(code){
  destroyPeer();
  const peer=new Peer(undefined,{debug:0});_peer=peer;
  $('joinBtn').disabled=true;$('joinBtn').textContent=t('connecting');setMS(t('connecting'));
  let to=setTimeout(()=>{setMS(t('timeout'),'err');$('joinBtn').disabled=false;$('joinBtn').textContent=t('join')},12000);
  peer.on('open',()=>{
    const conn=peer.connect(codeToId(code),{reliable:true,serialization:'json'});
    setupConn(conn);
    conn.on('open',()=>clearTimeout(to));
    conn.on('error',err=>{clearTimeout(to);setMS('Error: '+(err.message||err),'err');$('joinBtn').disabled=false;$('joinBtn').textContent=t('join')});
  });
  peer.on('error',err=>{clearTimeout(to);setMS('Error: '+(err.message||err.type),'err');$('joinBtn').disabled=false;$('joinBtn').textContent=t('join')});
}

/* ═══════════════════════════════════════════════════════
   MODAL UI
═══════════════════════════════════════════════════════ */
let _tab='h';
function switchTab(tab){
  _tab=tab;
  $('tabH').className='tab'+(tab==='h'?' active':'');
  $('tabV').className='tab'+(tab==='v'?' active':'');
  $('hpanel').className='panel'+(tab==='h'?' show':'');
  $('vpanel').className='panel'+(tab==='v'?' show':'');
  setMS('');
}
function openModal(){
  if(S.conn?.open){
    const cc=`<div class="concard"><strong>${t('already_connected')}</strong><span>${t('back')}</span></div>`;
    $('hpanel').innerHTML=cc;$('vpanel').innerHTML=cc;
  }
  $('modal').classList.add('show');
  if(!_peer||_peer.destroyed){
    $('rcode').textContent='……';$('rsub').textContent=t('initializing');
    $('wrow').innerHTML=`<div class="spin"></div><span>${t('waiting')}</span>`;
    initHost(makeCode());
  }
}
function closeModal(){$('modal').classList.remove('show')}

$('pill').onclick=openModal;
$('xbtn').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('tabH').onclick=()=>switchTab('h');
$('tabV').onclick=()=>switchTab('v');
$('roomInput').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
  $('joinBtn').disabled=e.target.value.length!==6;setMS('');
});
$('roomInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('joinBtn').disabled)joinRoom($('roomInput').value)});
$('joinBtn').onclick=()=>{if($('roomInput').value.length===6)joinRoom($('roomInput').value)};

$('langToggle').addEventListener('click',()=>{
  lang=lang==='zh'?'en':'zh';
  try{localStorage.setItem('wb_lang',lang)}catch(e){}
  applyLang();
});

$('tclear').addEventListener('click',()=>{
  if(confirm(t('clear_confirm'))){
    snapshot();objects=[];redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();
    send({type:'CLEAR'});
  }
});

/* ═══════════════════════════════════════════════════════
   INIT & RESIZE
═══════════════════════════════════════════════════════ */
function onResize(){
  resizeGrid();resizeDrawCanvas();resizeUI();
  redrawGrid();redrawBaseCanvas();redrawActiveCanvas();renderTextObjects();
  if(editingObj&&teWrap.style.display!=='none'){
    const sp=w2s(editingObj.x,editingObj.y);
    edX=sp.x;edY=sp.y;
    applyEditorGeometry();
  }
}
window.addEventListener('resize',onResize);
resizeGrid();resizeDrawCanvas();resizeUI();
initCam();
applyLang();
setTimeout(openModal,300);
