<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D 心算競速</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#050508;color:#fff;}
#three-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}
.view-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:none;pointer-events:auto;}
.view-layer.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}
#game-hud-view.active{display:block;pointer-events:none;}
#game-hud-view .hud-interactive{pointer-events:auto;}

.game-title{font-size:clamp(28px,6vw,56px);font-weight:900;text-align:center;color:#fff;text-shadow:0 0 15px rgba(68,170,255,0.6);letter-spacing:2px;margin-bottom:6px;}
.game-subtitle{font-size:clamp(13px,3vw,22px);color:#aaa;text-align:center;margin-bottom:25px;letter-spacing:5px;}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;margin:5px;font-size:clamp(14px,2.5vw,17px);font-family:inherit;font-weight:bold;color:#fff;background:linear-gradient(135deg,rgba(30,50,90,0.9),rgba(15,25,45,0.9));border:1px solid #4a8;border-radius:8px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 10px rgba(0,0,0,0.5);}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 15px rgba(68,170,255,0.4);background:linear-gradient(135deg,rgba(50,80,140,0.9),rgba(25,45,85,0.9));}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn.danger{border-color:#e05050;background:linear-gradient(135deg,rgba(140,30,30,0.9),rgba(70,15,15,0.9));}
.btn.gold{border-color:#d4a830;background:linear-gradient(135deg,rgba(140,110,30,0.9),rgba(70,55,15,0.9));}
.btn.garage{border-color:#a4f;background:linear-gradient(135deg,rgba(90,30,140,0.9),rgba(45,15,70,0.9));}

.menu-btn-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:90%;max-width:420px;margin:0 auto;}
.menu-btn-group .btn{margin:0;width:100%;height:54px;font-size:clamp(14px,3.5vw,17px);}

.panel{background:rgba(10,12,18,0.95);border:1px solid #334;border-radius:12px;padding:20px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.panel::-webkit-scrollbar{width:6px;} .panel::-webkit-scrollbar-thumb{background:#557;border-radius:3px;}

#hud-score-bar{position:absolute;top:15px;left:75px;z-index:20;font-size:clamp(14px,2.5vw,18px);color:#8ad;}
#hud-score-bar .score-val{color:#fff;font-weight:bold;font-size:1.2em;font-family:'Arial Black',sans-serif;}
#hud-level-info{position:absolute;top:45px;left:75px;z-index:20;font-size:clamp(11px,2vw,14px);color:#68a;}

#hud-timer-area{position:absolute;top:10px;right:15px;z-index:20;text-align:right;}
#hud-timer-text{font-size:clamp(14px,2.5vw,18px);color:#8ad;}
#hud-timer-text .timer-val{color:#fff;font-weight:bold;font-family:'Arial Black',sans-serif;}
#hud-timer-bar{width:clamp(100px,25vw,180px);height:6px;background:#223;border-radius:3px;margin-top:4px;overflow:hidden;}
#hud-timer-fill{height:100%;background:linear-gradient(90deg, #38f, #4df);transition:width 0.1s linear;}
#hud-timer-text.urgent ~ #hud-timer-bar #hud-timer-fill{background:#f33;}
#hud-mode-label{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:20;font-size:clamp(12px,2.5vw,16px);color:#d09030;display:none;}

#mental-slate{position:absolute;top:110px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:90%;pointer-events:none;}
.slate-row{font-size:clamp(16px,3.5vw,26px);font-weight:900;color:#fff;padding:2px 6px;text-shadow:0 2px 5px rgba(0,0,0,0.9);transition:opacity 0.8s;font-family:'Arial Black',sans-serif;}
.slate-row.neg{color:#fa6;} .slate-row.fading{opacity:0!important;}

#vignette-flash{position:absolute;top:0;left:0;width:100%;height:100%;z-index:18;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center, transparent 40%, rgba(255,20,20,0.8) 100%);transition:opacity 0.1s;}

#combo-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:23;overflow:hidden;}
.combo-popup{position:absolute;font-weight:900;font-style:italic;pointer-events:none;animation:comboEdge 0.6s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,0.8);}
@keyframes comboEdge{0%{transform:scale(0.5);opacity:0;} 20%{transform:scale(1.2);opacity:1;} 100%{transform:scale(1.0);opacity:0;}}
#combo-hud{position:absolute;top:75px;left:75px;z-index:22;font-size:clamp(16px,4vw,24px);font-weight:900;color:#fff;text-shadow:0 0 10px #08f;opacity:0;transition:opacity 0.3s;}
#combo-hud.visible{opacity:1;}

.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:95%;max-width:700px;max-height:55vh;overflow-y:auto;padding:10px;}
.level-btn{padding:10px 6px;font-size:clamp(12px,2vw,14px);color:#ddd;background:linear-gradient(180deg,rgba(30,40,60,0.9),rgba(15,20,30,0.9));border:1px solid #457;border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;}
.level-btn:hover,.level-btn:active{border-color:#6af;box-shadow:0 0 10px rgba(100,170,255,0.4);transform:translateY(-2px);}
.level-btn .lv-name{font-weight:bold;margin-bottom:4px;color:#fff;} .level-btn .lv-info{font-size:0.85em;color:#8ab;}

.garage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;width:95%;max-width:650px;max-height:60vh;overflow-y:auto;padding:10px;}
.car-card{background:rgba(20,20,30,0.9);border:2px solid #334;border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:0.2s;}
.car-card.locked{opacity:0.4;filter:grayscale(100%);cursor:not-allowed;}
.car-card:hover:not(.locked){border-color:#a4f;background:rgba(40,30,60,0.9);transform:translateY(-2px);}
.car-card.equipped{border-color:#4f8;background:rgba(20,50,30,0.9);box-shadow:0 0 15px rgba(60,255,120,0.3);}
.car-color-block{width:80%;height:40px;margin:0 auto 8px;border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,0.8);}
.car-name{font-size:12px;font-weight:bold;color:#ccc;}

.toggle-row{display:flex;align-items:center;gap:10px;margin:8px 0;justify-content:center;font-size:clamp(13px,2.5vw,16px);color:#bbb;}
.toggle-sw{position:relative;width:48px;height:26px;background:#223;border-radius:13px;cursor:pointer;border:1px solid #445;transition:all 0.2s;}
.toggle-sw.on{background:#2a6;border-color:#4f8;}
.toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#ddd;border-radius:50%;transition:transform 0.2s;}
.toggle-sw.on::after{transform:translateX(22px);background:#fff;}

.hist-table{width:100%;border-collapse:collapse;font-size:clamp(11px,1.8vw,14px);}
.hist-table th,.hist-table td{padding:6px 4px;border:1px solid #334;text-align:center;}
.hist-table th{background:rgba(255,255,255,0.05);color:#8ad;font-weight:bold;}
.report-title{font-size:clamp(20px,4.5vw,34px);color:#fff;margin-bottom:15px;text-align:center;font-weight:900;text-shadow:0 0 10px rgba(255,215,0,0.5);}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:clamp(13px,2.5vw,17px);margin-bottom:10px;}
.report-grid .rl{color:#8ab;text-align:right;} .report-grid .rv{color:#fff;font-weight:bold;}
.report-grid .rv.pass{color:#4e8;} .report-grid .rv.fail{color:#e44;}
#radar-canvas{display:block;margin:5px auto;max-width:240px;max-height:240px;}
#weakness-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;}
.wtag{padding:4px 10px;border-radius:14px;font-size:12px;background:rgba(200,50,50,0.2);border:1px solid #c44;color:#f88;display:flex;align-items:center;}
.advisor-text{font-size:13px;color:#bba040;text-align:center;margin:8px 0;line-height:1.4;font-style:italic;}
.name-input{width:100%;max-width:280px;padding:10px;margin:8px;background:rgba(0,0,0,0.6);color:#fff;border:1px solid #555;border-radius:6px;font-family:inherit;text-align:center;}

#certificate-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;}
#certificate-overlay.active{display:flex;}
#cert-img{max-width:95vw;max-height:68vh;border:2px solid #c5a059;border-radius:4px;box-shadow:0 0 20px rgba(197,160,89,0.4);}
.cert-hint{color:#d4a830;font-size:14px;margin:12px;text-align:center;}

#showcase-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 100%);z-index:100;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:50px;}
.showcase-text{position:absolute;top:10%;text-align:center;width:100%;pointer-events:none;}
.showcase-title{font-size:clamp(30px,6vw,50px);font-weight:900;color:#fd4;text-shadow:0 0 20px rgba(255,200,0,0.8);letter-spacing:2px;margin-bottom:10px;}
.showcase-sub{font-size:clamp(18px,4vw,30px);color:#fff;font-style:italic;}

.sync-ta{width:100%;min-height:80px;background:rgba(0,0,0,0.6);color:#aaa;border:1px solid #445;border-radius:6px;font-family:monospace;font-size:12px;padding:8px;resize:vertical;}
.sync-msg{font-size:13px;margin-top:6px;min-height:18px;text-align:center;}
.sync-msg.ok{color:#4e8;} .sync-msg.err{color:#e44;}

.review-card{background:rgba(20,20,30,0.95);border:1px solid #456;border-radius:8px;padding:15px;margin:8px auto;width:95%;text-align:center;}
.rc-expr{font-size:20px;color:#fff;font-weight:900;margin:8px 0;font-family:inherit;letter-spacing:1px;}
.rc-step{font-size:15px;color:#8ab;margin:4px 0;}
.rc-answer{font-size:20px;color:#4df;font-weight:bold;margin-top:8px;}

@media (min-width:768px){
  #mental-slate{top:65px;right:15px;left:auto;transform:none;flex-direction:column;align-items:flex-end;width:auto;}
  #combo-hud{left:auto;right:15px;top:100px;text-align:right;}
}
svg.icon-inline { vertical-align: text-bottom; margin-right: 8px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="three-container"></div>

<!-- MAIN MENU -->
<div id="menu-view" class="view-layer active">
  <div class="game-title">3D 心算競速</div>
  <div class="game-subtitle">極限檢定模式</div>
  <div style="margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;">
    <div class="toggle-row" id="voice-setting-row" style="margin:0;">
      <span>精準語音</span><div class="toggle-sw on" id="voice-toggle"></div>
    </div>
    <div class="toggle-row" style="margin:0;">
      <span>環境音效</span><div class="toggle-sw on" id="sfx-toggle"></div>
    </div>
    <div class="toggle-row" style="margin:0;">
      <span>自動歸位</span><div class="toggle-sw" id="autocenter-toggle"></div>
    </div>
  </div>
  <div class="menu-btn-group">
    <button class="btn" id="btn-start"><svg class="icon-inline" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 啟動檢定</button>
    <button class="btn garage" id="btn-garage"><svg class="icon-inline" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg> 跑車車庫</button>
    <button class="btn" id="btn-history"><svg class="icon-inline" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg> 歷史與檢討</button>
    <button class="btn" id="btn-data-sync"><svg class="icon-inline" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> 備份同步</button>
  </div>
</div>

<!-- LEVEL SELECT -->
<div id="level-select-view" class="view-layer">
  <div class="panel">
    <div class="game-title" style="font-size:clamp(22px,4vw,34px);">選擇檢定關卡</div>
    <div class="toggle-row"><span>盲測硬核模式</span><div class="toggle-sw" id="blind-toggle"></div></div>
    <div class="level-grid" id="level-grid"></div>
    <div style="text-align:center;margin-top:15px;"><button class="btn" id="btn-back-menu">返回主選單</button></div>
  </div>
</div>

<!-- GARAGE -->
<div id="garage-view" class="view-layer">
  <div class="panel" style="text-align:center;">
    <div class="game-title" style="font-size:clamp(22px,4vw,34px);">專屬跑車車庫</div>
    <div style="color:#8ab;margin-bottom:15px;font-size:13px;">通關檢定級別解鎖車體。搭載 PMREM 物理渲染引擎。</div>
    <div class="garage-grid" id="garage-grid"></div>
    <button class="btn" id="btn-garage-back" style="margin-top:15px;">返回主選單</button>
  </div>
</div>

<!-- HUD -->
<div id="game-hud-view" class="view-layer">
  <button class="btn hud-interactive" id="btn-camera" style="position:absolute;top:15px;left:15px;width:46px;height:46px;padding:0;margin:0;border-radius:50%;z-index:24;display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
  </button>
  <div id="hud-score-bar">SCORE: <span class="score-val" id="hud-score-val">0</span></div>
  <div id="hud-level-info"></div>
  <div id="hud-timer-area">
    <div id="hud-timer-text">剩餘: <span class="timer-val" id="hud-timer-val">180</span>s</div>
    <div id="hud-timer-bar"><div id="hud-timer-fill" style="width:100%;"></div></div>
  </div>
  <div id="hud-mode-label">【錯題檢討模式】</div>
  <div id="mental-slate"></div>
  <div id="combo-container"></div>
  <div id="combo-hud"></div>
  <div id="vignette-flash"></div>
  <button class="btn hud-interactive" id="btn-pause" style="position:absolute;bottom:15px;right:15px;padding:12px;border-radius:50%;z-index:24;">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
  </button>
</div>

<!-- PAUSE -->
<div id="pause-overlay" class="view-layer" style="background:rgba(0,0,0,0.8);">
  <div class="panel" style="text-align:center;">
    <div class="game-title" style="font-size:28px;">暫停</div>
    <div style="color:#8ab;margin-bottom:15px;font-size:13px;line-height:1.6;">
      按鍵操作: S / Ctrl 向左，F / 空白 向右<br>
      或直接使用數字鍵 1、2、3 快速切換對應車道
    </div>
    <button class="btn" id="btn-resume">繼續測驗</button>
    <button class="btn danger" id="btn-quit">放棄並返回選單</button>
  </div>
</div>

<!-- GAMEOVER -->
<div id="gameover-view" class="view-layer">
  <div class="panel" style="width:90%;max-width:550px;text-align:center;">
    <div class="report-title" id="report-title">檢定報告</div>
    <div class="report-grid" id="report-grid"></div>
    <canvas id="radar-canvas" width="240" height="240"></canvas>
    <div id="weakness-tags"></div>
    <div class="advisor-text" id="advisor-text"></div>
    <div id="save-name-area" style="display:none;margin-top:10px;">
      <input class="name-input" id="player-name-input" placeholder="已自動存檔，可輸入姓名更新" maxlength="20"/>
      <button class="btn" id="btn-save-score">更新姓名</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:15px;">
      <button class="btn gold" id="btn-gen-cert" style="display:none;"><svg class="icon-inline" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> 頒發證書</button>
      <button class="btn" id="btn-gameover-history">查看錯題</button>
      <button class="btn" id="btn-gameover-menu">確認並返回</button>
    </div>
  </div>
</div>

<!-- SHOWCASE -->
<div id="showcase-overlay" class="view-layer">
  <div class="showcase-text">
    <div class="showcase-title">NEW CAR UNLOCKED!</div>
    <div class="showcase-sub" id="showcase-car-name"></div>
  </div>
  <button class="btn gold" id="btn-showcase-done" style="z-index:101;margin-bottom:40px;font-size:18px;">裝備並返回車庫</button>
</div>

<!-- HISTORY -->
<div id="history-view" class="view-layer">
  <div class="panel" style="width:90%;max-width:650px;">
    <div class="game-title" style="font-size:clamp(20px,4vw,30px);">歷史紀錄</div>
    <div id="history-list" style="max-height:45vh;overflow-y:auto;margin-bottom:10px;"></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
      <button class="btn" id="btn-review-run" disabled>錯題靜態檢討</button>
      <button class="btn danger" id="btn-clear-history">清除所有紀錄</button>
      <button class="btn" id="btn-history-back">返回</button>
    </div>
  </div>
</div>

<!-- CALM REVIEW -->
<div id="review-calm-view" class="view-layer">
  <div class="panel" style="width:90%;max-width:500px;text-align:center;">
    <div class="game-title" style="font-size:clamp(20px,4vw,30px);">錯題靜態檢討</div>
    <div id="review-cards-container" style="max-height:60vh;overflow-y:auto;"></div>
    <button class="btn" id="btn-review-done" style="margin-top:10px;">完成檢討</button>
  </div>
</div>

<!-- DATA SYNC -->
<div id="data-sync-panel" class="view-layer">
  <div class="panel" style="width:90%;max-width:450px;text-align:center;">
    <div class="game-title" style="font-size:clamp(20px,4vw,30px);">資料備份與還原</div>
    <button class="btn" id="btn-export-code">生成並複製進度代碼</button>
    <textarea class="sync-ta" id="sync-textarea" placeholder="將代碼黏貼到此處以導入..."></textarea>
    <button class="btn" id="btn-import-code">載入外部代碼</button>
    <div class="sync-msg" id="sync-msg"></div>
    <button class="btn" id="btn-sync-back" style="margin-top:10px;">返回</button>
  </div>
</div>

let audioCtx = null, AudioMixer = { init: false, channels: {} };
function ensureAudioCtx() {

}
function playTone(freq, type, dur, vol) {
    if(!isSfxEnabled || !audioCtx || !AudioMixer.init) return;
    try { let t=audioCtx.currentTime, osc=audioCtx.createOscillator(), g=audioCtx.createGain();
        osc.type=type; osc.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.01, t+dur);
        osc.connect(g); g.connect(AudioMixer.channels.sfx); osc.start(t); osc.stop(t+dur); } catch(e){}
}

function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function randNum(digits) { return digits<=1 ? randInt(1,9) : randInt(Math.pow(10,digits-1), Math.pow(10,digits)-1); }

function generateAddSub(minD, maxD, rows, ops) {
    for(let a=0; a<100; a++) {
        let st=[], cum=[], d=randInt(minD, maxD), rt=randNum(d); st.push(rt); cum.push(rt);
        for(let i=1; i<rows; i++){ let val=randNum(randInt(minD,maxD)), op=ops[randInt(0,ops.length-1)]; if(op==='-'){st.push(-val);rt-=val;}else{st.push(val);rt+=val;} cum.push(rt); }
        if(rt>0) return {type:'ADD_SUB', steps:st, finalAnswer:rt};
    }
    let st=[], rt=0; for(let i=0;i<rows;i++){ let v=randNum(maxD); st.push(v); rt+=v; }
    return {type:'ADD_SUB', steps:st, finalAnswer:rt};
}
function generateMul(m1, m2) { 
    let a=randNum(m1), b=randNum(m2); 
    return {type:'MUL', num1: a, num2: b, op: '×', expr: a+' × '+b, finalAnswer: a*b}; 
}
function generateDiv(d1, d2) { 
    let minDiv = Math.pow(10, d2 - 1), maxDiv = Math.pow(10, d2) - 1;
    let minDvd = Math.pow(10, d1 - 1), maxDvd = Math.pow(10, d1) - 1;
    for(let attempt=0; attempt<200; attempt++) {
        let div = randInt(minDiv, maxDiv);
        let minQ = Math.ceil(minDvd / div), maxQ = Math.floor(maxDvd / div);
        if (minQ <= maxQ) { let quo = randInt(minQ, maxQ); return {type:'DIV', num1: div*quo, num2: div, op: '÷', expr: (div*quo)+' ÷ '+div, finalAnswer: quo}; }
    }
    let div = randInt(minDiv, maxDiv), quo = randInt(Math.pow(10, Math.max(1, d1-d2-1)), Math.pow(10, Math.max(1, d1-d2))-1);
    return {type:'DIV', num1: div*quo, num2: div, op: '÷', expr: (div*quo)+' ÷ '+div, finalAnswer: quo}; 
}

function generateQuestions(lc) {
    let q=[]; 
    if(lc.type==='ADD_ONLY'||lc.type==='ADD_SUB'){ 
        for(let i=0;i<lc.totalQ;i++) q.push(generateAddSub(lc.minDigits,lc.maxDigits,lc.rows,lc.ops)); 
    } else if(lc.type==='MIXED_THREE'){ 
        let p1 = Math.floor(lc.totalQ / 5);
        let p2 = p1 * 2;
        let p3 = lc.totalQ - p1 - p2; 
        for(let i=0; i<p1; i++) q.push(generateAddSub(lc.addSub.minDigits, lc.addSub.maxDigits, lc.addSub.rows, lc.addSub.ops)); 
        for(let i=0; i<p2; i++) q.push(generateMul(lc.mul.m1, lc.mul.m2)); 
        for(let i=0; i<p3; i++) q.push(generateDiv(lc.div.d1, lc.div.d2)); 
    }
    return q;
}

function genWrongs(correct) {
    let w=new Set(); w.add(correct+10); w.add(correct-10); w.add(correct+1); w.add(correct-1); if(correct>5)w.add(correct+5); w.add(correct+randInt(2,8)); 
    if(correct>100){ w.add(correct+100); w.add(correct-100); } w.delete(correct); w.delete(0);
    let arr=Array.from(w).filter(v=>v>0); while(arr.length<2){let r=correct+randInt(1,9)*(Math.random()>0.5?1:-1); if(r>0&&r!==correct&&!arr.includes(r))arr.push(r);} 
    arr.sort(()=>Math.random()-0.5); return [arr[0],arr[1]];
}

        let tMat = new THREE.MeshStandardMaterial({color: 0x151515, roughness: 0.9});
        let rMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness:0.8, roughness:0.2});
        [[-conf.L/2+0.8, conf.W/2],[-conf.L/2+0.8, -conf.W/2],[conf.L/2-0.8, conf.W/2],[conf.L/2-0.8, -conf.W/2]].forEach(p=>{
            let w = new THREE.Mesh(wGeo, tMat); w.position.set(p[0], 0.35, p[1]);
            let rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.27,16), rMat); rim.rotateX(Math.PI/2); rim.position.copy(w.position);
            group.add(w, rim);
        });
        group.rotation.y = Math.PI / 2; group.scale.set(1.2, 1.2, 1.2); return group;
    }

    let fX = -conf.L/2, rX = conf.L/2;
    let shape = new THREE.Shape();
    shape.moveTo(fX, 0.2); shape.lineTo(fX, conf.hF); shape.lineTo(fX+1.0, conf.hH);
    shape.lineTo(fX+1.0+conf.wnd, conf.hR); shape.lineTo(rX-conf.bck-0.5, conf.hR);
    shape.lineTo(rX-0.5, conf.hT); shape.lineTo(rX, conf.hT); shape.lineTo(rX, 0.3); shape.lineTo(fX, 0.2);
    
    let geo = new THREE.ExtrudeGeometry(shape, {depth: conf.W, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:2});
    geo.translate(0, 0, -conf.W/2);
    let pos = geo.attributes.position;
    for(let i=0; i<pos.count; i++){
        let y = pos.getY(i), z = pos.getZ(i), x = pos.getX(i);
        if(y > conf.hH) { let factor = (y - conf.hH) / (conf.hR - conf.hH); pos.setZ(i, z * (1 - factor * 0.15)); }
        if(x < fX + 0.5) { pos.setZ(i, pos.getZ(i) * 0.9); }
    }
    geo.computeVertexNormals();
    
    let bMat = new THREE.MeshPhysicalMaterial({color: conf.color, metalness: 0.7, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.1});
    let body = new THREE.Mesh(geo, bMat); group.add(body);
    
    let gMat = new THREE.MeshPhysicalMaterial({color: 0x111111, metalness: 0.9, roughness: 0.1, transmission: 0.5, transparent: true});
    let roofL = (rX-conf.bck-0.5) - (fX+1.0+conf.wnd);
    let cabin = new THREE.Mesh(new THREE.BoxGeometry(roofL+0.7, conf.hR-conf.hH+0.1, conf.W-0.1), gMat); cabin.position.set(fX+1.0+conf.wnd+roofL/2, (conf.hR+conf.hH)/2, 0); group.add(cabin);
    
    let wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24); wGeo.rotateX(Math.PI/2);
    let tMat = new THREE.MeshStandardMaterial({color: 0x151515, roughness: 0.9});
    let rMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness:0.8, roughness:0.2});
    [[fX+0.8, conf.W/2],[fX+0.8, -conf.W/2],[rX-0.8, conf.W/2],[rX-0.8, -conf.W/2]].forEach(p=>{
        let w = new THREE.Mesh(wGeo, tMat); w.position.set(p[0], 0.35, p[1]);
        let rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.27,16), rMat); rim.rotateX(Math.PI/2); rim.position.copy(w.position);
        group.add(w, rim);
    });

    let hl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshBasicMaterial({color:0xffffff})); hl.position.set(fX+0.05, conf.hF-0.05, conf.W/2-0.3);
    let hr = hl.clone(); hr.position.z = -hl.position.z;
    let tl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshBasicMaterial({color:0xff0000})); tl.position.set(rX-0.05, conf.hT-0.1, conf.W/2-0.3);
    let tr = tl.clone(); tr.position.z = -tl.position.z;
    group.add(hl, hr, tl, tr);
    
    if(conf.sp) {
        let sp = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, conf.W-0.1), gMat); sp.position.set(rX-0.3, conf.hT+0.25, 0);
        let s1 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.05), bMat); s1.position.set(rX-0.3, conf.hT+0.1, 0.4);
        let s2 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.05), bMat); s2.position.set(rX-0.3, conf.hT+0.1, -0.4); group.add(sp, s1, s2);
    }
    group.rotation.y = Math.PI / 2; group.scale.set(1.2, 1.2, 1.2); return group;
}

function createTrack() {
    let tc = document.createElement('canvas'); tc.width = 512; tc.height = 512; let ctx = tc.getContext('2d');
    ctx.fillStyle = '#080812'; ctx.fillRect(0,0,512,512); 
    ctx.strokeStyle='#334466'; ctx.setLineDash([256, 256]); ctx.lineWidth=10; 
    ctx.beginPath();ctx.moveTo(170,0);ctx.lineTo(170,512);ctx.stroke(); 
    ctx.beginPath();ctx.moveTo(342,0);ctx.lineTo(342,512);ctx.stroke();
    trackTexture = new THREE.CanvasTexture(tc); trackTexture.wrapS=trackTexture.wrapT=THREE.RepeatWrapping; trackTexture.repeat.set(1, 20);
    trackPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 1000), new THREE.MeshBasicMaterial({map:trackTexture})); trackPlane.rotation.x = -Math.PI/2; trackPlane.position.set(0, -0.1, -400); scene.add(trackPlane);
}

function createTextPlane(text, isGate) {
    let c = document.createElement('canvas'); c.width = 512; c.height = 256; let ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.textBaseline='middle'; 
    ctx.shadowColor='rgba(0,100,255,0.9)'; ctx.shadowBlur=15; ctx.shadowOffsetX=2; ctx.shadowOffsetY=4;
    
    let fontSize = isGate ? 110 : 150;
    ctx.font = `900 ${fontSize}px "Arial Black", sans-serif`;
    let metrics = ctx.measureText(text);
    while(metrics.width > c.width - 60 && fontSize > 30) { fontSize -= 5; ctx.font = `900 ${fontSize}px "Arial Black", sans-serif`; metrics = ctx.measureText(text); }
    ctx.fillText(text, c.width/2, 128);
    let tex = new THREE.CanvasTexture(c);
    let w = isGate ? 4.5 : 6.5;
    return new THREE.Mesh(new THREE.PlaneGeometry(w, isGate?2.25:3.25), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
}

function clearTrack() { activeWalls.forEach(w=>scene.remove(w)); activeWalls=[]; activeGates.forEach(g=>scene.remove(g)); activeGates=[]; }

function spawnWall(val, zPos) {
    let isStr = typeof val === 'string';
    let isOp = isStr && (val.includes('×') || val.includes('÷'));
    let displayStr = isStr ? val : (val < 0 ? '-' + Math.abs(val) : '+' + val);
    
    let color = 0x1188ff; 
    if (val < 0 && !isStr) color = 0xff4411; 
    if (isOp) color = 0xaa44ff; 
    
    let mat = new THREE.MeshPhysicalMaterial({color: color, transmission:0.8, opacity:1, transparent:true, roughness:0.1, ior:1.5});
    let w = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 1), mat);
    let txt = createTextPlane(displayStr, false); txt.position.z=0.6; w.add(txt);
    w.position.set(0, 4, zPos); w.userData={val:val, collided:false}; scene.add(w); activeWalls.push(w);
}

function spawnGates(corr, zPos) {
    let ws = genWrongs(corr), cl = randInt(0,2), wi=0;
    for(let i=0; i<3; i++){
        let v = (i===cl)?corr:ws[wi++];
        let mat = new THREE.MeshPhysicalMaterial({color:0x2288cc, transmission:0.8, opacity:1, transparent:true, roughness:0.2, ior:1.5});
        let g = new THREE.Mesh(new THREE.BoxGeometry(5, 8, 1), mat);
        let txt = createTextPlane(String(v), true); txt.position.z=0.6; g.add(txt);
        g.position.set(lanePositions[i], 4, zPos); g.userData={val:v, isCorr:i===cl, collided:false, corr:corr}; scene.add(g); activeGates.push(g);
    }
}

function startGame(reviewMode) {
    clearTrack(); score=0; combo=0; consecutiveCorrects=0; accumulatedTime=0; targetLane=1; currentQuestionIndex=0; totalAnswered=0; totalCorrect=0; wrongPool=[]; questionTimestamps=[]; isReviewMode=reviewMode; currentRecordId=null; isDashing=false;
    
    if(window.innerWidth < window.innerHeight) isFirstPerson = true; 
    
    if(reviewMode) { questionQueue=reviewQuestions.slice(); gameTimer=Math.max(60, questionQueue.length*12); currentLevelConfig=EXAM_LEVELS[1]; baseSpeed=20; } 
    else { currentLevelConfig=EXAM_LEVELS[currentLevelId]; gameTimer=180; baseSpeed=currentLevelConfig.baseSpeed; questionQueue=generateQuestions(currentLevelConfig); }
    
    currentSpeed=baseSpeed;
    document.getElementById('hud-level-info').textContent = reviewMode ? '錯題檢討模式' : currentLevelConfig.name;
    document.getElementById('mental-slate').innerHTML = ''; document.getElementById('hud-mode-label').style.display=reviewMode?'block':'none';
    
    createPlayerCar(); 
    changeState('PLAYING'); 
    spawnNext();
}

function spawnNext() {
    if(currentQuestionIndex>=questionQueue.length) return;
    let q = questionQueue[currentQuestionIndex]; speedLocked=true; lockedSpeed=baseSpeed*1.2; questionInProgress=true; isDashing=false;
    
    let cadence = currentLevelConfig.cadenceTime || 0.8;
    let rest = currentLevelConfig.restTime || 1.2;
    let z = currentQuestionIndex === 0 ? -(lockedSpeed * 2.0) : -(lockedSpeed * rest);
    
    if(q.type==='ADD_SUB'||q.type==='ADD_ONLY') {
        for(let i=0; i<q.steps.length; i++) { spawnWall(q.steps[i], z); z -= lockedSpeed * cadence; } 
        spawnGates(q.finalAnswer, z - lockedSpeed * rest);
    } else { 
        spawnWall(String(q.num1), z); z -= lockedSpeed * cadence;
        spawnWall(q.op + ' ' + q.num2, z); z -= lockedSpeed * cadence;
        spawnGates(q.finalAnswer, z - lockedSpeed * rest); 
    }
}

function handleHitWall(w) {
    w.userData.collided = true; w.visible = false; playAbsorbSound();
    
    let v = w.userData.val; 
    score += 10; updateHUD(); 
    
    let isStr = typeof v === 'string';
    let voiceText = isStr ? v.replace('×', '乘 ').replace('÷', '除以 ') : (v < 0 ? "減" + Math.abs(v) : String(Math.abs(v)));
    playVoice(voiceText, currentLevelConfig.cadenceTime); 
    
    if(!isBlindMode) {
        let sl = document.getElementById('mental-slate');
        let d = document.createElement('div'); 
        d.className = 'slate-row' + (!isStr && v < 0 ? ' neg' : ''); 
        if (isStr && (v.includes('×') || v.includes('÷'))) d.style.color = '#f8f'; 
        d.textContent = isStr ? v : (v >= 0 ? '+' : '') + v; 
        sl.appendChild(d); 
        
        if(sl.children.length > 8) sl.removeChild(sl.firstChild);
        if(currentLevelConfig.slateMode === 'fading') { setTimeout(()=>d.classList.add('fading'), 800); setTimeout(()=>d.remove(), 1600); }
    }
}

function handleHitGate(g) {
    activeGates.forEach(gg=>gg.userData.collided=true); activeGates.forEach(gg=>gg.visible=false);
    document.getElementById('mental-slate').innerHTML=''; speedLocked=false; questionInProgress=false; isDashing=false; totalAnswered++; questionTimestamps.push(performance.now());
    
    let qObj = questionQueue[currentQuestionIndex];
    if(g.userData.isCorr) { 
        consecutiveCorrects++; totalCorrect++; 
        if(consecutiveCorrects >= 2) {
            combo = consecutiveCorrects - 1; score += Math.min(500, 50 + combo*20);
            showCombo('COMBO x'+combo, '#4f8');
        } else {
            combo = 0; score += 50; showCombo('CORRECT!', '#4cf');
        }
        playCorrectSound(); 
    } else {
        consecutiveCorrects=0; combo=0; score = Math.max(0, score-20); 
        playWrongSound(); showCombo('MISS', '#f44');
        let v = document.getElementById('vignette-flash'); v.style.opacity=1; setTimeout(()=>v.style.opacity=0, 200);
        let wq = JSON.parse(JSON.stringify(qObj)); wq.playerAnswer = g.userData.val; wrongPool.push(wq);
    }
    
    if (autoCenterEnabled) {
        targetLane = 1;
    }
    
    updateHUD(); currentQuestionIndex++;
    if(gameTimer>0 && currentQuestionIndex<questionQueue.length) setTimeout(spawnNext, 100);
}

function updateHUD() {
    document.getElementById('hud-score-val').textContent = score; let bar = document.getElementById('hud-timer-fill'); bar.style.width = Math.max(0, gameTimer/(isReviewMode?Math.max(60,questionQueue.length*12):180)*100)+'%';
    document.getElementById('hud-timer-val').textContent = gameTimer; document.getElementById('hud-timer-text').className = gameTimer<=30 ? 'urgent' : '';
    let c = document.getElementById('combo-hud'); if(combo>0){ c.textContent='COMBO x'+combo; c.classList.add('visible'); }else{ c.classList.remove('visible'); }
}

function showCombo(txt, col) {
    let ct=document.getElementById('combo-container'), d=document.createElement('div'); 
    d.className='combo-popup'; d.style.color=col; 
    d.style.left = Math.random() > 0.5 ? (Math.random()*15 + 10) + '%' : (Math.random()*15 + 75) + '%'; 
    d.style.top = (Math.random()*20 + 20) + '%'; 
    d.textContent=txt; ct.appendChild(d); setTimeout(()=>d.remove(), 600);
}

function renderLoop(time) {
    requestAnimationFrame(renderLoop);
    let dt = Math.min(time - lastFrameTime, 100) / 1000; lastFrameTime = time;
    
    if(currentGameState === 'SHOWCASE' && showcaseCar) { 
        showcaseCar.rotation.y += 0.5 * dt; 
        renderer.render(showcaseScene, showcaseCamera); 
        return; 
    }
    
    if(currentGameState !== 'PLAYING') { renderer.render(scene, camera); return; }
    
    if(questionInProgress && !isPaused) { accumulatedTime += dt; }
    gameTimer = Math.max(0, (isReviewMode?Math.max(60,questionQueue.length*12):180) - Math.floor(accumulatedTime)); updateHUD();
    if(gameTimer<=0 || (currentQuestionIndex>=questionQueue.length && activeWalls.length===0 && activeGates.length===0)) { changeState('GAMEOVER'); return; }

    let enableBlackHole = currentLevelId >= 11;

    if (enableBlackHole && activeWalls.length === 0 && activeGates.length > 0 && !activeGates[0].userData.collided) {
        if(!isDashing) {
            isDashing = true; 
            gatePhaseTotalT = currentLevelConfig.restTime + 1.2; 
            gatePhaseTimer = gatePhaseTotalT; 
            gatePhaseStartZ = activeGates[0].position.z;
        }
        gatePhaseTimer -= dt; if(gatePhaseTimer < 0) gatePhaseTimer = 0;
        
        let ratio = Math.pow(gatePhaseTimer / gatePhaseTotalT, 3);
        let zPos = gatePhaseStartZ * ratio;
        let visualSpeed = Math.abs(gatePhaseStartZ * 3 * Math.pow(gatePhaseTimer, 2) / Math.pow(gatePhaseTotalT, 3));
        trackTexture.offset.y += visualSpeed * dt * 0.05;

        for(let i=activeGates.length-1; i>=0; i--) {
            let g = activeGates[i]; g.position.z = zPos;
            if(g.position.z > -4 && g.position.z < 2.5 && !g.userData.collided) { 
                if(Math.abs(g.position.x - lanePositions[targetLane]) < 1.0) handleHitGate(g); 
            }
            if(g.position.z > 5) { scene.remove(g); activeGates.splice(i,1); }
        }
    } else {
        isDashing = false;
        let spd = speedLocked ? lockedSpeed : currentSpeed; 
        if(!speedLocked) currentSpeed += (baseSpeed - currentSpeed)*0.05; 
        trackTexture.offset.y += spd * dt * 0.05;
        
        for(let i=activeWalls.length-1; i>=0; i--) { 
            let w = activeWalls[i]; w.position.z += spd * dt; 
            if(w.position.z > -2 && w.position.z < 3 && !w.userData.collided) handleHitWall(w); 
            if(w.position.z > 5) { scene.remove(w); activeWalls.splice(i,1); } 
        }
        for(let i=activeGates.length-1; i>=0; i--) { 
            let g = activeGates[i]; g.position.z += spd * dt; 
            if(g.position.z > -4 && g.position.z < 2.5 && !g.userData.collided) { 
                if(Math.abs(g.position.x - lanePositions[targetLane]) < 1.0) handleHitGate(g); 
            } 
            if(g.position.z > 5) { scene.remove(g); activeGates.splice(i,1); } 
        }
    }

    // 防斷層強制結算機制
    if (activeGates.length > 0 && activeGates[0].position.z >= 2.5 && !activeGates[0].userData.collided) {
        let hitGate = activeGates.find(ag => Math.abs(ag.position.x - lanePositions[targetLane]) < 2.0) || activeGates[0];
        handleHitGate(hitGate);
    }
    
    if(playerCar) {
        playerCar.position.x += (lanePositions[targetLane] - playerCar.position.x) * 0.15; 
        if (isFirstPerson) {
            camera.position.x += (playerCar.position.x - camera.position.x) * 0.3;
            camera.lookAt(camera.position.x, 2.0, -60);
        } else {
            let targetCamX = playerCar.position.x * 0.4;
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.lookAt(camera.position.x * 0.5, 1.5, -60);
        }
    }
    
    renderer.render(scene, camera);
}

function computeRadar() { let acc=totalAnswered>0?totalCorrect/totalAnswered:0, vel=Math.min(1, totalAnswered/questionQueue.length), foc=1-(wrongPool.length/questionQueue.length), p=Math.random()*0.2+0.8; return [vel, acc, foc*p, acc*p, p]; }
function drawRadar(stats) {
    let cv = document.getElementById('radar-canvas'); if(!cv) return; let ctx=cv.getContext('2d'), cx=120, cy=120, maxR=85; ctx.clearRect(0,0,240,240);
    ctx.strokeStyle='rgba(100,150,200,0.2)'; for(let j=1;j<=4;j++){ let r=maxR*(j/4); ctx.beginPath(); for(let i=0;i<5;i++){ let a=(i*2*Math.PI/5)-Math.PI/2; ctx[i===0?'moveTo':'lineTo'](cx+r*Math.cos(a),cy+r*Math.sin(a)); } ctx.closePath(); ctx.stroke(); }
    let lbl=['速度','準確度','專注力','穩定度','預判力']; ctx.fillStyle='#8bd'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<5;i++){ let a=(i*2*Math.PI/5)-Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a)); ctx.stroke(); ctx.fillText(lbl[i], cx+(maxR+20)*Math.cos(a), cy+(maxR+15)*Math.sin(a)); }
    ctx.beginPath(); for(let i=0;i<5;i++){ let a=(i*2*Math.PI/5)-Math.PI/2, r=maxR*stats[i]; ctx[i===0?'moveTo':'lineTo'](cx+r*Math.cos(a), cy+r*Math.sin(a)); } ctx.closePath(); ctx.fillStyle='rgba(80,200,120,0.3)'; ctx.fill(); ctx.strokeStyle='#4c7'; ctx.lineWidth=2; ctx.stroke();
}
function analyzeWrong() {
    let t=[]; let cE=0, bE=0; wrongPool.forEach(q=>{if(q.type==='ADD_SUB'&&q.playerAnswer!==undefined){let d=Math.abs(q.playerAnswer-q.finalAnswer);if(d===10||d===20)cE++;else if(d===5)bE++;}});
    if(cE>=2) t.push('進退位失誤'); if(bE>=1) t.push('補數混淆'); return t;
}

function saveRecord(name, id) {
    let existingIdx = appData.records.findIndex(r => r.id === id);
    let r = { id: id, name: name, lv: currentLevelId, lvName: currentLevelConfig.name, score: score, correct: totalCorrect, total: questionQueue.length, pass: totalCorrect>=currentLevelConfig.passReq, wrongs: JSON.parse(JSON.stringify(wrongPool)), date: new Date().toLocaleDateString() };
    r.hash = genHash(r.name+'|'+r.score+'|'+r.date+GAME_SALT);
    if(existingIdx >= 0) appData.records[existingIdx] = r; else appData.records.push(r);
    saveData();
}

function doGameOver() {
    let pass = totalCorrect >= (currentLevelConfig?currentLevelConfig.passReq:0);
    let rg = document.getElementById('report-grid');
    rg.innerHTML = `<div class="rl">檢定關卡：</div><div class="rv">${currentLevelConfig?currentLevelConfig.name:'-'}</div><div class="rl">最終得分：</div><div class="rv ${pass?'pass':'fail'}">${score} 分</div><div class="rl">答對題數：</div><div class="rv ${pass?'pass':'fail'}">${totalCorrect} / ${questionQueue.length}</div><div class="rl">結果判定：</div><div class="rv ${pass?'pass':'fail'}">${isReviewMode?'檢討完畢':(pass?SVG_CHECK+' 合格':SVG_CROSS+' 未通過')}</div>`;
    drawRadar(computeRadar());
    let tgs = analyzeWrong(), wt = document.getElementById('weakness-tags'); wt.innerHTML='';
    tgs.forEach(t=>{let s=document.createElement('span'); s.className='wtag'; s.innerHTML=SVG_WARN+' '+t; wt.appendChild(s);});
    document.getElementById('advisor-text').textContent = tgs.length===0?'表現優異！建議挑戰更高級別！':'建議針對錯題進行靜態檢討，釐清計算盲點！';
    
    newlyUnlockedCarIdx = -1;
    if(!isReviewMode) {
        let d = new Date(); let defaultName = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        currentRecordId = Date.now(); saveRecord(defaultName, currentRecordId);
        
        if (pass && !appData.garage.unlockedCars[currentLevelId]) {
            appData.garage.unlockedCars[currentLevelId] = true;
            saveData();
            newlyUnlockedCarIdx = currentLevelId; 
        }
    }
    
    let saveArea = document.getElementById('save-name-area'); saveArea.style.display = isReviewMode ? 'none' : 'block'; document.getElementById('player-name-input').value = '';
    let btnCert = document.getElementById('btn-gen-cert');
    btnCert.style.display = (pass && !isReviewMode) ? 'inline-flex' : 'none';
}

function triggerShowcase(idx, isNew = false) {
    changeState('SHOWCASE'); 
    
    let titleEl = document.querySelector('.showcase-title');
    titleEl.textContent = isNew ? "NEW CAR UNLOCKED!" : "VEHICLE SHOWCASE";

    let carNameEl = document.getElementById('showcase-car-name');
    carNameEl.textContent = CAR_CATALOG[idx].name;
    carNameEl.dataset.carIdx = idx; 

    if(showcaseCar) showcaseScene.remove(showcaseCar); 
    showcaseCar = buildCarMesh(idx); 
    showcaseCar.scale.set(2.5, 2.5, 2.5); 
    showcaseCar.position.y = -0.2;
    showcaseScene.add(showcaseCar);
}

function renderHistoryUI() {
    let ct = document.getElementById('history-list'); ct.innerHTML=''; if(appData.records.length===0){ ct.innerHTML='<p style="text-align:center;color:#8ab;">尚無紀錄</p>'; return; }
    let ht = '<table class="hist-table"><tr><th>✔</th><th>姓名</th><th>級別</th><th>得分</th><th>錯題</th></tr>';
    let sortedRecords = [...appData.records].sort((a,b)=>b.id-a.id);
    sortedRecords.forEach(r=>{ let t = r.hash===genHash(r.name+'|'+r.score+'|'+r.date+GAME_SALT); ht+=`<tr style="color:${t?'#fff':'#e44'}"><td><input type="checkbox" class="h-chk" data-id="${r.id}" ${r.wrongs.length?'':'disabled'}/></td><td>${r.name}</td><td>${r.lvName}</td><td>${r.score}</td><td>${r.wrongs.length}</td></tr>`; });
    ct.innerHTML = ht+'</table>'; document.querySelectorAll('.h-chk').forEach(c=>c.onchange=()=>{ document.getElementById('btn-review-run').disabled = !document.querySelector('.h-chk:checked'); });
}

function renderReviewCards(qs) {
    let ct = document.getElementById('review-cards-container'); ct.innerHTML='';
    qs.forEach((q,i)=>{
        let c = document.createElement('div'); c.className='review-card';
        if(q.type==='ADD_SUB') { c.innerHTML=`<div class="rc-expr">錯題 #${i+1}</div>${q.steps.map(s=>`<div class="rc-step">${s>0?'+':''}${s}</div>`).join('')}<div class="rc-answer">正解: ${q.finalAnswer} | 你答: ${q.playerAnswer||'?'}</div>`; }
        else { c.innerHTML=`<div class="rc-expr">錯題 #${i+1}<br/>${q.expr} = ?</div><div class="rc-answer">正解: ${q.finalAnswer} | 你答: ${q.playerAnswer||'?'}</div>`; } ct.appendChild(c);
    });
}

function drawCert(name, lv, sc) {
    let c=document.createElement('canvas'); c.width=1600; c.height=1100; let ctx=c.getContext('2d');
    ctx.fillStyle='#fdfaf2'; ctx.fillRect(0,0,1600,1100); ctx.strokeStyle='#c5a059'; ctx.lineWidth=15; ctx.strokeRect(40,40,1520,1020); ctx.lineWidth=4; ctx.strokeRect(60,60,1480,980);
    ctx.fillStyle='#222'; ctx.font='bold 60px serif'; ctx.textAlign='center'; ctx.fillText('心 算 檢 定 合 格 證 書', 800, 200); ctx.beginPath(); ctx.moveTo(300,240); ctx.lineTo(1300,240); ctx.stroke();
    ctx.font='35px serif'; ctx.textAlign='left'; ctx.fillText('學員姓名：'+name, 250, 400); ctx.fillText('茲參加「3D 心算競速：極限檢定」，成績核定達 '+sc+' 分。', 250, 500); ctx.fillText('核定級階：'+lv, 250, 600);
    ctx.font='28px serif'; ctx.textAlign='right'; let d=new Date(); 
    ctx.fillText(d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日', 1350, 800);
    ctx.beginPath(); ctx.arc(1200,850,50,0,Math.PI*2); ctx.strokeStyle='#c00'; ctx.lineWidth=4; ctx.stroke(); ctx.fillStyle='#c00'; ctx.font='18px serif'; ctx.textAlign='center'; 
    ctx.fillText('心算競速', 1200, 855);
    return c.toDataURL('image/jpeg', 0.9);
}

// 修正：加入鍵盤 1, 2, 3 的絕對定位切換車道功能
document.addEventListener('keydown', e=>{
    if(currentGameState==='PLAYING') {
        if(['Space', 'ControlLeft', 'ControlRight'].includes(e.code) || e.key === ' ') e.preventDefault();
        if(e.ctrlKey && e.code === 'Space') e.preventDefault();
        
        const k = e.key.toLowerCase(), c = e.code;
        
        // 相對定位切換
        if(k==='a' || k==='s' || k==='arrowleft' || c==='ControlLeft' || c==='ControlRight') tLane(-1);
        if(k==='d' || k==='f' || k==='arrowright' || c==='Space') tLane(1);
        
        // 絕對定位切換 (支援上方數字鍵與右側數字鍵盤)
        if(c === 'Digit1' || c === 'Numpad1' || k === '1') targetLane = 0;
        if(c === 'Digit2' || c === 'Numpad2' || k === '2') targetLane = 1;
        if(c === 'Digit3' || c === 'Numpad3' || k === '3') targetLane = 2;
        
        if(k==='escape') changeState('PAUSED');
    }
}, {passive: false});

let tsX = 0, tsY = 0, touchMoved = false;

document.addEventListener('touchstart', e=>{
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
    touchMoved = false;
}, {passive:true});

document.addEventListener('touchmove', e=>{
    if(currentGameState==='PLAYING') {
        let currentX = e.touches[0].clientX;
        let dx = currentX - tsX;
        let threshold = window.innerWidth * 0.08;

        if (Math.abs(dx) > threshold) {
            touchMoved = true;
            let steps = Math.floor(Math.abs(dx) / threshold);
            let dir = Math.sign(dx);
            tLane(dir * steps);
            tsX = tsX + (dir * steps * threshold);
        }
    }
}, {passive:true});

document.addEventListener('touchend', e=>{
    if(currentGameState==='PLAYING' && !touchMoved) {
        let endX = e.changedTouches[0].clientX;
        let third = window.innerWidth / 3;
        
        if (endX < third) {
            targetLane = 0;
        } else if (endX < third * 2) {
            targetLane = 1;
        } else {
            targetLane = 2;
        }
    }
}, {passive:true});

function tLane(dir) { 
    targetLane += dir; 
    if(targetLane < 0) targetLane = 0; 
    if(targetLane > 2) targetLane = 2; 
}
