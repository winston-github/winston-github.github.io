<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D 閃算賽車：極限檢定 V4 Deluxe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  position:fixed;top:0;left:0;width:100%;height:100%;
  overflow:hidden;touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-touch-callout:none;
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background:#050508;color:#fff;
}
#three-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}
.view-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:none;pointer-events:auto;}
.view-layer.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}
#game-hud-view.active{display:block;pointer-events:none;}
#game-hud-view .hud-interactive{pointer-events:auto;}

.game-title{font-size:clamp(28px,6vw,56px);font-weight:900;text-align:center;color:#fff;text-shadow:0 0 15px rgba(68,170,255,0.6);letter-spacing:2px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-style:italic;}
.game-subtitle{font-size:clamp(13px,3vw,22px);color:#aaa;text-align:center;margin-bottom:25px;letter-spacing:5px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 32px;margin:6px;
  font-size:clamp(14px,2.5vw,18px);font-family:inherit;font-weight:bold;
  color:#fff;background:linear-gradient(135deg, rgba(30,50,90,0.9), rgba(15,25,45,0.9));
  border:1px solid #4a8; border-radius:8px;cursor:pointer;
  transition:all 0.2s; box-shadow:0 4px 10px rgba(0,0,0,0.5);
}
.btn:hover,.btn:active{background:linear-gradient(135deg, rgba(50,80,140,0.9), rgba(25,45,85,0.9));transform:translateY(-2px);box-shadow:0 6px 15px rgba(68,170,255,0.4);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn.danger{border-color:#e05050; background:linear-gradient(135deg, rgba(140,30,30,0.9), rgba(70,15,15,0.9));}
.btn.gold{border-color:#d4a830; background:linear-gradient(135deg, rgba(140,110,30,0.9), rgba(70,55,15,0.9));}
.btn.garage{border-color:#9933ff; background:linear-gradient(135deg, rgba(90,30,140,0.9), rgba(45,15,70,0.9));}

.panel{
  background:rgba(10,12,18,0.92);border:1px solid #334;border-radius:12px;
  padding:20px;max-width:95vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.8);
}
.panel::-webkit-scrollbar{width:6px;} .panel::-webkit-scrollbar-thumb{background:#557;border-radius:3px;}

#hud-score-bar{position:absolute;top:10px;left:15px;z-index:20;font-size:clamp(14px,2.5vw,18px);color:#8ad;}
#hud-score-bar .score-val{color:#fff;font-weight:bold;font-size:1.2em;font-family:'Arial Black',sans-serif;}
#hud-timer-area{position:absolute;top:10px;right:15px;z-index:20;text-align:right;}
#hud-timer-text{font-size:clamp(14px,2.5vw,18px);color:#8ad;}
#hud-timer-text .timer-val{color:#fff;font-weight:bold;font-family:'Arial Black',sans-serif;}
#hud-timer-bar{width:clamp(100px,25vw,180px);height:6px;background:#223;border-radius:3px;margin-top:4px;overflow:hidden;}
#hud-timer-fill{height:100%;background:linear-gradient(90deg, #38f, #4df); transition:width 0.1s linear;}
#hud-timer-text.urgent ~ #hud-timer-bar #hud-timer-fill{background:#f33;}
#hud-level-info{position:absolute;top:38px;left:15px;z-index:20;font-size:clamp(11px,2vw,14px);color:#68a;}
#hud-mode-label{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:20;font-size:clamp(12px,2.5vw,16px);color:#d09030;display:none;}

#mental-slate{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.slate-row{font-size:clamp(16px,3.5vw,24px);font-weight:bold;color:#fff;padding:2px 6px;text-shadow:0 0 5px #444;transition:opacity 0.8s;font-family:'Courier New',monospace;}
.slate-row.neg{color:#fa6;} .slate-row.fading{opacity:0!important;}

#vignette-flash{position:absolute;top:0;left:0;width:100%;height:100%;z-index:18;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(255,20,20,0.4) 100%);transition:opacity 0.1s;}
#bullet-time-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:17;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center, transparent 40%, rgba(0,80,200,0.3) 100%);transition:opacity 0.3s;}

#combo-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:23;overflow:hidden;}
.combo-popup{position:absolute;font-weight:900;font-style:italic;pointer-events:none;animation:comboEdge 0.6s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,0.8);}
@keyframes comboEdge{0%{transform:scale(0.5);opacity:0;} 20%{transform:scale(1.2);opacity:1;} 100%{transform:scale(1.0);opacity:0;}}
#combo-hud{position:absolute;top:65px;left:50%;transform:translateX(-50%);z-index:22;font-size:clamp(16px,4vw,26px);font-weight:900;color:#fff;text-shadow:0 0 10px #08f;opacity:0;transition:opacity 0.3s;}
#combo-hud.visible{opacity:1;}

.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:95%;max-width:700px;max-height:55vh;overflow-y:auto;padding:10px;}
.level-grid::-webkit-scrollbar{width:6px;} .level-grid::-webkit-scrollbar-thumb{background:#446;border-radius:3px;}
.level-btn{padding:12px 6px;font-size:clamp(12px,2vw,15px);color:#ddd;background:linear-gradient(180deg,rgba(30,40,60,0.9),rgba(15,20,30,0.9));border:1px solid #457;border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;}
.level-btn:hover,.level-btn:active{border-color:#6af;box-shadow:0 0 10px rgba(100,170,255,0.4);transform:translateY(-2px);}
.level-btn .lv-name{font-weight:bold;margin-bottom:4px;color:#fff;}
.level-btn .lv-info{font-size:0.85em;color:#8ab;}

.garage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;width:95%;max-width:650px;max-height:60vh;overflow-y:auto;padding:10px;}
.car-card{background:rgba(20,20,30,0.9);border:2px solid #334;border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:0.2s;position:relative;}
.car-card.locked{opacity:0.5;filter:grayscale(100%);cursor:not-allowed;}
.car-card:hover:not(.locked){border-color:#a4f;background:rgba(40,30,60,0.9);transform:translateY(-2px);}
.car-card.equipped{border-color:#4f8;background:rgba(20,50,30,0.9);box-shadow:0 0 15px rgba(60,255,120,0.3);}
.car-color-block{width:80%;height:40px;margin:0 auto 8px;border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,0.5);}
.car-name{font-size:12px;font-weight:bold;color:#ccc;}

.toggle-row{display:flex;align-items:center;gap:10px;margin:8px 0;justify-content:center;font-size:clamp(13px,2.5vw,16px);color:#bbb;}
.toggle-sw{position:relative;width:48px;height:26px;background:#223;border-radius:13px;cursor:pointer;border:1px solid #445;transition:all 0.2s;}
.toggle-sw.on{background:#2a6;border-color:#4f8;}
.toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#ddd;border-radius:50%;transition:transform 0.2s;}
.toggle-sw.on::after{transform:translateX(22px);background:#fff;}

.report-title{font-size:clamp(20px,4.5vw,34px);color:#fff;margin-bottom:15px;text-align:center;font-weight:900;text-shadow:0 0 10px rgba(255,215,0,0.5);}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:clamp(13px,2.5vw,17px);margin-bottom:15px;}
.report-grid .rl{color:#8ab;text-align:right;}
.report-grid .rv{color:#fff;font-weight:bold;}
.report-grid .rv.pass{color:#4e8;} .report-grid .rv.fail{color:#e44;}
#showcase-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:50px;}
#showcase-overlay.active{display:flex;}
.showcase-text{position:absolute;top:10%;text-align:center;width:100%;pointer-events:none;}
.showcase-title{font-size:clamp(30px,6vw,50px);font-weight:900;color:#fd4;text-shadow:0 0 20px rgba(255,200,0,0.8);letter-spacing:2px;margin-bottom:10px;}
.showcase-sub{font-size:clamp(18px,4vw,30px);color:#fff;font-style:italic;}

@media (max-width:480px){
  .btn{padding:12px 20px;font-size:14px;}
  .level-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
}
@media (min-width:768px){
  #mental-slate{top:14px;right:15px;left:auto;transform:none;flex-direction:column;align-items:flex-end;}
}
svg.icon-inline { vertical-align: text-bottom; margin-right: 6px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="three-container"></div>

<!-- MENU -->
<div id="menu-view" class="view-layer active">
  <div class="game-title">3D 閃算賽車</div>
  <div class="game-subtitle">極限檢定 Deluxe Edition</div>
  <div style="margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;">
    <div class="toggle-row" id="voice-setting-row" style="margin:0;">
      <span>電腦精準語音</span><div class="toggle-sw on" id="voice-toggle"></div>
    </div>
    <div class="toggle-row" style="margin:0;">
      <span>遊戲音效</span><div class="toggle-sw on" id="sfx-toggle"></div>
    </div>
  </div>
  <button class="btn" id="btn-start">啟動心算檢定</button>
  <button class="btn garage" id="btn-garage">專屬跑車車庫</button>
</div>

<!-- LEVEL SELECT -->
<div id="level-select-view" class="view-layer">
  <div class="panel">
    <div class="game-title" style="font-size:clamp(22px,4vw,34px);">選擇檢定關卡</div>
    <div class="toggle-row">
      <span>盲測硬核模式</span><div class="toggle-sw" id="blind-toggle"></div>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <div style="text-align:center;margin-top:15px;"><button class="btn" id="btn-back-menu">返回主選單</button></div>
  </div>
</div>

<!-- GARAGE -->
<div id="garage-view" class="view-layer">
  <div class="panel" style="text-align:center;">
    <div class="game-title" style="font-size:clamp(22px,4vw,34px);">專屬跑車車庫</div>
    <div style="color:#aaa;margin-bottom:15px;">通關檢定級別即可解鎖對應2026年式豪華跑車</div>
    <div class="garage-grid" id="garage-grid"></div>
    <button class="btn" id="btn-garage-back" style="margin-top:15px;">返回主選單</button>
  </div>
</div>

<!-- HUD -->
<div id="game-hud-view" class="view-layer">
  <div id="hud-score-bar">SCORE: <span class="score-val" id="hud-score-val">0</span></div>
  <div id="hud-timer-area">
    <div id="hud-timer-text">剩餘: <span class="timer-val" id="hud-timer-val">180</span>s</div>
    <div id="hud-timer-bar"><div id="hud-timer-fill" style="width:100%;"></div></div>
  </div>
  <div id="hud-level-info"></div>
  <div id="hud-mode-label">【錯題檢討模式】</div>
  <div id="mental-slate"></div>
  <div id="combo-container"></div>
  <div id="combo-hud"></div>
  <div id="vignette-flash"></div>
  <div id="bullet-time-overlay"></div>
  <button class="btn hud-interactive" id="btn-pause" style="position:absolute;bottom:15px;right:15px;padding:12px;border-radius:50%;z-index:24;">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
  </button>
</div>

<!-- PAUSE -->
<div id="pause-overlay" class="view-layer" style="background:rgba(0,0,0,0.8);">
  <div class="panel" style="text-align:center;">
    <div class="game-title" style="font-size:28px;">暫停</div>
    <button class="btn" id="btn-resume">繼續測驗</button>
    <button class="btn danger" id="btn-quit">放棄並返回選單</button>
  </div>
</div>

<!-- GAMEOVER -->
<div id="gameover-view" class="view-layer">
  <div class="panel" style="width:90%;max-width:500px;text-align:center;">
    <div class="report-title" id="report-title">檢定報告</div>
    <div class="report-grid" id="report-grid"></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:15px;">
      <button class="btn gold" id="btn-claim-car" style="display:none;width:100%;">🏆 領取解鎖新跑車 🏆</button>
      <button class="btn" id="btn-gameover-menu">確認並返回</button>
    </div>
  </div>
</div>

<!-- CAR SHOWCASE OVERLAY -->
<div id="showcase-overlay">
  <div class="showcase-text">
    <div class="showcase-title">NEW CAR UNLOCKED!</div>
    <div class="showcase-sub" id="showcase-car-name">Porsche 911 GT3 (2026)</div>
  </div>
  <button class="btn gold" id="btn-showcase-done" style="z-index:101;margin-bottom:30px;font-size:18px;">裝備並前往車庫</button>
</div>

let audioCtx = null, AudioMixer = { initialized: false, channels: {} };
function ensureAudioCtx() {
    try { if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); initMixer(); }
          if(audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
}
function initMixer() {
    if(AudioMixer.initialized) return;
    AudioMixer.channels.sfx = audioCtx.createGain(); AudioMixer.channels.sfx.gain.value = 0.5;
    AudioMixer.channels.sfx.connect(audioCtx.destination); AudioMixer.initialized = true;
}
function playTone(freq, type, dur, vol) {
    if(!isSfxEnabled || !audioCtx || !AudioMixer.initialized) return;
    try {
        let t = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.01, t + dur);
        osc.connect(g); g.connect(AudioMixer.channels.sfx); osc.start(t); osc.stop(t+dur);
    } catch(e){}
}
function playCorrectSound() { playTone(880, 'sine', 0.2, 0.4); setTimeout(()=>playTone(1320, 'sine', 0.3, 0.4), 80); }
function playWrongSound() { playTone(150, 'sawtooth', 0.4, 0.5); }
function playAbsorbSound() { playTone(600 + Math.random()*200, 'sine', 0.1, 0.3); }

function playVoice(text) {
    if (!isVoiceEnabled || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    let utt = new SpeechSynthesisUtterance(text); utt.lang = 'zh-TW'; utt.rate = 1.6;
    window.speechSynthesis.speak(utt);
}
function estimateSpeechDuration(value) { return String(Math.abs(value)).length * 0.25 + 0.2; }

function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function randNum(digits) { return digits<=1 ? randInt(1,9) : randInt(Math.pow(10,digits-1), Math.pow(10,digits)-1); }

function generateAddSub(minD, maxD, rows, ops) {
    for(let a=0; a<100; a++) {
        let st=[], cum=[], d=randInt(minD, maxD), rt=randNum(d); st.push(rt); cum.push(rt);
        for(let i=1; i<rows; i++){
            let val=randNum(randInt(minD,maxD)), op=ops[randInt(0,ops.length-1)];
            if(op==='-') { st.push(-val); rt-=val; } else { st.push(val); rt+=val; }
            cum.push(rt);
        }
        if(rt>0) return {type:'ADD_SUB', steps:st, finalAnswer:rt};
    }
    let st=[], rt=0; for(let i=0;i<rows;i++){ let v=randNum(maxD); st.push(v); rt+=v; }
    return {type:'ADD_SUB', steps:st, finalAnswer:rt};
}
function generateMul(m1, m2) { let a=randNum(m1), b=randNum(m2); return {type:'MUL', expr:a+' × '+b, finalAnswer:a*b}; }
function generateDiv(d1, d2) { 
    let div=randNum(d2); if(div===0)div=2; 
    let quo=randNum(Math.max(1, d1-d2)), dvd=div*quo;
    return {type:'DIV', expr:dvd+' ÷ '+div, finalAnswer:quo};
}

function generateQuestions(lc) {
    let q=[]; 
    if(lc.type==='ADD_ONLY' || lc.type==='ADD_SUB') { for(let i=0; i<lc.totalQ; i++) q.push(generateAddSub(lc.minDigits, lc.maxDigits, lc.rows, lc.ops)); }
    else if(lc.type==='MIXED_THREE') {
        let p3=Math.floor(lc.totalQ/3);
        for(let i=0; i<p3; i++) q.push(generateAddSub(lc.addSub.minDigits, lc.addSub.maxDigits, lc.addSub.rows, lc.addSub.ops));
        for(let i=0; i<p3; i++) q.push(generateMul(lc.mul.m1, lc.mul.m2));
        for(let i=0; i<lc.totalQ-p3*2; i++) q.push(generateDiv(lc.div.d1, lc.div.d2));
    }
    return q;
}
function genWrongs(correct) {
    let w=new Set(); w.add(correct+10); w.add(correct-10); w.add(correct+1); w.add(correct-1);
    if(correct>5)w.add(correct+5); w.add(correct+randInt(2,8)); w.delete(correct); w.delete(0);
    let arr=Array.from(w).filter(v=>v>0);
    while(arr.length<2){let r=correct+randInt(1,9)*(Math.random()>0.5?1:-1); if(r>0&&r!==correct&&!arr.includes(r))arr.push(r);}
    return [arr[0], arr[1]];
}

// 實名跑車程序化生成器
function buildCarMesh(idx) {
    let conf = CAR_CATALOG[idx] || CAR_CATALOG[0];
    let group = new THREE.Group();
    let fX = -conf.L/2, rX = conf.L/2;
    
    let shape = new THREE.Shape();
    shape.moveTo(fX, 0.2); shape.lineTo(fX, conf.hF); shape.lineTo(fX+conf.hood, conf.hH);
    shape.lineTo(fX+conf.hood+conf.wnd, conf.hR); shape.lineTo(rX-conf.bck-0.5, conf.hR);
    shape.lineTo(rX-0.5, conf.hT); shape.lineTo(rX, conf.hT); shape.lineTo(rX, 0.3); shape.lineTo(fX, 0.2);
    
    let exSet = {depth: conf.W, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:2};
    let geo = new THREE.ExtrudeGeometry(shape, exSet); geo.translate(0, 0, -conf.W/2);
    
    let bMat = new THREE.MeshStandardMaterial({color: conf.color, roughness: 0.15, metalness: 0.7});
    let body = new THREE.Mesh(geo, bMat); group.add(body);
    
    let roofL = (rX-conf.bck-0.5) - (fX+conf.hood+conf.wnd);
    let cabinGeo = new THREE.BoxGeometry(roofL+0.7, conf.hR-conf.hH+0.1, conf.W+0.05);
    let cabinMat = new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.1, metalness: 0.9});
    let cabin = new THREE.Mesh(cabinGeo, cabinMat); cabin.position.set(fX+conf.hood+conf.wnd+roofL/2, (conf.hR+conf.hH)/2, 0); group.add(cabin);
    
    let wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 20); wGeo.rotateX(Math.PI/2);
    let wMat = new THREE.MeshStandardMaterial({color: 0x151515, roughness: 0.9});
    [[fX+0.8, conf.W/2+0.05],[fX+0.8, -conf.W/2-0.05],[rX-0.8, conf.W/2+0.05],[rX-0.8, -conf.W/2-0.05]].forEach(p=>{
        let w = new THREE.Mesh(wGeo, wMat); w.position.set(p[0], 0.35, p[1]); group.add(w);
    });
    
    if(conf.sp) {
        let sp = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, conf.W-0.1), cabinMat); sp.position.set(rX-0.3, conf.hT+0.25, 0);
        let s1 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.05), bMat); s1.position.set(rX-0.3, conf.hT+0.1, 0.4);
        let s2 = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.05), bMat); s2.position.set(rX-0.3, conf.hT+0.1, -0.4);
        group.add(sp, s1, s2);
    }
    
    group.rotation.y = Math.PI / 2; // 車頭朝 -Z
    group.scale.set(1.2, 1.2, 1.2);
    return group;
}

function createPlayerCar() {
    if(playerCar) scene.remove(playerCar);
    playerCar = buildCarMesh(userData.equippedCar);
    playerCar.position.set(lanePositions[1], 0, 0);
    scene.add(playerCar);
}

function createTrack() {
    let tc = document.createElement('canvas'); tc.width = 512; tc.height = 512; let ctx = tc.getContext('2d');
    ctx.fillStyle = '#080812'; ctx.fillRect(0,0,512,512); ctx.strokeStyle = '#223355'; ctx.lineWidth = 2;
    for(let i=0; i<=512; i+=64){ ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(512,i);ctx.stroke(); }
    ctx.strokeStyle='#334466'; ctx.setLineDash([20,30]); ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(170,0);ctx.lineTo(170,512);ctx.stroke(); ctx.beginPath();ctx.moveTo(342,0);ctx.lineTo(342,512);ctx.stroke();
    trackTexture = new THREE.CanvasTexture(tc); trackTexture.wrapS=trackTexture.wrapT=THREE.RepeatWrapping; trackTexture.repeat.set(1, 20);
    trackPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 1000), new THREE.MeshBasicMaterial({map:trackTexture})); 
    trackPlane.rotation.x = -Math.PI/2; trackPlane.position.set(0, -0.1, -400); scene.add(trackPlane);
}

// 動態文字貼圖產生器 (Hyper-Casual Style)
function createTextPlane(text, isGate) {
    let c = document.createElement('canvas'); c.width=512; c.height=256; let ctx = c.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.font='900 '+(isGate?'120px':'160px')+' "Arial Black", sans-serif'; 
    ctx.textAlign='center'; ctx.textBaseline='middle'; 
    ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=10; ctx.shadowOffsetX=4; ctx.shadowOffsetY=4;
    ctx.fillText(text, 256, 128);
    let tex = new THREE.CanvasTexture(c);
    let mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false});
    return new THREE.Mesh(new THREE.PlaneGeometry(isGate?4.5:6.5, isGate?2.25:3.25), mat);
}

function clearTrack() {
    activeWalls.forEach(w => scene.remove(w)); activeWalls=[];
    activeGates.forEach(g => scene.remove(g)); activeGates=[];
}

function spawnWall(val, zPos) {
    let mat = new THREE.MeshStandardMaterial({color:val<0?0xff5522:0x2288ff, transparent:true, opacity:0.4, roughness:0.1});
    let w = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 1), mat);
    let txt = createTextPlane(val<0 ? '-'+Math.abs(val) : '+'+val, false); txt.position.z=0.6; w.add(txt);
    w.position.set(0, 4, zPos); w.userData={val:val, collided:false};
    scene.add(w); activeWalls.push(w);
}

function spawnGates(corr, exprStr, zPos) {
    let ws = genWrongs(corr), cl = randInt(0,2), wi=0;
    for(let i=0; i<3; i++){
        let v = (i===cl)?corr:ws[wi++];
        let mat = new THREE.MeshStandardMaterial({color:0x3399ff, transparent:true, opacity:0.45});
        let g = new THREE.Mesh(new THREE.BoxGeometry(5, 8, 1), mat);
        let txt = createTextPlane(exprStr ? exprStr+'=?' : v, true); txt.position.z=0.6; g.add(txt);
        g.position.set(lanePositions[i], 4, zPos); g.userData={val:v, isCorr:i===cl, collided:false};
        scene.add(g); activeGates.push(g);
    }
}

function startGame() {
    clearTrack(); score=0; combo=0; accumulatedTime=0; gameTimer=180; targetLane=1; currentQuestionIndex=0; totalAnswered=0; totalCorrect=0;
    currentLevelConfig = EXAM_LEVELS[currentLevelId]; baseSpeed = currentLevelConfig.baseSpeed; currentSpeed = baseSpeed;
    questionQueue = generateQuestions(currentLevelConfig);
    document.getElementById('hud-level-info').textContent = currentLevelConfig.name;
    document.getElementById('mental-slate').innerHTML = '';
    createPlayerCar(); changeState('PLAYING'); spawnNext();
}

function spawnNext() {
    if(currentQuestionIndex>=questionQueue.length) return;
    let q = questionQueue[currentQuestionIndex]; speedLocked=true; lockedSpeed=baseSpeed*1.2; questionInProgress=true;
    let z = currentQuestionIndex===0 ? -60 : -100;
    
    if(q.type==='ADD_SUB'||q.type==='ADD_ONLY') {
        for(let i=0; i<q.steps.length; i++) { spawnWall(q.steps[i], z); z -= Math.max(15, lockedSpeed*1.0); }
        spawnGates(q.finalAnswer, null, z - 30);
    } else {
        spawnGates(q.finalAnswer, q.expr, z - 10);
    }
}

function handleHitWall(w) {
    w.userData.collided = true; w.visible = false; playAbsorbSound();
    let v = w.userData.val; combo++; score += 10; updateHUD();
    playVoice(v<0?"減"+Math.abs(v):String(Math.abs(v)));
    showCombo('+'+combo+' HIT', '#4cf');
    if(!isBlindMode) {
        let sl = document.getElementById('mental-slate');
        let d = document.createElement('div'); d.className='slate-row'+(v<0?' neg':''); d.textContent=(v>=0?'+':'')+v;
        sl.appendChild(d); if(sl.children.length>6) sl.removeChild(sl.firstChild);
        if(currentLevelConfig.slateMode==='fading') { setTimeout(()=>d.classList.add('fading'), 800); setTimeout(()=>d.remove(), 1600); }
    }
}

function handleHitGate(g) {
    activeGates.forEach(gg=>gg.userData.collided=true); 
    activeGates.forEach(gg=>gg.visible=false);
    document.getElementById('mental-slate').innerHTML=''; speedLocked=false; questionInProgress=false; totalAnswered++;
    
    if(g.userData.isCorr) {
        totalCorrect++; score += Math.min(500, 50 + combo*5); playCorrectSound(); showCombo('CORRECT!', '#4f8');
    } else {
        combo=0; score = Math.max(0, score-20); playWrongSound(); showCombo('MISS', '#f44');
        let v = document.getElementById('vignette-flash'); v.style.opacity=1; setTimeout(()=>v.style.opacity=0, 200);
    }
    updateHUD(); currentQuestionIndex++;
    if(gameTimer>0 && currentQuestionIndex<questionQueue.length) setTimeout(spawnNext, 500);
}

function updateHUD() {
    document.getElementById('hud-score-val').textContent = score;
    let bar = document.getElementById('hud-timer-fill'); bar.style.width = Math.max(0, gameTimer/180*100)+'%';
    document.getElementById('hud-timer-val').textContent = gameTimer;
    document.getElementById('hud-timer-text').className = gameTimer<=30 ? 'urgent' : '';
    let c = document.getElementById('combo-hud'); if(combo>1){ c.textContent='COMBO x'+combo; c.classList.add('visible'); }else{ c.classList.remove('visible'); }
}

function showCombo(txt, col) {
    let ct=document.getElementById('combo-container'), d=document.createElement('div');
    d.className='combo-popup'; d.style.color=col; d.style.left=Math.random()*20+40+'%'; d.style.top=Math.random()*20+30+'%';
    d.textContent=txt; ct.appendChild(d); setTimeout(()=>d.remove(), 600);
}

function renderLoop(time) {
    requestAnimationFrame(renderLoop);
    let dt = Math.min(time - lastFrameTime, 100) / 1000; lastFrameTime = time;
    
    if(currentGameState === 'SHOWCASE' && showcaseCar) {
        showcaseCar.rotation.y += 0.5 * dt;
        renderer.render(showcaseScene, showcaseCamera);
        return;
    }
    
    if(currentGameState !== 'PLAYING') { renderer.render(scene, camera); return; }
    
    // 嚴格計時器邏輯
    if(questionInProgress && !isPaused) { accumulatedTime += dt; }
    gameTimer = Math.max(0, 180 - Math.floor(accumulatedTime));
    updateHUD();
    
    if(gameTimer<=0 || (currentQuestionIndex>=questionQueue.length && activeWalls.length===0 && activeGates.length===0)) { changeState('GAMEOVER'); return; }

    let spd = speedLocked ? lockedSpeed : currentSpeed;
    if(!speedLocked) currentSpeed += (baseSpeed - currentSpeed)*0.05;
    trackTexture.offset.y += spd * dt * 0.05;

    for(let i=activeWalls.length-1; i>=0; i--) {
        let w = activeWalls[i]; w.position.z += spd * dt;
        if(w.position.z > -1 && w.position.z < 2 && !w.userData.collided) handleHitWall(w);
        if(w.position.z > 5) { scene.remove(w); activeWalls.splice(i,1); }
    }
    for(let i=activeGates.length-1; i>=0; i--) {
        let g = activeGates[i]; g.position.z += spd * dt;
        if(g.position.z > -2 && g.position.z < 2 && !g.userData.collided) { if(g.position.x === lanePositions[targetLane]) handleHitGate(g); }
        if(g.position.z > 5) { scene.remove(g); activeGates.splice(i,1); }
    }

    if(playerCar) playerCar.position.x += (lanePositions[targetLane] - playerCar.position.x)*0.15;
    renderer.render(scene, camera);
}

// ======================= 介面與交互 =======================
function changeState(st) {
    currentGameState = st; document.querySelectorAll('.view-layer').forEach(v=>v.classList.remove('active'));
    isPaused = (st === 'PAUSED');
    if(st==='MENU') { document.getElementById('menu-view').classList.add('active'); clearTrack(); }
    if(st==='LEVEL_SELECT') { document.getElementById('level-select-view').classList.add('active'); renderLevels(); }
    if(st==='GARAGE') { document.getElementById('garage-view').classList.add('active'); renderGarage(); }
    if(st==='PLAYING') { document.getElementById('game-hud-view').classList.add('active'); lastFrameTime = performance.now(); }
    if(st==='PAUSED') { document.getElementById('pause-overlay').classList.add('active'); }
    if(st==='GAMEOVER') { document.getElementById('gameover-view').classList.add('active'); doGameOver(); }
    if(st==='SHOWCASE') { document.getElementById('showcase-overlay').classList.add('active'); }
}

function renderLevels() {
    let gr = document.getElementById('level-grid'); gr.innerHTML='';
    for(let i=1; i<=20; i++){
        let b = document.createElement('div'); b.className='level-btn'; 
        b.innerHTML=`<div class="lv-name">${EXAM_LEVELS[i].name}</div><div class="lv-info">及格: ${EXAM_LEVELS[i].passReq}題</div>`;
        b.onclick = ()=>{ currentLevelId=i; startGame(); }; gr.appendChild(b);
    }
}

function renderGarage() {
    let gr = document.getElementById('garage-grid'); gr.innerHTML='';
    for(let i=0; i<20; i++){
        let c = CAR_CATALOG[i], ul = userData.unlockedCars[i];
        let b = document.createElement('div'); b.className = 'car-card ' + (ul ? (userData.equippedCar===i?'equipped':'') : 'locked');
        b.innerHTML=`<div class="car-color-block" style="background:#${c.color.toString(16).padStart(6,'0')}"></div><div class="car-name">${ul?c.name:'Lv.'+(i+1)+' 解鎖'}</div>`;
        if(ul) b.onclick = ()=>{ userData.equippedCar=i; saveUserData(); createPlayerCar(); renderGarage(); };
        gr.appendChild(b);
    }
}

function doGameOver() {
    let pass = totalCorrect >= currentLevelConfig.passReq;
    let rg = document.getElementById('report-grid');
    rg.innerHTML = `
        <div class="rl">檢定關卡：</div><div class="rv">${currentLevelConfig.name}</div>
        <div class="rl">最終得分：</div><div class="rv ${pass?'pass':'fail'}">${score} 分</div>
        <div class="rl">答對題數：</div><div class="rv ${pass?'pass':'fail'}">${totalCorrect} / ${questionQueue.length}</div>
        <div class="rl">結果判定：</div><div class="rv ${pass?'pass':'fail'}">${pass?'✔ 合格':'✘ 未通過'}</div>
    `;
    let btnCar = document.getElementById('btn-claim-car');
    if(pass && !userData.unlockedCars[currentLevelId-1]) {
        btnCar.style.display='inline-flex';
        btnCar.onclick = ()=>{
            userData.unlockedCars[currentLevelId-1] = true; saveUserData();
            triggerShowcase(currentLevelId-1);
        };
    } else { btnCar.style.display='none'; }
}

function triggerShowcase(idx) {
    changeState('SHOWCASE');
    document.getElementById('showcase-car-name').textContent = CAR_CATALOG[idx].name;
    if(showcaseCar) showcaseScene.remove(showcaseCar);
    showcaseCar = buildCarMesh(idx); showcaseCar.scale.set(2,2,2);
    showcaseScene.add(showcaseCar);
}

document.addEventListener('keydown', e=>{
    if(currentGameState==='PLAYING'){
        if(e.key==='a'||e.key==='ArrowLeft') { tLane(-1); }
        if(e.key==='d'||e.key==='ArrowRight') { tLane(1); }
        if(e.key==='Escape') changeState('PAUSED');
    }
});
let tsX=0; 
document.addEventListener('touchstart', e=>{ tsX=e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
    if(currentGameState==='PLAYING'){
        let dx = e.changedTouches[0].clientX - tsX;
        if(dx>40) tLane(1); else if(dx<-40) tLane(-1);
        else { let wx=window.innerWidth/2; if(e.changedTouches[0].clientX>wx)tLane(1); else tLane(-1); }
    }
}, {passive:false});
function tLane(dir) { targetLane += dir; if(targetLane<0)targetLane=0; if(targetLane>2)targetLane=2; }

// 按鈕與開關
document.getElementById('voice-toggle').onclick = function(){ if(!isMobile){ isVoiceEnabled=!isVoiceEnabled; this.classList.toggle('on',isVoiceEnabled); } };
document.getElementById('sfx-toggle').onclick = function(){ isSfxEnabled=!isSfxEnabled; this.classList.toggle('on',isSfxEnabled); };
document.getElementById('btn-start').onclick = ()=>{ ensureAudioCtx(); changeState('LEVEL_SELECT'); };
document.getElementById('btn-garage').onclick = ()=>changeState('GARAGE');
document.getElementById('btn-back-menu').onclick = ()=>changeState('MENU');
document.getElementById('btn-garage-back').onclick = ()=>changeState('MENU');
document.getElementById('btn-pause').onclick = ()=>changeState('PAUSED');
document.getElementById('btn-resume').onclick = ()=>changeState('PLAYING');
document.getElementById('btn-quit').onclick = ()=>changeState('MENU');
document.getElementById('btn-gameover-menu').onclick = ()=>changeState('MENU');
document.getElementById('blind-toggle').onclick = function(){ isBlindMode=!isBlindMode; this.classList.toggle('on',isBlindMode); };
document.getElementById('btn-showcase-done').onclick = ()=>{ userData.equippedCar = currentLevelId-1; saveUserData(); changeState('GARAGE'); };

// 手機環境判定
if(isMobile) { document.getElementById('voice-setting-row').style.display='none'; isVoiceEnabled=false; }
document.body.addEventListener('click', ensureAudioCtx, {once:true});
document.body.addEventListener('touchstart', ensureAudioCtx, {once:true});

window.onload = init3DEngine;
})();
</script>
</body>
</html>
