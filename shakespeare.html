<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakespeare Auto-Reader Pro</title>
<style>
    body {
        font-family: 'Georgia', serif;
        background-color: #f4ece1;
        color: #2c2c2c;
        margin: 0;
        padding: 0;
    }
    
    /* 功能鍵縮小並固定在上方 */
    #controls-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 253, 249, 0.95);
        border-bottom: 1px solid #e0d8c8;
        padding: 8px 0;
        text-align: center;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        backdrop-filter: blur(5px);
        display: none; /* 載入完成後顯示 */
    }
    #controls-bar button {
        background-color: #5c2c24; 
        color: white;
        border: none;
        padding: 6px 12px;
        margin: 0 4px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        transition: background 0.2s;
    }
    #controls-bar button:hover { background-color: #8c4236; }
    
    /* 狀態列 */
    #status {
        text-align: center;
        font-style: italic;
        color: #666;
        font-size: 1em;
        margin-top: 50px; /* 避開 top bar */
    }

    /* 主文字區域擴大至 90% */
    #app-container {
        width: 90vw;
        margin: 60px auto 40px auto; /* 上方留空間給 controls-bar */
        background: #fffdf9;
        padding: 3vw;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        box-sizing: border-box;
    }
    
    h1 {
        text-align: center;
        border-bottom: 2px solid #5c2c24;
        padding-bottom: 10px;
        color: #5c2c24;
        font-size: 1.8em;
        margin-top: 0;
    }

    #script-container { margin-top: 20px; }
    .item {
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 6px;
        border-left: 4px solid transparent;
        transition: background-color 0.2s;
    }
    .speaker-name {
        font-weight: bold;
        font-family: 'Segoe UI', sans-serif;
        color: #5c2c24;
        text-transform: uppercase;
        font-size: 1em;
        letter-spacing: 1px;
        margin-bottom: 8px;
        cursor: pointer;
        display: inline-block;
    }
    .speaker-name:hover { text-decoration: underline; color: #d44d33; }
    
    .speech-lines { margin-left: 15px; }
    
    /* 單行台詞容器（包含英文與中文） */
    .line-container {
        margin-bottom: 8px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .line-container:hover { background-color: #f0e6d5; }
    
    .en-text {
        font-size: 1.15em;
        line-height: 1.5;
        color: #1a1a1a;
    }
    
    .zh-text {
        font-size: 0.95em;
        color: #4a708b; /* 翻譯採用柔和的藍灰色區隔 */
        line-height: 1.4;
        margin-top: 2px;
        font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    }

    .stagedir {
        color: #777;
        font-style: italic;
        font-size: 0.95em;
        margin: 15px 30px;
        text-align: center;
    }
    .title h2 {
        text-align: center;
        color: #2c2c2c;
        margin-top: 30px;
        font-size: 1.5em;
        border-bottom: 1px solid #e0d8c8;
        padding-bottom: 8px;
        cursor: pointer;
    }
    
    /* 播放中的高亮顯示 */
    .playing {
        background-color: #faeed9 !important;
        border-left: 4px solid #d44d33 !important;
    }
    .playing-line {
        background-color: #f2d4a4;
        border-radius: 3px;
    }
</style>
</head>
<body>

<div id="controls-bar">
    <button onclick="playFrom(0)">▶ Play from Top</button>
    <button onclick="pauseReading()">⏸ Pause</button>
    <button onclick="resumeReading()">⏯ Resume</button>
    <button onclick="stopReading()">⏹ Stop</button>
    <button onclick="loadRandomPlay()">🎲 Load Another Play</button>
</div>

<div id="status">Initializing...</div>

<div id="app-container">
    <h1 id="play-title">Shakespeare Reader</h1>
    <div id="script-container"></div>
</div>

<script>
// --- 翻譯佇列系統 (避免大量請求被 Google 阻擋) ---
const translationQueue = [];
let isTranslating = false;

function processTranslation() {
    if (isTranslating || translationQueue.length === 0) return;
    isTranslating = true;
    
    const { text, zhElement } = translationQueue.shift();
    
    // 使用 Google Translate 免費 API
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`;
    
    fetch(url)
        .then(res => res.json())
        .then(data => {
            const translatedText = data[0].map(item => item[0]).join('');
            zhElement.innerText = translatedText;
        })
        .catch(err => {
            zhElement.innerText = "(翻譯失敗)";
        })
        .finally(() => {
            // 延遲 300 毫秒再處理下一個，防止請求過於頻繁
            setTimeout(() => {
                isTranslating = false;
                processTranslation();
            }, 300);
        });
}

// 使用 Intersection Observer 實現懶加載翻譯 (只翻譯滑入畫面的台詞)
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const el = entry.target;
            if (!el.dataset.translating) {
                el.dataset.translating = 'true';
                const enText = el.dataset.en;
                const zhElement = el.querySelector('.zh-text');
                translationQueue.push({ text: enText, zhElement: zhElement });
                processTranslation(); // 觸發佇列
            }
        }
    });
}, { rootMargin: '200px' }); // 提早 200px 預載入

// --- 語音合成 (TTS) 與音色設定 ---
let availableVoices = [];
let synth = window.speechSynthesis;

function initVoices() {
    availableVoices = synth.getVoices().filter(v => v.lang.startsWith('en'));
    if(availableVoices.length === 0) availableVoices = synth.getVoices();
}
synth.onvoiceschanged = initVoices;

function getVoiceSettings(speakerName) {
    if (!availableVoices || availableVoices.length === 0) return { voice: null, pitch: 1, rate: 1 };
    if (speakerName === 'Narrator') return { voice: availableVoices[0], pitch: 1, rate: 1 };
    
    // 判斷男女
    let isMale = null;
    const nameUpper = speakerName.toUpperCase();
    if (/\b(KING|PRINCE|DUKE|LORD|SIR|FATHER|SON|UNCLE|BROTHER|MAN|MEN|BOY|GENTLEMAN|BERNARDO|FRANCISCO|MARCELLUS|HORATIO)\b/.test(nameUpper)) isMale = true;
    if (/\b(QUEEN|PRINCESS|DUCHESS|LADY|MADAM|MOTHER|DAUGHTER|AUNT|SISTER|WOMAN|WOMEN|GIRL|MAID)\b/.test(nameUpper)) isMale = false;

    let candidateVoices = availableVoices;
    if (isMale === true) {
        let maleVoices = availableVoices.filter(v => /\b(male|david|mark|james)\b/i.test(v.name) && !/female/i.test(v.name));
        if (maleVoices.length > 0) candidateVoices = maleVoices;
    } else if (isMale === false) {
        let femaleVoices = availableVoices.filter(v => /\b(female|zira|samantha|victoria)\b/i.test(v.name));
        if (femaleVoices.length > 0) candidateVoices = femaleVoices;
    }
    
    // 角色名稱雜湊演算法
    let hash = 0;
    for (let i = 0; i < speakerName.length; i++) {
        hash = speakerName.charCodeAt(i) + ((hash << 5) - hash);
    }
    hash = Math.abs(hash);
    
    // 分配聲音
    const voiceIndex = hash % candidateVoices.length;
    
    // **修正重點：取消極端的 pitch 改變，鎖定 pitch=1 避免唱歌或沙啞聲**
    // 完全依賴「語速 (rate)」和「不同聲音檔 (voice)」來區別角色
    const pitch = 1.0; 
    
    // 語速控制在 0.88 ~ 1.12 之間 (最自然的人類說話速度差異)
    const rate = 0.88 + ((hash % 25) / 100); 
    
    return {
        voice: candidateVoices[voiceIndex],
        pitch: pitch,
        rate: rate
    };
}

// --- 劇本載入與解析 ---
const fallbackFiles = ["hamlet.xml", "macbeth.xml", "r_and_j.xml", "lear.xml", "dream.xml", "othello.xml", "tempest.xml", "merchant.xml", "much_ado.xml", "t_night.xml"];
let playQueue = [];

async function loadRandomPlay() {
    stopReading();
    document.getElementById('controls-bar').style.display = 'none';
    document.getElementById('script-container').innerHTML = '';
    document.getElementById('status').innerText = 'Fetching play list from GitHub...';
    document.getElementById('play-title').innerText = 'Shakespeare Reader';
    
    let downloadUrl = "";
    let fileName = "";
    try {
        const repoUrl = 'https://api.github.com/repos/rufuspollock-okfn/shakespeare-material/contents/texts/moby?ref=abd92b518793aab643fc645267e15b8c0b1f715c';
        const response = await fetch(repoUrl);
        if (!response.ok) throw new Error('API limit');
        const files = await response.json();
        const xmlFiles = files.filter(f => f.name.endsWith('.xml'));
        const randomFile = xmlFiles[Math.floor(Math.random() * xmlFiles.length)];
        downloadUrl = randomFile.download_url;
        fileName = randomFile.name;
    } catch(apiErr) {
        fileName = fallbackFiles[Math.floor(Math.random() * fallbackFiles.length)];
        downloadUrl = `https://raw.githubusercontent.com/rufuspollock-okfn/shakespeare-material/abd92b518793aab643fc645267e15b8c0b1f715c/texts/moby/${fileName}`;
    }
    
    document.getElementById('status').innerText = `Downloading ${fileName}...`;
    try {
        const xmlResponse = await fetch(downloadUrl);
        if (!xmlResponse.ok) throw new Error('Failed to load XML');
        const xmlText = await xmlResponse.text();
        
        document.getElementById('status').style.display = 'none'; // 載入完隱藏狀態
        parseXML(xmlText);
        renderScript();
        
        document.getElementById('controls-bar').style.display = 'block';
    } catch (e) {
        document.getElementById('status').innerText = 'Error: ' + e.message;
    }
}

function parseXML(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    playQueue = [];
    
    const play = xmlDoc.querySelector('PLAY');
    if (!play) return;
    
    const playTitle = xmlDoc.querySelector('TITLE');
    if (playTitle) document.getElementById('play-title').innerText = playTitle.textContent.trim();
    
    function walk(node) {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName.toUpperCase();
        
        if (tag === 'TITLE' && node.parentNode.tagName.toUpperCase() !== 'PLAY') {
            playQueue.push({ type: 'title', text: node.textContent.trim(), speaker: 'Narrator', id: playQueue.length });
        } else if (tag === 'SPEECH') {
            const speakers = Array.from(node.querySelectorAll("SPEAKER")).map(s => s.textContent.trim());
            const speaker = speakers.length > 0 ? speakers.join(" and ") : "Narrator";
            
            const lines = [];
            node.childNodes.forEach(child => {
                if (child.nodeType === Node.ELEMENT_NODE && child.tagName.toUpperCase() === 'LINE') {
                    lines.push(child.textContent.trim());
                }
            });
            if (lines.length > 0) {
                playQueue.push({ type: 'speech', lines: lines, speaker: speaker, id: playQueue.length });
            }
        } else if (tag === 'STAGEDIR') {
             playQueue.push({ type: 'stagedir', text: node.textContent.trim(), id: playQueue.length });
        } else if (tag === 'PERSONAE' || tag === 'PGROUP') {
            // 忽略人物列表朗讀
        } else {
            for (let child of node.childNodes) {
                walk(child);
            }
        }
    }
    walk(play);
}

function renderScript() {
    const container = document.getElementById('script-container');
    container.innerHTML = '';
    
    playQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `item ${item.type}`;
        div.id = `item-${index}`;
        
        if (item.type === 'speech') {
            let linesHtml = '';
            item.lines.forEach((lineText, i) => {
                // 將單行包裝成中英對照的結構
                linesHtml += `
                <div class="line-container line-target" data-en="${lineText.replace(/"/g, '&quot;')}" onclick="playFromLine(${index}, ${i}, event)">
                    <div class="en-text">${lineText}</div>
                    <div class="zh-text">...</div>
                </div>`;
            });
            div.innerHTML = `<div class="speaker-name" onclick="playFrom(${index})">${item.speaker}</div> <div class="speech-lines">${linesHtml}</div>`;
            
            // 將所有需要翻譯的 line 加入觀察者 (Lazy Load)
            div.querySelectorAll('.line-target').forEach(el => observer.observe(el));
            
        } else if (item.type === 'title') {
            div.innerHTML = `<h2 onclick="playFrom(${index})">${item.text}</h2>`;
        } else if (item.type === 'stagedir') {
            div.innerHTML = `<em>[${item.text}]</em>`;
        }
        
        container.appendChild(div);
    });
}

// --- 播放器與控制邏輯 ---
let isPlaying = false;
let currentIndex = 0;
let currentLineWithinSpeech = 0;

function playFrom(index) {
    isPlaying = false;
    synth.cancel();
    setTimeout(() => {
        currentIndex = index;
        currentLineWithinSpeech = 0;
        isPlaying = true;
        speakCurrent();
    }, 50);
}

function playFromLine(index, lineIndex, event) {
    event.stopPropagation();
    isPlaying = false;
    synth.cancel();
    setTimeout(() => {
        currentIndex = index;
        currentLineWithinSpeech = lineIndex;
        isPlaying = true;
        speakCurrent();
    }, 50);
}

function speakCurrent() {
    if (!isPlaying) return;
    
    while (currentIndex < playQueue.length && !['speech', 'title'].includes(playQueue[currentIndex].type)) {
        currentIndex++;
        currentLineWithinSpeech = 0;
    }
    
    if (currentIndex >= playQueue.length) {
        isPlaying = false;
        return;
    }
    
    const item = playQueue[currentIndex];
    let textToSpeak = ""; // 永遠只存英文
    
    if (item.type === 'title') {
        textToSpeak = item.text;
    } else if (item.type === 'speech') {
        if (currentLineWithinSpeech >= item.lines.length) {
            currentIndex++;
            currentLineWithinSpeech = 0;
            speakCurrent();
            return;
        }
        textToSpeak = item.lines[currentLineWithinSpeech]; // 只取出英文朗讀
    }
    
    // 更新 UI 反白
    document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
    document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line'));
    
    const el = document.getElementById(`item-${currentIndex}`);
    if (el) {
        el.classList.add('playing');
        
        // 考慮到 Fixed Top Bar，捲動時往下位移 100px 避免被按鈕列遮擋
        const y = el.getBoundingClientRect().top + window.scrollY - 100;
        window.scrollTo({ top: y, behavior: 'smooth' });
        
        if (item.type === 'speech') {
            const lineContainers = el.querySelectorAll('.line-container');
            if (lineContainers && lineContainers[currentLineWithinSpeech]) {
                lineContainers[currentLineWithinSpeech].classList.add('playing-line');
            }
        }
    }
    
    if (!textToSpeak.trim()) {
        advanceLine(item);
        speakCurrent();
        return;
    }
    
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    const settings = getVoiceSettings(item.speaker);
    if (settings.voice) utterance.voice = settings.voice;
    utterance.pitch = settings.pitch;
    utterance.rate = settings.rate;
    
    utterance.onend = () => {
        if (isPlaying) {
            advanceLine(item);
            speakCurrent();
        }
    };
    
    utterance.onerror = (e) => {
        console.error("TTS Error:", e);
        if (isPlaying) {
            advanceLine(item);
            speakCurrent();
        }
    };
    
    synth.speak(utterance);
}

function advanceLine(item) {
    if (item.type === 'title') {
        currentIndex++;
        currentLineWithinSpeech = 0;
    } else {
        currentLineWithinSpeech++;
    }
}

function pauseReading() { isPlaying = false; synth.pause(); }
function resumeReading() { isPlaying = true; synth.resume(); }
function stopReading() {
    isPlaying = false;
    synth.cancel();
    document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
    document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line'));
}

window.onbeforeunload = () => { synth.cancel(); };

window.onload = () => {
    initVoices();
    // 給予語音引擎一點時間載入
    setTimeout(loadRandomPlay, 500);
};
</script>
</body>
</html>
