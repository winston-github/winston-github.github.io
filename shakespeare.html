<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shakespeare Auto-Reader Pro Max</title>
<style>
    body {
        font-family: 'Georgia', serif; background-color: #f4ece1;
        color: #2c2c2c; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
    }
    
    /* 頂部懸浮控制列 */
    #controls-bar {
        position: fixed; top: 0; left: 0; width: 100%;
        background: rgba(255, 253, 249, 0.95); border-bottom: 1px solid #e0d8c8;
        padding: 12px 0; display: flex; justify-content: center; align-items: center; gap: 20px; 
        z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.08); backdrop-filter: blur(8px); display: none;
    }
    
    .icon-btn {
        background: #5c2c24; border: none; border-radius: 50%; width: 48px; height: 48px;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; transition: all 0.2s ease; box-shadow: 0 3px 8px rgba(92, 44, 36, 0.3);
    }
    .icon-btn:active { background: #8c4236; transform: scale(0.95); }
    .icon-btn svg { width: 28px; height: 28px; fill: #ffffff; }

    #status { text-align: center; font-style: italic; color: #666; font-size: 1.1em; margin-top: 80px; }

    #app-container {
        width: 92vw; max-width: 1000px; margin: 80px auto 90px auto; 
        background: #fffdf9; padding: 4vw; border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.05); box-sizing: border-box;
    }

    .item { margin-bottom: 30px; }
    .speaker-name {
        font-weight: bold; font-family: 'Segoe UI', sans-serif; color: #5c2c24;
        text-transform: uppercase; font-size: 1.1em; letter-spacing: 1.5px;
        margin-bottom: 10px; display: inline-block; border-bottom: 2px solid transparent;
    }
    
    .speech-lines { margin-left: 5px; }
    
    /* 預設的行容器 */
    .line-container {
        margin-bottom: 15px; padding: 12px 15px; border-radius: 8px;
        border-left: 4px solid transparent; transition: all 0.3s ease;
        display: flex; flex-direction: column;
    }
    
    .en-text { color: #1a1a1a; line-height: 1.6; transition: font-size 0.3s; }
    
    /* 翻譯文字 (預設隱藏) */
    .zh-text {
        color: #5b7b93; line-height: 1.5; font-family: '-apple-system', 'PingFang TC', sans-serif;
        opacity: 0; height: 0; overflow: hidden; transition: opacity 0.5s ease-in-out;
    }
    .zh-text.show { opacity: 1; height: auto; margin-top: 10px; }

    /* ！！！ 重點：正在朗讀時的 70/30 佈局 ！！！ */
    .playing-line { 
        background-color: #f6e8ce; 
        border-left: 4px solid #d44d33 !important; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transform: scale(1.02); /* 微幅放大聚焦 */
    }
    .playing-line .en-text {
        flex: 7; /* 佔據 70% 視覺比例 */
        padding-bottom: 12px;
    }
    .playing-line .zh-text.show {
        flex: 3; /* 佔據 30% 視覺比例 */
        border-top: 1px dashed #d44d33; /* 增加精緻分隔線 */
        padding-top: 12px;
        margin-top: 0;
        font-size: 1.1em !important; /* 確保中文清晰 */
    }

    .stagedir {
        color: #888; font-style: italic; font-size: 1em; margin: 25px 0;
        text-align: center; background: #fcfaf5; padding: 12px; border-radius: 6px;
    }

    .word { display: inline-block; cursor: pointer; padding: 0 2px; margin: 0 -2px; border-radius: 3px; user-select: none; transition: background-color 0.1s; }
    .word:active { background-color: rgba(212, 77, 51, 0.3); }

    /* 字典視窗 */
    #dict-popup {
        position: absolute; z-index: 9999; background: #fffcf0; border: 2px solid #5c2c24;
        border-radius: 10px; padding: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        max-width: 280px; min-width: 150px; font-size: 1.05em; color: #2c2c2c; display: none;
        pointer-events: none; font-family: '-apple-system', 'PingFang TC', sans-serif;
    }
    .dict-title { font-weight: bold; color: #d44d33; font-size: 1.2em; border-bottom: 1px solid #e0d8c8; padding-bottom: 5px; margin-bottom: 8px;}
    .dict-pos { color: #5b7b93; font-style: italic; font-size: 0.9em; margin-right: 5px; }

    /* 底部語音切換 */
    #lang-bar {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: rgba(255, 253, 249, 0.98); border-top: 1px solid #e0d8c8;
        padding: 12px 0; display: flex; justify-content: center; gap: 8px; z-index: 1000;
    }
    .lang-btn {
        background: transparent; color: #5c2c24; border: 1px solid #5c2c24;
        padding: 8px 14px; border-radius: 20px; font-size: 0.95em; cursor: pointer; transition: all 0.2s;
    }
    .lang-btn.active { background: #5c2c24; color: white; }
</style>
</head>
<body>

<div id="dict-popup"></div>

<div id="controls-bar">
    <button class="icon-btn" onclick="playFrom(0)"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 16.5v-9l7 4.5-7 4.5z"/></svg></button>
    <button class="icon-btn" id="btn-toggle-play" onclick="togglePlayPause()">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="icon-btn" onclick="stopReading()"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4 14H8V8h8v8z"/></svg></button>
    <button class="icon-btn" onclick="loadRandomPlay()"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
</div>

<div id="status">Initializing...</div>
<div id="app-container"><div id="script-container"></div></div>

<div id="lang-bar">
    <button class="lang-btn active" id="btn-lang-en" onclick="setLangMode('EN')">English</button>
    <button class="lang-btn" id="btn-lang-zh" onclick="setLangMode('ZH')">Mandarin</button>
    <button class="lang-btn" id="btn-lang-both" onclick="setLangMode('EN_ZH')">English & Mandarin</button>
</div>

<script>
const romanToInt = {'I':1, 'II':2, 'III':3, 'IV':4, 'V':5, 'VI':6, 'VII':7, 'VIII':8, 'IX':9, 'X':10, 'XI':11, 'XII':12};

function processTitleText(text) {
    let zh = text, enTTS = text;
    zh = zh.replace(/\b(ACT)\s+([IVX]+)\b/gi, (m, p1, p2) => `第${romanToInt[p2.toUpperCase()] || p2}幕`);
    enTTS = enTTS.replace(/\b(ACT)\s+([IVX]+)\b/gi, (m, p1, p2) => `Act ${romanToInt[p2.toUpperCase()] || p2}`);
    zh = zh.replace(/\b(SCENE)\s+([IVX]+)\b/gi, (m, p1, p2) => `第${romanToInt[p2.toUpperCase()] || p2}場`);
    enTTS = enTTS.replace(/\b(SCENE)\s+([IVX]+)\b/gi, (m, p1, p2) => `Scene ${romanToInt[p2.toUpperCase()] || p2}`);
    return { isTitlePattern: (zh !== text), zhText: zh, enTTSText: enTTS };
}

// --- ！！防封鎖 API 打包翻譯引擎 (Batching) ！！ ---
let translationQueue = [];
let batchTimeout = null;
let isTranslating = false;

function scheduleTranslation() {
    if (batchTimeout) clearTimeout(batchTimeout);
    // 累積 800 毫秒的待翻譯句子，打包成「一次」發送
    batchTimeout = setTimeout(flushTranslationQueue, 800);
}

function flushTranslationQueue() {
    if (translationQueue.length === 0 || isTranslating) return;
    
    // 挑出還在畫面上的句子打包 (最多打包 15 句)
    let batch = [];
    let remainingQueue = [];
    
    translationQueue.forEach(item => {
        const rect = item.lineEl.getBoundingClientRect();
        // 放寬一點視野，上下 300px 都算
        const isVisible = rect.bottom >= -300 && rect.top <= window.innerHeight + 300;
        
        if (isVisible && batch.length < 15) {
            // 先過濾拉丁數字，如果是標題就直接顯示，不進 API
            const processed = processTitleText(item.text);
            if (processed.isTitlePattern && !processed.zhText.match(/[a-zA-Z]{5,}/)) {
                item.zhElement.innerText = processed.zhText;
                item.zhElement.classList.add('show');
            } else {
                batch.push(item);
            }
        } else {
            // 不在畫面上，解鎖讓他以後有機會再翻譯
            item.lineEl.dataset.translating = '';
        }
    });
    
    translationQueue = remainingQueue;
    if (batch.length === 0) return;
    
    isTranslating = true;
    
    // 使用 @@@ 作為分隔符，把多行合併成單一字串
    const separator = "\n\n@@@\n\n";
    const combinedText = batch.map(b => b.text).join(separator);
    
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(combinedText)}`;
    
    fetch(url).then(res => res.json()).then(data => {
        // 取得翻譯後的完整字串並切開
        let translatedFull = data[0].map(item => item[0]).join('');
        let translatedParts = translatedFull.split(/@@@/g).map(s => s.trim());
        
        batch.forEach((item, index) => {
            let resultZh = translatedParts[index] || "";
            if (resultZh.length > 0) {
                const fix = processTitleText(resultZh);
                item.zhElement.innerText = fix.zhText;
                item.zhElement.classList.add('show');
            }
        });
    }).catch(e => {
        console.warn("Translation limited, waiting...");
        // 失敗時安靜處理，不要顯示錯誤文字
        batch.forEach(item => { item.lineEl.dataset.translating = ''; });
    }).finally(() => {
        // 延遲 2 秒再處理下一批，徹底避免被 Google Ban
        setTimeout(() => { isTranslating = false; if(translationQueue.length) scheduleTranslation(); }, 2000);
    });
}

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && !entry.target.dataset.translating) {
            entry.target.dataset.translating = 'true';
            translationQueue.push({ 
                text: entry.target.dataset.en, 
                zhElement: entry.target.querySelector('.zh-text'),
                lineEl: entry.target 
            });
            scheduleTranslation();
        }
    });
}, { rootMargin: '100px' });

// --- 語音模式切換 ---
let currentLangMode = 'EN';
function setLangMode(mode) {
    currentLangMode = mode;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(mode === 'EN') document.getElementById('btn-lang-en').classList.add('active');
    if(mode === 'ZH') document.getElementById('btn-lang-zh').classList.add('active');
    if(mode === 'EN_ZH') document.getElementById('btn-lang-both').classList.add('active');
}

let availableVoices = [];
let synth = window.speechSynthesis;
function initVoices() {
    let voices = synth.getVoices();
    availableVoices = voices.filter(v => !['cellos','zarvox','trinoids','boing','whisper','espeak'].some(bad => v.name.toLowerCase().includes(bad)));
}
synth.onvoiceschanged = initVoices;

function getVoiceForSpeaker(speakerName, isChinese) {
    if (isChinese) {
        let zhVoices = availableVoices.filter(v => v.lang.startsWith('zh'));
        let premiumZh = zhVoices.filter(v => v.name.includes('Google') || v.name.includes('Siri') || v.name.includes('Premium'));
        return premiumZh.length > 0 ? premiumZh[0] : (zhVoices[0] || null);
    } else {
        let enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
        let premiumEn = enVoices.filter(v => v.name.includes('Google') || v.name.includes('Premium') || v.name.includes('Siri'));
        let pool = premiumEn.length > 0 ? premiumEn : enVoices;
        
        let isMale = /\b(KING|PRINCE|DUKE|LORD|SIR|FATHER|SON|UNCLE|BROTHER|MAN|BOY|GENTLEMAN|BERNARDO|MARCELLUS|HORATIO|LEONATO)\b/.test(speakerName.toUpperCase());
        let candidates = pool;
        if (isMale) candidates = pool.filter(v => /\b(male|david|mark|james|daniel|arthur)\b/i.test(v.name) && !/female/i.test(v.name)) || pool;
        else candidates = pool.filter(v => /\b(female|zira|samantha|victoria|karen)\b/i.test(v.name)) || pool;
        
        let hash = 0;
        for (let i = 0; i < speakerName.length; i++) hash = speakerName.charCodeAt(i) + ((hash << 5) - hash);
        return candidates.length ? candidates[Math.abs(hash) % candidates.length] : null;
    }
}

// --- 解析引擎與「智慧文字縮放(Auto-Shrink)」 ---
let playQueue = [];
async function loadRandomPlay() {
    stopReading(); document.getElementById('controls-bar').style.display = 'none';
    document.getElementById('script-container').innerHTML = ''; document.getElementById('status').style.display = 'block';
    
    const fallbackFiles = ["hamlet.xml", "macbeth.xml", "r_and_j.xml", "lear.xml", "merchant.xml", "much_ado.xml"];
    let fileName = fallbackFiles[Math.floor(Math.random() * fallbackFiles.length)];
    let downloadUrl = `https://raw.githubusercontent.com/rufuspollock-okfn/shakespeare-material/abd92b518793aab643fc645267e15b8c0b1f715c/texts/moby/${fileName}`;
    
    try {
        const res = await fetch('https://api.github.com/repos/rufuspollock-okfn/shakespeare-material/contents/texts/moby?ref=abd92b518793aab643fc645267e15b8c0b1f715c');
        if (res.ok) {
            const files = (await res.json()).filter(f => f.name.endsWith('.xml'));
            const f = files[Math.floor(Math.random() * files.length)];
            fileName = f.name; downloadUrl = f.download_url;
        }
    } catch(e) {}
    
    document.getElementById('status').innerText = `Loading ${fileName}...`;
    const xmlText = await (await fetch(downloadUrl)).text();
    document.getElementById('status').style.display = 'none';
    
    parseXML(xmlText); renderScript();
    document.getElementById('controls-bar').style.display = 'flex';
}

function parseXML(xmlText) {
    const parser = new DOMParser(); const xmlDoc = parser.parseFromString(xmlText, "text/xml"); playQueue = [];
    const play = xmlDoc.querySelector('PLAY'); if (!play) return;
    
    function walk(node) {
        if (node.nodeType !== Node.ELEMENT_NODE) return; const tag = node.tagName.toUpperCase();
        if (tag === 'TITLE' && node.parentNode.tagName.toUpperCase() !== 'PLAY') {
            playQueue.push({ type: 'title', lines: [node.textContent.trim()], speaker: 'Narrator', id: playQueue.length });
        } else if (tag === 'SPEECH') {
            const speakers = Array.from(node.querySelectorAll("SPEAKER")).map(s => s.textContent.trim());
            const speaker = speakers.length > 0 ? speakers.join(" and ") : "Narrator";
            let fullText = "";
            node.childNodes.forEach(c => { if (c.nodeType === Node.ELEMENT_NODE && c.tagName.toUpperCase() === 'LINE') fullText += c.textContent.trim() + " "; });
            fullText = fullText.replace(/\s+/g, ' ').trim();
            if (fullText.length > 0) {
                let sentenceArr = fullText.match(/[^.?!:]+[.?!:]+|[^.?!:]+$/g) || [fullText];
                sentenceArr = sentenceArr.map(s => s.trim()).filter(s => s.length > 0);
                playQueue.push({ type: 'speech', lines: sentenceArr, speaker: speaker, id: playQueue.length });
            }
        } else if (tag === 'STAGEDIR') {
             playQueue.push({ type: 'stagedir', text: node.textContent.trim(), id: playQueue.length });
        } else { for (let child of node.childNodes) walk(child); }
    }
    walk(play);
}

function renderScript() {
    const container = document.getElementById('script-container'); container.innerHTML = '';
    playQueue.forEach((item, index) => {
        const div = document.createElement('div'); div.className = `item ${item.type}`;
        if (item.type === 'speech' || item.type === 'title') {
            let linesHtml = '';
            item.lines.forEach((lineText, i) => {
                let wordsHtml = lineText.split(/\s+/).map((w, wIdx) => {
                    let cleanWord = w.replace(/[^a-zA-Z']/g, '');
                    return `<span class="word" data-word="${cleanWord}" data-item-idx="${index}" data-line-idx="${i}" data-word-idx="${wIdx}">${w}</span>`;
                }).join(' ');
                
                // ！！ 智慧文字縮放演算法 (越長字體越小，但不低於 0.95em) ！！
                let calculatedEm = Math.max(0.95, 1.7 - (lineText.length * 0.0025));
                
                linesHtml += `<div class="line-container line-target" id="line-${index}-${i}" data-en="${lineText.replace(/"/g, '&quot;')}">
                    <div class="en-text" style="font-size: ${calculatedEm}em;">${wordsHtml}</div>
                    <div class="zh-text">...</div>
                </div>`;
            });
            div.innerHTML = item.type === 'title' ? `<div class="speech-lines">${linesHtml}</div>` : `<div class="speaker-name">${item.speaker}</div> <div class="speech-lines">${linesHtml}</div>`;
            div.querySelectorAll('.line-target').forEach(el => observer.observe(el));
        } else if (item.type === 'stagedir') {
            div.innerHTML = `<div class="stagedir">[ ${item.text} ]</div>`;
        }
        container.appendChild(div);
    });
}

// --- 雙語與字典系統 ---
let pressTimer; let longPressTriggered = false; let touchStartX = 0, touchStartY = 0;
const scContainer = document.getElementById('script-container');

scContainer.addEventListener('pointerdown', (e) => {
    const wEl = e.target.closest('.word'); if (!wEl) return;
    touchStartX = e.clientX; touchStartY = e.clientY; longPressTriggered = false;
    pressTimer = setTimeout(() => { longPressTriggered = true; handleLongPress(wEl); }, 450);
});
scContainer.addEventListener('pointermove', (e) => { if (pressTimer && (Math.abs(e.clientX - touchStartX) > 10 || Math.abs(e.clientY - touchStartY) > 10)) clearTimeout(pressTimer); });
scContainer.addEventListener('pointerup', (e) => {
    clearTimeout(pressTimer); const wEl = e.target.closest('.word'); if (!wEl) return;
    if (longPressTriggered) { e.preventDefault(); return; }
    playFromWord(parseInt(wEl.dataset.itemIdx), parseInt(wEl.dataset.lineIdx), parseInt(wEl.dataset.wordIdx));
});
scContainer.addEventListener('contextmenu', (e) => { if (e.target.closest('.word')) e.preventDefault(); });
window.addEventListener('scroll', () => { document.getElementById('dict-popup').style.display = 'none'; }, { passive: true });
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#dict-popup') && !e.target.closest('.word')) document.getElementById('dict-popup').style.display = 'none'; });

async function handleLongPress(wEl) {
    if ("vibrate" in navigator) navigator.vibrate(50); pauseReading();
    const wordText = wEl.dataset.word; if (!wordText) return;
    let u = new SpeechSynthesisUtterance(wordText); u.pitch = 1.0; u.rate = 0.9; synth.cancel(); synth.speak(u);
    const popup = document.getElementById('dict-popup');
    popup.innerHTML = `<div class="dict-title">${wordText}</div><div style="font-size:0.9em;color:#666;">搜尋中...</div>`;
    popup.style.display = 'block';
    const rect = wEl.getBoundingClientRect();
    popup.style.left = `${Math.max(10, rect.left + window.scrollX - 20)}px`; popup.style.top = `${Math.max(10, rect.top + window.scrollY - popup.offsetHeight - 15)}px`;
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(wordText)}`;
        const data = await (await fetch(url)).json();
        let html = `<div class="dict-title">${wordText}</div>`;
        if (data[0] && data[0][0]) html += `<div style="margin-bottom:8px;">${data[0][0][0]}</div>`;
        if (data[1]) data[1].slice(0, 3).forEach(pos => html += `<div><span class="dict-pos">${pos[0]}.</span> ${pos[1].slice(0, 3).join(', ')}</div>`);
        popup.innerHTML = html; popup.style.top = `${Math.max(10, rect.top + window.scrollY - popup.offsetHeight - 15)}px`;
    } catch(e) { popup.innerHTML = `<div class="dict-title">${wordText}</div>查詢失敗`; }
}

let isPlaying = false; let currentIndex = 0; let currentLineIdx = 0; let currentWordOffset = 0;

function playFrom(index) { playFromWord(index, 0, 0); }
function playFromWord(itemIdx, lineIdx, wordIdx) {
    isPlaying = false; synth.cancel();
    setTimeout(() => { currentIndex = itemIdx; currentLineIdx = lineIdx; currentWordOffset = wordIdx; isPlaying = true; speakCurrent(); }, 50);
}

function speakCurrent() {
    if (!isPlaying) return;
    while (currentIndex < playQueue.length && !['speech', 'title'].includes(playQueue[currentIndex].type)) { currentIndex++; currentLineIdx = 0; currentWordOffset = 0; }
    if (currentIndex >= playQueue.length) { isPlaying = false; return; }
    const item = playQueue[currentIndex];
    if (currentLineIdx >= item.lines.length) { currentIndex++; currentLineIdx = 0; currentWordOffset = 0; speakCurrent(); return; }

    const lineEl = document.getElementById(`line-${currentIndex}-${currentLineIdx}`);
    document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line'));
    if (lineEl) {
        lineEl.classList.add('playing-line');
        const y = lineEl.getBoundingClientRect().top + window.scrollY - (window.innerHeight / 2) + (lineEl.clientHeight / 2);
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }

    let enText = item.lines[currentLineIdx];
    if (currentWordOffset > 0) { enText = enText.split(/\s+/).slice(currentWordOffset).join(' '); currentWordOffset = 0; }
    enText = processTitleText(enText).enTTSText;
    
    // 防呆：確保不會把「...」或是任何錯誤訊息唸出來
    let zhText = "";
    if (lineEl) {
        let rawZh = lineEl.querySelector('.zh-text').innerText;
        if (lineEl.querySelector('.zh-text').classList.contains('show') && !rawZh.includes('...') && !rawZh.includes('失敗') && !rawZh.includes('超時')) {
            zhText = rawZh;
        }
    }

    if (currentLangMode === 'EN') playSentence(enText, false, item.speaker, () => { advanceLine(); speakCurrent(); });
    else if (currentLangMode === 'ZH') {
        if (zhText) playSentence(zhText, true, item.speaker, () => { advanceLine(); speakCurrent(); });
        else { advanceLine(); speakCurrent(); }
    } else if (currentLangMode === 'EN_ZH') {
        playSentence(enText, false, item.speaker, () => {
            if (zhText && isPlaying) playSentence(zhText, true, item.speaker, () => { advanceLine(); speakCurrent(); });
            else { advanceLine(); speakCurrent(); }
        });
    }
}

function playSentence(text, isChinese, speaker, callback) {
    if (!text.trim() || !isPlaying) return callback();
    const u = new SpeechSynthesisUtterance(text);
    const voice = getVoiceForSpeaker(speaker, isChinese);
    if (voice) u.voice = voice;
    u.pitch = 1.0; u.rate = isChinese ? 1.05 : 1.0;
    u.onend = callback; u.onerror = callback; synth.speak(u);
}

function advanceLine() { currentLineIdx++; }
function togglePlayPause() { if (!isPlaying && !synth.paused) return playFrom(currentIndex); synth.paused ? resumeReading() : pauseReading(); }
function pauseReading() { isPlaying = false; synth.pause(); }
function resumeReading() { isPlaying = true; synth.resume(); }
function stopReading() { isPlaying = false; synth.cancel(); document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line')); }

setInterval(() => {
    document.getElementById('icon-play').style.display = (!isPlaying || synth.paused) ? 'block' : 'none';
    document.getElementById('icon-pause').style.display = (!isPlaying || synth.paused) ? 'none' : 'block';
}, 200);

window.onbeforeunload = () => synth.cancel();
window.onload = () => { initVoices(); setTimeout(loadRandomPlay, 500); };
</script>
</body>
</html>
