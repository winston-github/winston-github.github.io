<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shakespeare Auto-Reader Ultra</title>
<style>
    body {
        font-family: 'Georgia', serif;
        background-color: #f4ece1;
        color: #2c2c2c;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }
    
    /* 頂部懸浮控制列 */
    #controls-bar {
        position: fixed;
        top: 0; left: 0; width: 100%;
        background: rgba(255, 253, 249, 0.95);
        border-bottom: 1px solid #e0d8c8;
        padding: 12px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px; 
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
    }
    
    .icon-btn {
        background: #5c2c24;
        border: none;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 3px 8px rgba(92, 44, 36, 0.3);
    }
    .icon-btn:active { background: #8c4236; transform: scale(0.95); }
    .icon-btn svg { width: 28px; height: 28px; fill: #ffffff; }

    #status {
        text-align: center;
        font-style: italic;
        color: #666;
        font-size: 1.1em;
        margin-top: 80px;
    }

    /* 主文字區域 */
    #app-container {
        width: 90vw;
        max-width: 1000px;
        margin: 80px auto 60px auto; 
        background: #fffdf9;
        padding: 4vw;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        box-sizing: border-box;
    }

    #script-container { margin-top: 20px; }
    
    .item { margin-bottom: 30px; }
    
    .speaker-name {
        font-weight: bold;
        font-family: 'Segoe UI', sans-serif;
        color: #5c2c24;
        text-transform: uppercase;
        font-size: 1.1em;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
        display: inline-block;
        border-bottom: 2px solid transparent;
    }
    
    .speech-lines { margin-left: 10px; }
    
    .line-container {
        margin-bottom: 15px;
        padding: 10px 15px;
        border-radius: 8px;
        border-left: 4px solid transparent;
        transition: background-color 0.3s;
    }
    
    .en-text {
        font-size: 1.3em;
        line-height: 1.7;
        color: #1a1a1a;
    }
    
    .zh-text {
        font-size: 1em;
        color: #5b7b93;
        line-height: 1.5;
        margin-top: 6px;
        font-family: '-apple-system', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    .stagedir {
        color: #888;
        font-style: italic;
        font-size: 1em;
        margin: 25px 0;
        text-align: center;
        background: #fcfaf5;
        padding: 12px;
        border-radius: 6px;
    }

    /* 單字互動樣式 */
    .word {
        display: inline-block;
        cursor: pointer;
        padding: 0 2px;
        margin: 0 -2px;
        border-radius: 3px;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        transition: background-color 0.1s;
    }
    .word:active { background-color: rgba(212, 77, 51, 0.3); }

    /* 高亮顯示與置中 */
    .playing-line {
        background-color: #f6e8ce;
        border-left: 4px solid #d44d33 !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 懸浮字典視窗 */
    #dict-popup {
        position: absolute;
        z-index: 9999;
        background: #fffcf0;
        border: 2px solid #5c2c24;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        max-width: 280px;
        min-width: 150px;
        font-size: 1.05em;
        color: #2c2c2c;
        display: none;
        pointer-events: none; /* 防止阻擋觸控 */
        font-family: '-apple-system', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    .dict-title { font-weight: bold; color: #d44d33; font-size: 1.2em; border-bottom: 1px solid #e0d8c8; padding-bottom: 5px; margin-bottom: 8px;}
    .dict-pos { color: #5b7b93; font-style: italic; font-size: 0.9em; margin-right: 5px; }
</style>
</head>
<body>

<div id="dict-popup"></div>

<div id="controls-bar">
    <!-- 重頭播放 -->
    <button class="icon-btn" onclick="playFrom(0)" title="Play from Top">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 16.5v-9l7 4.5-7 4.5z"/></svg>
    </button>
    
    <!-- 智慧播放/暫停按鈕 -->
    <button class="icon-btn" id="btn-toggle-play" onclick="togglePlayPause()" title="Play / Pause">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <!-- 停止 -->
    <button class="icon-btn" onclick="stopReading()" title="Stop">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4 14H8V8h8v8z"/></svg>
    </button>

    <!-- 隨機切換劇本 -->
    <button class="icon-btn" onclick="loadRandomPlay()" title="Load Another Play">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
</div>

<div id="status">Initializing...</div>

<div id="app-container">
    <div id="script-container"></div>
</div>

<script>
// --- 翻譯佇列 (攔截所有斷句精準翻譯) ---
const translationQueue = [];
let isTranslating = false;

function processTranslation() {
    if (isTranslating || translationQueue.length === 0) return;
    isTranslating = true;
    const { text, zhElement } = translationQueue.shift();
    
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`;
    fetch(url).then(res => res.json()).then(data => {
        zhElement.innerText = data[0].map(item => item[0]).join('');
    }).catch(() => {
        zhElement.innerText = "(翻譯超時)";
    }).finally(() => {
        setTimeout(() => { isTranslating = false; processTranslation(); }, 350);
    });
}

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && !entry.target.dataset.translating) {
            entry.target.dataset.translating = 'true';
            translationQueue.push({ text: entry.target.dataset.en, zhElement: entry.target.querySelector('.zh-text') });
            processTranslation();
        }
    });
}, { rootMargin: '400px' });

// --- 語音引擎 (Chrome App 防護與鎖定音質) ---
let availableVoices = [];
let synth = window.speechSynthesis;

function initVoices() {
    let voices = synth.getVoices();
    const badKeywords = ['cellos', 'zarvox', 'trinoids', 'boing', 'whisper', 'deranged', 'espeak', 'network', 'albert', 'bad news'];
    
    // 初步過濾英文與黑名單
    let validVoices = voices.filter(v => v.lang.startsWith('en') && !badKeywords.some(bad => v.name.toLowerCase().includes(bad)));
    
    // 強制優先挑選 Chrome 與系統的「高畫質原生人聲」
    let premiumVoices = validVoices.filter(v => v.name.includes('Google') || v.name.includes('Premium') || v.name.includes('Siri') || v.name.includes('Natural'));
    
    availableVoices = premiumVoices.length > 0 ? premiumVoices : validVoices;
    if(availableVoices.length === 0) availableVoices = voices; // 終極備案
}
synth.onvoiceschanged = initVoices;

function getVoiceSettings(speakerName) {
    if (!availableVoices.length) return { voice: null, pitch: 1, rate: 1 };
    
    let isMale = null;
    const nameUpper = speakerName.toUpperCase();
    if (/\b(KING|PRINCE|DUKE|LORD|SIR|FATHER|SON|UNCLE|BROTHER|MAN|BOY|GENTLEMAN|BERNARDO|FRANCISCO|MARCELLUS|HORATIO|LEONATO)\b/.test(nameUpper)) isMale = true;
    if (/\b(QUEEN|PRINCESS|DUCHESS|LADY|MADAM|MOTHER|DAUGHTER|AUNT|SISTER|WOMAN|GIRL|MAID)\b/.test(nameUpper)) isMale = false;

    let candidateVoices = availableVoices;
    if (isMale === true) candidateVoices = availableVoices.filter(v => /\b(male|david|mark|james|daniel|arthur)\b/i.test(v.name) && !/female/i.test(v.name)) || availableVoices;
    if (isMale === false) candidateVoices = availableVoices.filter(v => /\b(female|zira|samantha|victoria|karen|moira)\b/i.test(v.name)) || availableVoices;
    if(candidateVoices.length === 0) candidateVoices = availableVoices;
    
    let hash = 0;
    for (let i = 0; i < speakerName.length; i++) { hash = speakerName.charCodeAt(i) + ((hash << 5) - hash); }
    
    // 【極度嚴格】：絕對鎖定 Pitch=1, Rate=1 確保聲音完全像真人不走鐘。
    return { voice: candidateVoices[Math.abs(hash) % candidateVoices.length], pitch: 1.0, rate: 1.0 };
}

// --- 劇本載入與「不隨便斷句」解析引擎 ---
let playQueue = [];
async function loadRandomPlay() {
    stopReading();
    document.getElementById('controls-bar').style.display = 'none';
    document.getElementById('script-container').innerHTML = '';
    document.getElementById('status').style.display = 'block';
    
    const fallbackFiles = ["hamlet.xml", "macbeth.xml", "r_and_j.xml", "lear.xml", "merchant.xml", "much_ado.xml"];
    let fileName = fallbackFiles[Math.floor(Math.random() * fallbackFiles.length)];
    let downloadUrl = `https://raw.githubusercontent.com/rufuspollock-okfn/shakespeare-material/abd92b518793aab643fc645267e15b8c0b1f715c/texts/moby/${fileName}`;
    
    try {
        const repoUrl = 'https://api.github.com/repos/rufuspollock-okfn/shakespeare-material/contents/texts/moby?ref=abd92b518793aab643fc645267e15b8c0b1f715c';
        const res = await fetch(repoUrl);
        if (res.ok) {
            const files = (await res.json()).filter(f => f.name.endsWith('.xml'));
            const f = files[Math.floor(Math.random() * files.length)];
            fileName = f.name; downloadUrl = f.download_url;
        }
    } catch(e) {}
    
    document.getElementById('status').innerText = `Loading ${fileName}...`;
    const xmlText = await (await fetch(downloadUrl)).text();
    document.getElementById('status').style.display = 'none';
    
    parseXML(xmlText);
    renderScript();
    document.getElementById('controls-bar').style.display = 'flex';
}

function parseXML(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    playQueue = [];
    const play = xmlDoc.querySelector('PLAY');
    if (!play) return;
    
    function walk(node) {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName.toUpperCase();
        
        if (tag === 'TITLE' && node.parentNode.tagName.toUpperCase() !== 'PLAY') {
            // 標題也會被發音和翻譯
            playQueue.push({ type: 'title', lines: [node.textContent.trim()], speaker: 'Narrator', id: playQueue.length });
        } else if (tag === 'SPEECH') {
            const speakers = Array.from(node.querySelectorAll("SPEAKER")).map(s => s.textContent.trim());
            const speaker = speakers.length > 0 ? speakers.join(" and ") : "Narrator";
            
            let fullSpeechText = "";
            node.childNodes.forEach(child => {
                if (child.nodeType === Node.ELEMENT_NODE && child.tagName.toUpperCase() === 'LINE') {
                    fullSpeechText += child.textContent.trim() + " ";
                }
            });
            fullSpeechText = fullSpeechText.replace(/\s+/g, ' ').trim();
            
            if (fullSpeechText.length > 0) {
                // 【嚴格斷句修正】：只有遇到 . ? ! : 才會切斷。即使句號在中間也安全切斷，沒有這幾個符號絕對不斷。
                let sentenceArray = fullSpeechText.match(/[^.?!:]+[.?!:]+|[^.?!:]+$/g) || [fullSpeechText];
                sentenceArray = sentenceArray.map(s => s.trim()).filter(s => s.length > 0);
                playQueue.push({ type: 'speech', lines: sentenceArray, speaker: speaker, id: playQueue.length });
            }
        } else if (tag === 'STAGEDIR') {
             playQueue.push({ type: 'stagedir', text: node.textContent.trim(), id: playQueue.length });
        } else {
            for (let child of node.childNodes) walk(child);
        }
    }
    walk(play);
}

function renderScript() {
    const container = document.getElementById('script-container');
    container.innerHTML = '';
    
    playQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `item ${item.type}`;
        
        if (item.type === 'speech' || item.type === 'title') {
            let linesHtml = '';
            item.lines.forEach((lineText, i) => {
                // 將句子切成單字並包裝成 span 供點擊
                let wordsHtml = lineText.split(/\s+/).map((w, wIdx) => {
                    let cleanWord = w.replace(/[^a-zA-Z']/g, ''); // 供字典查詢用的純淨字
                    return `<span class="word" data-word="${cleanWord}" data-item-idx="${index}" data-line-idx="${i}" data-word-idx="${wIdx}">${w}</span>`;
                }).join(' ');
                
                linesHtml += `
                <div class="line-container line-target" id="line-${index}-${i}" data-en="${lineText.replace(/"/g, '&quot;')}">
                    <div class="en-text">${wordsHtml}</div>
                    <div class="zh-text">...</div>
                </div>`;
            });
            
            if(item.type === 'title') {
                div.innerHTML = `<div class="speech-lines">${linesHtml}</div>`;
            } else {
                div.innerHTML = `<div class="speaker-name">${item.speaker}</div> <div class="speech-lines">${linesHtml}</div>`;
            }
            div.querySelectorAll('.line-target').forEach(el => observer.observe(el));
            
        } else if (item.type === 'stagedir') {
            div.innerHTML = `<div class="stagedir">[ ${item.text} ]</div>`;
        }
        container.appendChild(div);
    });
}

// --- 單字長按字典與短按發音互動邏輯 ---
let pressTimer;
let longPressTriggered = false;
let touchStartX = 0, touchStartY = 0;

const scriptContainer = document.getElementById('script-container');

scriptContainer.addEventListener('pointerdown', (e) => {
    const wordEl = e.target.closest('.word');
    if (!wordEl) return;
    touchStartX = e.clientX; touchStartY = e.clientY;
    longPressTriggered = false;
    
    pressTimer = setTimeout(() => {
        longPressTriggered = true;
        handleLongPress(wordEl);
    }, 450); // 450毫秒判定為長按
});

scriptContainer.addEventListener('pointermove', (e) => {
    if (pressTimer && (Math.abs(e.clientX - touchStartX) > 10 || Math.abs(e.clientY - touchStartY) > 10)) {
        clearTimeout(pressTimer);
    }
});

scriptContainer.addEventListener('pointerup', (e) => {
    clearTimeout(pressTimer);
    const wordEl = e.target.closest('.word');
    if (!wordEl) return;
    if (longPressTriggered) { e.preventDefault(); return; }
    
    // 短按：從這個字開始往下發音
    const itemIdx = parseInt(wordEl.dataset.itemIdx);
    const lineIdx = parseInt(wordEl.dataset.lineIdx);
    const wordIdx = parseInt(wordEl.dataset.wordIdx);
    playFromWord(itemIdx, lineIdx, wordIdx);
});

scriptContainer.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.word')) e.preventDefault(); // 阻止系統預設長按選單
});

// 滑動畫面時關閉字典
window.addEventListener('scroll', () => { document.getElementById('dict-popup').style.display = 'none'; }, { passive: true });
document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('#dict-popup') && !e.target.closest('.word')) {
        document.getElementById('dict-popup').style.display = 'none';
    }
});

async function handleLongPress(wordEl) {
    if ("vibrate" in navigator) navigator.vibrate(50); // 手機震動回饋
    pauseReading(); // 暫停劇情朗讀

    const wordText = wordEl.dataset.word;
    if (!wordText) return;

    // 單字專屬女聲發音
    speakSingleWord(wordText);

    // 顯示字典視窗並定位 (懸浮於單字上方)
    const popup = document.getElementById('dict-popup');
    popup.innerHTML = `<div class="dict-title">${wordText}</div><div style="font-size:0.9em;color:#666;">搜尋字典中...</div>`;
    popup.style.display = 'block';
    
    const rect = wordEl.getBoundingClientRect();
    let left = rect.left + window.scrollX - 20;
    if (left + 280 > window.innerWidth) left = window.innerWidth - 300; 
    popup.style.left = `${Math.max(10, left)}px`;
    popup.style.top = `${Math.max(10, rect.top + window.scrollY - popup.offsetHeight - 15)}px`;

    // 呼叫 Google Dictionary API
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(wordText)}`;
        const res = await fetch(url);
        const data = await res.json();

        let dictContent = `<div class="dict-title">${wordText}</div>`;
        if (data[0] && data[0][0]) dictContent += `<div style="margin-bottom:8px;">${data[0][0][0]}</div>`;
        
        if (data[1]) { // 詞性與多重解釋
            data[1].slice(0, 3).forEach(posGroup => {
                const pos = posGroup[0]; 
                const terms = posGroup[1].slice(0, 4).join(', ');
                dictContent += `<div><span class="dict-pos">${pos}.</span> ${terms}</div>`;
            });
        }
        popup.innerHTML = dictContent;
        popup.style.top = `${Math.max(10, rect.top + window.scrollY - popup.offsetHeight - 15)}px`; // 重新校正高度
    } catch(e) {
        popup.innerHTML = `<div class="dict-title">${wordText}</div>查詢失敗`;
    }
}

function speakSingleWord(word) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(word);
    let femaleVoice = availableVoices.find(v => (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google UK English Female')) && v.lang.startsWith('en'));
    if (femaleVoice) u.voice = femaleVoice;
    u.pitch = 1.0; u.rate = 0.9;
    synth.speak(u);
}

// --- 播放器核心邏輯 ---
let isPlaying = false;
let currentIndex = 0;
let currentLineIdx = 0;
let currentWordOffset = 0; // 短按從指定單字開始的偏移量

function playFrom(index) { playFromWord(index, 0, 0); }

function playFromWord(itemIdx, lineIdx, wordIdx) {
    isPlaying = false;
    synth.cancel();
    setTimeout(() => {
        currentIndex = itemIdx;
        currentLineIdx = lineIdx;
        currentWordOffset = wordIdx;
        isPlaying = true;
        speakCurrent();
    }, 50);
}

function speakCurrent() {
    if (!isPlaying) return;
    
    // 略過無法發音的物件
    while (currentIndex < playQueue.length && !['speech', 'title'].includes(playQueue[currentIndex].type)) {
        currentIndex++; currentLineIdx = 0; currentWordOffset = 0;
    }
    if (currentIndex >= playQueue.length) { isPlaying = false; return; }
    
    const item = playQueue[currentIndex];
    if (currentLineIdx >= item.lines.length) {
        currentIndex++; currentLineIdx = 0; currentWordOffset = 0;
        speakCurrent(); return;
    }

    let fullLine = item.lines[currentLineIdx];
    let textToSpeak = fullLine;
    
    // 如果是從中間的單字短按觸發，只裁切剩下的部分發音
    if (currentWordOffset > 0) {
        textToSpeak = fullLine.split(/\s+/).slice(currentWordOffset).join(' ');
        currentWordOffset = 0; // 讀完這行後，下一行恢復正常重頭讀
    }
    
    // UI 反白與「永遠置中」畫面捲動
    document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line'));
    const lineEl = document.getElementById(`line-${currentIndex}-${currentLineIdx}`);
    
    if (lineEl) {
        lineEl.classList.add('playing-line');
        // 【畫面精確置中技術】: 計算目標中心點，讓朗讀中的那行永遠保持在螢幕中間
        const y = lineEl.getBoundingClientRect().top + window.scrollY - (window.innerHeight / 2) + (lineEl.clientHeight / 2);
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
    
    if (!textToSpeak.trim()) { advanceLine(); speakCurrent(); return; }
    
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    const settings = getVoiceSettings(item.speaker);
    if (settings.voice) utterance.voice = settings.voice;
    utterance.pitch = settings.pitch;
    utterance.rate = settings.rate;
    
    utterance.onend = () => { if (isPlaying) { advanceLine(); speakCurrent(); } };
    utterance.onerror = () => { if (isPlaying) { advanceLine(); speakCurrent(); } };
    
    synth.speak(utterance);
}

function advanceLine() { currentLineIdx++; }

// --- 智慧 Play/Pause 按鈕切換邏輯 ---
function togglePlayPause() {
    if (!isPlaying && !synth.paused) { playFrom(currentIndex); return; } // 若從未播放過，從頭或當前開始
    if (synth.paused) { resumeReading(); } 
    else { pauseReading(); }
}

function pauseReading() { isPlaying = false; synth.pause(); }
function resumeReading() { isPlaying = true; synth.resume(); }
function stopReading() {
    isPlaying = false; synth.cancel();
    document.querySelectorAll('.playing-line').forEach(el => el.classList.remove('playing-line'));
}

// 每 200 毫秒即時偵測語音引擎狀態，切換 Play/Pause SVG 圖示
setInterval(() => {
    const playIcon = document.getElementById('icon-play');
    const pauseIcon = document.getElementById('icon-pause');
    if (!isPlaying || synth.paused) {
        playIcon.style.display = 'block'; pauseIcon.style.display = 'none';
    } else {
        playIcon.style.display = 'none'; pauseIcon.style.display = 'block';
    }
}, 200);

window.onbeforeunload = () => synth.cancel();
window.onload = () => {
    initVoices();
    setTimeout(loadRandomPlay, 500);
};
