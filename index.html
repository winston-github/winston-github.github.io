<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Portfolio</title>
    
    <!-- Google AdSense 腳本 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5350539988014376" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5350539988014376">

    <!-- 載入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           世界頂級 UI 設計：深色模式、玻璃擬物、互動光暈
           ========================================================= */
        :root {
            --bg: #09090b; /* 極致深灰底色 */
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 背景互動光暈 (由 JS 控制位置) */
        #glow {
            position: fixed;
            top: 50%; left: 50%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none; /* 不干擾點擊 */
            z-index: 0;
            transition: 0.1s ease-out;
        }

        /* 背景雜訊紋理 (增加質感) */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
        }

        /* 雙欄排版佈局 */
        .layout {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
            z-index: 2;
        }

        @media (min-width: 1024px) {
            .layout { flex-direction: row; gap: 4rem; height: calc(100vh - 8rem); }
            .left-panel { flex: 1; position: sticky; top: 4rem; height: fit-content; }
            .right-panel { flex: 1.5; overflow-y: auto; padding-right: 1rem; }
            /* 隱藏右側捲軸但保留功能 */
            .right-panel::-webkit-scrollbar { width: 0px; }
        }

        /* 左側：品牌與介紹 */
        .brand-title {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .brand-desc {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        /* 廣告區塊設計 (極致融合，不破壞美感) */
        .ad-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .ad-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent);
        }
        .ad-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 1rem; display: block;
        }

        /* 右側：資料夾手風琴選單 */
        .folder {
            margin-bottom: 1.5rem;
        }
        .folder-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        /* 工具卡片 (Bento Style) */
        .item-card {
            display: block;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .item-card h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        .item-card h3::after {
            content: '↗'; opacity: 0; transform: translate(-10px, 10px); transition: all 0.3s ease; color: var(--accent);
        }
        .item-card:hover h3::after { opacity: 1; transform: translate(0, 0); }
        .item-card p { margin: 0; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }

        /* 語系切換器 (浮動) */
        .lang-switch {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 20px; padding: 5px 15px; color: #fff; cursor: pointer; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="glow"></div>
    <div class="noise"></div>
    
    <button class="lang-switch" onclick="toggleLanguage()" id="langBtn">Language</button>

    <div class="layout">
        <!-- 左側：標題、介紹與廣告 -->
        <div class="left-panel">
            <h1 class="brand-title" id="ui-title">Loading...</h1>
            <p class="brand-desc" id="ui-desc"></p>
            
            <div class="ad-box">
                <span class="ad-label" id="ui-ad-label">Advertisement</span>
                <!-- ==============================================
                     把你的 Google AdSense <ins> 標籤放在這個 DIV 裡面 
                     ============================================== -->
                <div style="min-height: 250px; display:flex; align-items:center; justify-content:center; color:#555; border:1px dashed #333; border-radius: 8px;">
                    [Google AdSense Banner Space]
                </div>
            </div>
        </div>

        <!-- 右側：JSON 動態生成的選單清單 -->
        <div class="right-panel" id="menu-container">
            <!-- 內容由 JS 動態注入 -->
        </div>
    </div>

    <script>
        // 全域變數
        let siteData = null;
        let currentLang = 'en-us';

        // 1. 滑鼠跟隨光暈效果 (世界級網站愛用)
        const glow = document.getElementById('glow');
        document.body.addEventListener('mousemove', (e) => {
            requestAnimationFrame(() => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        });

        // 2. 初始化：取得 IP 地理位置 -> 決定語系 -> 讀取 JSON
        async function initApp() {
            try {
                // 嘗試透過 IP 判斷國家 (如果被擋，跳入 catch 使用瀏覽器語系)
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                const country = ipData.country_code; // 例如 TW, HK, US
                
                if (['TW', 'HK', 'MO'].includes(country)) {
                    currentLang = 'zh-tw';
                } else {
                    currentLang = 'en-us';
                }
            } catch (error) {
                console.warn("IP geolocation blocked or failed. Using browser language.");
                // 備用方案：判斷瀏覽器語系
                const browserLang = navigator.language.toLowerCase();
                currentLang = browserLang.includes('zh') ? 'zh-tw' : 'en-us';
            }

            // 讀取 index.json (注意：如果是本機直接點兩下 html 開啟可能會被 CORS 擋住，請在 GitHub Pages 或本機伺服器觀看)
            try {
                const response = await fetch('index.json');
                siteData = await response.json();
                renderUI();
            } catch (error) {
                console.error("Failed to load index.json", error);
                document.getElementById('ui-title').innerText = "Error loading data.";
            }
        }

        // 3. 渲染介面 (依照目前語系)
        function renderUI() {
            if (!siteData) return;
            const data = siteData[currentLang];
            
            // 更新左側文字與 Title
            document.title = data.siteName;
            document.getElementById('ui-title').innerText = data.siteName;
            document.getElementById('ui-desc').innerText = data.siteDesc;
            document.getElementById('ui-ad-label').innerText = data.adLabel;
            document.getElementById('langBtn').innerText = currentLang === 'zh-tw' ? 'English' : '中文';

            // 更新右側選單
            const container = document.getElementById('menu-container');
            container.innerHTML = ''; // 清空現有內容

            data.directories.forEach(dir => {
                // 建立資料夾區塊
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                
                const folderTitle = document.createElement('div');
                folderTitle.className = 'folder-title';
                folderTitle.innerText = dir.folderName;
                folderDiv.appendChild(folderTitle);

                // 建立該資料夾下的各個 HTML 檔案連結
                dir.items.forEach(item => {
                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = '_blank'; // 新分頁開啟 (符合 AdSense 且不影響主站)
                    card.className = 'item-card';
                    card.innerHTML = `
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    `;
                    folderDiv.appendChild(card);
                });

                container.appendChild(folderDiv);
            });
        }

        // 4. 手動切換語系 (提供給用戶的備用按鈕)
        function toggleLanguage() {
            currentLang = currentLang === 'zh-tw' ? 'en-us' : 'zh-tw';
            renderUI();
        }

        // 啟動程式
        window.onload = initApp;
    </script>
</body>
</html>
