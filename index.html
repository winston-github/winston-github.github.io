function renderSpotlight(data){const s=data.spotlight||{};document.getElementById('spotlight').innerHTML=`<div class="panel spotlight-copy"><div class="eyebrow">${escapeHtml(s.eyebrow||'')}</div><h2>${escapeHtml(s.title||'')}</h2><p>${escapeHtml(s.desc||'')}</p></div><ul class="panel point-list">${(s.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`}
function renderTools(data){const root=document.getElementById('dynamic-content');root.innerHTML='';(data.directories||[]).forEach(dir=>{const group=document.createElement('div');group.className='folder-group';group.innerHTML=`<div class="folder-title">${escapeHtml(dir.folderName)}</div>`;const grid=document.createElement('div');grid.className='grid';(dir.items||[]).forEach(item=>{const pageKey=(item.url||'').split('/').pop().split('.')[0];const card=document.createElement('a');card.href=item.url;card.target='_blank';card.rel='noopener noreferrer';card.className='card reactive';const tags=(item.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');card.innerHTML=`<div class="card-content"><div class="card-top"><h3>${escapeHtml(item.title)}</h3><span class="external">↗</span></div><p>${escapeHtml(item.desc)}</p><div class="tag-row">${tags}</div><div class="card-stats"><span>${escapeHtml(data.toolViewsLabel||'Views')}:</span><span class="stat-number card-view-count" data-page-id="${escapeAttr(pageKey)}">...</span></div></div>`;grid.appendChild(card)});group.appendChild(grid);root.appendChild(group)})}
function renderExtraSections(data){const root=document.getElementById('extra-sections');root.innerHTML='';(data.sections||[]).forEach(section=>{const wrap=document.createElement('section');wrap.className='section';wrap.id=section.id||'';const cards=(section.items||[]).map(item=>`<article class="dynamic-card">${item.stage?`<span class="stage">${escapeHtml(item.stage)}</span>`:''}<h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.desc)}</p></article>`).join('');wrap.innerHTML=`<div class="section-head"><h2 class="section-title">${escapeHtml(section.title)}</h2><div class="section-line"></div></div><div class="dynamic-grid">${cards}</div>`;root.appendChild(wrap)})}
async function initStats(){const meta=siteData.meta||fallbackMeta,namespace=meta.namespace||fallbackMeta.namespace,officialHost=meta.officialHost||fallbackMeta.officialHost,cacheBuster=Date.now(),isOfficialSite=window.location.hostname===officialHost;try{const endpoint=(!indexCounted&&isOfficialSite)?'/page-index/up':'/page-index/';const res=await fetch(`https://api.counterapi.dev/v1/${namespace}${endpoint}?_=${cacheBuster}`);const d=await res.json();document.getElementById('home-view-count').innerText=Number.isFinite(d.count)?d.count.toLocaleString():'0';indexCounted=true}catch(e){document.getElementById('home-view-count').innerText='0'}for(const el of document.querySelectorAll('.card-view-count')){const pageId=el.getAttribute('data-page-id'),readUrl=`https://api.counterapi.dev/v1/${namespace}/page-${pageId}/?_=${cacheBuster}`;try{const res=await fetch(readUrl);if(!res.ok)throw new Error('HTTP '+res.status);const d=await res.json();el.innerText=Number.isFinite(d.count)?d.count.toLocaleString():'0'}catch(e){console.warn('Counter read failed:',pageId,readUrl,e);el.innerText='0'}}}
function initAdSense(){if(adInitialized)return;try{(adsbygoogle=window.adsbygoogle||[]).push({});adInitialized=true}catch(e){console.warn('AdSense init skipped:',e)}}function toggleLang(){currentLang=currentLang==='zh-tw'?'en-us':'zh-tw';localStorage.setItem('infinity-lang',currentLang);buildUI();initStats()}function bindReactiveCards(){document.querySelectorAll('.reactive').forEach(el=>{el.onmousemove=e=>{const rect=el.getBoundingClientRect();el.style.setProperty('--mouse-x',`${e.clientX-rect.left}px`);el.style.setProperty('--mouse-y',`${e.clientY-rect.top}px`)}})}
function initScrollEnhancements(){const progress=document.getElementById('scroll-progress'),topBtn=document.getElementById('back-to-top');if(!progress||!topBtn)return;let ticking=false;function update(){const doc=document.documentElement,max=Math.max(1,doc.scrollHeight-window.innerHeight),ratio=Math.min(1,Math.max(0,window.scrollY/max));progress.style.width=(ratio*100).toFixed(2)+'%';topBtn.classList.toggle('show',window.scrollY>420);ticking=false}window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));update()}
function initIOSDoubleTapGuard(){let lastTouchEnd=0;document.addEventListener('touchend',event=>{const now=Date.now(),target=event.target;if(target&&target.closest&&target.closest('input,textarea,select,[contenteditable="true"]')){lastTouchEnd=now;return}if(now-lastTouchEnd<=300&&event.cancelable)event.preventDefault();lastTouchEnd=now},{passive:false})}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#96;')}document.addEventListener('DOMContentLoaded',bootApp);
</script>
