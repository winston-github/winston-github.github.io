<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Random Number Generator</title>
    <style>
        :root { --neon: #00ffcc; --neon-dark: #008877; --bg: #050505; --accent: #ff0055; --panel: #0a0a0a; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        /* App 感核心：使用 100dvh 鎖定動態視口，防止整體網頁上下亂彈 */
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; overflow: hidden; transition: background 0.3s, direction 0.3s; }
        
        .box { border: 1px solid var(--neon-dark); padding: 15px; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); width: 100%; max-width: 1200px; max-height: 95dvh; background: var(--panel); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; transition: all 0.3s; padding-bottom: max(15px, env(safe-area-inset-bottom)); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; flex-shrink: 0; }
        .top-bar h2 { margin: 0; font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px var(--neon); }
        select#lang-select { background: #001100; color: var(--neon); border: 1px solid var(--neon); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; }

        .seed-monitor { background: #001100; border: 1px solid #004400; padding: 12px; border-radius: 8px; flex-shrink: 0; }
        #seed-value { font-size: 1.1rem; color: #fff; font-weight: bold; word-break: break-all; }
        #seed-origin { font-size: 0.7rem; color: var(--neon-dark); margin-top: 4px; }

        /* 桌面版模型選單 */
        .desktop-only { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 5px; overscroll-behavior: contain; flex-shrink: 0; }
        .desktop-only::-webkit-scrollbar { width: 6px; }
        .desktop-only::-webkit-scrollbar-thumb { background: var(--neon-dark); border-radius: 3px; }
        .field-card { border: 1px solid #004400; background: #000805; padding: 10px; cursor: pointer; border-radius: 6px; transition: 0.2s; text-align: center; }
        .field-card:hover { border-color: var(--neon-dark); }
        .field-card.active { border-color: var(--neon); background: #001a14; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); font-weight: bold; }

        /* 手機版模型專屬滾輪選單 */
        .mobile-only { display: none; width: 100%; padding: 15px; background: #001a14; color: var(--neon); border: 1px solid var(--neon); border-radius: 8px; font-size: 1.1rem; font-weight: bold; appearance: none; text-align: center; box-shadow: 0 0 10px rgba(0,255,204,0.2); outline: none; }

        .algo-details { background: #000a08; border: 1px dashed var(--neon-dark); padding: 12px; border-radius: 8px; font-size: 0.75rem; line-height: 1.5; color: #ccc; flex-shrink: 0; }
        .algo-details strong { color: var(--accent); display: inline-block; width: 65px; }
        .algo-formula { color: #fff; background: #000; padding: 2px 6px; border-radius: 3px; border: 1px solid #222; font-family: monospace; }

        .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; background: #111; padding: 15px; border-radius: 8px; flex-shrink: 0; }
        .slider-group { display: flex; flex-direction: column; justify-content: center; touch-action: none; }
        .slider-group label { font-size: 0.75rem; color: var(--neon-dark); margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        /* 數值點擊按鈕 UI */
        .val-display { color: #fff; font-weight: bold; cursor: pointer; padding: 4px 10px; background: #001a14; border: 1px solid var(--neon-dark); border-radius: 6px; box-shadow: 0 0 5px rgba(0,255,204,0.2); user-select: none; -webkit-user-select: none; transition: 0.2s; }
        .val-display:active { background: var(--neon); color: #000; }
        .val-display::after { content: ' ⚙️'; font-size: 0.7rem; opacity: 0.8; }

        input[type=range] { width: 100%; accent-color: var(--neon); cursor: pointer; touch-action: none; }
        .dual-slider-container { position: relative; height: 24px; width: 100%; display: flex; align-items: center; touch-action: none; }
        .dual-slider-track { position: absolute; width: 100%; height: 6px; background: #333; border-radius: 3px; z-index: 1; }
        .dual-slider-fill { position: absolute; height: 6px; background: var(--neon); border-radius: 3px; z-index: 2; }
        .dual-slider-container input[type=range] { position: absolute; width: 100%; -webkit-appearance: none; appearance: none; background: transparent; z-index: 3; pointer-events: none; }
        .dual-slider-container input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--neon); cursor: pointer; box-shadow: 0 0 5px #000; }

        /* 快捷骰子區 */
        .dice-shortcuts { display: flex; gap: 8px; flex-shrink: 0; }
        .dice-shortcuts button { flex: 1; padding: 12px 5px; font-size: 1.1rem; background: #00221a; border: 1px solid var(--neon-dark); border-radius: 8px; color: #fff; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .dice-shortcuts button:active { transform: scale(0.95); background: var(--neon); color: #000; }

        #console { background: #000; color: #00ff00; font-size: 0.7rem; padding: 10px; height: 80px; overflow-y: auto; border: 1px solid #111; border-radius: 4px; line-height: 1.4; flex-shrink: 0; }
        .log-time { color: #555; margin-right: 5px; }

        #output-area { background: #000; border: 1px solid #111; padding: 10px; min-height: 80px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: center; align-items: center; border-radius: 8px; -webkit-user-select: text; user-select: text; flex-shrink: 0; }
        .num-tag { background: #001a14; color: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--neon); font-weight: bold; box-shadow: 0 0 5px rgba(0,255,204,0.1); display: inline-block; -webkit-user-select: text; user-select: text; transition: all 0.2s; }

        .progress-container { width: 100%; height: 4px; background: #111; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon), var(--accent)); transition: width 0.1s; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 0.65rem; text-align: center; flex-shrink: 0; }
        .stat-val { color: #fff; font-weight: bold; display: block; font-size: 0.9rem; margin-top: 3px; }

        button#run_btn { background: var(--neon); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; font-size: 1.2rem; transition: 0.2s; flex-shrink: 0; text-transform: uppercase; }
        button#run_btn:active { transform: scale(0.98); }
        button#run_btn.running { background: var(--accent); color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.6); }

        #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); color: var(--neon); padding: 25px; border-radius: 15px; font-weight: bold; font-size: 0.95rem; opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 9999; box-shadow: 0 0 30px rgba(0,255,204,0.3); border: 1px solid var(--neon); text-align: left; line-height: 1.8; width: 85%; max-width: 320px; }
        #toast.show { opacity: 1; }

        /* 中央彈出撥盤 UI (徹底解決瀏覽器底條蓋住的問題) */
        .dial-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.85); z-index: 20000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); touch-action: none; overscroll-behavior: none; }
        .dial-sheet { background: #111; border: 2px solid var(--neon); border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: 0 0 40px rgba(0,255,204,0.2); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .dial-header { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .dial-close-btn { background: var(--neon); color: #000; border: none; padding: 8px 15px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .dial-body { display: flex; justify-content: center; gap: 15px; }
        .dial-col { display: flex; flex-direction: column; align-items: center; background: #000; padding: 15px 10px; border-radius: 12px; border: 1px solid #333; flex: 1; }
        .dial-btn { background: #222; color: var(--neon); border: 1px solid #444; width: 100%; height: 50px; font-size: 1.5rem; border-radius: 8px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: 0.1s; }
        .dial-btn:active { background: var(--neon-dark); color: #fff; transform: scale(0.95); }
        .dial-val-box { font-size: 2rem; font-weight: bold; color: #fff; padding: 25px 0; touch-action: pan-y; cursor: grab; text-align: center; width: 100%; user-select: none; -webkit-user-select: none; text-shadow: 0 0 15px var(--neon-dark); }
        .dial-label { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; font-weight: bold; text-align: center; }

        /* 全螢幕純淨模式 CSS */
        body.fullscreen-mode { padding: 0; }
        body.fullscreen-mode .top-bar, body.fullscreen-mode .seed-monitor, body.fullscreen-mode .desktop-only, body.fullscreen-mode .mobile-only,
        body.fullscreen-mode .algo-details, body.fullscreen-mode .control-panel, body.fullscreen-mode #console, body.fullscreen-mode .dice-shortcuts,
        body.fullscreen-mode #run_btn, body.fullscreen-mode .stats, body.fullscreen-mode .seo-content { display: none !important; }
        
        body.fullscreen-mode .box { max-width: none; max-height: 100dvh; width: 100vw; height: 100dvh; border: none; border-radius: 0; margin: 0; padding: 0; box-shadow: none; justify-content: flex-start; }
        body.fullscreen-mode .progress-container { height: 6px; border-radius: 0; flex-shrink: 0; z-index: 10; }
        body.fullscreen-mode #output-area { flex-grow: 1; border: none; border-radius: 0; padding: max(80px, env(safe-area-inset-top)) 15px max(60px, env(safe-area-inset-bottom)) 15px; overflow-y: auto; align-content: center; background: #000; cursor: pointer; }
        body.fullscreen-mode .num-tag { margin: 8px; padding: 12px 20px; border-width: 2px; }

        /* --- 3D 物理骰子 CSS --- */
        .dice-container { perspective: 800px; margin: 15px; }
        .dice-3d { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; transition: transform 1.8s cubic-bezier(0.1, 1, 0.2, 1); transform: translateZ(-40px); }
        .dice-3d.rolling { animation: spin3D 0.4s linear infinite; }
        @keyframes spin3D { 100% { transform: translateZ(-40px) rotateX(360deg) rotateY(360deg) rotateZ(360deg); } }
        .dice-face { position: absolute; width: 80px; height: 80px; background: #fff; border: 2px solid #ccc; border-radius: 12px; display: grid; padding: 12px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1); grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .face-1 { transform: rotateY(0deg) translateZ(40px); grid-template-areas: ". . ." ". a ." ". . ."; }
        .face-6 { transform: rotateY(180deg) translateZ(40px); grid-template-areas: "a . d" "b . e" "c . f"; }
        .face-3 { transform: rotateY(90deg) translateZ(40px); grid-template-areas: "a . ." ". b ." ". . c"; }
        .face-4 { transform: rotateY(-90deg) translateZ(40px); grid-template-areas: "a . c" ". . ." "b . d"; }
        .face-2 { transform: rotateX(90deg) translateZ(40px); grid-template-areas: "a . ." ". . ." ". . b"; }
        .face-5 { transform: rotateX(-90deg) translateZ(40px); grid-template-areas: "a . c" ". b ." "d . e"; }
        .dot { background: #111; border-radius: 50%; width: 14px; height: 14px; justify-self: center; align-self: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        .dot:nth-child(1) { grid-area: a; } .dot:nth-child(2) { grid-area: b; } .dot:nth-child(3) { grid-area: c; }
        .dot:nth-child(4) { grid-area: d; } .dot:nth-child(5) { grid-area: e; } .dot:nth-child(6) { grid-area: f; }

        @media (max-width: 768px) {
            body { padding: 0; align-items: flex-start; justify-content: flex-start; }
            .box { max-height: 100dvh; border-radius: 0; border: none; }
            .desktop-only { display: none !important; }
            .mobile-only { display: block; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .top-bar h2 { font-size: 1rem; }
        }

        #ad-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.95); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .ad-box { width: 90%; max-width: 600px; background: #fff; border-radius: 8px; position: relative; padding: 20px; text-align: center; box-shadow: 0 0 30px rgba(0,255,204,0.3); }
        #close-ad-btn { position: absolute; top: -15px; right: -15px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.2rem; font-weight: bold; border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 10px #000; transition: 0.2s; z-index: 10001; }
        #close-ad-btn:hover { transform: scale(1.1); background: #ff3377; }
        .ad-countdown { color: #aaa; font-size: 0.75rem; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>

</div>

    const keys = Object.keys(dict['en'].t);

    const fieldIds =['quantum', 'fluid', 'finance', 'cauchy', 'weierstrass', 'mandelbrot', 'prime', 'riemann', 'lorenz', 'chirikov'];

    // --- 強化版曲線演算法滑桿 ---
    function updateDim() { 
        let raw = parseInt(document.getElementById('dim-slider').value) / 1000000; 
        let actual = 1 + Math.round(Math.pow(raw, 3) * 49999999);
        document.getElementById('dim-val').innerText = actual.toLocaleString();
        document.getElementById('dim-slider').dataset.actual = actual;
    }
    
    function updateCount() { 
        let raw = parseInt(document.getElementById('count-slider').value) / 1000000; 
        let actual = 1 + Math.round(Math.pow(raw, 1.5) * 499);
        document.getElementById('count-val').innerText = actual;
        document.getElementById('count-slider').dataset.actual = actual;
        updateTagSizes(); 
    }
    
    function updateRange(targetEl) {
        let minEl = document.getElementById('range-min'), maxEl = document.getElementById('range-max');
        let rawMin = parseInt(minEl.value) / 1000000;
        let rawMax = parseInt(maxEl.value) / 1000000;
        
        let minVal = Math.round(Math.pow(rawMin, 2) * 10000);
        let maxVal = 10000 - Math.round(Math.pow(1 - rawMax, 2) * 10000);

        if (minVal >= maxVal) {
            if (targetEl === minEl) {
                minVal = maxVal - 1;
                if(minVal < 0) { minVal = 0; maxVal = 1; }
            } else {
                maxVal = minVal + 1;
                if(maxVal > 10000) { maxVal = 10000; minVal = 9999; }
            }
            rawMin = Math.sqrt(minVal / 10000);
            minEl.value = Math.round(rawMin * 1000000);
            rawMax = 1 - Math.sqrt((10000 - maxVal) / 10000);
            maxEl.value = Math.round(rawMax * 1000000);
        }
        
        document.getElementById('range-val').innerText = `${minVal} ~ ${maxVal}`;
        minEl.dataset.actual = minVal;
        maxEl.dataset.actual = maxVal;
        
        document.getElementById('slider-fill').style.left = `${(parseInt(minEl.value)/1000000)*100}%`;
        document.getElementById('slider-fill').style.width = `${((parseInt(maxEl.value) - parseInt(minEl.value))/1000000)*100}%`;
    }

    // --- 置中撥盤微調系統 (虛擬滾輪) ---
    let dialState = { dim: 1, min: 0, max: 10000, count: 10 };
    let currentDialType = '';

    function openDial(type) {
        if (isRunning) return;
        currentDialType = type;
        
        dialState.dim = parseInt(document.getElementById('dim-slider').dataset.actual || 584803);
        dialState.min = parseInt(document.getElementById('range-min').dataset.actual || 0);
        dialState.max = parseInt(document.getElementById('range-max').dataset.actual || 10000);
        dialState.count = parseInt(document.getElementById('count-slider').dataset.actual || 10);
        
        const body = document.getElementById('dial-body');
        
        if (type === 'dim') {
            document.getElementById('dial-title').innerText = "維度規模 (Dims) 微調";
            body.innerHTML = createDialHTML('dim', '維度', dialState.dim);
            bindDialEvents('dim');
        } else if (type === 'count') {
            document.getElementById('dial-title').innerText = "產生數量 (Count) 微調";
            body.innerHTML = createDialHTML('count', '數量', dialState.count);
            bindDialEvents('count');
        } else if (type === 'range') {
            document.getElementById('dial-title').innerText = "取值區間 (Min ~ Max) 微調";
            body.innerHTML = createDialHTML('min', 'Min 最小值', dialState.min) + createDialHTML('max', 'Max 最大值', dialState.max);
            bindDialEvents('min'); bindDialEvents('max');
        }
        
        document.getElementById('dial-overlay').style.display = 'flex';
        swipeEnabled = false; 
    }

    function createDialHTML(key, label, val) {
        return `
            <div class="dial-col">
                <div class="dial-label">${label}</div>
                <button class="dial-btn" onclick="stepDial('${key}', 1)">▲</button>
                <div class="dial-val-box" id="dial-val-${key}">${val.toLocaleString()}</div>
                <button class="dial-btn" onclick="stepDial('${key}', -1)">▼</button>
            </div>
        `;
    }

    function stepDial(key, amount) { applyDialBounds(key, dialState[key] + amount); }

    function applyDialBounds(key, val) {
        if (key === 'dim') val = Math.max(1, Math.min(50000000, val));
        if (key === 'count') val = Math.max(1, Math.min(500, val));
        if (key === 'min') val = Math.max(0, Math.min(dialState.max - 1, val)); 
        if (key === 'max') val = Math.max(dialState.min + 1, Math.min(10000, val)); 
        
        dialState[key] = val;
        document.getElementById(`dial-val-${key}`).innerText = val.toLocaleString();
    }

    function bindDialEvents(key) {
        let el = document.getElementById(`dial-val-${key}`);
        let startY = 0, startVal = 0;
        
        el.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY; startVal = dialState[key]; e.preventDefault();
        }, {passive: false});
        
        el.addEventListener('touchmove', e => {
            let dy = startY - e.touches[0].clientY; 
            let step = Math.sign(dy) * Math.floor(Math.pow(Math.abs(dy) / 8, 1.3));
            if (step !== 0) applyDialBounds(key, startVal + step);
            e.preventDefault();
        }, {passive: false});
    }

    function closeDial() {
        document.getElementById('dial-overlay').style.display = 'none';
        
        if (currentDialType === 'dim') {
            let rawDim = Math.round(1000000 * Math.cbrt((dialState.dim - 1) / 49999999));
            document.getElementById('dim-slider').value = rawDim; updateDim();
        } else if (currentDialType === 'count') {
            let rawCount = Math.round(1000000 * Math.pow((dialState.count - 1) / 499, 1/1.5));
            document.getElementById('count-slider').value = rawCount; updateCount();
        } else if (currentDialType === 'range') {
            let rawMin = Math.round(1000000 * Math.sqrt(dialState.min / 10000));
            let rawMax = Math.round(1000000 * (1 - Math.sqrt((10000 - dialState.max) / 10000)));
            document.getElementById('range-min').value = rawMin;
            document.getElementById('range-max').value = rawMax;
            updateRange(document.getElementById('range-max')); 
        }
        swipeEnabled = true; 
    }

    // --- 觸控防護網與全螢幕切換 ---
    let touchStartX = 0, touchStartY = 0, swipeEnabled = true;
    let hasSeenToast = false; 

    document.addEventListener('touchstart', e => {
        if (e.target.closest('.control-panel') || e.target.closest('.desktop-only') || e.target.closest('.mobile-only') || e.target.closest('.top-bar') || e.target.closest('.dial-overlay') || e.target.closest('.dice-shortcuts')) {
            swipeEnabled = false; return; 
        }
        const tag = e.target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'button') { swipeEnabled = false; return; }
        
        swipeEnabled = true;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    document.addEventListener('touchend', e => {
        if (!swipeEnabled) return;
        let touchEndX = e.changedTouches[0].screenX, touchEndY = e.changedTouches[0].screenY;
        let dx = touchEndX - touchStartX, dy = touchEndY - touchStartY;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) toggleFullscreen();
    }, {passive: true});

    function toggleFullscreen() {
        isFullscreen = !document.body.classList.contains('fullscreen-mode');
        if (isFullscreen) {
            document.body.classList.add('fullscreen-mode');
            if (!hasSeenToast) { 
                showToast(dict[currLang].t.msg_fs_toast);
                hasSeenToast = true;
            }
        } else {
            document.body.classList.remove('fullscreen-mode');
        }
        updateTagSizes();
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerHTML = msg; 
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    document.getElementById('output-area').addEventListener('click', (e) => {
        if (!isFullscreen) return;
        const selectedText = window.getSelection().toString().trim();
        if (selectedText.length > 0) return; 
        if (!isRunning) toggleProjector();
    });

    function updateTagSizes() {
        const count = parseInt(document.getElementById("count-slider").dataset.actual || 10);
        let fs = count > 150 ? 0.8 : (count > 50 ? 1.2 : 1.8);
        if (isFullscreen) fs *= 1.5; 
        document.querySelectorAll('.num-tag').forEach(tag => tag.style.fontSize = fs + 'rem');
    }

    // --- 3D 骰子啟動邏輯 ---
    function triggerNormalGen() {
        isDiceMode = false;
        toggleProjector(false);
    }

    function rollDiceMode(num) {
        if(isRunning) return;
        isDiceMode = true;
        
        // 覆寫拉桿與內部數據
        let rawMin = Math.round(1000000 * Math.sqrt(1 / 10000));
        let rawMax = Math.round(1000000 * (1 - Math.sqrt((10000 - 6) / 10000)));
        document.getElementById('range-min').value = rawMin;
        document.getElementById('range-max').value = rawMax;
        document.getElementById('range-val').innerText = `1 ~ 6`;
        document.getElementById('range-min').dataset.actual = 1;
        document.getElementById('range-max').dataset.actual = 6;
        
        let rawCount = Math.round(1000000 * Math.pow((num - 1) / 499, 1/1.5));
        document.getElementById('count-slider').value = rawCount;
        document.getElementById('count-val').innerText = num;
        document.getElementById('count-slider').dataset.actual = num;
        
        document.getElementById('slider-fill').style.left = `${(rawMin/1000000)*100}%`;
        document.getElementById('slider-fill').style.width = `${((rawMax-rawMin)/1000000)*100}%`;

        // 強制進入全螢幕並開始演算
        if (!document.body.classList.contains('fullscreen-mode')) toggleFullscreen();
        toggleProjector(false);
    }

    // --- 核心運算 ---
    async function toggleProjector(fromAd = false) {
        const btn = document.getElementById("run_btn");
        const t = dict[currLang].t;

        if (isRunning) {
            shouldAbort = true; btn.innerText = "Aborting..."; return;
        }

        if (!fromAd && !isDiceMode) {
            generateClickCount++;
            if (generateClickCount === 3) {
                showAdOverlay(); generateClickCount = 0; return; 
            }
        }
 
        isRunning = true; shouldAbort = false;
        btn.classList.add("running"); btn.innerText = t.btn_stop;
        const outputArea = document.getElementById("output-area");
        outputArea.innerHTML = "";

        const dims = parseInt(document.getElementById("dim-slider").dataset.actual);
        const minV = parseInt(document.getElementById("range-min").dataset.actual);
        const maxV = parseInt(document.getElementById("range-max").dataset.actual);
        const count = parseInt(document.getElementById("count-slider").dataset.actual);
        const rangeSize = maxV - minV + 1;
        
        const now = Date.now();
        const baseSeed = (now % 1000000) * 1.61803398875;
        document.getElementById("seed-value").innerText = `SEED: ${baseSeed.toFixed(8)}`;

        const startTime = performance.now(); let totalFlops = 0;
        let fs = count > 150 ? 0.8 : (count > 50 ? 1.2 : 1.8);
        if (isFullscreen) fs *= 1.5;

        // 預先建立畫面元素 (包含 3D 骰子)
        let els =[];
        for (let c = 0; c < count; c++) {
            let el = document.createElement("div");
            if (isDiceMode) {
                el.className = "dice-container";
                el.innerHTML = `
                    <div class="dice-3d rolling" id="dice-${c}">
                        <div class="dice-face face-1"><div class="dot"></div></div>
                        <div class="dice-face face-2"><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                `;
            } else {
                el.className = "num-tag";
                el.style.fontSize = fs + 'rem';
                el.innerText = "...";
            }
            outputArea.appendChild(el);
            els.push(el);
        }

        for (let c = 0; c < count; c++) {
            if (shouldAbort) break;

            let energy = 0; let S = baseSeed + (c * 1.37); 
            const prog = (((c+1)/count)*100).toFixed(0);
            document.getElementById("stat-progress").innerText = prog + "%";
            document.getElementById("progress-bar").style.width = prog + "%";
            
            if (c % 2 === 0 || dims > 2000000) await new Promise(r => setTimeout(r, 0));
            if (shouldAbort) break;

            for (let j = 1; j <= dims; j++) {
                switch(currentField) {
                    case 'quantum': energy += Math.tan(Math.sin(S * Math.sqrt(j)) * Math.cos(S * Math.pow(j, 0.33))); break;
                    case 'fluid':   energy += Math.sin(S * j) / (1 + Math.log(1 + S * j * j)); break;
                    case 'finance': energy += Math.exp(-S * j / dims) * Math.sin(S * Math.sqrt(j) * 3.1415); break;
                    case 'cauchy':  let t_val = Math.tan(S * j); if(isFinite(t_val)) energy += t_val; break;
                    case 'weierstrass': energy += Math.cos(Math.pow(1.5, j % 50) * Math.PI * S) / Math.pow(2, j % 50); break;
                    case 'mandelbrot': energy += Math.log(Math.abs(Math.sin(S * j) + Math.cos(S / j)) + 1); break;
                    case 'prime':   energy += ((S * j * 104729) % 999983) / 1000000; break;
                    case 'riemann': energy += Math.sin(S * Math.log(j)) / (1 + Math.sqrt(j)); break;
                    case 'lorenz':  energy += Math.sin(S*j) * Math.cos(S*j*1.41) * Math.tan(S*j*2.71); break;
                    case 'chirikov': energy += Math.sin(S * j + Math.sin(S * j)); break;
                }
            }
            
            let finalVal = Math.floor((Math.abs(energy) * 1000000) % rangeSize) + minV;
            if (isNaN(finalVal)) finalVal = minV;

            if (isDiceMode) {
                let dice3d = document.getElementById(`dice-${c}`);
                dice3d.classList.remove('rolling');
                let rx = 0, ry = 0;
                switch(finalVal) {
                    case 1: rx = 1080; ry = 1080; break;
                    case 6: rx = 1080; ry = 1260; break; 
                    case 3: rx = 1080; ry = 990; break; 
                    case 4: rx = 1080; ry = 1170; break; 
                    case 2: rx = 990; ry = 1080; break; 
                    case 5: rx = 1170; ry = 1080; break; 
                    default: rx = 1080; ry = 1080; finalVal = 1;
                }
                dice3d.style.transform = `translateZ(-40px) rotateX(${rx}deg) rotateY(${ry}deg)`;
            } else {
                els[c].innerText = finalVal;
            }
            
            totalFlops += dims * (currentField==='cauchy'?2:6); 
            const elapsed = performance.now() - startTime;
            document.getElementById("stat-flops").innerText = totalFlops.toLocaleString();
            document.getElementById("stat-time").innerText = elapsed.toFixed(0);
            if(elapsed > 0) document.getElementById("stat-speed").innerText = ((totalFlops / (elapsed / 1000)) / 1e9).toFixed(2);
        }

        if (shouldAbort) {
            logEvent('abort', null); document.getElementById("stat-progress").innerText = "Aborted";
        } else {
            logEvent('done', dims);
        }

        isRunning = false; shouldAbort = false;
        btn.classList.remove("running"); btn.innerText = dict[currLang].t.btn_run;
    }

    // --- 廣告控制邏輯 ---
    let adLoaded = false; 
    function showAdOverlay() {
        const overlay = document.getElementById('ad-overlay');
        const closeBtn = document.getElementById('close-ad-btn');
        const adText = document.getElementById('ad-text');
        
        overlay.style.display = 'flex';
        closeBtn.style.display = 'none'; 
        
        if (!adLoaded) {
            try {
                let adKey = 'adsby' + 'google';
                window[adKey] = window[adKey] || [];
                window[adKey].push({});
                adLoaded = true;
            } catch (e) {
                console.error("AdSense Error:", e);
            }
        }
        
        let timeLeft = 3;
        adText.innerText = `贊助廣告將在 ${timeLeft} 秒後可關閉...`;
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                adText.innerText = `贊助廣告將在 ${timeLeft} 秒後可關閉...`;
            } else {
                clearInterval(timer);
                adText.innerText = "感謝您的支持";
                closeBtn.style.display = 'block'; 
            }
        }, 1000);
    }

    function closeAdOverlay() {
        document.getElementById('ad-overlay').style.display = 'none';
        toggleProjector(true);
    }
    
    window.onload = init;
</script>

</body>
</html>
