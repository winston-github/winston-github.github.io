function isZhBrowserLanguage(){const langs=[navigator.language,...(navigator.languages||[])].filter(Boolean).map(v=>v.toLowerCase());return langs.some(lang=>lang==='zh-tw'||lang==='zh-hk'||lang==='zh-mo'||lang.includes('hant'))}function isZhSystemSignal(){const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();return ['asia/taipei','asia/hong_kong','asia/macau'].includes(tz)}function fetchTimeout(url,ms){return Promise.race([fetch(url),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))])}async function detectLanguage(meta){if(isZhBrowserLanguage())return'zh-tw';if(isZhSystemSignal())return'zh-tw';try{const r=await fetchTimeout('https://ipapi.co/json/',2000);const d=await r.json();return(meta.zhRegions||fallbackMeta.zhRegions).includes(d.country_code)?'zh-tw':'en-us'}catch(e){console.warn('IP language detection skipped:',e);return'en-us'}}

function renderSpotlight(data){const s=data.spotlight||{};document.getElementById('spotlight').innerHTML=`<div class="panel spotlight-copy"><div class="eyebrow">${escapeHtml(s.eyebrow||'')}</div><h2>${escapeHtml(s.title||'')}</h2><p>${escapeHtml(s.desc||'')}</p></div><ul class="panel point-list">${(s.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`}function renderChips(data){const row=document.getElementById('chip-row');row.innerHTML=`<button class="chip active" data-filter="all">${escapeHtml(data.allToolsLabel||'All Tools')}</button>`+(data.directories||[]).map(d=>`<button class="chip" data-filter="${escapeAttr(d.folderName)}">${escapeHtml(d.folderName)}</button>`).join('');row.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{currentFilter=chip.dataset.filter;row.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===chip));applyFilter()}))}

function getSiteSearchIndex(data){const base=(siteData.meta&&siteData.meta.siteBaseUrl)||fallbackMeta.siteBaseUrl,map=new Map();function add(item,category){const url=item.url||'';if(!url)return;const key=url.split('#')[0];if(map.has(key))return;const tags=item.tags||[];map.set(key,{title:item.title||key,desc:item.desc||'',url:key,fullUrl:new URL(key,base).href,category:category||item.category||'',tags,search:`${item.title||''} ${item.desc||''} ${category||item.category||''} ${tags.join(' ')} ${key}`.toLowerCase()})}(data.directories||[]).forEach(dir=>(dir.items||[]).forEach(item=>add(item,dir.folderName)));(data.sitePages||[]).forEach(item=>add(item,item.category));return[...map.values()]}function renderSearchResults(q,data){const box=document.getElementById('search-results'),text=data.siteSearch||{};if(!q){box.classList.remove('show');box.innerHTML='';return}const terms=q.split(/\s+/).filter(Boolean);const results=getSiteSearchIndex(data).map(item=>{let score=0;terms.forEach(t=>{if(item.title.toLowerCase().includes(t))score+=6;if(item.url.toLowerCase().includes(t))score+=4;if(item.category.toLowerCase().includes(t))score+=3;if(item.search.includes(t))score+=1});return{...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)).slice(0,12);box.classList.add('show');if(!results.length){box.innerHTML=`<div class="empty-state show">${escapeHtml(text.empty||'No results.')}</div>`;return}box.innerHTML=results.map(r=>`<a class="result-card" href="${escapeAttr(r.url)}" target="_blank" rel="noopener noreferrer"><div class="result-top"><div class="result-title">${escapeHtml(r.title)}</div><div class="external">↗</div></div><div class="result-url">${escapeHtml(r.fullUrl)}</div><div class="result-desc">${escapeHtml(r.desc)}</div><div class="result-tags">${[r.category,...(r.tags||[])].filter(Boolean).slice(0,5).map(t=>`<span class="result-tag">${escapeHtml(t)}</span>`).join('')}</div></a>`).join('')}
