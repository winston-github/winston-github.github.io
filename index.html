<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google AdSense 基礎資源 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5350539988014376" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5350539988014376">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>無限維度 | 創意工坊</title>

    <!-- 載入頂級排版字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           頂級 UI 核心變數與重置
           ========================================================= */
        :root {
            --bg-base: #030305;
            --text-main: #f8fafc;
            --text-muted: #8b949e;
            --accent: #00f0ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.06);
            --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0; background-color: var(--bg-base);
            color: var(--text-main); font-family: 'Inter', 'Noto Sans TC', sans-serif;
            min-height: 100dvh; overflow-x: hidden; overscroll-behavior-y: none;
        }

        /* 背景環境光 */
        .ambient-glow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.05), transparent 50%);
            z-index: 0; pointer-events: none;
        }
        #cursor-glow {
            position: fixed; top: 50%; left: 50%; width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
            z-index: 1; transition: opacity 0.5s; opacity: 0;
        }

        /* 排版架構 */
        #app-container {
            display: flex; flex-direction: column; max-width: 1600px; margin: 0 auto;
            padding: 2rem 1.5rem; position: relative; z-index: 10;
            opacity: 0; transition: opacity 1s ease;
        }

        @media (min-width: 1024px) {
            #app-container { flex-direction: row; gap: 4rem; padding: 4rem; height: 100dvh; overflow: hidden; }
            .sidebar { width: 350px; flex-shrink: 0; display: flex; flex-direction: column; }
            .content-area { flex-grow: 1; overflow-y: auto; padding-right: 1rem; padding-bottom: 4rem; }
            .content-area::-webkit-scrollbar { width: 0px; }
        }

        /* 左側品牌設計 */
        .header-section { margin-bottom: 2.5rem; position: relative; }
        .brand-name {
            font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; margin: 0 0 0.5rem 0;
            background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.04em;
        }
        .brand-tagline { font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 1.5rem; }
        .brand-desc { font-size: 0.95rem; line-height: 1.7; color: var(--text-muted); font-weight: 300; margin-bottom: 1rem; }

        /* 首頁統計文字 */
        .home-stats {
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted);
            background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--glass-border);
        }
        .home-stats .stat-number { color: var(--accent); font-weight: 600; font-family: 'Inter', monospace; }

        .lang-toggle {
            position: absolute; top: 0; right: 0; background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: #fff; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.85rem; font-weight: 600; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .lang-toggle:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }

        /* 廣告區塊 */
        .ad-container { margin-top: auto; padding-top: 2rem; width: 100%; }
        .ad-glass-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem;
            backdrop-filter: blur(20px); position: relative; overflow: hidden; min-height: 280px; display: flex; flex-direction: column; justify-content: center;
        }
        .ad-label { position: absolute; top: 10px; left: 15px; font-size: 0.65rem; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; }

        /* 卡片網格與樣式 */
        .folder-group { margin-bottom: 3rem; }
        .folder-title {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin-bottom: 1.2rem;
            display: flex; align-items: center; gap: 10px;
        }
        .folder-title::after { content: ''; flex-grow: 1; height: 1px; background: linear-gradient(90deg, var(--glass-border), transparent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }

        .card {
            display: flex; flex-direction: column; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 1.5rem; text-decoration: none; color: inherit; position: relative; overflow: hidden;
            transition: all 0.4s var(--spring-easing); cursor: pointer; backdrop-filter: blur(10px); height: 100%;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.06), transparent 40%);
            opacity: 0; transition: opacity 0.5s; z-index: 0;
        }
        .card:hover { transform: translateY(-4px); background: var(--card-hover); border-color: rgba(255,255,255,0.2); }
        .card:hover::before { opacity: 1; }
        .card-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
        
        .card h3 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.8rem 0; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .card h3::after { content: '↗'; color: var(--text-muted); font-size: 1.2rem; font-weight: 400; transition: all 0.3s ease; transform: translate(-5px, 5px); opacity: 0.5; }
        .card:hover h3::after { color: var(--accent); transform: translate(0, 0); opacity: 1; }
        .card p { margin: 0 0 1.2rem 0; font-size: 0.9rem; line-height: 1.6; color: var(--text-muted); flex-grow: 1; }

        /* 卡片內部統計資訊 (置底) */
        .card-stats {
            display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; margin-top: auto;
        }
        .card-stats svg { width: 14px; height: 14px; fill: currentColor; opacity: 0.8; }
        .card-stats .stat-number { color: var(--accent); font-family: 'Inter', monospace; font-weight: 600; }

        .stagger-item { opacity: 0; transform: translateY(30px) scale(0.98); animation: slideUp 0.8s var(--spring-easing) forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 1023px) {
            .ad-container { margin-top: 3rem; margin-bottom: 2rem; }
            .brand-desc { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div id="cursor-glow"></div>

    <div id="app-container">
        
        <aside class="sidebar">
            <div class="header-section stagger-item" style="animation-delay: 0.1s;">
                <button class="lang-toggle" onclick="toggleLang()" id="ui-lang-btn">EN</button>
                <h1 class="brand-name" id="ui-title">...</h1>
                <div class="brand-tagline" id="ui-tagline">...</div>
                <p class="brand-desc" id="ui-desc">...</p>
                <!-- 左側：首頁專屬瀏覽次數 -->
                <div class="home-stats">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    <span id="ui-home-visits-label">Total Visits</span>: <span id="home-view-count" class="stat-number">...</span>
                </div>
            </div>

            <div class="ad-container stagger-item" style="animation-delay: 0.2s;">
                <div class="ad-glass-box">
                    <span class="ad-label" id="ui-ad-label">SPONSORED</span>
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-5350539988014376"
                         data-ad-slot="6681492480"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <!-- 工具卡片動態區 -->
            <div id="dynamic-content"></div>
        </main>
    </div>

    <script>
        let siteData = null;
        let currentLang = 'zh-tw';
        let adInitialized = false;
        let indexCounted = false;

        const cursorGlow = document.getElementById('cursor-glow');
        if(window.matchMedia("(pointer: fine)").matches) {
            document.body.addEventListener('mousemove', (e) => {
                cursorGlow.style.opacity = 1;
                requestAnimationFrame(() => {
                    cursorGlow.style.left = e.clientX + 'px';
                    cursorGlow.style.top = e.clientY + 'px';
                });
            });
        }

        async function bootApp() {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                const twHkMo = ['TW', 'HK', 'MO'];
                currentLang = twHkMo.includes(ipData.country_code) ? 'zh-tw' : 'en-us';
            } catch (e) {
                currentLang = navigator.language.toLowerCase().includes('zh') ? 'zh-tw' : 'en-us';
            }

            try {
                const res = await fetch('index.json');
                siteData = await res.json();
                buildUI();
                initStats(); // 建立完UI後拉取統計資料
                
                setTimeout(() => {
                    document.getElementById('app-container').style.opacity = 1;
                    initAdSense();
                }, 100);
            } catch (e) {
                console.error("Failed to load JSON:", e);
                document.getElementById('ui-title').innerText = "System Offline";
                document.getElementById('app-container').style.opacity = 1;
            }
        }

        function buildUI() {
            if (!siteData) return;
            const data = siteData[currentLang];
            
            document.title = `${data.siteName} | ${data.siteTagline}`;
            document.getElementById('ui-title').innerText = data.siteName;
            document.getElementById('ui-tagline').innerText = data.siteTagline;
            document.getElementById('ui-desc').innerText = data.siteDesc;
            document.getElementById('ui-ad-label').innerText = data.adLabel;
            document.getElementById('ui-lang-btn').innerText = data.langBtn;
            document.getElementById('ui-home-visits-label').innerText = currentLang === 'zh-tw' ? '首頁造訪' : 'Home Visits';

            const contentArea = document.getElementById('dynamic-content');
            contentArea.innerHTML = ''; 
            
            let animDelay = 0.3;

            data.directories.forEach(dir => {
                const group = document.createElement('div');
                group.className = 'folder-group';
                
                const title = document.createElement('div');
                title.className = 'folder-title stagger-item';
                title.style.animationDelay = `${animDelay}s`;
                title.innerText = dir.folderName;
                animDelay += 0.1;
                group.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid';

                dir.items.forEach(item => {
                    // 自動從 URL 萃取出檔案名稱作為計數器的 ID，例如 "dice.html" -> "dice"
                    // 加入 split 確保即使路徑有 ./ 也能正常擷取
                    const pageKey = item.url.split('/').pop().split('.')[0];

                    const card = document.createElement('a');
                    card.href = item.url;
                    card.target = '_blank';
                    card.className = 'card stagger-item';
                    card.style.animationDelay = `${animDelay}s`;
                    animDelay += 0.1;
                    
                    card.innerHTML = `
                        <div class="card-content">
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                            <div class="card-stats">
                                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                <span class="stat-number card-view-count" data-page-id="${pageKey}">...</span>
                            </div>
                        </div>
                    `;

                    card.onmousemove = e => {
                        const rect = card.getBoundingClientRect();
                        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                    };

                    grid.appendChild(card);
                });
                group.appendChild(grid);
                contentArea.appendChild(group);
            });
        }

// 統計資料讀取 (已加入防盜網域機制與破快取)
        async function initStats() {
            const namespace = 'winston-github-io';
            const cacheBuster = new Date().getTime(); 
            
            // 判斷是否為官方正版網域
            const isOfficialSite = (window.location.hostname === 'winston-github.github.io');

            // 1. 首頁自身的計數
            if (!indexCounted) {
                try {
                    // 只有在官方網域，才發送帶有 /up 的 +1 請求
                    const endpoint = isOfficialSite ? '/page-index/up' : '/page-index';
                    const res = await fetch(`https://api.counterapi.dev/v1/${namespace}${endpoint}?_=${cacheBuster}`);
                    const data = await res.json();
                    document.getElementById('home-view-count').innerText = data.count ? data.count.toLocaleString() : '0';
                } catch(e) {}
                indexCounted = true;
            } else {
                try {
                    const res = await fetch(`https://api.counterapi.dev/v1/${namespace}/page-index?_=${cacheBuster}`);
                    const data = await res.json();
                    document.getElementById('home-view-count').innerText = data.count ? data.count.toLocaleString() : '0';
                } catch(e) {}
            }

            // 2. 抓取所有卡片內的計數 (單純讀取，不涉及 /up)
            const statElements = document.querySelectorAll('.card-view-count');
            
            for (const el of statElements) {
                const pageId = el.getAttribute('data-page-id');
                try {
                    const res = await fetch(`https://api.counterapi.dev/v1/${namespace}/page-${pageId}/?_=${cacheBuster}`);
                    
                    if (!res.ok) {
                        el.innerText = "0"; 
                        continue;
                    }
                    
                    const text = await res.text();
                    try {
                        const data = JSON.parse(text);
                        el.innerText = data.count ? data.count.toLocaleString() : '0';
                    } catch(err) {
                        el.innerText = "0"; 
                    }
                } catch(e) {
                    el.innerText = "0"; 
                }
            }
        }

        function initAdSense() {
            if (adInitialized) return;
            try { 
                (adsbygoogle = window.adsbygoogle || []).push({});
                adInitialized = true;
            } catch (e) {
                console.error("AdSense Script Error:", e);
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'zh-tw' ? 'en-us' : 'zh-tw';
            const contentArea = document.getElementById('dynamic-content');
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                buildUI();
                initStats(); // 重新拉取一次卡片數字
                contentArea.style.transition = 'opacity 0.4s';
                contentArea.style.opacity = 1;
            }, 300);
        }

        window.onload = bootApp;
    </script>
</body>
</html>
