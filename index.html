-card{padding:20px;border:1px solid var(--border);background:rgba(255,255,255,.038);border-radius:20px}.dynamic-card h3{margin:0 0 10px}.stage{display:inline-flex;margin-bottom:12px;color:var(--ok);border:1px solid rgba(52,211,153,.22);background:rgba(52,211,153,.08);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900}footer{margin-top:54px;padding:24px 0 0;border-top:1px solid var(--border);color:var(--muted);line-height:1.6}
    @media(min-width:560px){.quick-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.grid,.dynamic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side-stack{grid-template-columns:.72fr 1fr}}@media(min-width:820px){.hero{grid-template-columns:minmax(0,1.15fr) minmax(310px,.85fr);gap:18px;align-items:stretch}.side-stack{grid-template-columns:1fr;grid-template-rows:auto 1fr}.spotlight{grid-template-columns:.92fr 1.08fr;align-items:stretch}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-control{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);align-items:center;gap:10px}.chip-row{padding-top:0}}@media(min-width:1120px){.hero-main{min-height:460px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dynamic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:1420px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(hover:hover) and (pointer:fine){.btn:hover,.chip:hover,.lang-toggle:hover{transform:translateY(-2px);border-color:var(--border2)}.card:hover{transform:translateY(-5px);border-color:var(--border2);background:rgba(255,255,255,.068)}.card:hover:before{opacity:1}.card:hover .external{color:var(--accent);transform:translate(3px,-3px)}}@media(pointer:coarse){:root{--tap:48px}#cursor-glow{display:none}.card:before,.hero-main:before{opacity:.55}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

    .global-search-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;color:var(--soft);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.global-search-title span:last-child{color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0;font-weight:700}.search-results{display:none;margin-top:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px;max-height:min(54svh,520px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.search-results.show{display:grid;gap:10px}.result-card{display:grid;gap:5px;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);text-decoration:none}.result-card:active{transform:scale(.99);background:var(--glass2)}.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.result-title{font-weight:900;color:#fff;line-height:1.35}.result-url{color:var(--accent);font-size:12px;word-break:break-all}.result-desc{color:var(--muted);font-size:13px;line-height:1.55}.result-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.result-tag{font-size:10px;color:#d1d5db;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}

<body>
  <div class="noise"></div><div id="cursor-glow"></div><div id="app">
    <nav class="topbar"><div class="brand-mini"><span class="brand-dot"></span><span id="ui-mini-brand">Digital Lab</span></div><button class="lang-toggle" id="ui-lang-btn" onclick="toggleLang()" aria-label="Toggle language">EN</button></nav>
    <section class="global-search-panel" id="global-search-panel">
      <div class="global-search-title"><span id="site-search-title">Site Search</span><span id="site-search-hint"></span></div>
      <label class="search" aria-label="Site search"><span>⌕</span><input id="tool-search" type="search" autocomplete="off"></label>
      <div class="chip-row" id="chip-row"></div>
      <div class="search-results" id="search-results"></div>
    </section>
    <section class="hero"><div class="panel hero-main reactive"><div class="hero-inner"><div class="badge-row" id="ui-badges"></div><h1 id="ui-title">Infinity</h1><div class="tagline" id="ui-tagline">Digital Lab & Benchmarks</div><p class="desc" id="ui-desc"></p><div class="hero-actions" id="ui-actions"></div></div></div><aside class="side-stack"><div class="panel home-stats"><div><div class="stat-kicker" id="ui-home-visits-label">Home Visits</div><div class="home-count" id="home-view-count">...</div></div><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" style="color:var(--accent);opacity:.82"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div><div class="panel ad-panel"><span class="ad-label" id="ui-ad-label">SPONSORED / AD</span><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5350539988014376" data-ad-slot="6681492480" data-ad-format="auto" data-full-width-responsive="true"></ins></div></aside></section>
    <section class="quick-stats" id="ui-stats"></section><section class="section spotlight" id="spotlight"></section>
    <section class="section" id="tools"><div class="section-head"><h2 class="section-title" id="ui-tools-title">Tools</h2><div class="section-line"></div></div><div class="tools-layout" id="dynamic-content"></div><div class="empty-state" id="empty-state"></div></section>
    <div id="extra-sections"></div><footer><div><strong id="footer-title">Infinity Lab</strong><div id="footer-desc"></div></div></footer>
  </div>
  <script>
    let siteData=null,currentLang='en-us',adInitialized=false,indexCounted=false,currentFilter='all';
    const fallbackMeta={namespace:'winston-github-io',officialHost:'winston-github.github.io',zhRegions:['TW','HK','MO']};const cursorGlow=document.getElementById('cursor-glow');
    if(window.matchMedia('(pointer: fine)').matches){document.body.addEventListener('mousemove',e=>{cursorGlow.style.opacity=1;requestAnimationFrame(()=>{cursorGlow.style.left=e.clientX+'px';cursorGlow.style.top=e.clientY+'px'})})}
    function isZhBrowserLanguage(){const langs=[navigator.language,...(navigator.languages||[])].filter(Boolean).map(v=>v.toLowerCase());return langs.some(lang=>lang==='zh-tw'||lang==='zh-hk'||lang==='zh-mo'||lang.includes('hant'))}
    function isZhSystemSignal(){const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();return ['asia/taipei','asia/hong_kong','asia/macau'].includes(tz)}
    async function detectLanguage(meta){try{const ipRes=await fetch('https://ipapi.co/json/');const ipData=await ipRes.json();return (meta.zhRegions||fallbackMeta.zhRegions).includes(ipData.country_code)?'zh-tw':'en-us'}catch(e){return (isZhBrowserLanguage()||isZhSystemSignal())?'zh-tw':'en-us'}}
    async function bootApp(){try{const res=await fetch('index.json?_='+Date.now());siteData=await res.json();const savedLang=localStorage.getItem('infinity-lang');currentLang=['zh-tw','en-us'].includes(savedLang)?savedLang:await detectLanguage(siteData.meta||fallbackMeta);buildUI();await initStats();initAdSense();document.getElementById('app').classList.add('ready')}catch(e){console.error('Failed to boot homepage:',e);document.getElementById('ui-title').innerText='System Offline';document.getElementById('app').classList.add('ready')}}
    function getData(){return siteData[currentLang]||siteData['en-us']}function setText(id,value){document.getElementById(id).innerText=value||''}
    function buildUI(){const data=getData();document.documentElement.lang=currentLang==='zh-tw'?'zh-TW':'en-US';document.title=`${data.siteName} | ${data.siteTagline}`;setText('ui-mini-brand',data.siteTagline);setText('ui-title',data.siteName);setText('ui-tagline',data.siteTagline);setText('ui-desc',data.siteDesc);setText('ui-lang-btn',data.langBtn);document.getElementById('ui-lang-btn').setAttribute('aria-label',currentLang==='zh-tw'?'Switch to English':'切換至繁體中文');setText('ui-ad-label',data.adLabel);setText('ui-home-visits-label',data.homeVisitsLabel);setText('ui-tools-title',currentLang==='zh-tw'?'工具入口':'Tool Directory');setText('footer-title',data.footer?.title||'Infinity Lab');setText('footer-desc',data.footer?.desc||'');const searchText=data.siteSearch||{};setText('site-search-title',searchText.title||'Site Search');setText('site-search-hint',searchText.hint||'');document.getElementById('tool-search').placeholder=searchText.placeholder||data.searchPlaceholder||'Search site...';document.getElementById('tool-search').value='';document.getElementById('empty-state').innerText=data.emptyState||'No matching tools.';document.getElementById('ui-badges').innerHTML=(data.heroBadges||[]).map(x=>`<span class="badge">${escapeHtml(x)}</span>`).join('');document.getElementById('ui-actions').innerHTML=(data.heroActions||[]).map((a,i)=>`<a class="btn ${i===0?'primary':''}" href="${escapeAttr(a.target)}">${escapeHtml(a.label)}</a>`).join('');document.getElementById('ui-stats').innerHTML=(data.stats||[]).map(s=>`<div class="quick-stat"><strong>${escapeHtml(s.value)}</strong><span>${escapeHtml(s.label)} · ${escapeHtml(s.hint||'')}</span></div>`).join('');renderSpotlight(data);renderChips(data);renderTools(data);renderExtraSections(data);bindReactiveCards();bindSearch();applyFilter()}
    function renderSpotlight(data){const s=data.spotlight||{};document.getElementById('spotlight').innerHTML=`<div class="panel spotlight-copy"><div class="eyebrow">${escapeHtml(s.eyebrow||'')}</div><h2>${escapeHtml(s.title||'')}</h2><p>${escapeHtml(s.desc||'')}</p></div><ul class="panel point-list">${(s.points||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`}
    function renderChips(data){const row=document.getElementById('chip-row');row.innerHTML=`<button class="chip active" data-filter="all">${escapeHtml(data.allToolsLabel||'All Tools')}</button>`+(data.directories||[]).map(d=>`<button class="chip" data-filter="${escapeAttr(d.folderName)}">${escapeHtml(d.folderName)}</button>`).join('');row.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{currentFilter=chip.dataset.filter;row.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===chip));applyFilter()}))}
    function renderTools(data){const root=document.getElementById('dynamic-content');root.innerHTML='';(data.directories||[]).forEach(dir=>{const group=document.createElement('div');group.className='folder-group';group.dataset.category=dir.folderName;group.innerHTML=`<div class="folder-title">${escapeHtml(dir.folderName)}</div>`;const grid=document.createElement('div');grid.className='grid';(dir.items||[]).forEach(item=>{const pageKey=(item.url||'').split('/').pop().split('.')[0];const tagText=(item.tags||[]).join(' ');const card=document.createElement('a');card.href=item.url;card.target='_blank';card.rel='noopener noreferrer';card.className='card reactive';card.dataset.category=dir.folderName;card.dataset.search=`${item.title} ${item.desc} ${dir.folderName} ${tagText}`.toLowerCase();const tags=(item.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');card.innerHTML=`<div class="card-content"><div class="card-top"><h3>${escapeHtml(item.title)}</h3><span class="external">↗</span></div><p>${escapeHtml(item.desc)}</p><div class="tag-row">${tags}</div><div class="card-stats"><span>${escapeHtml(data.toolViewsLabel||'Views')}:</span><span class="stat-number card-view-count" data-page-id="${escapeAttr(pageKey)}">...</span></div></div>`;grid.appendChild(card)});group.appendChild(grid);root.appendChild(group)})}
    function renderExtraSections(data){const root=document.getElementById('extra-sections');root.innerHTML='';(data.sections||[]).forEach(section=>{const wrap=document.createElement('section');wrap.className='section';wrap.id=section.id||'';const cards=(section.items||[]).map(item=>`<article class="dynamic-card">${item.stage?`<span class="stage">${escapeHtml(item.stage)}</span>`:''}<h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.desc)}</p></article>`).join('');wrap.innerHTML=`<div class="section-head"><h2 class="section-title">${escapeHtml(section.title)}</h2><div class="section-line"></div></div><div class="dynamic-grid">${cards}</div>`;root.appendChild(wrap)})}
    function bindSearch(){document.getElementById('tool-search').oninput=applyFilter}
    function getSiteSearchIndex(data){const base=(siteData.meta&&siteData.meta.siteBaseUrl)||'https://winston-github.github.io/';const map=new Map();function add(item,category){const url=item.url||'';if(!url)return;const key=url.split('#')[0];if(map.has(key))return;const tags=item.tags||[];map.set(key,{title:item.title||key,desc:item.desc||'',url:key,fullUrl:new URL(key,base).href,category:category||item.category||'',tags:tags,search:`${item.title||''} ${item.desc||''} ${category||item.category||''} ${tags.join(' ')} ${key}`.toLowerCase()})}(data.directories||[]).forEach(dir=>(dir.items||[]).forEach(item=>add(item,dir.folderName)));(data.sitePages||[]).forEach(item=>add(item,item.category));return [...map.values()]}
    function renderSearchResults(q,data){const box=document.getElementById('search-results');const text=data.siteSearch||{};if(!q){box.classList.remove('show');box.innerHTML='';return}const terms=q.split(/\s+/).filter(Boolean);const results=getSiteSearchIndex(data).map(item=>{let score=0;terms.forEach(t=>{if(item.title.toLowerCase().includes(t))score+=6;if(item.url.toLowerCase().includes(t))score+=4;if(item.category.toLowerCase().includes(t))score+=3;if(item.search.includes(t))score+=1});return{...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)).slice(0,12);box.classList.add('show');if(results.length===0){box.innerHTML=`<div class="empty-state show">${escapeHtml(text.empty||'No results.')}</div>`;return}box.innerHTML=results.map(r=>`<a class="result-card" href="${escapeAttr(r.url)}" target="_blank" rel="noopener noreferrer"><div class="result-top"><div class="result-title">${escapeHtml(r.title)}</div><div class="external">↗</div></div><div class="result-url">${escapeHtml(r.fullUrl)}</div><div class="result-desc">${escapeHtml(r.desc)}</div><div class="result-tags">${[r.category,...(r.tags||[])].filter(Boolean).slice(0,5).map(t=>`<span class="result-tag">${escapeHtml(t)}</span>`).join('')}</div></a>`).join('')}
    function applyFilter(){const data=getData();const q=(document.getElementById('tool-search')?.value||'').trim().toLowerCase();renderSearchResults(q,data);let total=0;document.querySelectorAll('.folder-group').forEach(group=>{let groupTotal=0;group.querySelectorAll('.card').forEach(card=>{const visible=(currentFilter==='all'||card.dataset.category===currentFilter)&&(!q||card.dataset.search.includes(q));card.classList.toggle('hidden',!visible);if(visible){groupTotal++;total++}});group.classList.toggle('hidden',groupTotal===0)});document.getElementById('empty-state').classList.toggle('show',total===0)}
    async function initStats(){const meta=siteData.meta||fallbackMeta,namespace=meta.namespace||fallbackMeta.namespace,officialHost=meta.officialHost||fallbackMeta.officialHost,cacheBuster=Date.now(),isOfficialSite=window.location.hostname===officialHost;try{const endpoint=(!indexCounted&&isOfficialSite)?'/page-index/up':'/page-index/';const res=await fetch(`https://api.counterapi.dev/v1/${namespace}${endpoint}?_=${cacheBuster}`);const data=await res.json();document.getElementById('home-view-count').innerText=Number.isFinite(data.count)?data.count.toLocaleString():'0';indexCounted=true}catch(e){document.getElementById('home-view-count').innerText='0'}for(const el of document.querySelectorAll('.card-view-count')){const pageId=el.getAttribute('data-page-id'),readUrl=`https://api.counterapi.dev/v1/${namespace}/page-${pageId}/?_=${cacheBuster}`;try{const res=await fetch(readUrl);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();el.innerText=Number.isFinite(data.count)?data.count.toLocaleString():'0'}catch(e){console.warn('Counter read failed:',pageId,readUrl,e);el.innerText='0'}}}
    function initAdSense(){if(adInitialized)return;try{(adsbygoogle=window.adsbygoogle||[]).push({});adInitialized=true}catch(e){console.warn('AdSense init skipped:',e)}}function toggleLang(){currentLang=currentLang==='zh-tw'?'en-us':'zh-tw';localStorage.setItem('infinity-lang',currentLang);currentFilter='all';buildUI();initStats()}function bindReactiveCards(){document.querySelectorAll('.reactive').forEach(el=>{el.onmousemove=e=>{const rect=el.getBoundingClientRect();el.style.setProperty('--mouse-x',`${e.clientX-rect.left}px`);el.style.setProperty('--mouse-y',`${e.clientY-rect.top}px`)}})}function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#96;')}window.onload=bootApp;
  </script>
