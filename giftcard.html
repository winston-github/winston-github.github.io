                // 智慧離線喚醒 (Auto-boot)：只要本機有資料，直接秒開，免去點擊 Restore 的麻煩！
                const localDataStr = localStorage.getItem('points_sys_data');
                if (localDataStr) {
                    try {
                        STATE.data = JSON.parse(localDataStr);
                        const cloudStr = localStorage.getItem('points_sys_cloud');
                        if (cloudStr) {
                            const c = JSON.parse(cloudStr);
                            STATE.cloud.folderId = c.folderId; STATE.cloud.fileId = c.fileId; STATE.cloud.lastSyncTime = c.lastSyncTime;
                        }
                        
                        document.getElementById('auth-overlay').classList.remove('active');
                        
                        // 修正：進入本機模式時，不要跳出煩人的紅色 Toast，只亮起右上角燈號
                        const badge = document.getElementById('sync-status-badge');
                        badge.className = 'error'; badge.innerHTML = `☁️ ⚠️ 待上傳`;
                        
                        this.enterReadonlyMode();
                        
                        // 修正：無論圖片有沒有載入成功，先強制把頂部頭像與背景畫出來！
                        UIManager.renderProfiles();
                        if(typeof CardManager !== 'undefined') CardManager.renderStage();
                        
                        // 背景靜默載入圖片快取
                        LocalDB.init().then(async () => {
                            STATE.images = {};
                            const allImgIds = new Set();
                            STATE.data.users.forEach(u => { if(u.avatarId) allImgIds.add(u.avatarId); });
                            STATE.data.cards.forEach(c => { if(c.imgId) allImgIds.add(c.imgId); });
                            
                            for (let id of allImgIds) {
                                const b64 = await LocalDB.get(id);
                                if (b64) STATE.images[id] = b64;
                            }
                            // 所有圖片快取拉取完畢後，再次刷新畫面套用真實圖片
                            UIManager.renderProfiles(); 
                            if(typeof CardManager !== 'undefined') CardManager.renderStage();
                            if(typeof BackpackManager !== 'undefined') BackpackManager.render();
                        });
                        return; // 完成智慧喚醒，跳過授權頁
                        
                    } catch(e) {}
                }

                document.getElementById('btn-new').onclick = () => this.handleNewFlow();
                document.getElementById('btn-restore').onclick = () => this.handleRestoreFlow();
            },

            handleNewFlow: async function() {
                try {
                    await new Promise((resolve) => CloudManager.authorize(() => resolve()));
                    const folder = await DriveUI.showSelector();
                    STATE.cloud.folderId = folder.id;

                    const pwd = await PinLock.open("設定核心金鑰", "請輸入 4~16 位數字密碼 (此金鑰將用於加密，遺失無法救援！)");
                    if (!pwd) return showToast("已取消建立");
                    const pwdConfirm = await PinLock.open("確認核心金鑰", "請再次輸入相同的數字密碼");
                    if (pwd !== pwdConfirm) return showToast("兩次密碼不一致，建立失敗");

                    localStorage.setItem('sys_pin_cache', pwd); // 【金鑰快取】實作免密碼背景儲存

                    showToast("正在初始化系統...", false);
                    await LocalDB.init(); STATE.images = {};
                    STATE.data = { users: [], cards: [], bullets: [], logs: [], last_update: Date.now() };
                    
                    document.getElementById('auth-overlay').classList.remove('active');
                    STATE.currentUser = 'admin'; STATE.isGodMode = true; document.body.classList.add('god-mode');
                    
                    await this.performFullSync();
                } catch (e) { showToast(e.message || "建立發生異常"); }
            },

            handleRestoreFlow: async function() {
                try {
                    await new Promise((resolve) => CloudManager.authorize(() => resolve()));
                    const folder = await DriveUI.showSelector();
                    STATE.cloud.folderId = folder.id;

                    showToast("尋找備份存檔中...", false);
                    const q = encodeURIComponent(`parents in '${folder.id}' and mimeType='application/json' and trashed=false`);
                    const urlList = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=1`;
                    const res = await DriveAPI.fetch(urlList);
                    const data = await res.json();

                    if (!data.files || data.files.length === 0) return showToast("偵測到此路徑無備份存檔，還原中斷");

                    const backupFile = data.files[0];
                    STATE.cloud.fileId = backupFile.id;

                    const fileRes = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files/${backupFile.id}?alt=media`);
                    const encryptedCompressedStr = await fileRes.text();

                    const pwd = await PinLock.open("解密備份存檔", "請輸入家長數字密碼以解鎖檔案");
                    if (!pwd) return showToast("已取消還原");

                    const compressedStr = await CryptoEngine.decrypt(encryptedCompressedStr, pwd);
                    if (!compressedStr) return showToast("密碼錯誤！解密失敗");
                    
                    localStorage.setItem('sys_pin_cache', pwd); // 【金鑰快取】實作免密碼背景儲存

                    const jsonStr = DataCompressor.decompress(compressedStr);
                    STATE.data = SyncEngine.mergeCloudWithLocal(jsonStr);
                    STATE.cloud.lastSyncTime = new Date(backupFile.modifiedTime).getTime();

                    await LocalDB.init(); STATE.images = {};
                    this.updateSyncUI('syncing', '載入雲端照片...');
                    const allImgIds = new Set();
                    STATE.data.users.forEach(u => { if(u.avatarId) allImgIds.add(u.avatarId); });
                    STATE.data.cards.forEach(c => { if(c.imgId) allImgIds.add(c.imgId); });
                    
                    for (let id of allImgIds) {
                        let b64 = await LocalDB.get(id);
                        if (!b64) { try { b64 = await CloudManager.downloadImage(id); if(b64) await LocalDB.save(id, b64); } catch(e) {} }
                        if(b64) STATE.images[id] = b64;
                    }

                    this.persistToLocal();
                    document.getElementById('auth-overlay').classList.remove('active');
                    this.updateSyncUI('success', "系統就緒！");
                    this.enterReadonlyMode();
                } catch (e) { showToast("載入進度失敗"); }
            },

            enterReadonlyMode: function() {
                STATE.isGodMode = false; STATE.isReadonly = true; STATE.currentUser = null;
                const children = STATE.data.users.filter(u => u.role === 'child');
                if (children.length > 0 && !STATE.currentBeneficiary) STATE.currentBeneficiary = children[0].id;
                UIManager.renderProfiles(); UIManager.renderMarquee();
                if(typeof CardManager !== 'undefined') CardManager.renderStage();
            },

            requestGodMode: async function(parentUser) {
                const pwd = await PinLock.open("家長權限認證", `請輸入密碼以切換為 ${parentUser.name}`);
                if (!pwd) return;
                STATE.isGodMode = true; STATE.isReadonly = false; STATE.currentUser = parentUser.id;
                document.body.classList.add('god-mode');
                showToast(`已切換為 ${parentUser.name}`, false);
                UIManager.renderProfiles(); UIManager.renderMarquee();
                document.getElementById('backpack-drawer').classList.remove('open');
            },

            switchBeneficiary: function(childId) {
                STATE.currentBeneficiary = childId; STATE.currentUser = childId;
                if (!STATE.isGodMode) { STATE.isReadonly = false; document.body.classList.remove('god-mode'); }
                UIManager.renderProfiles(); UIManager.renderMarquee();
                if(typeof CardManager !== 'undefined') CardManager.renderStage();
                if(typeof BackpackManager !== 'undefined') BackpackManager.render();
            },

            updateSyncUI: function(statusStr, msg) {
                const badge = document.getElementById('sync-status-badge');
                badge.className = statusStr;
                if(statusStr === 'syncing') badge.innerHTML = `☁️ ⏳ 同步中...`;
                else if(statusStr === 'success') badge.innerHTML = `☁️ ✅ 已同步`;
                else if(statusStr === 'error') badge.innerHTML = `☁️ ⚠️ 待上傳`;
                else badge.innerHTML = `☁️ 待命`;
                
                // 修正：同步中的過程不要跳出煩人的 Toast 蓋住畫面，只有發生錯誤或成功時才提示
                if(msg && statusStr !== 'syncing') {
                    showToast(msg, statusStr === 'error');
                }
            },

            // 取代舊的 saveAndSync，永遠只花 0.01 秒存在本機，把上傳決定權還給使用者！
            saveLocal: function() {
                if (!TimeGuard.verify() || !StorageGuard.check()) return;
                STATE.data.last_update = Date.now();
                this.persistToLocal();
                this.updateSyncUI('error', ''); // 亮起橘色燈號，提示使用者有資料待上傳
            },

            persistToLocal: function() {
                localStorage.setItem('points_sys_data', JSON.stringify(STATE.data));
                localStorage.setItem('points_sys_cloud', JSON.stringify({
                    folderId: STATE.cloud.folderId, fileId: STATE.cloud.fileId, lastSyncTime: STATE.cloud.lastSyncTime
                }));
            },

            // 真正的雲端完整同步引擎 (由使用者手動點擊觸發)
            performFullSync: async function() {
                try {
                    if (STATE.cloud.isOffline) return showToast("目前處於離線狀態，無法同步");
                    if (!STATE.cloud.accessToken) return CloudManager.authorize(() => this.performFullSync());

                    let pwd = localStorage.getItem('sys_pin_cache');
                    if (!pwd) {
                        pwd = await PinLock.open("授權雲端同步", "請輸入您的數字密碼以加密備份至雲端");
                        if (pwd) localStorage.setItem('sys_pin_cache', pwd);
                        else return this.updateSyncUI('error', "未提供密碼，取消同步");
                    }

                    this.updateSyncUI('syncing', '正在上傳照片至雲端...');

                    // 1. 抓出所有本地端照片，上傳為實體檔案
                    for (let u of STATE.data.users) {
                        if (u.avatarId && u.avatarId.startsWith('local_img_')) {
                            const b64 = await LocalDB.get(u.avatarId);
                            if (b64) {
                                const fileName = generateFileName('Avatar', name);
                        const fileId = await CloudManager.uploadImage(this.tempAvatar, STATE.cloud.folderId, fileName);
                                if (newId) { await LocalDB.save(newId, b64); STATE.images[newId] = b64; u.avatarId = newId; }
                            }
                        }
                    }
                    for (let c of STATE.data.cards) {
                        if (c.imgId && c.imgId.startsWith('local_img_')) {
                            const b64 = await LocalDB.get(c.imgId);
                            if (b64) {
                                const fileName = generateFileName('Card', c.cardName);
                                const newId = await CloudManager.uploadImage(b64, STATE.cloud.folderId, fileName);
                                if (newId) { await LocalDB.save(newId, b64); STATE.images[newId] = b64; c.imgId = newId; }
                            }
                        }
                    }

                    this.updateSyncUI('syncing', '正在備份加密資料庫...');

                    if (STATE.cloud.fileId) {
                        const isConflict = await CloudManager.checkVersionConflict(STATE.cloud.fileId);
                        if (isConflict) return showToast("雲端有新進度！為防覆蓋，請先重新載入網頁並選擇 Restore", true);
                    }

                    STATE.data.last_update = Date.now();
                    this.persistToLocal(); 
                    
                    const jsonStr = JSON.stringify(STATE.data);
                    const compressedStr = DataCompressor.compress(jsonStr);
                    const encryptedStr = await CryptoEngine.encrypt(compressedStr, pwd);
                    
                    const fileName = `PointsBackup_${new Date().toISOString().split('T')[0]}.json`;
                    const success = await CloudManager.resumableUpload(STATE.cloud.fileId, STATE.cloud.folderId, fileName, encryptedStr);
                    
                    if (success) this.updateSyncUI('success', "完整同步成功！所有照片與資料已上傳");
                    else this.updateSyncUI('error', "上傳失敗，已存本機");

                } catch (e) {
                    console.error("同步異常詳細資訊:", e);
                    this.updateSyncUI('error', `同步異常: ${extractErrorMsg(e)}`);
                }
                
            }
        };

        // 監聽離線狀態
        window.addEventListener('offline', () => {
            STATE.cloud.isOffline = true;
            this.updateSyncUI('error', '網路已斷開，改為本機模式');
        });
        window.addEventListener('online', () => {
            STATE.cloud.isOffline = false;
            this.updateSyncUI('error', '網路已恢復，點擊此處可上傳');
        });
        
// ==========================================
        // 14. 彈藥背包與雙模擊發系統 (BackpackManager)
        // ==========================================
        const BackpackManager = {
            render: function() {
                const grid = document.getElementById('bullet-grid');
                const countBadge = document.getElementById('backpack-count');
                grid.innerHTML = '';
                
                // 篩選出屬於當前孩子且尚未消耗的點數
                const myBullets = STATE.data.bullets.filter(b => b.ownerId === STATE.currentBeneficiary);
                countBadge.innerText = myBullets.length;

                myBullets.forEach(bullet => {
                    const el = document.createElement('div');
                    el.className = `bullet-item ${bullet.size === 0.5 ? 'half-point' : 'full-point'}`;
                    // 動態讀取 25 種發光配色 (使用 CSS 變數)
                    el.style.borderColor = `rgb(var(--${bullet.colorVar}))`;
                    el.style.boxShadow = `inset 0 0 10px rgba(var(--${bullet.colorVar}), 0.5)`;
                    
                    // 中間顯示家長大頭貼縮圖
                    const parent = STATE.data.users.find(u => u.id === bullet.creatorId);
                    if (parent) {
                        
                        el.innerHTML = `<img src="${getImg(parent.avatarId || parent.avatarBase64)}" style="width:70%;height:70%;border-radius:50%;object-fit:cover;">`;
                        
                    }

                    // 筆電端 (滑鼠)：Click-to-Aim 點擊選取機制
                    if (STATE.ui.currentDevice === 'mouse') {
                        el.onclick = (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.bullet-item').forEach(n => n.classList.remove('selected-for-aim'));
                            if (STATE.ui.selectedBulletId === bullet.id) {
                                STATE.ui.selectedBulletId = null; // 取消選取
                            } else {
                                STATE.ui.selectedBulletId = bullet.id;
                                el.classList.add('selected-for-aim');
                            }
                        };
                    } 
                    // 觸控端：拖曳 (Drag & Drop)
                    else {
                        el.addEventListener('touchstart', (e) => this.handleDragStart(e, bullet, el), {passive: false});
                    }

                    grid.appendChild(el);
                });
            },

            handleDragStart: function(e, bullet, element) {
                if (STATE.isReadonly) return;
                STATE.ui.isDragging = true;
                const touch = e.touches[0];
                
                // 建立漂浮跟隨子彈
                const floating = document.getElementById('floating-bullet');
                floating.innerHTML = element.innerHTML;
                floating.style.background = element.style.background;
                floating.style.border = element.style.border;
                floating.style.display = 'block';
                floating.style.left = touch.clientX + 'px';
                floating.style.top = touch.clientY + 'px';

                const moveHandler = (moveEvent) => {
                    moveEvent.preventDefault();
                    const moveTouch = moveEvent.touches[0];
                    floating.style.left = moveTouch.clientX + 'px';
                    floating.style.top = moveTouch.clientY + 'px';
                };

                const endHandler = (endEvent) => {
                    STATE.ui.isDragging = false;
                    floating.style.display = 'none';
                    document.removeEventListener('touchmove', moveHandler);
                    document.removeEventListener('touchend', endHandler);

                    const endTouch = endEvent.changedTouches[0];
                    // 偵測放開位置下方是否為有效格子
                    const targetEl = document.elementFromPoint(endTouch.clientX, endTouch.clientY);
                    if (targetEl && targetEl.closest('.grid-cell')) {
                        const cell = targetEl.closest('.grid-cell');
                        CardManager.executeHit(cell.dataset.cardId, parseInt(cell.dataset.x), parseInt(cell.dataset.y), bullet.id);
                    }
                };

                document.addEventListener('touchmove', moveHandler, {passive: false});
                document.addEventListener('touchend', endHandler);
            }
        };

        // ==========================================
        // 15. 3D 雙軸卡片舞台與刮刮樂打擊引擎 (CardManager)
        // ==========================================
        const CardManager = {
            filteredCards: [],
            lastHitCell: null, // 記錄塗抹模式防重複擊發
            
            renderStage: function() {
                const track = document.getElementById('card-track');
                track.innerHTML = '';
                
                // 隔離機制：只顯示當前受益孩子的卡片
                this.filteredCards = STATE.data.cards.filter(c => c.beneficiaryId === STATE.currentBeneficiary);
                
                if (this.filteredCards.length === 0) {
                    track.innerHTML = '<div style="color:var(--text-sub); text-align:center;">目前沒有專屬的集點卡<br>請家長建立一張</div>';
                    return;
                }

                if (STATE.ui.activeCardIndex >= this.filteredCards.length) STATE.ui.activeCardIndex = Math.max(0, this.filteredCards.length - 1);

                this.filteredCards.forEach((card, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper';
                    
                    if (index === STATE.ui.activeCardIndex) wrapper.classList.add('active');
                    else if (index < STATE.ui.activeCardIndex) wrapper.classList.add('prev');
                    else wrapper.classList.add('next');

                    // 完美 1x1 正方格機制：利用 aspect-ratio 動態限制卡片外框比例
                    const aspectStr = `${card.cols} / ${card.rows}`;
                    const recallBtnHtml = STATE.isGodMode ? `<button class="btn btn-danger" style="padding:8px 16px; font-size:14px; border-radius:20px;" onclick="CardManager.recallBullets('${card.id}')">🔄 收回整張點數</button>` : '';

                    wrapper.innerHTML = `
                        <div class="card-header-title">${card.cardName || '專屬禮物卡'} (<span id="progress-${card.id}">0%</span>)</div>
                        <div class="card-inner" style="aspect-ratio: ${aspectStr};">
                            <img src="${getImg(card.imgId || card.imgBase64)}" class="toy-image" id="toy-img-${card.id}">
                            <div class="grid-container" id="grid-${card.id}" style="grid-template-columns: repeat(${card.cols}, 1fr); grid-template-rows: repeat(${card.rows}, 1fr);"></div>
                        </div>
                        <div class="card-footer-action">${recallBtnHtml}</div>
                    `;
                    track.appendChild(wrapper);

                    // 渲染該卡片的網格與狀態
                    this.renderGrids(card);
                    this.updateProgress(card);
                });

                this.bindGestures();
                this.renderAuditWall();
            },

            renderGrids: function(card) {
                const container = document.getElementById(`grid-${card.id}`);
                container.innerHTML = '';
                
                card.grids.forEach(gridData => {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.cardId = card.id;
                    cell.dataset.x = gridData.x;
                    cell.dataset.y = gridData.y;
                    
                    // 還原狀態：已半擊穿或全擊穿
                    if (gridData.status === 0.5) cell.classList.add('hit-half');
                    if (gridData.status === 1.0) {
                        cell.classList.add('hit-full');
                        document.getElementById(`toy-img-${card.id}`).classList.add('sharp'); // 局部銳化
                    }

                    // 如果有子彈紀錄，顯示大頭貼印章
                    if (gridData.bulletId) {
                        const bullet = STATE.data.bullets.find(b => b.id === gridData.bulletId) || STATE.data.logs.find(l => l.bulletId === gridData.bulletId)?.bulletCache;
                        if (bullet) {
                            const parent = STATE.data.users.find(u => u.id === bullet.creatorId);
                            if (parent) {
                                cell.innerHTML = `<img src="${getImg(parent.avatarId || parent.avatarBase64)}" class="bullet-stamp">`;
                            }
                        }
                    }

                    // 筆電端 (滑鼠)：Click-to-Aim 點擊格子的事件
                    if (STATE.ui.currentDevice === 'mouse') {
                        cell.onclick = (e) => {
                            if (STATE.isReadonly || STATE.isGodMode) return;
                            if (STATE.ui.selectedBulletId) {
                                this.executeHit(card.id, gridData.x, gridData.y, STATE.ui.selectedBulletId);
                                STATE.ui.selectedBulletId = null; // 擊發後重置選取狀態
                                document.querySelectorAll('.bullet-item').forEach(n => n.classList.remove('selected-for-aim'));
                            }
                        };
                    }
                    container.appendChild(cell);
                });
            },

            updateProgress: function(card) {
                const progressEl = document.getElementById(`progress-${card.id}`);
                if (!progressEl) return;
                const total = card.grids.length;
                let current = 0;
                card.grids.forEach(g => { if(g.status === 1) current += 1; else if(g.status === 0.5) current += 0.5; });
                const percent = Math.floor((current / total) * 100);
                progressEl.innerText = `${percent}%`;
            },

            /**
             * 核心擊發引擎與特效 (支援效能熔斷降級)
             */
            executeHit: function(cardId, x, y, bulletId) {
                const card = STATE.data.cards.find(c => c.id === cardId);
                const bulletIndex = STATE.data.bullets.findIndex(b => b.id === bulletId);
                if (!card || bulletIndex === -1) return;

                const bullet = STATE.data.bullets[bulletIndex];
                const grid = card.grids.find(g => g.x === x && g.y === y);
                
                // 檢查是否已全擊穿
                if (grid.status === 1.0) return showToast("此區域已完全解鎖");
                
                // 更新狀態 (0 -> 0.5, 或 0.5 -> 1.0)
                let newStatus = Math.min(1.0, grid.status + bullet.size);
                grid.status = newStatus;
                grid.bulletId = bullet.id;
                
                // 寫入離線日誌與稽核紀錄
                const logEntry = {
                    id: generateUUID(), cardId: card.id, bulletId: bullet.id,
                    bulletCache: bullet, x: x, y: y, hitLevel: newStatus,
                    timestamp: Date.now()
                };
                STATE.data.logs.push(logEntry);
                
                if (STATE.cloud.isOffline) {
                    STATE.cloud.dirtyQueue.push({ action: 'hit', ...logEntry });
                }

                // 從背包移除該子彈
                STATE.data.bullets.splice(bulletIndex, 1);
                
                // UI 視覺特效更新
                const cell = document.querySelector(`.grid-cell[data-card-id="${cardId}"][data-x="${x}"][data-y="${y}"]`);
                if (cell) {
                    if (newStatus === 0.5) cell.classList.add('hit-half');
                    if (newStatus === 1.0) cell.classList.add('hit-full');
                    
                    const parent = STATE.data.users.find(u => u.id === bullet.creatorId);
                    if (parent) cell.innerHTML = `<img src="${getImg(parent.avatarId || parent.avatarBase64)}" class="bullet-stamp">`;
                    
                    this.triggerParticles(cell, bullet.colorVar, newStatus === 1.0);
                }

                BackpackManager.render();
                this.updateProgress(card);
                
                // 檢查是否大滿貫
                if (card.grids.every(g => g.status === 1.0)) {
                    setTimeout(() => this.triggerGrandSlam(card), 1000);
                }

                // 儲存進度 (防作弊機制包含在內)
                CoreManager.saveLocal();
            },

            triggerParticles: function(cellEl, colorVar, isFullHit) {
                // 效能偵測降級
                const t0 = performance.now();
                const fps = 1000 / (t0 - STATE.perf.lastFrameTime);
                STATE.perf.lastFrameTime = t0;
                if (fps < 30) STATE.perf.isLowPerf = true;

                const particleCount = STATE.perf.isLowPerf ? 15 : (isFullHit ? 50 : 30);

                    const velocity = (Math.random() * 80) + 20;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity;
                    
                    p.style.setProperty('--tx', `${tx}px`);
                    p.style.setProperty('--ty', `${ty}px`);

                // 清理 DOM
                setTimeout(() => container.remove(), 1000);
            },

            /**
             * 支援塗抹模式與原本的雙軸滑動
             */
            bindGestures: function() {
                const track = document.getElementById('card-track');
                const stage = document.getElementById('stage-container');
                let startX = 0, startY = 0;
                let isLockX = false, isLockY = false, hasLocked = false;
                
                stage.classList.remove('show-audit');
                STATE.ui.isAuditWallOpen = false;

                if (STATE.ui.currentDevice === 'mouse') {
                    stage.onwheel = (e) => {
                        if (STATE.ui.isAuditWallOpen) return;
                        e.preventDefault();
                        if (e.deltaY > 0) this.switchCard('next');
                        else if (e.deltaY < 0) this.switchCard('prev');
                    };
                }

                track.ontouchstart = (e) => {
                    if(STATE.ui.isSmearMode) { e.preventDefault(); this.lastHitCell = null; this.handleSmear(e); return; }
                    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                    isLockX = false; isLockY = false; hasLocked = false;
                    track.style.transition = 'none';
                };

                track.ontouchmove = (e) => {
                    if(STATE.ui.isSmearMode) { e.preventDefault(); this.handleSmear(e); return; }
                    if (!startX || !startY) return;
                    let dx = e.touches[0].clientX - startX; let dy = e.touches[0].clientY - startY;
                    if (!hasLocked && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                        let angle = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
                        if (angle < 30 || angle > 150) isLockX = true;
                        else if (angle > 60 && angle < 120) isLockY = true;
                        hasLocked = true;
                    }
                    if (hasLocked) {
                        if (isLockX) {
                            e.preventDefault();
                            if ((STATE.ui.activeCardIndex === 0 && dx > 0) || (STATE.ui.activeCardIndex === this.filteredCards.length - 1 && dx < 0)) dx = dx * 0.25;
                            const activeCard = track.querySelector('.card-wrapper.active');
                            if (activeCard) activeCard.style.transform = `translateX(${dx}px) scale(1)`;
                        }
                        if (isLockY && dy < -30 && !STATE.ui.isAuditWallOpen) {
                            e.preventDefault(); stage.classList.add('show-audit'); STATE.ui.isAuditWallOpen = true;
                        }
                    }
                };

                track.ontouchend = (e) => {
                    if(STATE.ui.isSmearMode) { e.preventDefault(); document.getElementById('smear-tooltip').style.display = 'none'; return; }
                    if (!hasLocked) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    track.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                    if (isLockX) {
                        Array.from(track.children).forEach(c => c.style.transform = '');
                        // 降低觸發門檻從 80px 降到 30px，讓輕輕滑動就能切換卡片
                        if (Math.abs(dx) > 30) dx > 0 ? this.switchCard('prev') : this.switchCard('next');
                    }
                    startX = 0; startY = 0;
                };

                const wallHeader = document.getElementById('audit-header');
                let wallStartY = 0;
                wallHeader.ontouchstart = (e) => wallStartY = e.touches[0].clientY;
                wallHeader.ontouchmove = (e) => {
                    if (e.touches[0].clientY - wallStartY > 50) {
                        stage.classList.remove('show-audit'); STATE.ui.isAuditWallOpen = false;
                    }
                };
            },

            /**
             * 塗抹連發引擎
             */
            handleSmear: function(e) {
                if(STATE.isReadonly) return;
                const touch = e.touches[0];
                const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                if (targetEl && targetEl.closest('.grid-cell')) {
                    const cell = targetEl.closest('.grid-cell');
                    if (cell !== this.lastHitCell) {
                        this.lastHitCell = cell;
                        const cx = parseInt(cell.dataset.x); const cy = parseInt(cell.dataset.y); const cardId = cell.dataset.cardId;
                        const card = STATE.data.cards.find(c => c.id === cardId);
                        const grid = card.grids.find(g => g.x === cx && g.y === cy);
                        
                        if (grid && grid.status < 1.0) {
                            const myBullets = STATE.data.bullets.filter(b => b.ownerId === STATE.currentBeneficiary);
                            if (myBullets.length > 0) {
                                const bullet = myBullets[0]; // 自動取用第一顆子彈
                                
                                // 更新浮動提示氣泡
                                const tooltip = document.getElementById('smear-tooltip');
                                tooltip.innerText = `🎁 獎勵: ${bullet.reason}`;
                                tooltip.style.left = Math.min(touch.clientX + 15, window.innerWidth - 150) + 'px';
                                tooltip.style.top = (touch.clientY - 45) + 'px';
                                tooltip.style.display = 'block';
                                
                                this.executeHit(cardId, cx, cy, bullet.id);
                            }
                        }
                    }
                }
            },

            /**
             * 一鍵收回整張卡的點數到背包
             */
            recallBullets: function(cardId) {
                if(!confirm("確定要收回這張卡片上的所有點數到背包嗎？")) return;
                const card = STATE.data.cards.find(c => c.id === cardId);
                if(!card) return;

                let hasRecalled = false;
                card.grids.forEach(g => {
                    if (g.status > 0 && g.bulletId) {
                        const log = STATE.data.logs.find(l => l.bulletId === g.bulletId);
                        if (log && log.bulletCache) {
                            const existing = STATE.data.bullets.find(b => b.id === log.bulletCache.id);
                            if(!existing) STATE.data.bullets.push({...log.bulletCache});
                            hasRecalled = true;
                        }
                        g.status = 0; g.bulletId = null;
                    }
                });

                if (!hasRecalled) return showToast("這張卡片上沒有可以收回的點數");

                STATE.data.logs = STATE.data.logs.filter(l => l.cardId !== cardId);
                if(card.status === 'archived') card.status = 'active';

                CoreManager.saveLocal();
                this.renderStage();
                BackpackManager.render();
                showToast("點數已全數收回背包！", false);
            },

                if (dir === 'next' && STATE.ui.activeCardIndex < this.filteredCards.length - 1) {
                    STATE.ui.activeCardIndex++;

                    STATE.ui.activeCardIndex--;
                }
                this.renderStage();
            },

                // 簡化版 DOM 回收機制：若超過 20 筆，僅渲染可視範圍，底部補上 Placeholder
                const maxRender = 20;

            startConfetti: function() {
                const canvas = document.getElementById('confetti-container');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                for(let i=0; i<100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height - canvas.height,
                        r: Math.random() * 6 + 2,
                        dx: Math.random() * 4 - 2,
                        dy: Math.random() * 5 + 2,
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`
                    });
                }

                function render() {
                    if (!document.getElementById('grand-slam-overlay').classList.contains('active')) return;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                        p.x += p.dx;
                        p.y += p.dy;
                        if (p.y > canvas.height) p.y = 0;
                    });
                    requestAnimationFrame(render);
                }
                render();
            }
        };

        // ==========================================
        // 16. 硬體雙相機引擎 (CameraEngine / 去識別化)
        // ==========================================
        const CameraEngine = {
            stream: null,
            facingMode: 'user', // 預設前置鏡頭

            open: async function() {
                const modal = document.getElementById('camera-modal');
                const video = document.getElementById('camera-feed');
                const placeholder = document.getElementById('placeholder-generator');
                
                modal.classList.add('open');
                placeholder.style.display = 'none';

                try {
                    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                    
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: this.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    
                    video.srcObject = this.stream;
                    // 前置鏡頭開啟水平鏡像
                    if (this.facingMode === 'user') video.classList.add('mirror');
                    else video.classList.remove('mirror');
                    
                } catch (err) {
                    console.error("相機存取失敗", err);
                    // 占位符自癒鏈
                    placeholder.style.display = 'flex';
                    placeholder.innerText = "相機無授權/故障";
                }
            },

            close: function() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                document.getElementById('camera-modal').classList.remove('open');
            },

            flip: function() {
                this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
                this.open();
            },

            /**
             * 拍照並執行壓縮與 EXIF 隱私抹除
             * targetType: 'avatar' (128px) 或 'card' (480px)
             */
            capture: function(targetType) {
                return new Promise((resolve) => {
                    const video = document.getElementById('camera-feed');
                    const flash = document.getElementById('virtual-flash');
                    const placeholder = document.getElementById('placeholder-generator');
                    
                    // 虛擬補光燈特效
                    flash.classList.add('flash');
                    if(navigator.vibrate) navigator.vibrate(50);
                    setTimeout(() => flash.classList.remove('flash'), 100);

                    if (placeholder.style.display === 'flex') {
                        // 回傳預設圖 (SVG Base64)
                        this.close();
                        resolve("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjgiIGhlaWdodD0iMTI4Ij48cmVjdCB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgZmlsbD0iIzMzNDE1NSIvPjx0ZXh0IHg9IjY0IiB5PSI3NCIgZm9udC1zaXplPSI0MCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+PzwvdGV4dD48L3N2Zz4=");
                        return;
                    }

                    // 完美裁切不變形演算法 (1:1 大頭貼 vs 4:3 卡片)
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let w = video.videoWidth;
                    let h = video.videoHeight;

                    // 防搶拍：若相機硬體還沒對焦傳回尺寸，拒絕拍照防破圖崩潰
                    if (w === 0 || h === 0) {
                        showToast("相機尚未準備完成，請稍候一秒再拍！", true);
                        return resolve(null);
                    }

                    const maxSize = targetType === 'avatar' ? 128 : 480;
                    const quality = targetType === 'avatar' ? 0.7 : 0.8;
                    const targetRatio = targetType === 'avatar' ? 1 : 4/3;
                    
                    
                    let sx = 0, sy = 0, sWidth = w, sHeight = h;

                    if (w / h > targetRatio) {
                        sWidth = h * targetRatio;
                        sx = (w - sWidth) / 2; // 裁切左右保留中間
                    } else {
                        sHeight = w / targetRatio;
                        sy = (h - sHeight) / 2; // 裁切上下保留中間
                    }
                    
                    canvas.width = maxSize;
                    canvas.height = maxSize / targetRatio;

                    if (this.facingMode === 'user') {
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                    }
                    // 將擷取的範圍繪製滿版至 canvas，保證絕無白邊且不變形
                    ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                    
                    const base64 = canvas.toDataURL('image/jpeg', quality);
                    this.close();
                    resolve(base64);
                });
            }
        };

                            <div class="modal-title">🎯 發放點數 (給彈藥)</div>
                            <button class="modal-close" onclick="document.getElementById('dynamic-modal').classList.remove('open')">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label">發放給哪位孩子</label>
                                <select id="point-child" class="form-input">
                                    ${children.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">點數大小 (火力)</label>
                                <select id="point-size" class="form-input">
                                    <option value="1.0">1.0 點 (大子彈，直接擊碎一格)</option>
                                    <option value="0.5">0.5 點 (小子彈，需兩發才能擊碎)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">選擇點數顏色 (25種光影)</label>
                                <div class="color-picker-grid" id="color-grid">
                                    ${Array.from({length:25}, (_, i) => `<div class="color-swatch ${i===2?'selected':''}" data-color="c${i+1}" style="background:rgb(var(--c${i+1})); box-shadow: 0 0 10px rgba(var(--c${i+1}), 0.8);"></div>`).join('')}
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">好表現事由 (選填)</label>
                                <input type="text" id="point-reason" class="form-input" placeholder="例如: 自動自發寫作業">
                            </div>
                            <button class="btn btn-primary" id="btn-send-point" style="width:100%;">發送到孩子背包</button>
                        </div>
                    </div>
                `;
                
                document.querySelectorAll('.color-swatch').forEach(el => {
                    el.onclick = (e) => {
                        document.querySelectorAll('.color-swatch').forEach(n => n.classList.remove('selected'));
                        e.target.classList.add('selected');
                    };
                });

                document.getElementById('btn-send-point').onclick = () => {
                    const childId = document.getElementById('point-child').value;
                    const size = parseFloat(document.getElementById('point-size').value);
                    const reason = document.getElementById('point-reason').value.trim() || '好表現獎勵';
                    const colorVar = document.querySelector('.color-swatch.selected').dataset.color;

                    let creatorId = STATE.currentUser;
                    if(creatorId === 'admin') creatorId = STATE.data.users.find(u=>u.role==='parent').id;

                    const newBullet = {
                        id: generateUUID(), ownerId: childId, creatorId: creatorId,
                        size: size, colorVar: colorVar, reason: reason, createdAt: Date.now()
                    };

                    STATE.data.bullets.push(newBullet);
                    CoreManager.saveLocal();
                    document.getElementById('dynamic-modal').classList.remove('open');
                    showToast("點數已成功發送！", false);
                    if(STATE.currentBeneficiary === childId) BackpackManager.render();
                };
            },

            openAddCard: function() {
                this.tempToyImg = null;
                const children = STATE.data.users.filter(u => u.role === 'child');
                const parents = STATE.data.users.filter(u => u.role === 'parent');
                
                if (children.length === 0) return showToast("請先點擊 ⚙️ 設定新增「孩子」帳號！");
                if (parents.length === 0) return showToast("請先點擊 ⚙️ 設定新增「家長」帳號！");

                const modal = document.getElementById('dynamic-modal');
                modal.innerHTML = `
                    <div class="modal-content">
                        <div class="modal-header">
                            <div class="modal-title">➕ 建立新集點卡</div>
                            <button class="modal-close" onclick="document.getElementById('dynamic-modal').classList.remove('open')">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div style="text-align:center;">
                                <img id="preview-toy" style="width:100%; aspect-ratio:4/3; object-fit:cover; display:none; margin-bottom:10px; border-radius:12px; border: 2px solid rgba(255,255,255,0.2);">
                                <button class="btn btn-outline" id="btn-take-toy" style="width:100%; margin-bottom:15px; padding: 10px;">📸 拍攝禮物照片</button>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">選擇專屬孩子</label>
                                <select id="card-child" class="form-input">
                                    ${children.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">禮物卡名稱</label>
                                <input type="text" id="card-name" class="form-input" placeholder="例如: 迪士尼樂園門票、Switch 遊戲">
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="display:flex; justify-content:space-between;">行數 (左右長度) <strong id="col-val" style="color:var(--accent-gold);">4</strong></label>
                                <input type="range" id="card-cols" class="sync-slider" min="3" max="10" value="4" oninput="document.getElementById('col-val').innerText=this.value">
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="display:flex; justify-content:space-between;">列數 (上下高度) <strong id="row-val" style="color:var(--accent-gold);">3</strong></label>
                                <input type="range" id="card-rows" class="sync-slider" min="3" max="10" value="3" oninput="document.getElementById('row-val').innerText=this.value">
                            </div>
                            <button class="btn btn-success" id="btn-save-card" style="width:100%;">發行集點卡</button>
                        </div>
                    </div>
                `;
                modal.classList.add('open');

                // 綁定硬體相機拍攝玩具
                document.getElementById('btn-take-toy').onclick = () => {
                    CameraEngine.open();
                    document.getElementById('btn-shutter').onclick = async () => {
                        const base64 = await CameraEngine.capture('card');
                        if(!base64) return;
                        this.tempToyImg = base64;
                        const preview = document.getElementById('preview-toy');
                        preview.src = base64;
                        preview.style.display = 'block';
                    };
                };

                document.getElementById('btn-save-card').onclick = async () => {
                    const childId = document.getElementById('card-child').value;
                    const cardName = document.getElementById('card-name').value.trim() || '神秘禮物';
                    const cols = parseInt(document.getElementById('card-cols').value);
                    const rows = parseInt(document.getElementById('card-rows').value);

                    if(!this.tempToyImg) return showToast("請務必拍攝一張禮物照片！");

                    // 秒存本機：產生 Local UUID
                    const localId = 'local_img_' + generateUUID();
                    await LocalDB.save(localId, this.tempToyImg);
                    STATE.images[localId] = this.tempToyImg;

                    const grids = [];
                    for(let y=0; y<rows; y++){
                        for(let x=0; x<cols; x++){
                            grids.push({ x: x, y: y, status: 0, bulletId: null });
                        }
                    }

                    let creatorId = STATE.currentUser;
                    if(creatorId === 'admin') creatorId = parents[0].id;

                    const newCard = {
                        id: generateUUID(), beneficiaryId: childId, creatorId: creatorId,
                        imgId: localId, cardName: cardName,
                        cols: cols, rows: rows, grids: grids, status: 'active'
                    };
                    
                    STATE.data.cards.unshift(newCard);
                    STATE.ui.activeCardIndex = 0; 
                    
                    CoreManager.saveLocal(); // 只呼叫秒存
                    document.getElementById('dynamic-modal').classList.remove('open');
                    showToast("集點卡建立成功，已存於本機！", false);
                    CoreManager.switchBeneficiary(childId);
                };
                
            }
        };
        // ==========================================
        // 17. 系統啟動與高度動態校正 (DOM Ready)
        // ==========================================
        
        
        function setDynamicViewport() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        window.addEventListener('resize', setDynamicViewport);
        window.addEventListener('orientationchange', () => setTimeout(setDynamicViewport, 100));

        document.addEventListener('DOMContentLoaded', () => {
            setDynamicViewport();
            CoreManager.init();
            
            // 系統全域錯誤捕捉，防止畫面死當並顯示原因
            window.onerror = function(msg, url, lineNo, columnNo, error) {
                console.error('全域錯誤:', msg, error);
                showToast(`程式異常: ${msg}`, true);
                return false;
            };
            window.addEventListener('unhandledrejection', function(e) {
                console.error('Promise 錯誤:', e.reason);
                showToast(`背景連線異常: ${extractErrorMsg(e.reason)}`, true);
            });
            
            console.log("數位集點系統 V13 核心引擎已啟動...");
        });
    </script>
    EEEEEEEEEEEEE
</body>
</html>
