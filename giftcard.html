            exportCard: function(cardId) {
                showToast("正在為您繪製精美報表，請稍候...", false);
                const card = STATE.data.cards.find(c => c.id === cardId); if(!card) return;
                const child = STATE.data.users.find(u => u.id === card.beneficiaryId);
                const parent = STATE.data.users.find(u => u.id === card.creatorId);
                
                const canvas = document.createElement('canvas');
                canvas.width = 1080; canvas.height = 1920;
                const ctx = canvas.getContext('2d');
                
                const bodyStyle = getComputedStyle(document.body);
                const bgColor = bodyStyle.getPropertyValue('--bg-dark').trim() || '#0f172a';
                const textMain = bodyStyle.getPropertyValue('--text-main').trim() || '#f8fafc';
                const textSub = bodyStyle.getPropertyValue('--text-sub').trim() || '#94a3b8';
                const accentColor = bodyStyle.getPropertyValue('--accent-main').trim() || '#10b981';
                
                ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 1080, 1920);
                
                ctx.fillStyle = textMain; ctx.font = 'bold 80px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(card.cardName, 540, 160);
                ctx.font = 'bold 36px sans-serif'; 
                ctx.fillStyle = bodyStyle.getPropertyValue('--accent-gold').trim() || '#fbbf24';
                ctx.fillText(`獎勵對象: ${child ? child.name : '未知'}   |   提供者: ${parent ? parent.name : '未知'}`, 540, 240);

                const cols = card.cols; const rows = card.rows;
                const gridW = 900; const gridH = 1350; 
                const startX = 90; const startY = 320;
                const cellW = gridW / cols; const cellH = gridH / rows;

                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    ctx.globalAlpha = 0.2; 
                    ctx.drawImage(img, startX, startY, gridW, gridH);
                    ctx.globalAlpha = 1.0;
                    
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 3;
                    
                    let currentHit = 0;
                    
                    for(let y=0; y<rows; y++){
                        for(let x=0; x<cols; x++){
                            const px = startX + x*cellW; const py = startY + y*cellH;
                            ctx.strokeRect(px, py, cellW, cellH);
                            
                            const g = card.grids.find(grid => grid.x === x && grid.y === y);
                            if (g && g.status > 0) {
                                currentHit += g.status;
                                if (g.bulletIds && g.bulletIds.length > 0) {
                                    const lastBId = g.bulletIds[g.bulletIds.length - 1];
                                    const lastLog = STATE.data.logs.find(l => l.bulletId === lastBId);
                                    const bCache = lastLog ? lastLog.bulletCache : STATE.data.bullets.find(b=>b.id===lastBId);
                                    
                                    if(bCache) {
                                        const d = new Date(bCache.createdAt || Date.now());
                                        const dStr = `${d.getMonth()+1}/${d.getDate()}`;
                                        
                                        ctx.textAlign = 'center';
                                        ctx.fillStyle = accentColor; 
                                        ctx.font = 'bold 32px sans-serif';
                                        ctx.fillText(dStr, px + cellW/2, py + cellH/2 - 10);
                                        
                                        ctx.fillStyle = textMain; 
                                        
                                        let shortReason = bCache.reason;
                                        let fs = 28;
                                        ctx.font = `${fs}px sans-serif`;
                                        while(ctx.measureText(shortReason).width > cellW - 10 && fs > 12) {
                                            fs--;
                                            ctx.font = `${fs}px sans-serif`;
                                        }
                                        ctx.fillText(shortReason, px + cellW/2, py + cellH/2 + 35);
                                    }
                                }
                            }
                        }
                    }
                    
                    ctx.fillStyle = textSub; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
                    const now = new Date();
                    const todayStr = `- ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 -`;
                    ctx.fillText(todayStr, 540, 1780);

                    const totalGrids = cols * rows;
                    const isAllFull = currentHit >= totalGrids;
                    let bottomText = '';

                    if (isAllFull) {
                        const quotes = [ "每一步累積的星芒，終於在此刻匯聚成耀眼的光芒", "你用恆心，在時間的畫布上填滿了最美麗的色彩", "點點滴滴的努力，化作春雨灌溉出今日豐收的果實", "那些堅持的日子，都在這張卡片上開出了燦爛的花朵", "每一格辛勤的足跡，都引領你走向期待已久的寶藏", "微小的光點，在你的手掌心中凝聚成一條璀璨的星河", "你用專注與耐心，為自己編織了一件寫滿榮譽的羽翼", "歲月不負努力，每一顆點數都是你成長路上的珍珠", "沿途默默耕耘的風景，在此刻收穫了最甜美的回憶", "恭喜你用意志的畫筆，為這段旅程畫下完美的句點" ];
                        bottomText = `- ${quotes[Math.floor(Math.random()*quotes.length)]} -`;
                    } else {
                        let diff = parseFloat((totalGrids - currentHit).toFixed(1));
                        bottomText = `- 再接再厲，還差 ${diff} 點就可以得到 ${card.cardName} -`;
                    }
                    ctx.fillText(bottomText, 540, 1830);

                    const filename = `${child ? child.name : '孩子'}_${card.cardName}_集點報表.png`;
                    const shareFallback = () => {
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    };

                    canvas.toBlob(blob => {
                        const file = new File([blob], filename, { type: 'image/png' });
                        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                title: '獎品集點卡',
                                text: '來看看我的集點進度！',
                                files: [file]
                            }).catch(() => shareFallback());
                        } else {
                            shareFallback();
                        }
                    });
                };
                img.src = getImg(card.imgId || card.imgBase64);
            },

            handleRestoreFlow: async function() {
                let debugStep = "初始化載入流程";
                let appendLog = (msg) => {
                    const debugTextarea = document.getElementById('debug-body');
                    if(debugTextarea) {
                        debugTextarea.value += msg + "\n";
                        debugTextarea.scrollTop = debugTextarea.scrollHeight;
                    }
                };

                try {
                    document.getElementById('dynamic-modal').classList.remove('open');
                    UIManager.updateSyncUI('syncing', '準備載入中...');
                    appendLog(`\n--- 開始手動載入雲端進度 [${new Date().toLocaleString()}] ---`);

                    debugStep = "Google 授權與選擇資料夾";
                    await new Promise((resolve) => CloudManager.authorize(() => resolve()));
                    const folder = await DriveUI.showSelector(); STATE.cloud.folderId = folder.id;
                    appendLog(`[成功] 已選擇資料夾: ${folder.name}`);

                    debugStep = "搜尋雲端存檔";
                    const q = encodeURIComponent(`parents in '${folder.id}' and mimeType='application/json' and trashed=false`);
                    const res = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=1`);
                    const data = await res.json();
                    if (!data.files || data.files.length === 0) throw new Error("無備份存檔，請確認資料夾內是否有備份檔。");
                    STATE.cloud.fileId = data.files[0].id;
                    appendLog(`[成功] 找到最新存檔: ${STATE.cloud.fileId}`);

                    debugStep = "密碼鎖驗證";
                    const pwd = await PinLock.open("解密備份存檔", "請輸入當初設定的數字密碼");
                    if (!pwd) throw new Error("使用者取消密碼輸入");
                    appendLog(`[成功] 已取得解密金鑰`);

                    debugStep = "下載與解密資料";
                    const fileRes = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files/${STATE.cloud.fileId}?alt=media`);
                    const encryptedStr = await fileRes.text();
                    const decryptedStr = await CryptoEngine.decrypt(encryptedStr, pwd);
                    localStorage.setItem('sys_pin_cache', pwd);

                    debugStep = "解析 JSON (智慧相容新舊版)";
                    let parsedCloudData = null;
                    if (decryptedStr.trim().startsWith('{')) {
                        parsedCloudData = JSON.parse(decryptedStr);
                        appendLog(`[解析] 使用新版無壓縮格式讀取成功。`);
                    } else {
                        const decompressed = DataCompressor.decompress(decryptedStr);
                        if (!decompressed) throw new Error("舊版解壓縮失敗，檔案可能損毀");
                        parsedCloudData = JSON.parse(decompressed);
                        appendLog(`[解析] 使用舊版壓縮格式讀取成功。`);
                    }

                    debugStep = "合併並寫入記憶體";
                    STATE.data = SyncEngine.mergeCloudWithLocal(parsedCloudData);
                    STATE.cloud.lastSyncTime = new Date(data.files[0].modifiedTime).getTime();

                    debugStep = "補齊遺失的照片";
                    await LocalDB.init(); STATE.images = {};
                    const allImgIds = new Set();
                    STATE.data.users.forEach(u => { if(u.avatarId) allImgIds.add(u.avatarId); });
                    STATE.data.cards.forEach(c => { if(c.imgId) allImgIds.add(c.imgId); });
                    STATE.data.bullets.forEach(b => { if(b.imgId) allImgIds.add(b.imgId); });
                    STATE.data.logs.forEach(l => { if(l.bulletCache && l.bulletCache.imgId) allImgIds.add(l.bulletCache.imgId); });

                    let dlCount = 0;
                    for (let id of allImgIds) {
                        let b64 = await LocalDB.get(id);
                        if (!b64 && !id.startsWith('local_img_')) { 
                            try {
                                b64 = await CloudManager.downloadImage(id);
                                if(b64) { await LocalDB.save(id, b64); dlCount++; }
                            } catch(e){}
                        }
                        if(b64) STATE.images[id] = b64;
                    }
                    appendLog(`[照片載入] 本機快取補齊，從雲端下載了 ${dlCount} 張遺失照片。`);

                    debugStep = "重繪畫面與完成";
                    this.persistToLocal();
                    this.enterReadonlyMode();
                    UIManager.updateSyncUI('success');
                    showToast("載入成功！", false);
                    appendLog(`[完成] 雲端進度已完美還原。`);

                } catch (e) {
                    if (e.message === "取消選擇" || e.message === "使用者取消密碼輸入") {
                        showToast("已取消操作", false);
                        if(!STATE.data.users || STATE.data.users.length === 0) CoreManager.init();
                        return;
                    }
                    const errMsg = e.message || "無訊息"; const errStack = e.stack || "無 Stack";
                    const diag = `\n❌ ==== 載入崩潰報告 ====\n[發生時間] ${new Date().toLocaleString()}\n[故障斷點] ${debugStep}\n[錯誤訊息] ${errMsg}\n[程式追蹤]\n${errStack}\n========================`;
                    appendLog(diag);
                    logDebug("Restore Crash", diag);
                    UIManager.updateSyncUI('error', '載入失敗');
                    showToast("載入失敗，已自動開啟偵錯面板", true);
                    setTimeout(() => document.getElementById('debug-console').classList.add('active'), 1000);
                    if(!STATE.data.users || STATE.data.users.length === 0) setTimeout(() => CoreManager.init(), 2000);
                }
            },
            
            enterReadonlyMode: function() {
                STATE.isGodMode = false; STATE.isReadonly = true; STATE.currentUser = null;
                const children = STATE.data.users.filter(u => u.role === 'child');
                
                if (children.length > 0) {
                    if (!STATE.currentBeneficiary || !children.find(c => c.id === STATE.currentBeneficiary)) {
                        STATE.currentBeneficiary = children[0].id;
                    }
                } else {
                    STATE.currentBeneficiary = null; 
                }
                
                this.refreshTheme();

                document.getElementById('child-toolbar').style.display = 'flex';
                document.getElementById('parent-toolbar').style.display = 'none';
                
                UIManager.renderProfiles(); 
                UIManager.renderMarquee(); 
                CardManager.renderStage(); 
                if(typeof BackpackManager !== 'undefined') BackpackManager.render();
                
                if (children.length === 0) {
                    showToast("請長按頭像解鎖家長權限，新增孩童帳號", false);
                } else {
                    showToast('已切換回孩子模式', false);
                }
            },
        
            requestGodMode: async function(parentUser) {
                const pwd = await PinLock.open("家長權限認證", `請輸入密碼解鎖家長模式`);
                if (!pwd) return;
                
                const correctPin = localStorage.getItem('sys_pin_cache');
                if (correctPin && pwd !== correctPin) {
                    showToast("密碼錯誤！", true);
                    PinLock.showError();
                    return;
                }
                
                STATE.isGodMode = true; STATE.isReadonly = false; STATE.currentUser = parentUser.id;
                
                this.refreshTheme();

                document.getElementById('child-toolbar').style.display = 'none';
                document.getElementById('parent-toolbar').style.display = 'flex';
                UIManager.renderProfiles(); 
                CardManager.renderStage();
                showToast("已切換為家長模式", false);
            },

            switchBeneficiary: function(childId) {
                STATE.currentBeneficiary = childId; 
                if (!STATE.isGodMode) {
                    STATE.currentUser = childId; 
                    STATE.isReadonly = false;
                }
                
                this.refreshTheme();
                UIManager.renderProfiles(); CardManager.renderStage(); 
                if(typeof BackpackManager !== 'undefined') BackpackManager.render();
            },
            
            refreshTheme: function() {
                let activeId = STATE.isGodMode ? STATE.currentUser : STATE.currentBeneficiary;
                let activeUser = STATE.data.users.find(u => u.id === activeId);
                if (activeUser && activeUser.theme) document.body.className = `theme-${activeUser.theme}`; else document.body.className = `theme-tech`;
            },
            
            saveLocal: function() { STATE.data.last_update = Date.now(); this.persistToLocal(); },
        
            persistToLocal: function() {
                localStorage.setItem('points_sys_data', JSON.stringify(STATE.data));
                localStorage.setItem('points_sys_cloud', JSON.stringify({ folderId: STATE.cloud.folderId, fileId: STATE.cloud.fileId, lastSyncTime: STATE.cloud.lastSyncTime }));
            },
            
            copyDebugLog: function() {
                const text = document.getElementById('debug-body').value;
                if(navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = document.getElementById('btn-copy-debug');
                        btn.innerHTML = '<svg class="svg-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> 已複製';
                        setTimeout(() => btn.innerHTML = '<svg class="svg-icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> 複製報告', 2000);
                        showToast("偵錯報告已複製到剪貼簿", false);
                    }).catch(() => showToast("複製失敗，請手動全選複製"));
                } else {
                    const textarea = document.getElementById('debug-body');
                    textarea.select();
                    try { document.execCommand('copy'); showToast("偵錯報告已複製", false); } 
                    catch (err) { showToast("複製失敗，請手手動複製"); }
                }
            },

            runDeepDiagnosticsAndSync: async function() {
                const debugTextarea = document.getElementById('debug-body');
                debugTextarea.value = "啟動全域系統診斷...\n";
                document.getElementById('debug-console').classList.add('active');

                let appendLog = (msg) => {
                    debugTextarea.value += msg + "\n";
                    debugTextarea.scrollTop = debugTextarea.scrollHeight;
                };

                appendLog(`==== 系統深度診斷與強制同步報告 ====`);
                appendLog(`[時間] ${new Date().toLocaleString()} (系統名稱: ${SYS_NAME})`);
                appendLog(`[裝置] ${navigator.userAgent}`);

                try {
                    appendLog(`\n[1/4] 檢查並重置 UI 元件...`);
                    document.querySelectorAll('.glass-overlay.active, .modal-overlay.open').forEach(el => {
                        if(el.id !== 'debug-console' && el.id !== 'toast-container') {
                            el.classList.remove('active', 'open');
                            appendLog(`[修復] 強制關閉卡住的圖層: ${el.id}`);
                        }
                    });

                    if (typeof setDynamicViewport === 'function') setDynamicViewport();
                    this.refreshTheme();
                    UIManager.renderProfiles();
                    UIManager.renderMarquee();
                    CardManager.renderStage();
                    if(typeof BackpackManager !== 'undefined') BackpackManager.render();
                    
                    if (STATE.isGodMode) {
                        document.getElementById('child-toolbar').style.display = 'none';
                        document.getElementById('parent-toolbar').style.display = 'flex';
                    } else {
                        document.getElementById('child-toolbar').style.display = 'flex';
                        document.getElementById('parent-toolbar').style.display = 'none';
                    }
                    appendLog(`[成功] UI 元件強制歸位 (模式: ${STATE.isGodMode ? '家長' : '孩子'})`);

                    appendLog(`\n[2/4] 檢查本地資料與照片關聯 (自動救援)...`);
                    appendLog(`- 成員數: ${STATE.data.users?.length || 0}`);
                    appendLog(`- 卡片數: ${STATE.data.cards?.length || 0}`);
                    appendLog(`- 全域背包庫: ${STATE.data.bullets?.length || 0}`);
                    appendLog(`- 歷史牆: ${STATE.data.logs?.length || 0}`);
                    
                    const orphans = STATE.data.bullets.filter(b => !STATE.data.users.find(u => u.id === b.ownerId));
                    if (orphans.length > 0) appendLog(`[警告] 發現 ${orphans.length} 個幽靈點數 (查無擁有者)，可能導致背包顯示異常！`);
                    
                    let gridErrors = 0;
                    STATE.data.cards.forEach(c => {
                        c.grids.forEach(g => {
                            if (g.status < 0) { g.status = 0; gridErrors++; }
                            if (g.bulletIds && g.bulletIds.length > 0 && g.status === 0) { g.bulletIds = []; gridErrors++; }
                        });
                    });
                    if (gridErrors > 0) appendLog(`[修復] 校正了 ${gridErrors} 個異常的格子狀態！`);
                    
                    const allImgIds = new Set();
                    STATE.data.users.forEach(u => { if(u.avatarId) allImgIds.add(u.avatarId); });
                    STATE.data.cards.forEach(c => { if(c.imgId) allImgIds.add(c.imgId); });
                    STATE.data.bullets.forEach(b => { if(b.imgId) allImgIds.add(b.imgId); });
                    STATE.data.logs.forEach(l => { if(l.bulletCache && l.bulletCache.imgId) allImgIds.add(l.bulletCache.imgId); });

                    let missingCount = 0, recoveredCount = 0;
                    for (let id of allImgIds) {
                        if (!STATE.images[id]) {
                            missingCount++;
                            appendLog(`[遺失] 偵測到照片遺失: ${id}`);
                            
                            if (id.startsWith('local_img_')) {
                                appendLog(`  -> 這是本地暫存檔遺失，無法從雲端救援，將標記為空缺。`);
                            } else if (!STATE.cloud.isOffline && STATE.cloud.accessToken) {
                                try {
                                    appendLog(`  -> 嘗試從 Google Drive 救援...`);
                                    let b64 = await CloudManager.downloadImage(id);
                                    if(b64) {
                                        await LocalDB.save(id, b64);
                                        STATE.images[id] = b64;
                                        recoveredCount++;
                                        appendLog(`  -> 救援成功！`);
                                    }
                                } catch(e) { 
                                    appendLog(`  -> 救援失敗: 雲端無此檔案 (可能已被刪除)。`); 
                                }
                            } else {
                                appendLog(`  -> 未連線至雲端，暫時無法救援。`);
                            }
                        }
                    }
                    
                    if(missingCount > 0) {
                        appendLog(`[救援總結] 遺失: ${missingCount} 張，成功救回: ${recoveredCount} 張。`);
                        if (missingCount > recoveredCount) {
                            appendLog(`❌ 警告：仍有照片無法救回！`);
                        }
                    } else appendLog(`[成功] 本地所有照片完整無缺 (${Object.keys(STATE.images).length} files)`);

                    // 3. 雲端狀態檢查
                    appendLog(`\n[3/4] 檢查網路與通行證狀態...`);
                    appendLog(`- 網路連線: ${navigator.onLine ? 'Online' : 'Offline'}`);
                    appendLog(`- API Token: ${STATE.cloud.accessToken ? '已取得' : '未取得/過期'}`);
                    appendLog(`- Folder ID: ${STATE.cloud.folderId || '未設定'}`);
                    appendLog(`- File ID: ${STATE.cloud.fileId || '未設定'}`);

                    // 4. 執行同步
                    appendLog(`\n[4/4] 觸發強制同步 (Perform Full Sync)...`);
                    await this.performFullSync(true);
                    
                    appendLog(`\n🎉 [體檢結束] 如果看到「雲端同步成功」，代表系統健康無虞！`);
                    appendLog(`如有其他異常，請點擊上方【複製報告】提供給開發者。`);
                } catch(e) {
                    appendLog(`\n❌ [致命錯誤] 體檢或同步中斷: ${e.message}\n${e.stack}`);
                }
            },

            // 實作「三波同步防護網」
            performFullSync: async function(forceUpload = false, attempt = 1, errorLogs = []) {
                let debugStep = "初始化同步檢查";
                let appendLog = (msg) => {
                    const debugTextarea = document.getElementById('debug-body');
                    if(debugTextarea) {
                        debugTextarea.value += msg + "\n";
                        debugTextarea.scrollTop = debugTextarea.scrollHeight;
                    }
                };

                try {
                    debugStep = "檢查網路與通行證";
                    if (STATE.cloud.isOffline) { UIManager.updateSyncUI('error', '處於離線狀態'); return false; }
                    if (!STATE.cloud.accessToken) return CloudManager.authorize(() => this.performFullSync(forceUpload));

                    let pwd = localStorage.getItem('sys_pin_cache');
                    if (!pwd) {
                        pwd = await PinLock.open("授權雲端同步", "請輸入密碼以解密備份");
                        if (pwd) localStorage.setItem('sys_pin_cache', pwd); else return false;
                    }

                    if(attempt === 1) UIManager.updateSyncUI('syncing');
                    appendLog(`\n--- 開始智慧雙向同步 [第 ${attempt} 次嘗試] ---`);

                    debugStep = "處理照片上傳";
                    for (let id of Object.keys(STATE.images)) {
                        if (id.startsWith('local_img_')) {
                            try {
                                const fileId = await CloudManager.uploadImage(STATE.images[id], STATE.cloud.folderId, generateFileName('Img', 'Data'));
                                if (fileId) { 
                                    await LocalDB.save(fileId, STATE.images[id]); 
                                    STATE.images[fileId] = STATE.images[id]; 
                                    
                                    STATE.data.users.forEach(u => { if (u.avatarId === id) u.avatarId = fileId; });
                                    STATE.data.cards.forEach(c => { if (c.imgId === id) c.imgId = fileId; });
                                    STATE.data.bullets.forEach(b => { if (b.imgId === id) b.imgId = fileId; });
                                    STATE.data.logs.forEach(l => { if (l.bulletCache && l.bulletCache.imgId === id) l.bulletCache.imgId = fileId; });
                                    
                                    LocalDB.delete(id); 
                                    delete STATE.images[id];
                                }
                            } catch (imgErr) {}
                        }
                    }

                    debugStep = "檢查雲端版本與時間戳";
                    if (STATE.cloud.fileId && !forceUpload) {
                        const res = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files/${STATE.cloud.fileId}?fields=modifiedTime`);
                        const meta = await res.json();
                        const cloudTime = new Date(meta.modifiedTime).getTime();
                        const localTime = STATE.data.last_update || 0;
                        
                        if (cloudTime > localTime + 3000) { 
                            debugStep = "下載並載入雲端較新資料";
                            const fileRes = await DriveAPI.fetch(`https://www.googleapis.com/drive/v3/files/${STATE.cloud.fileId}?alt=media`);
                            const encryptedStr = await fileRes.text();
                            
                            let parsedCloudData = null;
                            try {
                                const decStr = await CryptoEngine.decrypt(encryptedStr, pwd);
                                if (decStr.trim().startsWith('{')) {
                                    parsedCloudData = JSON.parse(decStr);
                                } else {
                                    const decompressed = DataCompressor.decompress(decStr);
                                    if (!decompressed) throw new Error("解壓縮失敗");
                                    parsedCloudData = JSON.parse(decompressed);
                                }
                            } catch (parseErr) {
                                parsedCloudData = null; 
                            }
                            
                            if (parsedCloudData) {
                                STATE.data = SyncEngine.mergeCloudWithLocal(parsedCloudData);
                                STATE.cloud.lastSyncTime = cloudTime;
                                STATE.data.last_update = cloudTime; 
                                this.persistToLocal();
                                
                                this.refreshTheme();
                                UIManager.renderProfiles();
                                UIManager.renderMarquee();
                                CardManager.renderStage();
                                if(typeof BackpackManager !== 'undefined') BackpackManager.render();
                                
                                UIManager.updateSyncUI('success');
                                if(attempt === 1) showToast("已從雲端載入最新進度！", false);
                                return true; 
                            }
                        } else if (localTime <= cloudTime) {
                            UIManager.updateSyncUI('success');
                            return true;
                        }
                    }

                    debugStep = "加密與上傳";
                    if(!STATE.data.last_update) STATE.data.last_update = Date.now();
                    this.persistToLocal(); 
                    
                    const rawJsonStr = JSON.stringify(STATE.data);
                    const finalEncryptedStr = await CryptoEngine.encrypt(rawJsonStr, pwd);
                    
                    const success = await CloudManager.resumableUpload(STATE.cloud.fileId, STATE.cloud.folderId, `PointsBackup_${new Date().toISOString().split('T')[0]}.json`, finalEncryptedStr);
                    
                    if (success) { 
                        UIManager.updateSyncUI('success'); 
                        if(attempt === 1) showToast("雲端同步成功！", false); 
                        return true;
                    } else {
                        throw new Error("Resumable Upload Failed: API未回傳成功代碼");
                    }

                } catch (e) {
                    errorLogs.push(`[第 ${attempt} 次嘗試失敗] 斷點: ${debugStep}\n錯誤: ${e.message}\n追蹤: ${e.stack}`);
                    
                    if(attempt === 1) {
                        showToast("網路延遲，系統將自動進行第 2 次嘗試...", true);
                        await new Promise(r => setTimeout(r, 2000));
                        return this.performFullSync(forceUpload, 2, errorLogs);
                    } else if(attempt === 2) {
                        showToast("連線不穩，將重置通行證進行最後嘗試...", true);
                        STATE.cloud.accessToken = null;
                        return this.performFullSync(forceUpload, 3, errorLogs);
                    } else {
                        const diag = `\n❌ ==== 終極同步崩潰報告 ====\n[發生時間] ${new Date().toLocaleString()}\n[三次錯誤全紀錄]\n${errorLogs.join('\n\n')}\n========================`;
                        appendLog(diag);
                        logDebug("Sync Crash", diag);
                        UIManager.updateSyncUI('error', '同步失敗');
                        showToast("三次同步嘗試皆失敗，請查看系統診斷", true);
                        setTimeout(() => document.getElementById('debug-console').classList.add('active'), 1000); 
                        return false;
                    }
                }
            },
            
            syncAndWipeAndClose: async function() {
                showToast("準備備份並清除...", false);
                document.getElementById('dynamic-modal').classList.remove('open');
                
                try {
                    const isSuccess = await this.performFullSync(true); 
                    if (isSuccess) {
                        localStorage.removeItem('points_sys_data'); 
                        localStorage.removeItem('points_sys_cloud'); 
                        showToast("資料已清除，準備關閉", false);
                        setTimeout(() => {
                            window.close(); 
                            location.href = 'about:blank'; 
                        }, 1000);
                    } else {
                        STATE.pendingWipeAndClose = true;
                    }
                } catch(e) {
                    STATE.pendingWipeAndClose = true;
                    logDebug("Wipe Crash", e.message);
                    document.getElementById('debug-console').classList.add('active');
                }
            },
            
            silentSyncCheck: async function() {
                try {
                    if (STATE.cloud.fileId && !STATE.cloud.isOffline && STATE.cloud.accessToken) {
                        const isConflict = await CloudManager.checkVersionConflict(STATE.cloud.fileId);
                        if (isConflict) {
                            showToast("偵測到雲端有新進度，準備重新載入...", false);
                            this.performFullSync(); 
                        }
                    }
                } catch(e) {}
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            let lastActiveTime = Date.now();
            document.addEventListener('pointerdown', () => {
                if (Date.now() - lastActiveTime > 10000) { 
                    CoreManager.silentSyncCheck();
                }
                lastActiveTime = Date.now();
            }, { passive: true });

            CoreManager.init();
            window.addEventListener('offline', () => STATE.cloud.isOffline = true);
            window.addEventListener('online', () => STATE.cloud.isOffline = false);
        });
        
        window.addEventListener('beforeunload', function (e) {
            setTimeout(() => {
                if (!STATE.cloud.isOffline && STATE.cloud.accessToken) {
                    CoreManager.performFullSync();
                }
            }, 500);
            
            e.preventDefault();
            e.returnValue = '警告：重新整理將會清空本機記憶體！如果取消，系統將立刻為您執行同步。';
            return e.returnValue;
        });

        window.addEventListener('unload', function () {
            if(!STATE.pendingWipeAndClose) localStorage.removeItem('points_sys_data');
        });
        
    </script>
</body>
</html>
