<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrossFit Voice AI</title>
    <style>
        /* =========================================================
           [1] 核心佈局與 Mobile 底部防擋優化 (100dvh & Safe-Area)
           ========================================================= */
        :root { --bg-color: #050505; --neon-orange: #ff4500; --neon-green: #00ff2a; --dark-gray: #111; --light-gray: #eee; --alert-red: #ff003c; }
        
        html, body { width: 100%; height: 100dvh; /* 動態視窗高度，防 Safari 底列 */ overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; background-color: var(--bg-color); color: var(--light-gray); font-family: 'Impact', 'Arial Black', 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        .container { padding: 15px; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px); width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; height: 100dvh; }
        
        .header-stats { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
        
        /* Builder View */
        #builder-view { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #btn-start { background: var(--dark-gray); border: 2px solid var(--neon-green); color: var(--neon-green); font-size: 1.5rem; padding: 15px; width: 100%; border-radius: 8px; margin-bottom: 15px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
        #btn-start:active { background: var(--neon-green); color: #000; }
        
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; overflow: hidden; }
        @media(max-width: 768px) { .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
        
        /* 加入 padding-bottom 確保最後一個 item 也能清楚看見 */
        .zone { background: #0a0a0a; border: 1px dashed #333; border-radius: 8px; padding: 10px; overflow-y: auto; touch-action: pan-y; padding-bottom: 40px; }
        .zone-title { color: var(--neon-orange); font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold;}
        
        .card { background: #151515; border-left: 4px solid #333; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 4px; }
        .card:active { transform: scale(0.98); }
        .card-info h3 { margin: 0; font-size: 1.1rem; color: var(--light-gray); font-family: sans-serif; font-weight: bold; }
        
        /* =========================================================
           [2] 訓練畫面與戰術 HUD
           ========================================================= */
        #workout-view { display: none; width: 100vw; height: 100dvh; flex-direction: column; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; background: var(--bg-color); z-index: 100; touch-action: none; transition: box-shadow 0.1s ease-out; }
        .glow-rep { box-shadow: inset 0 0 60px var(--neon-green); border: 4px solid var(--neon-green); }

        #blind-touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .workout-content { position: relative; z-index: 20; text-align: center; pointer-events: none; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        #timer-display { font-size: 14vw; color: #aaa; }
        #current-move-name { font-size: 7vw; color: var(--neon-orange); margin-top: 5px; font-weight: 900; }
        #rep-counter { font-size: 30vw; color: var(--neon-green); line-height: 1; margin: -10px 0; }
        
        /* 視覺提示 HUD */
        #hud-cues { background: rgba(0,0,0,0.7); border: 1px solid #333; padding: 10px 15px; border-radius: 8px; margin: 10px 0; text-align: left; font-family: sans-serif; min-width: 250px; }
        .hud-item { font-size: 1.1rem; margin: 5px 0; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .hud-good { color: var(--neon-green); }
        .hud-bad { color: var(--alert-red); }

        #btn-abort { position: absolute; top: max(20px, env(safe-area-inset-top)); left: 20px; z-index: 30; pointer-events: auto; background: transparent; border: 1px solid var(--alert-red); color: var(--alert-red); padding: 8px 15px; border-radius: 4px; font-family: sans-serif; font-weight: bold; cursor: pointer;}
        
        /* =========================================================
           [3] 直覺拖曳聲控儀表板 (SVG + Visualizer)
           ========================================================= */
        #mic-control { position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px; width: 45px; height: 180px; background: rgba(17, 17, 17, 0.85); border-radius: 25px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 15px 0; z-index: 30; cursor: ns-resize; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        #vis-area { flex: 1; width: 12px; background: #000; border-radius: 6px; margin-top: 10px; position: relative; pointer-events: none; }
        #audio-bar { position: absolute; bottom: 0; width: 100%; height: 0%; background: var(--neon-green); border-radius: 6px; transition: height 0.05s ease-out; }
        #audio-threshold-line { position: absolute; bottom: 30%; left: -6px; width: 24px; height: 4px; background: var(--alert-red); border-radius: 2px; pointer-events: none; }
        
    </style>
</head>
<body>

    <div id="builder-view" class="container">
        <div class="header-stats">
            <h2 style="color:var(--light-gray); margin:0;">VOICE <span class="text-orange">AI</span> COACH</h2>
        </div>
        
        <button id="btn-start" onclick="startWOD()">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            START WOD 開始訓練
        </button>
        
        <div class="workspace">
            <div class="zone" id="library-zone">
                <div class="zone-title">LIBRARY 動作庫</div>
                <div id="library-list"></div>
            </div>
            <div class="zone" id="wod-zone" ondragover="event.preventDefault()" ondrop="drop(event)">
                <div class="zone-title" style="color:var(--neon-green);">TODAY'S WOD 今日排程</div>
                <div id="wod-list"></div>
            </div>
        </div>
    </div>

    <div id="workout-view">
        <div id="blind-touch-overlay" onpointerdown="triggerRepManual()"></div>
        <button id="btn-abort" onclick="abortWOD()">ABORT 放棄</button>
        
        <!-- 直覺聲控儀表板 (可上下滑動調整靈敏度) -->
        <div id="mic-control" onpointerdown="handleMicDrag(event)" onpointermove="handleMicDrag(event)">
            <svg viewBox="0 0 24 24" fill="var(--light-gray)" width="22" height="22" style="pointer-events:none;">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <div id="vis-area">
                <div id="audio-bar"></div>
                <div id="audio-threshold-line"></div>
            </div>
        </div>

        <div class="workout-content">
            <div id="timer-display">00:00</div>
            <div id="current-move-name">---</div>
            
            <div id="hud-cues">
                <div class="hud-item hud-good">✅ <span id="hud-txt-good">Prepare / 準備</span></div>
                <div class="hud-item hud-bad">❌ <span id="hud-txt-bad">Stay Focused / 保持專注</span></div>
            </div>

            <div id="rep-counter">0</div>
        </div>
    </div>

    <script>
        /* =========================================================
           [1] 雙語資料庫 (Bilingual Database)
           ========================================================= */
        const MOVES_DB = {
            'sn': 'Snatch / 抓舉', 'cj': 'Clean & Jerk / 挺舉', 'dl': 'Deadlift / 硬舉',
            'sq': 'Air Squat / 徒手深蹲', 'fs': 'Front Squat / 前蹲舉', 'thr': 'Thruster / 推進舉',
            'wb': 'Wall Ball / 藥球', 'pr': 'Shoulder Press / 肩推', 'hrpu': 'Push-Up / 伏地挺身',
            'burpee': 'Burpees / 波比跳', 'pu': 'Pull-Up / 引體向上', 't2b': 'Toes-to-Bar / 腳趾觸槓'
        };

        const MOVE_TYPES = {
            'sn':'hinge', 'dl':'hinge', 'cj':'hinge',
            'sq':'squat', 'fs':'squat', 'thr':'squat', 'wb':'squat',
            'pr':'push', 'hrpu':'push', 'burpee':'push',
            'pu':'pull', 't2b':'pull'
        };

        // 資料結構：{ text: "畫面顯示雙語", voice: "語音僅唸中文精簡版" }
        const CUES_DB = {
            squat: {
                cues: [
                    { text: "Weight mid-foot / 重心落於足中", voice: "重心足中" },
                    { text: "Knees track toes / 膝蓋對齊腳尖", voice: "膝蓋向外" },
                    { text: "Chest up, core tight / 挺胸鎖緊核心", voice: "挺胸收腹" },
                    { text: "Hips back and down / 臀部向後向下", voice: "臀部向後" },
                    { text: "Drive the floor / 腳跟推開地板", voice: "推開地板" }
                ],
                faults: ["Knees caving in / 膝蓋內傾", "Chest dropping / 彎腰塌胸", "Weight on toes / 重心前傾墊腳"]
            },
            hinge: {
                cues: [
                    { text: "Neutral spine / 脊椎保持中立", voice: "背部打直" },
                    { text: "Hips back / 髖部向後推", voice: "髖部向後" },
                    { text: "Shoulders over bar / 肩膀超過槓鈴", voice: "肩膀微前傾" },
                    { text: "Drive heels / 腳跟蹬地", voice: "腳跟發力" },
                    { text: "Full hip extension / 完全伸展髖部", voice: "完全伸展" }
                ],
                faults: ["Cat back / 龜背拱起", "Hips shooting up / 臀部提早抬起", "Bar away from body / 槓鈴遠離小腿"]
            },
            push: {
                cues: [
                    { text: "Hollow plank / 身體維持中空", voice: "核心收緊" },
                    { text: "Press vertical / 垂直向上推", voice: "垂直向上" },
                    { text: "Lockout top / 頂部鎖定關節", voice: "頂部鎖定" },
                    { text: "Head through / 頭部穿過手臂", voice: "頭部穿過" },
                    { text: "Pecs engaged / 胸肌前鋸肌發力", voice: "胸肌發力" }
                ],
                faults: ["Arching lower back / 下背過度凹陷", "Elbows flaring / 手肘過度外翻", "Snaking up / 像蟲一樣起身"]
            },
            pull: {
                cues: [
                    { text: "Active shoulders / 肩膀啟動下壓", voice: "肩胛下壓" },
                    { text: "Elbows back and down / 手肘向後向下拉", voice: "手肘向後" },
                    { text: "Aggressive hip hinge / 髖部強烈折疊", voice: "髖部彈震" },
                    { text: "Lats contracted / 背闊肌收縮", voice: "背闊肌發力" },
                    { text: "Chin over bar / 下巴過槓", voice: "下巴過槓" }
                ],
                faults: ["Blind swinging / 盲目無張力擺盪", "Early arm pull / 提早屈臂發力", "Muted hips / 髖部死板未參與"]
            }
        };

        let currentWOD = [];
        let isWorkingOut = false, currentMoveIndex = 0, currentReps = 0;
        let lastRepTime = 0, workoutStartTime = 0, timerInterval = null;
        
        // 聲控與 UI 拖曳變數
        let audioContext = null, analyser = null, micStream = null, pcmData = null;
        let micThreshold = parseInt(localStorage.getItem('cf_mic_thresh_v2')) || 70; 
        const synth = window.speechSynthesis;

        window.onload = () => { renderLibrary(); renderWOD(); };

        /* =========================================================
           [2] 介面渲染與排程
           ========================================================= */
        function renderLibrary() {
            document.getElementById('library-list').innerHTML = Object.keys(MOVES_DB).map(id => 
                `<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${id}')" onclick="addMove('${id}')">
                    <div class="card-info"><h3>${MOVES_DB[id]}</h3></div>
                    <div style="color:var(--neon-green); font-weight:bold; font-size:1.2rem;">+</div>
                </div>`
            ).join('');
        }

        function renderWOD() {
            document.getElementById('wod-list').innerHTML = currentWOD.map((item, i) => 
                `<div class="card" onclick="currentWOD.splice(${i},1); renderWOD();">
                    <div class="card-info"><h3>${i+1}. ${MOVES_DB[item.id]}</h3></div>
                    <input type="number" value="${item.targetReps}" style="width:60px; background:#000; color:var(--neon-green); border:1px solid #444; border-radius:4px; font-size:1.2rem; text-align:center;" onchange="currentWOD[${i}].targetReps=parseInt(this.value); event.stopPropagation();" onclick="event.stopPropagation();">
                </div>`
            ).join('');
        }

        function drop(e) { e.preventDefault(); addMove(e.dataTransfer.getData('text/plain')); }
        function addMove(id) { if(!MOVE_TYPES[id]) return; currentWOD.push({ id: id, targetReps: 10 }); renderWOD(); }

        /* =========================================================
           [3] 人因聲控儀表板：直覺滑動條 (Pointer Events)
           ========================================================= */
        function handleMicDrag(e) {
            // 確保只有按下並拖動時才觸發，並攔截事件防止滑動衝突
            if (e.buttons !== 1) return;
            e.preventDefault();
            const micCtrl = document.getElementById('mic-control');
            micCtrl.setPointerCapture(e.pointerId); // 鎖定滑動目標，滑出框外也能繼續追蹤
            
            const visArea = document.getElementById('vis-area');
            const rect = visArea.getBoundingClientRect();
            // 計算 Y 軸相對位置 (底部為 0，頂部為 1)
            let pct = 1 - ((e.clientY - rect.top) / rect.height);
            pct = Math.max(0.05, Math.min(1, pct)); // 限制在 5%~100% 之間
            
            micThreshold = pct * 255;
            localStorage.setItem('cf_mic_thresh_v2', micThreshold);
            document.getElementById('audio-threshold-line').style.bottom = (pct * 100) + '%';
        }

        /* =========================================================
           [4] 聲控邊緣運算 (Volume Envelope Computing)
           ========================================================= */
        async function startWOD() {
            if(currentWOD.length === 0) return;
            document.getElementById('builder-view').style.display = 'none'; 
            document.getElementById('workout-view').style.display = 'flex';
            
            // 初始化儀表板紅線位置
            document.getElementById('audio-threshold-line').style.bottom = Math.min((micThreshold/255)*100, 100) + '%';

            isWorkingOut = true; currentMoveIndex = 0; currentReps = 0;
            
            try {
                if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(micStream);
                source.connect(analyser);
                pcmData = new Uint8Array(analyser.frequencyBinCount);
                
                processAudio();
            } catch(e) { 
                console.warn("麥克風存取失敗，使用手動觸控模式", e);
            }
            
            startTimer(); updateUI(true);
        }

        function processAudio() {
            if(!isWorkingOut || !analyser) return;
            
            analyser.getByteFrequencyData(pcmData);
            let sum = 0; for (let i = 0; i < pcmData.length; i++) sum += pcmData[i];
            let avgVolume = sum / pcmData.length; 
            
            const bar = document.getElementById('audio-bar');
            bar.style.height = Math.min((avgVolume / 255) * 100, 100) + '%';
            
            // 防抖 600ms + 避免 TTS 自己觸發自己
            if (avgVolume > micThreshold && !synth.speaking && (Date.now() - lastRepTime) > 600) {
                bar.style.backgroundColor = 'var(--alert-red)';
                triggerRep();
            } else {
                bar.style.backgroundColor = 'var(--neon-green)';
            }
            
            requestAnimationFrame(processAudio);
        }

        /* =========================================================
           [5] 訓練邏輯、觸覺防護與動態 HUD 提示
           ========================================================= */
        function triggerRepManual() { if ((Date.now() - lastRepTime) > 350) triggerRep(); }

        function triggerRep() {
            if(!isWorkingOut) return;
            lastRepTime = Date.now();
            const item = currentWOD[currentMoveIndex];
            currentReps++;
            
            // 物理觸覺與邊緣脈衝
            if (navigator.vibrate) navigator.vibrate(50);
            const wv = document.getElementById('workout-view');
            wv.classList.add('glow-rep'); setTimeout(() => wv.classList.remove('glow-rep'), 150);
            
            const left = item.targetReps - currentReps;
            
            if (left === 3) speakText("三下，撐住");
            else if (left <= 0) {
                currentMoveIndex++; currentReps = 0;
                if (currentMoveIndex >= currentWOD.length) { speakText("訓練完成，太棒了"); abortWOD(); return; }
                else {
                    updateUI(true); // 換動作時強制更新 HUD
                    speakText("換動作");
                }
            } else if (!synth.speaking && Math.random() < 0.3) {
                updateAndSpeakCue(item.id); 
            }
            if(isWorkingOut) updateUI(false);
        }

        // 抽取並更新 HUD，並朗讀簡短中文提示
        function updateAndSpeakCue(id) {
            const mType = MOVE_TYPES[id];
            const pool = CUES_DB[mType];
            
            // 隨機抽取 Good Cue 與 Bad Fault
            const rCue = pool.cues[Math.floor(Math.random() * pool.cues.length)];
            const rFault = pool.faults[Math.floor(Math.random() * pool.faults.length)];
            
            document.getElementById('hud-txt-good').innerText = rCue.text;
            document.getElementById('hud-txt-bad').innerText = rFault;
            
            speakText(rCue.voice);
        }

        function speakText(text) {
            if(synth.speaking) return; 
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; // 統一使用中文發音
            u.rate = 1.1; 
            synth.speak(u);
        }

        function updateUI(isNewMove = false) {
            if(currentMoveIndex >= currentWOD.length) return;
            const currentItem = currentWOD[currentMoveIndex];
            document.getElementById('current-move-name').innerText = MOVES_DB[currentItem.id];
            document.getElementById('rep-counter').innerText = currentReps;
            
            // 當切換新動作時，重置一次 HUD 提示
            if (isNewMove) updateAndSpeakCue(currentItem.id);
        }

        function startTimer() {
            workoutStartTime = Date.now();
            timerInterval = setInterval(() => {
                const d = Date.now() - workoutStartTime, m = Math.floor(d/60000), s = Math.floor((d%60000)/1000);
                document.getElementById('timer-display').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function abortWOD() {
            isWorkingOut = false; clearInterval(timerInterval);
            
            // 安全釋放硬體資源
            if(micStream) micStream.getTracks().forEach(t=>t.stop());
            if(audioContext && audioContext.state !== 'closed') audioContext.close();
            micStream = null; analyser = null;
            
            document.getElementById('builder-view').style.display = 'flex'; 
            document.getElementById('workout-view').style.display = 'none';
        }
    </script>
</body>
</html>
