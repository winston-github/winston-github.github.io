<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrossFit AI Coach</title>
    <style>
        /* =========================================================
           [1] 核心佈局與防護 (100dvh & Safe-Area)
           ========================================================= */
        :root { --bg-color: #050505; --neon-orange: #ff4500; --neon-green: #00ff2a; --dark-gray: #111; --light-gray: #eee; --alert-red: #ff003c; }
        
        html, body { width: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; background-color: var(--bg-color); color: var(--light-gray); font-family: 'Impact', 'Arial Black', 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        .container { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; height: 100dvh; }
        
        /* 頂部控制列與 Presets */
        .header-stats { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-bottom: 10px; }
        .preset-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #333; flex-shrink: 0; }
        .preset-bar::-webkit-scrollbar { display: none; }
        .btn-preset { background: #1a1a1a; color: #aaa; border: 1px solid #444; padding: 8px 15px; border-radius: 20px; font-family: sans-serif; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .btn-preset:active { background: #333; }
        .btn-save { border-color: var(--neon-orange); color: var(--neon-orange); }

        /* =========================================================
           [2] 比例微調 (35% / 65%) 與修復文字截斷
           ========================================================= */
        .workspace { display: grid; grid-template-columns: 3.5fr 6.5fr; gap: 10px; flex: 1; overflow: hidden; }
        .zone { background: #0a0a0a; border: 1px dashed #333; border-radius: 8px; padding: 8px; overflow-y: auto; touch-action: pan-y; padding-bottom: 20px; }
        .zone-title { color: var(--neon-orange); font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; text-align: center; font-weight: bold;}
        
        .card { background: #151515; border-left: 4px solid #333; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 4px; transition: transform 0.1s, opacity 0.1s; }
        .card:active { background: #222; transform: scale(0.98); }
        .card.dragging { opacity: 0.5; transform: scale(1.02); z-index: 10; border-color: var(--neon-green); } /* 拖曳時的視覺反饋 */
        
        /* 文字區域自然換行，拒絕截斷 */
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; padding-right: 5px; }
        .ch-text { font-size: 1.05rem; color: #fff; font-weight: bold; line-height: 1.2; white-space: normal; word-break: break-word; }
        .en-text { font-size: 0.75rem; color: #888; font-family: sans-serif; white-space: normal; word-break: break-word; margin-top: 2px;}
        
        /* 三條線把手 */
        .drag-handle { display: flex; align-items: center; justify-content: center; padding-right: 8px; color: #666; font-size: 1.5rem; cursor: grab; touch-action: none; }
        .drag-handle:active { color: var(--neon-green); }

        /* 縮小按鈕佔比，釋放空間給文字 */
        .rep-ctrl { display: flex; align-items: center; background: #000; border-radius: 6px; border: 1px solid #444; flex-shrink: 0; }
        .rep-btn { background: transparent; border: none; color: var(--neon-green); font-size: 1.3rem; width: 28px; height: 32px; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; }
        .rep-val { color: #fff; font-size: 1.1rem; width: 24px; text-align: center; font-family: 'Impact'; }
        
        #btn-start { background: var(--dark-gray); border: 2px solid var(--neon-green); color: var(--neon-green); font-size: 1.4rem; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; flex-shrink: 0; }
        #btn-start:active { background: var(--neon-green); color: #000; }

        /* =========================================================
           [3] 訓練畫面與戰術 HUD (包含置底目標次數)
           ========================================================= */
        #workout-view { display: none; width: 100vw; height: 100dvh; flex-direction: column; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; background: var(--bg-color); z-index: 100; touch-action: none; transition: box-shadow 0.1s ease-out; }
        .glow-rep { box-shadow: inset 0 0 60px var(--neon-green); border: 4px solid var(--neon-green); }

        #blind-touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .workout-content { position: relative; z-index: 20; text-align: center; pointer-events: none; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }
        
        #timer-display { font-size: 12vw; color: #aaa; }
        #current-move-name { display: flex; flex-direction: column; align-items: center; margin-top: 5px; }
        #current-ch { font-size: 8vw; color: var(--neon-orange); font-weight: 900; line-height: 1.2;}
        #current-en { font-size: 4vw; color: #888; font-family: sans-serif;}
        
        /* 置底對齊的計次區塊 */
        #rep-display { display: flex; align-items: baseline; justify-content: center; margin: 0; }
        #rep-counter { font-size: 35vw; color: var(--neon-green); line-height: 1; font-weight: 900;}
        #rep-target { font-size: 10vw; color: #666; margin-left: 10px; font-weight: bold; }
        
        #hud-cues { background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 10px 15px; border-radius: 8px; margin: 10px 0; text-align: left; font-family: sans-serif; min-width: 250px; }
        .hud-item { font-size: 1.1rem; margin: 5px 0; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        #btn-abort { position: absolute; top: max(15px, env(safe-area-inset-top)); left: 15px; z-index: 30; pointer-events: auto; background: transparent; border: 1px solid var(--alert-red); color: var(--alert-red); padding: 8px 15px; border-radius: 4px; font-family: sans-serif; font-weight: bold;}
        
        /* 橫向拖曳聲波儀 */
        #mic-control { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 5%; width: 90%; height: 60px; background: rgba(17, 17, 17, 0.9); border-radius: 30px; border: 2px solid #333; display: flex; align-items: center; padding: 0 15px; z-index: 30; cursor: ew-resize; touch-action: none; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        #vis-area { flex: 1; height: 20px; background: #000; border-radius: 10px; margin-left: 15px; position: relative; pointer-events: none; overflow: hidden; }
        #audio-bar { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--neon-green); transition: width 0.05s ease-out; }
        #audio-threshold-line { position: absolute; top: -5px; bottom: -5px; width: 4px; background: var(--alert-red); border-radius: 2px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="builder-view" class="container">
        <div class="header-stats">
            <h2 style="color:var(--light-gray); margin:0;">CROSSFIT <span class="text-orange">AI</span></h2>
        </div>
        
        <div class="preset-bar" id="preset-container"></div>

        <div class="workspace">
            <div class="zone" id="library-zone">
                <div class="zone-title">動作庫</div>
                <div id="library-list"></div>
            </div>
            <!-- WOD 區域註冊原生拖放事件 (供桌機版使用) -->
            <div class="zone" id="wod-zone" ondragover="dragOverWod(event)" ondrop="dropWodNative(event)">
                <div class="zone-title" style="color:var(--neon-green);">課表 WOD</div>
                <div id="wod-list"></div>
            </div>
        </div>

        <button id="btn-start" onclick="startWOD()">START WOD 開始</button>
    </div>

    <div id="workout-view">
        <div id="blind-touch-overlay" onpointerdown="triggerRepManual()"></div>
        <button id="btn-abort" onclick="abortWOD()">ABORT</button>
        
        <div id="mic-control" onpointerdown="handleMicDrag(event)" onpointermove="handleMicDrag(event)">
            <svg viewBox="0 0 24 24" fill="var(--light-gray)" width="28" height="28" style="pointer-events:none;">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <div id="vis-area">
                <div id="audio-bar"></div>
                <div id="audio-threshold-line"></div>
            </div>
        </div>

        <div class="workout-content">
            <div id="timer-display">00:00</div>
            
            <div id="current-move-name">
                <div id="current-ch">---</div>
                <div id="current-en">---</div>
            </div>
            
            <div id="hud-cues">
                <div class="hud-item" style="color:var(--neon-green);">✅ <span id="hud-txt-good">準備 / Prepare</span></div>
                <div class="hud-item" style="color:var(--alert-red);">❌ <span id="hud-txt-bad">保持專注 / Stay Focused</span></div>
            </div>

            <!-- 計次顯示區塊 (包含目標次數) -->
            <div id="rep-display">
                <div id="rep-counter">0</div>
                <div id="rep-target">/ 0</div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           [1] 雙語資料庫 
           ========================================================= */
        const MOVES_DB = {
            'sn': { ch: '抓舉', en: 'Snatch' }, 'cj': { ch: '挺舉', en: 'Clean & Jerk' }, 'dl': { ch: '硬舉', en: 'Deadlift' },
            'sq': { ch: '徒手深蹲', en: 'Air Squat' }, 'fs': { ch: '前蹲舉', en: 'Front Squat' }, 'thr': { ch: '推進舉', en: 'Thruster' },
            'wb': { ch: '藥球', en: 'Wall Ball' }, 'pr': { ch: '肩推', en: 'Shoulder Press' }, 'hrpu': { ch: '伏地挺身', en: 'Push-Up' },
            'burpee': { ch: '波比跳', en: 'Burpees' }, 'pu': { ch: '引體向上', en: 'Pull-Up' }, 't2b': { ch: '腳趾觸槓', en: 'Toes-to-Bar' }
        };

        const MOVE_TYPES = {
            'sn':'hinge', 'dl':'hinge', 'cj':'hinge', 'sq':'squat', 'fs':'squat', 'thr':'squat', 'wb':'squat',
            'pr':'push', 'hrpu':'push', 'burpee':'push', 'pu':'pull', 't2b':'pull'
        };

        const CUES_DB = {
            squat: {
                cues: [{ text: "重心落於足中 / Weight mid-foot", voice: "重心足中" }, { text: "膝蓋對齊腳尖 / Knees track toes", voice: "膝蓋向外" }, { text: "挺胸鎖緊核心 / Chest up", voice: "挺胸收腹" }, { text: "腳跟推開地板 / Drive the floor", voice: "推開地板" }],
                faults: ["膝蓋內傾 / Knees caving in", "彎腰塌胸 / Chest dropping", "重心前傾墊腳 / Weight on toes"]
            },
            hinge: {
                cues: [{ text: "脊椎保持中立 / Neutral spine", voice: "背部打直" }, { text: "髖部向後推 / Hips back", voice: "髖部向後" }, { text: "腳跟蹬地 / Drive heels", voice: "腳跟發力" }, { text: "完全伸展髖部 / Full hip extension", voice: "完全伸展" }],
                faults: ["龜背拱起 / Cat back", "臀部提早抬起 / Hips shooting up", "槓鈴遠離小腿 / Bar away"]
            },
            push: {
                cues: [{ text: "身體維持中空 / Hollow plank", voice: "核心收緊" }, { text: "垂直向上推 / Press vertical", voice: "垂直向上" }, { text: "頂部鎖定關節 / Lockout top", voice: "頂部鎖定" }, { text: "頭部穿過手臂 / Head through", voice: "頭部穿過" }],
                faults: ["下背過度凹陷 / Arching lower back", "手肘過度外翻 / Elbows flaring", "像蟲一樣起身 / Snaking up"]
            },
            pull: {
                cues: [{ text: "肩膀啟動下壓 / Active shoulders", voice: "肩胛下壓" }, { text: "手肘向後向下拉 / Elbows back and down", voice: "手肘向後" }, { text: "髖部強烈折疊 / Aggressive hip hinge", voice: "髖部彈震" }, { text: "下巴過槓 / Chin over bar", voice: "下巴過槓" }],
                faults: ["盲目無張力擺盪 / Blind swinging", "提早屈臂發力 / Early arm pull", "髖部死板未參與 / Muted hips"]
            }
        };

        let currentWOD = [];
        let customPresets = JSON.parse(localStorage.getItem('cf_presets')) || [];
        
        let isWorkingOut = false, currentMoveIndex = 0, currentReps = 0;
        let lastRepTime = 0, workoutStartTime = 0, timerInterval = null;
        let audioContext = null, analyser = null, micStream = null, pcmData = null;
        let micThreshold = parseInt(localStorage.getItem('cf_mic_thresh_v3')) || 70; 
        const synth = window.speechSynthesis;

        window.onload = () => { renderLibrary(); renderWOD(); renderPresets(); };

        /* =========================================================
           [2] 渲染引擎
           ========================================================= */
        function renderLibrary() {
            document.getElementById('library-list').innerHTML = Object.keys(MOVES_DB).map(id => 
                `<div class="card" onclick="addMove('${id}')">
                    <div class="card-info">
                        <div class="ch-text">${MOVES_DB[id].ch}</div>
                        <div class="en-text">${MOVES_DB[id].en}</div>
                    </div>
                    <div style="color:var(--neon-green); font-size:1.6rem; font-weight:bold;">+</div>
                </div>`
            ).join('');
        }

        function renderWOD() {
            document.getElementById('wod-list').innerHTML = currentWOD.map((item, i) => 
                `<div class="card" data-uid="${item.uid}" draggable="true" ondragstart="dragWodStart(event)">
                    <!-- 三條線拖拉手柄 -->
                    <div class="drag-handle" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)">☰</div>
                    <div class="card-info">
                        <div class="ch-text">${MOVES_DB[item.id].ch}</div>
                        <div class="en-text">${MOVES_DB[item.id].en}</div>
                    </div>
                    <div class="rep-ctrl" onclick="event.stopPropagation()">
                        <button class="rep-btn" onclick="changeRep(${i}, -1)">-</button>
                        <div class="rep-val">${item.targetReps}</div>
                        <button class="rep-btn" onclick="changeRep(${i}, 1)">+</button>
                    </div>
                </div>`
            ).join('');
        }

        function addMove(id, reps=10) { 
            if(!MOVE_TYPES[id]) return; 
            // 賦予每個卡片專屬的 UID 確保拖拉辨識準確
            currentWOD.push({ uid: Date.now() + Math.random(), id: id, targetReps: reps }); 
            renderWOD(); 
        }
        
        function changeRep(index, delta) {
            currentWOD[index].targetReps += delta;
            if (currentWOD[index].targetReps <= 0) currentWOD.splice(index, 1);
            renderWOD();
        }

        /* =========================================================
           [3] 完美拖拉排序引擎 (Desktop + Mobile)
           ========================================================= */
        let dragSrcEl = null;

        // --- 桌機版 (HTML5 Native Drag) ---
        function dragWodStart(e) {
            dragSrcEl = e.target.closest('.card');
            if(e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', ''); }
        }
        function dragOverWod(e) {
            e.preventDefault(); // 允許 Drop
            const targetCard = e.target.closest('.card');
            if(targetCard && targetCard !== dragSrcEl && dragSrcEl) {
                // 視覺即時擠開
                const rect = targetCard.getBoundingClientRect();
                const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                targetCard.parentNode.insertBefore(dragSrcEl, next ? targetCard.nextSibling : targetCard);
            }
        }
        function dropWodNative(e) { e.preventDefault(); syncArrayFromDOM(); dragSrcEl = null; }

        // --- 手機版 (Touch Event 即時換位) ---
        function handleTouchStart(e) {
            dragSrcEl = e.target.closest('.card');
            dragSrcEl.classList.add('dragging');
        }
        function handleTouchMove(e) {
            if(!dragSrcEl) return;
            e.preventDefault(); // 防止畫面跟著滾動
            const touch = e.touches[0];
            
            // 暫時隱藏被拖曳的物件，才能偵測到手指下方覆蓋的卡片
            dragSrcEl.style.visibility = 'hidden'; 
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            dragSrcEl.style.visibility = 'visible';
            
            if(targetEl) {
                const targetCard = targetEl.closest('.card');
                if(targetCard && targetCard !== dragSrcEl && targetCard.parentNode === dragSrcEl.parentNode) {
                    const rect = targetCard.getBoundingClientRect();
                    const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    targetCard.parentNode.insertBefore(dragSrcEl, next ? targetCard.nextSibling : targetCard);
                }
            }
        }
        function handleTouchEnd(e) {
            if(!dragSrcEl) return;
            dragSrcEl.classList.remove('dragging');
            dragSrcEl = null;
            syncArrayFromDOM(); // 放開瞬間將 DOM 順序寫回 WOD 陣列
        }

        // 核心同步邏輯：依照畫面上最新的卡片順序重組陣列
        function syncArrayFromDOM() {
            const list = document.getElementById('wod-list');
            const newWOD = [];
            Array.from(list.children).forEach(card => {
                const uid = card.dataset.uid;
                const item = currentWOD.find(w => w.uid == uid);
                if(item) newWOD.push(item);
            });
            currentWOD = newWOD;
        }

        /* =========================================================
           [4] Preset 快選引擎
           ========================================================= */
        function renderPresets() {
            let html = `<button class="btn-preset" onclick="loadTemplate('fran')">FRAN</button>
                        <button class="btn-preset" onclick="loadTemplate('cindy')">CINDY</button>
                        <button class="btn-preset" onclick="currentWOD=[]; renderWOD();">CLEAR</button>
                        <button class="btn-preset btn-save" onclick="savePreset()">💾 SAVE</button>`;
            customPresets.forEach((p, idx) => {
                html += `<button class="btn-preset" style="border-color:#00d2ff;" onclick="loadCustom(${idx})">${p.name}</button>`;
            });
            document.getElementById('preset-container').innerHTML = html;
        }

        function loadTemplate(type) {
            currentWOD = [];
            if (type === 'fran') { ['thr','pu','thr','pu','thr','pu'].forEach((m,i)=>addMove(m, i<2?21:i<4?15:9)); }
            else if (type === 'cindy') { addMove('pu',5); addMove('hrpu',10); addMove('sq',15); }
        }

        function loadCustom(idx) { 
            // 複製物件並重新賦予 UID
            currentWOD = customPresets[idx].data.map(item => ({ ...item, uid: Date.now() + Math.random() })); 
            renderWOD(); 
        }
        
        function savePreset() {
            if(currentWOD.length === 0) return;
            const name = prompt("為這組課表命名:", "My WOD");
            if(name) { customPresets.push({ name: name, data: JSON.parse(JSON.stringify(currentWOD)) }); localStorage.setItem('cf_presets', JSON.stringify(customPresets)); renderPresets(); }
        }

        /* =========================================================
           [5] 橫向直覺聲控儀表板 (Horizontal Mic Bar)
           ========================================================= */
        function handleMicDrag(e) {
            if (e.buttons !== 1 && e.type !== 'touchmove' && e.type !== 'touchstart') return;
            e.preventDefault();
            const micCtrl = document.getElementById('mic-control');
            if(e.pointerId) micCtrl.setPointerCapture(e.pointerId); 
            
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            if(!clientX) return;
            
            const visArea = document.getElementById('vis-area');
            const rect = visArea.getBoundingClientRect();
            let pct = (clientX - rect.left) / rect.width;
            pct = Math.max(0.05, Math.min(1, pct)); 
            
            micThreshold = pct * 255;
            localStorage.setItem('cf_mic_thresh_v3', micThreshold);
            document.getElementById('audio-threshold-line').style.left = (pct * 100) + '%';
        }

        /* =========================================================
           [6] 聲控運算與訓練引擎
           ========================================================= */
        async function startWOD() {
            if(currentWOD.length === 0) return;
            document.getElementById('builder-view').style.display = 'none'; 
            document.getElementById('workout-view').style.display = 'flex';
            
            document.getElementById('audio-threshold-line').style.left = Math.min((micThreshold/255)*100, 100) + '%';

            isWorkingOut = true; currentMoveIndex = 0; currentReps = 0;
            
            try {
                if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(micStream);
                source.connect(analyser);
                pcmData = new Uint8Array(analyser.frequencyBinCount);
                processAudio();
            } catch(e) { }
            
            startTimer(); updateUI(true);
        }

        function processAudio() {
            if(!isWorkingOut || !analyser) return;
            
            analyser.getByteFrequencyData(pcmData);
            let sum = 0; for (let i = 0; i < pcmData.length; i++) sum += pcmData[i];
            let avgVolume = sum / pcmData.length; 
            
            const bar = document.getElementById('audio-bar');
            bar.style.width = Math.min((avgVolume / 255) * 100, 100) + '%';
            
            if (avgVolume > micThreshold && !synth.speaking && (Date.now() - lastRepTime) > 600) {
                bar.style.backgroundColor = 'var(--alert-red)';
                triggerRep();
            } else {
                bar.style.backgroundColor = 'var(--neon-green)';
            }
            
            requestAnimationFrame(processAudio);
        }

        function triggerRepManual() { if ((Date.now() - lastRepTime) > 350) triggerRep(); }

        function triggerRep() {
            if(!isWorkingOut) return;
            lastRepTime = Date.now();
            const item = currentWOD[currentMoveIndex];
            currentReps++;
            
            if (navigator.vibrate) navigator.vibrate(50);
            const wv = document.getElementById('workout-view');
            wv.classList.add('glow-rep'); setTimeout(() => wv.classList.remove('glow-rep'), 150);
            
            const left = item.targetReps - currentReps;
            
            if (left === 3) speakText("三下，撐住");
            else if (left <= 0) {
                currentMoveIndex++; currentReps = 0;
                if (currentMoveIndex >= currentWOD.length) { speakText("訓練完成"); abortWOD(); return; }
                else {
                    updateUI(true); 
                    speakText("換動作");
                }
            } else if (!synth.speaking && Math.random() < 0.3) {
                updateAndSpeakCue(item.id); 
            }
            if(isWorkingOut) updateUI(false);
        }

        function updateAndSpeakCue(id) {
            const pool = CUES_DB[MOVE_TYPES[id]];
            const rCue = pool.cues[Math.floor(Math.random() * pool.cues.length)];
            const rFault = pool.faults[Math.floor(Math.random() * pool.faults.length)];
            
            document.getElementById('hud-txt-good').innerText = rCue.text;
            document.getElementById('hud-txt-bad').innerText = rFault;
            speakText(rCue.voice);
        }

        function speakText(text) {
            if(synth.speaking) return; 
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.rate = 1.1; synth.speak(u);
        }

        function updateUI(isNewMove = false) {
            if(currentMoveIndex >= currentWOD.length) return;
            const currentItem = currentWOD[currentMoveIndex];
            
            document.getElementById('current-ch').innerText = MOVES_DB[currentItem.id].ch;
            document.getElementById('current-en').innerText = MOVES_DB[currentItem.id].en;
            
            document.getElementById('rep-counter').innerText = currentReps;
            // 置底更新：顯示目標次數
            document.getElementById('rep-target').innerText = '/ ' + currentItem.targetReps;
            
            if (isNewMove) updateAndSpeakCue(currentItem.id);
        }

        function startTimer() {
            workoutStartTime = Date.now();
            timerInterval = setInterval(() => {
                const d = Date.now() - workoutStartTime, m = Math.floor(d/60000), s = Math.floor((d%60000)/1000);
                document.getElementById('timer-display').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function abortWOD() {
            isWorkingOut = false; clearInterval(timerInterval);
            if(micStream) micStream.getTracks().forEach(t=>t.stop());
            if(audioContext && audioContext.state !== 'closed') audioContext.close();
            micStream = null; analyser = null;
            document.getElementById('builder-view').style.display = 'flex'; 
            document.getElementById('workout-view').style.display = 'none';
        }
    </script>
</body>
</html>
