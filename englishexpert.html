<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ExpertLingo | 極速專業語彙專家</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --btn-again: #ef4444;
            --btn-hard: #f59e0b;
            --btn-good: #10b981;
            --btn-easy: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            perspective: 1500px;
            overflow-y: auto;
        }

        /* Flashcard Styles */
        .flashcard {
            width: 100%;
            max-width: 600px;
            height: 80vh; /* 針對高螢幕佔比 */
            max-height: 700px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
        }

        /* Front specific */
        .card-front {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .topic-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .word-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .phonetic {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-style: italic;
        }

        .speak-btn {
            background: none;
            border: 2px solid var(--accent);
            color: var(--accent);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .speak-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .hint-text {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
            animation: pulse 2s infinite;
        }

        /* Back specific */
        .card-back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            text-align: left;
        }

        .card-back::-webkit-scrollbar {
            width: 6px;
        }
        .card-back::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .meaning {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .meta-info {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        .content-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .dialogue-box {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            border-left: 3px solid var(--accent);
        }

        .dialogue-line {
            margin-bottom: 10px;
        }
        .dialogue-en { font-weight: 500; font-size: 1rem; color: #f8fafc; cursor: pointer; }
        .dialogue-zh { font-size: 0.9rem; color: var(--text-sub); margin-top: 2px;}
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 60px; /* Space for Anki buttons */
        }
        .tag {
            background: #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* Anki Controls */
        .anki-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .flashcard.flipped .anki-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .anki-btn {
            flex: 1;
            margin: 0 5px;
            padding: 10px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s;
        }
        .anki-btn:active { transform: scale(0.95); }
        .anki-btn span { font-size: 0.75rem; opacity: 0.8; font-weight: normal; margin-top: 2px;}

        .btn-again { background: var(--btn-again); }
        .btn-hard { background: var(--btn-hard); }
        .btn-good { background: var(--btn-good); }
        .btn-easy { background: var(--btn-easy); }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Responsive Settings */
        @media (min-width: 1024px) {
            .flashcard {
                width: 50%;
                height: 600px;
            }
            .word-title { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ExpertLingo</div>
        <div class="progress" id="progress-text">載入中...</div>
    </header>

    <div class="main-container">
        <div class="flashcard" id="flashcard" onclick="flipCard(event)">
            <!-- Front of card -->
            <div class="card-face card-front">
                <div class="topic-badge" id="topic-badge">Topic</div>
                <div class="word-title" id="word-title">Word</div>
                <div class="phonetic" id="word-phonetic">/phonetic/</div>
                <button class="speak-btn" onclick="speakCurrentWord(event)">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <div class="hint-text">點擊卡片翻面</div>
            </div>

            <!-- Back of card -->
            <div class="card-face card-back">
                <div class="meaning" id="word-meaning">Meaning</div>
                <div class="meta-info" id="word-meta">noun | var: word</div>
                
                <div class="section-title">背景知識 (Common Sense)</div>
                <div class="content-text" id="word-bg">Background info...</div>

                <div class="section-title">使用時機 (Context)</div>
                <div class="content-text" id="word-context">When to use...</div>

                <div class="section-title">衍生片語與實戰 (Phrases)</div>
                <div class="content-text" id="word-phrases"></div>

                <div class="section-title">情境對話 (Dialogue)</div>
                <div class="dialogue-box" id="word-dialogue"></div>

                <div class="tags-container" id="word-tags"></div>

                <!-- Anki controls are inside the back face -->
                <div class="anki-controls" onclick="event.stopPropagation()">
                    <button class="anki-btn btn-again" onclick="processSRS(0)">重來<span>&lt; 1m</span></button>
                    <button class="anki-btn btn-hard" onclick="processSRS(1)">困難<span>12h</span></button>
                    <button class="anki-btn btn-good" onclick="processSRS(2)">良好<span>2d</span></button>
                    <button class="anki-btn btn-easy" onclick="processSRS(3)">簡單<span>4d</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTopicData = null;
        let learningQueue =[];
        let currentIndex = 0;
        let srsData = JSON.parse(localStorage.getItem('expertLingoSRS')) || {};

        // 初始化
        async function init() {
            try {
                // 嘗試載入 JSON。若在 File:// 協議下會報錯，需用 Live Server
                const response = await fetch('englishexpert.json');
                currentTopicData = await response.json();
                buildQueue();
                renderCard();
            } catch (error) {
                alert("無法載入資料庫，請確保使用 Web Server 開啟此 HTML (例如 VS Code Live Server) 且 englishexpert.json 在同一目錄。");
                console.error(error);
            }
        }

        // 建立學習佇列（結合 Anki 演算法過濾）
        function buildQueue() {
            const now = Date.now();
            learningQueue = currentTopicData.items.filter(item => {
                const record = srsData[item.id];
                // 如果沒有紀錄，或是下次複習時間小於現在，就加入佇列
                return !record || record.nextReview <= now;
            });

            // 為了展示效果，如果都學完了，重新塞入所有單字
            if(learningQueue.length === 0) {
                learningQueue =[...currentTopicData.items];
            }
            currentIndex = 0;
            updateProgressText();
        }

        // 渲染卡片
        function renderCard() {
            if(currentIndex >= learningQueue.length) {
                alert("🎉 你已完成今天的學習目標！系統將重置佇列。");
                buildQueue();
                return;
            }

            const item = learningQueue[currentIndex];
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.remove('flipped'); // 重置翻面狀態

            // Front
            document.getElementById('topic-badge').innerText = currentTopicData.category;
            document.getElementById('word-title').innerText = item.word;
            document.getElementById('word-phonetic').innerText = item.phonetic;

            // Back
            document.getElementById('word-meaning').innerText = item.zh_tw_meaning;
            document.getElementById('word-meta').innerText = `${item.part_of_speech} | 變體: ${item.variations.join(', ') || '無'}`;
            document.getElementById('word-bg').innerText = item.background_knowledge;
            document.getElementById('word-context').innerText = item.context_of_use;

            // Phrases
            const phrasesHtml = item.phrases_slang.map(p => `<strong>${p.en}</strong>: ${p.zh}`).join('<br>');
            document.getElementById('word-phrases').innerHTML = phrasesHtml;

            // Dialogue
            const dialogHtml = item.dialogues.map(d => `
                <div class="dialogue-line" onclick="speakText('${d.en.replace(/'/g, "\\'")}')">
                    <div class="dialogue-en">${d.speaker}: ${d.en} 🔊</div>
                    <div class="dialogue-zh">${d.zh}</div>
                </div>
            `).join('');
            document.getElementById('word-dialogue').innerHTML = dialogHtml;

            // Tags
            const tagsHtml = item.tags.map(t => `<div class="tag">#${t}</div>`).join('');
            document.getElementById('word-tags').innerHTML = tagsHtml;

            updateProgressText();
        }

        // 卡片翻面
        function flipCard(e) {
            const card = document.getElementById('flashcard');
            card.classList.add('flipped');
        }

        // 文字轉語音 (TTS)
        function speakCurrentWord(e) {
            e.stopPropagation(); // 避免觸發翻卡
            const item = learningQueue[currentIndex];
            speakText(item.word);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                // 停止之前的語音
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 稍微放慢一點讓發音更清楚
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音合成功能。");
            }
        }

        // 處理間隔重複邏輯 (Anki 簡化版)
        function processSRS(quality) {
            const item = learningQueue[currentIndex];
            let record = srsData[item.id] || { interval: 0, repetitions: 0, easeFactor: 2.5 };

            if (quality === 0) {
                record.repetitions = 0;
                record.interval = 1; // 1分鐘後 (示範用)
            } else {
                if (record.repetitions === 0) {
                    record.interval = (quality === 1) ? 12 * 60 : (quality === 2) ? 2 * 24 * 60 : 4 * 24 * 60; // 轉分鐘
                } else if (record.repetitions === 1) {
                    record.interval = 6 * 24 * 60;
                } else {
                    record.interval = Math.round(record.interval * record.easeFactor);
                }
                record.repetitions++;
            }

            record.easeFactor = record.easeFactor + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02));
            if (record.easeFactor < 1.3) record.easeFactor = 1.3;

            record.nextReview = Date.now() + record.interval * 60 * 1000;
            srsData[item.id] = record;
            localStorage.setItem('expertLingoSRS', JSON.stringify(srsData));

            // 切換下一個單字
            currentIndex++;
            
            // 延遲渲染讓翻轉動畫順暢回去
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                renderCard();
            }, 300);
        }

        function updateProgressText() {
            document.getElementById('progress-text').innerText = `已學習: ${currentIndex} / ${learningQueue.length}`;
        }

        // 啟動
        window.onload = init;
    </script>
</body>
</html>
