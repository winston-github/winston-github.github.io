<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Treadmill Generator (Bio-Science Edition)</title>
    <style>
        /* =========================================================
           視覺與 UI/UX 規範 (Apple Fitness+ Pro Style)
           ========================================================= */
        :root {
            --bg-dark: #000000;
            --bg-card: #111111;
            --neon-green: #39FF14;
            --neon-green-dim: rgba(57, 255, 20, 0.2);
            --neon-yellow: #FFF000;
            --neon-red: #FF3B30;
            --neon-blue: #0A84FF;
            --gray: #888888;
            --gray-light: #CCCCCC;
            --text-main: #FFFFFF;
            --active-bg: #2a2a2a;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* 頂部全域導航列 (語言切換與專業進度條) */
        .top-nav {
            width: 100%; background-color: #1a1a1a; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; height: 70px;
        }

        .circle-btn {
            width: 46px; height: 46px; border-radius: 50%; background-color: #333;
            border: 2px solid var(--gray); display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; color: var(--gray-light); fill: var(--gray-light); outline: none;
        }
        .circle-btn.active { border-color: var(--neon-green); color: var(--neon-green); fill: var(--neon-green); background-color: var(--neon-green-dim); }
        .circle-btn.mute { border-color: var(--gray); color: var(--gray); fill: var(--gray); background-color: transparent; }
        
        .circle-btn svg { width: 20px; height: 20px; }
        .btn-text { font-size: 0.65rem; font-weight: 800; margin-top: 2px; text-transform: uppercase; }

        /* 專業百分比進度列 */
        .top-progress-wrapper { flex: 1; margin: 0 20px; display: flex; flex-direction: column; align-items: center; }
        .top-progress-text { font-size: 1.2rem; font-weight: 900; color: var(--neon-green); font-variant-numeric: tabular-nums; letter-spacing: 1px; margin-bottom: 4px; }
        .top-progress-track { width: 100%; height: 6px; background-color: #000; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
        .top-progress-fill { width: 0%; height: 100%; background-color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); transition: width 0.1s linear; }

        /* 生理監控列 (Bio-Feedback Bar) */
        .bio-bar { display: flex; justify-content: space-around; background: #000; padding: 8px 10px; font-size: 0.85rem; border-bottom: 1px solid #222;}
        .bio-item { display: flex; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums;}
        .bio-item svg { width: 16px; height: 16px; margin-right: 5px; }
        .bio-hr { color: var(--neon-red); fill: var(--neon-red); }
        .bio-lac { color: var(--neon-yellow); fill: var(--neon-yellow); }
        .bio-fatigue { color: var(--neon-blue); fill: var(--neon-blue); }

        /* 主要數據與儀表板區域 */
        .dashboard { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 5px 10px; position: relative; }
        .time-display { font-size: clamp(3.5rem, 12vw, 5rem); font-weight: 900; font-variant-numeric: tabular-nums; color: var(--text-main); line-height: 1; margin-top: 5px;}

        .core-metrics { display: flex; width: 100%; justify-content: space-around; text-align: center; margin: 5px 0; }
        .metric-box { display: flex; flex-direction: column; align-items: center; width: 45%; }
        .metric-value { font-size: clamp(3.5rem, 14vw, 5.5rem); font-weight: 900; color: var(--neon-green); line-height: 0.9; }
        .metric-value.yellow { color: var(--neon-yellow); }
        .metric-label { font-size: 0.9rem; color: var(--gray-light); margin-top: 8px; font-weight: bold; }

        .secondary-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; gap: 5px; text-align: center; border-top: 1px solid #333; padding-top: 12px; }
        .sec-value { font-size: 1.5rem; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums;}
        .sec-label { font-size: 0.85rem; color: var(--gray); margin-top: 2px;}

        /* 控制按鈕區域 */
        .controls { display: flex; justify-content: space-around; padding: 12px; background-color: var(--bg-card); }
        .btn-control {
            flex: 1; margin: 0 6px; min-height: 55px; border-radius: 12px; border: none;
            font-size: 1.1rem; font-weight: 900; color: #000; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: transform 0.1s;
        }
        .btn-control:active { transform: scale(0.97); }
        .btn-control svg { width: 22px; height: 22px; margin-right: 6px; fill: #000; }
        .btn-start { background-color: var(--neon-green); }
        .btn-pause { background-color: var(--neon-yellow); }
        .btn-reset { background-color: var(--neon-red); color: #FFF; }
        .btn-reset svg { fill: #FFF; }

        /* 設定與卡拉OK課表預覽區域 */
        .settings-panel { height: 35vh; background-color: #111; overflow-y: hidden; display: flex; flex-direction: column; border-top: 2px solid #333; }
        .panel-scroll-area { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 15px; }

        .config-group { background: #1a1a1a; padding: 15px; border-radius: 12px; transition: opacity 0.5s, max-height 0.5s; overflow: hidden; margin-bottom: 12px; border: 1px solid #333; }
        .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .slider-label { font-size: 0.95rem; font-weight: bold; color: var(--gray-light); display: flex; align-items: center;}
        .slider-label svg { width: 16px; height: 16px; margin-right: 6px; fill: var(--gray-light); }
        .target-val { font-size: 1.6rem; font-weight: 900; color: var(--neon-green); }
        input[type=range] { width: 100%; height: 30px; accent-color: var(--neon-green); margin-bottom: 5px; background: transparent;}

        .param-drawer summary { font-size: 0.95rem; color: var(--neon-blue); padding: 8px 0; outline: none; cursor: pointer; font-weight: bold; display: flex; align-items: center; }
        .param-drawer summary svg { width: 18px; height: 18px; fill: var(--neon-blue); margin-right: 6px; }
        .param-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; margin-bottom: 10px; }
        .param-item { background: #000; padding: 8px; border-radius: 8px; border: 1px solid #333; }
        .param-item label { display: block; color: var(--gray); font-size: 0.75rem; margin-bottom: 4px; text-align: center; }
        .param-item input { width: 100%; background: transparent; color: #FFF; border: none; font-size: 1.1rem; text-align: center; font-weight: bold; outline: none; }

        /* 卡拉OK風格預覽 */
        .preview-header { display: flex; align-items: center; color: var(--neon-green); font-size: 0.95rem; margin-bottom: 10px; font-weight: bold; padding-top: 10px;}
        .preview-header svg { width: 18px; height: 18px; fill: var(--neon-green); margin-right: 6px;}
        
        .preview-list { list-style: none; padding-bottom: 40px;}
        .preview-list li {
            padding: 12px 10px; border-bottom: 1px solid #222; font-size: 0.85rem; color: var(--gray);
            display: flex; justify-content: space-between; align-items: center;
            transition: background-color 0.4s ease, transform 0.3s ease, font-size 0.3s ease; border-radius: 8px;
        }
        .preview-list li.active-row {
            background-color: var(--active-bg); border-left: 4px solid var(--neon-green);
            transform: scale(1.02); font-size: 0.95rem; color: #FFF; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold;
        }
        .preview-list li span.min-tag { color: var(--text-main); font-weight: 900; width: 45px;}
        .preview-list li span.speed-tag { color: var(--neon-green); width: 60px;}
        .preview-list li span.inc-tag { color: var(--neon-yellow); width: 45px;}
        .preview-list li span.phase-tag { flex: 1; text-align: center; }
        .preview-list li span.bio-tag { color: var(--neon-blue); font-size: 0.75rem; width: 85px; text-align: right; display: flex; justify-content: flex-end; align-items: center;}
        .preview-list li span.bio-tag svg { width: 10px; height: 10px; fill: var(--neon-blue); margin: 0 2px 0 6px;}

        .hidden { display: none !important; max-height: 0; padding: 0; border: none; opacity: 0; }
        
        @media (min-width: 768px) { body { max-width: 600px; margin: 0 auto; border: 1px solid #333; } }
    </style>
</head>

            lac: '<svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 16c-3.35 0-6-2.57-6-6.2 0-2.34 1.95-5.44 6-9.14 4.05 3.7 6 6.79 6 9.14 0 3.63-2.65 6.2-6 6.2z"/></svg>'
        };

        class ProTreadmillApp {
            constructor() {
                this.dom = {
                    btnUiLang: document.getElementById('btnUiLang'),
                    uiLangText: document.getElementById('uiLangText'),
                    btnVoice: document.getElementById('btnVoice'),
                    voiceStateText: document.getElementById('voiceStateText'),

                    topProgressText: document.getElementById('topProgressText'),

                    time: document.getElementById('totalTime'),

                    cal: document.getElementById('accumCal'),

                // 自動偵測瀏覽器語言

                    uiLang: isBrowserZh ? 'zh' : 'en',
                    voiceState: isBrowserZh ? 'zh' : 'en', // 'zh', 'en', 'mute'
                    isRunning: false, wakeLock: null,
                    startTime: 0, accumulatedTimeMs: 0, matrix: [], currentMinuteIndex: -1,
                    flags: { preWarning: false, start: false, midTip: false }
                };

                // 超馬教練語音庫
                this.coachDict = {
                    warmup: {
                        zh: ["注意呼吸，兩步一吸兩步一呼，感受氧氣進入深層腹部。","我們正在喚醒慢肌纖維，把重心微向前傾，不要駝背。"],
                        en: ["Focus on breathing. In for two, out for two. Deep belly breaths.","We are waking up slow-twitch fibers. Lean slightly forward."]
                    },
                    steep: {
                        zh: ["坡度來了，縮小步幅提高步頻！核心收緊撐住腰椎！","心率在爬升，這是強化心肺做功的最佳時刻，挺住！"],
                        en: ["Incline is here! Shorten strides, quicken cadence. Brace your core!","Heart rate is climbing. This is cardiac output training at its best!"]
                    },
                    sprint: {
                        zh: ["無氧衝刺！步頻拉到180，前腳掌落地！","手臂保持90度快速擺動，速度帶動神經徵召，全力輸出！"],
                        en: ["Anaerobic sprint! Fast-twitch fibers engaged! 180 steps per minute!","Keep arms at 90 degrees. Fast arms equal fast legs. All out!"]
                    },
                    recovery: {
                        zh: ["主動恢復。深呼吸排出身體廢氣，讓血乳酸開始代謝。","跑得漂亮！維持輕鬆跑姿，讓粒線體合成能量。"],
                        en: ["Active recovery. Deep breaths to clear CO2 and metabolize lactate.","Beautiful work! Keep form relaxed while mitochondria synthesize ATP."]
                    },
                    exhaust: {
                        zh: ["最後的力竭陡坡！依靠強大意志力撐過去！","不准扶把手！挺直腰桿！把最後的肌醣原燃燒殆盡！"],
                        en: ["Final steep climb. Rely on pure mental toughness!","Don't touch the rails! Posture up! Burn the very last of your glycogen!"]
                    },
                    cooldown: {
                        zh: ["做得非常好。感謝你這段時間堅持下來的身體，慢慢緩和。","深層吐氣，享受腦內啡與多巴胺的釋放，這是跑者高潮。"],
                        en: ["Outstanding work. Thank your body for carrying you through this.","Deep exhales. Enjoy the endorphins and dopamine. Runner's high."]
                    },
                    highHR: {
                        zh: ["注意！心率突破無氧閾值！專注吐氣，穩住核心！"],
                        en: ["Warning! Heart rate above anaerobic threshold. Stay calm!"]
                    },
                    highLactate: {
                        zh: ["大腿非常酸對吧？乳酸濃度飆升，這是變強的必經之路！"],
                        en: ["Quads are burning! Lactate is spiking. This makes you stronger!"]
                    }
                };

                this.initRender();
                this.bindEvents();
                this.updateConstraints();
                this.generateMatrix(); 
            }

            // 初始化全域介面翻譯與圖示
            initRender() {
                // Render UI Texts
                const dict = i18n[this.state.uiLang];
                document.getElementById('lblSpeed').textContent = dict.speed;
                document.getElementById('lblIncline').textContent = dict.incline;
                document.getElementById('lblPace').textContent = dict.pace;
                document.getElementById('lblKcal').textContent = "kcal";
                document.getElementById('lblKm').textContent = "km";
                document.getElementById('lblStart').textContent = dict.start;
                document.getElementById('lblPause').textContent = dict.pause;
                document.getElementById('lblReset').textContent = dict.reset;
                document.getElementById('lblTotalTime').textContent = dict.totalTime;
                document.getElementById('lblTargetKm').textContent = dict.targetKm;
                document.getElementById('lblAge').textContent = dict.age;
                document.getElementById('lblWeight').textContent = dict.weight;
                document.getElementById('lblMaxSpd').textContent = dict.maxSpd;
                document.getElementById('lblMinSpd').textContent = dict.minSpd;
                document.getElementById('lblMaxInc').textContent = dict.maxInc;
                document.getElementById('lblMinInc').textContent = dict.minInc;
                document.getElementById('lblScienceParams').textContent = dict.scienceParams;
                document.getElementById('lblMatrixTitle').textContent = dict.matrixTitle;

                // Update UI Lang Button
                this.dom.uiLangText.textContent = this.state.uiLang.toUpperCase();
                
                // Update Voice Button
                this.updateVoiceBtnUi();
            }

            cycleUiLang() {
                this.state.uiLang = this.state.uiLang === 'zh' ? 'en' : 'zh';
                this.initRender();
                this.generateMatrix(); // 重繪列表中的 Phase 文字
            }

            cycleVoice() {
                if (this.state.voiceState === 'zh') this.state.voiceState = 'en';
                else if (this.state.voiceState === 'en') this.state.voiceState = 'mute';
                else this.state.voiceState = 'zh';
                this.updateVoiceBtnUi();

                try {
                    window.speechSynthesis.cancel();
                    if (this.state.voiceState !== 'mute') {
                        const u = new SpeechSynthesisUtterance(this.state.voiceState === 'zh' ? '語音切換' : 'Voice toggled');
                        u.rate = 1.0; u.pitch = 1.0; u.volume = 0.05; 
                        u.lang = this.state.voiceState === 'zh' ? 'zh-TW' : 'en-US';
                        window.speechSynthesis.speak(u);
                    }
                } catch(e) {}
            }

            updateVoiceBtnUi() {
                const btn = this.dom.btnVoice;
                const txt = this.dom.voiceStateText;
                const svg = this.dom.voiceIconSvg;
                
                btn.classList.remove('active', 'mute');
                if (this.state.voiceState === 'mute') {
                    btn.classList.add('mute');
                    txt.textContent = 'MUTE';
                    svg.innerHTML = SVGs.voiceMute;
                } else {
                    btn.classList.add('active');
                    txt.textContent = this.state.voiceState.toUpperCase();
                    svg.innerHTML = SVGs.voiceOn;
                }
            }

            bindEvents() {
                this.dom.btnUiLang.addEventListener('click', () => this.cycleUiLang());
                this.dom.btnVoice.addEventListener('click', () => this.cycleVoice());

                this.dom.targetTime.addEventListener('input', () => {
                    document.getElementById('targetTimeVal').textContent = this.dom.targetTime.value + ' min';
                    this.updateConstraints();
                    this.generateMatrix();
                });

                const inputs = [this.dom.targetKm, this.dom.age, this.dom.weight, this.dom.maxSpd, this.dom.minSpd, this.dom.maxInc, this.dom.minInc];
                inputs.forEach(input => {
                    input.addEventListener('input', () => {
                        if(input === this.dom.targetKm) document.getElementById('targetKmVal').textContent = parseFloat(input.value).toFixed(1) + ' km';
                        this.updateConstraints();
                        this.generateMatrix();
                    });
                });

                this.dom.btnStart.addEventListener('click', () => this.start());
                this.dom.btnPause.addEventListener('click', () => this.pause());
                this.dom.btnReset.addEventListener('click', () => this.reset());

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible' && this.state.isRunning) this.requestWakeLock();
                });
            }

            updateConstraints() {
                const T = parseFloat(this.dom.targetTime.value);
                const maxS = parseFloat(this.dom.maxSpd.value);
                const minS = parseFloat(this.dom.minSpd.value);
                let physicalMaxKm = (T / 60) * maxS;
                let physicalMinKm = (T / 60) * minS;
                this.dom.targetKm.max = physicalMaxKm.toFixed(1);
                this.dom.targetKm.min = physicalMinKm.toFixed(1);

                let currentKm = parseFloat(this.dom.targetKm.value);
                if (currentKm > physicalMaxKm) currentKm = physicalMaxKm;
                if (currentKm < physicalMinKm) currentKm = physicalMinKm;
                
                this.dom.targetKm.value = currentKm.toFixed(1);
                document.getElementById('targetKmVal').textContent = currentKm.toFixed(1) + ' km';
            }

            speak(textZh, textEn) {
                if (this.state.voiceState === 'mute') return;
                try {
                    window.speechSynthesis.cancel(); 
                    const isZh = this.state.voiceState === 'zh';
                    const safeText = isZh ? textZh.substring(0, 50) : textEn.substring(0, 60);
                    const u = new SpeechSynthesisUtterance(safeText);
                    u.rate = 1.0; u.pitch = 1.0; u.lang = isZh ? 'zh-TW' : 'en-US';
                    window.speechSynthesis.speak(u);
                } catch(e) {}
            }

            async requestWakeLock() {
                try { if ('wakeLock' in navigator) this.state.wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }

            generateMatrix() {
                const T = parseInt(this.dom.targetTime.value);
                const D = parseFloat(this.dom.targetKm.value);
                const W = parseFloat(this.dom.weight.value);
                const Age = parseInt(this.dom.age.value);
                const maxS = parseFloat(this.dom.maxSpd.value);
                const minS = parseFloat(this.dom.minSpd.value);
                const maxI = parseFloat(this.dom.maxInc.value);
                const minI = parseFloat(this.dom.minInc.value);

                let matrix = new Array(T);
                let wLen = Math.max(1, Math.floor(T * 0.1));
                let sLen = Math.max(1, Math.floor(T * 0.15));
                let eLen = Math.max(1, Math.floor(T * 0.1));
                let cLen = Math.max(2, Math.floor(T * 0.15));
                let iLen = T - wLen - sLen - eLen - cLen; 
                if (iLen < 0) { wLen=1; sLen=2; eLen=1; cLen=2; iLen = T-6; }

                let avgSpeed = (D / T) * 60;
                let intensity = (avgSpeed - minS) / (maxS - minS);
                if (isNaN(intensity) || intensity < 0) intensity = 0;
                if (intensity > 1) intensity = 1;

                let currentIndex = 0;
                for(let i=0; i<wLen; i++) {
                    let s = minS + (intensity * 2) + (i * 0.3);
                    matrix[currentIndex++] = { spd: Math.max(minS, Math.min(s, maxS)), inc: minI+1, phase: "warmup" };
                }
                let steepSpd = Math.max(minS, Math.min(minS + (intensity * (maxS-minS)*0.6), maxS));
                for(let i=0; i<sLen; i++) matrix[currentIndex++] = { spd: steepSpd, inc: maxI, phase: "steep" };
                
                let sprintSpd = Math.max(minS, Math.min(minS + (intensity * (maxS-minS)) + 2.0, maxS));
                for(let i=0; i<iLen; i++) {
                    if (i === 0 || i >= iLen - 2) {
                        matrix[currentIndex++] = { spd: Math.max(minS, Math.min(minS + (intensity * (maxS-minS)*0.4), maxS)), inc: minI, phase: "recovery" };
                    } else {
                        if (i % 2 !== 0) matrix[currentIndex++] = { spd: sprintSpd, inc: minI, phase: "sprint" };
                        else matrix[currentIndex++] = { spd: 0, inc: minI, phase: "recovery" }; 
                    }
                }
                let exhaustSpd = Math.max(minS, Math.min(minS + (intensity * (maxS-minS)*0.5), maxS));
                for(let i=0; i<eLen; i++) matrix[currentIndex++] = { spd: exhaustSpd, inc: maxI, phase: "exhaust" };
                for(let i=0; i<cLen; i++) {
                    matrix[currentIndex++] = { spd: Math.max(minS, Math.min(minS + (cLen-i-1)*0.5, maxS)), inc: minI, phase: "cooldown" };
                }

                let fixedDist = 0, jogCount = 0;
                for(let i=0; i<T; i++) {
                    if (matrix[i].spd > 0 && i !== T-1) fixedDist += matrix[i].spd / 60;
                    if (matrix[i].spd === 0) jogCount++;
                }
                if (jogCount > 0) {
                    let jogSpd = Math.max(minS, Math.min(((D - fixedDist - (minS/60)) / jogCount) * 60, maxS));
                    for(let i=0; i<T; i++) if (matrix[i].spd === 0) matrix[i].spd = jogSpd;
                }
                let preLastDist = 0;
                for(let i=0; i<T-1; i++) preLastDist += matrix[i].spd / 60;
                matrix[T-1] = { spd: Math.max(minS, (D - preLastDist) * 60), inc: minI, phase: "cooldown" };

                let cumCal = 0, cumDist = 0;
                let maxHR = 220 - Age, restHR = 60, HRR = maxHR - restHR;
                let currentSimHR = 75, currentLac = 1.0, fatigueAcc = 0;

                for(let i=0; i<T; i++) {
                    let speed = matrix[i].spd, incDec = matrix[i].inc / 100, spdM = (speed * 1000) / 60;
                    let vo2 = speed < 8.0 ? (0.1 * spdM) + (1.8 * spdM * incDec) + 3.5 : (0.2 * spdM) + (0.9 * spdM * incDec) + 3.5;
                    let cal = (vo2 * W * 5) / 1000, dist = speed / 60;
                    cumCal += cal; cumDist += dist;

                    let intensityVO2 = Math.min(vo2 / (maxS * 3.5), 1.1);
                    currentSimHR += ((restHR + (intensityVO2 * HRR) + (i * 0.15)) - currentSimHR) * 0.6; 
                    let pctMaxHR = currentSimHR / maxHR;
                    if (pctMaxHR > 0.85) currentLac += (pctMaxHR - 0.8) * 2.0; else currentLac = Math.max(1.0, currentLac - 0.3);
                    fatigueAcc += (intensityVO2 * 1.5) * (1 + (currentLac * 0.05));

                    matrix[i] = { ...matrix[i], m: i + 1, cal, dist, cumCal, cumDist, vo2, hr: Math.round(currentSimHR), lac: currentLac, fatigue: Math.min((fatigueAcc / T) * 100, 99) };
                }

                this.state.matrix = matrix;
                this.updatePreviewAndEstimates(cumCal, D, T);
                if(this.state.isRunning && this.state.currentMinuteIndex >= 0) this.scrollToCurrentMinute();
            }

            updatePreviewAndEstimates(totalCal, totalDist, totalTime) {
                const dict = i18n[this.state.uiLang];
                let avgSpd = (totalDist / totalTime) * 60; 
                let paceMin = Math.floor(60 / avgSpd), paceSec = Math.floor((60 / avgSpd - paceMin) * 60);
                this.dom.sliderEst.textContent = `${dict.estPrefix}: ${Math.round(totalCal)} kcal | ${dict.avgSpd}: ${avgSpd.toFixed(1)} kph | ${dict.pace}: ${String(paceMin).padStart(2,'0')}'${String(paceSec).padStart(2,'0')}"`;

                this.dom.previewList.innerHTML = '';
                this.state.matrix.forEach((row, idx) => {
                    let li = document.createElement('li');
                    li.id = `min-row-${idx}`;
                    if (idx === this.state.currentMinuteIndex) li.classList.add('active-row');
                    
                    let phaseText = dict.phases[row.phase] || row.phase;
                    
                    li.innerHTML = `
                        <span class="min-tag">${String(row.m).padStart(2,'0')}m</span>
                        <span class="speed-tag">${row.spd.toFixed(1)}kph</span>
                        <span class="inc-tag">${row.inc}%</span>
                        <span class="phase-tag">${phaseText}</span>
                        <span class="bio-tag">${SVGs.hr}${row.hr} ${SVGs.lac}${row.lac.toFixed(1)}</span>
                    `;
                    this.dom.previewList.appendChild(li);
                });
            }

            start() {
                this.requestWakeLock();
                this.dom.btnStart.classList.add('hidden');
                this.dom.btnPause.classList.remove('hidden');
                this.dom.coreGroup.classList.add('hidden'); 
                
                this.state.isRunning = true;
                this.state.startTime = Date.now() - this.state.accumulatedTimeMs;
                
                let T = this.state.matrix.length;
                this.dom.time.textContent = `${String(T).padStart(2,'0')}:00.0`;

                // 立即觸發空語音解鎖裝置限制
                this.speak("", "");
                
                this.tick();
            }

            pause() {
                this.state.isRunning = false;
                this.dom.btnPause.classList.add('hidden');
                this.dom.btnStart.classList.remove('hidden');
                if(this.state.wakeLock !== null) { this.state.wakeLock.release(); this.state.wakeLock = null; }
            }

            reset() {
                this.pause();
                this.state.accumulatedTimeMs = 0;
                this.state.currentMinuteIndex = -1;
                this.state.flags = { preWarning: false, start: false, midTip: false };
                this.dom.coreGroup.classList.remove('hidden');
                this.generateMatrix(); 
                this.updateDashboard(0);
                this.dom.topProgressBar.style.width = "0%";
                this.dom.topProgressText.textContent = "00.0%";
                this.scrollToCurrentMinute(); 
            }

            tick() {
                if(!this.state.isRunning) return;
                const now = Date.now();
                this.state.accumulatedTimeMs = now - this.state.startTime;
                
                const T_ms = this.state.matrix.length * 60 * 1000;
                if(this.state.accumulatedTimeMs >= T_ms) {
                    this.state.accumulatedTimeMs = T_ms;
                    this.updateDashboard(T_ms);
                    this.speak("完美的訓練！生理數據已全部達標！", "Perfect workout! All physiological targets met!");
                    this.pause();
                    return;
                }
                this.updateDashboard(this.state.accumulatedTimeMs);
                requestAnimationFrame(() => this.tick());
            }

            scrollToCurrentMinute() {
                const listItems = this.dom.previewList.querySelectorAll('li');
                listItems.forEach(li => li.classList.remove('active-row'));
                if(this.state.currentMinuteIndex >= 0 && this.state.currentMinuteIndex < this.state.matrix.length) {
                    const activeRow = document.getElementById(`min-row-${this.state.currentMinuteIndex}`);
                    if(activeRow) {
                        activeRow.classList.add('active-row');
                        activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }

            updateDashboard(elapsedMs) {
                const totalSec = Math.floor(elapsedMs / 1000);
                const msFrac = Math.floor((elapsedMs % 1000) / 100);
                const totalTargetSec = this.state.matrix.length * 60;
                
                const remainSec = totalTargetSec - totalSec;
                const m = Math.floor(remainSec / 60);
                const s = remainSec % 60;
                this.dom.time.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${msFrac === 10 ? 9 : msFrac}`;

                // 更新全域頂部進度條
                const totalPct = ((elapsedMs / (totalTargetSec * 1000)) * 100).toFixed(1);
                this.dom.topProgressBar.style.width = `${totalPct}%`;
                this.dom.topProgressText.textContent = `${totalPct.padStart(4, '0')}%`;

                let currentMinIdx = Math.floor(elapsedMs / 60000);
                if (currentMinIdx >= this.state.matrix.length) currentMinIdx = this.state.matrix.length - 1;
                const timeWithinMinuteMs = elapsedMs % 60000;

                const currentData = this.state.matrix[currentMinIdx];
                
                if(currentMinIdx !== this.state.currentMinuteIndex) {
                    this.state.currentMinuteIndex = currentMinIdx;
                    this.state.flags = { preWarning: false, start: false, midTip: false };
                    
                    this.dom.speed.textContent = currentData.spd.toFixed(1);
                    this.dom.incline.textContent = currentData.inc.toFixed(1);
                    let pMin = Math.floor(60 / currentData.spd);
                    let pSec = Math.floor((60 / currentData.spd - pMin) * 60);
                    this.dom.pace.textContent = `${String(pMin).padStart(2,'0')}'${String(pSec).padStart(2,'0')}"`;

                    this.scrollToCurrentMinute();
                }

                let prevCal = currentMinIdx > 0 ? this.state.matrix[currentMinIdx-1].cumCal : 0;
                let prevDist = currentMinIdx > 0 ? this.state.matrix[currentMinIdx-1].cumDist : 0;
                let prevHR = currentMinIdx > 0 ? this.state.matrix[currentMinIdx-1].hr : 75;
                let prevLac = currentMinIdx > 0 ? this.state.matrix[currentMinIdx-1].lac : 1.0;
                let prevFatigue = currentMinIdx > 0 ? this.state.matrix[currentMinIdx-1].fatigue : 0;

                let ratio = timeWithinMinuteMs / 60000;
                this.dom.cal.textContent = Math.floor(prevCal + (currentData.cal * ratio));
                this.dom.dist.textContent = (prevDist + (currentData.dist * ratio)).toFixed(2);
                
                let instantHR = prevHR + ((currentData.hr - prevHR) * ratio);
                let instantLac = prevLac + ((currentData.lac - prevLac) * ratio);
                let instantFatigue = prevFatigue + ((currentData.fatigue - prevFatigue) * ratio);
                
                this.dom.valHR.textContent = Math.round(instantHR);
                this.dom.valLac.textContent = instantLac.toFixed(1);
                this.dom.valFatigue.textContent = instantFatigue.toFixed(0);

                // 語音動態觸發
                if(timeWithinMinuteMs > 500 && timeWithinMinuteMs < 2000 && !this.state.flags.start) {
                    this.state.flags.start = true;
                    if(currentMinIdx === 0) {
                        this.speak(`訓練開始！總時長${this.state.matrix.length}分鐘。`, `Workout begins! Duration ${this.state.matrix.length} minutes.`);
                    } else if (currentMinIdx % 10 === 0) {
                        this.speak(`已完成${currentMinIdx}分鐘，疲勞指數百分之${Math.round(instantFatigue)}。`, `Minute ${currentMinIdx}. Fatigue level ${Math.round(instantFatigue)} percent.`);
                    }
                }

                if(timeWithinMinuteMs >= 30000 && timeWithinMinuteMs < 31500 && !this.state.flags.midTip) {
                    this.state.flags.midTip = true;
                    let isZh = this.state.voiceState === 'zh';
                    let maxHR = 220 - parseInt(this.dom.age.value);
                    if (instantHR > maxHR * 0.9) {
                        let lines = this.coachDict.highHR[isZh ? 'zh' : 'en'];
                        this.speak(isZh?lines[0]:"", isZh?"":lines[0]);
                    } else if (instantLac > 4.0 && currentData.phase !== 'recovery') {
                        let lines = this.coachDict.highLactate[isZh ? 'zh' : 'en'];
                        this.speak(isZh?lines[0]:"", isZh?"":lines[0]);
                    } else {
                        let phaseDict = this.coachDict[currentData.phase][isZh ? 'zh' : 'en'];
                        if(phaseDict) {
                            let randomTip = phaseDict[Math.floor(Math.random() * phaseDict.length)];
                            this.speak(isZh?randomTip:"", isZh?"":randomTip);
                        }
                    }
                }

                if(timeWithinMinuteMs >= 55000 && !this.state.flags.preWarning && currentMinIdx < this.state.matrix.length - 1) {
                    this.state.flags.preWarning = true;
                    let nextData = this.state.matrix[currentMinIdx + 1];
                    this.speak(`即將切換，速度${nextData.spd.toFixed(1)}，坡度${nextData.inc}。`, `Next stage. Speed ${nextData.spd.toFixed(1)}, incline ${nextData.inc}.`);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => { window.app = new ProTreadmillApp(); });
    </script>
</body>
</html>
