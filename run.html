        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        #app-container { width: 100%; max-width: 600px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; border-left: 1px solid #333; border-right: 1px solid #333; background-color: var(--bg-dark); }
        .top-nav { flex-shrink: 0; width: 100%; background-color: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 75px; z-index: 100; }
        .circle-btn { width: 50px; height: 50px; border-radius: 50%; background-color: #222; border: 2px solid var(--gray); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; color: var(--gray-light); fill: var(--gray-light); outline: none; flex-shrink: 0; }
        .circle-btn.active { border-color: var(--neon-green); color: var(--neon-green); fill: var(--neon-green); background-color: var(--neon-green-dim); }
        .circle-btn.mute { border-color: var(--gray); color: var(--gray); fill: var(--gray); background-color: transparent; }
        .circle-btn svg { width: 22px; height: 22px; }
        .btn-text { font-size: 0.65rem; font-weight: 800; margin-top: 3px; text-transform: uppercase; }
        .top-progress-wrapper { flex: 1; margin: 0 20px; display: flex; flex-direction: column; align-items: center; }
        .top-progress-text { font-size: 1.3rem; font-weight: 900; color: var(--neon-green); font-variant-numeric: tabular-nums; letter-spacing: 1px; margin-bottom: 4px; }
        .top-progress-track { width: 100%; height: 8px; background-color: #000; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .top-progress-fill { width: 0%; height: 100%; background-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); transition: width 0.3s linear; }
        .bio-bar { flex-shrink: 0; display: flex; justify-content: space-around; background: #000; padding: 10px; font-size: 0.9rem; border-bottom: 1px solid #222;}
        .bio-item { display: flex; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums;}
        .bio-item svg { width: 18px; height: 18px; margin-right: 6px; }
        .bio-hr { color: var(--neon-red); fill: var(--neon-red); }
        .bio-lac { color: var(--neon-yellow); fill: var(--neon-yellow); }
        .bio-fatigue { color: var(--neon-blue); fill: var(--neon-blue); }
        .dashboard { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; min-height: 220px; }

        .preview-list li { padding: 14px 10px; border-bottom: 1px solid #222; font-size: 0.9rem; color: var(--gray); display: flex; justify-content: space-between; align-items: center; border-radius: 8px; transition: all 0.3s ease; }

        @keyframes pulse-speed {
            0% { transform: scale(1); text-shadow: 0 0 5px var(--neon-green); background-color: transparent;}
            50% { transform: scale(1.2); text-shadow: 0 0 20px var(--neon-green); background-color: rgba(57,255,20,0.3); color:#fff; border-radius: 4px;}
            100% { transform: scale(1); text-shadow: 0 0 5px var(--neon-green); background-color: transparent;}
        }
        @keyframes pulse-inc {
            0% { transform: scale(1); text-shadow: 0 0 5px var(--neon-yellow); background-color: transparent;}
            50% { transform: scale(1.2); text-shadow: 0 0 20px var(--neon-yellow); background-color: rgba(255,214,10,0.3); color:#fff; border-radius: 4px;}
            100% { transform: scale(1); text-shadow: 0 0 5px var(--neon-yellow); background-color: transparent;}
        }

 * =========================================================================
 * 終極洗牌引擎 (Pseudo-Random Bag)
 * 確保在講完所有選項前，絕對不重複！
 * =========================================================================
 */
class PseudoRandom {
    constructor() { this.bags = {}; }
    get(categoryKey, array) {
        if (!this.bags[categoryKey] || this.bags[categoryKey].length === 0) {
            let indices = Array.from({length: array.length}, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            this.bags[categoryKey] = indices;
        }
        return array[this.bags[categoryKey].pop()];
    }
}

    en: { tSet: "Settings", tMat: "Matrix", spd: "Speed", inc: "Incline", pac: "Pace", sta: "Start", pau: "Pause", res: "Reset", tim: "Total Time(min)", km: "Target(km)", age: "Age", wgt: "Weight(kg)", mxS: "Max Spd", mnS: "Min Spd", mxI: "Max Inc", mnI: "Min Inc", sci: "Biomechanics & Physio", est: "Est.", avg: "Avg" }
};

class VoiceEngine {
    constructor(appState) {
        this.state = appState;
        this.lastSpoken = 0;
        this.cooldownMs = 35000; // 縮短冷卻以應對海量語音
    }
    
    speak(text, priority = 0) {
        if (this.state.voiceState === 'mute' || !text) return;
        const now = Date.now();
        if (priority === 0 && (now - this.lastSpoken < this.cooldownMs)) return;
        
        try {
            if(priority > 0) window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = this.state.voiceState === 'zh' ? 'zh-TW' : 'en-US';
            u.rate = 1.0; u.pitch = 1.0;
            window.speechSynthesis.speak(u);
            this.lastSpoken = now;
        } catch(e) {}
    }

    speakTransition(s, i) {
        if (this.state.voiceState === 'mute') return;
        const db = VoiceDB[this.state.voiceState];
        let template = PRNG.get('trans_' + this.state.voiceState, db.trans);
        let text = template.replace('{s}', s.toFixed(1)).replace('{i}', i);
        this.speak(text, 1); // priority 1 確保蓋過其他語音
    }

    evaluateAndSpeak(d) {
        let lang = this.state.voiceState;
        if(lang === 'mute') return;
        const db = VoiceDB[lang];
        
        let ageInput = document.getElementById('ageParam').value;
        let safeAge = parseInt(ageInput) || 38;
        let maxHR = 208 - (0.7 * safeAge);
        let hrPct = d.hr / maxHR;
        
        if (hrPct > 0.95) { this.speak(PRNG.get('w_hr_'+lang, db.warn_hr), 1); return; }
        if (d.lac > 4.5 && d.phase !== 'recovery' && d.phase !== 'cooldown') { this.speak(PRNG.get('w_lac_'+lang, db.warn_lac), 1); return; }

        let isRec = (d.phase === 'recovery' || d.phase === 'cooldown');
        let isWarm = (d.phase === 'warmup');
        let isSteep = (d.inc > 6);
        let fatigue = d.fatigue < 40 ? 'low' : (d.fatigue < 75 ? 'mid' : 'high');
        let parts = [];
        
        if (isRec) {
            parts.push(PRNG.get('v_rec_'+lang, db.val_rec), PRNG.get('p_rec_'+lang, db.phy_rec), PRNG.get('b_gen_'+lang, db.bio_gen));
        } else if (isWarm) {
            parts.push(PRNG.get('v_low_'+lang, db.val_low), PRNG.get('p_war_'+lang, db.phy_warm), PRNG.get('b_gen_'+lang, db.bio_gen));
        } else if (fatigue === 'high' || hrPct > 0.88) {
            parts.push(PRNG.get('v_hi_'+lang, db.val_high), PRNG.get(isSteep ? 'b_stp_'+lang:'b_flt_'+lang, isSteep ? db.bio_steep : db.bio_flat), PRNG.get('ps_ov_'+lang, db.psy_over), PRNG.get('ps_mic_'+lang, db.psy_micro));
        } else {
            parts.push(PRNG.get('v_mid_'+lang, db.val_mid), PRNG.get('p_aer_'+lang, db.phy_aero), PRNG.get('ps_foc_'+lang, db.psy_focus), PRNG.get('b_gen_'+lang, db.bio_gen));
        }

        let finalSentence = parts.sort(() => 0.5 - Math.random()).slice(0, 3).join(" ");
        this.speak(finalSentence);
    }
}

class ProTreadmillApp {
    constructor() {
        this.dom = {
            langBtn: document.getElementById('btnUiLang'), langTxt: document.getElementById('uiLangText'),
            voiceBtn: document.getElementById('btnVoice'), voiceTxt: document.getElementById('voiceStateText'), voiceSvg: document.getElementById('voiceIconSvg'),
            barF: document.getElementById('topProgressBar'), barT: document.getElementById('topProgressText'),
            time: document.getElementById('totalTime'), spd: document.getElementById('currentSpeed'), inc: document.getElementById('currentIncline'), pac: document.getElementById('currentPace'), cal: document.getElementById('accumCal'), dist: document.getElementById('accumDist'),
            hr: document.getElementById('valHR'), lac: document.getElementById('valLac'), fat: document.getElementById('valFatigue'),
            start: document.getElementById('btnStart'), pause: document.getElementById('btnPause'), reset: document.getElementById('btnReset'),
            tTime: document.getElementById('targetTime'), tKm: document.getElementById('targetKm'), est: document.getElementById('sliderEstimation'),
            age: document.getElementById('ageParam'), wgt: document.getElementById('weightParam'),
            mxS: document.getElementById('maxSpdParam'), mnS: document.getElementById('minSpdParam'), mxI: document.getElementById('maxIncParam'), mnI: document.getElementById('minIncParam'),
            list: document.getElementById('previewList')
        };

        this.state = { uiLang: 'zh', voiceState: 'zh', isRunning: false, startTime: 0, accumMs: 0, matrix: [], currMinIdx: -1, wakeLock: null, transFired: {} };
        this.ve = new VoiceEngine(this.state);
        
        this.loadPreferences();
        this.initRender(); 
        this.bindEvents(); 
        this.updateConstraints();
    }

    calculateDefaultAge() {
        const b = new Date('1986-08-04'), t = new Date();
        let a = t.getFullYear() - b.getFullYear(); 
        if(t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) a--;
        return a;
    }

    loadPreferences() {
        try {
            const saved = localStorage.getItem('pro_treadmill_v6_olympic');
            const isBrowserZh = (navigator.language || "en").toLowerCase().includes('zh');
            
            if (saved) {
                const prefs = JSON.parse(saved);
                this.state.uiLang = prefs.uiLang || (isBrowserZh ? 'zh' : 'en');
                this.state.voiceState = prefs.voiceState || (isBrowserZh ? 'zh' : 'en');
                this.dom.tTime.value = prefs.tTime || 60;
                this.dom.tKm.value = prefs.tKm || 6.0;
                this.dom.age.value = prefs.age || this.calculateDefaultAge();
                this.dom.wgt.value = prefs.wgt || 70;
                this.dom.mxS.value = prefs.mxS || 13.0;
                this.dom.mnS.value = prefs.mnS || 6.0;
                this.dom.mxI.value = prefs.mxI || 12;
                this.dom.mnI.value = prefs.mnI || 0;
            } else {
                this.state.uiLang = isBrowserZh ? 'zh' : 'en';
                this.state.voiceState = isBrowserZh ? 'zh' : 'en';
                this.dom.age.value = this.calculateDefaultAge();
                this.dom.wgt.value = 70;
                this.dom.mxS.value = 13.0;
                this.dom.mnS.value = 6.0;
                this.dom.mxI.value = 12;
                this.dom.mnI.value = 0;
                this.dom.tTime.value = 60;
                this.dom.tKm.value = 6.0;
            }
        } catch (e) {
            this.dom.age.value = this.calculateDefaultAge();
            this.dom.wgt.value = 70; this.dom.mxS.value = 13.0; this.dom.mnS.value = 6.0;
            this.dom.mxI.value = 12; this.dom.mnI.value = 0; this.dom.tTime.value = 60; this.dom.tKm.value = 6.0;
        }
    }

    savePreferences() {
        if(this.state.isRunning) return;
        const prefs = {
            uiLang: this.state.uiLang, voiceState: this.state.voiceState,
            tTime: this.dom.tTime.value, tKm: this.dom.tKm.value,
            age: this.dom.age.value, wgt: this.dom.wgt.value,
            mxS: this.dom.mxS.value, mnS: this.dom.mnS.value,
            mxI: this.dom.mxI.value, mnI: this.dom.mnI.value
        };
        localStorage.setItem('pro_treadmill_v6_olympic', JSON.stringify(prefs));
    }

    initRender() {
        const d = i18n[this.state.uiLang];
        document.getElementById('tabSettings').textContent = d.tSet; document.getElementById('tabMatrix').textContent = d.tMat;
        document.getElementById('lblSpeed').textContent = d.spd; document.getElementById('lblIncline').textContent = d.inc; document.getElementById('lblPace').textContent = d.pac;
        document.getElementById('lblStart').textContent = d.sta; document.getElementById('lblPause').textContent = d.pau; document.getElementById('lblReset').textContent = d.res;
        document.getElementById('lblTotalTime').textContent = d.tim; document.getElementById('lblTargetKm').textContent = d.km;
        document.getElementById('lblAge').textContent = d.age; document.getElementById('lblWeight').textContent = d.wgt;
        document.getElementById('lblMaxSpd').textContent = d.mxS; document.getElementById('lblMinSpd').textContent = d.mnS;
        document.getElementById('lblMaxInc').textContent = d.mxI; document.getElementById('lblMinInc').textContent = d.mnI;
        document.getElementById('lblScienceParams').textContent = d.sci;
        
        document.getElementById('targetTimeVal').textContent = this.dom.tTime.value;
        document.getElementById('targetKmVal').textContent = parseFloat(this.dom.tKm.value).toFixed(1);
        this.dom.langTxt.textContent = this.state.uiLang.toUpperCase();
        this.updateVoiceUI(); this.updateConstraints();
    }

    bindEvents() {
        this.dom.langBtn.addEventListener('click', () => { this.state.uiLang = this.state.uiLang === 'zh' ? 'en' : 'zh'; this.savePreferences(); this.initRender(); });
        this.dom.voiceBtn.addEventListener('click', () => {
            let v = this.state.voiceState; this.state.voiceState = v==='zh'?'en':(v==='en'?'mute':'zh');
            this.savePreferences(); this.updateVoiceUI(); 
            this.ve.speak(this.state.voiceState === 'zh' ? '語音切換' : 'Voice toggled', 1);
        });

        [this.dom.tTime, this.dom.tKm, this.dom.age, this.dom.wgt, this.dom.mxS, this.dom.mnS, this.dom.mxI, this.dom.mnI].forEach(el => 
            el.addEventListener('input', () => {
                if(el===this.dom.tTime) document.getElementById('targetTimeVal').textContent = el.value || "60";
                if(el===this.dom.tKm) document.getElementById('targetKmVal').textContent = parseFloat(el.value || 6).toFixed(1);
                this.updateConstraints(); this.savePreferences();
            })
        );
        this.dom.start.addEventListener('click', () => this.start());
        this.dom.pause.addEventListener('click', () => this.pause());
        this.dom.reset.addEventListener('click', () => this.reset());
        document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && this.state.isRunning) this.reqWL(); });
    }

    switchTab(t) {
        document.getElementById('tabSettings').classList.remove('active'); document.getElementById('tabMatrix').classList.remove('active');
        document.getElementById('panelSettings').classList.remove('active'); document.getElementById('panelMatrix').classList.remove('active');
        if(t==='settings') { document.getElementById('tabSettings').classList.add('active'); document.getElementById('panelSettings').classList.add('active'); }
        else { document.getElementById('tabMatrix').classList.add('active'); document.getElementById('panelMatrix').classList.add('active'); this.scrollToRow(); }
    }

    updateVoiceUI() {
        let v = this.state.voiceState; this.dom.voiceBtn.className = `circle-btn ${v==='mute'?'mute':'active'}`; this.dom.voiceTxt.textContent = v.toUpperCase();
        this.dom.voiceSvg.innerHTML = v==='mute'?'<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>':'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }

    updateConstraints() {
        let T = parseFloat(this.dom.tTime.value) || 60, mxS = parseFloat(this.dom.mxS.value) || 13.0, mnS = parseFloat(this.dom.mnS.value) || 6.0;
        if(mnS > mxS) { mnS = mxS; this.dom.mnS.value = mnS; }
        let pMx = (T/60)*mxS, pMn = (T/60)*mnS;
        this.dom.tKm.max = pMx.toFixed(1); this.dom.tKm.min = pMn.toFixed(1);
        let cKm = parseFloat(this.dom.tKm.value) || 6.0; cKm = Math.min(Math.max(cKm, pMn), pMx);
        this.dom.tKm.value = cKm.toFixed(1); document.getElementById('targetKmVal').textContent = cKm.toFixed(1);
        this.generateMatrix();
    }

    generateMatrix() {
        let T=parseInt(this.dom.tTime.value)||60, D=parseFloat(this.dom.tKm.value)||6.0, W=parseFloat(this.dom.wgt.value)||70, A=parseInt(this.dom.age.value)||38;
        let mxS=parseFloat(this.dom.mxS.value)||13.0, mnS=parseFloat(this.dom.mnS.value)||6.0, mxI=parseFloat(this.dom.mxI.value)||12, mnI=parseFloat(this.dom.mnI.value)||0;
        
        let avgS = (D/T)*60, int = mxS===mnS ? 0.5 : Math.max(0, Math.min(1, (avgS-mnS)/(mxS-mnS)));

        let m = new Array(T), wL=Math.max(1,Math.floor(T*0.1)), sL=Math.max(1,Math.floor(T*0.15)), eL=Math.max(1,Math.floor(T*0.1)), cL=Math.max(2,Math.floor(T*0.15)), iL=T-wL-sL-eL-cL;
        if(iL<0){wL=1;sL=1;eL=1;cL=2;iL=T-5;}

        let idx=0;
        for(let i=0;i<wL;i++) m[idx++]={spd: mnS+(int*2)+(i*0.3), inc: mnI+1, phase:'warmup'};
        for(let i=0;i<sL;i++) m[idx++]={spd: mnS+(int*(mxS-mnS)*0.6), inc: mxI, phase:'steep'};
        let spr = mnS+(int*(mxS-mnS))+2.0, rec = mnS+(int*(mxS-mnS)*0.4);
        for(let i=0;i<iL;i++) m[idx++]={spd: (i%2!==0&&i!==iL-1)?spr:rec, inc: mnI, phase: (i%2!==0&&i!==iL-1)?'sprint':'recovery'};
        for(let i=0;i<eL;i++) m[idx++]={spd: mnS+(int*(mxS-mnS)*0.5), inc: mxI, phase:'exhaust'};
        for(let i=0;i<cL;i++) m[idx++]={spd: mnS+((cL-i-1)*0.5), inc: mnI, phase:'cooldown'};

        let cD = 0; for(let i=0;i<T;i++){ m[i].spd = Math.max(mnS, Math.min(m[i].spd, mxS)); cD += m[i].spd/60; }
        let diff = D - cD; for(let i=0;i<T;i++) m[i].spd = Math.max(mnS, Math.min(mxS, m[i].spd + (diff/T)*60));

        let cC=0, ccD=0, mHR=208-(0.7*A), cHR=75, cLac=1.0, fAcc=0;
        for(let i=0;i<T;i++) {
            let s=m[i].spd, incD=m[i].inc/100, sM=(s*1000)/60;
            let vW = (0.1*sM)+(1.8*sM*incD)+3.5, vR = (0.2*sM)+(0.9*sM*incD)+3.5;
            let vo2 = s<7.0 ? vW : (s>9.0 ? vR : vW+(vR-vW)*((s-7.0)/2.0));
            cC += (vo2*W*5)/1000; ccD += s/60;
            let tHR = 60 + ((vo2/((mxS*1000/60*0.2)+3.5))*(mHR-60));
            cHR += (tHR - cHR) * 0.4;
            let pHR = cHR/mHR; if(pHR>0.85) cLac+=(pHR-0.8)*2.5; else cLac=Math.max(1.0, cLac-0.4);
            fAcc += (pHR*1.5)*(1+(cLac*0.05));
            m[i] = {...m[i], m:i+1, cal:(vo2*W*5)/1000, dist:s/60, cC, ccD, hr:Math.round(cHR), lac:cLac, fat:Math.min((fAcc/T)*100,99)};
        }
        this.state.matrix = m; this.renderPreview();
    }

    renderPreview() {
        if(!this.state.matrix || this.state.matrix.length === 0) return;
        const d = i18n[this.state.uiLang]; let T=this.state.matrix.length, lD=this.state.matrix[T-1];
        let pM=Math.floor(60/(lD.ccD/T*60)), pS=Math.floor((60/(lD.ccD/T*60)-pM)*60);
        let safeCal = isNaN(lD.cC) ? "--" : Math.round(lD.cC); let safeAvg = isNaN(lD.ccD) ? "--" : (lD.ccD/T*60).toFixed(1);
        let safePace = isNaN(pM) || isNaN(pS) ? "--'--" : `${String(pM).padStart(2,'0')}'${String(pS).padStart(2,'0')}"`;
        
        this.dom.est.textContent = `${d.est}: ${safeCal} kcal | ${d.avg}: ${safeAvg} kph | ${d.pac}: ${safePace}`;
        this.dom.list.innerHTML = '';
        this.state.matrix.forEach((r, i) => {
            let li = document.createElement('li'); li.id = `min-row-${i}`; let pt = VoiceDB[this.state.uiLang].phases[r.phase];
            li.innerHTML = `<span class="min-tag">${String(r.m).padStart(2,'0')}m</span><span class="speed-tag">${r.spd.toFixed(1)}kph</span><span class="inc-tag">${r.inc}%</span><span class="phase-tag">${pt}</span><span class="bio-tag"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>${r.hr} <svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 16c-3.35 0-6-2.57-6-6.2 0-2.34 1.95-5.44 6-9.14 4.05 3.7 6 6.79 6 9.14 0 3.63-2.65 6.2-6 6.2z"/></svg>${r.lac.toFixed(1)}</span>`;
            this.dom.list.appendChild(li);
        });
    }

    async reqWL() { try { if('wakeLock' in navigator) this.state.wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }

    start() {
        this.reqWL(); this.dom.start.classList.add('hidden'); this.dom.pause.classList.remove('hidden'); this.switchTab('matrix');
        this.state.isRunning = true; this.state.startTime = Date.now() - this.state.accumMs;
        this.ve.speak("", 1); this.tick();
    }
    pause() { this.state.isRunning = false; this.dom.pause.classList.add('hidden'); this.dom.start.classList.remove('hidden'); if(this.state.wakeLock){this.state.wakeLock.release();this.state.wakeLock=null;} }
    reset() { this.pause(); this.state.accumMs = 0; this.state.currMinIdx = -1; this.state.transFired = {}; this.switchTab('settings'); this.generateMatrix(); this.updateDash(0); this.dom.barF.style.width="0%"; this.dom.barT.textContent="00.0%"; }

    tick() {
        if(!this.state.isRunning) return;
        this.state.accumMs = Date.now() - this.state.startTime;
        let tMs = this.state.matrix.length * 60000;
        if(this.state.accumMs >= tMs) { this.updateDash(tMs); this.ve.speak(this.state.uiLang==='zh'?"完美達標！訓練結束。":"Workout Complete!", 1); this.pause(); return; }
        this.updateDash(this.state.accumMs); requestAnimationFrame(() => this.tick());
    }

    scrollToRow() {
        this.dom.list.querySelectorAll('li').forEach(l => {
            l.classList.remove('active-row');
            // 清除之前的 Pulse 動畫
            l.querySelector('.speed-tag').classList.remove('pulse-speed-active');
            l.querySelector('.inc-tag').classList.remove('pulse-inc-active');
        });
        if(this.state.currMinIdx>=0 && this.state.currMinIdx<this.state.matrix.length) {
            let a = document.getElementById(`min-row-${this.state.currMinIdx}`);
            if(a) { a.classList.add('active-row'); a.scrollIntoView({behavior:'smooth', block:'center'}); }
        }
    }

    updateDash(ms) {
        let tS=Math.floor(ms/1000), tTS=this.state.matrix.length*60, rS=tTS-tS;
        this.dom.time.textContent = `${String(Math.floor(rS/60)).padStart(2,'0')}:${String(rS%60).padStart(2,'0')}.${Math.floor((ms%1000)/100)}`;
        let pct=((ms/(tTS*1000))*100).toFixed(1); this.dom.barF.style.width=`${pct}%`; this.dom.barT.textContent=`${pct.padStart(4,'0')}%`;

        let mI=Math.floor(ms/60000); if(mI>=this.state.matrix.length) mI=this.state.matrix.length-1;
        let iM=ms%60000, cD=this.state.matrix[mI];

        if(mI !== this.state.currMinIdx) {
            this.state.currMinIdx = mI;
            this.dom.spd.textContent = cD.spd.toFixed(1); this.dom.inc.textContent = cD.inc.toFixed(1);
            let pM=Math.floor(60/cD.spd), pS=Math.floor((60/cD.spd-pM)*60); this.dom.pac.textContent=`${String(pM).padStart(2,'0')}'${String(pS).padStart(2,'0')}"`;
            this.scrollToRow();
            if(mI===0) this.ve.speak(this.state.uiLang==='zh'?`訓練開始。總長${this.state.matrix.length}分鐘。`:`Workout begins. ${this.state.matrix.length} minutes.`, 1);
        }

        // --- Transition Alert System (每分鐘第 45 秒觸發) ---
        if (iM > 45000 && iM < 45200 && mI < this.state.matrix.length - 1 && !this.state.transFired[mI]) {
            this.state.transFired[mI] = true;
            let nD = this.state.matrix[mI + 1];
            if (Math.abs(nD.spd - cD.spd) > 0.1 || Math.abs(nD.inc - cD.inc) > 0.1) {
                this.ve.speakTransition(nD.spd, nD.inc);
                // UI Highlight
                let nLi = document.getElementById(`min-row-${mI + 1}`);
                if (nLi) {
                    if (Math.abs(nD.spd - cD.spd) > 0.1) nLi.querySelector('.speed-tag').classList.add('pulse-speed-active');
                    if (Math.abs(nD.inc - cD.inc) > 0.1) nLi.querySelector('.inc-tag').classList.add('pulse-inc-active');
                }
            }
        }

        let pC=mI>0?this.state.matrix[mI-1].cC:0, pD=mI>0?this.state.matrix[mI-1].ccD:0, pH=mI>0?this.state.matrix[mI-1].hr:75, pL=mI>0?this.state.matrix[mI-1].lac:1.0, pF=mI>0?this.state.matrix[mI-1].fat:0;
        let r=iM/60000;
        this.dom.cal.textContent = Math.floor(pC+(cD.cal*r)); this.dom.dist.textContent = (pD+(cD.dist*r)).toFixed(2);
        let iHR=pH+(cD.hr-pH)*r, iLac=pL+(cD.lac-pL)*r, iFat=pF+(cD.fat-pF)*r;
        this.dom.hr.textContent=Math.round(iHR); this.dom.lac.textContent=iLac.toFixed(1); this.dom.fat.textContent=iFat.toFixed(0);
        
        if(iM > 20000 && iM < 20200) this.ve.evaluateAndSpeak({ hr: iHR, lac: iLac, fatigue: iFat, spd: cD.spd, inc: cD.inc, phase: cD.phase });
    }
}
document.addEventListener('DOMContentLoaded', () => window.app = new ProTreadmillApp());
</script>
