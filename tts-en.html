<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RUNPRO OS - Bilingual TTS Tactical Lab</title>
<style>
:root{--bg:#0b0f19;--panel:#131a26;--panel2:#0f1520;--green:#00ff66;--text:#fff;--muted:#8b9bb0;--border:#263246;--danger:#ff5364}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#142238 0,var(--bg) 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;padding:18px}.app{width:min(720px,100%);margin:auto;background:rgba(19,26,38,.96);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.45)}h1{margin:0;color:var(--green);text-align:center;font-size:21px;letter-spacing:2px}.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px}.lang-switch{display:grid;grid-template-columns:1fr 1fr;background:#090d15;border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px}.lang-btn,.persona-btn,.mini-btn{font:inherit}.lang-btn{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer;font-weight:700}.lang-btn.active{background:var(--green);color:#001a0a}.env-grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}.env-info{background:#090d15;border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:#b9c9da;font:11px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.env-copy{border:1px solid var(--green);background:rgba(0,255,102,.07);color:var(--green);border-radius:8px;padding:0 14px;font-weight:800;cursor:pointer}.env-copy:hover{background:var(--green);color:#001709}.step{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.step-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}.step-no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,255,102,.12);color:var(--green);font-size:12px;font-weight:800}.step-title{font-size:13px;font-weight:800;letter-spacing:.5px}.step-hint{margin-left:auto;color:var(--muted);font-size:11px}select,textarea{width:100%;background:#090d15;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;font-size:14px;outline:none}select:focus,textarea:focus{border-color:var(--green)}.voice-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;color:#bdd0e5;background:#172235;border:1px solid #293a53;border-radius:999px;padding:4px 8px}.badge.locked{color:var(--green);border-color:rgba(0,255,102,.35)}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.role-btn{background:#0a0f18;border:1px solid var(--border);border-radius:10px;color:#c2d0df;padding:10px 7px;min-height:58px;cursor:pointer;font-weight:750;font-size:12px}.role-btn small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}.role-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,255,102,.06);box-shadow:0 0 0 1px rgba(0,255,102,.1)}.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.persona-btn{min-height:78px;background:#0a0f18;border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:10px 6px;cursor:pointer}.persona-btn strong{display:block;color:#dbe8f6;font-size:13px;margin-bottom:5px}.persona-btn span{font-size:11px}.persona-btn.active{border-color:var(--green);background:rgba(0,255,102,.06);box-shadow:0 0 0 1px rgba(0,255,102,.12)}.persona-btn.active strong,.persona-btn.active span{color:var(--green)}.tuning{display:grid;grid-template-columns:1fr 1fr;gap:15px}.slider-row{margin-bottom:14px}.slider-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.value{color:var(--green);font-family:ui-monospace,monospace;font-weight:800}input[type=range]{width:100%;accent-color:var(--green)}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.mini-btn{background:#121c2b;border:1px solid var(--border);color:#b6c6d9;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:11px}.mini-btn:hover{border-color:var(--green);color:var(--green)}textarea{resize:vertical;min-height:86px;line-height:1.5}.actions{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:9px}.action{border-radius:9px;padding:13px 10px;font-weight:800;cursor:pointer;border:1px solid var(--green);background:transparent;color:var(--green)}.action.primary{background:var(--green);color:#001709}.action.danger{border-color:var(--danger);color:var(--danger)}.code{margin-top:14px;background:#070a10;border:1px solid var(--border);border-radius:9px;padding:13px;color:#9db0c6;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow:auto;max-height:240px}.footerline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:580px){body{padding:10px}.app{padding:17px}.env-grid{grid-template-columns:1fr}.env-copy{padding:11px}.roles{grid-template-columns:repeat(2,1fr)}.personas{grid-template-columns:1fr}.tuning{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.step-hint{display:none}}
</style>
</head>
<body><main class="app">
<h1>RUNPRO OS - TTS TACTICAL LAB</h1><div class="subtitle" id="subtitle"></div>
<div class="lang-switch"><button class="lang-btn active" data-lang="zh-TW">正體中文</button><button class="lang-btn" data-lang="en-US">English</button></div>
<section class="step"><div class="step-head"><span class="step-no">0</span><span class="step-title" data-i18n="envTitle"></span><span class="step-hint" data-i18n="envHint"></span></div><div class="env-grid"><div class="env-info" id="envInfo"></div><button class="env-copy" id="copyEnvBtn"></button></div></section>
<section class="step"><div class="step-head"><span class="step-no">1</span><span class="step-title" data-i18n="voiceTitle"></span><span class="step-hint" data-i18n="voiceHint"></span></div><select id="voiceSelect"><option>Loading voices...</option></select><div class="voice-meta"><span class="badge locked" id="lockBadge"></span><span class="badge" id="voiceCount"></span><span class="badge" id="voiceLang"></span></div></section>
<section class="step"><div class="step-head"><span class="step-no">2</span><span class="step-title" data-i18n="roleTitle"></span><span class="step-hint" data-i18n="roleHint"></span></div><div class="roles" id="roleGrid"></div></section>
<section class="step"><div class="step-head"><span class="step-no">3</span><span class="step-title" data-i18n="styleTitle"></span><span class="step-hint" data-i18n="styleHint"></span></div><div class="personas"><button class="persona-btn active" data-mode="whisper"><strong></strong><span></span></button><button class="persona-btn" data-mode="command"><strong></strong><span></span></button><button class="persona-btn" data-mode="energy"><strong></strong><span></span></button></div></section>
<section class="step"><div class="step-head"><span class="step-no">4</span><span class="step-title" data-i18n="tuneTitle"></span><span class="step-hint" data-i18n="tuneHint"></span></div><div class="quick"><button class="mini-btn" data-preset="natural"></button><button class="mini-btn" data-preset="clear"></button><button class="mini-btn" data-preset="fast"></button><button class="mini-btn" id="resetBtn"></button></div><div class="tuning"><div class="slider-row"><div class="slider-top"><span data-i18n="rate"></span><span class="value" id="rateValue"></span></div><input type="range" id="rateRange" min="0.5" max="2" step="0.05"></div><div class="slider-row"><div class="slider-top"><span data-i18n="pitch"></span><span class="value" id="pitchValue"></span></div><input type="range" id="pitchRange" min="0.5" max="2" step="0.05"></div><div class="slider-row"><div class="slider-top"><span data-i18n="volume"></span><span class="value" id="volumeValue"></span></div><input type="range" id="volumeRange" min="0" max="1" step="0.05"></div></div><textarea id="testScript"></textarea></section>
<div class="actions"><button class="action primary" id="playBtn"></button><button class="action danger" id="stopBtn"></button><button class="action" id="copyBtn"></button></div><pre class="code" id="configOutput"></pre><div class="footerline"><span id="status"></span><span>Settings saved locally</span></div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const copy={
'zh-TW':{subtitle:'雙語真人聲線選擇與精細調校',envTitle:'瀏覽器與 TTS 環境資訊',envHint:'即時從目前裝置讀取',copyEnv:'一鍵複製環境資訊',envCopied:'環境資訊已複製',roleTitle:'選擇角色人格',roleHint:'八選一，保留目前聲線並匹配风格與微調',voiceTitle:'偵測到之中文真人聲線・全地區／全中文語系 (AUTOMATIC FILTER)',voiceHint:'涵蓋華語、國語、粵語及其他中文語系；選定後不被角色覆寫',styleTitle:'選擇播報風格',styleHint:'三選一只調整參數，不更換聲線',tuneTitle:'進階微調',tuneHint:'依偏好精細校準',rate:'語速 RATE',pitch:'音高 PITCH',volume:'音量 VOLUME',lock:'聲線已鎖定',voices:n=>`偵測到中文系列聲線 ${n} 個`,play:'立即試聽',stop:'停止',copy:'複製設定程式碼',reset:'重設此風格',natural:'自然',clear:'清晰',fast:'競速',ready:'設定已就緒',copied:'已複製到剪貼簿',empty:'找不到中文系列聲線，暫時顯示全部系統聲線',modes:{whisper:['溫柔呢喃','平穩、陪跑、低刺激'],command:['低沉指令','明確、果斷、戰術提醒'],energy:['熱情高昂','積極、明亮、競速鼓舞']},scripts:{whisper:'我們即將在前方五百公尺左轉，請保持節奏並平順變換路線。',command:'警告，目前心率已進入高強度區間，請立即調整配速並穩定呼吸。',energy:'太強了！穩住現在的節奏，保持動作效率，繼續向前推進！'}},
'en-US':{subtitle:'Bilingual human voice selection and precision calibration',envTitle:'BROWSER & TTS ENVIRONMENT',envHint:'Read live from this device',copyEnv:'Copy Environment Info',envCopied:'Environment info copied',roleTitle:'CHOOSE CHARACTER PERSONA',roleHint:'Eight presets preserve the voice and match style/tuning',voiceTitle:'DETECTED HUMAN VOICE (AUTOMATIC FILTER)',voiceHint:'Choose once; later controls never replace it',styleTitle:'CHOOSE BROADCAST STYLE',styleHint:'Style adjusts parameters, not your voice',tuneTitle:'ADVANCED FINE-TUNING',tuneHint:'Calibrate to your preference',rate:'VOICE SPEED RATE',pitch:'VOICE PITCH',volume:'VOLUME',lock:'Voice selection locked',voices:n=>`${n} matching voices`,play:'Test Voice',stop:'Stop',copy:'Copy Config Code',reset:'Reset This Style',natural:'Natural',clear:'Clear',fast:'Race',ready:'Configuration ready',copied:'Copied to clipboard',empty:'No matching language voice; showing all system voices',modes:{whisper:['Soft Whisper','Calm, steady, low stimulation'],command:['Deep Command','Direct, decisive tactical cue'],energy:['High Energy','Bright, active race boost']},scripts:{whisper:'Approaching the target turn in five hundred meters. Hold your rhythm and transition smoothly.',command:'Warning. Heart rate is now in a high-intensity zone. Reduce pace and stabilize your breathing.',energy:'Strong work! Hold this rhythm, stay efficient, and keep driving forward!'}}};
const roleProfiles={
caringBoyfriend:{zh:['體貼男友','Caring Boyfriend'],en:['Caring Boyfriend','Warm and attentive'],mode:'whisper',rate:.90,pitch:.90,volume:.92,voice:['YunJhe','Tianyang','Male','Guy','Ryan','Daniel','Oliver'],script:{'zh-TW':'慢慢來，不需要勉強自己。我會陪你把呼吸穩下來，再一起保持這個節奏。','en-US':'Take it easy. You do not need to force it. I am right here, so settle your breathing and hold this rhythm with me.'}},
dominantCEO:{zh:['霸總','Commanding CEO'],en:['Commanding CEO','Controlled and authoritative'],mode:'command',rate:.96,pitch:.78,volume:1,voice:['YunJhe','Tianyang','Male','Guy','Ryan','Daniel','Alex'],script:{'zh-TW':'聽我的，先穩住呼吸。現在把配速降一點，控制好節奏，再把主導權拿回來。','en-US':'Listen carefully. Stabilize your breathing, ease the pace slightly, and take control of the rhythm again.'}},
puppyBoyfriend:{zh:['小奶狗','Sweet Puppy Boyfriend'],en:['Sweet Puppy Boyfriend','Bright, loyal and encouraging'],mode:'energy',rate:1.12,pitch:1.18,volume:.98,voice:['HsiaoChen','Male','Guy','Eddy','Reed','Junior'],script:{'zh-TW':'你真的跑得很好！我有一直跟著你喔，再撐一下，我們一起把這一段漂亮完成！','en-US':'You are doing so well! I am staying right with you. Just a little more and we will finish this section together!'}},
neighborBrother:{zh:['鄰家哥哥','Boy Next Door'],en:['Boy Next Door','Natural, friendly and reliable'],mode:'whisper',rate:1.0,pitch:.96,volume:.96,voice:['YunJhe','Male','Guy','Tom','Aaron','Arthur'],script:{'zh-TW':'目前狀態不錯，照自己的節奏就好。前面這段我陪你穩穩跑過去。','en-US':'You are looking steady. Keep your own rhythm and I will stay with you through the next section.'}},
oneesan:{zh:['御姊','Confident Oneesan'],en:['Confident Oneesan','Mature, poised and assured'],mode:'command',rate:1.0,pitch:.92,volume:1,voice:['Meijia','HsiaoChen','Female','Sonia','Samantha','Karen'],script:{'zh-TW':'很好，把注意力放回呼吸和步頻。照我說的做，你可以更從容地完成這一段。','en-US':'Good. Bring your attention back to breathing and cadence. Follow my lead and finish this section with control.'}},
gentleSecretary:{zh:['溫柔女秘書','Gentle Secretary'],en:['Gentle Secretary','Polished, calm and considerate'],mode:'whisper',rate:.88,pitch:1.08,volume:.90,voice:['HsiaoChen','Meijia','Female','Aria','Jenny','Sonia'],script:{'zh-TW':'提醒您，前方即將進入下一個訓練階段。請保持放鬆，我會為您持續提示。','en-US':'A gentle reminder: the next training phase is approaching. Please stay relaxed and I will continue to guide you.'}},
shyAdmirer:{zh:['害羞但景仰自己的學妹','Shy Admirer'],en:['Shy Admirer','Reserved but sincerely impressed'],mode:'whisper',rate:.86,pitch:1.22,volume:.86,voice:['HsiaoChen','Meijia','Female','Ava','Jenny','Samantha'],script:{'zh-TW':'學長真的很厲害……那個，如果可以的話，請繼續保持現在的節奏，我會一直幫你加油。','en-US':'You are honestly amazing... If it is okay, please keep this rhythm. I will be cheering for you the whole way.'}},
tsundereGirlfriend:{zh:['傲嬌女友','Tsundere Girlfriend'],en:['Tsundere Girlfriend','Firm outside, supportive underneath'],mode:'energy',rate:1.08,pitch:1.12,volume:.98,voice:['HsiaoChen','Meijia','Female','Ava','Emma','Michelle'],script:{'zh-TW':'才不是特地陪你跑呢。只是你現在節奏還不錯，不准突然放棄，繼續跑。','en-US':'It is not like I came just to pace you. Your rhythm is decent, so do not suddenly give up. Keep moving.'}}
};
const modeDefaults={whisper:{rate:.9,pitch:1.05,volume:1},command:{rate:1.05,pitch:.85,volume:1},energy:{rate:1.2,pitch:1.15,volume:1}};
const state=Object.assign({lang:'zh-TW',role:'caringBoyfriend',mode:'whisper',voiceByLang:{},rate:.9,pitch:1.05,volume:1,customScript:false},JSON.parse(localStorage.getItem('runproTTS')||'{}'));
let allVoices=[]; const save=()=>localStorage.setItem('runproTTS',JSON.stringify(state));
function detectBrowser(){const ua=navigator.userAgent;const brands=navigator.userAgentData?.brands||[];const hit=n=>brands.find(b=>b.brand.includes(n));let name='Unknown Browser',version='Not exposed';if(hit('Microsoft Edge')){name='Microsoft Edge';version=hit('Microsoft Edge').version}else if(hit('Google Chrome')){name='Google Chrome';version=hit('Google Chrome').version}else if(/Edg\//i.test(ua)){name='Microsoft Edge';version=(ua.match(/Edg\/([\d.]+)/)||[])[1]||version}else if(/OPR\//i.test(ua)){name='Opera';version=(ua.match(/OPR\/([\d.]+)/)||[])[1]||version}else if(/SamsungBrowser\//i.test(ua)){name='Samsung Internet';version=(ua.match(/SamsungBrowser\/([\d.]+)/)||[])[1]||version}else if(/CriOS\//i.test(ua)){name='Chrome iOS';version=(ua.match(/CriOS\/([\d.]+)/)||[])[1]||version}else if(/Chrome\//i.test(ua)){name='Google Chrome';version=(ua.match(/Chrome\/([\d.]+)/)||[])[1]||version}else if(/FxiOS\//i.test(ua)){name='Firefox iOS';version=(ua.match(/FxiOS\/([\d.]+)/)||[])[1]||version}else if(/Firefox\//i.test(ua)){name='Mozilla Firefox';version=(ua.match(/Firefox\/([\d.]+)/)||[])[1]||version}else if(/Version\//i.test(ua)&&/Safari\//i.test(ua)){name='Apple Safari';version=(ua.match(/Version\/([\d.]+)/)||[])[1]||version}return{name,version,ua}}
function environmentText(){const b=detectBrowser(),supported='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;const selected=allVoices.find(v=>v.name===$('#voiceSelect').value);const lines=state.lang==='zh-TW'?[`瀏覽器：${b.name} ${b.version}`,`平台：${navigator.platform||'未提供'}`,`系統語言：${navigator.language||'未提供'}`,`Web Speech TTS：${supported?'支援':'不支援'}`,`TTS API 版本：瀏覽器未公開`, `偵測聲線總數：${allVoices.length}`,`目前聲線：${selected?selected.name:'尚未載入'}`,`聲線語言：${selected?selected.lang:'—'}`,`聲線來源：${selected?(selected.localService?'Local':'Remote/Unspecified'):'—'}`,`User Agent：${b.ua}`]:[`Browser: ${b.name} ${b.version}`,`Platform: ${navigator.platform||'Not exposed'}`,`System language: ${navigator.language||'Not exposed'}`,`Web Speech TTS: ${supported?'Supported':'Not supported'}`,`TTS API version: Not exposed by browser`,`Detected voices: ${allVoices.length}`,`Selected voice: ${selected?selected.name:'Not loaded'}`,`Voice language: ${selected?selected.lang:'—'}`,`Voice source: ${selected?(selected.localService?'Local':'Remote/Unspecified'):'—'}`,`User Agent: ${b.ua}`];return lines.join('\n')}
function updateEnvironment(){if($('#envInfo'))$('#envInfo').textContent=environmentText()}
function renderRoles(){const grid=$('#roleGrid');grid.innerHTML='';Object.entries(roleProfiles).forEach(([id,r])=>{const d=state.lang==='zh-TW'?r.zh:r.en;const b=document.createElement('button');b.className='role-btn'+(state.role===id?' active':'');b.dataset.role=id;b.innerHTML=`${d[0]}<small>${d[1]}</small>`;b.onclick=()=>applyRole(id);grid.appendChild(b)})}
function scoreVoice(v,keys){const text=(v.name+' '+v.lang).toLowerCase();let score=languageMatch(v)?30:0;if(v.localService)score+=3;keys.forEach((k,i)=>{if(text.includes(k.toLowerCase()))score+=20-i});return score}
function chooseRoleVoice(profile){const list=allVoices.filter(languageMatch);if(!list.length)return;const best=[...list].sort((a,b)=>scoreVoice(b,profile.voice)-scoreVoice(a,profile.voice))[0];if(best){state.voiceByLang[state.lang]=best.name;$('#voiceSelect').value=best.name;syncVoiceMeta()}}
function applyRole(id){const r=roleProfiles[id];state.role=id;state.mode=r.mode;state.rate=r.rate;state.pitch=r.pitch;state.volume=r.volume;state.customScript=false;$('#testScript').value=r.script[state.lang];$$('.persona-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===r.mode));syncControls();renderRoles();save();updateOutput()}
function renderText(){const t=copy[state.lang];renderRoles();document.documentElement.lang=state.lang;$('#subtitle').textContent=t.subtitle;$$('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);$('#lockBadge').textContent=t.lock;$('#playBtn').textContent=t.play;$('#stopBtn').textContent=t.stop;$('#copyBtn').textContent=t.copy;$('#copyEnvBtn').textContent=t.copyEnv;$('#resetBtn').textContent=t.reset;$$('[data-preset]').forEach(b=>b.textContent=t[b.dataset.preset]);$$('.persona-btn').forEach(b=>{const x=t.modes[b.dataset.mode];b.querySelector('strong').textContent=x[0];b.querySelector('span').textContent=x[1]});if(!state.customScript)$('#testScript').value=t.scripts[state.mode];$('#status').textContent=t.ready;updateOutput()}
function isChineseVoice(v){
const lang=(v.lang||'').toLowerCase().replace(/_/g,'-');
const meta=`${v.name||''} ${v.voiceURI||''}`.toLowerCase();
const chineseLangPrefixes=['zh','cmn','yue','wuu','nan','hak','hsn','gan','cjy','lzh'];
const chineseNameHints=['chinese','mandarin','cantonese','中文','國語','国语','普通話','普通话','華語','华语','粵語','粤语','台灣','台湾','香港','澳門','澳门','新加坡','小陳','小陈','曉辰','晓辰','美佳','雲哲','云哲','tingting','huihui','yaoyao','kangkang','xiaoxiao','xiaoyi','xiaomo','yunxi','yunyang','yunxia','yunfeng','yunhao','yunze','yunjian','yunxi','xiaobei','xiaoni','xiaohan','xiaorui','xiaoshuang','xiaoqiu','xiaoyan','xiaozhen','xiaochen','meijia','yun-jhe','sin-ji','hiu-gaai','hiu-maan'];
return chineseLangPrefixes.some(code=>lang===code||lang.startsWith(code+'-'))||chineseNameHints.some(hint=>meta.includes(hint));
}
function languageMatch(v){return state.lang==='zh-TW'?isChineseVoice(v):(v.lang||'').toLowerCase().replace(/_/g,'-').startsWith('en')}
function loadVoices(){allVoices=speechSynthesis.getVoices();if(!allVoices.length)return false;const old=state.voiceByLang[state.lang];let list=allVoices.filter(languageMatch);let fallback=false;if(!list.length){list=allVoices;fallback=true}list.sort((a,b)=>(Number(b.localService)-Number(a.localService))||a.name.localeCompare(b.name));$('#voiceSelect').innerHTML='';list.forEach(v=>{const o=new Option(`${v.name} (${v.lang})${v.localService?' • Local':''}`,v.name);o.dataset.lang=v.lang;$('#voiceSelect').add(o)});if(old&&list.some(v=>v.name===old))$('#voiceSelect').value=old;else{const preferred=pickPreferred(list);$('#voiceSelect').value=preferred?.name||list[0]?.name||'';state.voiceByLang[state.lang]=$('#voiceSelect').value;save()}$('#voiceCount').textContent=fallback?copy[state.lang].empty:copy[state.lang].voices(list.length);syncVoiceMeta();updateOutput();return true}
function pickPreferred(list){const keys=state.lang==='zh-TW'?['HsiaoChen','Meijia','YunJhe','Taiwan','Premium','Google']:['Aria','Jenny','Ava','Sonia','Guy','Ryan','Premium'];return list.find(v=>keys.some(k=>v.name.toLowerCase().includes(k.toLowerCase())))||list[0]}
function syncVoiceMeta(){const v=allVoices.find(x=>x.name===$('#voiceSelect').value);$('#voiceLang').textContent=v?`${v.lang}${v.localService?' · Local':' · Remote'}`:'—';updateEnvironment()}
function applyMode(mode,resetScript=true){state.mode=mode;$$('.persona-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));Object.assign(state,modeDefaults[mode]);if(resetScript){state.customScript=false;$('#testScript').value=copy[state.lang].scripts[mode]}syncControls();save();updateOutput()}
function syncControls(){['rate','pitch','volume'].forEach(k=>{$(`#${k}Range`).value=state[k];$(`#${k}Value`).textContent=Number(state[k]).toFixed(2)})}
function applyPreset(p){const x={natural:[1,1,1],clear:[.92,1.08,1],fast:[1.25,1.05,1]}[p];[state.rate,state.pitch,state.volume]=x;syncControls();save();updateOutput()}
function updateOutput(){if(!$('#configOutput'))return;const text=$('#testScript').value.replace(/\\/g,'\\\\').replace(/`/g,'\\`');$('#configOutput').textContent=`const utterance = new SpeechSynthesisUtterance(\`${text}\`);\nconst voices = window.speechSynthesis.getVoices();\nutterance.voice = voices.find(v => v.name === ${JSON.stringify(state.voiceByLang[state.lang]||'')});\nutterance.lang = ${JSON.stringify(state.lang)};\nutterance.rate = ${state.rate};\nutterance.pitch = ${state.pitch};\nutterance.volume = ${state.volume};\nwindow.speechSynthesis.cancel();\nwindow.speechSynthesis.speak(utterance);`}
function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('#testScript').value);u.voice=allVoices.find(v=>v.name===$('#voiceSelect').value)||null;u.lang=state.lang;u.rate=state.rate;u.pitch=state.pitch;u.volume=state.volume;speechSynthesis.speak(u)}
$$('.lang-btn').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;state.customScript=false;$$('.lang-btn').forEach(x=>x.classList.toggle('active',x===b));save();renderText();loadVoices();applyRole(state.role)});$$('.persona-btn').forEach(b=>b.onclick=()=>applyMode(b.dataset.mode));$('#voiceSelect').onchange=()=>{state.voiceByLang[state.lang]=$('#voiceSelect').value;syncVoiceMeta();save();updateOutput()};['rate','pitch','volume'].forEach(k=>$(`#${k}Range`).oninput=e=>{state[k]=Number(e.target.value);$(`#${k}Value`).textContent=state[k].toFixed(2);save();updateOutput()});$$('[data-preset]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));$('#resetBtn').onclick=()=>applyMode(state.mode);$('#testScript').oninput=()=>{state.customScript=true;save();updateOutput()};$('#playBtn').onclick=speak;$('#stopBtn').onclick=()=>speechSynthesis.cancel();$('#copyEnvBtn').onclick=async()=>{await navigator.clipboard.writeText(environmentText());$('#status').textContent=copy[state.lang].envCopied;setTimeout(()=>$('#status').textContent=copy[state.lang].ready,1600)};$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#configOutput').textContent);$('#status').textContent=copy[state.lang].copied;setTimeout(()=>$('#status').textContent=copy[state.lang].ready,1600)};
function init(){state.lang=state.lang==='en-US'?'en-US':'zh-TW';$$('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));renderText();applyRole(state.role);const existing=JSON.parse(localStorage.getItem('runproTTS')||'{}');if(existing.rate!=null){state.rate=existing.rate;state.pitch=existing.pitch;state.volume=existing.volume;syncControls()}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();let tries=0;const poll=setInterval(()=>{if(loadVoices()||++tries>20)clearInterval(poll)},250)}init();
</script></body></html>
