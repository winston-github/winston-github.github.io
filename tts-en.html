<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNPRO OS - TTS TACTICAL LAB (EN)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131a26;
            --primary-neon: #00ff66;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--primary-neon);
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* 3 Persona Buttons */
        .persona-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .persona-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            padding: 12px 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .persona-btn .title {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .persona-btn .sub {
            font-size: 10px;
            opacity: 0.7;
        }

        /* Active State */
        .persona-btn.active {
            border-color: var(--primary-neon);
            color: var(--primary-neon);
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        select, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-neon);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .slider-val {
            color: var(--primary-neon);
            font-family: monospace;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-neon);
            background: var(--border-color);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #playBtn {
            background-color: var(--primary-neon);
            color: #000000;
            border: none;
        }

        #playBtn:hover {
            background-color: #00dd55;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        #copyBtn {
            background-color: transparent;
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
        }

        #copyBtn:hover {
            background: rgba(0, 255, 102, 0.1);
        }

        /* Code Output Window */
        .code-container {
            background-color: #070a10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #8da1b9;
            overflow-x: auto;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RunPro OS - TTS Tactical Lab</h1>
        <div class="subtitle">Audio Persona & Parameter Calibration Dashboard</div>

        <!-- 3 Persona Buttons with Gender/Wording Hints -->
        <div class="persona-container">
            <button class="persona-btn active" data-mode="whisper">
                <span class="title">Soft Whisper</span>
                <span class="sub">Calm Pacer (👩)</span>
            </button>
            <button class="persona-btn" data-mode="command">
                <span class="title">Deep Command</span>
                <span class="sub">Iron Tactical (👨)</span>
            </button>
            <button class="persona-btn" data-mode="energy">
                <span class="title">High Energy</span>
                <span class="sub">Race Booster (👩)</span>
            </button>
        </div>

        <!-- Dropdown 選單 -->
        <div class="form-group">
            <label>Detected Human Voice (AUTOMATIC FILTER)</label>
            <select id="voiceSelect">
                <option>Scanning for premium human voices...</option>
            </select>
        </div>

        <!-- Rate Slider -->
        <div class="form-group">
            <div class="slider-header">
                <label>Voice Speed RATE (0.5 - 2.0)</label>
                <span class="slider-val" id="rateValue">0.90</span>
            </div>
            <input type="range" id="rateRange" min="0.5" max="2.0" step="0.05" value="0.90">
        </div>

        <!-- Pitch Slider -->
        <div class="form-group">
            <div class="slider-header">
                <label>Voice Pitch PITCH (0.5 - 2.0)</label>
                <span class="slider-val" id="pitchValue">1.05</span>
            </div>
            <input type="range" id="pitchRange" min="0.5" max="2.0" step="0.05" value="1.05">
        </div>

        <!-- Text Script Box -->
        <div class="form-group">
            <label>Test Script Content (TEST SCRIPT)</label>
            <textarea id="testScript" rows="3">Approaching target turn in five hundred meters. Please transition to the left lane smoothly.</textarea>
        </div>

        <!-- Action Buttons -->
        <button id="playBtn" class="btn-action">🔊 Test Voice Broadcast</button>
        <button id="copyBtn" class="btn-action">📋 Copy Config Code</button>

        <!-- Config Code Window -->
        <div class="code-container" id="configOutput">OUTPUT CONFIG CODE</div>
    </div>

    <script>
        // Tactical English Script Templates
        const scriptTemplates = {
            whisper: "Approaching target turn in five hundred meters. Please transition to the left lane smoothly.",
            command: "Warning. Heart rate has penetrated Zone 5 danger threshold. GAP pace is currently sub-four. De-escalate velocity immediately.",
            energy: "Absolutely crushed it! Your current equivalent flat pace is down to four. Hold the line! Push it, push it!"
        };

        let currentMode = 'whisper';
        let isFirstLoad = true; // Security Lock

        // 1. Load English Voices (Supporting EN-US, EN-GB, EN-AU premium neural/human lines)
        function loadVoices() {
            const synth = window.speechSynthesis;
            const voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            
            if (voices.length === 0) return false;

            const previousSelectedValue = voiceSelect.value;
            voiceSelect.innerHTML = '';

            // Filter for English voices (en-US, en-GB, etc.)
            let filtered = voices.filter(v => v.lang.toLowerCase().includes('en'));
            
            // Fallback防呆
            if (filtered.length === 0) filtered = voices;

            filtered.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.innerText = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });

            if (isFirstLoad) {
                autoSelectVoiceForMode();
                isFirstLoad = false;
            } else {
                if (previousSelectedValue && Array.from(voiceSelect.options).some(o => o.value === previousSelectedValue)) {
                    voiceSelect.value = previousSelectedValue;
                }
            }

            updateCodeOutput();
            return true;
        }

        // 2. Auto-match the best premium English voice engine per mode
        function autoSelectVoiceForMode() {
const voiceSelect = document.getElementById('voiceSelect');
const options = Array.from(voiceSelect.options);
let targetKeywords = [];
// Target premium Edge Neural or high-quality Apple voices
if (currentMode === 'whisper') targetKeywords = ['Aria', 'Sonia', 'Jenny', 'Natasha', 'Samantha', 'Premium', 'Female', 'en-US'];
if (currentMode === 'command') targetKeywords = ['Guy', 'Ryan', 'Siri', 'Oliver', 'Male', 'en-US', 'en-GB'];
if (currentMode === 'energy') targetKeywords = ['Ava', 'Emma', 'Michelle', 'Premium', 'Female'];
const bestMatch = options.find(opt =>
targetKeywords.some(kw => opt.value.toLowerCase().includes(kw.toLowerCase()))
);
if (bestMatch) {
voiceSelect.value = bestMatch.value;
} else if (options.length > 0) {
voiceSelect.selectedIndex = 0;
}
}
// 3. Handle Top Segmented Tabs Event
function handlePersonaChange(mode) {
currentMode = mode;
isFirstLoad = true; // Unlock for new auto-match
document.querySelectorAll('.persona-btn').forEach(btn => {
btn.classList.remove('active');
if (btn.getAttribute('data-mode') === mode) btn.classList.add('active');
});
const rateRange = document.getElementById('rateRange');
const pitchRange = document.getElementById('pitchRange');
const testScript = document.getElementById('testScript');
if (mode === 'whisper') {
rateRange.value = 0.90; pitchRange.value = 1.05;
} else if (mode === 'command') {
rateRange.value = 1.05; pitchRange.value = 0.85;
} else if (mode === 'energy') {
rateRange.value = 1.20; pitchRange.value = 1.15;
}
document.getElementById('rateValue').innerText = parseFloat(rateRange.value).toFixed(2);
document.getElementById('pitchValue').innerText = parseFloat(pitchRange.value).toFixed(2);
testScript.value = scriptTemplates[mode];
loadVoices();
}
// 4. Render exportable JavaScript snippet
function updateCodeOutput() {
const selectedVoice = document.getElementById('voiceSelect').value;
const rate = document.getElementById('rateRange').value;
const pitch = document.getElementById('pitchRange').value;
const script = document.getElementById('testScript').value;
const codeTemplate = // RunPro OS - TTS Tactical Parameters const utterance = new SpeechSynthesisUtterance("${script}"); const voices = window.speechSynthesis.getVoices(); utterance.voice = voices.find(v => v.name === "${selectedVoice}"); utterance.rate = ${rate}; utterance.pitch = ${pitch}; utterance.volume = 1.0; window.speechSynthesis.speak(utterance);;
document.getElementById('configOutput').innerText = codeTemplate;
}
// 5. Fire Audio Output
function speakTest() {
const synth = window.speechSynthesis;
synth.cancel(); // Stop overlapping
const script = document.getElementById('testScript').value;
const utterance = new SpeechSynthesisUtterance(script);
const selectedVoiceName = document.getElementById('voiceSelect').value;
const voices = synth.getVoices();
const targetVoice = voices.find(v => v.name === selectedVoiceName);
if (targetVoice) utterance.voice = targetVoice;
utterance.rate = document.getElementById('rateRange').value;
utterance.pitch = document.getElementById('pitchRange').value;
synth.speak(utterance);
}
// 6. Core Initialization
function init() {
const synth = window.speechSynthesis;
if (typeof synth !== 'undefined' && synth.onvoiceschanged !== undefined) {
synth.onvoiceschanged = loadVoices;
}
loadVoices();
// Background Polling Guardrail
const retryInterval = setInterval(() => {
const success = loadVoices();
if (success) {
console.log("English voice engines deployed successfully. Monitoring loop closed.");
clearInterval(retryInterval);
}
}, 500);
// Event Bindings
document.querySelectorAll('.persona-btn').forEach(btn => {
btn.addEventListener('click', () => {
const mode = btn.getAttribute('data-mode');
handlePersonaChange(mode);
});
});
document.getElementById('rateRange').addEventListener('input', (e) => {
document.getElementById('rateValue').innerText = parseFloat(e.target.value).toFixed(2);
updateCodeOutput();
});
document.getElementById('pitchRange').addEventListener('input', (e) => {
document.getElementById('pitchValue').innerText = parseFloat(e.target.value).toFixed(2);
updateCodeOutput();
});
document.getElementById('voiceSelect').addEventListener('change', updateCodeOutput);
document.getElementById('testScript').addEventListener('input', updateCodeOutput);
document.getElementById('playBtn').addEventListener('click', speakTest);
document.getElementById('copyBtn').addEventListener('click', () => {
const codeText = document.getElementById('configOutput').innerText;
navigator.clipboard.writeText(codeText).then(() => {
const copyBtn = document.getElementById('copyBtn');
const originalText = copyBtn.innerHTML;
copyBtn.innerHTML = '✓ Code Successfully Copied to Clipboard!';
copyBtn.style.backgroundColor = '#00ff66';
copyBtn.style.color = '#000';
setTimeout(() => {
copyBtn.innerHTML = originalText;
copyBtn.style.backgroundColor = 'transparent';
copyBtn.style.color = 'var(--primary-neon)';
}, 2000);
});
});
}

window.onload = init;
    </script>
</body>
</html>
