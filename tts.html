<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Treadmill OS - TTS Tactical Lab</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: #131722;
            --accent-green: #00ff66;
            --accent-blue: #00bfff;
            --text-main: #f0f4f8;
            --text-muted: #8a99a8;
            --border-color: #242b3d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            letter-spacing: 2px;
            color: var(--accent-green);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* 橫向切換頁籤 UI */
        .persona-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: #1a202c;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn span.zh {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .tab-btn span.en {
            display: block;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .tab-btn:hover {
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: rgba(0, 255, 102, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        /* 表單區域 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        select, textarea {
            width: 100%;
            background-color: #1a202c;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* 控制滑塊 */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-blue);
        }

        .slider-val {
            font-family: monospace;
            font-size: 0.9rem;
            width: 40px;
            text-align: right;
            color: var(--accent-blue);
        }

        /* 按鈕區 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #000;
        }

        .btn-secondary {
            background-color: #242b3d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* 程式碼輸出區 */
        .output-box {
            margin-top: 25px;
            background-color: #0a0c10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            position: relative;
        }

        .output-box pre {
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: #a6accd;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .copy-toast {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            color: var(--accent-green);
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RunPro OS - TTS Tactical Lab</h1>
        <p>陪跑語音真人人聲參數調校面板</p>
    </div>

    <!-- 1. 頂部風格快速切換頁籤 -->
    <div class="persona-tabs">
        <div class="tab-btn active" onclick="applyPersona('whisper')" id="tab-whisper">
            <span class="zh">溫柔呢喃</span>
            <span class="en">Soft Whisper (👩)</span>
        </div>
        <div class="tab-btn" onclick="applyPersona('command')" id="tab-command">
            <span class="zh">低沉鐵血</span>
            <span class="en">Deep Command (👨)</span>
        </div>
        <div class="tab-btn" onclick="applyPersona('energy')" id="tab-energy">
            <span class="zh">熱情高昂</span>
            <span class="en">High Energy (👩)</span>
        </div>
    </div>

    <!-- 2. 人聲音色選擇 -->
    <div class="form-group">
        <label for="voice-select">偵測到之真人聲線 (AUTOMATIC FILTER)</label>
        <select id="voice-select" onchange="updateCode()"></select>
    </div>

    <!-- 3. 語速調整 -->
    <div class="form-group">
        <label for="rate-slider">語速 RATE (0.5 - 2.0)</label>
        <div class="slider-container">
            <input type="range" id="rate-slider" min="0.5" max="2.0" step="0.05" value="0.9" oninput="syncSlider('rate')">
            <span class="slider-val" id="rate-val">0.90</span>
        </div>
    </div>

    <!-- 4. 音高調整 -->
    <div class="form-group">
        <label for="pitch-slider">音高 PITCH (0.5 - 2.0)</label>
        <div class="slider-container">
            <input type="range" id="pitch-slider" min="0.5" max="2.0" step="0.05" value="1.05" oninput="syncSlider('pitch')">
            <span class="slider-val" id="pitch-val">1.05</span>
        </div>
    </div>

    <!-- 5. 測試文字腳本 -->
    <div class="form-group">
        <label for="text-input">測試播報內容 (TEST SCRIPT)</label>
        <textarea id="text-input" rows="2" oninput="updateCode()">我們即將在前方五百公尺左轉囉，請先變換車道。</textarea>
    </div>

    <!-- 6. 控制按鈕 -->
    <div class="btn-group">
        <button class="btn btn-primary" onclick="speak()">🔊 立即聆聽播報效果</button>
        <button class="btn btn-secondary" onclick="copyConfigCode()">📋 複製一鍵套用程式碼</button>
    </div>

    <!-- 7. 輸出代碼預覽 -->
    <div class="output-box">
        <span class="copy-toast" id="copy-toast">已複製到剪貼簿！</span>
        <label style="margin-bottom: 5px; color: var(--accent-blue);">OUTPUT CONFIG CODE</label>
        <pre id="code-output"></pre>
    </div>
</div>

<script>
    // 預設的三個人格設定參數與預設腳本
    const personas = {
        whisper: {
            rate: 0.90, pitch: 1.05,
            keywords: ['HsiaoChen', 'Meijia', 'Premium', 'Google', 'Taiwan', 'zh-TW'],
            text: '我們即將在前方五百公尺左轉囉，請先變換車道。'
        },
        command: {
            rate: 1.05, pitch: 0.88,
            keywords: ['YunJhe', 'Siri', 'Tianyang', 'Male', '男', 'Taiwan', 'zh-TW'],
            text: '警告。目前心率已進入 Z5 危險區間。等效配速四分四十五秒，請立即降速。'
        },
        energy: {
            rate: 1.20, pitch: 1.15,
            keywords: ['Hiulion', 'Sinji', 'Premium', 'Google', 'Taiwan', 'zh-TW'],
            text: '太強了吧！現在等效配速拉到四分速了！穩住！衝啊！'
        }
    };

    let currentMode = 'whisper';

    // 初始化加載語音清單（處理 Chrome/Safari 非同步加載問題）
    function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    const voiceSelect = document.getElementById('voiceSelect'); // 請對應您下拉選單的 ID
    
    if (voices.length === 0) return; // 還沒載入好就先退出

    voiceSelect.innerHTML = ''; // 清空舊選項

    // 撈取台灣中文 (zh-TW)，若真的沒有，就撈取一般中文 (zh) 避免選單全空
    let filteredVoices = voices.filter(v => v.lang.includes('TW') || v.lang.includes('zh'));
    
    // 如果該瀏覽器連中文語音都沒安裝，就塞入全部語音當最後後備
    if (filteredVoices.length === 0) filteredVoices = voices;

    filteredVoices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.innerText = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });

    // 觸發一次程式碼更新
    if (typeof updateCodeOutput === 'function') updateCodeOutput();
}
// 依據人格關鍵字順序，自動挑出最適合的內建語音
function autoSelectVoiceForCurrentMode() {
const select = document.getElementById('voice-select');
const options = [...select.options];
const keywords = personas[currentMode].keywords;
for (let kw of keywords) {
const match = options.find(opt => opt.value.toLowerCase().includes(kw.toLowerCase()));
if (match) {
select.value = match.value;
break;
}
}
}
// 點擊頂部橫向頁籤時觸發
function applyPersona(mode) {
currentMode = mode;
// 切換 Active 樣式
document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById(tab-${mode}).classList.add('active');
// 套用配置
const config = personas[mode];
document.getElementById('rate-slider').value = config.rate;
document.getElementById('rate-val').textContent = config.rate.toFixed(2);
document.getElementById('pitch-slider').value = config.pitch;
document.getElementById('pitch-val').textContent = config.pitch.toFixed(2);
document.getElementById('text-input').value = config.text;
autoSelectVoiceForCurrentMode();
updateCode();
}
// 滑塊數值同步
function syncSlider(type) {
const val = parseFloat(document.getElementById(${type}-slider).value);
document.getElementById(${type}-val).textContent = val.toFixed(2);
updateCode();
}
// 更新即時產出的複製程式碼區塊
function updateCode() {
const voiceName = document.getElementById('voice-select').value;
const rate = parseFloat(document.getElementById('rate-slider').value);
const pitch = parseFloat(document.getElementById('pitch-slider').value);
const text = document.getElementById('text-input').value;
const code = `// Pro Treadmill OS - 陪跑語音設定
const utterance = new SpeechSynthesisUtterance("${text}");
// 設定參數
utterance.rate = ${rate.toFixed(2)};
utterance.pitch = ${pitch.toFixed(2)};
// 綁定指定真人聲線
const voices = window.speechSynthesis.getVoices();
utterance.voice = voices.find(v => v.name === "${voiceName}") || voices[0];
window.speechSynthesis.speak(utterance);`;
document.getElementById('code-output').textContent = code;
}
// 執行試聽
function speak() {
// 先停止之前的播放，避免塞車
window.speechSynthesis.cancel();
const text = document.getElementById('text-input').value;
const voiceName = document.getElementById('voice-select').value;
const rate = parseFloat(document.getElementById('rate-slider').value);
const pitch = parseFloat(document.getElementById('pitch-slider').value);
const utterance = new SpeechSynthesisUtterance(text);
const voices = window.speechSynthesis.getVoices();
utterance.voice = voices.find(v => v.name === voiceName);
utterance.rate = rate;
utterance.pitch = pitch;
window.speechSynthesis.speak(utterance);
}
        // 一鍵複製功能
        function copyParams() {
            const configText = document.getElementById('configOutput').innerText;
            
            // 使用現代 Clipboard API 複製
            navigator.clipboard.writeText(configText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.innerText;
                
                // 複製成功視覺反饋
                copyBtn.innerText = '✓ 複製成功！';
                copyBtn.style.background = '#00ff66';
                copyBtn.style.color = '#000';
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.background = 'transparent';
                    copyBtn.style.color = '#00ff66';
                }, 2000);
            }).catch(err => {
                alert('複製失敗，請手動選取複製：' + err);
            });
        }

        // 初始化與事件綁定
        // 請將您 HTML 檔案中原本的 init() 函數整段替換成以下程式碼：
function init() {
    const synth = window.speechSynthesis;

    // 💡 保險機制 1：註冊非同步變更監聽器（現代瀏覽器載入完語音時會自動觸發這個）
    if (typeof synth !== 'undefined' && synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = () => {
            console.log("語音清單已透過事件觸發載入");
            loadVoices();
        };
    }
    
    // 💡 保險機制 2：頁面載入時先嘗試讀取一次（部分手機或 Safari 可直接讀取）
    loadVoices();

    // 💡 保險機制 3：終極計時器兜底（防止部分瀏覽器既不觸發事件、一開始又讀不到）
    let retryCount = 0;
    const retryInterval = setInterval(() => {
        const voices = synth.getVoices();
        if (voices.length > 0) {
            console.log("語音清單已透過計時器兜底載入，總數:", voices.length);
            loadVoices();
            clearInterval(retryInterval); // 成功抓到就停止計時
        }
        retryCount++;
        if (retryCount > 10) clearInterval(retryInterval); // 超過 5 秒就放棄防止無效迴圈
    }, 500);

    // 綁定 UI 變更事件（滑桿拖動時即時更新數值與程式碼）
    document.getElementById('personaSelect').addEventListener('change', handlePersonaChange);
    document.getElementById('voiceSelect').addEventListener('change', updateCodeOutput);
    
    document.getElementById('rateRange').addEventListener('input', (e) => {
        document.getElementById('rateValue').innerText = e.target.value;
        updateCodeOutput();
    });
    
    document.getElementById('pitchRange').addEventListener('input', (e) => {
        document.getElementById('pitchValue').innerText = e.target.value;
        updateCodeOutput();
    });
    
    document.getElementById('volumeRange').addEventListener('input', (e) => {
        document.getElementById('volumeValue').innerText = e.target.value;
        updateCodeOutput();
    });
}


        // 啟動程式
        window.onload = init;
    </script>
</body>
</html>
