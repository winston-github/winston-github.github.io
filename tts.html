<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNPRO OS - TTS TACTICAL LAB</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131a26;
            --primary-neon: #00ff66;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--primary-neon);
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* 三段人格切換按鈕 */
        .persona-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .persona-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            padding: 12px 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .persona-btn .title {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .persona-btn .sub {
            font-size: 11px;
            opacity: 0.7;
        }

        /* 激活狀態 */
        .persona-btn.active {
            border-color: var(--primary-neon);
            color: var(--primary-neon);
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        select, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-neon);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .slider-val {
            color: var(--primary-neon);
            font-family: monospace;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-neon);
            background: var(--border-color);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        #playBtn {
            background-color: var(--primary-neon);
            color: #000000;
            border: none;
        }

        #playBtn:hover {
            background-color: #00dd55;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        #copyBtn {
            background-color: transparent;
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
        }

        #copyBtn:hover {
            background: rgba(0, 255, 102, 0.1);
        }

        /* 程式碼輸出框 */
        .code-container {
            background-color: #070a10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #8da1b9;
            overflow-x: auto;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RunPro OS - TTS Tactical Lab</h1>
        <div class="subtitle">陪跑語音真人人聲參數調校面板</div>

        <!-- 3種人格大按鈕 (整合 ID 與事件切換) -->
        <div class="persona-container">
            <button class="persona-btn active" data-mode="whisper">
                <span class="title">溫柔呢喃</span>
                <span class="sub">Soft Whisper (👩)</span>
            </button>
            <button class="persona-btn" data-mode="command">
                <span class="title">低沉鐵血</span>
                <span class="sub">Deep Command (👨)</span>
            </button>
            <button class="persona-btn" data-mode="energy">
                <span class="title">熱情高昂</span>
                <span class="sub">High Energy (👩)</span>
            </button>
        </div>

        <!-- 下拉選單：修正重要 ID -->
        <div class="form-group">
            <label>偵測到之真人聲線 (AUTOMATIC FILTER)</label>
            <select id="voiceSelect">
                <option>正在搜尋系統真人聲線...</option>
            </select>
        </div>

        <!-- 語速滑桿 -->
        <div class="form-group">
            <div class="slider-header">
                <label>語速 RATE (0.5 - 2.0)</label>
                <span class="slider-val" id="rateValue">0.90</span>
            </div>
            <input type="range" id="rateRange" min="0.5" max="2.0" step="0.05" value="0.90">
        </div>

        <!-- 音高滑桿 -->
        <div class="form-group">
            <div class="slider-header">
                <label>音高 PITCH (0.5 - 2.0)</label>
                <span class="slider-val" id="pitchValue">1.05</span>
            </div>
            <input type="range" id="pitchRange" min="0.5" max="2.0" step="0.05" value="1.05">
        </div>

        <!-- 測試文案文字框 -->
        <div class="form-group">
            <label>測試播報內容 (TEST SCRIPT)</label>
            <textarea id="testScript" rows="3">我們即將在前方五百公尺左轉囉，請先變換車道。</textarea>
        </div>

        <!-- 功能按鈕組 -->
        <button id="playBtn" class="btn-action">🔊 立即聆聽播報效果</button>
        <button id="copyBtn" class="btn-action">📋 複製一鍵套用程式碼</button>

        <!-- 顯示生成參數的容器 -->
        <div class="code-container" id="configOutput">OUTPUT CONFIG CODE</div>
    </div>

    <script>
        // 內建三種經典戰術腳本模版
        const scriptTemplates = {
            whisper: "我們即將在前方五百公尺左轉囉，請先變換車道。",
            command: "警告。目前心率已進入 Z5 危險區間。當前配速快四分速，請立即降速。",
            energy: "太強了吧！現在等效配速拉到四分速了！穩住！衝啊！"
        };

        let currentMode = 'whisper';

        // 1. 載入語音引擎清單（加入 Chrome 非同步、雙重過濾與兜底機制）
        function loadVoices() {
            const synth = window.speechSynthesis;
            const voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            
            if (voices.length === 0) return;

            voiceSelect.innerHTML = '';

            // 過濾繁體中文台灣 (zh-TW) 與通用中文 (zh) 真人人聲
            let filtered = voices.filter(v => v.lang.includes('TW') || v.lang.includes('zh'));
            
            // 後備防呆：萬一該系統沒裝任何中文人聲，顯示所有聲音，絕不空窗
            if (filtered.length === 0) filtered = voices;

            filtered.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.innerText = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });

            // 自動根據目前選擇的人格模式，去挑選最適合的預設真人人聲
            autoSelectVoiceForMode();
            updateCodeOutput();
        }

        // 2. 自動在下拉選單中匹配最合適的優質真人聲線
        function autoSelectVoiceForMode() {
            const voiceSelect = document.getElementById('voiceSelect');
            const options = Array.from(voiceSelect.options);
            
            let targetKeywords = [];
            if (currentMode === 'whisper') targetKeywords = ['HsiaoChen', 'Meijia', 'Premium', 'Google', 'Taiwan', 'Female', '女'];
            if (currentMode === 'command') targetKeywords = ['YunJhe', 'Siri', 'Tianyang', 'Male', '男'];
            if (currentMode === 'energy') targetKeywords = ['Hiulion', 'Sinji', 'Premium', 'Google', 'Taiwan'];

            // 尋找最相近的聲線
            const bestMatch = options.find(opt => 
                targetKeywords.some(kw => opt.value.toLowerCase().includes(kw.toLowerCase()))
            );

            if (bestMatch) {
                voiceSelect.value = bestMatch.value;
            } else if (options.length > 0) {
                // 沒有完美匹配時，預設選取第一個
                voiceSelect.selectedIndex = 0;
            }
        }

        // 3. 處理人格大按鈕的點擊切換事件
        function handlePersonaChange(mode) {
            currentMode = mode;
            
            // 切換按鈕的 Active UI 樣式
            document.querySelectorAll('.persona-btn').forEach(btn => {
                btn.classList.remove('active');

if (btn.getAttribute('data-mode') === mode) btn.classList.add('active');
});
// 根據選擇的人格自動帶入推薦的參數與測試文字
const rateRange = document.getElementById('rateRange');
const pitchRange = document.getElementById('pitchRange');
const testScript = document.getElementById('testScript');
if (mode === 'whisper') {
rateRange.value = 0.90; pitchRange.value = 1.05;
} else if (mode === 'command') {
rateRange.value = 1.05; pitchRange.value = 0.85;
} else if (mode === 'energy') {
rateRange.value = 1.20; pitchRange.value = 1.15;
}
// 更新滑桿數字顯示
document.getElementById('rateValue').innerText = parseFloat(rateRange.value).toFixed(2);
document.getElementById('pitchValue').innerText = parseFloat(pitchRange.value).toFixed(2);
// 帶入相對應的戰術語句
testScript.value = scriptTemplates[mode];
autoSelectVoiceForMode();
updateCodeOutput();
}
// 4. 即時更新並在面板底部渲染出可以複製的程式碼
function updateCodeOutput() {
const selectedVoice = document.getElementById('voiceSelect').value;
const rate = document.getElementById('rateRange').value;
const pitch = document.getElementById('pitchRange').value;
const script = document.getElementById('testScript').value;
const codeTemplate = // RunPro OS - TTS 戰術生成參數 const utterance = new SpeechSynthesisUtterance("${script}"); const voices = window.speechSynthesis.getVoices(); utterance.voice = voices.find(v => v.name === "${selectedVoice}"); utterance.rate = ${rate}; utterance.pitch = ${pitch}; utterance.volume = 1.0; window.speechSynthesis.speak(utterance);;
document.getElementById('configOutput').innerText = codeTemplate;
}
// 5. 執行聆聽播報效果
function speakTest() {
const synth = window.speechSynthesis;
// 避免多重語音重疊播放，播報前先強迫中斷上一句
synth.cancel();
const script = document.getElementById('testScript').value;
const utterance = new SpeechSynthesisUtterance(script);
const selectedVoiceName = document.getElementById('voiceSelect').value;
const voices = synth.getVoices();
const targetVoice = voices.find(v => v.name === selectedVoiceName);
if (targetVoice) utterance.voice = targetVoice;
utterance.rate = document.getElementById('rateRange').value;
utterance.pitch = document.getElementById('pitchRange').value;
synth.speak(utterance);
}
// 6. 核心初始化邏輯
function init() {
const synth = window.speechSynthesis;
// 解決 Chrome/Edge 非同步加載語音的監聽器
if (typeof synth !== 'undefined' && synth.onvoiceschanged !== undefined) {
synth.onvoiceschanged = loadVoices;
}
loadVoices();
// 計時器保險機制（防止部分電腦環境不觸發 onvoiceschanged）
const retryInterval = setInterval(() => {
if (synth.getVoices().length > 0) {
loadVoices();
clearInterval(retryInterval);
}
}, 500);
// 綁定上方三組人格大按鈕的點擊監聽事件
document.querySelectorAll('.persona-btn').forEach(btn => {
btn.addEventListener('click', () => {
const mode = btn.getAttribute('data-mode');
handlePersonaChange(mode);
});
});
// 綁定滑桿即時連動事件
document.getElementById('rateRange').addEventListener('input', (e) => {
document.getElementById('rateValue').innerText = parseFloat(e.target.value).toFixed(2);
updateCodeOutput();
});
document.getElementById('pitchRange').addEventListener('input', (e) => {
document.getElementById('pitchValue').innerText = parseFloat(e.target.value).toFixed(2);
updateCodeOutput();
});
document.getElementById('voiceSelect').addEventListener('change', updateCodeOutput);
document.getElementById('testScript').addEventListener('input', updateCodeOutput);
// 綁定功能動作按鈕
document.getElementById('playBtn').addEventListener('click', speakTest);
document.getElementById('copyBtn').addEventListener('click', () => {
const codeText = document.getElementById('configOutput').innerText;
navigator.clipboard.writeText(codeText).then(() => {
const copyBtn = document.getElementById('copyBtn');
const originalText = copyBtn.innerHTML;
copyBtn.innerHTML = '✓ 參數已成功套用至剪貼簿！';
copyBtn.style.backgroundColor = '#00ff66';
copyBtn.style.color = '#000';
setTimeout(() => {
copyBtn.innerHTML = originalText;
copyBtn.style.backgroundColor = 'transparent';
copyBtn.style.color = 'var(--primary-neon)';
}, 2000);
});
});
}
window.onload = init;
    </script>
</body>
</html>
