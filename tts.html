<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RUNPRO OS - Bilingual TTS Tactical Lab</title>
<style>
:root{--bg:#0b0f19;--panel:#131a26;--panel2:#0f1520;--green:#00ff66;--text:#fff;--muted:#8b9bb0;--border:#263246;--danger:#ff5364}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#142238 0,var(--bg) 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;padding:18px}.app{width:min(720px,100%);margin:auto;background:rgba(19,26,38,.96);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.45)}h1{margin:0;color:var(--green);text-align:center;font-size:21px;letter-spacing:2px}.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px}.persona-btn,.mini-btn{font:inherit}.env-grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}.env-info{background:#090d15;border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:#b9c9da;font:11px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.env-copy{border:1px solid var(--green);background:rgba(0,255,102,.07);color:var(--green);border-radius:8px;padding:0 14px;font-weight:800;cursor:pointer}.env-copy:hover{background:var(--green);color:#001709}.step{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.step-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}.step-no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,255,102,.12);color:var(--green);font-size:12px;font-weight:800}.step-title{font-size:13px;font-weight:800;letter-spacing:.5px}.step-hint{margin-left:auto;color:var(--muted);font-size:11px}select,textarea{width:100%;background:#090d15;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;font-size:14px;outline:none}select:focus,textarea:focus{border-color:var(--green)}.voice-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;color:#bdd0e5;background:#172235;border:1px solid #293a53;border-radius:999px;padding:4px 8px}.badge.locked{color:var(--green);border-color:rgba(0,255,102,.35)}.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.style-option{display:flex;align-items:flex-start;gap:10px;text-align:left;background:#0a0f18;border:1px solid var(--border);border-radius:10px;color:#d6e2ef;padding:12px;min-height:76px;cursor:pointer}.style-option:hover{border-color:#4a607d}.style-option.active{border-color:var(--green);background:rgba(0,255,102,.06);box-shadow:0 0 0 1px rgba(0,255,102,.1)}.style-radio{width:17px;height:17px;border:2px solid #60738e;border-radius:50%;margin-top:2px;flex:0 0 auto;position:relative}.style-option.active .style-radio{border-color:var(--green)}.style-option.active .style-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green)}.style-name{font-size:13px;font-weight:800;color:#e8f0f8}.style-option.active .style-name{color:var(--green)}.style-note{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:5px}.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.persona-btn{min-height:78px;background:#0a0f18;border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:10px 6px;cursor:pointer}.persona-btn strong{display:block;color:#dbe8f6;font-size:13px;margin-bottom:5px}.persona-btn span{font-size:11px}.persona-btn.active{border-color:var(--green);background:rgba(0,255,102,.06);box-shadow:0 0 0 1px rgba(0,255,102,.12)}.persona-btn.active strong,.persona-btn.active span{color:var(--green)}.tuning{display:grid;grid-template-columns:1fr 1fr;gap:15px}.slider-row{margin-bottom:14px}.slider-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.value{color:var(--green);font-family:ui-monospace,monospace;font-weight:800}input[type=range]{width:100%;accent-color:var(--green)}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.mini-btn{background:#121c2b;border:1px solid var(--border);color:#b6c6d9;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:11px}.mini-btn:hover{border-color:var(--green);color:var(--green)}textarea{resize:vertical;min-height:86px;line-height:1.5}.actions{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:9px}.action{border-radius:9px;padding:13px 10px;font-weight:800;cursor:pointer;border:1px solid var(--green);background:transparent;color:var(--green)}.action.primary{background:var(--green);color:#001709}.action.danger{border-color:var(--danger);color:var(--danger)}.code{margin-top:14px;background:#070a10;border:1px solid var(--border);border-radius:9px;padding:13px;color:#9db0c6;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow:auto;max-height:240px}.footerline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:580px){body{padding:10px}.app{padding:17px}.env-grid{grid-template-columns:1fr}.env-copy{padding:11px}.style-grid{grid-template-columns:1fr}.personas{grid-template-columns:1fr}.tuning{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.step-hint{display:none}}
</style>
</head>
<body><main class="app">
<h1>RUNPRO OS - TTS TACTICAL LAB</h1><div class="subtitle" id="subtitle"></div>

<section class="step"><div class="step-head"><span class="step-no">0</span><span class="step-title" data-i18n="envTitle"></span><span class="step-hint" data-i18n="envHint"></span></div><div class="env-grid"><div class="env-info" id="envInfo"></div><button class="env-copy" id="copyEnvBtn"></button></div></section>
<section class="step"><div class="step-head"><span class="step-no">1</span><span class="step-title" data-i18n="voiceTitle"></span><span class="step-hint" data-i18n="voiceHint"></span></div><select id="voiceSelect"><option>Loading voices...</option></select><div class="voice-meta"><span class="badge locked" id="lockBadge"></span><span class="badge" id="voiceCount"></span><span class="badge" id="voiceLang"></span></div></section>
<section class="step"><div class="step-head"><span class="step-no">2</span><span class="step-title" data-i18n="tenStyleTitle"></span><span class="step-hint" data-i18n="tenStyleHint"></span></div><div class="style-grid" id="styleGrid"></div><div style="margin-top:14px"><textarea id="testScript"></textarea></div></section>
<div class="actions"><button class="action primary" id="playBtn"></button><button class="action danger" id="stopBtn"></button><button class="action" id="copyBtn"></button></div><pre class="code" id="configOutput"></pre><div class="footerline"><span id="status"></span><span>Settings saved locally</span></div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const UI={subtitle:'中英文雙語真人聲線與代表性說話風格 / Bilingual Human Voices & Representative Speaking Styles',envTitle:'瀏覽器與 TTS 環境資訊 / Browser & TTS Environment',envHint:'即時從目前裝置讀取 / Read live from this device',copyEnv:'一鍵複製環境資訊 / Copy Environment Info',envCopied:'環境資訊已複製 / Environment info copied',voiceTitle:'偵測到之中英文真人聲線 / Detected Chinese & English Human Voices (AUTOMATIC FILTER)',voiceHint:'涵蓋所有中文語系及英文地區；風格切換不覆寫聲線 / All Chinese varieties and English regions; styles preserve the selected voice',lock:'聲線已鎖定 / Voice selection locked',voices:n=>`中英文系列聲線 ${n} 個 / ${n} Chinese & English voices`,empty:'找不到中英文系列聲線，暫時顯示全部系統聲線 / No matching voices; showing all system voices',tenStyleTitle:'選擇代表性說話風格 / Choose a Representative Speaking Style',tenStyleHint:'十選一，自動套用完整語音表現 / Ten presets apply complete vocal expression',scriptLabel:'雙語測試文案 / Bilingual Test Script',play:'立即試聽 / Test Voice',stop:'停止 / Stop',copy:'複製設定程式碼 / Copy Config Code',ready:'設定已就緒 / Configuration ready',copied:'已複製到剪貼簿 / Copied to clipboard'};
const styles={
deepCommand:{name:'低沉指令 / Deep Command',note:'男：霸總／指揮官・女：御姊／女主管 / Male: commanding CEO or commander · Female: confident leader',rate:.96,pitch:.80,volume:1,zh:'聽我的，先穩住呼吸，把節奏控制好，接下來照計畫完成。',en:'Listen carefully. Stabilize your breathing, control the rhythm, and execute the next section as planned.'},
gentleCare:{name:'溫柔關懷 / Gentle Care',note:'男：體貼男友／暖心哥哥・女：溫柔女友／療癒姊姊 / Male: caring boyfriend or warm older brother · Female: gentle partner or comforting sister',rate:.88,pitch:1.02,volume:.90,zh:'不用急，慢慢把呼吸穩下來，我會陪你保持舒服而穩定的節奏。',en:'There is no need to rush. Settle your breathing and I will stay with you at a comfortable, steady rhythm.'},
professionalCalm:{name:'專業沉著 / Professional Calm',note:'男：專業顧問／教練・女：溫柔秘書／專案經理 / Male: consultant or coach · Female: gentle secretary or project manager',rate:.98,pitch:.98,volume:.96,zh:'提醒您，下一階段即將開始，請維持目前步頻並留意呼吸狀態。',en:'A reminder that the next phase is about to begin. Maintain your cadence and monitor your breathing.'},
brightEnergy:{name:'明亮熱情 / Bright Energy',note:'男：小奶狗／熱血學弟・女：啦啦隊長／元氣女友 / Male: sweet puppy boyfriend or energetic junior · Female: cheer captain or lively girlfriend',rate:1.18,pitch:1.16,volume:1,zh:'太棒了！保持這個節奏，動作俐落一點，我們一起把這一段漂亮完成！',en:'Excellent! Hold this rhythm, keep your movements sharp, and let us finish this section strongly together!'},
friendlyNatural:{name:'親切自然 / Friendly Natural',note:'男：鄰家哥哥／好友・女：鄰家姊姊／朋友 / Male: boy next door or close friend · Female: girl next door or friend',rate:1,pitch:1,volume:.96,zh:'目前狀態不錯，就照自己的節奏跑，前面這一段穩穩通過就好。',en:'You are looking good. Keep your own rhythm and move steadily through the section ahead.'},
shyAdmiration:{name:'害羞景仰 / Shy Admiration',note:'男：靦腆學弟／仰慕者・女：害羞學妹／崇拜者 / Male: shy junior or admirer · Female: shy junior classmate or admirer',rate:.85,pitch:1.20,volume:.84,zh:'那個……你真的很厲害，如果可以的話，請繼續保持現在的節奏，我會幫你加油。',en:'Um... you are honestly amazing. If it is okay, keep this rhythm. I will be cheering for you.'},
tsundereFirm:{name:'傲嬌激勵 / Tsundere Motivation',note:'男：嘴硬男友／競爭對手・女：傲嬌女友／強勢學姊 / Male: reluctant boyfriend or rival · Female: tsundere girlfriend or assertive senior',rate:1.08,pitch:1.08,volume:.98,zh:'才不是特地鼓勵你，只是你現在表現還不錯，不准突然放棄，繼續跑。',en:'It is not like I am encouraging you on purpose. You are doing fairly well, so do not quit now. Keep moving.'},
seriousWarning:{name:'嚴肅警示 / Serious Warning',note:'男：安全官／嚴格教練・女：紀律主管／冷靜教官 / Male: safety officer or strict coach · Female: discipline lead or composed instructor',rate:.92,pitch:.84,volume:1,zh:'警告，目前強度已超過安全範圍，請立即降低速度並確認身體狀況。',en:'Warning. Your current intensity exceeds the safe range. Reduce speed immediately and check your condition.'},
playfulTease:{name:'俏皮逗趣 / Playful Teasing',note:'男：調皮男友／損友・女：俏皮女友／活潑學妹 / Male: playful boyfriend or cheeky friend · Female: playful girlfriend or lively junior',rate:1.12,pitch:1.14,volume:.96,zh:'喂，不會這麼快就累了吧？再保持一下，跑完這段再讓你得意。',en:'Hey, you are not tired already, are you? Hold on a little longer and earn your victory after this section.'},
soothingWhisper:{name:'安撫輕語 / Soothing Whisper',note:'男：療癒系男友／溫柔哥哥・女：知心姊姊／柔聲陪伴者 / Male: soothing boyfriend or gentle brother · Female: caring sister or soft-spoken companion',rate:.78,pitch:1.04,volume:.76,zh:'放鬆肩膀，慢慢呼吸，只要專注下一步就好，我會安靜地陪著你。',en:'Relax your shoulders and breathe slowly. Focus only on the next step. I will stay quietly beside you.'}}
const state=Object.assign({style:'friendlyNatural',voice:'',customScript:false},JSON.parse(localStorage.getItem('runproTTSBilingualUnified')||'{}'));
let allVoices=[];const save=()=>localStorage.setItem('runproTTSBilingualUnified',JSON.stringify(state));
function isChineseVoice(v){const lang=(v.lang||'').toLowerCase().replace(/_/g,'-'),meta=`${v.name||''} ${v.voiceURI||''}`.toLowerCase(),codes=['zh','cmn','yue','wuu','nan','hak','hsn','gan','cjy','lzh'],hints=['chinese','mandarin','cantonese','中文','國語','国语','普通話','普通话','華語','华语','粵語','粤语','台灣','台湾','香港','澳門','澳门','新加坡','tingting','huihui','yaoyao','kangkang','xiaoxiao','xiaoyi','xiaomo','yunxi','yunyang','yunxia','yunfeng','yunhao','yunze','yunjian','xiaobei','xiaoni','xiaohan','xiaorui','xiaoshuang','xiaoqiu','xiaoyan','xiaozhen','xiaochen','meijia','yun-jhe','sin-ji','hiu-gaai','hiu-maan'];return codes.some(c=>lang===c||lang.startsWith(c+'-'))||hints.some(h=>meta.includes(h))}
function isEnglishVoice(v){return(v.lang||'').toLowerCase().replace(/_/g,'-').startsWith('en')}
function languageMatch(v){return isChineseVoice(v)||isEnglishVoice(v)}
function detectBrowser(){const ua=navigator.userAgent;let name='Unknown Browser',version='Not exposed';for(const[n,r]of[['Microsoft Edge',/Edg\/([\d.]+)/],['Opera',/OPR\/([\d.]+)/],['Samsung Internet',/SamsungBrowser\/([\d.]+)/],['Chrome iOS',/CriOS\/([\d.]+)/],['Google Chrome',/Chrome\/([\d.]+)/],['Firefox iOS',/FxiOS\/([\d.]+)/],['Mozilla Firefox',/Firefox\/([\d.]+)/],['Apple Safari',/Version\/([\d.]+).*Safari/]]){const m=ua.match(r);if(m){name=n;version=m[1];break}}return{name,version,ua}}
function environmentText(){const b=detectBrowser(),supported='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window,v=allVoices.find(x=>x.name===$('#voiceSelect').value);return[`瀏覽器 / Browser：${b.name} ${b.version}`,`平台 / Platform：${navigator.platform||'未提供 / Not exposed'}`,`系統語言 / System language：${navigator.language||'未提供 / Not exposed'}`,`Web Speech TTS：${supported?'支援 / Supported':'不支援 / Not supported'}`,`TTS API 版本 / Version：瀏覽器未公開 / Not exposed by browser`,`偵測聲線總數 / Detected voices：${allVoices.length}`,`目前聲線 / Selected voice：${v?v.name:'尚未載入 / Not loaded'}`,`聲線語言 / Voice language：${v?v.lang:'—'}`,`聲線來源 / Voice source：${v?(v.localService?'Local':'Remote / Unspecified'):'—'}`,`User Agent：${b.ua}`].join('\n')}
function updateEnvironment(){$('#envInfo').textContent=environmentText()}
function bilingualScript(x){return`${x.zh}\n\n${x.en}`}
function render(){document.documentElement.lang='zh-Hant';$('#subtitle').textContent=UI.subtitle;$$('[data-i18n]').forEach(e=>e.textContent=UI[e.dataset.i18n]);$('#lockBadge').textContent=UI.lock;$('#copyEnvBtn').textContent=UI.copyEnv;$('#playBtn').textContent=UI.play;$('#stopBtn').textContent=UI.stop;$('#copyBtn').textContent=UI.copy;$('#status').textContent=UI.ready;renderStyles();updateOutput();updateEnvironment()}
function renderStyles(){const grid=$('#styleGrid');grid.innerHTML='';Object.entries(styles).forEach(([id,x])=>{const b=document.createElement('button');b.className='style-option'+(state.style===id?' active':'');b.innerHTML=`<span class="style-radio"></span><span><span class="style-name">${x.name}</span><small class="style-note">${x.note}</small></span>`;b.onclick=()=>applyStyle(id);grid.appendChild(b)})}
function applyStyle(id){state.style=id;state.customScript=false;$('#testScript').value=bilingualScript(styles[id]);renderStyles();save();updateOutput()}
function loadVoices(){allVoices=speechSynthesis.getVoices();if(!allVoices.length)return false;let list=allVoices.filter(languageMatch),fallback=false;if(!list.length){list=allVoices;fallback=true}list.sort((a,b)=>{const group=v=>isChineseVoice(v)?0:1;return group(a)-group(b)||(a.lang||'').localeCompare(b.lang||'')||(Number(b.localService)-Number(a.localService))||a.name.localeCompare(b.name)});$('#voiceSelect').innerHTML='';let lastGroup='';list.forEach(v=>{const group=isChineseVoice(v)?'中文系列 / Chinese':'英文系列 / English';if(group!==lastGroup){const g=document.createElement('optgroup');g.label=group;g.dataset.group=group;$('#voiceSelect').appendChild(g);lastGroup=group}const target=[...$('#voiceSelect').querySelectorAll('optgroup')].at(-1);target.appendChild(new Option(`${v.name} (${v.lang})${v.localService?' • Local':''}`,v.name))});if(state.voice&&list.some(v=>v.name===state.voice))$('#voiceSelect').value=state.voice;else{$('#voiceSelect').selectedIndex=0;state.voice=$('#voiceSelect').value;save()}$('#voiceCount').textContent=fallback?UI.empty:UI.voices(list.length);syncVoiceMeta();updateOutput();return true}
function syncVoiceMeta(){const v=allVoices.find(x=>x.name===$('#voiceSelect').value);$('#voiceLang').textContent=v?`${v.lang} · ${isChineseVoice(v)?'中文 / Chinese':'English'} · ${v.localService?'Local':'Remote'}`:'—';updateEnvironment()}
function updateOutput(){const x=styles[state.style],text=$('#testScript').value.replace(/\\/g,'\\\\').replace(/`/g,'\\`'),voice=state.voice||'';$('#configOutput').textContent=`const text = \`${text}\`;\nconst utterance = new SpeechSynthesisUtterance(text);\nconst voices = window.speechSynthesis.getVoices();\nutterance.voice = voices.find(v => v.name === ${JSON.stringify(voice)});\nutterance.lang = utterance.voice?.lang || 'zh-TW';\nutterance.rate = ${x.rate};\nutterance.pitch = ${x.pitch};\nutterance.volume = ${x.volume};\nwindow.speechSynthesis.cancel();\nwindow.speechSynthesis.speak(utterance);`}
function speak(){const x=styles[state.style],u=new SpeechSynthesisUtterance($('#testScript').value),voice=allVoices.find(v=>v.name===$('#voiceSelect').value)||null;speechSynthesis.cancel();u.voice=voice;u.lang=voice?.lang||'zh-TW';u.rate=x.rate;u.pitch=x.pitch;u.volume=x.volume;speechSynthesis.speak(u)}
$('#voiceSelect').onchange=()=>{state.voice=$('#voiceSelect').value;syncVoiceMeta();save();updateOutput()};$('#testScript').oninput=()=>{state.customScript=true;save();updateOutput()};$('#playBtn').onclick=speak;$('#stopBtn').onclick=()=>speechSynthesis.cancel();$('#copyEnvBtn').onclick=async()=>{await navigator.clipboard.writeText(environmentText());$('#status').textContent=UI.envCopied};$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#configOutput').textContent);$('#status').textContent=UI.copied};
function init(){if(!styles[state.style])state.style='friendlyNatural';$('#testScript').value=bilingualScript(styles[state.style]);render();speechSynthesis.onvoiceschanged=loadVoices;loadVoices();let tries=0,poll=setInterval(()=>{if(loadVoices()||++tries>20)clearInterval(poll)},250)}init();
</script></body></html>
