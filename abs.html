<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>專業核心肌群訓練系統</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --color-work: #00E5FF; /* 霓虹青 */
            --color-rest: #FFB300; /* 琥珀黃 */
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --sa-top: env(safe-area-inset-top, 20px);
            --sa-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none; 
            overscroll-behavior: none;
            width: 100vw; height: 100dvh;
            display: flex; flex-direction: column;
        }

        .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .hidden { opacity: 0; pointer-events: none; }

        /* --- 主畫面 --- */
        #home-screen { padding: calc(var(--sa-top) + 20px) 20px var(--sa-bottom); align-items: center; justify-content: center; }
        .hero-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
        .hero-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 40px; letter-spacing: 1px;}
        
        .menu-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background: var(--surface); border: 1px solid #333; border-radius: 12px;
            padding: 20px; color: var(--text-main); text-align: left;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: background 0.1s;
        }
        .menu-btn:active { background: var(--surface-hover); }
        .menu-day { font-size: 1.2rem; font-weight: 700; }
        .menu-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

        /* --- 對話框 (修復黑畫面 Bug) --- */
        #modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 50; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 30px 20px calc(var(--sa-bottom) + 20px);
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 85vh; display: flex; flex-direction: column;
        }
        #modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .modal-title { font-size: 1.5rem; font-weight: bold; }
        .btn-close-modal { background: none; border: none; color: var(--text-muted); padding: 5px; }
        
        .ex-list { list-style: none; margin-bottom: 20px; overflow-y: auto; flex: 1; }
        .ex-item { padding: 14px 0; border-bottom: 1px solid #222; }
        .ex-name { font-weight: 600; font-size: 1.1rem; color: var(--text-main); }
        .ex-context { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
        .btn-start {
            width: 100%; background: var(--text-main); color: var(--bg); border: none;
            padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }

        /* --- 訓練畫面 --- */
        #workout-screen { background: var(--bg); justify-content: space-between; padding-top: var(--sa-top); padding-bottom: var(--sa-bottom); }
        
        .progress-container { width: 100%; height: 4px; background: #222; position: absolute; top: 0; left: 0; z-index: 30;}
        #global-progress { height: 100%; background: var(--color-work); width: 0%; transition: width 0.1s linear; }

        .hud-top { padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .status-text { font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .round-text { font-size: 0.9rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        .close-btn-wrapper { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;}
        .close-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none;}
        .close-ring circle { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset 0.1s; }

        .main-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #timer { 
            font-family: var(--font-mono); font-size: 8rem; font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums; letter-spacing: -2px; z-index: 20; text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0.8; }

        .hud-bottom { padding: 20px 20px 40px; text-align: center; z-index: 20; }
        #ex-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; line-height: 1.2; }
        #ex-cue { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 15px; font-weight: 500;}
        #ex-next { font-size: 0.95rem; color: #555; }

        #gesture-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; }
        #pause-indicator {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px 40px; border-radius: 12px;
            font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;
            border: 1px solid #333; backdrop-filter: blur(5px); z-index: 45;
        }

        .theme-work { color: var(--color-work); }
        .theme-rest { color: var(--color-rest); }
        .theme-prep { color: var(--text-main); }

        /* --- 完成畫面 --- */
        #done-screen { align-items: center; justify-content: center; padding: 20px; text-align: center;}
        .done-icon { width: 80px; height: 80px; stroke: var(--color-work); margin-bottom: 20px; }
        .stat-box { background: var(--surface); border-radius: 12px; padding: 25px; width: 100%; max-width: 320px; margin: 30px 0; border: 1px solid #222;}
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1rem;}
        .stat-item:last-child { margin-bottom: 0; }
        .stat-val { font-family: var(--font-mono); font-weight: bold; }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home-screen" class="screen">
        <div class="hero-title">核心肌群訓練系統</div>
        <div class="hero-sub">生物力學與中軸剛性建構</div>
        <div class="menu-list">
            <button class="menu-btn" onclick="openModal(1)">
                <div><div class="menu-day">DAY 1</div><div class="menu-desc">腹直肌與抗伸展 / 建立剛性</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(2)">
                <div><div class="menu-day">DAY 2</div><div class="menu-desc">側腹與抗旋轉 / 多面向穩定</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(3)">
                <div><div class="menu-day">DAY 3</div><div class="menu-desc">高活動度核心 / 動態收縮</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- 預覽清單彈窗 -->
    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modal-title" class="modal-title">DAY X</div>
                <button class="btn-close-modal" onclick="closeModal()">
                    <svg class="icon"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul id="modal-list" class="ex-list"></ul>
            <button class="btn-start" onclick="initWorkout()">開始訓練</button>
        </div>
    </div>

    <!-- 訓練畫面 -->
    <div id="workout-screen" class="screen hidden">
        <div class="progress-container"><div id="global-progress"></div></div>
        
        <div class="hud-top">
            <div>
                <div id="ui-status" class="status-text theme-prep">PREPARE</div>
                <div id="ui-round" class="round-text">ROUND 1 / 4</div>
            </div>
            <!-- 長按結束按鈕 -->
            <div class="close-btn-wrapper" id="btn-close">
                <svg class="close-ring"><circle cx="22" cy="22" r="18"></circle></svg>
                <svg class="icon" style="stroke:var(--text-muted);"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>

        <div class="main-display">
            <canvas id="anim-canvas"></canvas>
            <div id="timer">00</div>
        </div>

        <div class="hud-bottom">
            <div id="ex-title">--</div>
            <div id="ex-cue">--</div>
            <div id="ex-next">--</div>
        </div>

        <!-- 隱形手勢遮罩 -->
        <div id="gesture-overlay"></div>
        <div id="pause-indicator" class="hidden">PAUSED</div>
    </div>

    <!-- 完成畫面 -->
    <div id="done-screen" class="screen hidden">
        <svg class="icon done-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <div class="hero-title">訓練完成</div>
        <div class="hero-sub" style="margin-bottom:0">強悍的軀幹是運動表現的基石。</div>
        
        <div class="stat-box">
            <div class="stat-item"><span>總作動時間</span><span id="stat-time" class="stat-val">00:00</span></div>
            <div class="stat-item"><span>完成回合</span><span id="stat-round" class="stat-val">4 / 4</span></div>
        </div>
        
        <button class="menu-btn" style="justify-content:center; padding: 18px; width:100%; max-width: 320px;" onclick="goHome()">
            <span class="menu-day">返回主畫面</span>
        </button>
    </div>

    <script>
        /**
         * 系統核心架構
         * 1. 嚴格的時間軸 (performance.now)
         * 2. 生物力學關鍵格插值動畫 (Keyframe Interpolation)
         * 3. 系統級防禦 (WakeLock, AudioContext Resume, Event Throttling)
         */

        const CONFIG = { WORK_SEC: 45, REST_SEC: 15, PREP_SEC: 5, TOTAL_ROUNDS: 4 };

        const SCHEDULE = {
            1: [
                { id:'v_up', name: 'V字仰臥起坐', cue: '下背不懸空・手腳同步', txt1: '上去吐氣，下來吸氣。', txt2: '控制下放速度，避免直接摔回地板。', ctx: '建立軀幹中軸剛性，增強腹直肌爆發與控制力。' },
                { id:'rev_crunch', name: '反向捲腹', cue: '下腹發力・骨盆微捲', txt1: '想像把肚臍壓向脊椎。', txt2: '不要靠慣性，用下腹把骨盆抬起。', ctx: '強化下腹，改善骨盆前傾引發的下背不適。' },
                { id:'toe_touch', name: '直腿觸踝', cue: '雙腿打直・肩胛離地', txt1: '視線看向腳尖，脖子放鬆。', txt2: '肩膀再抬高一點，感覺上腹在收縮。', ctx: '加強上腹持續收縮，維持動作時的挺拔姿勢。' },
                { id:'dead_bug', name: '死蟲式', cue: '下背釘死・對側延伸', txt1: '下背絕對不能離開地板。', txt2: '如果腰會痠，把腰用力壓向地板！', ctx: '四肢活動時，維持骨盆與腰椎中立位的絕對穩定。' },
                { id:'plank', name: '棒式撐體', cue: '臀部夾緊・身體一直線', txt1: '手肘推地板，不要聳肩。', txt2: '全身繃緊，臀部不要掉下來，撐住！', ctx: '核心抗伸展基石，增強等長收縮耐力。' }
            ],
            2: [
                { id:'rt', name: '俄羅斯轉體', cue: '胸口隨轉・視線跟隨', txt1: '轉動你的胸椎，不是只有手在揮。', txt2: '雙腳穩住不要左右晃，核心收緊。', ctx: '強化抗旋轉能力，減少多面向運動時的能量流失。' },
                { id:'bike', name: '腳踏車捲腹', cue: '放慢節奏・肘找對膝', txt1: '重點是旋轉的幅度，不是速度。', txt2: '肩膀徹底離開地板扭轉，感受側腹擠壓。', ctx: '對側動力鏈整合，提升軀幹扭轉控制力。' },
                { id:'side_plank_r', name: '側棒式 (右)', cue: '骨盆頂高・側腹收緊', txt1: '想像身體是一面平整的牆。', txt2: '骨盆往上頂！撐起你的右側腹。', ctx: '側向穩定度，建立脊椎兩側肌力平衡。' },
                { id:'side_plank_l', name: '側棒式 (左)', cue: '骨盆頂高・呼吸平穩', txt1: '換邊。肩關節在手肘正上方。', txt2: '發抖是正常的，把臀部再推高兩公分。', ctx: '側向穩定度，建立脊椎兩側肌力平衡。' },
                { id:'side_v', name: '側躺捲腹', cue: '側腹發力・手腳相碰', txt1: '用側腹力量把上半身和雙腿拉近。', txt2: '不要用底下的手撐，側腹主導發力。', ctx: '側腰極限收縮，增強單側肌群爆發力。' }
            ],
            3: [
                { id:'mt_climber', name: '登山者', cue: '骨盆穩定・膝蓋找胸', txt1: '把背部撐飽滿，不要塌腰。', txt2: '加快節奏！臀部不要上下彈跳。', ctx: '高心率狀態下鎖死骨盆，強化動態支撐。' },
                { id:'flutter', name: '剪刀腿', cue: '下背壓地・小幅交叉', txt1: '腿不用抬太高，越貼近地板越吃力。', txt2: '把腰用力壓平，雙腿繃直！', ctx: '雙腿持續交替下，維持腹部剛性張力。' },
                { id:'plank_jack', name: '棒式開合跳', cue: '核心繃緊・控制跳躍', txt1: '雙腳開合，上半身保持穩定。', txt2: '核心鎖死！不要讓臀部跟著甩動。', ctx: '下肢跳躍震動時，維持軀幹抗震與剛性。' },
                { id:'heel_touch', name: '交替摸腳踝', cue: '肩胛微離・左右平移', txt1: '眼睛看天花板，用側腹左右滑動。', txt2: '指尖去碰鞋跟，肩膀不要掉下來。', ctx: '軀幹側向靈活度與側腹肌群耐力。' },
                { id:'hollow', name: '大字伸展', cue: '下背壓平・全身繃緊', txt1: '身體變成一個微彎的香蕉。', txt2: '最後的堅持！把腰死死壓在地板上，撐住！', ctx: '全身張力整合，核心耐力的終極試煉。' }
            ]
        };

        let state = {
            day: 1, phase: 'PREP', round: 1, exIndex: 0,
            timeLeft: 0, isPaused: false, lastTick: 0, activeTimeMs: 0,
            flags: {}
        };
        
        let activeDayData = [];
        let reqAnimId = null;
        let actx = null, synth = window.speechSynthesis;
        let wakeLock = null;

        const els = {
            home: document.getElementById('home-screen'),
            modal: document.getElementById('modal-overlay'),
            workout: document.getElementById('workout-screen'),
            done: document.getElementById('done-screen'),
            modalTitle: document.getElementById('modal-title'),
            modalList: document.getElementById('modal-list'),
            timer: document.getElementById('timer'),
            uiStatus: document.getElementById('ui-status'),
            uiRound: document.getElementById('ui-round'),
            exTitle: document.getElementById('ex-title'),
            exCue: document.getElementById('ex-cue'),
            exNext: document.getElementById('ex-next'),
            progress: document.getElementById('global-progress'),
            pauseInd: document.getElementById('pause-indicator'),
            closeCircle: document.querySelector('.close-ring circle'),
            canvas: document.getElementById('anim-canvas')
        };
        const ctx = els.canvas.getContext('2d');

        // --- Audio & TTS ---
        function initAudio() {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') actx.resume();
            if (synth) { synth.cancel(); let u = new SpeechSynthesisUtterance(''); u.volume = 0; synth.speak(u); }
        }

        function playBeep(type) {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.connect(gain); gain.connect(actx.destination);
            
            if (type === 'start') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
                gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                osc.start(t); osc.stop(t + 0.6);
            } else if (type === 'rest') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, t);
                gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } else if (type === 'count') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
                gain.gain.setValueAtTime(0.6, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            }
        }

        function speak(text) {
            if (!synth) return;
            synth.cancel();
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.rate = 1.15;
            synth.speak(u);
        }

        // --- System APIs ---
        async function reqWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { if (state.phase !== 'DONE' && !state.isPaused) reqWakeLock(); } 
            else { if (state.phase === 'WORK' || state.phase === 'REST') dispatch('PAUSE', true); }
        });

        // --- Controller ---
        function openModal(day) {
            initAudio(); 
            state.day = day;
            activeDayData = SCHEDULE[day];
            
            let colors = {1: '#00E5FF', 2: '#FFB300', 3: '#FF4081'};
            els.modalTitle.innerText = `DAY ${day}`;
            els.modalTitle.style.color = colors[day];
            
            els.modalList.innerHTML = activeDayData.map(ex => 
                `<li class="ex-item"><div class="ex-name">${ex.name}</div><div class="ex-context">${ex.ctx}</div></li>`
            ).join('');
            
            els.modal.classList.remove('hidden');
            // Trigger transition next frame
            requestAnimationFrame(() => els.modal.classList.add('active'));
        }

        function closeModal() {
            els.modal.classList.remove('active');
            setTimeout(() => els.modal.classList.add('hidden'), 300);
        }

        function initWorkout() {
            closeModal();
            els.home.classList.add('hidden');
            els.workout.classList.remove('hidden');
            reqWakeLock();

            state = { day: state.day, phase: 'PREP', round: 1, exIndex: 0, timeLeft: CONFIG.PREP_SEC, isPaused: false, activeTimeMs: 0, flags: {} };
            activeDayData = SCHEDULE[state.day];
            state.lastTick = performance.now();
            
            forceRenderUI();
            if (!reqAnimId) reqAnimId = requestAnimationFrame(loop);
            speak(`準備開始。`);
        }

        function dispatch(action, forceVal) {
            if (action === 'PAUSE') {
                state.isPaused = forceVal !== undefined ? forceVal : !state.isPaused;
                if (!state.isPaused) { 
                    state.lastTick = performance.now(); 
                    if(actx && actx.state === 'suspended') actx.resume();
                    reqWakeLock(); 
                }
                els.pauseInd.classList.toggle('hidden', !state.isPaused);
            } else if (action === 'SKIP') {
                state.exIndex += forceVal;
                if (state.exIndex >= activeDayData.length) { state.exIndex = 0; state.round++; } 
                else if (state.exIndex < 0) {
                    if (state.round > 1) { state.round--; state.exIndex = activeDayData.length - 1; }
                    else { state.exIndex = 0; }
                }
                state.phase = 'PREP'; state.timeLeft = 5; state.flags = {};
                forceRenderUI();
            } else if (action === 'END') {
                state.phase = 'DONE';
                let m = Math.floor((state.activeTimeMs / 1000) / 60);
                let s = Math.floor((state.activeTimeMs / 1000) % 60);
                document.getElementById('stat-time').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                document.getElementById('stat-round').innerText = `${Math.min(state.round, CONFIG.TOTAL_ROUNDS)} / ${CONFIG.TOTAL_ROUNDS}`;
                
                els.workout.classList.add('hidden');
                els.done.classList.remove('hidden');
                speak("訓練完成。");
                if (wakeLock) wakeLock.release().then(() => wakeLock = null);
            }
        }

        function transitionPhase() {
            if (state.phase === 'PREP' || state.phase === 'REST') {
                state.phase = 'WORK'; state.timeLeft = CONFIG.WORK_SEC; state.flags = {};
                playBeep('start');
            } else if (state.phase === 'WORK') {
                if (state.exIndex === activeDayData.length - 1 && state.round === CONFIG.TOTAL_ROUNDS) { dispatch('END'); return; }
                state.phase = 'REST'; state.timeLeft = CONFIG.REST_SEC; state.flags = {};
                playBeep('rest');
                state.exIndex++;
                if (state.exIndex >= activeDayData.length) { state.exIndex = 0; state.round++; }
            }
            forceRenderUI();
        }

        let lastRenderedSec = -1;
        function loop(now) {
            if (!state.isPaused && state.phase !== 'DONE') {
                let dt = now - state.lastTick;
                state.timeLeft -= dt / 1000;
                if(state.phase === 'WORK') state.activeTimeMs += dt;
                
                if (state.timeLeft <= 0) { state.timeLeft = 0; transitionPhase(); } 
                else {
                    let sec = Math.ceil(state.timeLeft);
                    if (sec <= 3 && sec > 0 && sec !== state.flags.lastBeepSec) { playBeep('count'); state.flags.lastBeepSec = sec; }
                    
                    let curEx = activeDayData[state.exIndex];
                    if (state.phase === 'WORK') {
                        if (!state.flags.toldStart && sec <= CONFIG.WORK_SEC - 1) { speak(curEx.name + "。" + curEx.txt1); state.flags.toldStart = true; }
                        if (!state.flags.told15s && sec === 15) { speak(curEx.txt2); state.flags.told15s = true; }
                    } else if (state.phase === 'REST') {
                        if (!state.flags.nextAnn && sec === 10) { speak("下一個動作：" + curEx.name); state.flags.nextAnn = true; }
                    }

                    if (sec !== lastRenderedSec) {
                        els.timer.innerText = sec.toString().padStart(2, '0');
                        let prog = ((state.round - 1) * activeDayData.length + state.exIndex) / (CONFIG.TOTAL_ROUNDS * activeDayData.length);
                        if(state.phase === 'WORK') prog += (1 - (state.timeLeft / CONFIG.WORK_SEC)) * (1 / (CONFIG.TOTAL_ROUNDS * activeDayData.length));
                        els.progress.style.width = `${prog * 100}%`;
                        lastRenderedSec = sec;
                    }
                }
            }
            state.lastTick = now;
            renderCanvas();
            reqAnimId = requestAnimationFrame(loop);
        }

        function forceRenderUI() {
            let curEx = activeDayData[state.exIndex];
            els.uiRound.innerText = `ROUND ${state.round} / ${CONFIG.TOTAL_ROUNDS}`;
            els.uiStatus.className = 'status-text'; els.timer.className = '';
            
            if (state.phase === 'PREP') {
                els.uiStatus.innerText = 'PREPARE'; els.uiStatus.classList.add('theme-prep');
                els.exTitle.innerText = "準備"; els.exCue.innerText = `即將開始: ${curEx.name}`; els.exNext.innerText = "";
            } else if (state.phase === 'WORK') {
                els.uiStatus.innerText = 'WORK'; els.uiStatus.classList.add('theme-work'); els.timer.classList.add('theme-work');
                els.exTitle.innerText = curEx.name; els.exCue.innerText = curEx.cue; els.exNext.innerText = "";
            } else if (state.phase === 'REST') {
                els.uiStatus.innerText = 'REST'; els.uiStatus.classList.add('theme-rest'); els.timer.classList.add('theme-rest');
                els.exTitle.innerText = "休息"; els.exCue.innerText = "深呼吸，放鬆核心"; els.exNext.innerText = `NEXT: ${curEx.name}`;
            }
            els.timer.innerText = Math.max(0, Math.ceil(state.timeLeft)).toString().padStart(2, '0');
        }

        // --- KEYFRAME ANIMATION ENGINE (Strict Biomechanics) ---
        function resizeCanvas() {
            let pr = window.devicePixelRatio || 1;
            els.canvas.width = els.canvas.clientWidth * pr; els.canvas.height = els.canvas.clientHeight * pr;
            ctx.scale(pr, pr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const POSES = {
            // Arrays: [Head(x,y), Torso(x,y), Hips(x,y), LHand(x,y), RHand(x,y), LFoot(x,y), RFoot(x,y)]
            // Floor is roughly y=0. Coordinates are relative to Hips roughly at 0,0.
            neutral:   [[0,-60], [0,-30], [0,0], [10,-10], [-10,-10], [15,40], [-15,40]], // Stand
            supine_0:  [[-50,5], [-25,5], [0,5], [-40,-10], [-40,-10], [50,5], [50,5]], // Lie down
            // D1
            v_up_0:    [[-50,5], [-25,5], [0,5], [-60,10], [-60,10], [50,5], [50,5]],
            v_up_1:    [[-20,-30], [-10,-10], [0,5], [20,-25], [20,-25], [30,-40], [30,-40]], // Fold
            rev_c_0:   [[-50,5], [-25,5], [0,5], [-30,5], [-30,5], [20,-20], [20,-20]], // Knees bent
            rev_c_1:   [[-50,5], [-25,5], [-10,-10], [-30,5], [-30,5], [-10,-40], [-10,-40]], // Pelvis up
            toe_0:     [[-50,5], [-25,5], [0,5], [-40,-20], [-40,-20], [0,-50], [0,-50]],
            toe_1:     [[-30,-15], [-15,0], [0,5], [-10,-40], [-10,-40], [0,-50], [0,-50]], // Crunch up
            dead_0:    [[-50,5], [-25,5], [0,5], [-25,-30], [-25,-30], [25,-30], [25,-30]], // Limbs up
            dead_1:    [[-50,5], [-25,5], [0,5], [-60,5], [-25,-30], [25,-30], [60,5]], // Left arm, right leg down
            plank_0:   [[-30,-15], [-15,-10], [15,0], [-25,5], [-25,5], [50,5], [50,5]],
            // D2
            rt_0:      [[-25,-35], [-10,-15], [5,5], [20,-10], [20,-10], [30,-10], [30,-10]], // Lean back, hands right
            rt_1:      [[-25,-35], [-10,-15], [5,5], [-10,-20], [-10,-20], [30,-10], [30,-10]], // Hands left
            bike_0:    [[-30,-10], [-15,0], [0,5], [-30,-10], [-30,-10], [40,5], [10,-20]],
            bike_1:    [[-20,-20], [-10,0], [0,5], [-20,-20], [-20,-20], [10,-20], [40,5]],
            splank_0:  [[20,-30], [10,-15], [0,0], [25,5], [-10,-10], [-30,10], [-30,10]],
            sv_0:      [[-40,-5], [-20,0], [0,5], [-40,0], [-10,-30], [40,5], [40,5]], // Lie on side
            sv_1:      [[-20,-25], [-10,-10], [0,5], [-40,0], [10,-30], [20,-20], [20,-20]], // Side crunch
            // D3
            mt_0:      [[-30,-20], [-15,-10], [15,0], [-35,5], [-35,5], [50,5], [15,5]], // Right knee in
            mt_1:      [[-30,-20], [-15,-10], [15,0], [-35,5], [-35,5], [15,5], [50,5]], // Left knee in
            flut_0:    [[-40,-10], [-20,0], [0,5], [-30,5], [-30,5], [45,0], [40,-15]],
            flut_1:    [[-40,-10], [-20,0], [0,5], [-30,5], [-30,5], [40,-15], [45,0]],
            pjack_0:   [[-30,-15], [-15,-10], [15,0], [-25,5], [-25,5], [50,5], [50,5]],
            pjack_1:   [[-30,-10], [-15,-5], [15,5], [-25,5], [-25,5], [55,5], [45,5]], // Hips slightly up, legs apart (z-axis faked)
            heel_0:    [[-40,-10], [-20,5], [0,5], [-20,10], [20,10], [25,5], [25,5]],
            heel_1:    [[-40,-10], [-20,5], [0,5], [-10,15], [30,15], [25,5], [25,5]], // Shift right
            hol_0:     [[-40,-10], [-20,5], [0,5], [-60,-5], [-60,-5], [45,-5], [45,-5]] // Banana
        };

        const EX_MAP = {
            'v_up': ['v_up_0', 'v_up_1', 3],
            'rev_crunch': ['rev_c_0', 'rev_c_1', 2.5],
            'toe_touch': ['toe_0', 'toe_1', 2],
            'dead_bug': ['dead_0', 'dead_1', 4],
            'plank': ['plank_0', 'plank_0', 1], // Isometric
            'rt': ['rt_0', 'rt_1', 2],
            'bike': ['bike_0', 'bike_1', 3],
            'side_plank_r': ['splank_0', 'splank_0', 1],
            'side_plank_l': ['splank_0', 'splank_0', 1],
            'side_v': ['sv_0', 'sv_1', 2.5],
            'mt_climber': ['mt_0', 'mt_1', 1], // Fast
            'flutter': ['flut_0', 'flut_1', 1],
            'plank_jack': ['pjack_0', 'pjack_1', 1.5],
            'heel_touch': ['heel_0', 'heel_1', 2],
            'hollow': ['hol_0', 'hol_0', 1]
        };

        function lerpPose(pA, pB, t) {
            let res = [];
            for(let i=0; i<pA.length; i++) {
                res.push([ pA[i][0] + (pB[i][0]-pA[i][0])*t, pA[i][1] + (pB[i][1]-pA[i][1])*t ]);
            }
            return res;
        }

        function drawWireframe(pts, color) {
            let [head, torso, hips, lHand, rHand, lFoot, rFoot] = pts;
            ctx.strokeStyle = color; ctx.fillStyle = color;
            ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            // Body
            ctx.beginPath(); ctx.moveTo(head[0], head[1]); ctx.lineTo(torso[0], torso[1]); ctx.lineTo(hips[0], hips[1]); ctx.stroke();
            // Head
            ctx.beginPath(); ctx.arc(head[0], head[1]-8, 8, 0, Math.PI*2); ctx.fill();
            
            // Limbs (Abstracted as single lines from joints for clean aesthetic)
            ctx.lineWidth = 4;
            // Left (Back)
            ctx.globalAlpha = 0.5;
            ctx.beginPath(); ctx.moveTo(torso[0], torso[1]); ctx.lineTo(lHand[0], lHand[1]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hips[0], hips[1]); ctx.lineTo(lFoot[0], lFoot[1]); ctx.stroke();
            // Right (Front)
            ctx.globalAlpha = 1.0;
            ctx.beginPath(); ctx.moveTo(torso[0], torso[1]); ctx.lineTo(rHand[0], rHand[1]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hips[0], hips[1]); ctx.lineTo(rFoot[0], rFoot[1]); ctx.stroke();
        }

        function renderCanvas() {
            if (state.isPaused || state.phase === 'PREP') return; 

            let cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
            ctx.clearRect(0, 0, cw, ch);

            // Floor
            let cy = ch * 0.7;
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, cy+15); ctx.lineTo(cw, cy+15); ctx.stroke();

            let t = 0;
            let currentPts = POSES.supine_0; // Default rest

            if (state.phase === 'WORK') {
                let exId = activeDayData[state.exIndex].id;
                let [pA, pB, speed] = EX_MAP[exId] || ['supine_0', 'supine_0', 2];
                // Smooth sine wave interpolation (0 to 1 and back)
                t = (Math.sin((state.activeTimeMs / 1000 * Math.PI * 2) / speed) + 1) / 2;
                currentPts = lerpPose(POSES[pA], POSES[pB], t);
            } else {
                // Gentle breathing during rest
                t = (Math.sin(performance.now() / 1500) + 1) / 2;
                currentPts = lerpPose(POSES.supine_0, POSES.neutral, t * 0.05); // Barely moves
            }

            ctx.save();
            ctx.translate(cw/2, cy);
            ctx.scale(2.5, 2.5); // Scale up the abstract coordinates
            drawWireframe(currentPts, state.phase === 'WORK' ? '#00E5FF' : '#FFB300');
            ctx.restore();
        }

        // --- Gestures ---
        let tx = 0, ty = 0, tTime = 0;
        const gOverlay = document.getElementById('gesture-overlay');

        gOverlay.addEventListener('touchstart', e => {
            tx = e.changedTouches[0].screenX; ty = e.changedTouches[0].screenY; tTime = performance.now();
        }, {passive: true});

        gOverlay.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - tx, dy = e.changedTouches[0].screenY - ty, dt = performance.now() - tTime;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && dt < 400) {
                dispatch('SKIP', dx > 0 ? -1 : 1);
            } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) {
                dispatch('PAUSE');
            }
        }, {passive: true});

        // --- Close Button Hold ---
        let closeTimer = null, closeProg = 0;
        function fillCloseRing() {
            closeProg += 12;
            els.closeCircle.style.strokeDashoffset = Math.max(0, 113 - (closeProg / 100) * 113);
            if (closeProg >= 100) { clearTimeout(closeTimer); dispatch('END'); } 
            else { closeTimer = setTimeout(fillCloseRing, 100); }
        }
        function startClosePress(e) { e.preventDefault(); closeProg = 0; fillCloseRing(); }
        function cancelClosePress() { clearTimeout(closeTimer); closeProg = 0; els.closeCircle.style.strokeDashoffset = 113; }
        
        const btnClose = document.getElementById('btn-close');
        ['touchstart', 'mousedown'].forEach(evt => btnClose.addEventListener(evt, startClosePress));
        ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(evt => btnClose.addEventListener(evt, cancelClosePress));

        function goHome() {
            els.done.classList.add('hidden');
            els.home.classList.remove('hidden');
            if (reqAnimId) { cancelAnimationFrame(reqAnimId); reqAnimId = null; }
        }
    </script>
</body>
</html>
