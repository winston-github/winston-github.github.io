<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>專業核心肌群訓練系統</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --surface-hover: #1A1A1A;
            --text-main: #FFFFFF;
            --text-muted: #777777;
            --color-work: #00E5FF;
            --color-rest: #FFB300;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --sa-top: env(safe-area-inset-top, 20px);
            --sa-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; touch-action: none; overscroll-behavior: none;
            width: 100vw; height: 100dvh; display: flex; flex-direction: column;
        }

        .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; transition: opacity 0.3s ease; z-index: 10;
        }
        .hidden { opacity: 0; pointer-events: none; }

        /* --- 主畫面 --- */
        #home-screen { padding: calc(var(--sa-top) + 20px) 20px var(--sa-bottom); align-items: center; justify-content: center; }
        .hero-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
        .hero-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 40px; letter-spacing: 1px;}
        
        .menu-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background: var(--surface); border: 1px solid #222; border-radius: 12px;
            padding: 20px; color: var(--text-main); text-align: left;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.1s;
        }
        .menu-btn:active { background: var(--surface-hover); }
        .menu-day { font-size: 1.2rem; font-weight: 700; }
        .menu-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

        /* --- 預覽對話框 --- */
        #modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 50; 
            display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 30px 20px calc(var(--sa-bottom) + 20px);
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 85vh; display: flex; flex-direction: column; border-top: 1px solid #333;
        }
        #modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .modal-title { font-size: 1.5rem; font-weight: bold; }
        .btn-close-modal { background: none; border: none; color: var(--text-muted); padding: 5px; }
        .ex-list { list-style: none; margin-bottom: 20px; overflow-y: auto; flex: 1; padding-right: 10px; }
        .ex-item { padding: 14px 0; border-bottom: 1px solid #222; }
        .ex-name { font-weight: 600; font-size: 1.1rem; color: var(--text-main); }
        .ex-context { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
        .btn-start {
            width: 100%; background: var(--text-main); color: var(--bg); border: none;
            padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }

        /* --- 訓練畫面 --- */
        #workout-screen { background: var(--bg); display: flex; flex-direction: column; padding-top: var(--sa-top); padding-bottom: var(--sa-bottom); }
        
        .progress-container { width: 100%; height: 4px; background: #222; position: absolute; top: 0; left: 0; z-index: 30;}
        #global-progress { height: 100%; background: var(--color-work); width: 0%; transition: width 0.1s linear; }

        .hud-top { padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; flex: 0 0 auto;}
        .status-text { font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .round-text { font-size: 0.9rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        .close-btn-wrapper { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;}
        .close-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none;}
        .close-ring circle { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset 0.1s; }

        /* 三分法佈局：獨立的計時區與動畫區 */
        .timer-zone { flex: 0 0 20%; display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
        #timer { 
            font-family: var(--font-mono); font-size: 5.5rem; font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums; letter-spacing: -2px; text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .canvas-zone { flex: 1; position: relative; width: 100%; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0.9; }

        .hud-bottom { padding: 20px 20px 30px; text-align: center; z-index: 20; flex: 0 0 auto; background: linear-gradient(transparent, rgba(0,0,0,0.9) 20%); }
        #ex-title { font-size: 2rem; font-weight: 800; margin-bottom: 10px; line-height: 1.2; }
        #ex-cue { font-size: 1.05rem; color: var(--text-main); margin-bottom: 8px; font-weight: 500;}
        #ex-next { font-size: 0.9rem; color: var(--text-muted); height: 1.2rem;}

        #gesture-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; }
        #pause-indicator {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px 40px; border-radius: 12px;
            font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;
            border: 1px solid #333; backdrop-filter: blur(5px); z-index: 45;
        }

        .theme-work { color: var(--color-work); }
        .theme-rest { color: var(--color-rest); }
        .theme-prep { color: var(--text-main); }

        /* --- 完成畫面 --- */
        #done-screen { align-items: center; justify-content: center; padding: 20px; text-align: center;}
        .done-icon { width: 80px; height: 80px; stroke: var(--color-work); margin-bottom: 20px; }
        .stat-box { background: var(--surface); border-radius: 12px; padding: 25px; width: 100%; max-width: 320px; margin: 30px 0; border: 1px solid #222;}
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1rem;}
        .stat-item:last-child { margin-bottom: 0; }
        .stat-val { font-family: var(--font-mono); font-weight: bold; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen">
        <div class="hero-title">核心肌群訓練系統</div>
        <div class="hero-sub">生物力學與中軸剛性建構</div>
        <div class="menu-list">
            <button class="menu-btn" onclick="openModal(1)">
                <div><div class="menu-day">DAY 1</div><div class="menu-desc">腹直肌與抗伸展 / 建立剛性</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(2)">
                <div><div class="menu-day">DAY 2</div><div class="menu-desc">側腹與抗旋轉 / 多面向穩定</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(3)">
                <div><div class="menu-day">DAY 3</div><div class="menu-desc">高活動度核心 / 動態收縮</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modal-title" class="modal-title">DAY X</div>
                <button class="btn-close-modal" onclick="closeModal()">
                    <svg class="icon"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul id="modal-list" class="ex-list"></ul>
            <button class="btn-start" onclick="initWorkout()">開始訓練</button>
        </div>
    </div>

    <div id="workout-screen" class="screen hidden">
        <div class="progress-container"><div id="global-progress"></div></div>
        
        <div class="hud-top">
            <div>
                <div id="ui-status" class="status-text theme-prep">PREPARE</div>
                <div id="ui-round" class="round-text">ROUND 1 / 4</div>
            </div>
            <div class="close-btn-wrapper" id="btn-close">
                <svg class="close-ring"><circle cx="22" cy="22" r="18"></circle></svg>
                <svg class="icon" style="stroke:var(--text-muted);"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>

        <div class="timer-zone"><div id="timer">00</div></div>
        <div class="canvas-zone"><canvas id="anim-canvas"></canvas></div>

        <div class="hud-bottom">
            <div id="ex-title">--</div>
            <div id="ex-cue">--</div>
            <div id="ex-next">--</div>
        </div>

        <div id="gesture-overlay"></div>
        <div id="pause-indicator" class="hidden">PAUSED</div>
    </div>

    <div id="done-screen" class="screen hidden">
        <svg class="icon done-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <div class="hero-title">訓練完成</div>
        <div class="hero-sub" style="margin-bottom:0">強悍的軀幹是運動表現的基石。</div>
        <div class="stat-box">
            <div class="stat-item"><span>總作動時間</span><span id="stat-time" class="stat-val">00:00</span></div>
            <div class="stat-item"><span>完成回合</span><span id="stat-round" class="stat-val">4 / 4</span></div>
        </div>
        <button class="menu-btn" style="justify-content:center; padding: 18px; width:100%; max-width: 320px;" onclick="goHome()">
            <span class="menu-day">返回主畫面</span>
        </button>
    </div>

    <script>
        const CONFIG = { WORK_SEC: 45, REST_SEC: 15, PREP_SEC: 5, TOTAL_ROUNDS: 4 };

        const SCHEDULE = {
            1: [
                { id:'v_up', name: 'V字仰臥起坐', ctx: '腹直肌爆發與控制力',
                  dos: ['核心預先繃緊', '吐氣時手腳同步抬起', '下放時控制速度'], 
                  donts: ['不要用脖子硬拉', '不要讓下背騰空', '不要像自由落體一樣摔回地板'] },
                { id:'rev_crunch', name: '反向捲腹', ctx: '強化下腹，改善骨盆前傾',
                  dos: ['想像肚臍壓向脊椎', '用下腹力量捲起骨盆', '雙腿保持固定角度'], 
                  donts: ['不要利用雙腿甩動的慣性', '臀部不要抬得過高', '下落時腰椎不要離開地面'] },
                { id:'toe_touch', name: '直腿觸踝', ctx: '上腹持續收縮力',
                  dos: ['下巴微收保護頸椎', '肋骨向下壓緊', '盡量讓肩胛骨完全離地'], 
                  donts: ['頭部不要過度後仰', '過程中不要憋氣', '下放時肩膀不要完全放鬆'] },
                { id:'dead_bug', name: '死蟲式', ctx: '四肢活動時的絕對穩定',
                  dos: ['腰部死死釘在地板上', '對側手腳緩慢延伸', '保持平穩的深呼吸'], 
                  donts: ['腰部絕對不能出現空隙', '動作不要太快', '停留的四肢不要跟著晃動'] },
                { id:'plank', name: '棒式撐體', ctx: '核心抗伸展基石',
                  dos: ['手肘用力推離地板', '骨盆微向後傾', '臀部與大腿用力夾緊'], 
                  donts: ['腰部千萬不要塌陷', '屁股不要往上撅起', '不要聳肩卡住脖子'] }
            ],
            2: [
                { id:'rt', name: '俄羅斯轉體', ctx: '強化抗旋轉能力',
                  dos: ['視線跟著雙手移動', '轉動的是你的胸椎', '雙腳盡量保持併攏靜止'], 
                  donts: ['不要只有手臂在揮動', '膝蓋不要跟著左右搖擺', '背部不要過度駝背'] },
                { id:'bike', name: '腳踏車捲腹', ctx: '對側動力鏈整合',
                  dos: ['放慢節奏感受扭轉', '讓肩膀去對齊對側膝蓋', '伸直的腿要完全繃緊'], 
                  donts: ['不要用手硬拉頭部', '只是手肘碰膝蓋是沒用的', '骨盆不要在地上滾來滾去'] },
                { id:'side_plank_r', name: '側棒式 (右)', ctx: '脊椎側向穩定度',
                  dos: ['肩關節在手肘正上方', '側腹用力將骨盆頂高', '身體像一面平整的牆'], 
                  donts: ['臀部不要往後掉', '支撐的肩膀不要垮下去', '視線不要一直看地上'] },
                { id:'side_plank_l', name: '側棒式 (左)', ctx: '脊椎側向穩定度',
                  dos: ['保持呼吸節奏', '集中注意力在左側腹', '頭部與脊椎保持一直線'], 
                  donts: ['骨盆不要慢慢往下掉', '身體不要向前傾倒', '發抖時千萬不要憋氣'] },
                { id:'side_v', name: '側躺捲腹', ctx: '側腰極限收縮爆發力',
                  dos: ['底部的手臂放鬆微曲', '用側腰的力量拉近手腳', '在最高點稍微停頓'], 
                  donts: ['不要用撐地的那隻手推地板', '脖子不要過度側彎', '雙腿不要前後分開'] }
            ],
            3: [
                { id:'mt_climber', name: '登山者', ctx: '高心率鎖死骨盆能力',
                  dos: ['肩膀保持在手腕正上方', '膝蓋筆直朝向胸口', '保持骨盆的高度不變'], 
                  donts: ['屁股不要越抬越高', '身體不要跟著前後彈跳', '落腳時不要太重'] },
                { id:'flutter', name: '剪刀腿', ctx: '動態下肢抗伸展張力',
                  dos: ['雙腿伸直腳尖壓平', '動作幅度小而快', '核心鎖死抵抗雙腿的重量'], 
                  donts: ['腿不要抬得太高', '下背有空隙就代表代償了', '身體不要跟著左右搖晃'] },
                { id:'plank_jack', name: '棒式開合跳', ctx: '跳躍震動時抗震能力',
                  dos: ['核心預先建立極大剛性', '腳尖輕巧開合', '專注於抵抗跳躍的震動力'], 
                  donts: ['臀部不要跟著上下甩動', '落地時不要發出巨大聲響', '肩膀不要離開手腕正上方'] },
                { id:'heel_touch', name: '交替摸腳踝', ctx: '軀幹側向靈活度',
                  dos: ['眼睛直視天花板', '用側腹收縮來左右平移', '肩胛骨全程離開地面'], 
                  donts: ['下巴不要貼在胸口上', '不要用扭脖子來代償', '身體不要上下起伏'] },
                { id:'hollow', name: '大字伸展', ctx: '全身核心耐力終極試煉',
                  dos: ['身體呈現微彎的香蕉形狀', '手腳盡可能向外延伸', '全身肌肉進入等長收縮'], 
                  donts: ['這是終極考驗，下背絕對不能懸空', '發現腰痠代表核心已經力竭', '無論如何，絕對不要憋氣'] }
            ]
        };

        let state = {
            day: 1, phase: 'PREP', round: 1, exIndex: 0,
            timeLeft: 0, isPaused: false, lastTick: 0, activeTimeMs: 0,
            animState: { waitingForPeak: true }
        };
        
        let activeDayData = [];
        let reqAnimId = null;
        let wakeLock = null;

        // --- DOM ---
        const els = {
            home: document.getElementById('home-screen'), modal: document.getElementById('modal-overlay'),
            modalList: document.getElementById('modal-list'), // 🔥 修復：加上這一行補回漏掉的變數
            workout: document.getElementById('workout-screen'), done: document.getElementById('done-screen'),
            timer: document.getElementById('timer'), uiStatus: document.getElementById('ui-status'),
            uiRound: document.getElementById('ui-round'), exTitle: document.getElementById('ex-title'),
            exCue: document.getElementById('ex-cue'), exNext: document.getElementById('ex-next'),
            progress: document.getElementById('global-progress'), pauseInd: document.getElementById('pause-indicator'),
            closeCircle: document.querySelector('.close-ring circle'), canvas: document.getElementById('anim-canvas')
        };
        const ctx = els.canvas.getContext('2d');

        // --- Audio Engine (Audio Ducking & Metronome) ---
        let actx = null, synth = window.speechSynthesis;
        let masterGain = null;

        function initAudio() {
            if (!actx) {
                actx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = actx.createGain();
                masterGain.gain.value = 0.6; // Default pleasant volume
                masterGain.connect(actx.destination);
            }
            if (actx.state === 'suspended') actx.resume();
            if (synth) { synth.cancel(); let u = new SpeechSynthesisUtterance(''); u.volume = 0; synth.speak(u); }
        }

        // Sound Design: Tick & Swoosh
        function playSfx(type) {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.connect(gain); gain.connect(masterGain);

            if (type === 'tick') { // Peak contraction
                osc.type = 'square'; osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(1200, t + 0.05);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                osc.start(t); osc.stop(t + 0.05);
            } else if (type === 'swoosh') { // Concentric start
                osc.type = 'sine'; osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
                gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.3, t + 0.1);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } else if (type === 'beep_high') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
                gain.gain.setValueAtTime(0.8, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                osc.start(t); osc.stop(t + 0.6);
            } else if (type === 'beep_low') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            }
        }

        // TTS with Ducking
        function speak(text, cueElUpdate = null) {
            if (!synth || !masterGain) return;
            synth.cancel();
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.rate = 1.15;
            
            u.onstart = () => { 
                masterGain.gain.setTargetAtTime(0.1, actx.currentTime, 0.1); // Duck SFX
                if(cueElUpdate) els.exCue.innerText = cueElUpdate;
            };
            u.onend = () => { 
                masterGain.gain.setTargetAtTime(0.6, actx.currentTime, 0.5); // Restore SFX
            };
            u.onerror = () => { masterGain.gain.setTargetAtTime(0.6, actx.currentTime, 0.1); };
            
            synth.speak(u);
        }

        async function reqWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { if (state.phase !== 'DONE' && !state.isPaused) reqWakeLock(); } 
            else { if (state.phase === 'WORK' || state.phase === 'REST') dispatch('PAUSE', true); }
        });

        // --- Flow ---
        function openModal(day) {
            initAudio(); state.day = day; activeDayData = SCHEDULE[day];
            let colors = {1: '#00E5FF', 2: '#FFB300', 3: '#FF4081'};
            document.getElementById('modal-title').innerText = `DAY ${day}`;
            document.getElementById('modal-title').style.color = colors[day];
            els.modalList.innerHTML = activeDayData.map(ex => `<li class="ex-item"><div class="ex-name">${ex.name}</div><div class="ex-context">${ex.ctx}</div></li>`).join('');
            els.modal.classList.remove('hidden');
            requestAnimationFrame(() => els.modal.classList.add('active'));
        }

        function closeModal() {
            els.modal.classList.remove('active');
            setTimeout(() => els.modal.classList.add('hidden'), 300);
        }

        function initWorkout() {
            closeModal(); els.home.classList.add('hidden'); els.workout.classList.remove('hidden'); reqWakeLock();
            state = { day: state.day, phase: 'PREP', round: 1, exIndex: 0, timeLeft: CONFIG.PREP_SEC, isPaused: false, activeTimeMs: 0, animState: { waitingForPeak: true } };
            activeDayData = SCHEDULE[state.day]; state.lastTick = performance.now();
            forceRenderUI();
            if (!reqAnimId) reqAnimId = requestAnimationFrame(loop);
            speak(`準備開始。`);
        }

        function dispatch(action, forceVal) {
            if (action === 'PAUSE') {
                state.isPaused = forceVal !== undefined ? forceVal : !state.isPaused;
                if (!state.isPaused) { state.lastTick = performance.now(); if(actx) actx.resume(); reqWakeLock(); }
                els.pauseInd.classList.toggle('hidden', !state.isPaused);
            } else if (action === 'SKIP') {
                state.exIndex += forceVal;
                if (state.exIndex >= activeDayData.length) { state.exIndex = 0; state.round++; } 
                else if (state.exIndex < 0) {
                    if (state.round > 1) { state.round--; state.exIndex = activeDayData.length - 1; }
                    else { state.exIndex = 0; }
                }
                state.phase = 'PREP'; state.timeLeft = 5;
                forceRenderUI();
            } else if (action === 'END') {
                state.phase = 'DONE';
                let m = Math.floor((state.activeTimeMs / 1000) / 60);
                let s = Math.floor((state.activeTimeMs / 1000) % 60);
                document.getElementById('stat-time').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                document.getElementById('stat-round').innerText = `${Math.min(state.round, CONFIG.TOTAL_ROUNDS)} / ${CONFIG.TOTAL_ROUNDS}`;
                els.workout.classList.add('hidden'); els.done.classList.remove('hidden');
                speak("訓練完成。");
                if (wakeLock) wakeLock.release().then(() => wakeLock = null);
            }
        }

        function transitionPhase() {
            if (state.phase === 'PREP' || state.phase === 'REST') {
                state.phase = 'WORK'; state.timeLeft = CONFIG.WORK_SEC; state.activeTimeMs = 0;
                state.animState = { waitingForPeak: true };
                playSfx('beep_high');
            } else if (state.phase === 'WORK') {
                if (state.exIndex === activeDayData.length - 1 && state.round === CONFIG.TOTAL_ROUNDS) { dispatch('END'); return; }
                state.phase = 'REST'; state.timeLeft = CONFIG.REST_SEC;
                playSfx('beep_low');
                state.exIndex++;
                if (state.exIndex >= activeDayData.length) { state.exIndex = 0; state.round++; }
            }
            forceRenderUI();
        }

        let lastRenderedSec = -1;
        function loop(now) {
            if (!state.isPaused && state.phase !== 'DONE') {
                let dt = now - state.lastTick;
                state.timeLeft -= dt / 1000;
                
                if (state.timeLeft <= 0) { state.timeLeft = 0; transitionPhase(); } 
                else {
                    let sec = Math.ceil(state.timeLeft);
                    
                    // Coach Matrix 45-35-25-15-5
                    let curEx = activeDayData[state.exIndex];
                    if (state.phase === 'WORK') {
                        state.activeTimeMs += dt;
                        if (sec === 45 && sec !== lastRenderedSec) speak(`${curEx.name}。${curEx.dos[0]}`, curEx.dos[0]);
                        else if (sec === 35 && sec !== lastRenderedSec) speak(`注意，${curEx.donts[0]}`, curEx.donts[0]);
                        else if (sec === 25 && sec !== lastRenderedSec) speak(curEx.dos[1], curEx.dos[1]);
                        else if (sec === 15 && sec !== lastRenderedSec) speak(`警告，${curEx.donts[1]}，而且${curEx.donts[2]}`, curEx.donts[1]);
                        else if (sec === 5 && sec !== lastRenderedSec) speak(`最後五秒，${curEx.dos[2]}`, curEx.dos[2]);
                        
                        // Handle Metronome via Animation Time
                        let [pA, pB, speed] = EX_MAP[curEx.id] || ['supine_0', 'supine_0', 2];
                        let animPhase = (state.activeTimeMs / 1000) / speed;
                        let fraction = animPhase - Math.floor(animPhase);
                        
                        if (speed > 1) { // Only play for dynamic moves
                            if (fraction > 0.45 && state.animState.waitingForPeak) {
                                playSfx('tick'); state.animState.waitingForPeak = false;
                            } else if (fraction < 0.1 && !state.animState.waitingForPeak) {
                                playSfx('swoosh'); state.animState.waitingForPeak = true;
                            }
                        }

                    } else if (state.phase === 'REST') {
                        if (sec === 10 && sec !== lastRenderedSec) speak(`下一個動作：${curEx.name}`, "準備動作");
                    }

                    if (sec <= 3 && sec > 0 && sec !== lastRenderedSec) playSfx('tick'); // Final 3s countdown

                    if (sec !== lastRenderedSec) {
                        els.timer.innerText = sec.toString().padStart(2, '0');
                        let prog = ((state.round - 1) * activeDayData.length + state.exIndex) / (CONFIG.TOTAL_ROUNDS * activeDayData.length);
                        if(state.phase === 'WORK') prog += (1 - (state.timeLeft / CONFIG.WORK_SEC)) * (1 / (CONFIG.TOTAL_ROUNDS * activeDayData.length));
                        els.progress.style.width = `${prog * 100}%`;
                        lastRenderedSec = sec;
                    }
                }
            }
            state.lastTick = now;
            renderCanvas();
            reqAnimId = requestAnimationFrame(loop);
        }

        function forceRenderUI() {
            let curEx = activeDayData[state.exIndex];
            els.uiRound.innerText = `ROUND ${state.round} / ${CONFIG.TOTAL_ROUNDS}`;
            els.uiStatus.className = 'status-text'; els.timer.className = '';
            
            if (state.phase === 'PREP') {
                els.uiStatus.innerText = 'PREPARE'; els.uiStatus.classList.add('theme-prep');
                els.exTitle.innerText = "準備"; els.exCue.innerText = `即將開始: ${curEx.name}`; els.exNext.innerText = "";
            } else if (state.phase === 'WORK') {
                els.uiStatus.innerText = 'WORK'; els.uiStatus.classList.add('theme-work'); els.timer.classList.add('theme-work');
                els.exTitle.innerText = curEx.name; els.exCue.innerText = curEx.dos[0]; els.exNext.innerText = "";
            } else if (state.phase === 'REST') {
                els.uiStatus.innerText = 'REST'; els.uiStatus.classList.add('theme-rest'); els.timer.classList.add('theme-rest');
                els.exTitle.innerText = "休息"; els.exCue.innerText = "深呼吸，放鬆核心"; els.exNext.innerText = `NEXT: ${curEx.name}`;
            }
            els.timer.innerText = Math.max(0, Math.ceil(state.timeLeft)).toString().padStart(2, '0');
        }

        // --- CANVAS ENGINE ---
        function resizeCanvas() {
            let pr = window.devicePixelRatio || 1;
            els.canvas.width = els.canvas.clientWidth * pr; els.canvas.height = els.canvas.clientHeight * pr;
            ctx.scale(pr, pr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const POSES = { // [Head, Torso, Hips, LHand, RHand, LFoot, RFoot] relative to Hips(0,0)
            neutral:   [[0,-60], [0,-30], [0,0], [10,-10], [-10,-10], [15,40], [-15,40]],
            supine_0:  [[-50,5], [-25,5], [0,5], [-40,-10], [-40,-10], [50,5], [50,5]],
            v_up_0:    [[-50,5], [-25,5], [0,5], [-60,10], [-60,10], [50,5], [50,5]],
            v_up_1:    [[-20,-30], [-10,-10], [0,5], [20,-25], [20,-25], [30,-40], [30,-40]],
            rev_c_0:   [[-50,5], [-25,5], [0,5], [-30,5], [-30,5], [20,-20], [20,-20]],
            rev_c_1:   [[-50,5], [-25,5], [-10,-10], [-30,5], [-30,5], [-10,-40], [-10,-40]],
            toe_0:     [[-50,5], [-25,5], [0,5], [-40,-20], [-40,-20], [0,-50], [0,-50]],
            toe_1:     [[-30,-15], [-15,0], [0,5], [-10,-40], [-10,-40], [0,-50], [0,-50]],
            dead_0:    [[-50,5], [-25,5], [0,5], [-25,-30], [-25,-30], [25,-30], [25,-30]],
            dead_1:    [[-50,5], [-25,5], [0,5], [-60,5], [-25,-30], [25,-30], [60,5]],
            plank_0:   [[-30,-15], [-15,-10], [15,0], [-25,5], [-25,5], [50,5], [50,5]],
            rt_0:      [[-25,-35], [-10,-15], [5,5], [20,-10], [20,-10], [30,-10], [30,-10]],
            rt_1:      [[-25,-35], [-10,-15], [5,5], [-10,-20], [-10,-20], [30,-10], [30,-10]],
            bike_0:    [[-30,-10], [-15,0], [0,5], [-30,-10], [-30,-10], [40,5], [10,-20]],
            bike_1:    [[-20,-20], [-10,0], [0,5], [-20,-20], [-20,-20], [10,-20], [40,5]],
            splank_0:  [[20,-30], [10,-15], [0,0], [25,5], [-10,-10], [-30,10], [-30,10]],
            sv_0:      [[-40,-5], [-20,0], [0,5], [-40,0], [-10,-30], [40,5], [40,5]],
            sv_1:      [[-20,-25], [-10,-10], [0,5], [-40,0], [10,-30], [20,-20], [20,-20]],
            mt_0:      [[-30,-20], [-15,-10], [15,0], [-35,5], [-35,5], [50,5], [15,5]],
            mt_1:      [[-30,-20], [-15,-10], [15,0], [-35,5], [-35,5], [15,5], [50,5]],
            flut_0:    [[-40,-10], [-20,0], [0,5], [-30,5], [-30,5], [45,0], [40,-15]],
            flut_1:    [[-40,-10], [-20,0], [0,5], [-30,5], [-30,5], [40,-15], [45,0]],
            pjack_0:   [[-30,-15], [-15,-10], [15,0], [-25,5], [-25,5], [50,5], [50,5]],
            pjack_1:   [[-30,-10], [-15,-5], [15,5], [-25,5], [-25,5], [55,5], [45,5]],
            heel_0:    [[-40,-10], [-20,5], [0,5], [-20,10], [20,10], [25,5], [25,5]],
            heel_1:    [[-40,-10], [-20,5], [0,5], [-10,15], [30,15], [25,5], [25,5]],
            hol_0:     [[-40,-10], [-20,5], [0,5], [-60,-5], [-60,-5], [45,-5], [45,-5]]
        };
        const EX_MAP = {
            'v_up': ['v_up_0', 'v_up_1', 3], 'rev_crunch': ['rev_c_0', 'rev_c_1', 2.5], 'toe_touch': ['toe_0', 'toe_1', 2],
            'dead_bug': ['dead_0', 'dead_1', 4], 'plank': ['plank_0', 'plank_0', 1], 'rt': ['rt_0', 'rt_1', 2],
            'bike': ['bike_0', 'bike_1', 3], 'side_plank_r': ['splank_0', 'splank_0', 1], 'side_plank_l': ['splank_0', 'splank_0', 1],
            'side_v': ['sv_0', 'sv_1', 2.5], 'mt_climber': ['mt_0', 'mt_1', 1], 'flutter': ['flut_0', 'flut_1', 1],
            'plank_jack': ['pjack_0', 'pjack_1', 1.5], 'heel_touch': ['heel_0', 'heel_1', 2], 'hollow': ['hol_0', 'hol_0', 1]
        };

        function lerpPose(pA, pB, t) {
            let res = [];
            for(let i=0; i<pA.length; i++) res.push([ pA[i][0] + (pB[i][0]-pA[i][0])*t, pA[i][1] + (pB[i][1]-pA[i][1])*t ]);
            return res;
        }

        function renderCanvas() {
            if (state.isPaused || state.phase === 'PREP') return; 
            let cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
            ctx.clearRect(0, 0, cw, ch);

            // Floor Line adapted to bottom of canvas
            let cy = ch * 0.8;
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, cy+15); ctx.lineTo(cw, cy+15); ctx.stroke();

            let t = 0, currentPts = POSES.supine_0;
            if (state.phase === 'WORK') {
                let [pA, pB, speed] = EX_MAP[activeDayData[state.exIndex].id] || ['supine_0', 'supine_0', 2];
                t = (Math.sin((state.activeTimeMs / 1000 * Math.PI * 2) / speed) + 1) / 2;
                currentPts = lerpPose(POSES[pA], POSES[pB], t);
            } else {
                t = (Math.sin(performance.now() / 1500) + 1) / 2;
                currentPts = lerpPose(POSES.supine_0, POSES.neutral, t * 0.05);
            }

            ctx.save(); ctx.translate(cw/2, cy); ctx.scale(2.8, 2.8);
            
            let color = state.phase === 'WORK' ? '#00E5FF' : '#FFB300';
            ctx.strokeStyle = color; ctx.fillStyle = color;
            ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            let [head, torso, hips, lHand, rHand, lFoot, rFoot] = currentPts;
            ctx.beginPath(); ctx.moveTo(head[0], head[1]); ctx.lineTo(torso[0], torso[1]); ctx.lineTo(hips[0], hips[1]); ctx.stroke();
            ctx.beginPath(); ctx.arc(head[0], head[1]-6, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.lineWidth = 3.5;
            ctx.globalAlpha = 0.4;
            ctx.beginPath(); ctx.moveTo(torso[0], torso[1]); ctx.lineTo(lHand[0], lHand[1]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hips[0], hips[1]); ctx.lineTo(lFoot[0], lFoot[1]); ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.beginPath(); ctx.moveTo(torso[0], torso[1]); ctx.lineTo(rHand[0], rHand[1]); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hips[0], hips[1]); ctx.lineTo(rFoot[0], rFoot[1]); ctx.stroke();
            
            ctx.restore();
        }

        // --- Gestures & Controls ---
        let tx = 0, ty = 0, tTime = 0;
        const gOverlay = document.getElementById('gesture-overlay');
        gOverlay.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; ty = e.changedTouches[0].screenY; tTime = performance.now(); }, {passive: true});
        gOverlay.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - tx, dy = e.changedTouches[0].screenY - ty, dt = performance.now() - tTime;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && dt < 400) dispatch('SKIP', dx > 0 ? -1 : 1);
            else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) dispatch('PAUSE');
        }, {passive: true});

        let closeTimer = null, closeProg = 0;
        function fillCloseRing() {
            closeProg += 12;
            els.closeCircle.style.strokeDashoffset = Math.max(0, 113 - (closeProg / 100) * 113);
            if (closeProg >= 100) { clearTimeout(closeTimer); dispatch('END'); } 
            else closeTimer = setTimeout(fillCloseRing, 100);
        }
        function startClosePress(e) { e.preventDefault(); closeProg = 0; fillCloseRing(); }
        function cancelClosePress() { clearTimeout(closeTimer); closeProg = 0; els.closeCircle.style.strokeDashoffset = 113; }
        
        ['touchstart', 'mousedown'].forEach(evt => document.getElementById('btn-close').addEventListener(evt, startClosePress));
        ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(evt => document.getElementById('btn-close').addEventListener(evt, cancelClosePress));

        // 🔥 修復：加入重置 reqAnimId，避免下一次開始訓練時畫面跟計時器卡死
        function goHome() { 
            els.done.classList.add('hidden'); 
            els.home.classList.remove('hidden'); 
            if(reqAnimId) {
                cancelAnimationFrame(reqAnimId);
                reqAnimId = null; 
            }
        }
    </script>
</body>
