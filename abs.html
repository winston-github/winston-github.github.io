<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>冬山河 50 英里 - 核心備賽</title>
    <style>
        :root {
            --bg: #000000;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --color-work: #00E5FF; /* Cyan */
            --color-rest: #FFB300; /* Amber */
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            
            /* Safe Areas for Notch/Dynamic Island */
            --sa-top: env(safe-area-inset-top, 20px);
            --sa-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none; /* Disable all browser gestures (pull to refresh, swipe back) */
            overscroll-behavior: none;
            width: 100vw; height: 100dvh;
            display: flex; flex-direction: column;
        }

        /* SVG Icons */
        .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .hidden { opacity: 0; pointer-events: none; }

        /* --- HOME SCREEN --- */
        #home-screen { padding: calc(var(--sa-top) + 20px) 20px var(--sa-bottom); align-items: center; justify-content: center; }
        .hero-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-align: center; text-transform: uppercase;}
        .hero-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 40px; letter-spacing: 1px;}
        
        .menu-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background: #111; border: 1px solid #333; border-radius: 12px;
            padding: 20px; color: var(--text-main); text-align: left;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .menu-btn:active { background: #222; }
        .menu-day { font-size: 1.2rem; font-weight: 700; }
        .menu-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }

        /* --- MODAL (Workout Preview) --- */
        #modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 50; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .modal-content {
            background: #151515; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 30px 20px calc(var(--sa-bottom) + 20px);
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        #modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; color: var(--color-work); }
        .ex-list { list-style: none; margin-bottom: 30px; max-height: 40vh; overflow-y: auto; }
        .ex-item { padding: 12px 0; border-bottom: 1px solid #222; }
        .ex-name { font-weight: 600; font-size: 1.1rem; }
        .ex-context { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
        .btn-start {
            width: 100%; background: var(--text-main); color: var(--bg); border: none;
            padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold;
        }

        /* --- WORKOUT SCREEN --- */
        #workout-screen { background: var(--bg); justify-content: space-between; padding-top: var(--sa-top); padding-bottom: var(--sa-bottom); }
        
        /* Progress Bar */
        .progress-container { width: 100%; height: 4px; background: #222; position: absolute; top: 0; left: 0; z-index: 30;}
        #global-progress { height: 100%; background: var(--color-work); width: 0%; transition: width 1s linear; }

        /* Top HUD */
        .hud-top { padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .status-text { font-size: 0.9rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .round-text { font-size: 0.9rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        
        /* Long-press Close Button */
        .close-btn-wrapper { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
        .close-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none;}
        .close-ring circle { fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset 0.1s; }

        /* Main Display */
        .main-display { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #timer { 
            font-family: var(--font-mono); font-size: 7.5rem; font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums; letter-spacing: -2px; z-index: 20;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0.6; }

        /* Bottom Info */
        .hud-bottom { padding: 20px 20px 40px; text-align: center; z-index: 20; }
        #ex-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
        #ex-cue { font-size: 1rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 500;}
        #ex-next { font-size: 0.9rem; color: #555; }

        /* Gesture Overlay & Pause State */
        #gesture-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; }
        #pause-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 12px;
            font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;
            border: 1px solid #333; backdrop-filter: blur(5px); z-index: 45;
        }

        /* Color States */
        .theme-work { color: var(--color-work); }
        .theme-rest { color: var(--color-rest); }
        .theme-prep { color: var(--text-main); }

        /* --- DONE SCREEN --- */
        #done-screen { align-items: center; justify-content: center; padding: 20px; text-align: center;}
        .done-icon { width: 80px; height: 80px; stroke: var(--color-work); margin-bottom: 20px; }
        .stat-box { background: #111; border-radius: 12px; padding: 20px; width: 100%; max-width: 300px; margin: 30px 0; border: 1px solid #222;}
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1rem;}
        .stat-item:last-child { margin-bottom: 0; }
        .stat-val { font-family: var(--font-mono); font-weight: bold; }

    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen">
        <div class="hero-title">冬山河 50 英里</div>
        <div class="hero-sub">核心基石訓練系統</div>
        <div class="menu-list">
            <button class="menu-btn" onclick="openModal(1)">
                <div><div class="menu-day">DAY 1</div><div class="menu-desc">腹直肌增厚 / 抗震盪</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(2)">
                <div><div class="menu-day">DAY 2</div><div class="menu-desc">側腹抗旋轉 / 穩定度</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="menu-btn" onclick="openModal(3)">
                <div><div class="menu-day">DAY 3</div><div class="menu-desc">動態心率 / 賽道模擬</div></div>
                <svg class="icon"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <div id="modal-title" class="modal-header">DAY X</div>
            <ul id="modal-list" class="ex-list"></ul>
            <button class="btn-start" onclick="initWorkout()">開始訓練</button>
        </div>
    </div>

    <!-- WORKOUT SCREEN -->
    <div id="workout-screen" class="screen hidden">
        <div class="progress-container"><div id="global-progress"></div></div>
        
        <div class="hud-top">
            <div>
                <div id="ui-status" class="status-text theme-prep">PREPARE</div>
                <div id="ui-round" class="round-text">ROUND 1 / 4</div>
            </div>
            <!-- Long press to exit -->
            <div class="close-btn-wrapper" id="btn-close">
                <svg class="close-ring"><circle cx="20" cy="20" r="18"></circle></svg>
                <svg class="icon" style="width:18px;height:18px;stroke:var(--text-muted);"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>

        <div class="main-display">
            <canvas id="anim-canvas"></canvas>
            <div id="timer">00</div>
        </div>

        <div class="hud-bottom">
            <div id="ex-title">--</div>
            <div id="ex-cue">--</div>
            <div id="ex-next">--</div>
        </div>

        <!-- Invisible Gesture Overlay -->
        <div id="gesture-overlay"></div>
        <div id="pause-indicator" class="hidden">PAUSED</div>
    </div>

    <!-- DONE SCREEN -->
    <div id="done-screen" class="screen hidden">
        <svg class="icon done-icon"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <div class="hero-title">訓練完成</div>
        <div class="hero-sub" style="margin-bottom:0">強悍的軀幹是 50 英里的基石。</div>
        
        <div class="stat-box">
            <div class="stat-item"><span>總耗時</span><span id="stat-time" class="stat-val">00:00</span></div>
            <div class="stat-item"><span>完成回合</span><span id="stat-round" class="stat-val">4 / 4</span></div>
        </div>
        
        <button class="menu-btn" style="justify-content:center; padding: 15px 40px;" onclick="goHome()">
            <span class="menu-day">返回主畫面</span>
        </button>
    </div>

    <script>
        /**
         * 系統核心架構：
         * 1. 單一真相來源 (performance.now)
         * 2. 有限狀態機 (FSM)
         * 3. DOM 節流渲染 (Throttling)
         * 4. 系統級 API 整合 (WakeLock, AudioContext, MediaSession, Visibility)
         */

        // --- DATA & CONFIG ---
        const CONFIG = {
            WORK_SEC: 45,
            REST_SEC: 15,
            PREP_SEC: 5,
            TOTAL_ROUNDS: 4,
            STORAGE_KEY: 'd50_core_state'
        };

        const SCHEDULE = {
            1: [
                { name: 'V字仰臥起坐', cue: '下背不懸空・手腳同步', txt1: '上去吐氣，下來吸氣。', txt2: '控制下放的速度，不要直接摔回地板。', ctx: '應對越野賽道中的大落差下坡。' },
                { name: '反向捲腹', cue: '下腹發力・骨盆微捲', txt1: '想像把肚臍壓向脊椎。', txt2: '不要靠慣性，用下腹把臀部抬起。', ctx: '延緩長距離後半段骨盆前傾導致的下背痛。' },
                { name: '直腿觸踝', cue: '雙腿打直・肩胛離地', txt1: '視線看向腳尖，脖子放鬆。', txt2: '肩膀再抬高一點，感覺上腹在燃燒。', ctx: '維持疲勞時挺拔的軀幹，確保呼吸順暢。' },
                { name: '死蟲式', cue: '下背釘死・對側延伸', txt1: '下背絕對不能離開地板。', txt2: '如果腰會痠，把腰用力壓向地板！', ctx: '完美模擬跑步時對側手腳連動的發力機制。' },
                { name: '棒式撐體', cue: '臀部夾緊・身體一直線', txt1: '手肘推地板，不要聳肩。', txt2: '全身繃緊，臀部不要掉下來，撐住！', ctx: '強悍的等長收縮力是維持跑姿不崩潰的關鍵。' }
            ],
            2: [
                { name: '俄羅斯轉體', cue: '胸口隨轉・視線跟隨', txt1: '轉動你的胸椎，不是只有手在揮。', txt2: '雙腳穩住不要左右晃，核心收緊。', ctx: '抵抗軀幹過度旋轉，將能量轉化為向前動力。' },
                { name: '腳踏車捲腹', cue: '放慢節奏・肘找對膝', txt1: '重點是旋轉的幅度，不是速度。', txt2: '肩膀徹底離開地板扭轉，感受側腹擠壓。', ctx: '提升步態切換時的骨盆穩定度，減輕ITB壓力。' },
                { name: '側棒式 (右)', cue: '骨盆頂高・側腹收緊', txt1: '想像身體是一面平整的牆。', txt2: '骨盆往上頂！撐起你的右側腹。', ctx: '側向穩定是預防跨步無力、單腳支撐崩潰的武器。' },
                { name: '側棒式 (左)', cue: '骨盆頂高・呼吸平穩', txt1: '換邊。肩關節在手肘正上方。', txt2: '發抖是正常的，把臀部再推高兩公分。', ctx: '弭平左右肌力不平衡，避免代償受傷。' },
                { name: '側躺捲腹', cue: '側腹發力・手腳相碰', txt1: '用側腹力量把上半身和雙腿拉近。', txt2: '不要用底下的手撐，側腹主導發力。', ctx: '極限收縮能力，在滑倒失衡時瞬間拉回正軌。' }
            ],
            3: [
                { name: '登山者', cue: '骨盆穩定・膝蓋找胸', txt1: '把背部撐飽滿，不要塌腰。', txt2: '加快節奏！臀部不要上下彈跳。', ctx: '考驗高心率、高步頻下核心鎖死骨盆的能力。' },
                { name: '剪刀腿', cue: '下背壓地・小幅交叉', txt1: '腿不用抬太高，越貼近地板越吃力。', txt2: '把腰用力壓平，雙腿繃直！', ctx: '強迫下腹部在動態中維持張力，契合下肢擺動。' },
                { name: '棒式開合跳', cue: '核心繃緊・控制高度', txt1: '雙腳開合，上半身保持穩定。', txt2: '核心鎖死！不要讓臀部跟著甩動。', ctx: '訓練抗震能力，降低下坡時五臟六腑的晃動。' },
                { name: '交替摸腳踝', cue: '肩胛微離・左右平移', txt1: '眼睛看天花板，用側腹左右滑動。', txt2: '指尖去碰鞋跟，肩膀不要掉下來。', ctx: '軀幹側向靈活度，幫助在林道中靈活閃避障礙。' },
                { name: '大字伸展', cue: '下背壓平・全身繃緊', txt1: '身體變成一個微彎的香蕉。', txt2: '最後的堅持！把腰死死壓在地板上，撐住！', ctx: '核心耐力的終極試煉。' }
            ]
        };

        // --- STATE MACHINE ---
        let state = {
            day: 1,
            phase: 'PREP', // PREP, WORK, REST, DONE
            round: 1,
            exIndex: 0,
            timeLeft: 0,
            isPaused: false,
            lastTick: 0,
            flags: { toldStart: false, told15s: false, nextAnnounced: false },
            sessionStartMs: 0, // Real-time duration tracking
            activeTimeMs: 0
        };

        let activeDayData = [];
        let reqAnimFrameId = null;
        let lastRenderedSec = -1; 
        
        // --- DOM Elements ---
        const els = {
            home: document.getElementById('home-screen'),
            modal: document.getElementById('modal-overlay'),
            workout: document.getElementById('workout-screen'),
            done: document.getElementById('done-screen'),
            modalTitle: document.getElementById('modal-title'),
            modalList: document.getElementById('modal-list'),
            timer: document.getElementById('timer'),
            uiStatus: document.getElementById('ui-status'),
            uiRound: document.getElementById('ui-round'),
            exTitle: document.getElementById('ex-title'),
            exCue: document.getElementById('ex-cue'),
            exNext: document.getElementById('ex-next'),
            progress: document.getElementById('global-progress'),
            pauseInd: document.getElementById('pause-indicator'),
            closeCircle: document.querySelector('.close-ring circle'),
            canvas: document.getElementById('anim-canvas')
        };
        const ctx = els.canvas.getContext('2d', { alpha: false }); // Optimize for no transparency background
        
        // --- AUDIO ENGINE ---
        let actx = null;
        let synth = window.speechSynthesis;
        
        function initAudio() {
            if (!actx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                actx = new AudioContext();
            }
            if (actx.state === 'suspended') actx.resume();
            
            // Unlock TTS
            if (synth) {
                synth.cancel();
                let u = new SpeechSynthesisUtterance('');
                u.volume = 0; synth.speak(u);
            }
        }

        function playBeep(type) {
            if (!actx) return;
            const t = actx.currentTime;
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            
            // Compressor to prevent clipping
            const comp = actx.createDynamicsCompressor();
            comp.connect(actx.destination);
            
            osc.connect(gain);
            gain.connect(comp);
            
            if (type === 'start') { // High pitched
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
                gain.gain.setValueAtTime(1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            } else if (type === 'rest') { // Low double beep
                osc.type = 'square'; osc.frequency.setValueAtTime(440, t);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.start(t); osc.stop(t + 0.2);
            } else if (type === 'count') { // Short sharp
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
                gain.gain.setValueAtTime(0.8, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            }
        }

        function speak(text) {
            if (!synth) return;
            synth.cancel(); // Kill zombie queue
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.rate = 1.15;
            synth.speak(u);
        }

        // --- SYSTEM APIs (WakeLock, Visibility, MediaSession) ---
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log('WakeLock denied', err); }
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (state.phase !== 'DONE' && !state.isPaused) requestWakeLock();
            } else {
                if (state.phase !== 'DONE' && state.phase !== 'PREP') dispatch('PAUSE', true); // Auto pause
            }
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => dispatch('PAUSE', false));
            navigator.mediaSession.setActionHandler('pause', () => dispatch('PAUSE', true));
            navigator.mediaSession.setActionHandler('nexttrack', () => dispatch('SKIP', 1));
            navigator.mediaSession.setActionHandler('previoustrack', () => dispatch('SKIP', -1));
        }

        // --- STORAGE ---
        function saveSnapshot() {
            if (state.phase === 'DONE') {
                localStorage.removeItem(CONFIG.STORAGE_KEY);
            } else {
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
            }
        }
        function loadSnapshot() {
            try {
                const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Minimal validation
                    if (parsed.day && SCHEDULE[parsed.day] && parsed.phase !== 'DONE') {
                        state = parsed;
                        state.isPaused = true; // Always load paused
                        state.lastTick = performance.now();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        // --- LOGIC / CONTROLLER ---
        function openModal(day) {
            initAudio(); // 1st interaction unlock
            state.day = day;
            activeDayData = SCHEDULE[day];
            
            els.modalTitle.innerText = `DAY ${day}`;
            els.modalTitle.style.color = (day===1) ? '#ff4b2b' : (day===2) ? '#00b0ff' : '#ff9800';
            els.modalList.innerHTML = activeDayData.map(ex => 
                `<li class="ex-item"><div class="ex-name">${ex.name}</div><div class="ex-context">${ex.ctx}</div></li>`
            ).join('');
            
            els.modal.classList.remove('hidden');
            // Hack for back button logic
            history.pushState({ modalOpen: true }, '');
        }

        window.addEventListener('popstate', (e) => {
            if (!els.modal.classList.contains('hidden') && state.phase === 'PREP') {
                els.modal.classList.add('hidden');
            } else if (state.phase !== 'DONE' && !els.workout.classList.contains('hidden')) {
                // Prevent going back during workout
                history.pushState({ workoutOpen: true }, '');
                dispatch('PAUSE', true);
            }
        });

        function initWorkout() {
            els.modal.classList.add('hidden');
            els.home.classList.add('hidden');
            els.workout.classList.remove('hidden');
            
            requestWakeLock();
            history.pushState({ workoutOpen: true }, '');

            if (!loadSnapshot() || state.day !== state.day) { // Reset if fresh
                state.phase = 'PREP';
                state.round = 1;
                state.exIndex = 0;
                state.timeLeft = CONFIG.PREP_SEC;
                state.isPaused = false;
                state.sessionStartMs = performance.now();
                state.activeTimeMs = 0;
                resetFlags();
            }
            
            activeDayData = SCHEDULE[state.day];
            state.lastTick = performance.now();
            updateMediaSession();
            forceRenderUI();
            saveSnapshot();
            
            if (!reqAnimFrameId) reqAnimFrameId = requestAnimationFrame(loop);
            if (!state.isPaused) speak(`第${state.day}天訓練準備開始。`);
        }

        function resetFlags() {
            state.flags = { toldStart: false, told15s: false, nextAnnounced: false, lastBeepSec: -1 };
        }

        function dispatch(action, payload) {
            if (action === 'PAUSE') {
                state.isPaused = payload !== undefined ? payload : !state.isPaused;
                if (!state.isPaused) { // Resuming
                    state.lastTick = performance.now();
                    if(actx && actx.state === 'suspended') actx.resume(); // Rescue AudioContext
                    requestWakeLock();
                }
                els.pauseInd.classList.toggle('hidden', !state.isPaused);
                saveSnapshot();
            }
            else if (action === 'SKIP') {
                state.exIndex += payload;
                if (state.exIndex >= activeDayData.length) {
                    state.exIndex = 0; state.round++;
                } else if (state.exIndex < 0) {
                    if (state.round > 1) { state.round--; state.exIndex = activeDayData.length - 1; }
                    else { state.exIndex = 0; }
                }
                // When skipped, force back to PREP to avoid confusion
                state.phase = 'PREP';
                state.timeLeft = 5;
                resetFlags();
                updateMediaSession();
                saveSnapshot();
                forceRenderUI();
            }
            else if (action === 'END') {
                state.phase = 'DONE';
                saveSnapshot();
                
                let m = Math.floor((state.activeTimeMs / 1000) / 60);
                let s = Math.floor((state.activeTimeMs / 1000) % 60);
                document.getElementById('stat-time').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                document.getElementById('stat-round').innerText = `${Math.min(state.round, CONFIG.TOTAL_ROUNDS)} / ${CONFIG.TOTAL_ROUNDS}`;
                
                els.workout.classList.add('hidden');
                els.done.classList.remove('hidden');
                speak("訓練完成，做得好。");
                if (wakeLock) wakeLock.release().then(() => wakeLock = null);
            }
        }

        function transitionPhase() {
            if (state.phase === 'PREP' || state.phase === 'REST') {
                state.phase = 'WORK';
                state.timeLeft = CONFIG.WORK_SEC;
                resetFlags();
                playBeep('start');
            } else if (state.phase === 'WORK') {
                if (state.exIndex === activeDayData.length - 1 && state.round === CONFIG.TOTAL_ROUNDS) {
                    dispatch('END'); return;
                }
                state.phase = 'REST';
                state.timeLeft = CONFIG.REST_SEC;
                resetFlags();
                playBeep('rest');
                
                state.exIndex++;
                if (state.exIndex >= activeDayData.length) {
                    state.exIndex = 0; state.round++;
                }
            }
            updateMediaSession();
            saveSnapshot();
            forceRenderUI();
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                let currentEx = activeDayData[state.exIndex];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: state.phase === 'REST' ? '休息' : currentEx.name,
                    artist: `冬山河核心 Day ${state.day} - R${state.round}`,
                });
            }
        }

        // --- MAIN LOOP ---
        function loop(now) {
            if (!state) return;
            let dt = now - state.lastTick;
            state.lastTick = now;

            if (!state.isPaused && state.phase !== 'DONE') {
                state.timeLeft -= dt / 1000;
                state.activeTimeMs += dt;
                
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0; // Prevent negative bleeding
                    transitionPhase();
                } else {
                    handleAudioTriggers(Math.ceil(state.timeLeft));
                }
                
                let displaySec = Math.ceil(state.timeLeft);
                if (displaySec !== lastRenderedSec) {
                    renderDOMText(displaySec);
                    lastRenderedSec = displaySec;
                }
            }

            renderCanvas();
            reqAnimFrameId = requestAnimationFrame(loop);
        }

        function handleAudioTriggers(sec) {
            if (sec <= 3 && sec > 0 && sec !== state.flags.lastBeepSec) {
                playBeep('count');
                state.flags.lastBeepSec = sec;
            }

            let curEx = activeDayData[state.exIndex];
            if (state.phase === 'WORK') {
                if (!state.flags.toldStart && sec <= CONFIG.WORK_SEC - 1) {
                    speak(curEx.name + "。" + curEx.txt1);
                    state.flags.toldStart = true;
                }
                if (!state.flags.told15s && sec === 15) {
                    speak(curEx.txt2);
                    state.flags.told15s = true;
                }
            } else if (state.phase === 'REST') {
                if (!state.flags.nextAnnounced && sec === Math.min(10, CONFIG.REST_SEC - 2)) {
                    speak("下一個動作：" + curEx.name);
                    state.flags.nextAnnounced = true;
                }
            }
        }

        function renderDOMText(secStr) {
            els.timer.innerText = secStr.toString().padStart(2, '0');
            
            let prog = ((state.round - 1) * activeDayData.length + state.exIndex) / (CONFIG.TOTAL_ROUNDS * activeDayData.length);
            if(state.phase === 'WORK') prog += (1 - (state.timeLeft / CONFIG.WORK_SEC)) * (1 / (CONFIG.TOTAL_ROUNDS * activeDayData.length));
            els.progress.style.width = `${prog * 100}%`;
        }

        function forceRenderUI() {
            let curEx = activeDayData[state.exIndex];
            els.uiRound.innerText = `ROUND ${state.round} / ${CONFIG.TOTAL_ROUNDS}`;
            
            els.uiStatus.className = 'status-text';
            els.timer.className = '';
            
            if (state.phase === 'PREP') {
                els.uiStatus.innerText = 'PREPARE'; els.uiStatus.classList.add('theme-prep');
                els.exTitle.innerText = "準備";
                els.exCue.innerText = `即將開始: ${curEx.name}`;
                els.exNext.innerText = "";
            } else if (state.phase === 'WORK') {
                els.uiStatus.innerText = 'WORK'; els.uiStatus.classList.add('theme-work');
                els.timer.classList.add('theme-work');
                els.exTitle.innerText = curEx.name;
                els.exCue.innerText = curEx.cue;
                els.exNext.innerText = "";
            } else if (state.phase === 'REST') {
                els.uiStatus.innerText = 'REST'; els.uiStatus.classList.add('theme-rest');
                els.timer.classList.add('theme-rest');
                els.exTitle.innerText = "休息";
                els.exCue.innerText = "深呼吸，放鬆核心";
                els.exNext.innerText = `NEXT: ${curEx.name}`;
            }
            renderDOMText(Math.max(0, Math.ceil(state.timeLeft)));
        }

        // --- CANVAS ENGINE (Minimalist Biomechanics) ---
        function resizeCanvas() {
            let pr = window.devicePixelRatio || 1;
            els.canvas.width = els.canvas.clientWidth * pr;
            els.canvas.height = els.canvas.clientHeight * pr;
            ctx.scale(pr, pr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderCanvas() {
            // Throttle rendering if paused or resting to save battery
            if (state.isPaused || state.phase === 'PREP') return; 

            let cw = els.canvas.clientWidth;
            let ch = els.canvas.clientHeight;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, cw, ch);

            // Floor Line
            let cy = ch * 0.75;
            ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(cw, cy); ctx.stroke();

            // Calculate 't' (0 to 1 oscillating based on phase and elapsed time)
            let t = 0;
            if (state.phase === 'WORK') {
                let elapsed = CONFIG.WORK_SEC - state.timeLeft;
                let cycleSpeed = 3; // 3 seconds per rep
                t = (Math.sin((elapsed % cycleSpeed / cycleSpeed) * Math.PI * 2) + 1) / 2;
            } else {
                t = (Math.sin(performance.now() / 1000) + 1) / 2 * 0.1; // Gentle breathing in rest
            }

            // Draw abstract geometry based on exercise
            ctx.save();
            ctx.translate(cw/2, cy);
            
            const color = state.phase === 'WORK' ? 'rgba(0, 229, 255, 0.8)' : 'rgba(255, 179, 0, 0.5)';
            ctx.strokeStyle = color;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            // A highly abstract, math-driven representation instead of complex stickmen
            // Focuses on the "Core" (a polygon) and "Limbs" (lines)
            let coreY = -40;
            let p1, p2, p3, p4; // Core polygon vertices
            
            if (state.phase === 'WORK') {
                // V-Ups abstract (folding in half)
                let fold = t * 60;
                p1 = {x: -30 + fold/2, y: coreY - fold}; // Shoulders
                p2 = {x: 30 - fold/2, y: coreY - fold};  // Knees
                p3 = {x: 0, y: 0};                       // Hips on floor
                
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                // Draw Core Tension Line
                ctx.strokeStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            } else {
                // Rest Abstract
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-50, 0);
                ctx.lineTo(0, coreY + t*10); // Breathing chest
                ctx.lineTo(50, 0);
                ctx.stroke();
            }
            ctx.restore();
        }

        // --- GESTURES & INPUT ---
        let tx = 0, ty = 0, tTime = 0;
        const gOverlay = els.gestureOverlay = document.getElementById('gesture-overlay');

        gOverlay.addEventListener('touchstart', e => {
            tx = e.changedTouches[0].screenX;
            ty = e.changedTouches[0].screenY;
            tTime = performance.now();
        }, {passive: true});

        gOverlay.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - tx;
            let dy = e.changedTouches[0].screenY - ty;
            let dt = performance.now() - tTime;

            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && dt < 500) {
                // Swipe horizontal
                dispatch('SKIP', dx > 0 ? -1 : 1); // Right swipe = Prev, Left swipe = Next
            } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 300) {
                // Tap
                dispatch('PAUSE');
            }
        }, {passive: true});

        // Long Press to Close
        let closeTimer = null;
        let closeProg = 0;
        const btnClose = document.getElementById('btn-close');
        
        function fillCloseRing() {
            closeProg += 10;
            let offset = 113 - (closeProg / 100) * 113;
            els.closeCircle.style.strokeDashoffset = Math.max(0, offset);
            if (closeProg >= 100) {
                clearTimeout(closeTimer);
                dispatch('END');
            } else {
                closeTimer = setTimeout(fillCloseRing, 100); // 1000ms total
            }
        }
        function startClosePress(e) { e.preventDefault(); closeProg = 0; fillCloseRing(); }
        function cancelClosePress() { clearTimeout(closeTimer); closeProg = 0; els.closeCircle.style.strokeDashoffset = 113; }
        
        btnClose.addEventListener('touchstart', startClosePress);
        btnClose.addEventListener('touchend', cancelClosePress);
        btnClose.addEventListener('touchcancel', cancelClosePress);
        btnClose.addEventListener('mousedown', startClosePress);
        btnClose.addEventListener('mouseup', cancelClosePress);
        btnClose.addEventListener('mouseleave', cancelClosePress);


        function goHome() {
            els.done.classList.add('hidden');
            els.home.classList.remove('hidden');
            if (reqAnimFrameId) { cancelAnimationFrame(reqAnimFrameId); reqAnimFrameId = null; }
        }

    </script>
</body>
</html>
