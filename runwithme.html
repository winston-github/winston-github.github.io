<!DOCTYPE html>
<html lang="zh-TW" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>Pro Treadmill OS</title>
    <style>
        :root { 
            --bg-dark: #000000; --bg-card: #111111; --bg-overlay: rgba(0,0,0,0.9);
            --neon-green: #32D74B; --neon-yellow: #FFD60A; --neon-red: #FF453A; --neon-blue: #0A84FF;
            --z1: #8E8E93; --z2: #0A84FF; --z3: #FFD60A; --z4: #FF9F0A; --z5: #FF453A;
            --gray: #8E8E93; --gray-light: #D1D1D6; --text-main: #FFFFFF; 
            --border-color: #222222; 
            --safe-bottom: env(safe-area-inset-bottom, 20px); --safe-top: env(safe-area-inset-top, 20px);
            --z-toast: 10000; --z-modal: 9000; --z-header: 500; --z-footer: 100;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
        
        body { 
            background-color: var(--bg-dark); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Helvetica, sans-serif; 
            height: calc(var(--vh, 1vh) * 100); display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }

        #app-shell { width: 100%; max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; position: relative; padding-top: var(--safe-top); }

        #header { flex: 0 0 50px; display: flex; background: var(--bg-dark); position: relative; z-index: var(--z-header); }
        .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; font-weight: 700; color: var(--gray); background: transparent; border: none; cursor: pointer; outline: none; }
        .tab-btn.active { color: var(--text-main); }
        .tab-indicator { position: absolute; bottom: 0; height: 3px; background: var(--text-main); width: 50%; transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 3px 3px 0 0;}

        #content-wrapper { flex: 1 1 auto; overflow: hidden; position: relative; }
        .views-slider { display: flex; width: 200vw; height: 100%; transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1); will-change: transform; }
        .tab-content { width: 100vw; max-width: 768px; flex-shrink: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
        .view-section { flex: 1; display: none; flex-direction: column; height: 100%; overflow-y: auto; scrollbar-width: none; padding: 15px; gap: 15px; }
        .view-section.active { display: flex; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Dial Input Lock Overlay */
        #dialInputLock { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); z-index: 100; display: none; }
        
        .setup-top-half { flex: none; display: flex; flex-direction: column; gap: 15px; }
        .dial-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 15px; }
        .dial-group { display: flex; flex-direction: column; align-items: center; background: var(--bg-card); border-radius: 12px; padding: 8px 4px; border: 1px solid var(--border-color); position: relative;}
        .dial-label { font-size: 0.8rem; font-weight: 600; color: var(--gray-light); margin-bottom: 6px; letter-spacing: 0.5px; }
        .dial-window { height: 90px; width: 100%; position: relative; overflow: hidden; }
        .dial-window::before { content:''; position:absolute; top: 0; left: 0; right: 0; height: 30px; background: linear-gradient(180deg, var(--bg-card), transparent); z-index: 2; pointer-events: none; }
        .dial-window::after { content:''; position:absolute; bottom: 0; left: 0; right: 0; height: 30px; background: linear-gradient(0deg, var(--bg-card), transparent); z-index: 2; pointer-events: none; }
        .dial-selection-bar { position: absolute; top: 50%; left: 10%; right: 10%; transform: translateY(-50%); height: 30px; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1; pointer-events: none; }
        .dial-scroll { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;}
        .dial-scroll.locked { overflow-y: hidden; }
        .dial-scroll::-webkit-scrollbar { display: none; }
        .dial-spacer { height: 30px; scroll-snap-align: center; }
        .dial-item { height: 30px; display: flex; justify-content: center; align-items: center; font-size: 1.15rem; font-weight: 600; color: var(--gray); scroll-snap-align: center; cursor: pointer; }
        .dial-item.active { font-size: 1.4rem; font-weight: 900; color: var(--text-main); }
        .dial-input-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 40px; background: #222; border: 2px solid var(--neon-blue); border-radius: 8px; color: #FFF; font-size: 1.4rem; font-weight: 900; text-align: center; z-index: 105; outline: none; }

        .prog-carousel-wrap { width: 100%; position: relative; }
        .prog-carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 5px; }
        .prog-carousel::-webkit-scrollbar { display: none; }
        .prog-card { scroll-snap-align: start; flex: 0 0 150px; height: 75px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: center; transition: all 0.2s; cursor: pointer; }
        .prog-card .p-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .prog-card .p-desc { font-size: 0.75rem; color: var(--gray); font-weight: 500; line-height: 1.3; }
        .prog-card.selected { border-color: var(--text-main); background: #222; }

        .chart-card { flex: 1; min-height: 250px; display: flex; flex-direction: column; background: var(--bg-card); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); }
        .hud-grid { width: 100%; display: flex; flex-direction: column; margin-bottom: 8px; position: relative; }
        .hud-row { display: grid; grid-template-columns: 45px repeat(4, 1fr); align-items: center; text-align: right; padding: 5px 0; font-size: clamp(0.7rem, 3.5vw, 0.95rem);}
        .hud-row.header { font-weight: 700; color: var(--gray); border-bottom: 1px solid #333; margin-bottom: 2px; }
        .hud-row .lbl { text-align: left; font-weight: 800; color: inherit; }
        .hud-row span { font-weight: 900; }
        .hud-avg { color: var(--gray); border-bottom: 1px dashed #222; }
        .hud-max { color: var(--text-main); padding-top: 6px; }
        .hud-hov { visibility: hidden; opacity: 0; color: #FFF; padding-top: 6px; border-top: 1px dashed #222; margin-top: 4px; position: absolute; bottom: -30px; left:0; right:0; background: rgba(0,0,0,0.8); z-index: 10; border-radius: 8px; padding: 8px;}
        .hud-hov.show { visibility: visible; opacity: 1; }
        
        .val-spd { color: var(--neon-green); } .val-inc { color: var(--neon-yellow); } .val-hr { color: var(--neon-blue); } .val-lac { color: var(--neon-red); }

        .canvas-container { position: relative; width: 100%; flex: 1; min-height: 10px; }
        canvas { width: 100%; height: 100%; display: block; }
        .crosshair { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.4); pointer-events: none; display: none; z-index: 5;}
        
        /* OLED White Running Text */
        .massive-time { font-size: 4.5rem; font-weight: 900; line-height: 1; text-align: center; letter-spacing: -2px; padding: 10px 0; color: #FFFFFF; }
        .run-primary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: none; }
        .run-val-box { position: relative; display: flex; flex-direction: column; align-items: center; background: var(--bg-card); padding: 20px 0; border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden;}
        .run-big-val { font-size: 3.8rem; font-weight: 900; line-height: 1; letter-spacing: -1px; color: #FFFFFF; z-index: 2; pointer-events: none; transition: transform 0.1s;}
        .run-lbl { font-size: 0.85rem; color: var(--gray); font-weight: 700; margin-top: 10px; letter-spacing: 1px; z-index: 2; pointer-events: none;}
        
        /* Massive Hitboxes for +/- */
        .hitbox-left, .hitbox-right { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; cursor: pointer; }
        .hitbox-left { left: 0; } .hitbox-right { right: 0; }
        .hitbox-left:active { background: rgba(255,255,255,0.05); } .hitbox-right:active { background: rgba(255,255,255,0.05); }
        
        .run-sec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 10px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); flex: none; }
        .r-s-box { display: flex; flex-direction: column; align-items: center; }
        .r-s-val { font-size: 1.4rem; font-weight: 900; color: #FFFFFF; }
        .r-s-lbl { font-size: 0.75rem; color: var(--gray); font-weight: 700; margin-top: 6px; }
        
        .zone-dash { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 15px; flex: none; }
        .zd-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .zd-title { color: var(--gray-light); font-weight: 700; font-size: 0.9rem; }
        .zd-cal { color: var(--text-main); font-weight: 900; font-size: 1.2rem; }
        .stacked-zone-bar { width: 100%; height: 14px; display: flex; border-radius: 7px; overflow: hidden; background: #222; }
        .sz-segment { height: 100%; transition: flex-basis 0.3s ease; }
        .bg-z1 { background-color: var(--z1); } .bg-z2 { background-color: var(--z2); } .bg-z3 { background-color: var(--z3); } .bg-z4 { background-color: var(--z4); } .bg-z5 { background-color: var(--z5); }
        .zone-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.8rem; font-weight: 700; color: var(--gray); }

        #tabContent2 { overflow-y: auto; scrollbar-width: none; }
        .list-header { display: flex; justify-content: space-between; padding: 12px 20px; color: var(--gray-light); font-size: 0.8rem; font-weight: 700; border-bottom: 1px solid #333; position: sticky; top: 0; background: rgba(0,0,0,0.9); z-index: 10;}
        .preview-list { list-style: none; padding: 10px; }
        .preview-list li { padding: 16px 15px; border-radius: 8px; margin-bottom: 4px; font-size: 1.05rem; color: var(--gray); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        .list-col-time { width: 65px; font-weight: 900; color: var(--text-main);}
        .list-col-spd { width: 80px; text-align: center; color: var(--neon-green); }
        .list-col-inc { width: 60px; text-align: center; color: var(--neon-yellow); }
        .list-col-phase { flex: 1; text-align: center; font-size: 0.95rem;}
        .list-col-hr { width: 65px; text-align: right; color: var(--neon-red); font-weight: 800;}

        #footer { flex: 0 0 auto; background: var(--bg-dark); border-top: 1px solid var(--border-color); padding: 15px 20px calc(15px + var(--safe-bottom)) 20px; z-index: var(--z-footer); }
        .bottom-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn-ctrl { height: 64px; border-radius: 32px; border: none; font-size: 1.25rem; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; outline: none; touch-action: manipulation; }
        .btn-ctrl:active { opacity: 0.8; }
        .btn-ctrl svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0;}
        
        .btn-runner { background: var(--bg-card); color: var(--text-main); border: 1px solid #333; }
        .btn-start { background: var(--text-main); color: #000; }
        .btn-pause { background: var(--neon-yellow); color: #000; }
        .btn-end { background: transparent; color: var(--neon-red); border: 2px solid var(--neon-red); position: relative; overflow: hidden;}
        
        .btn-end::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: rgba(255, 69, 58, 0.3); transition: width 0s; }
        .btn-end.holding::after { width: 100%; transition: width 1.5s linear; }
        .btn-hide { display: none !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-overlay); z-index: var(--z-modal); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;}
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 20px; width: 92%; max-width: 440px; max-height: 90%; display: flex; flex-direction: column; transform: scale(0.95); transition: transform 0.2s ease;}
        .modal-overlay.show .modal-box { transform: scale(1); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid #222; }
        .modal-title { color: var(--text-main); font-size: 1.15rem; font-weight: 800; }
        .btn-close-modal { background: transparent; border: none; fill: var(--gray-light); width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; margin: -10px; cursor: pointer; }
        
        .modal-content-scroll { overflow-y: auto; padding: 20px; padding-bottom: 50vh; flex: 1; overscroll-behavior: contain; scrollbar-width: none; }
        .modal-footer { display: flex; justify-content: space-between; padding: 15px 20px; border-top: 1px solid #222; background: var(--bg-card); border-radius: 0 0 20px 20px; flex-shrink: 0;}
        
        .btn-modal { flex: 1; padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 800; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 5px;}
        .btn-save { background: var(--text-main); color: #000; }
        .btn-ghost { background: transparent; color: var(--gray-light); border: 1px solid #444; }

        .rm-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .rm-label { font-size: 0.85rem; color: var(--gray-light); font-weight: 700; border-bottom: 1px solid #222; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px;}
        
        .accordion-header { cursor: pointer; color: var(--text-main); }
        .accordion-header svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.3s; margin-left: 5px; }
        .accordion-header.open svg { transform: rotate(180deg); }
        .accordion-content { display: none; padding-top: 5px; animation: fadeIn 0.3s; }
        .accordion-content.show { display: block; }

        .input-wrapper { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 12px 15px; display: flex; align-items: center; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: #FFF; font-size: 1.2rem; font-weight: 800; outline: none; width: 100%; }
        
        .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;}
        .param-item { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 10px 15px; display: flex; flex-direction: column; position: relative;}
        .param-item label { color: var(--gray); font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
        .param-item input { background: transparent; border: none; color: #FFF; font-size: 1.3rem; font-weight: 900; outline: none; width: 100%; }
        .param-item .unit { position: absolute; right: 12px; bottom: 12px; font-size: 0.75rem; font-weight: 700; color: #555; pointer-events: none;}

        .segmented-control { display: flex; background: #000; border-radius: 10px; padding: 4px; border: 1px solid #333; position: relative; }
        .seg-btn { flex: 1; padding: 10px 0; background: transparent; border: none; color: var(--gray); font-size: 0.9rem; font-weight: 700; cursor: pointer; z-index: 2; outline: none; transition: color 0.3s;}
        .seg-btn.active { color: #FFF; }
        .seg-indicator { position: absolute; top: 4px; bottom: 4px; background: #333; border-radius: 8px; z-index: 1; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

        #topNotification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(20, 20, 20, 0.95); border-radius: 16px; z-index: var(--z-toast); transition: top 0.3s ease; overflow: hidden; border: 1px solid #444;}
        #topNotification.show { top: env(safe-area-inset-top, 15px); }
        .notif-content { padding: 15px; font-size: 0.9rem; color: #FFF; line-height: 1.4; font-weight: 600;}
        .notif-bar-bg { width: 100%; height: 3px; background: #222; }
        .notif-bar-fill { height: 100%; background: var(--text-main); width: 100%; transform-origin: left; }
        
        .svg-icon { width: 20px; height: 20px; fill: currentColor; vertical-align: middle; margin-right: 6px; }
    </style>
</head>


<body>

<!-- Silent Audio for Keep-Alive (極短靜音WAV，防背景失聲) -->
<audio id="silentAudio" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<div id="dialInputLock"></div>

<div id="app-shell">
    
    <!-- 頂部 Tab 導航 -->
    <header id="header">
        <button class="tab-btn active" data-action="tab-settings" id="tabSettings"></button>
        <button class="tab-btn" data-action="tab-matrix" id="tabMatrix"></button>
        <div class="tab-indicator" id="tabIndicator"></div>
    </header>

    <!-- 中間滾動內容區 -->
    <main id="content-wrapper">
        <div class="views-slider" id="viewsSlider">
            
            <!-- 視圖 1: 設定與儀表板 -->
            <div class="tab-content" id="tabContent1">
                
                <!-- 狀態 A: 初始設定畫面 -->
                <div id="setup-view" class="view-section active">
                    <div class="setup-top-half">
                        <div class="dial-grid">
                            <div class="dial-group"><div class="dial-label" id="lblTotalTime"></div><div class="dial-window" id="dw-time"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-time"></div></div></div>
                            <div class="dial-group"><div class="dial-label" id="lblSetMxS"></div><div class="dial-window" id="dw-mxs"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-mxs"></div></div></div>
                            <div class="dial-group"><div class="dial-label" id="lblSetMxI"></div><div class="dial-window" id="dw-mxi"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-mxi"></div></div></div>
                            <div class="dial-group"><div class="dial-label" id="lblTargetKm"></div><div class="dial-window" id="dw-dist"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-dist"></div></div></div>
                            <div class="dial-group"><div class="dial-label" id="lblSetMnS"></div><div class="dial-window" id="dw-mns"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-mns"></div></div></div>
                            <div class="dial-group"><div class="dial-label" id="lblSetMnI"></div><div class="dial-window" id="dw-mni"><div class="dial-selection-bar"></div><div class="dial-scroll" id="ds-mni"></div></div></div>
                        </div>
                        <div class="prog-carousel-wrap"><div class="prog-carousel" id="progGrid"></div></div>
                    </div>

                    <div class="chart-card">
                        <div class="hud-grid">
                            <div class="hud-row header"><span id="hudH1"></span><span id="hudH2"></span><span id="hudH3"></span><span id="hudH4"></span><span id="hudH5"></span></div>
                            <div class="hud-row hud-avg"><span class="lbl" id="lblAvg"></span><span class="val-spd" data-bind="sAvgSpd">--</span><span class="val-inc" data-bind="sAvgInc">--</span><span class="val-hr" data-bind="sAvgHr">--</span><span class="val-lac" data-bind="sAvgLac">--</span></div>
                            <div class="hud-row hud-max"><span class="lbl" id="lblMax"></span><span class="val-spd" data-bind="sMaxSpd">--</span><span class="val-inc" data-bind="sMaxInc">--</span><span class="val-hr" data-bind="sMaxHr">--</span><span class="val-lac" data-bind="sMaxLac">--</span></div>
                            <div class="hud-row hud-hov" id="sHovRow"><span class="lbl" data-bind="sHovMin">--m</span><span class="val-spd" data-bind="sHovSpd">--</span><span class="val-inc" data-bind="sHovInc">--</span><span class="val-hr" data-bind="sHovHr">--</span><span class="val-lac" data-bind="sHovLac">--</span></div>
                        </div>
                        <div class="canvas-container" id="sChartWrap">
                            <canvas id="sChart"></canvas>
                            <div class="crosshair" id="sCrosshair"></div>
                        </div>
                    </div>
                </div>

                <!-- 狀態 B: 跑步儀表板 (RUNNING) -->
                <div id="run-view" class="view-section">
                    <div class="massive-time" data-bind="massiveTime">00:00</div>
                    
                    <div class="run-primary-grid">
                        <!-- 巨大熱區 +/- (左右各佔 50%) -->
                        <div class="run-val-box">
                            <div class="hitbox-left" data-action="live-spd-down"></div>
                            <div class="hitbox-right" data-action="live-spd-up"></div>
                            <div class="run-big-val spd" id="runValSpd" data-bind="runSpd">0.0</div>
                            <div class="run-lbl" id="lblRunSpd"></div>
                        </div>
                        <div class="run-val-box">
                            <div class="hitbox-left" data-action="live-inc-down"></div>
                            <div class="hitbox-right" data-action="live-inc-up"></div>
                            <div class="run-big-val inc" id="runValInc" data-bind="runInc">0.0</div>
                            <div class="run-lbl" id="lblRunInc"></div>
                        </div>
                    </div>
                    
                    <div class="run-sec-grid">
                        <div class="r-s-box"><div class="r-s-val" data-bind="runDist">0.00</div><div class="r-s-lbl" id="lblRunDist"></div></div>
                        <div class="r-s-box"><div class="r-s-val" data-bind="runPace">--:--</div><div class="r-s-lbl" id="lblRunPace"></div></div>
                        <div class="r-s-box"><div class="r-s-val val-hr" data-bind="runHr">0</div><div class="r-s-lbl" id="lblRunHr"></div></div>
                        <div class="r-s-box"><div class="r-s-val val-lac" data-bind="runLac">0.0</div><div class="r-s-lbl" id="lblRunLac"></div></div>
                    </div>

// --- 2. 工具庫 (Utils) ---
const Utils = {
    fmtTime: (ms, showMs = false) => {
        let totS = Math.floor(ms / 1000); let h = Math.floor(totS / 3600); let m = Math.floor((totS % 3600) / 60); let s = totS % 60;
        let str = h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (showMs && h === 0) { let frac = Math.floor((ms % 1000) / 100); str += `.${frac}`; }
        return str;
    },
    getPaceStr: (speedKph, isMet) => {
        if (speedKph <= 0.1) return `--:-- /${isMet?'km':'mi'}`; 
        let speed = isMet ? speedKph : speedKph / 1.609344; let pace = 60 / speed; 
        if (pace >= 100) return `99:59 /${isMet?'km':'mi'}`; // 極端配速防破版
        let pM = Math.floor(pace); let pS = Math.floor((pace - pM) * 60);
        return `${String(pM).padStart(2,'0')}:${String(pS).padStart(2,'0')} /${isMet?'km':'mi'}`;
    },
    PRNG: { seed: Date.now(), get(lang, key, arr) { this.seed = (this.seed * 9301 + 49297) % 233280; return arr[Math.floor((this.seed / 233280) * arr.length)]; } },
    clamp: (val, min, max) => Math.max(min, Math.min(max, val))
};

// --- 3. 響應式狀態庫 (Proxy) ---
class ReactiveState {
    constructor(initial) {
        this.listeners = new Map();
        this.state = new Proxy(initial, {
            set: (target, key, value) => {
                if (target[key] !== value) { target[key] = value; if (this.listeners.has(key)) this.listeners.get(key).forEach(cb => cb(value, target)); }
                return true;
            }
        });
    }
    subscribe(key, cb) { if (!this.listeners.has(key)) this.listeners.set(key, new Set()); this.listeners.get(key).add(cb); }
    batch(updates) { Object.entries(updates).forEach(([k, v]) => this.state[k] = v); }
}

// --- 4. 運動科學引擎 (PhysioEngine - Karvonen / Delta-Merge) ---
class PhysioEngine {
    static sanitize(raw) {
        let m = { ...raw }; 
        // 體重最低 30kg (防卡路里崩壞)
        let wKG = Utils.clamp(m.weight || (m.gender === 'M' ? 70 : 55), 30, 200); 
        // SMM 最高不超過體重 60%
        let sKG = Utils.clamp(m.smm || 0, 0, wKG * 0.6); 
        let defBF = m.gender === 'M' ? 18 : 26;
        let bf = Utils.clamp(m.bf || (sKG > 0 ? Math.max(5, 100 - (sKG/wKG*100) - (m.gender==='M'?20:15)) : defBF), 3, 50);
        let smm = sKG || (wKG * (1 - bf/100) * (m.gender==='M'?0.45:0.38));
        
        // 心率處理 (Karvonen 支援)
        let mHR = m.customMHR || Math.max(130, 208 - 0.7 * (m.age||35)); // 下限 130
        let rHR = m.customRHR || null;
        if (rHR && rHR >= mHR) rHR = mHR - 40; // 防呆
        
        let ms = Math.max(1.0, m.maxSpd || 12.0);
        let vo2 = m.customVO2 || Math.min(80, Math.max(25, 3.5 + 0.2*(ms*16.67) + 0.9*(ms*16.67)*0.01)); 
        
        return { wKG, bf, smm, vo2, mHR, rHR, maxSpd: ms, minSpd: Math.max(0, m.minSpd||1.0), mxInc: Math.max(0, m.maxInc||5.0), mnInc: Math.max(0, m.minInc||0.0), tKm: Math.max(0.1, m.tKm||5.0), tTime: Math.max(10, m.tTime||60), age: Math.max(15, m.age||35), gender: m.gender, name: m.name, unit: m.unit, lang: m.lang, voiceOn: m.voiceOn, lastProg: m.lastProg || 2 };
    }

    // 支援 Delta-Merge：傳入 startIdx 與 offset
    static buildMatrix(p, pid, hw, startIdx = 0, sOffset = 0, iOffset = 0, currentHR = 75, currentLac = 1.0) {
        let T = Math.floor(p.tTime); let D = p.tKm; 
        let hwS = hw.maxSpd || 20.0; let hwI = hw.maxInc || 15.0;
        let safeMnS = Math.max(hw.minSpd, p.minSpd); let allowedMxS = Math.min(hwS, p.maxSpd); 
        let safeMnI = Math.max(hw.minInc, p.mnInc); let allowedMxI = Math.min(hwI, p.mxInc);
        
        let m = []; let bP = []; let iP = [];
        let bLenS = Math.max(1, Math.ceil(T / 20)); let bLenI = Math.max(1, Math.ceil(T / 10));

        // 產生基礎比例結構
        for(let i=0; i<T; i++) {
            let r=1; let ir=0;
            if(pid===4) { r=0.5; ir=0.5; }
            else if(pid===5||pid===6) { let wp=Math.floor(T*0.1); if(i<wp) r=i/wp; else if(i>T-wp) r=1-(i-(T-wp))/wp; }
            else if(pid===7) { r = i<T/2 ? i/(T/2) : 1-(i-T/2)/(T/2); ir=r; }
            else if(pid===8) { r = i%5===0?1:0; }
            else if(pid===9) { r = i/(T-1); }
            else if(pid===10) { r = Math.floor(i/2)%2===0?1:0; }
            if (pid >= 4 && i >= T * 0.9) { r = 1.0; ir = Math.max(ir, 0.8); }
            bP.push(r); iP.push(ir);
        }

        // 套用速度與坡度 (含 offset)
        for(let i=startIdx; i<T; i++) {
            let smoothR = bP[Math.floor(i / bLenS) * bLenS]; let smoothIR = iP[Math.floor(i / bLenI) * bLenI];
            m.push({ spd: safeMnS + (allowedMxS - safeMnS)*smoothR + sOffset, inc: safeMnI + (allowedMxI - safeMnI)*smoothIR + iOffset });
        }

        // 時間為王：取消時間自動延長，若超過里程則超過。
        
        let W = Math.max(2, Math.floor(T * 0.05)); let C = Math.max(2, Math.floor(T * 0.05)); let baseWalk = 4.0; 
        
        let RE = p.gender === 'F' ? 1.05 : 1.0; if(p.smm / p.wKG > (p.gender==='M' ? 0.4 : 0.35)) RE -= 0.05; 
        let cHR = currentHR; let cLac = currentLac;
        let lacThresh = p.vo2 > 60 ? 0.9 : 0.8; // 菁英抗酸延後

        for(let i=0; i<m.length; i++) {
            let actualI = startIdx + i;
            if (actualI < W) { let prog = actualI / W; m[i].spd = safeMnS + (m[W||0].spd - safeMnS) * prog; m[i].inc = Math.min(m[i].inc, 2.0); }
            if (actualI >= T - C && actualI < T - 1) { let prog = (actualI - (T - C)) / (C - 1); m[i].spd = m[T-C-startIdx].spd - (m[T-C-startIdx].spd - safeMnS) * prog; m[i].inc = m[T-C-startIdx].inc - (m[T-C-startIdx].inc - safeMnI) * prog; }
            if (actualI === T - 1) { m[i].spd = baseWalk; m[i].inc = 0.0; }
            
            // 絕對硬體極限 Clamp
            m[i].spd = Utils.clamp(m[i].spd, 0.1, hwS); m[i].inc = Utils.clamp(m[i].inc, hw.minInc, hwI);
            
            let r = (m[i].spd - safeMnS)/(hwS - safeMnS || 1);
            m[i].phase = actualI < W ? 'warmup' : actualI >= T-C ? 'cooldown' : r > 0.8 ? 'sprint' : m[i].inc > safeMnI + 2 ? 'steep' : 'recovery';

            let sm = m[i].spd * 16.6667; let id = m[i].inc / 100;
            let vo2D = (m[i].spd <= 7.0 ? (3.5 + 0.1*sm + 1.8*sm*id) : (3.5 + 0.2*sm + 0.9*sm*id)) * RE;
            if (actualI < W) vo2D *= 0.9; // 暖身期打9折
            
            // Karvonen / 田中 混和心率推算
            let tHR; let pHR;
            if (p.rHR) { // Karvonen
                let reserve = p.mHR - p.rHR; let targetPct = Math.min(1.0, vo2D / p.vo2);
                tHR = p.rHR + (reserve * targetPct);
                pHR = (cHR - p.rHR) / reserve;
            } else {
                tHR = Math.min(p.mHR, 60 + (vo2D / p.vo2) * (p.mHR - 60));
                pHR = cHR / p.mHR;
            }
            
            cHR += (tHR - cHR) * (m[i].phase === 'sprint' ? 0.6 : 0.3); 
            
            if(pHR < lacThresh - 0.05) cLac += (1.0 - cLac) * 0.2; else if(pHR < lacThresh + 0.05) cLac += (2.5 - cLac) * 0.1; else cLac += Math.exp(10 * (pHR - (lacThresh+0.05))) - 1; 
            
            let z = pHR < 0.6 ? 1 : (pHR < 0.7 ? 2 : (pHR < 0.8 ? 3 : (pHR < 0.9 ? 4 : 5)));
            m[i] = {...m[i], m:actualI+1, cal:(vo2D*p.wKG*5)/1000, dist:m[i].spd/60, hr:Math.round(cHR), lac:cLac, z};
        }
        return m;
    }
}

// --- 5. 語音引擎 (VoiceEngine) ---
class VoiceEngine {
    constructor() {
        this.synth = window.speechSynthesis; this.q = []; this.state = 'IDLE'; this.currPri = 0; this.timer = null; this.keepAlive = null;
        if(this.synth) this.synth.onvoiceschanged = () => { if(this.state === 'LOCKED') this.state = 'IDLE'; };
    }
    unlock() { 
        if(this.synth) { 
            let u = new SpeechSynthesisUtterance(''); u.volume = 0; this.synth.speak(u); 
            // 啟動 3 分鐘心跳保活
            clearInterval(this.keepAlive);
            this.keepAlive = setInterval(() => { if(this.state === 'IDLE' && AppState.state.runStatus === 'RUNNING') { let a = new SpeechSynthesisUtterance(' '); a.volume = 0; this.synth.speak(a); } }, 180000);
        } 
    }
    speak(key, pri = 0, args = null) {
        if (!this.synth || AppState.state.runStatus === 'PAUSED') return;
        let p = AppState.state.profiles[AppState.state.activeP]; if(!p || !p.voiceOn) return;
        let lang = p.lang || 'en'; let db = VoiceDB[lang]; if (!db) return;
        
        let txt = "";
        if (args && db[key]) txt = Utils.PRNG.get(lang, key, db[key]).replace('{s}', Number(args.s).toFixed(1)).replace('{i}', Number(args.i).toFixed(1));
        else if (db[key]) txt = Array.isArray(db[key]) ? Utils.PRNG.get(lang, key, db[key]) : db[key];

        if(!txt) return;
        if (pri > this.currPri) { this.synth.cancel(); this.q = []; clearTimeout(this.timer); this.state = 'IDLE'; } 
        else if (this.state === 'COOLDOWN' || pri < this.currPri) return;

        // 加入 0.5 秒喚醒緩衝 & timestamp 防過期
        this.q.push({ txt: `<speak><break time="500ms"/>${txt}</speak>`, raw: txt, pri, lang: lang === 'zh' ? 'zh-TW' : 'en-US', ts: Date.now() }); 
        this.q.sort((a,b) => b.pri - a.pri); this._process();
    }
    _process() {
        if (this.state !== 'IDLE' || this.q.length === 0) return;
        let job = this.q.shift();
        
        // 5秒 Stale Drop 機制
        if (Date.now() - job.ts > 5000) { this._process(); return; }

        this.state = 'SPEAKING'; this.currPri = job.pri;
        try {
            let msg = new SpeechSynthesisUtterance(job.raw); // fallback if SSML fails
            msg.lang = job.lang; msg.rate = 1.0;
            
            // 嘗試尋找優質語音
            let voices = this.synth.getVoices();
            if (voices.length > 0) {
                let v = voices.find(x => x.lang.includes(job.lang) && (x.name.includes('Siri') || x.name.includes('Google')));
                if(v) msg.voice = v;
            }

            let tid = setTimeout(() => { this.state = 'LOCKED'; this.synth.cancel(); this._finish(); }, 8000); 
            msg.onend = () => { clearTimeout(tid); this._finish(); };
            msg.onerror = () => { clearTimeout(tid); this._finish(); };
            this.synth.speak(msg);
        } catch(e) { this._finish(); }
    }
    _finish() {
        this.currPri = 0; this.state = 'COOLDOWN';
        this.timer = setTimeout(() => { this.state = 'IDLE'; this._process(); }, 15000);
    }
    clear() { this.q = []; this.currPri = 0; if (this.synth) this.synth.cancel(); clearTimeout(this.timer); this.state = 'IDLE'; }
}
const VoiceApp = new VoiceEngine();

// --- 6. IndexedDB 包裝器 (歷史紀錄 LRU) ---
const DB = {
    db: null,
    init: async () => {
        return new Promise((res, rej) => {
            let req = indexedDB.open('ProTreadmillDB', 1);
            req.onupgradeneeded = e => { let d = e.target.result; if(!d.objectStoreNames.contains('history')) d.createObjectStore('history', {keyPath: 'id', autoIncrement: true}); };
            req.onsuccess = e => { DB.db = e.target.result; res(); }; req.onerror = rej;
        });
    },
    saveHist: async (data) => {
        if(!DB.db) return;
        let tx = DB.db.transaction('history', 'readwrite'); let st = tx.objectStore('history');
        st.add(data);
        // LRU 100 筆限制
        st.getAllKeys().onsuccess = e => {
            let keys = e.target.result;
            if(keys.length > 100) { let dTx = DB.db.transaction('history', 'readwrite'); keys.slice(0, keys.length-100).forEach(k => dTx.objectStore('history').delete(k)); }
        };
    }
};

// --- 7. 背景不死 Web Worker (Blob inline) ---
const workerCode = `
    let timer = null; let last = 0; let running = false;
    self.onmessage = function(e) {
        if (e.data === 'START') {
            if(!running) { running = true; last = performance.now(); timer = setInterval(() => { let n = performance.now(); self.postMessage({dt: n - last}); last = n; }, 1000); }
        } else if (e.data === 'STOP') { running = false; clearInterval(timer); }
    };
`;
const blob = new Blob([workerCode], {type: 'application/javascript'});
const workerURL = URL.createObjectURL(blob);
const BgWorker = new Worker(workerURL);

class SwipeDial {
    constructor(id, isFloat, onChange) {
        this.scrollEl = document.getElementById(id); this.isFloat = isFloat; this.onChange = onChange; this.items = []; this.timer = null; this.locked = false;
        this.scrollEl.addEventListener('scroll', () => this.handleScroll(), {passive: true});
        
        // 混合點擊輸入 (Hybrid Dial)
        this.scrollEl.addEventListener('click', e => {
            if(this.locked) return; let t = e.target.closest('.dial-item.active'); if(!t) return;
            this.locked = true; this.scrollEl.classList.add('locked'); document.getElementById('dialInputLock').style.display = 'block';
            
            let inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'decimal'; inp.className = 'dial-input-overlay'; inp.value = t.dataset.val;
            document.body.appendChild(inp); inp.focus();

            const finish = () => {
                let v = parseFloat(inp.value); if(!isNaN(v)) { 
                    v = Utils.clamp(v, parseFloat(this.items[0].dataset.val), parseFloat(this.items[this.items.length-1].dataset.val));
                    this.setValue(v); this.onChange(v); 
                }
                inp.remove(); document.getElementById('dialInputLock').style.display = 'none';
                setTimeout(() => { this.locked = false; this.scrollEl.classList.remove('locked'); }, 300); // 等待鍵盤收合
            };
            inp.addEventListener('blur', finish); inp.addEventListener('keydown', ev => { if(ev.key === 'Enter') finish(); });
        });
    }
    build(min, max, step) {
        this.scrollEl.innerHTML = '<div class="dial-spacer"></div>'; this.items = [];
        for(let v=min; v<=max+0.0001; v+=step) {
            let d = document.createElement('div'); d.className = 'dial-item';
            let vs = this.isFloat ? Number(v).toFixed(1) : Math.round(v).toString(); d.dataset.val = vs; d.textContent = vs;
            this.scrollEl.appendChild(d); this.items.push(d);
        }
        this.scrollEl.insertAdjacentHTML('beforeend', '<div class="dial-spacer"></div>');
    }
    setValue(val) {
        if(this.items.length===0) return;
        let vs = this.isFloat ? Number(val).toFixed(1) : Math.round(val).toString();
        let target = this.items.find(i => i.dataset.val === vs) || this.items[0];
        let top = target.offsetTop - this.scrollEl.offsetTop - (this.scrollEl.clientHeight/2) + (target.clientHeight/2);
        this.scrollEl.scrollTo({top, behavior: 'instant'}); this.items.forEach(i => i.classList.remove('active')); target.classList.add('active');
    }
    handleScroll() {
        if(this.locked) return; clearTimeout(this.timer);
        this.timer = setTimeout(() => {
            if(this.items.length===0) return; let center = this.scrollEl.scrollTop + this.scrollEl.clientHeight/2;
            let closest = this.items.reduce((p, c) => Math.abs((c.offsetTop - this.scrollEl.offsetTop + c.clientHeight/2) - center) < Math.abs((p.offsetTop - this.scrollEl.offsetTop + p.clientHeight/2) - center) ? c : p);
            this.items.forEach(i => i.classList.remove('active')); closest.classList.add('active');
            this.onChange(parseFloat(closest.dataset.val));
        }, 50);
    }
}

class ChartManager {
    constructor() {
        this.ctxS = document.getElementById('sChart').getContext('2d', {alpha: false});
        this.ctxR = document.getElementById('rChart').getContext('2d', {alpha: false});
        this.rTimer = null;
        const RO = new ResizeObserver(() => { clearTimeout(this.rTimer); this.rTimer = setTimeout(() => { if(!document.querySelector('.dial-input-overlay')) this.drawAll(); }, 100); });
        RO.observe(document.getElementById('sChartWrap')); RO.observe(document.getElementById('rChartWrap'));
        this.bindEvents('s', document.getElementById('sChartWrap'));
    }
    drawAll() { this.draw('s', document.getElementById('sChart'), this.ctxS); this.draw('r', document.getElementById('rChart'), this.ctxR); }
    draw(prefix, c, ctx) {
        let m = AppState.state.matrix; if(!m.length || c.parentElement.clientWidth === 0) return;
        let dpr = window.devicePixelRatio || 1; c.width = c.parentElement.clientWidth * dpr; c.height = c.parentElement.clientHeight * dpr; ctx.scale(dpr, dpr);
        let W = c.width/dpr; let H = c.height/dpr; ctx.clearRect(0,0,W,H);
        
        let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial';
        let mxS = Math.max(10, AppState.state.hw.maxSpd * (isMet?1.1:1.1*1.609));
        
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
        [0.25, 0.5, 0.75].forEach(r => { ctx.beginPath(); ctx.moveTo(0, H*r); ctx.lineTo(W, H*r); ctx.stroke(); }); ctx.setLineDash([]);

        let getX = i => (i/(m.length-1))*W; let getY = (v, max, min=0) => H - ((v-min)/(max-min))*H;
        let totMs = m.length * 60000; let cr = (AppState.state.runStatus !== 'STOPPED' && prefix === 'r') ? AppState.state.accumMs/totMs : 1.0;

        let drawLine = (fn, col, w, isDash=false) => {
            ctx.beginPath(); ctx.moveTo(getX(0), fn(m[0])); for(let i=1; i<m.length; i++) ctx.lineTo(getX(i), fn(m[i]));
            ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; if(isDash) ctx.setLineDash([6,4]); else ctx.setLineDash([]); ctx.stroke();
        }
        
        let rBase = p.customRHR ? p.customRHR : 60;
        drawLine(r => getY(r.hr, p.customMHR || 220, rBase), 'rgba(10, 132, 255, 0.8)', 2); 
        drawLine(r => getY(r.lac, 18, 0), 'rgba(255, 69, 58, 0.9)', 2, true); // 乳酸改虛線
        drawLine(r => getY(r.inc, 15, 0), 'rgba(255, 214, 10, 0.8)', 2); 
        drawLine(r => getY(r.spd, mxS, 0), '#FFFFFF', 3); // 速度改純白
        
        if (cr < 1.0) { ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(W*cr, 0, W*(1-cr), H); }
    }
    bindEvents(px, wrap) {
        const move = e => {
            if(!AppState.state.matrix.length) return;
            let r = wrap.getBoundingClientRect(); let x = Utils.clamp((e.touches ? e.touches[0].clientX : e.clientX) - r.left, 0, r.width);
            let fIdx = (x / r.width) * (AppState.state.matrix.length - 1);
            let ch = document.getElementById(`${px}Crosshair`); if(ch) { ch.style.display = 'block'; ch.style.left = `${(fIdx/(AppState.state.matrix.length-1))*100}%`; }
            
            let cIdx = Math.min(Math.ceil(fIdx), AppState.state.matrix.length - 1); let f = Math.floor(fIdx); let frac = fIdx - f; let m = AppState.state.matrix;
            let iSpd = m[f].spd*(1-frac) + m[cIdx].spd*frac; let iInc = m[f].inc*(1-frac) + m[cIdx].inc*frac;
            
            let row = document.getElementById(px+'HovRow');
            if(row) { 
                row.classList.add('show'); let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial';
                Binder.updateBatch({ [`${px}HovMin`]: Utils.fmtTime(fIdx * 60000), [`${px}HovSpd`]: (isMet?iSpd:iSpd/1.609).toFixed(1), [`${px}HovInc`]: iInc.toFixed(1), [`${px}HovHr`]: Math.round(m[f].hr*(1-frac) + m[cIdx].hr*frac), [`${px}HovLac`]: (m[f].lac*(1-frac) + m[cIdx].lac*frac).toFixed(1) });
            }
        };
        const leave = () => { let ch=document.getElementById(`${px}Crosshair`); if(ch) ch.style.display='none'; let row=document.getElementById(`${px}HovRow`); if(row) row.classList.remove('show'); };
        wrap.addEventListener('mousemove', move); wrap.addEventListener('touchmove', move, {passive:true});
        wrap.addEventListener('mouseleave', leave); wrap.addEventListener('touchend', leave); wrap.addEventListener('touchcancel', leave);
    }
}

// --- 9. 主控制器 (AppController) ---
class AppController {
    constructor() {
        this.dials = {}; this.charts = new ChartManager(); this.holdTimer = null; this.liveDebounce = null;
        this.actualSpeed = 0; // 馬達物理模擬目前速度
        
        const setVH = () => document.documentElement.style.setProperty('--vh', `${(window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01}px`);
        if(window.visualViewport) window.visualViewport.addEventListener('resize', setVH); setVH();
        window.addEventListener('beforeunload', () => { if(AppState.state.runStatus === 'RUNNING') this.persistRun(); });

        DB.init().then(() => { this.initData(); this.initDials(); this.bindEvents(); this.setupSubscribers(); });
    }

    initData() {
        let s = null; try { s = JSON.parse(localStorage.getItem('pro_treadmill_v28')); } catch(e){}
        if(s && s.profiles) { AppState.batch({ activeP: s.activeP, profiles: s.profiles, hw: s.hw }); } 
        else { let p = PhysioEngine.sanitize({ name: 'Runner', gender: 'M', unit: 'metric', lang: 'zh', voiceOn: true }); AppState.batch({ activeP: 'Runner', profiles: { 'Runner': p } }); }
        
        let r = null; try { r = JSON.parse(sessionStorage.getItem('runState_v28')); } catch(e){} // Crash Recovery 採用 Session
        if(r && r.accumMs > 0 && r.matrix) { 
            AppState.batch({ runStatus: 'PAUSED', accumMs: r.accumMs, matrix: r.matrix, curData: r.curData, activeP: r.activeP, speedOffset: r.speedOffset||0, incOffset: r.incOffset||0 }); 
            NotificationManager.show(i18n[AppState.state.profiles[AppState.state.activeP].lang].warnCrash);
            this.updateI18n(); this.updateUI();
        } 
        else { this.updateI18n(); this.recalc(); }
    }

    initDials() {
        const change = (key, isSpd) => val => {
            if(AppState.state.runStatus !== 'STOPPED') return;
            let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial';
            p[key] = isSpd ? (isMet ? val : val * 1.609344) : val; this.saveData(); this.recalc();
        };
        this.dials.time = new SwipeDial('ds-time', false, change('tTime', false)); this.dials.dist = new SwipeDial('ds-dist', true, change('tKm', true));
        this.dials.mxs = new SwipeDial('ds-mxs', true, change('maxSpd', true)); this.dials.mns = new SwipeDial('ds-mns', true, change('minSpd', true));
        this.dials.mxi = new SwipeDial('ds-mxi', true, change('mxInc', false)); this.dials.mni = new SwipeDial('ds-mni', true, change('mnInc', false));
    }

    updateI18n() {
        let p = AppState.state.profiles[AppState.state.activeP]; let d = i18n[p.lang];
        document.getElementById('htmlRoot').lang = p.lang === 'zh' ? 'zh-TW' : 'en';
        document.getElementById('tabSettings').textContent = d.tab1; document.getElementById('tabMatrix').textContent = d.tab2;
        ['tim','km','mxS','mnS','mxI','mnI'].forEach(k => { let isMet = p.unit !== 'imperial'; let key = k; if(!isMet && (k==='mxS'||k==='mnS')) key += 'Imp'; document.getElementById(`lbl${k==='tim'?'TotalTime':k==='km'?'TargetKm':`Set${k.charAt(0).toUpperCase()+k.slice(1)}`}`).textContent = d[key]; });
        for(let i=1;i<=5;i++) { document.getElementById(`hudH${i}`).textContent = d[`hud${i}`]; document.getElementById(`hudRH${i}`).textContent = d[`hud${i}`]; }
        ['Avg','Max','RAvg','RMax'].forEach(k => document.getElementById(`lbl${k}`).textContent = d[k.toLowerCase().includes('avg')?'avg':'max']);
        ['Spd','Inc','Dist','Pace','Hr','Lac'].forEach(k => document.getElementById(`lblRun${k}`).textContent = d[`r${k}`]);
        document.getElementById('lblZoneTitle').textContent = d.zDist;
        ['Time','Spd','Inc','Phase','Hr'].forEach(k => document.getElementById(`th${k}`).textContent = d[`th${k}`]);
        ['BtnLeft','End','Pause'].forEach(k => document.getElementById(`lbl${k}`).textContent = d[`btn${k}`]);
        
        document.getElementById('lblRmTitle').textContent = d.rmTitle; document.getElementById('lblRmName').textContent = d.rmName; document.getElementById('lblRmPhysio').textContent = d.rmPhy;
        document.getElementById('lblAge').textContent = d.rmAge; document.getElementById('lblWgt').textContent = d.rmWgt; document.getElementById('lblAdvTitle').textContent = d.rmAdv;
        ['RHR','MHR','SMM','VO2','PMxS','PMnS','PMxI','PMnI'].forEach(k => document.getElementById(`lbl${k}`).textContent = d[`r${k.replace('P','')}`]);
        document.getElementById('lblHwTitle').textContent = d.hwTitle;
        ['MxS','MnS','MxI','MnI'].forEach(k => document.getElementById(`lblHw${k}`).textContent = d[`h${k}`]);
        document.getElementById('lblRmPref').textContent = d.rmPref; document.getElementById('btnRmCancel').textContent = d.btnCancel; document.getElementById('btnRmSave').textContent = d.btnSave;
    }

    bindEvents() {
        document.body.addEventListener('click', e => {
            const t = e.target.closest('[data-action]'); if (!t) return;
            const a = t.dataset.action; 
            
            if(a === 'tab-settings') AppState.state.activeTab = 'settings';
            else if(a === 'tab-matrix') AppState.state.activeTab = 'matrix';
            else if(a === 'close-notif') NotificationManager.hide();
            else if(a === 'select-prog' && AppState.state.runStatus === 'STOPPED') {
                document.querySelectorAll('.prog-card').forEach(c => c.classList.remove('selected')); t.classList.add('selected');
                AppState.state.profiles[AppState.state.activeP].lastProg = parseInt(t.dataset.pid); this.saveData(); this.recalc();
            }
            else if(a === 'start') {
                document.getElementById('silentAudio').play().catch(e=>{}); VoiceApp.unlock(); 
                if (AppState.state.runStatus === 'RUNNING') return;
                if (AppState.state.accumMs === 0) { 
                    AppState.state.curData = { ms:0, dist:0, cal:0, z: [0,0,0,0,0], trans:{} }; 
                    this.actualSpeed = AppState.state.matrix[0].spd; // 初始化物理馬達速度
                }
                AppState.state.runStatus = 'RUNNING'; AppState.state.activeTab = 'settings';
            }
            else if(a === 'pause') { AppState.state.runStatus = 'PAUSED'; this.persistRun(); }
            else if(a === 'open-runner') this.openModal();
            else if(a === 'close-runner') document.getElementById('runnerModal').classList.remove('show');
            else if(a === 'save-runner') this.saveModal();
            else if(a === 'overlay-close') { if(e.target.id === 'runnerModal') document.getElementById('runnerModal').classList.remove('show'); }
            else if(a === 'toggle-accordion') { t.classList.toggle('open'); document.getElementById(t.dataset.target).classList.toggle('show'); }
            
            // 即時微調 (Delta-Merge Trigger)
            else if(a.startsWith('live-') && AppState.state.runStatus === 'RUNNING') {
                let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial';
                let hw = AppState.state.hw;
                
                let isSpd = a.includes('spd'); let isUp = a.includes('up');
                let step = isSpd ? (isMet ? 0.1 : 0.1 * 1.60934) : 0.5;
                if(!isUp) step *= -1;
                
                let el = document.getElementById(`runVal${isSpd?'Spd':'Inc'}`);
                
                // 震動與視覺回饋
                if('vibrate' in navigator) navigator.vibrate(50);
                el.style.transform = 'scale(1.2)'; setTimeout(()=>el.style.transform = 'scale(1)', 100);
                
                if(isSpd) AppState.state.speedOffset += step; else AppState.state.incOffset += step;
                
                // 硬體極限防呆
                let cM = Math.floor(AppState.state.accumMs / 60000); let curM = AppState.state.matrix[cM];
                if (isSpd && (curM.spd + step > hw.maxSpd || curM.spd + step < Math.max(0.1, hw.minSpd))) {
                    AppState.state.speedOffset -= step; NotificationManager.show(i18n[p.lang].warnHw); el.style.color = 'var(--neon-red)'; setTimeout(()=>el.style.color='#FFF',500); return;
                }
                
                clearTimeout(this.liveDebounce);
                this.liveDebounce = setTimeout(() => {
                    let oldM = AppState.state.matrix;
                    let pastM = oldM.slice(0, cM + 1); // 保留歷史不可變
                    
                    // 重算未來
                    let pClean = PhysioEngine.sanitize(p);
                    let futureM = PhysioEngine.buildMatrix(pClean, pClean.lastProg, hw, cM + 1, AppState.state.speedOffset, AppState.state.incOffset, oldM[cM].hr, oldM[cM].lac);
                    
                    AppState.state.matrix = pastM.concat(futureM);
                    this.charts.drawAll(); // 重繪 Canvas
                    
                    // 語音回饋
                    VoiceApp.speak(`sys_${isSpd?'speed':'inc'}_${isUp?'up':'down'}`, 1);
                }, 300);
            }
        });

        // 長按結束 (防呆取消)
        const btnEnd = document.getElementById('btnAskEnd');
        const startHold = () => { if(AppState.state.runStatus === 'STOPPED') return; btnEnd.classList.add('holding'); this.holdTimer = setTimeout(() => { btnEnd.classList.remove('holding'); this.endWorkout(); }, 1500); };
        const stopHold = () => { btnEnd.classList.remove('holding'); clearTimeout(this.holdTimer); };
        btnEnd.addEventListener('pointerdown', startHold); btnEnd.addEventListener('pointerup', stopHold); btnEnd.addEventListener('pointerleave', stopHold);

        // Segmented Controls (包含單位換算)
        document.querySelectorAll('.segmented-control').forEach(c => {
            c.addEventListener('click', e => {
                let b = e.target.closest('.seg-btn'); if(!b) return;
                c.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active')); b.classList.add('active');
                c.querySelector('.seg-indicator').style.transform = `translateX(${Array.from(c.children).indexOf(b)-1}00%)`;
                if(c.id === 'segUnit') { 
                    let f = b.dataset.val === 'metric' ? 1/2.20462 : 2.20462; let sf = b.dataset.val === 'metric' ? 1.60934 : 1/1.60934;
                    ['rmWeight','rmSMM'].forEach(id => { let el=document.getElementById(id); if(el.value) el.value=(parseFloat(el.value)*f).toFixed(1).replace(/\.0+$/,''); });
                    ['rmMxS','rmMnS','hwMxS','hwMnS'].forEach(id => { let el=document.getElementById(id); if(el.value) el.value=(parseFloat(el.value)*sf).toFixed(1).replace(/\.0+$/,''); });
                    let lblM = b.dataset.val === 'metric' ? 'kg' : 'lbs'; document.getElementById('unitWgt').textContent = lblM; document.getElementById('unitSmm').textContent = lblM;
                    let lblS = b.dataset.val === 'metric' ? 'kph' : 'mph'; document.getElementById('unitMxS1').textContent = lblS; document.getElementById('unitMnS1').textContent = lblS; document.getElementById('unitMxS2').textContent = lblS; document.getElementById('unitMnS2').textContent = lblS;
                }
            });
        });
        
        BgWorker.onmessage = e => { if (AppState.state.runStatus === 'RUNNING') { this.logicTick(e.data.dt); } };
    }

    setupSubscribers() {
        AppState.subscribe('runStatus', s => {
            let R = s === 'RUNNING'; let S = s === 'STOPPED';
            document.getElementById('btnLeft').className = `btn-ctrl btn-runner ${!S ? 'btn-hide' : ''}`;
            document.getElementById('btnRight').className = `btn-ctrl btn-start ${R ? 'btn-hide' : ''}`;
            document.getElementById('btnPause').className = `btn-ctrl btn-pause ${!R ? 'btn-hide' : ''}`;
            document.getElementById('btnAskEnd').className = `btn-ctrl btn-end ${S ? 'btn-hide' : ''}`;
            let d = i18n[AppState.state.profiles[AppState.state.activeP].lang];
            document.getElementById('lblBtnRight').textContent = (s === 'PAUSED' && AppState.state.accumMs > 0) ? d.btnResume : d.btnStart;
            
            if (R) { 
                BgWorker.postMessage('START'); 
                if(AppState.state.accumMs > 0 && AppState.state.speedOffset !== 0) VoiceApp.speak('sys_resume', 2); // 中斷恢復語音
            } 
            else { BgWorker.postMessage('STOP'); VoiceApp.clear(); }
        });

        AppState.subscribe('activeTab', t => {
            let isS = t === 'settings';
            document.getElementById('tabSettings').classList.toggle('active', isS); document.getElementById('tabMatrix').classList.toggle('active', !isS);
            document.getElementById('tabIndicator').style.transform = isS ? 'translateX(0)' : 'translateX(100%)';
            document.getElementById('viewsSlider').style.transform = isS ? 'translateX(0)' : 'translateX(-50%)';
            if(!isS) { let r = document.getElementById(`min-row-${Math.floor(AppState.state.accumMs/60000)}`); if(r) r.scrollIntoView({behavior: 'instant', block: 'center'}); }
        });
    }

    logicTick(dt) {
        let m = AppState.state.matrix; let totMs = m.length * 60000; let ms = AppState.state.accumMs;
        if (ms >= totMs) { this.endWorkout(); return; }

        AppState.state.accumMs += dt; ms += dt;
        Binder.update('massiveTime', Utils.fmtTime(ms, true));

        let cM = Math.floor(ms/60000); let cS = ms%60000; let d = AppState.state.curData; let curM = m[cM]; let sr = dt/60000;
        
        // 物理馬達加速模擬 (Max 0.5 km/h per sec)
        let targetSpd = curM.spd; let maxDelta = 0.5 * (dt/1000);
        if (this.actualSpeed < targetSpd) this.actualSpeed = Math.min(targetSpd, this.actualSpeed + maxDelta);
        else if (this.actualSpeed > targetSpd) this.actualSpeed = Math.max(targetSpd, this.actualSpeed - maxDelta);
        
        d.dist += this.actualSpeed * sr; 
        // 卡路里基於實際速度重算
        let p = AppState.state.profiles[AppState.state.activeP];
        let RE = p.gender === 'F' ? 1.05 : 1.0; if(p.smm / p.wKG > (p.gender==='M' ? 0.4 : 0.35)) RE -= 0.05; 
        let sm = this.actualSpeed * 16.6667; let id = curM.inc / 100;
        let vo2D = (this.actualSpeed <= 7.0 ? (3.5 + 0.1*sm + 1.8*sm*id) : (3.5 + 0.2*sm + 0.9*sm*id)) * RE;
        if(cM < Math.max(2, Math.floor(m.length*0.05))) vo2D *= 0.9;
        d.cal += ((vo2D*p.wKG*5)/1000) * sr;

        let mHR = p.customMHR || (208 - 0.7 * p.age);
        let pHR = p.customRHR ? (curM.hr - p.customRHR) / (mHR - p.customRHR) : curM.hr / mHR;
        if(pHR<0.6) d.z[0]+=sr; else if(pHR<0.7) d.z[1]+=sr; else if(pHR<0.8) d.z[2]+=sr; else if(pHR<0.9) d.z[3]+=sr; else d.z[4]+=sr;

        let isMet = p.unit !== 'imperial';
        Binder.updateBatch({ runDist: (isMet?d.dist:d.dist/1.609).toFixed(2), runCal: `${Math.floor(d.cal)} kcal`, runSpd: (isMet?targetSpd:targetSpd/1.609).toFixed(1), runInc: curM.inc.toFixed(1), runHr: curM.hr, runLac: curM.lac.toFixed(1), runPace: Utils.getPaceStr(this.actualSpeed, isMet) });
        
        let tM = Math.max(1, cM + 1); [1,2,3,4,5].forEach(i => document.getElementById(`sz${i}`).style.flexBasis = `${(d.z[i-1]/tM)*100}%`);
        
        if (Math.floor(ms/5000) !== Math.floor((ms-dt)/5000)) this.persistRun(); // 每 5 秒備份
        if (Math.floor(ms/1000) !== Math.floor((ms-dt)/1000)) this.charts.drawAll(); // 每 1 秒重繪

        // 語音排程
        if(!d.trans[cM]) d.trans[cM] = { t: false, p: false };
        if(cS > 45000 && cM < m.length-1 && !d.trans[cM].t) {
            d.trans[cM].t = true; let n = m[cM+1];
            if(n.phase !== curM.phase || Math.abs(n.spd-curM.spd)>0.2 || Math.abs(n.inc-curM.inc)>=1.0) VoiceApp.speak('trans', 1, { s: isMet?n.spd:n.spd/1.609, i: n.inc });
        }
        if(cS > 20000 && !d.trans[cM].p) {
            d.trans[cM].p = true; 
            if(curM.phase === 'sprint' || curM.phase === 'exhaust') VoiceApp.speak(pHR > 0.9 ? 'val_high' : 'phy_ana', 0);
            else if(curM.phase === 'steep') VoiceApp.speak('bio_steep', 0);
            else if(curM.phase === 'recovery' || curM.phase === 'cooldown') VoiceApp.speak('val_rec', 0);
            else if(curM.phase === 'warmup') VoiceApp.speak('phy_warm', 0);
            else VoiceApp.speak(pHR > 0.8 ? 'val_mid' : 'val_low', 0);
        }
    }

    recalc() {
        let p = PhysioEngine.sanitize(AppState.state.profiles[AppState.state.activeP]);
        AppState.state.matrix = PhysioEngine.buildMatrix(p, p.lastProg, AppState.state.hw);
        AppState.state.speedOffset = 0; AppState.state.incOffset = 0;
        this.updateUI();
    }

    updateUI() {
        let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial'; let d = i18n[p.lang];
        this.dials.time.build(10, 180, 5); this.dials.time.setValue(p.tTime);
        this.dials.dist.build(isMet?0.5:0.3, isMet?50.0:31.0, isMet?0.5:0.1); this.dials.dist.setValue(isMet ? p.tKm : p.tKm / 1.60934);
        this.dials.mxs.build(isMet?1.0:0.6, isMet?25.0:15.5, 0.1); this.dials.mxs.setValue(isMet ? p.maxSpd : p.maxSpd / 1.60934);
        this.dials.mns.build(0.0, isMet?20.0:12.4, 0.1); this.dials.mns.setValue(isMet ? p.minSpd : p.minSpd / 1.60934);
        this.dials.mxi.build(0.0, 20.0, 0.1); this.dials.mxi.setValue(p.mxInc);
        this.dials.mni.build(0.0, 10.0, 0.1); this.dials.mni.setValue(p.mnInc);

        let ul = document.getElementById('previewList'); ul.innerHTML = ''; let m = AppState.state.matrix;
        let vdb = d.phases;
        m.forEach((r, i) => {
            let li = document.createElement('li'); li.id = `min-row-${i}`; 
            li.innerHTML = `<span class="list-col-time">${Utils.fmtTime(i*60000)}</span><span class="list-col-spd">${(isMet?r.spd:r.spd/1.609).toFixed(1)}</span><span class="list-col-inc">${r.inc.toFixed(1)}%</span><span class="list-col-phase">${vdb[r.phase]||r.phase}</span><span class="list-col-hr">${r.hr}</span>`;
            ul.appendChild(li);
        });

        document.getElementById('lblBtnLeft').textContent = AppState.state.activeP.substring(0,8);
        
        let pg = document.getElementById('progGrid'); pg.innerHTML = '';
        for(let i=1; i<=10; i++) {
            let btn = document.createElement('div'); btn.className = `prog-card ${p.lastProg===i?'selected':''}`; btn.dataset.action = 'select-prog'; btn.dataset.pid = i;
            btn.innerHTML = `<div class="p-title">${d.prog[`p${i}`][0]}</div><div class="p-desc">${d.prog[`p${i}`][1]}</div>`; pg.appendChild(btn);
            if(p.lastProg===i) setTimeout(() => btn.scrollIntoView({behavior: 'instant', inline: 'center', block: 'nearest'}), 100);
        }
        
        let aS=m.reduce((s,x)=>s+x.spd,0)/m.length, aI=m.reduce((s,x)=>s+x.inc,0)/m.length, aH=m.reduce((s,x)=>s+x.hr,0)/m.length, aL=m.reduce((s,x)=>s+x.lac,0)/m.length;
        Binder.updateBatch({ sAvgSpd: (isMet?aS:aS/1.609).toFixed(1), sAvgInc: aI.toFixed(1), sAvgHr: Math.round(aH), sAvgLac: aL.toFixed(1),
            sMaxSpd: (isMet?Math.max(...m.map(x=>x.spd)):Math.max(...m.map(x=>x.spd))/1.609).toFixed(1), sMaxInc: Math.max(...m.map(x=>x.inc)).toFixed(1), sMaxHr: Math.max(...m.map(x=>x.hr)), sMaxLac: Math.max(...m.map(x=>x.lac)).toFixed(1) });
        
        this.charts.drawAll();
    }

    openModal() {
        let p = AppState.state.profiles[AppState.state.activeP]; let isMet = p.unit !== 'imperial'; let hw = AppState.state.hw;
        const setV = (id, v) => document.getElementById(id).value = (v!==null&&v!==undefined) ? Number(v).toFixed(1).replace(/\.0+$/,'') : '';
        document.getElementById('rmName').value = AppState.state.activeP;
        setV('rmAge', p.age); setV('rmWeight', isMet?p.weight:p.weight*2.20462); setV('rmSMM', isMet?p.smm:p.smm*2.20462); 
        setV('rmRHR', p.customRHR); setV('rmMHR', p.customMHR); setV('rmVO2', p.customVO2);
        setV('rmMxS', isMet?p.maxSpd:p.maxSpd/1.60934); setV('rmMnS', isMet?p.minSpd:p.minSpd/1.60934); setV('rmMxI', p.mxInc); setV('rmMnI', p.mnInc);
        setV('hwMxS', isMet?hw.maxSpd:hw.maxSpd/1.60934); setV('hwMnS', isMet?hw.minSpd:hw.minSpd/1.60934); setV('hwMxI', hw.maxInc); setV('hwMnI', hw.minInc);
        
        const setS = (id, v) => { let c=document.getElementById(id); c.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); let b=c.querySelector(`[data-val="${v}"]`); if(b) { b.classList.add('active'); c.querySelector('.seg-indicator').style.transform=`translateX(${Array.from(c.children).indexOf(b)-1}00%)`; } };
        setS('segLang', p.lang||'zh'); setS('segVoice', p.voiceOn?'on':'off'); setS('segUnit', p.unit); setS('segSex', p.gender);
        
        let lblM = isMet ? 'kg' : 'lbs'; document.getElementById('unitWgt').textContent = lblM; document.getElementById('unitSmm').textContent = lblM;
        let lblS = isMet ? 'kph' : 'mph'; document.getElementById('unitMxS1').textContent = lblS; document.getElementById('unitMnS1').textContent = lblS; document.getElementById('unitMxS2').textContent = lblS; document.getElementById('unitMnS2').textContent = lblS;

        document.getElementById('runnerModal').classList.add('show');
    }

    saveModal() {
        let name = document.getElementById('rmName').value.trim() || 'Runner'; let isMet = document.querySelector('#segUnit .seg-btn.active').dataset.val === 'metric';
        let p = { name, gender: document.querySelector('#segSex .seg-btn.active').dataset.val, unit: isMet?'metric':'imperial', lang: document.querySelector('#segLang .seg-btn.active').dataset.val, voiceOn: document.querySelector('#segVoice .seg-btn.active').dataset.val==='on', age: parseFloat(document.getElementById('rmAge').value)||35, tTime: AppState.state.profiles[AppState.state.activeP].tTime, tKm: AppState.state.profiles[AppState.state.activeP].tKm, lastProg: AppState.state.profiles[AppState.state.activeP].lastProg };
        
        const getV = (id, f) => (parseFloat(document.getElementById(id).value)||0)*f;
        p.weight = getV('rmWeight', isMet?1:1/2.20462); p.smm = getV('rmSMM', isMet?1:1/2.20462); 
        p.customRHR = parseFloat(document.getElementById('rmRHR').value) || null; p.customMHR = parseFloat(document.getElementById('rmMHR').value) || null; p.customVO2 = parseFloat(document.getElementById('rmVO2').value) || null;
        p.maxSpd = getV('rmMxS', isMet?1:1.60934); p.minSpd = getV('rmMnS', isMet?1:1.60934); p.mxInc = parseFloat(document.getElementById('rmMxI').value)||0; p.mnInc = parseFloat(document.getElementById('rmMnI').value)||0;
        
        if (p.maxSpd < p.minSpd) { let tmp = p.maxSpd; p.maxSpd = p.minSpd; p.minSpd = tmp; } // 防呆

        AppState.state.hw.maxSpd = getV('hwMxS', isMet?1:1.60934); AppState.state.hw.minSpd = getV('hwMnS', isMet?1:1.60934); AppState.state.hw.maxInc = parseFloat(document.getElementById('hwMxI').value)||15; AppState.state.hw.minInc = parseFloat(document.getElementById('hwMnI').value)||0;
        
        if (name !== AppState.state.activeP) { delete AppState.state.profiles[AppState.state.activeP]; AppState.state.activeP = name; }
        AppState.state.profiles[name] = p; this.saveData(); 
        
        // 若在暫停時修改，觸發未來重算
        if (AppState.state.runStatus === 'PAUSED') {
            let cM = Math.floor(AppState.state.accumMs / 60000); let oldM = AppState.state.matrix;
            let pastM = oldM.slice(0, cM + 1); let pClean = PhysioEngine.sanitize(p);
            let futureM = PhysioEngine.buildMatrix(pClean, pClean.lastProg, AppState.state.hw, cM + 1, AppState.state.speedOffset, AppState.state.incOffset, oldM[cM].hr, oldM[cM].lac);
            AppState.state.matrix = pastM.concat(futureM); this.updateI18n(); this.charts.drawAll();
        } else { this.updateI18n(); this.recalc(); }
        
        document.getElementById('runnerModal').classList.remove('show');
        NotificationManager.show(i18n[p.lang].warnSave);
        if(!p.voiceOn) VoiceApp.clear();
    }

    saveData() { try { localStorage.setItem('pro_treadmill_v28', JSON.stringify({ activeP: AppState.state.activeP, profiles: AppState.state.profiles, hw: AppState.state.hw })); } catch(e){} }
    persistRun() { if (AppState.state.accumMs > 0) sessionStorage.setItem('runState_v28', JSON.stringify({ activeP: AppState.state.activeP, accumMs: AppState.state.accumMs, matrix: AppState.state.matrix, curData: AppState.state.curData, speedOffset: AppState.state.speedOffset, incOffset: AppState.state.incOffset })); else sessionStorage.removeItem('runState_v28'); }
    
    endWorkout() {
        let d = AppState.state.curData;
        if(d && d.ms >= 10000) DB.saveHist({ date: new Date().getTime(), ms: d.ms, distKm: d.dist, cal: d.cal, avgSpdKm: d.dist/(d.ms/3600000), z: d.z, profile: AppState.state.activeP });
        AppState.state.runStatus = 'STOPPED'; AppState.state.accumMs = 0; AppState.state.curData = null; AppState.state.activeTab = 'settings';
        sessionStorage.removeItem('runState_v28'); this.recalc(); document.getElementById('silentAudio').pause();
    }
}

document.addEventListener('DOMContentLoaded', () => window.App = new AppController());
</script>
</body>
</html>
