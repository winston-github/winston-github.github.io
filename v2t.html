<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旗艦雙語注音即時翻譯系統</title>
    <style>
        /* ==========================================
           1. 現代隱性骨架與動態視窗防禦
           ========================================== */
        :root {
            --bg-color1: #0f172a; 
            --bg-color2: #1e293b; 
            --text-main: #f8fafc;
            --text-zhuyin: #e2e8f0; 
            --tone-color: #38bdf8;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --trans-color: #7dd3fc; 
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color1);
            background-image: radial-gradient(circle at center, var(--bg-color1) 0%, var(--bg-color2) 100%);
            color: var(--text-main); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            height: 100dvh; min-height: 100dvh; max-height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; overscroll-behavior: none;
        }

        #tagBanner {
            width: 100%; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: flex-start; gap: 12px;
            padding: 12px 20px; min-height: 60px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 20; overflow-x: auto;
        }
        #tagBanner::-webkit-scrollbar { display: none; }
        
        .circle-tag {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: bold; color: #fff; cursor: pointer;
            border: 2px solid; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            animation: popIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); user-select: none;
        }
        .circle-tag:active { transform: scale(0.85); }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        #displayContainer {
            flex: 1 1 auto; width: 100%; max-width: 1400px; overflow-y: auto; overflow-x: hidden; padding: 24px;
            overscroll-behavior-y: contain; display: block; scroll-behavior: smooth;
        }
        #displayContainer::-webkit-scrollbar { width: 8px; }
        #displayContainer::-webkit-scrollbar-track { background: transparent; }
        #displayContainer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        #linesContainer { display: flex; flex-direction: column; width: 100%; gap: 20px; padding-bottom: 20px;}

        .speech-line-wrapper {
            position: relative; display: grid; grid-template-rows: 0fr; opacity: 0;
            transition: grid-template-rows 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease, margin 0.4s ease;
        }
        .speech-line-wrapper.active { grid-template-rows: 1fr; opacity: 1; }
        .speech-line-wrapper.deleting { grid-template-rows: 0fr; opacity: 0; margin-bottom: -20px; }
        .speech-line-inner { overflow: visible; position: relative; }

        .swipe-actions-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 24px;
            display: flex; justify-content: space-between; overflow: hidden; z-index: 1;
        }
        .swipe-btn {
            width: 80px; height: 100%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: filter 0.2s;
        }
        .swipe-btn.tag { background: var(--success-color); }
        .swipe-btn.delete { background: var(--danger-color); }
        .swipe-btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        .speech-line {
            display: flex; flex-direction: column; position: relative; z-index: 2;
            width: 100%; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.06);
            background: #182e46; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s, box-shadow 0.4s;
            padding: 24px 28px; box-sizing: border-box; touch-action: pan-y; gap: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }
        .speech-line-wrapper:nth-child(even) .speech-line { background: #111e30; }
        .speech-line-wrapper.is-empty .swipe-actions-bg,
        .speech-line-wrapper.is-empty .desktop-action { display: none !important; }

        .desktop-action { position: absolute; top: 12px; opacity: 0; cursor: pointer; color: #94a3b8; transition: all 0.2s; z-index: 10; }
        .desktop-action.left { left: 16px; } .desktop-action.right { right: 16px; }
        .desktop-action:hover { transform: scale(1.1); }
        .desktop-action.left:hover { color: var(--success-color); } .desktop-action.right:hover { color: var(--danger-color); }
        .desktop-action svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;}
        
        @media (hover: hover) and (pointer: fine) {
            .speech-line:hover .desktop-action { opacity: 0.6; }
            .speech-line-wrapper.is-empty .speech-line:hover .desktop-action { opacity: 0; }
        }

        /* ==========================================
           2. 真實零閃爍物理對調圖層 (True Swap UI)
           ========================================== */
        .text-layer { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; width: 100%; cursor: pointer; user-select: text; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .source-layer { order: 1; border-top: none; padding-top: 0; margin-top: 0; min-height: 4.8rem; }
        .target-layer { order: 2; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 14px; margin-top: 14px; opacity: 0; display: none; }
        .target-layer.show { opacity: 1; display: flex; }
        
        .speech-line.is-flipped .source-layer { order: 2; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 14px; margin-top: 14px; min-height: unset; }
        .speech-line.is-flipped .target-layer { order: 1; border-top: none; padding-top: 0; margin-top: 0; min-height: 4.8rem; }

        @keyframes softPulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .trans-loading { font-size: 1.2rem; color: #94a3b8; animation: softPulse 1.5s infinite; font-weight: normal; margin-top: 14px; }
        .final-anchor, .interim-anchor { display: contents; }

        /* --- 字體與注音/Ruby 動態尺寸控制 --- */
        .ruby-container { display: inline-flex; align-items: center; font-family: "標楷體", "DFKai-SB", 'Microsoft JhengHei', serif; transition: all 0.4s ease; }
        .ruby-char { line-height: 1.05; text-shadow: 0 0 15px rgba(255,255,255,0.2); position: relative; transition: all 0.4s ease; }
        .ruby-zhuyin { display: inline-flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin-left: 6px; padding-right: 0.8em; user-select: none; transition: all 0.4s ease; }
        .zhuyin-col { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .zhuyin-symbol { font-size: 1.45rem; line-height: 1.05; color: var(--text-zhuyin); font-weight: 800; text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); font-family: 'Microsoft JhengHei', sans-serif;}
        .tone-light { position: absolute; top: -1.2rem; left: calc(50% - 0.4em); transform: translateX(-50%); font-size: 1.35rem; color: var(--tone-color); z-index: 3;}
        .tone-mark { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 1.35rem; color: var(--tone-color); z-index: 3; }

        .ruby-container.is-interim { opacity: 0.65; transform: scale(0.96); }
        .ruby-container.is-interim .ruby-char { color: #94a3b8; text-shadow: none; }
        .ruby-container.is-interim .zhuyin-symbol { color: #cbd5e1; }
        
        .ruby-container.is-english .ruby-char { color: #fcd34d; padding: 0 6px; letter-spacing: 1px; font-family: 'Microsoft JhengHei', sans-serif; white-space: pre-wrap; line-height: 1.2;}
        .ruby-container.is-foreign .ruby-char { color: #f8fafc; padding: 0 6px; font-family: -apple-system, sans-serif; white-space: pre-wrap; line-height: 1.2;}
        .ruby-container.is-punctuation .ruby-char { color: #64748b; padding: 0 4px; line-height: 1.2;}

        ruby.jp-ruby { ruby-align: center; }
        rt.jp-furi { font-size: 1rem; color: #fcd34d; user-select: none; font-weight: normal; font-family: 'Noto Sans TC', sans-serif; transition: all 0.4s ease;}
        .jp-kanji { line-height: 1.2; font-weight: bold; transition: all 0.4s ease;}

        /* --- 外語 Ruby 引擎專屬樣式 (加入 !important 奪回顯示權重) --- */
        .silent { opacity: 0.3 !important; font-weight: 300 !important; transition: all 0.4s ease; }
        .liaison { color: #8e44ad !important; font-weight: bold !important; margin: 0 -2px; }
        .stress { color: #e74c3c !important; font-weight: bold !important; }
        
        /* 嚴格控制 rt 不要用 block，會打破排版！ */
        .ruby-char ruby rt { font-size: 0.4em; color: var(--tone-color) !important; padding-bottom: 4px; font-family: "Courier New", monospace; transition: all 0.4s ease; display: ruby-text; }

        /* ==========================================
           圖層翻轉系統詳細字體規則 (極致順滑防破版)
           ========================================== */
        /* 預設: 來源大 (有注音)，目標小 (隱藏注音) */
        .source-layer .ruby-char, .source-layer .jp-kanji { font-size: 3.2rem; font-weight: bold; color: var(--text-main); }
        .source-layer .ruby-container { margin-right: 22px; margin-bottom: 8px; }
        .source-layer .ruby-container.is-english { margin-right: 12px; }
        
        .target-layer .ruby-char, .target-layer .jp-kanji { font-size: 1.65rem; color: var(--trans-color); font-weight: 500;}
        .target-layer .ruby-zhuyin, .target-layer rt, .target-layer .jp-furi { opacity: 0; font-size: 0; display: none; }
        .target-layer .ruby-container { margin-right: 6px; margin-bottom: 0; }

        /* 翻轉後: 來源縮小 (隱藏注音)，目標放大 (顯示注音) */
        .speech-line.is-flipped .source-layer .ruby-char, .speech-line.is-flipped .source-layer .jp-kanji { font-size: 1.65rem; color: var(--trans-color); font-weight: 500;}
        .speech-line.is-flipped .source-layer .ruby-zhuyin, .speech-line.is-flipped .source-layer rt, .speech-line.is-flipped .source-layer .jp-furi { opacity: 0; font-size: 0; display: none; }
        .speech-line.is-flipped .source-layer .ruby-container { margin-right: 6px; margin-bottom: 0; }
        
        .speech-line.is-flipped .target-layer .ruby-char, .speech-line.is-flipped .target-layer .jp-kanji { font-size: 3.2rem; color: var(--text-main); font-weight: bold;}
        .speech-line.is-flipped .target-layer .ruby-zhuyin { opacity: 1; font-size: unset; display: inline-flex; }
        /* 恢復 rt 的預設排版，絕對不能用 block */
        .speech-line.is-flipped .target-layer rt, .speech-line.is-flipped .target-layer .jp-furi { opacity: 1; display: ruby-text; }
        .speech-line.is-flipped .target-layer .ruby-container { margin-right: 22px; margin-bottom: 8px; }
        .speech-line.is-flipped .target-layer .ruby-container.is-english { margin-right: 12px; }

        /* ==========================================
           5. 控制面板
           ========================================== */
        #controlPanel {
            flex-shrink: 0; width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 18px;
            padding: 22px 28px calc(22px + env(safe-area-inset-bottom)); background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 36px 36px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 10;
        }
        .lang-switcher { display: flex; justify-content: center; align-items: center; gap: 16px; width: 100%; }
        .lang-switcher select { 
            background: rgba(15, 23, 42, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 12px 16px; border-radius: 14px; outline: none; font-weight: bold; font-size: 1.05rem;
            flex: 1; max-width: 220px; text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            appearance: none; -webkit-appearance: none; cursor: pointer; transition: border-color 0.3s;
        }
        .lang-switcher select:focus { border-color: var(--tone-color); }
        .dir-btn {
            background: linear-gradient(135deg, #475569, #334155); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0;
        }
        .dir-btn:active { transform: scale(0.85); }
        .dir-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s ease;}
        
        .btn-group { display: flex; gap: 16px; width: 100%; }
        .magic-btn {
            flex: 1; padding: 18px 10px; font-size: 1.25rem; font-weight: 700; border: none; border-radius: 20px; cursor: pointer; color: #ffffff;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s ease; box-shadow: 0 6px 15px rgba(0,0,0,0.2); letter-spacing: 1px;
        }
        .magic-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .magic-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        body.state-listening .btn-primary { 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 15px rgba(239, 68, 68, 0.4); 
            border: 1px solid rgba(239, 68, 68, 0.8); animation: recordGlow 2s infinite alternate; 
        }
        @keyframes recordGlow { 0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); } 100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9), inset 0 0 15px rgba(239, 68, 68, 0.6); } }
        .btn-secondary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-danger { background: linear-gradient(135deg, #64748b, #475569); }

        .btn-text-short { display: none; }
        
        @media (max-width: 768px) {
            .btn-text-full { display: none; } .btn-text-short { display: inline; }
            #tagBanner { padding: 10px 16px; min-height: 54px; gap: 10px; }
            .circle-tag { width: 36px; height: 36px; font-size: 1.1rem; }
            #displayContainer { padding: 16px; } #linesContainer { gap: 14px; }
            .speech-line { padding: 18px 20px; border-radius: 20px;}
            
            .ruby-container { margin-right: 14px; margin-bottom: 6px; }
            .ruby-zhuyin { margin-left: 4px; padding-right: 0.6em; }
            .zhuyin-symbol { font-size: 1.15rem; }
            .tone-light { top: -1rem; font-size: 1.05rem;} .tone-mark { font-size: 1.05rem;}
            
            .source-layer .ruby-char, .source-layer .jp-kanji { font-size: 3.2rem; }
            .source-layer .ruby-container.is-english .ruby-char, .source-layer .ruby-container.is-foreign .ruby-char, .source-layer .ruby-container.is-punctuation .ruby-char { font-size: 2.6rem; }
            .target-layer .ruby-char, .target-layer .jp-kanji { font-size: 1.35rem; }
            
            .speech-line.is-flipped .source-layer .ruby-char, .speech-line.is-flipped .source-layer .jp-kanji { font-size: 1.35rem; }
            .speech-line.is-flipped .target-layer .ruby-char, .speech-line.is-flipped .target-layer .jp-kanji { font-size: 3.2rem; }
            .speech-line.is-flipped .target-layer .ruby-container.is-english .ruby-char, .speech-line.is-flipped .target-layer .ruby-container.is-foreign .ruby-char, .speech-line.is-flipped .target-layer .ruby-container.is-punctuation .ruby-char { font-size: 2.6rem; }
            
            .ruby-container.is-english, .ruby-container.is-punctuation { margin-right: 6px; }
            rt.jp-furi { font-size: 0.85rem; }
            
            #controlPanel { padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); gap: 14px; border-radius: 28px 28px 0 0;}
            .lang-switcher select { font-size: 0.95rem; padding: 10px 8px; max-width: 150px;}
            .dir-btn { width: 42px; height: 42px; }
            .magic-btn { padding: 14px 6px; font-size: 1.1rem; border-radius: 16px;}
            .magic-btn svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<div id="tagBanner"></div>

<div id="displayContainer">
    <div id="linesContainer"></div>
</div>

<div id="controlPanel">
    <!-- 語言標籤純粹化：僅保留原生母語稱呼 -->
    <div class="lang-switcher">
        <select id="langA">
            <option value="zh-TW">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="ru">Русский</option>
            <option value="fr">Français</option>
        </select>
        <button id="btn-dir" class="dir-btn" onclick="ControlSystem.toggleDirection()" title="實體對調語言">
            <svg viewBox="0 0 24 24"><path d="M7 10h14l-4-4"/><path d="M17 14H3l4 4"/></svg>
        </button>
        <select id="langB">
            <option value="zh-TW">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="ru">Русский</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="btn-group">
        <button id="btn-mic" class="magic-btn btn-primary" onclick="ControlSystem.toggleMic()">
            <svg id="icon-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            <span id="text-mic" class="btn-text-full">開始錄音</span>
            <span id="text-mic-short" class="btn-text-short">開始</span>
        </button>
        <button id="btn-copy" class="magic-btn btn-secondary" onclick="ControlSystem.copyText()">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="btn-text-full">複製對照</span>
            <span class="btn-text-short">複製</span>
        </button>
        <button id="btn-clear" class="magic-btn btn-danger" onclick="ControlSystem.clearSystem()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span class="btn-text-full">清空畫面</span>
            <span class="btn-text-short">清空</span>
        </button>
    </div>
</div>

<script>
// ==========================================
// 1. 字典設定與精準發音覆寫掛載機制 (完全還原保留並縮編)
// ==========================================
let currentMaxPhraseLen = 6;
const PHRASE_BPMF_DICT = { "媽媽": "ㄇㄚ,ㄇㄚ˙", "爸爸": "ㄅㄚˋ,ㄅㄚ˙", "奶奶": "ㄋㄞˇ,ㄋㄞ˙" };
const TAIWAN_COMMON_CHARS = { "業": "ㄧㄝˋ", "子": "ㄗˇ", "色": "ㄙㄜˋ" };
const BOPOMOFO_COMPRESSED_DICT = { "ㄅㄚ": "八巴吧叭疤笆芭粑扒峇捌", "ㄅㄚˊ": "拔跋鈸菝鼥", "ㄅㄚˇ": "把靶" };

const charToBpmfCache = {};
for (const [bpmf, chars] of Object.entries(BOPOMOFO_COMPRESSED_DICT)) {
    for (let char of chars) if (!charToBpmfCache[char]) charToBpmfCache[char] = bpmf;
}
for (const [char, bpmf] of Object.entries(TAIWAN_COMMON_CHARS)) { charToBpmfCache[char] = bpmf; }

(async function initExternalDict() {
    try {
        const response = await fetch("https://raw.githubusercontent.com/kemdict/kemdict-data-ministry-of-education/main/dict_mini.json");
        if (!response.ok) return;
        const data = await response.json();
        const processEntry = (word, bpmf) => {
            if (!word || !bpmf || typeof word !== 'string') return;
            let cleanBpmf = Array.isArray(bpmf) ? bpmf.join(',') : bpmf.replace(/（[^）]*）|\([^)]*\)|<[^>]+>/g, '').trim().split(/[\s　_]+/).filter(s => s).join(',');
            if (!cleanBpmf || cleanBpmf.split(',').length !== word.length) return;
            if (!PHRASE_BPMF_DICT[word]) PHRASE_BPMF_DICT[word] = cleanBpmf;
            if (word.length > currentMaxPhraseLen) currentMaxPhraseLen = word.length;
        };
        if (Array.isArray(data)) data.forEach(item => {
            if (Array.isArray(item) && item.length >= 2) processEntry(item[0], item[1]);
            else if (typeof item === 'object' && item !== null) {
                let w = item['title'] || item['word'] || item['t'] || item['字詞'];
                let b = item['bopomofo'] || item['bpmf'] || item['pinyin'] || item['p'] || item['注音'];
                if (!b && item['heteronyms'] && item['heteronyms'][0]) b = item['heteronyms'][0]['bopomofo'];
                if (w && b) processEntry(w, b);
            }
        });
    } catch(err) {} 
})();

const romajiToHiraganaMap = { 'a':'あ','i':'い','u':'う','e':'え','o':'お', 'ka':'か', 'ki':'き', 'ku':'く', 'ke':'け', 'ko':'こ', 'sa':'さ', 'shi':'し', 'su':'す', 'se':'せ', 'so':'そ', 'ta':'た', 'chi':'ち', 'tsu':'つ', 'te':'て', 'to':'と', 'na':'な', 'ni':'に', 'nu':'ぬ', 'ne':'ね', 'no':'の', 'ha':'は', 'hi':'ひ', 'fu':'ふ', 'he':'へ', 'ho':'ほ', 'ma':'ま', 'mi':'み', 'mu':'む', 'me':'め', 'mo':'も', 'ya':'や', 'yu':'ゆ', 'yo':'よ', 'ra':'ら', 'ri':'り', 'ru':'る', 're':'れ', 'ro':'ろ', 'wa':'わ', 'wo':'を', 'n':'ん', 'nn':'ん'};

function convertRomajiToHiragana(romaji) {
    if(!romaji) return "";
    let result = ""; let temp = romaji.toLowerCase();
    while (temp.length > 0) {
        if(temp[0] === '-') { result += 'ー'; temp = temp.substring(1); continue; }
        let match = false;
        for (let len = 3; len >= 1; len--) {
            if (temp.length >= len && romajiToHiraganaMap[temp.substring(0, len)]) {
                result += romajiToHiraganaMap[temp.substring(0, len)]; temp = temp.substring(len); match = true; break;
            }
        }
        if (!match) { result += temp[0]; temp = temp.substring(1); }
    }
    return result;
}

// ==========================================
// 2. 外語動態發音標註引擎 (文法精準修正版)
// ==========================================
function parseForeignToHTML(word, lang) {
    if (!word) return word;
    if (lang === 'es') {
        if (/[áéíóúÁÉÍÓÚ]/.test(word)) return word.replace(/([áéíóúÁÉÍÓÚ])/ig, '<span class="stress">$1</span>');
        if (/[aeiouns]$/i.test(word)) return word.replace(/([aeiouyAEIOUY])([^aeiouyAEIOUY]*[aeiouyAEIOUY]?[^aeiouyAEIOUY]*)$/i, '<span class="stress">$1</span>$2');
        return word.replace(/([aeiouyAEIOUY])([^aeiouyAEIOUY]*)$/i, '<span class="stress">$1</span>$2');
    } else if (lang === 'de') {
        return word.replace(/([Ww])/g, '<ruby>$1<rt>v</rt></ruby>').replace(/([Zz])/g, '<ruby>$1<rt>ts</rt></ruby>').replace(/([Vv])/g, '<ruby>$1<rt>f</rt></ruby>');
    } else if (lang === 'ru') {
        return word.replace(/([Хх])/g, '<ruby>$1<rt>h</rt></ruby>').replace(/([Шш])/g, '<ruby>$1<rt>sh</rt></ruby>').replace(/([Вв])/g, '<ruby>$1<rt>v</rt></ruby>').replace(/([Рр])/g, '<ruby>$1<rt>r</rt></ruby>');
    } else if (lang === 'fr') {
        return word.replace(/([stdpxz])$/i, '<span class="silent">$1</span>');
    }
    return word;
}

function parseSentence(text) {
    let result = []; let i = 0;
    while (i < text.length) {
        let matched = false; let limit = Math.min(currentMaxPhraseLen, text.length - i);
        for (let len = limit; len >= 2; len--) {
            let word = text.slice(i, i + len);
            if (PHRASE_BPMF_DICT[word]) {
                let bpmfs = PHRASE_BPMF_DICT[word].split(',');
                if (bpmfs.length === len) {
                    for (let j = 0; j < len; j++) result.push({ char: word[j], bpmf: bpmfs[j] });
                    i += len; matched = true; break;
                }
            }
        }
        if (!matched) { let char = text[i]; result.push({ char: char, bpmf: charToBpmfCache[char] || "" }); i++; }
    }
    return result;
}

function extractBpmf(bpmfString) {
    if (!bpmfString) return { symbols: [], lightTone: '', markTone: '' };
    let lightTone = '', markTone = '', symbols = [];
    for (let char of bpmfString) {
        if (char === '˙') lightTone = '˙'; else if (['ˊ', 'ˇ', 'ˋ'].includes(char)) markTone = char; else symbols.push(char);
    }
    return { symbols, lightTone, markTone };
}

function createCharBox(char, bpmfString, isInterim, isPunctuation = false, isEnglish = false, isForeign = false, hiragana = null) {
    const box = document.createElement('div');
    const classNameExt = isEnglish ? 'is-english' : (isForeign ? 'is-foreign' : (isPunctuation ? 'is-punctuation' : ''));
    box.className = `ruby-container ${isInterim ? 'is-interim' : ''} ${classNameExt}`;
    
    if (hiragana) {
        box.innerHTML = `<ruby class="jp-ruby"><span class="jp-kanji">${char}</span><rt class="jp-furi">${hiragana}</rt></ruby>`;
        return box;
    }
    if (isEnglish || isForeign || isPunctuation || !bpmfString) { box.innerHTML = `<div class="ruby-char">${char}</div>`; return box; }

    const { symbols, lightTone, markTone } = extractBpmf(bpmfString);
    let zhuyinHtml = `<div class="ruby-zhuyin">`;
    if (lightTone) zhuyinHtml += `<span class="tone-light">${lightTone}</span>`;
    zhuyinHtml += `<div class="zhuyin-col">`;
    symbols.forEach(sym => zhuyinHtml += `<span class="zhuyin-symbol">${sym}</span>`);
    zhuyinHtml += `</div>`;
    if (markTone) zhuyinHtml += `<span class="tone-mark">${markTone}</span></div>`;
    box.innerHTML = `<div class="ruby-char">${char}</div>${zhuyinHtml}`;
    return box;
}

function parseTokensToNodes(text, isInterim = false, srcLang = 'zh-TW', translationData = null) {
    if (!text || text === "undefined") return [];
    let nodes = [];
    
    // 日文：僅在存在翻譯資料（表示為目標翻譯層）時，才利用 API 羅馬拼音掛載平假名
    if (srcLang === 'ja') {
        if (!isInterim && translationData && translationData.rawData && translationData.rawData[0]) {
            translationData.rawData[0].forEach(seg => {
                if (seg[0] && typeof seg[0] === 'string' && seg[3] && typeof seg[3] === 'string') {
                    let hira = convertRomajiToHiragana(seg[3]);
                    nodes.push(createCharBox(seg[0], '', false, false, false, false, hira)); 
                } else if (seg[0]) nodes.push(createCharBox(seg[0], '', false, false, false, true));
            });
            if(nodes.length > 0) return nodes;
        }
        nodes.push(createCharBox(text, '', isInterim, false, false, true));
        return nodes;
    }

    // 將所有非中/日文的語系（包含韓文 ko, 德文 de 等）統一納入正規劃切割邏輯，修復韓文 Eojeol 破碎崩潰問題
    if (srcLang !== 'zh-TW') {
        const tokens = text.split(/([ \n，。！？、：；,.?!;:])/);
        for(let i=0; i<tokens.length; i++) {
            let token = tokens[i]; if (!token) continue;
            // 法文連音偵測，插入獨立的弧線符號區塊
            if (srcLang === 'fr' && token === ' ' && tokens[i-1] && tokens[i-1].match(/[stpxz]$/i) && tokens[i+1] && tokens[i+1].match(/^[aeiouy]/i)) {
                nodes.push(createCharBox('<span class="liaison">&#8255;</span>', '', isInterim, false, false, true)); continue;
            }
            if (/^[，。！？、：；,.?!;:\s\n]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, true, false, false));
            else nodes.push(createCharBox(parseForeignToHTML(token, srcLang), '', isInterim, false, false, true));
        }
        return nodes;
    }

    // 中文處理
    const tokens = text.match(/[\u4e00-\u9fa5]+|[a-zA-Z0-9\s'-]+|[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+/g) || [];
    tokens.forEach(token => {
        if (/^[a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, false, true, false));
        else if (/^[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, true, false, false));
        else { parseSentence(token).forEach(item => nodes.push(createCharBox(item.char, item.bpmf, isInterim, false, false, false))); }
    });
    return nodes;
}

// ==========================================
// 3. 系統控制與卡片管理 (含智慧語系與記憶修復)
// ==========================================
const ControlSystem = (() => {
    const linesContainer = document.getElementById('linesContainer');
    const tagBanner = document.getElementById('tagBanner');
    const langA = document.getElementById('langA');
    const langB = document.getElementById('langB');
    
    let isUserRequestedStop = true, isTTSPlaying = false; 
    let recognition = null, currentLineObj = null, lineBreakTimer = null;
    let deletedCardsStack = []; 

    const localeMap = { 'zh-TW': 'zh-TW', 'en': 'en-US', 'ja': 'ja-JP', 'ko': 'ko-KR', 'es': 'es-ES', 'de': 'de-DE', 'ru': 'ru-RU', 'fr': 'fr-FR' };
    const tagColors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

    function getSourceLang() { return langA.value; }
    function getTargetLang() { return langB.value; }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initLanguages() {
        const savedPrefs = JSON.parse(localStorage.getItem('userPrefs'));
        if (savedPrefs && savedPrefs.src && savedPrefs.tgt) {
            langA.value = savedPrefs.src; langB.value = savedPrefs.tgt;
        } else {
            const navLang = navigator.language || '';
            if (navLang.toLowerCase().includes('zh')) {
                langA.value = 'zh-TW'; langB.value = 'en';
            } else {
                let shortLang = navLang.split('-')[0];
                if (Array.from(langA.options).some(opt => opt.value === shortLang)) langA.value = shortLang;
                else langA.value = 'en';
                langB.value = 'zh-TW';
            }
        }
    }
    initLanguages();

    const saveUserPrefs = () => localStorage.setItem('userPrefs', JSON.stringify({ src: langA.value, tgt: langB.value }));

    function restartSpeechIfRecording() {
        saveUserPrefs();
        if (currentLineObj && currentLineObj.wrapper.classList.contains('is-empty')) {
            currentLineObj.srcLang = getSourceLang(); currentLineObj.tgtLang = getTargetLang();
        } else if (currentLineObj && currentLineObj.fullText !== '') {
            triggerTranslation(currentLineObj);
            if(!isUserRequestedStop) currentLineObj = createNewActiveLine();
        }
        if (!isUserRequestedStop && recognition && !isTTSPlaying) { try { recognition.stop(); } catch(e) {} }
    }

    langA.addEventListener('change', restartSpeechIfRecording);
    langB.addEventListener('change', restartSpeechIfRecording);

    function loadSavedCards() {
        const savedCards = JSON.parse(localStorage.getItem('lockedCards') || '[]');
        savedCards.forEach(cardData => {
            const lineObj = createNewActiveLine(cardData.id, true);
            lineObj.fullText = cardData.fullText; lineObj.translatedText = cardData.translatedText;
            lineObj.srcLang = cardData.srcLang; lineObj.tgtLang = cardData.tgtLang;
            lineObj.translationData = cardData.translationData; 
            lineObj.wrapper.classList.remove('is-empty');
            
            parseTokensToNodes(cardData.fullText, false, cardData.srcLang).forEach(n => lineObj.finalAnchor.appendChild(n));
            
            if (cardData.translatedText) {
                lineObj.translated = true;
                parseTokensToNodes(cardData.translatedText, false, cardData.tgtLang, cardData.translationData).forEach(n => lineObj.translationContainer.appendChild(n));
                lineObj.translationContainer.classList.add('show');
            }
            if (cardData.isTagged) applyTag(lineObj, cardData.tagColor, true);
        });
    }

    function saveState() {
        const lockedData = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active:not(.is-empty)')).map(w => {
            let o = w.lineObj;
            if(o.isTagged && o.fullText.trim() !== '') return { id: o.id, fullText: o.fullText, translatedText: o.translatedText, isTagged: o.isTagged, tagColor: o.tagColor, srcLang: o.srcLang, tgtLang: o.tgtLang, translationData: o.translationData };
        }).filter(Boolean);
        localStorage.setItem('lockedCards', JSON.stringify(lockedData.reverse())); 
    }

    function removeCard(lineObj, saveToStack = true) {
        if (lineObj.isTagged || lineObj.wrapper.classList.contains('is-empty')) return; 
        if (saveToStack) deletedCardsStack.push(lineObj);
        lineObj.wrapper.classList.remove('active'); lineObj.wrapper.classList.add('deleting');
        setTimeout(() => { if (lineObj.wrapper.parentNode) lineObj.wrapper.parentNode.removeChild(lineObj.wrapper); if (lineObj.tagEl) lineObj.tagEl.remove(); saveState(); }, 500);
    }

    function applyTag(lineObj, forceColor = null, isInitializing = false) {
        if (lineObj.isTagged && !isInitializing || lineObj.wrapper.classList.contains('is-empty')) return; 
        const color = forceColor || tagColors[Math.floor(Math.random() * tagColors.length)];
        lineObj.isTagged = true; lineObj.tagColor = color; lineObj.speechLine.style.borderColor = color;

        const tagEl = document.createElement('div'); tagEl.className = 'circle-tag'; tagEl.style.borderColor = color; tagEl.style.backgroundColor = color + '40'; 
        tagEl.textContent = lineObj.fullText.trim().charAt(0) || '?';
        tagEl.addEventListener('click', () => {
            lineObj.wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            lineObj.speechLine.style.background = color + '20'; 
            setTimeout(() => lineObj.speechLine.style.background = '', 1000);
        });
        tagEl.addEventListener('dblclick', () => removeTag(lineObj));
        lineObj.tagEl = tagEl; tagBanner.prepend(tagEl); 
        if(!isInitializing) saveState();
    }

    function removeTag(lineObj) {
        if (!lineObj.isTagged) return; lineObj.isTagged = false; lineObj.tagColor = null; lineObj.speechLine.style.borderColor = ''; 
        if (lineObj.tagEl) { lineObj.tagEl.style.transform = 'scale(0)'; lineObj.tagEl.style.opacity = '0'; setTimeout(() => { lineObj.tagEl.remove(); lineObj.tagEl = null; }, 300); }
        saveState();
    }

    function attachSwipeGestures(lineObj) {
        let startX = 0, startY = 0, currentX = 0, isSwiping = false, isVertical = false, translateVal = 0, preventClick = false;
        lineObj.speechLine.addEventListener('touchstart', e => { if (lineObj.wrapper.classList.contains('is-empty')) return; startX = e.touches[0].clientX; startY = e.touches[0].clientY; isSwiping = isVertical = false; lineObj.speechLine.style.transition = 'none'; preventClick = false; });
        lineObj.speechLine.addEventListener('touchmove', e => {
            if (lineObj.wrapper.classList.contains('is-empty')) return; 
            let dX = e.touches[0].clientX - startX; let dY = e.touches[0].clientY - startY;
            if (!isSwiping && !isVertical) { if (Math.abs(dY) > Math.abs(dX) + 5) isVertical = true; else if (Math.abs(dX) > 10) isSwiping = true; }
            if (isSwiping && !isVertical) { e.preventDefault(); lineObj.speechLine.style.transform = `translateX(${lineObj.isTagged && dX<0 ? dX*0.2 : dX}px)`; translateVal = dX; }
        });
        lineObj.speechLine.addEventListener('touchend', () => {
            if (!isSwiping) return; lineObj.speechLine.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s, border-color 0.4s';
            if (Math.abs(translateVal) > 10) preventClick = true;
            if (translateVal < -100 && !lineObj.isTagged) { lineObj.speechLine.style.transform = `translateX(-120%)`; removeCard(lineObj); }
            else if (translateVal > 100) { lineObj.speechLine.style.transform = `translateX(0)`; if (lineObj.isTagged) removeTag(lineObj); else applyTag(lineObj); }
            else { lineObj.speechLine.style.transform = `translateX(0)`; } translateVal = 0;
        });
        lineObj.speechLine.addEventListener('click', (e) => {
            if (preventClick) { e.stopPropagation(); preventClick = false; return; }
            if (lineObj.speechLine.style.transform && lineObj.speechLine.style.transform !== 'translateX(0px)') { lineObj.speechLine.style.transform = `translateX(0)`; e.stopPropagation(); }
        });
    }

    function createNewActiveLine(forceId = null, isAppending = false) {
        if (!isAppending && currentLineObj && currentLineObj.fullText === '') return currentLineObj; 
        
        let wrapper = document.createElement('div'); wrapper.className = 'speech-line-wrapper is-empty';
        let innerWrapper = document.createElement('div'); innerWrapper.className = 'speech-line-inner';
        let actionsBg = document.createElement('div'); actionsBg.className = 'swipe-actions-bg';
        actionsBg.innerHTML = `<div class="swipe-btn tag"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="swipe-btn delete"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>`;
        let deskLeft = document.createElement('div'); deskLeft.className = 'desktop-action left'; deskLeft.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
        let deskRight = document.createElement('div'); deskRight.className = 'desktop-action right'; deskRight.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

        let speechLine = document.createElement('div'); speechLine.className = 'speech-line';
        let textContainer = document.createElement('div'); textContainer.className = 'text-layer source-layer';
        let finalAnchor = document.createElement('span'); finalAnchor.className = 'final-anchor';
        let interimAnchor = document.createElement('span'); interimAnchor.className = 'interim-anchor';
        let translationContainer = document.createElement('div'); translationContainer.className = 'text-layer target-layer';
        
        textContainer.appendChild(finalAnchor); textContainer.appendChild(interimAnchor);
        speechLine.append(deskLeft, deskRight, textContainer, translationContainer);
        innerWrapper.append(actionsBg, speechLine); wrapper.appendChild(innerWrapper);
        if(isAppending) linesContainer.appendChild(wrapper); else linesContainer.prepend(wrapper);
        
        void wrapper.offsetWidth; setTimeout(()=> wrapper.classList.add('active'), 10);

        const lineObj = { id: forceId || "c_" + Date.now(), wrapper, speechLine, finalAnchor, interimAnchor, translationContainer, fullText: '', translatedText: '', translated: false, isTagged: false, tagColor: null, tagEl: null, srcLang: getSourceLang(), tgtLang: getTargetLang(), translationData: null };
        wrapper.lineObj = lineObj; attachSwipeGestures(lineObj);

        const toggleTag = e => { e.stopPropagation(); if(lineObj.fullText==='')return; lineObj.isTagged ? removeTag(lineObj) : applyTag(lineObj); };
        const delCard = e => { e.stopPropagation(); if(lineObj.fullText==='')return; removeCard(lineObj); };
        actionsBg.querySelector('.tag').onclick = deskLeft.onclick = toggleTag; actionsBg.querySelector('.delete').onclick = deskRight.onclick = delCard;

        textContainer.addEventListener('click', (e) => {
            if (lineObj.fullText === '') return;
            if (lineObj.speechLine.classList.contains('is-flipped')) lineObj.speechLine.classList.remove('is-flipped');
            ControlSystem.playSpeech(lineObj.fullText, localeMap[lineObj.srcLang]);
        });
        translationContainer.addEventListener('click', (e) => {
            if (translationContainer.innerHTML.includes("失敗")) { lineObj.translated = false; triggerTranslation(lineObj); return; }
            if (!lineObj.translatedText || translationContainer.innerHTML.includes("即時翻譯中")) return;
            if (!lineObj.speechLine.classList.contains('is-flipped')) lineObj.speechLine.classList.add('is-flipped');
            ControlSystem.playSpeech(lineObj.translatedText, localeMap[lineObj.tgtLang]);
        });

        return lineObj;
    }

    async function translateText(text, srcLang, tgtLang) {
        if (!text.trim()) return { translated: text, rawData: null };
        try {
            const sl = srcLang === 'zh-TW' ? 'zh-TW' : srcLang.split('-')[0];
            const tl = tgtLang === 'zh-TW' ? 'zh-TW' : tgtLang.split('-')[0];
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=rm&q=${encodeURIComponent(text)}`);
            if (!res.ok) throw new Error(); const data = await res.json();
            if (!data || !data[0]) throw new Error("API結構異常");
            return { translated: data[0].map(i => i && i[0]).filter(Boolean).join(''), rawData: data };
        } catch (e) { return { translated: "翻譯處理失敗，點擊重試...", rawData: null }; }
    }

    async function triggerTranslation(lineObj) {
        if (!lineObj || !lineObj.fullText.trim() || lineObj.translated) return;
        lineObj.translated = true; lineObj.translationContainer.innerHTML = '<span class="trans-loading">即時翻譯中...</span>'; lineObj.translationContainer.classList.add('show');
        const res = await translateText(lineObj.fullText, lineObj.srcLang, lineObj.tgtLang);
        lineObj.translatedText = res.translated; lineObj.translationData = res;
        
        lineObj.translationContainer.innerHTML = '';
        if (res.translated.includes("失敗")) {
            lineObj.translationContainer.innerHTML = `<span class="trans-loading">${res.translated}</span>`;
        } else {
            parseTokensToNodes(res.translated, false, lineObj.tgtLang, res).forEach(n => lineObj.translationContainer.appendChild(n));
        }
        // 🚨 已將導致日文跳掉語系的「來源層覆寫代碼」全數移除，徹底杜絕資料污染！
        saveState(); 
    }

    if (SpeechRecognition) {
        recognition = new SpeechRecognition(); recognition.continuous = true; recognition.interimResults = true;
        recognition.onstart = () => { document.body.className = "state-listening"; document.getElementById('text-mic').innerText = "暫停錄音"; document.getElementById('text-mic-short').innerText = "暫停"; if (!currentLineObj || currentLineObj.fullText.trim() !== '') currentLineObj = createNewActiveLine(); };
        recognition.onresult = (e) => {
            if (currentLineObj && currentLineObj.wrapper.classList.contains('is-empty')) currentLineObj.wrapper.classList.remove('is-empty');
            let interimHTML = document.createDocumentFragment(), finalAdded = false, lastFinal = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let t = e.results[i][0].transcript; if (!t) continue;
                if (e.results[i].isFinal) { parseTokensToNodes(t, false, currentLineObj.srcLang).forEach(n => currentLineObj.finalAnchor.appendChild(n)); finalAdded = true; lastFinal = t; currentLineObj.fullText += t; }
                else parseTokensToNodes(t, true, currentLineObj.srcLang).forEach(n => interimHTML.appendChild(n));
            }
            currentLineObj.interimAnchor.innerHTML = ''; currentLineObj.interimAnchor.appendChild(interimHTML);
            if (finalAdded || interimHTML.childNodes.length > 0) document.getElementById('displayContainer').scrollTo({ top: 0, behavior: 'smooth' });
            
            if (finalAdded && /[。！？，、：；\n]/.test(lastFinal)) {
                clearTimeout(lineBreakTimer); triggerTranslation(currentLineObj); 
                if(!isUserRequestedStop) currentLineObj = createNewActiveLine();
            } else {
                clearTimeout(lineBreakTimer);
                lineBreakTimer = setTimeout(() => { 
                    if (currentLineObj && currentLineObj.finalAnchor.childNodes.length > 0) { 
                        triggerTranslation(currentLineObj); 
                        if(!isUserRequestedStop) currentLineObj = createNewActiveLine(); 
                    } 
                }, 1500);
            }
        };
        recognition.onerror = () => { isUserRequestedStop = true; document.body.className = ""; document.getElementById('text-mic').innerText = "授權異常"; document.getElementById('text-mic-short').innerText = "異常"; };
        recognition.onend = () => {
            if (!isUserRequestedStop && !isTTSPlaying) { recognition.lang = localeMap[getSourceLang()]; try { recognition.start(); } catch(e) {} } 
            else if (isUserRequestedStop) {
                document.body.className = ""; document.getElementById('text-mic').innerText = "開始錄音"; document.getElementById('text-mic-short').innerText = "開始";
                if (currentLineObj && currentLineObj.fullText.trim() === '') { currentLineObj.wrapper.classList.replace('active', 'deleting'); setTimeout(() => { if(currentLineObj && currentLineObj.wrapper.parentNode) currentLineObj.wrapper.parentNode.removeChild(currentLineObj.wrapper); currentLineObj = null; }, 400); }
            }
        };
    }

    let lastX, lastY, lastZ, lastUpdate = 0;
    window.addEventListener('devicemotion', (e) => {
        let current = e.accelerationIncludingGravity; if (!current) return;
        let cTime = new Date().getTime();
        if ((cTime - lastUpdate) > 100) {
            let speed = Math.abs(current.x + current.y + current.z - lastX - lastY - lastZ) / (cTime - lastUpdate) * 10000;
            if (speed > 1500 && deletedCardsStack.length > 0) {
                let obj = deletedCardsStack.pop(); obj.wrapper.classList.remove('deleting'); linesContainer.prepend(obj.wrapper);
                if(obj.isTagged && obj.tagEl) tagBanner.prepend(obj.tagEl);
                setTimeout(() => obj.wrapper.classList.add('active'), 50); saveState();
            }
            lastX = current.x; lastY = current.y; lastZ = current.z; lastUpdate = cTime;
        }
    });
    setTimeout(loadSavedCards, 100);

    return {
        toggleDirection: () => {
            let temp = langA.value; langA.value = langB.value; langB.value = temp;
            restartSpeechIfRecording();
        },
        toggleMic: () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') { DeviceMotionEvent.requestPermission().catch(()=>{}); }
            if (!SpeechRecognition) return alert("瀏覽器不支援 Speech API。");
            if (isUserRequestedStop) { isUserRequestedStop = false; recognition.lang = localeMap[getSourceLang()]; try { recognition.start(); } catch(e) {} } 
            else { isUserRequestedStop = true; clearTimeout(lineBreakTimer); try { recognition.stop(); } catch(e) {} }
        },
        playSpeech: (text, lang) => {
            if (!text || text.includes("即時翻譯中") || text.includes("失敗")) return;
            window.speechSynthesis.cancel(); isTTSPlaying = true;
            let wasRecording = !isUserRequestedStop; if (wasRecording && recognition) { try { recognition.stop(); } catch(e) {} }
            const u = new SpeechSynthesisUtterance(text); u.lang = lang;
            u.onend = u.onerror = () => { isTTSPlaying = false; if (wasRecording && !isUserRequestedStop) { recognition.lang = localeMap[getSourceLang()]; try { recognition.start(); } catch(e) {} } };
            window.speechSynthesis.speak(u);
        },
        copyText: () => {
            // 修復複製亂碼：移除所有拼音、靜音標籤，不帶出 HTML 架構
            let getCleanText = (node) => {
                let clone = node.cloneNode(true);
                Array.from(clone.querySelectorAll('rt, .ruby-zhuyin, .jp-furi, .tone-light, .tone-mark, .silent')).forEach(el => el.remove());
                return clone.textContent.replace(/\s+/g, ' ').trim();
            };
            let textToCopy = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active:not(.is-empty)')).reverse().map(w => {
                let oTxt = Array.from(w.querySelectorAll('.source-layer .ruby-container')).map(n => (n.classList.contains('is-english') || n.classList.contains('is-foreign')) ? getCleanText(n) + ' ' : getCleanText(n)).join('').replace(/\s+/g, ' ').trim();
                let tTxt = Array.from(w.querySelectorAll('.target-layer .ruby-container')).map(n => (n.classList.contains('is-english') || n.classList.contains('is-foreign')) ? getCleanText(n) + ' ' : getCleanText(n)).join('').replace(/\s+/g, ' ').trim();
                return oTxt + (tTxt && !w.querySelector('.target-layer').innerHTML.includes("即時翻譯中") ? '\n' + tTxt : '');
            }).filter(t => t).join('\n\n');
            
            if (!textToCopy) return;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('btn-copy'), html = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> <span class="btn-text-full" style="font-weight:bold;">複製成功</span><span class="btn-text-short">成功</span>`;
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)'; setTimeout(() => { btn.innerHTML = html; btn.style.background = ''; }, 2000);
            });
        },
        clearSystem: () => { Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active')).forEach(w => { if(w.lineObj && !w.lineObj.isTagged) removeCard(w.lineObj, true); }); }
    };
})();
</script>
</body>
</html>
