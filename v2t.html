<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旗艦雙語注音即時翻譯系統</title>
    <style>
        /* ==========================================
           1. 現代隱性骨架與動態視窗防禦
           ========================================== */
        :root {
            --bg-color1: #0f172a; 
            --bg-color2: #1e293b; 
            --text-main: #f8fafc;
            --text-zhuyin: #e2e8f0; 
            --tone-color: #38bdf8;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --trans-color: #7dd3fc; 
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color1);
            background-image: radial-gradient(circle at center, var(--bg-color1) 0%, var(--bg-color2) 100%);
            color: var(--text-main); font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            height: 100dvh; min-height: 100dvh; max-height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; overscroll-behavior: none;
        }

        /* ==========================================
           2. 頂端標籤容器
           ========================================== */
        #tagBanner {
            width: 100%; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: flex-start; gap: 12px;
            padding: 12px 20px; min-height: 60px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 20; overflow-x: auto;
        }
        #tagBanner::-webkit-scrollbar { display: none; }
        
        .circle-tag {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: bold; color: #fff; cursor: pointer;
            border: 2px solid; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            animation: popIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); user-select: none;
        }
        .circle-tag:active { transform: scale(0.85); }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ==========================================
           3. 平滑瀑布流顯示容器 (支援 Outlook 手勢)
           ========================================== */
        #displayContainer {
            flex: 1 1 auto; width: 100%; max-width: 1400px; overflow-y: auto; overflow-x: hidden; padding: 24px;
            overscroll-behavior-y: contain; display: block; scroll-behavior: smooth;
        }
        #displayContainer::-webkit-scrollbar { width: 8px; }
        #displayContainer::-webkit-scrollbar-track { background: transparent; }
        #displayContainer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        #linesContainer { display: flex; flex-direction: column; width: 100%; gap: 20px; padding-bottom: 20px;}

        .speech-line-wrapper {
            position: relative; display: grid; grid-template-rows: 0fr; opacity: 0;
            transition: grid-template-rows 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease, margin 0.4s ease;
        }
        .speech-line-wrapper.active { grid-template-rows: 1fr; opacity: 1; }
        .speech-line-wrapper.deleting { grid-template-rows: 0fr; opacity: 0; margin-bottom: -20px; }
        
        .speech-line-inner { overflow: visible; position: relative; }

        /* Outlook 風格滑動底板 */
        .swipe-actions-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 24px;
            display: flex; justify-content: space-between; overflow: hidden; z-index: 1;
        }
        .swipe-btn {
            width: 80px; height: 100%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: filter 0.2s;
        }
        .swipe-btn:active { filter: brightness(0.8); }
        .swipe-btn.tag { background: var(--success-color); }
        .swipe-btn.delete { background: var(--danger-color); }
        .swipe-btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        /* 語音主卡片 (純色背景防透視) */
        .speech-line {
            display: flex; flex-direction: column; position: relative; z-index: 2;
            width: 100%; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.06);
            background: #182e46; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s;
            padding: 24px 28px; box-sizing: border-box; touch-action: pan-y;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }
        .speech-line-wrapper:nth-child(even) .speech-line { background: #111e30; }
        
        /* 空白卡片強制隱藏所有操作按鈕與滑動底板 */
        .speech-line-wrapper.is-empty .swipe-actions-bg,
        .speech-line-wrapper.is-empty .desktop-action { display: none !important; }

        /* 電腦版隱形按鈕 (滑鼠懸停顯示) */
        .desktop-action {
            position: absolute; top: 12px; opacity: 0; cursor: pointer; color: #94a3b8; transition: all 0.2s; z-index: 10;
        }
        .desktop-action.left { left: 16px; }
        .desktop-action.right { right: 16px; }
        .desktop-action:hover { transform: scale(1.1); }
        .desktop-action.left:hover { color: var(--success-color); }
        .desktop-action.right:hover { color: var(--danger-color); }
        .desktop-action svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;}
        
        @media (hover: hover) and (pointer: fine) {
            .speech-line:hover .desktop-action { opacity: 0.6; }
            .speech-line-wrapper.is-empty .speech-line:hover .desktop-action { opacity: 0; }
        }
        @media (hover: none) {
            .desktop-action { display: none !important; }
        }

        /* 原文與翻譯區塊 */
        .original-text { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; width: 100%; cursor: pointer; user-select: text; min-height: 4.8rem;}
        .translation-text {
            width: 100%; margin-top: 14px; font-size: 1.65rem; color: var(--trans-color); font-weight: 500;
            letter-spacing: 0.5px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 14px;
            opacity: 0; transition: opacity 0.5s ease; display: none; line-height: 1.5; cursor: pointer; user-select: text;
        }
        .translation-text.show { opacity: 1; display: block; }
        @keyframes softPulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .trans-loading { font-size: 1.2rem; color: #94a3b8; animation: softPulse 1.5s infinite; font-weight: normal; }

        .final-anchor, .interim-anchor { display: contents; }

        /* ==========================================
           4. 台灣標準教科書級別注音字體排版 CSS (防聲調覆蓋)
           ========================================== */
        .ruby-container {
            display: inline-flex; align-items: center; margin-right: 22px; margin-bottom: 8px; /* 預留寬度防覆蓋 */
            font-family: "標楷體", "DFKai-SB", 'Microsoft JhengHei', serif; transition: all 0.2s ease;
        }
        
        .ruby-char { 
            font-size: 4.2rem; font-weight: bold; color: var(--text-main); 
            line-height: 1.05; text-shadow: 0 0 15px rgba(255,255,255,0.2); 
            position: relative;
        }
        
        .ruby-zhuyin {
            display: inline-flex; flex-direction: column; justify-content: center; align-items: center; 
            position: relative; margin-left: 6px; padding-right: 0.8em; /* 強制隔開聲調與下個字的距離 */
            user-select: none; -webkit-user-select: none;
        }
        
        .zhuyin-col { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .zhuyin-symbol { 
            font-size: 1.45rem; line-height: 1.05; color: var(--text-zhuyin); 
            font-weight: 800; text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); font-family: 'Microsoft JhengHei', sans-serif;
        }
        
        .tone-light { 
            position: absolute; top: -1.2rem; left: calc(50% - 0.4em); 
            transform: translateX(-50%); font-size: 1.35rem; color: var(--tone-color); z-index: 3;
        }
        
        .tone-mark { 
            position: absolute; right: 0; top: 50%; 
            transform: translateY(-50%); font-size: 1.35rem; color: var(--tone-color); z-index: 3; 
        }

        .ruby-container.is-interim { opacity: 0.65; transform: scale(0.96); }
        .ruby-container.is-interim .ruby-char { color: #94a3b8; text-shadow: none; }
        .ruby-container.is-interim .zhuyin-symbol { color: #cbd5e1; }
        
        .ruby-container.is-english { margin-right: 12px; }
        .ruby-container.is-english .ruby-char { font-size: 3.2rem; color: #fcd34d; padding: 0 6px; letter-spacing: 1px; font-family: 'Microsoft JhengHei', sans-serif; white-space: pre-wrap; align-items: center; line-height: 1.2;}
        .ruby-container.is-foreign .ruby-char { font-size: 3.2rem; color: #f8fafc; padding: 0 6px; font-family: -apple-system, sans-serif; white-space: pre-wrap; align-items: center; line-height: 1.2;}
        .ruby-container.is-punctuation { margin-right: 8px; }
        .ruby-container.is-punctuation .ruby-char { font-size: 3.2rem; color: #64748b; padding: 0 4px; align-items: center; line-height: 1.2;}

        /* 日文平假名 (Furigana) 標註樣式：採用原生 HTML5 <ruby> 結構 */
        ruby.jp-ruby { ruby-align: center; }
        rt.jp-furi { font-size: 1rem; color: #fcd34d; user-select: none; font-weight: normal; font-family: 'Noto Sans TC', sans-serif;}
        .jp-kanji { font-size: 3.2rem; line-height: 1.2; font-weight: bold; }

        /* ==========================================
           5. 控制面板與純淨下拉箭頭切換 UI
           ========================================== */
        #controlPanel {
            flex-shrink: 0; width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 18px;
            padding: 22px 28px calc(22px + env(safe-area-inset-bottom)); background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 36px 36px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 10;
        }

        .lang-switcher { display: flex; justify-content: center; align-items: center; gap: 16px; width: 100%; }
        .lang-switcher select { 
            background: rgba(15, 23, 42, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 12px 16px; border-radius: 14px; outline: none; font-weight: bold; font-size: 1.05rem;
            flex: 1; max-width: 220px; text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            appearance: none; -webkit-appearance: none; cursor: pointer; transition: border-color 0.3s;
        }
        .lang-switcher select:focus { border-color: var(--tone-color); }
        .dir-btn {
            background: linear-gradient(135deg, #475569, #334155); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0;
        }
        .dir-btn:active { transform: scale(0.85); }
        .dir-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s ease;}
        .dir-btn.left svg { transform: rotate(180deg); color: var(--tone-color); }

        .btn-group { display: flex; gap: 16px; width: 100%; }
        .magic-btn {
            flex: 1; padding: 18px 10px; font-size: 1.25rem; font-weight: 700; border: none; border-radius: 20px; cursor: pointer; color: #ffffff;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s ease; box-shadow: 0 6px 15px rgba(0,0,0,0.2); letter-spacing: 1px;
        }
        .magic-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .magic-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        
        /* 修復手機版錄音閃爍：改為柔和內發光與慢速呼吸燈，不改背景色塊 */
        body.state-listening .btn-primary { 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 15px rgba(239, 68, 68, 0.4); 
            border: 1px solid rgba(239, 68, 68, 0.8);
            animation: recordGlow 2s infinite alternate; 
        }
        @keyframes recordGlow {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9), inset 0 0 15px rgba(239, 68, 68, 0.6); }
        }
        
        .btn-secondary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-danger { background: linear-gradient(135deg, #64748b, #475569); }

        /* 響應式控制 (窄屏自動縮寫按鈕文字) */
        .btn-text-short { display: none; }
        
        @media (max-width: 768px) {
            .btn-text-full { display: none; }
            .btn-text-short { display: inline; }
            
            #tagBanner { padding: 10px 16px; min-height: 54px; gap: 10px; }
            .circle-tag { width: 36px; height: 36px; font-size: 1.1rem; }
            #displayContainer { padding: 16px; }
            #linesContainer { gap: 14px; }
            .speech-line { padding: 18px 20px; border-radius: 20px;}
            
            .translation-text { font-size: 1.35rem; margin-top: 12px; padding-top: 12px; }
            .ruby-container { margin-right: 14px; margin-bottom: 6px; }
            .ruby-char { font-size: 3.2rem; }
            .ruby-zhuyin { margin-left: 4px; padding-right: 0.6em; }
            .zhuyin-symbol { font-size: 1.15rem; }
            .tone-light { top: -1rem; font-size: 1.05rem;}
            .tone-mark { font-size: 1.05rem;}
            
            .ruby-container.is-english .ruby-char, .ruby-container.is-punctuation .ruby-char, .ruby-container.is-foreign .ruby-char { font-size: 2.6rem; }
            .ruby-container.is-english, .ruby-container.is-punctuation { margin-right: 6px; }
            .jp-kanji { font-size: 2.6rem; } rt.jp-furi { font-size: 0.85rem; }
            
            #controlPanel { padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); gap: 14px; border-radius: 28px 28px 0 0;}
            .lang-switcher select { font-size: 0.95rem; padding: 10px 8px; max-width: 150px;}
            .dir-btn { width: 42px; height: 42px; }
            .magic-btn { padding: 14px 6px; font-size: 1.1rem; border-radius: 16px;}
            .magic-btn svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<div id="tagBanner"></div>

<div id="displayContainer">
    <div id="linesContainer"></div>
</div>

<div id="controlPanel">
    <div class="lang-switcher">
        <select id="langA">
            <option value="zh-TW" selected>正體中文 (Chinese)</option>
            <option value="en">英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="ko">韓文 (한국어)</option>
            <option value="es">西班牙文 (Español)</option>
            <option value="de">德文 (Deutsch)</option>
            <option value="ru">俄文 (Русский)</option>
            <option value="fr">法文 (Français)</option>
        </select>
        <button id="btn-dir" class="dir-btn" onclick="ControlSystem.toggleDirection()" title="切換翻譯方向">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <select id="langB">
            <option value="zh-TW">正體中文 (Chinese)</option>
            <option value="en" selected>英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="ko">韓文 (한국어)</option>
            <option value="es">西班牙文 (Español)</option>
            <option value="de">德文 (Deutsch)</option>
            <option value="ru">俄文 (Русский)</option>
            <option value="fr">法文 (Français)</option>
        </select>
    </div>

    <div class="btn-group">
        <button id="btn-mic" class="magic-btn btn-primary" onclick="ControlSystem.toggleMic()">
            <svg id="icon-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            <span id="text-mic" class="btn-text-full">開始錄音</span>
            <span id="text-mic-short" class="btn-text-short">開始</span>
        </button>
        <button id="btn-copy" class="magic-btn btn-secondary" onclick="ControlSystem.copyText()">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="btn-text-full">複製對照</span>
            <span class="btn-text-short">複製</span>
        </button>
        <button id="btn-clear" class="magic-btn btn-danger" onclick="ControlSystem.clearSystem()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span class="btn-text-full">清空畫面</span>
            <span class="btn-text-short">清空</span>
        </button>
    </div>
</div>

<script>
// ==========================================
// 1. 字典設定與精準發音覆寫掛載機制 (完全補回缺漏測、試等)
// ==========================================
let currentMaxPhraseLen = 6;
const PHRASE_BPMF_DICT = {
    "媽媽": "ㄇㄚ,ㄇㄚ˙", "爸爸": "ㄅㄚˋ,ㄅㄚ˙", "奶奶": "ㄋㄞˇ,ㄋㄞ˙", "哥哥": "ㄍㄜ,ㄍㄜ˙",
    "姊姊": "ㄐㄧㄝˇ,ㄐㄧㄝ˙", "弟弟": "ㄉㄧˋ,ㄉㄧ˙", "妹妹": "ㄇㄟˋ,ㄇㄟ˙",
    "什麼": "ㄕㄣˊ,ㄇㄜ˙", "怎麼": "ㄗㄣˇ,ㄇㄜ˙", "為什麼": "ㄨㄟˋ,ㄕㄣˊ,ㄇㄜ˙",
    "我們": "ㄨㄛˇ,ㄇㄣ˙", "你們": "ㄋㄧˇ,ㄇㄣ˙", "他們": "ㄊㄚ,ㄇㄣ˙", "她們": "ㄊㄚ,ㄇㄣ˙",
    "這麼": "ㄓㄜˋ,ㄇㄜ˙", "那麼": "ㄋㄚˋ,ㄇㄜ˙", "真的": "ㄓㄣ,ㄉㄜ˙", "好的": "ㄏㄠˇ,ㄉㄜ˙",
    "是的": "ㄕˋ,ㄉㄜ˙", "知道": "ㄓ,ㄉㄠˋ", "覺得": "ㄐㄩㄝˊ,ㄉㄜ˙", "了解": "ㄌㄧㄠˇ,ㄐㄧㄝˇ",
    "重要": "ㄓㄨㄥˋ,ㄧㄠˋ", "重複": "ㄔㄨㄥˊ,ㄈㄨˋ", "長大": "ㄓㄤˇ,ㄉㄚˋ", 
    "銀行": "ㄧㄣˊ,ㄏㄤˊ", "行動": "ㄒㄧㄥˊ,ㄉㄨㄥˋ", "我的": "ㄨㄛˇ,ㄉㄜ˙", 
    "目的": "ㄇㄨˋ,ㄉㄧˋ", "的確": "ㄉㄧˊ,ㄑㄩㄝˋ", "和平": "ㄏㄜˊ,ㄆㄧㄥˊ",
    "參與": "ㄘㄢ,ㄩˋ", "參加": "ㄘㄢ,ㄐㄧㄚ", "人蔘": "ㄖㄣˊ,ㄕㄣ", "測試": "ㄘㄜˋ,ㄕˋ", "測驗": "ㄘㄜˋ,ㄧㄢˋ"
};

const TAIWAN_COMMON_CHARS = {
    "業": "ㄧㄝˋ", "子": "ㄗˇ", "色": "ㄙㄜˋ", "次": "ㄘˋ", "日": "ㄖˋ", "就": "ㄐㄧㄡˋ",
    "得": "ㄉㄜ˙", "誰": "ㄕㄟˊ", "說": "ㄕㄨㄛ", "和": "ㄏㄢˋ", "著": "ㄓㄜ˙",
    "了": "ㄌㄜ˙", "的": "ㄉㄜ˙", "我": "ㄨㄛˇ", "你": "ㄋㄧˇ", "他": "ㄊㄚ", "是": "ㄕˋ", "有": "ㄧㄡˇ",
    "測": "ㄘㄜˋ", "試": "ㄕˋ", "啊": "ㄚ˙", "這": "ㄓㄜˋ", "那": "ㄋㄚˋ", "哪": "ㄋㄚˇ"
};

// 完整字典壓縮包

(async function initExternalDict() {
    try {
        const response = await fetch("https://raw.githubusercontent.com/kemdict/kemdict-data-ministry-of-education/main/dict_mini.json");
        if (!response.ok) return;
        const data = await response.json();
        const processEntry = (word, bpmf) => {
            if (!word || !bpmf || typeof word !== 'string') return;
            let cleanBpmf = Array.isArray(bpmf) ? bpmf.join(',') : bpmf.replace(/（[^）]*）|\([^)]*\)|<[^>]+>/g, '').trim().split(/[\s　_]+/).filter(s => s).join(',');
            if (!cleanBpmf || cleanBpmf.split(',').length !== word.length) return;
            if (!PHRASE_BPMF_DICT[word]) PHRASE_BPMF_DICT[word] = cleanBpmf;
            if (word.length > currentMaxPhraseLen) currentMaxPhraseLen = word.length;
        };
        if (Array.isArray(data)) data.forEach(item => {
            if (Array.isArray(item) && item.length >= 2) processEntry(item[0], item[1]);
            else if (typeof item === 'object' && item !== null) {
                let w = item['title'] || item['word'] || item['t'] || item['字詞'];
                let b = item['bopomofo'] || item['bpmf'] || item['pinyin'] || item['p'] || item['注音'];
                if (!b && item['heteronyms'] && item['heteronyms'][0]) b = item['heteronyms'][0]['bopomofo'];
                if (w && b) processEntry(w, b);
            }
        });
    } catch(err) {} 
})();

const romajiToHiraganaMap = {
    'a':'あ','i':'い','u':'う','e':'え','o':'お',
    'ka':'か','ki':'き','ku':'く','ke':'け','ko':'こ','ga':'が','gi':'ぎ','gu':'ぐ','ge':'げ','go':'ご',
    'sa':'さ','shi':'し','su':'す','se':'せ','so':'そ','za':'ざ','ji':'じ','zu':'ず','ze':'ぜ','zo':'ぞ',
    'ta':'た','chi':'ち','tsu':'つ','te':'て','to':'と','da':'だ','ji':'ぢ','zu':'づ','de':'で','do':'ど',
    'na':'な','ni':'に','nu':'ぬ','ne':'ね','no':'の',
    'ha':'は','hi':'ひ','fu':'ふ','he':'へ','ho':'ほ','ba':'ば','bi':'び','bu':'ぶ','be':'べ','bo':'ぼ','pa':'ぱ','pi':'ぴ','pu':'ぷ','pe':'ぺ','po':'ぽ',
    'ma':'ま','mi':'み','mu':'む','me':'め','mo':'も',

    'ra':'ら','ri':'り','ru':'る','re':'れ','ro':'ろ',

    'sha':'しゃ','shu':'しゅ','sho':'しょ','ja':'じゃ','ju':'じゅ','jo':'じょ',
    'cha':'ちゃ','chu':'ちゅ','cho':'ちょ','nya':'にゃ','nyu':'にゅ','nyo':'にょ',
    'hya':'ひゃ','hyu':'ひゅ','hyo':'ひょ','bya':'びゃ','byu':'びゅ','byo':'びょ','pya':'ぴゃ','pyu':'ぴゅ','pyo':'ぴょ',
    'mya':'みゃ','myu':'みゅ','myo':'みょ','rya':'りゃ','ryu':'りゅ','ryo':'りょ'
};

function convertRomajiToHiragana(romaji) {
    if(!romaji) return "";
    let result = ""; let temp = romaji.toLowerCase();
    while (temp.length > 0) {
        if(temp[0] === '-') { result += 'ー'; temp = temp.substring(1); continue; }
        let match = false;
        for (let len = 3; len >= 1; len--) {
            if (temp.length >= len) {
                let sub = temp.substring(0, len);
                if (romajiToHiraganaMap[sub]) { result += romajiToHiraganaMap[sub]; temp = temp.substring(len); match = true; break; }
            }
        }
        if (!match) { 
            if(temp.length > 1 && temp[0] === temp[1] && temp[0].match(/[kstwpmgzdb]/)) { result += 'っ'; temp = temp.substring(1); }
            else { result += temp[0]; temp = temp.substring(1); }
        }
    }
    return result;
}

// 2. 顯示渲染引擎與分詞演算法
// ==========================================
function parseSentence(text) {
    let result = []; let i = 0;
    while (i < text.length) {
        let matched = false;
        let limit = Math.min(currentMaxPhraseLen, text.length - i);
        for (let len = limit; len >= 2; len--) {
            let word = text.slice(i, i + len);
            if (PHRASE_BPMF_DICT[word]) {
                let bpmfs = PHRASE_BPMF_DICT[word].split(',');
                if (bpmfs.length === len) {
                    for (let j = 0; j < len; j++) result.push({ char: word[j], bpmf: bpmfs[j] });
                    i += len; matched = true; break;
                }
            }
        }
        if (!matched) {
            let char = text[i];
            result.push({ char: char, bpmf: charToBpmfCache[char] || "" }); i++;
        }
    }
    return result;
}

function extractBpmf(bpmfString) {
    if (!bpmfString) return { symbols: [], lightTone: '', markTone: '' };
    let lightTone = '', markTone = '', symbols = [];
    for (let char of bpmfString) {
        if (char === '˙') lightTone = '˙';
        else if (['ˊ', 'ˇ', 'ˋ'].includes(char)) markTone = char;
        else symbols.push(char);
    }
    return { symbols, lightTone, markTone };
}

function createCharBox(char, bpmfString, isInterim, isPunctuation = false, isEnglish = false, isForeign = false, hiragana = null) {
    const box = document.createElement('div');
    const classNameExt = isEnglish ? 'is-english' : (isForeign ? 'is-foreign' : (isPunctuation ? 'is-punctuation' : ''));
    box.className = `ruby-container ${isInterim ? 'is-interim' : ''} ${classNameExt}`;
    
    // 日文 Furigana 標籤處理 (原生 HTML5 Ruby)
    if (hiragana) {
        box.innerHTML = `
            <ruby class="jp-ruby">
                <span class="jp-kanji">${char}</span>
                <rt class="jp-furi">${hiragana}</rt>
            </ruby>`;
        return box;
    }

    if (isEnglish || isForeign || isPunctuation || !bpmfString) { box.innerHTML = `<div class="ruby-char">${char}</div>`; return box; }

    const { symbols, lightTone, markTone } = extractBpmf(bpmfString);
    let zhuyinHtml = `<div class="ruby-zhuyin">`;
    if (lightTone) zhuyinHtml += `<span class="tone-light">${lightTone}</span>`;
    zhuyinHtml += `<div class="zhuyin-col">`;
    symbols.forEach(sym => zhuyinHtml += `<span class="zhuyin-symbol">${sym}</span>`);
    zhuyinHtml += `</div>`;
    if (markTone) zhuyinHtml += `<span class="tone-mark">${markTone}</span>`;
    zhuyinHtml += `</div>`;
    
    box.innerHTML = `<div class="ruby-char">${char}</div>${zhuyinHtml}`;
    return box;
}

function parseTokensToNodes(text, isInterim = false, srcLang = 'zh-TW', translationData = null) {
    if (!text || text === "undefined") return [];
    let nodes = [];
    
    // 日文平假名對齊解析器 (僅標註漢字)
    if (srcLang === 'ja') {
        if (!isInterim && translationData && translationData.rawData && translationData.rawData[0]) {
            // 解析 Google 翻譯陣列結構，抓取每段的羅馬拼音
            let segments = translationData.rawData[0];
            segments.forEach(seg => {
                if (seg[0] && typeof seg[0] === 'string' && seg[3] && typeof seg[3] === 'string') {
                    let jpText = seg[0]; let romaji = seg[3];
                    let hira = convertRomajiToHiragana(romaji);
                    
                    // 簡單分辨：如果該段全為漢字，才掛上 Ruby；否則直接印出平假名/片假名/符號
                    if (/^[\u4E00-\u9FAF]+$/.test(jpText)) {
                        nodes.push(createCharBox(jpText, '', false, false, false, false, hira));
                    } else {
                        // 若混合，就不標註上方，避免錯位
                        nodes.push(createCharBox(jpText, '', false, false, false, true));
                    }
                } else if (seg[0]) {
                    nodes.push(createCharBox(seg[0], '', false, false, false, true));
                }
            });
            if(nodes.length > 0) return nodes;
        }
        nodes.push(createCharBox(text, '', isInterim, false, false, true));
        return nodes;
    }

    if (srcLang !== 'zh-TW') {
        const tokens = text.match(/[\s\S]/g) || [];
        let buffer = "";
        tokens.forEach(char => {
            if (/^[，。！？、：；,.?!;: ]$/.test(char)) {
                if (buffer) { nodes.push(createCharBox(buffer, '', isInterim, false, false, true)); buffer = ""; }
                nodes.push(createCharBox(char, '', isInterim, true, false, false));
            } else { buffer += char; }
        });
        if (buffer) nodes.push(createCharBox(buffer, '', isInterim, false, false, true));
        return nodes;
    }

    // 中文/英文/符號分詞
    const tokens = text.match(/[\u4e00-\u9fa5]+|[a-zA-Z0-9\s'-]+|[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+/g) || [];
    tokens.forEach(token => {
        if (/^[a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, false, true, false));
        else if (/^[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, true, false, false));
        else {
            const parsedItems = parseSentence(token);
            parsedItems.forEach(item => nodes.push(createCharBox(item.char, item.bpmf, isInterim, false, false, false)));
        }
    });
    return nodes;
}

// 3. 系統控制與卡片狀態管理 (防呆空白卡與動態語系切換)
// ==========================================
const ControlSystem = (() => {
    const linesContainer = document.getElementById('linesContainer');
    const tagBanner = document.getElementById('tagBanner');
    const textMicFull = document.getElementById('text-mic');
    const textMicShort = document.getElementById('text-mic-short');
    
    const langA = document.getElementById('langA');
    const langB = document.getElementById('langB');
    const btnDir = document.getElementById('btn-dir');
    
    let isDirectionRight = true; 
    let isUserRequestedStop = true;
    let isTTSPlaying = false; 
    
    let recognition = null;
    let currentLineObj = null;
    let lineBreakTimer = null;
    
    let deletedCardsStack = []; 
    let savedCards = JSON.parse(localStorage.getItem('lockedCards') || '[]');

    const localeMap = {
        'zh-TW': 'zh-TW', 'en': 'en-US', 'ja': 'ja-JP', 'ko': 'ko-KR',
        'es': 'es-ES', 'de': 'de-DE', 'ru': 'ru-RU', 'fr': 'fr-FR'
    };
    
    const tagColors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

    function getSourceLang() { return isDirectionRight ? langA.value : langB.value; }
    function getTargetLang() { return isDirectionRight ? langB.value : langA.value; }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function restartSpeechIfRecording() {
        // 若卡片為空，允許動態更新語言設定 (防呆)
        if (currentLineObj && currentLineObj.wrapper.classList.contains('is-empty')) {
            currentLineObj.srcLang = getSourceLang();
            currentLineObj.tgtLang = getTargetLang();
        }
        
        if (!isUserRequestedStop && recognition && !isTTSPlaying) {
            try { recognition.stop(); } catch(e) {}
        }
    }

    langA.addEventListener('change', restartSpeechIfRecording);
    langB.addEventListener('change', restartSpeechIfRecording);

    function loadSavedCards() {
        savedCards.forEach(cardData => {
            const lineObj = createNewActiveLine(cardData.id, true);
            lineObj.fullText = cardData.fullText;
            lineObj.translatedText = cardData.translatedText;
            lineObj.srcLang = cardData.srcLang;
            lineObj.tgtLang = cardData.tgtLang;
            lineObj.wrapper.classList.remove('is-empty');
            
            let nodes = parseTokensToNodes(cardData.fullText, false, cardData.srcLang);
            nodes.forEach(n => lineObj.finalAnchor.appendChild(n));
            
            if (cardData.translatedText) {
                lineObj.translationContainer.textContent = cardData.translatedText;
                lineObj.translationContainer.classList.add('show');
                lineObj.translated = true;
            }
            if (cardData.isTagged) applyTag(lineObj, cardData.tagColor, true);
        });
        // 不預先產生空白卡片，保持畫面乾淨
    }

    function saveState() {
        const allWrappers = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active:not(.is-empty)'));
        const lockedData = [];
        allWrappers.forEach(wrapper => {
            const lineObj = wrapper.lineObj;
            if (lineObj && lineObj.isTagged && lineObj.fullText.trim() !== '') {
                lockedData.push({
                    id: lineObj.id,
                    fullText: lineObj.fullText,
                    translatedText: lineObj.translatedText,
                    isTagged: lineObj.isTagged,
                    tagColor: lineObj.tagColor,
                    srcLang: lineObj.srcLang,
                    tgtLang: lineObj.tgtLang
                });
            }
        });
        localStorage.setItem('lockedCards', JSON.stringify(lockedData.reverse())); 
    }

    function removeCard(lineObj, saveToStack = true) {
        if (lineObj.isTagged || lineObj.wrapper.classList.contains('is-empty')) return; // 防呆
        if (saveToStack) deletedCardsStack.push(lineObj);
        
        lineObj.wrapper.classList.remove('active');
        lineObj.wrapper.classList.add('deleting');
        setTimeout(() => {
            if (lineObj.wrapper.parentNode) lineObj.wrapper.parentNode.removeChild(lineObj.wrapper);
            if (lineObj.tagEl && lineObj.tagEl.parentNode) lineObj.tagEl.parentNode.removeChild(lineObj.tagEl);
            saveState();
        }, 500);
    }

    function applyTag(lineObj, forceColor = null, isInitializing = false) {
        if (lineObj.isTagged && !isInitializing || lineObj.wrapper.classList.contains('is-empty')) return; 
        
        const firstChar = lineObj.fullText.trim().charAt(0) || '?';
        const color = forceColor || tagColors[Math.floor(Math.random() * tagColors.length)];
        
        lineObj.isTagged = true;
        lineObj.tagColor = color;
        lineObj.speechLine.style.borderColor = color;

        const tagEl = document.createElement('div');
        tagEl.className = 'circle-tag';
        tagEl.style.borderColor = color;
        tagEl.style.backgroundColor = color + '40'; 
        tagEl.textContent = firstChar;
        
        tagEl.addEventListener('click', () => {
            lineObj.wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            lineObj.speechLine.style.background = color + '20';
            setTimeout(() => lineObj.speechLine.style.background = '', 1000);
        });
        
        tagEl.addEventListener('dblclick', () => removeTag(lineObj));
        
        lineObj.tagEl = tagEl;
        tagBanner.prepend(tagEl); 
        if(!isInitializing) saveState();
    }

    function removeTag(lineObj) {
        if (!lineObj.isTagged) return;
        lineObj.isTagged = false;
        lineObj.tagColor = null;
        lineObj.speechLine.style.borderColor = ''; 
        
        if (lineObj.tagEl) {
            lineObj.tagEl.style.transform = 'scale(0)';
            lineObj.tagEl.style.opacity = '0';
            setTimeout(() => {
                if (lineObj.tagEl && lineObj.tagEl.parentNode) lineObj.tagEl.parentNode.removeChild(lineObj.tagEl);
                lineObj.tagEl = null;
            }, 300);
        }
        saveState();
    }

    function attachSwipeGestures(lineObj) {
        let startX = 0, startY = 0, currentX = 0;
        let isSwiping = false, isVerticalScroll = false;
        let translateVal = 0;

        lineObj.speechLine.addEventListener('touchstart', e => {
            if (lineObj.wrapper.classList.contains('is-empty')) return; 
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            isSwiping = false; isVerticalScroll = false;
            lineObj.speechLine.style.transition = 'none'; 
        });

        lineObj.speechLine.addEventListener('touchmove', e => {
            if (lineObj.wrapper.classList.contains('is-empty')) return; 
            currentX = e.touches[0].clientX; let currentY = e.touches[0].clientY;
            let deltaX = currentX - startX; let deltaY = currentY - startY;

            if (!isSwiping && !isVerticalScroll) {
                if (Math.abs(deltaY) > Math.abs(deltaX) + 5) { isVerticalScroll = true; return; }
                if (Math.abs(deltaX) > 10) { isSwiping = true; }
            }

            if (isSwiping && !isVerticalScroll) {
                e.preventDefault(); 
                if (lineObj.isTagged && deltaX < 0) deltaX = deltaX * 0.2; 
                lineObj.speechLine.style.transform = `translateX(${deltaX}px)`;
                translateVal = deltaX;
            }
        });

        lineObj.speechLine.addEventListener('touchend', e => {
            if (!isSwiping) return;
            lineObj.speechLine.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s, border-color 0.4s';
            
            if (translateVal < -100 && !lineObj.isTagged) {
                lineObj.speechLine.style.transform = `translateX(-120%)`; removeCard(lineObj);
            } else if (translateVal > 100) {
                lineObj.speechLine.style.transform = `translateX(0)`;
                if (lineObj.isTagged) removeTag(lineObj); else applyTag(lineObj);
            } else if (translateVal < -40 && !lineObj.isTagged) {
                lineObj.speechLine.style.transform = `translateX(-80px)`; 
            } else if (translateVal > 40) {
                lineObj.speechLine.style.transform = `translateX(80px)`; 
            } else { lineObj.speechLine.style.transform = `translateX(0)`; }
            translateVal = 0;
        });

        lineObj.speechLine.addEventListener('click', (e) => {
            if (lineObj.speechLine.style.transform !== '' && lineObj.speechLine.style.transform !== 'translateX(0px)') {
                lineObj.speechLine.style.transform = `translateX(0)`; e.stopPropagation();
            }
        });
    }

    function createNewActiveLine(forceId = null, isAppendingHistoric = false) {
        if (!isAppendingHistoric && currentLineObj && currentLineObj.fullText === '') return currentLineObj; 
        
        let wrapper = document.createElement('div'); wrapper.className = 'speech-line-wrapper is-empty';
        let innerWrapper = document.createElement('div'); innerWrapper.className = 'speech-line-inner';
        
        let actionsBg = document.createElement('div'); actionsBg.className = 'swipe-actions-bg';
        actionsBg.innerHTML = `
            <div class="swipe-btn tag"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="m9 12 2 2 4-4"/></svg></div>
            <div class="swipe-btn delete"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
        `;
        
        let deskLeft = document.createElement('div'); deskLeft.className = 'desktop-action left'; deskLeft.title = "切換封存標籤";
        deskLeft.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
        let deskRight = document.createElement('div'); deskRight.className = 'desktop-action right'; deskRight.title = "刪除";
        deskRight.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

        let speechLine = document.createElement('div'); speechLine.className = 'speech-line';
        let textContainer = document.createElement('div'); textContainer.className = 'original-text';
        let finalAnchor = document.createElement('span'); finalAnchor.className = 'final-anchor';
        let interimAnchor = document.createElement('span'); interimAnchor.className = 'interim-anchor';
        let translationContainer = document.createElement('div'); translationContainer.className = 'translation-text';
        
        textContainer.appendChild(finalAnchor); textContainer.appendChild(interimAnchor);
        speechLine.appendChild(deskLeft); speechLine.appendChild(deskRight);
        speechLine.appendChild(textContainer); speechLine.appendChild(translationContainer);
        
        innerWrapper.appendChild(actionsBg); innerWrapper.appendChild(speechLine);
        wrapper.appendChild(innerWrapper);
        
        if(isAppendingHistoric) linesContainer.appendChild(wrapper); else linesContainer.prepend(wrapper);
        
        void wrapper.offsetWidth; 
        setTimeout(()=> wrapper.classList.add('active'), 10);

        const lineObj = { 
            id: forceId || "card_" + Date.now(),
            wrapper, speechLine, finalAnchor, interimAnchor, translationContainer, 
            fullText: '', translatedText: '', translated: false,
            isTagged: false, tagColor: null, tagEl: null,
            srcLang: getSourceLang(), tgtLang: getTargetLang()
        };
        wrapper.lineObj = lineObj;

        attachSwipeGestures(lineObj);

        const handleTagClick = (e) => { e.stopPropagation(); if(lineObj.fullText === '')return; if (lineObj.isTagged) removeTag(lineObj); else applyTag(lineObj); lineObj.speechLine.style.transform = `translateX(0)`; };
        const handleDeleteClick = (e) => { e.stopPropagation(); if(lineObj.fullText === '')return; lineObj.speechLine.style.transform = `translateX(0)`; removeCard(lineObj); };
        
        actionsBg.querySelector('.tag').addEventListener('click', handleTagClick);
        actionsBg.querySelector('.delete').addEventListener('click', handleDeleteClick);
        deskLeft.addEventListener('click', handleTagClick);
        deskRight.addEventListener('click', handleDeleteClick);

        const handleTTS = (text, lang) => {
            if (window.getSelection().toString().trim().length > 0 || lineObj.fullText === '') return;
            ControlSystem.playSpeech(text, localeMap[lang]);
        };
        textContainer.addEventListener('click', () => handleTTS(lineObj.fullText, lineObj.srcLang));
        translationContainer.addEventListener('click', () => {
            if (lineObj.translationContainer.textContent.includes("失敗")) {
                lineObj.translated = false; triggerTranslation(lineObj); 
            } else handleTTS(lineObj.translatedText, lineObj.tgtLang);
        });

        return lineObj;
    }

    // 修復正則阻斷：直接送出原文
    async function translateText(text, srcLang, tgtLang) {
        if (!text.trim()) return { translated: text, rawData: null };
        try {
            const sl = srcLang === 'zh-TW' ? 'zh-TW' : srcLang.split('-')[0];
            const tl = tgtLang === 'zh-TW' ? 'zh-TW' : tgtLang.split('-')[0];
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=rm&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error();
            const data = await response.json();
            const translated = data[0].map(item => item[0]).filter(i => i).join('');
            return { translated: translated || text, rawData: data };
        } catch (error) { return { translated: "翻譯處理失敗，點擊重試...", rawData: null }; }
    }

    async function triggerTranslation(lineObj) {
        if (!lineObj || !lineObj.fullText.trim() || lineObj.translated) return;
        lineObj.translated = true;
        
        lineObj.translationContainer.innerHTML = '<span class="trans-loading">即時翻譯中...</span>';
        lineObj.translationContainer.classList.add('show');
        
        try {
            const res = await translateText(lineObj.fullText, lineObj.srcLang, lineObj.tgtLang);
            lineObj.translationContainer.textContent = res.translated;
            lineObj.translatedText = res.translated;
            
            // 收到翻譯結果後，若是日文，則利用 API 內的 Romaji 進行平假名標註
            if (lineObj.srcLang === 'ja') {
                lineObj.finalAnchor.innerHTML = '';
                let nodes = parseTokensToNodes(lineObj.fullText, false, 'ja', res);
                nodes.forEach(n => lineObj.finalAnchor.appendChild(n));
            }
            saveState(); 
        } catch(e) {
            lineObj.translationContainer.textContent = "翻譯處理失敗，點擊重試...";
        }
    }

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            document.body.className = "state-listening";
            textMicFull.innerText = "暫停錄音"; textMicShort.innerText = "暫停";
            if (!currentLineObj || currentLineObj.fullText.trim() !== '') {
                currentLineObj = createNewActiveLine(); // 按下錄音才彈出空白卡
            }
        };

        recognition.onresult = (event) => {
            if (currentLineObj && currentLineObj.wrapper.classList.contains('is-empty')) {
                currentLineObj.wrapper.classList.remove('is-empty');
            }

            let interimHTML = document.createDocumentFragment();
            let finalAdded = false;
            let lastFinalTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                let transcript = event.results[i][0].transcript;
                if (typeof transcript === 'undefined') continue;
                
                if (event.results[i].isFinal) {
                    let nodes = parseTokensToNodes(transcript, false, currentLineObj.srcLang);
                    nodes.forEach(n => currentLineObj.finalAnchor.appendChild(n));
                    finalAdded = true;
                    lastFinalTranscript = transcript;
                    currentLineObj.fullText += transcript;
                } else {
                    let nodes = parseTokensToNodes(transcript, true, currentLineObj.srcLang);
                    nodes.forEach(n => interimHTML.appendChild(n));
                }
            }

            currentLineObj.interimAnchor.innerHTML = '';
            currentLineObj.interimAnchor.appendChild(interimHTML);

            if (finalAdded || interimHTML.childNodes.length > 0) {
                document.getElementById('displayContainer').scrollTo({ top: 0, behavior: 'smooth' });
            }

            if (finalAdded && /[。！？，、：；\n]/.test(lastFinalTranscript)) {
                triggerTranslation(currentLineObj);
                currentLineObj = createNewActiveLine();
            }

            clearTimeout(lineBreakTimer);
            lineBreakTimer = setTimeout(() => {
                if (currentLineObj && currentLineObj.finalAnchor.childNodes.length > 0) {
                    triggerTranslation(currentLineObj);
                    currentLineObj = createNewActiveLine();
                }
            }, 1500);
        };

        recognition.onerror = () => {
            isUserRequestedStop = true;
            document.body.className = "";
            textMicFull.innerText = "授權異常"; textMicShort.innerText = "異常";
        };

        recognition.onend = () => {
            if (!isUserRequestedStop && !isTTSPlaying) { 
                recognition.lang = localeMap[getSourceLang()];
                try { recognition.start(); } catch(e) {} 
            } else if (isUserRequestedStop) {
                document.body.className = "";
                textMicFull.innerText = "開始錄音"; textMicShort.innerText = "開始";
                
                // 防呆體驗：沒講話就按暫停，優雅縮回並刪除
                if (currentLineObj && currentLineObj.fullText.trim() === '') {
                    currentLineObj.wrapper.classList.remove('active');
                    currentLineObj.wrapper.classList.add('deleting');
                    setTimeout(() => {
                        if (currentLineObj && currentLineObj.wrapper.parentNode) currentLineObj.wrapper.parentNode.removeChild(currentLineObj.wrapper);
                        currentLineObj = null;
                    }, 400);
                }
            }
        };
    }

    let lastX, lastY, lastZ, lastUpdate = 0;
    window.addEventListener('devicemotion', (e) => {
        let current = e.accelerationIncludingGravity; if (!current) return;
        let currentTime = new Date().getTime();
        if ((currentTime - lastUpdate) > 100) {
            let diffTime = (currentTime - lastUpdate); lastUpdate = currentTime;
            let speed = Math.abs(current.x + current.y + current.z - lastX - lastY - lastZ) / diffTime * 10000;
            if (speed > 1500 && deletedCardsStack.length > 0) {
                let restoredObj = deletedCardsStack.pop();
                restoredObj.wrapper.classList.remove('deleting');
                linesContainer.prepend(restoredObj.wrapper);
                if(restoredObj.isTagged && restoredObj.tagEl) tagBanner.prepend(restoredObj.tagEl);
                setTimeout(() => restoredObj.wrapper.classList.add('active'), 50);
                saveState();
            }
            lastX = current.x; lastY = current.y; lastZ = current.z;
        }
    });

    setTimeout(loadSavedCards, 100);

    return {
        toggleDirection: () => {
            isDirectionRight = !isDirectionRight;
            if(isDirectionRight) { btnDir.classList.remove('left'); } 
            else { btnDir.classList.add('left'); }
            restartSpeechIfRecording();
        },
        toggleMic: () => {
            if (!SpeechRecognition) { alert("此瀏覽器不支援 Web Speech API。請使用 Chrome。"); return; }
            if (isUserRequestedStop) { 
                isUserRequestedStop = false; 
                recognition.lang = localeMap[getSourceLang()];
                try { recognition.start(); } catch(e) {} 
            } else { 
                isUserRequestedStop = true; try { recognition.stop(); } catch(e) {} 
            }
        },
        playSpeech: (text, lang) => {
            if (!text || text === "即時翻譯中..." || text.includes("失敗")) return;
            window.speechSynthesis.cancel(); 
            isTTSPlaying = true;
            let wasRecording = !isUserRequestedStop;
            if (wasRecording && recognition) { try { recognition.stop(); } catch(e) {} }

            const utterance = new SpeechSynthesisUtterance(text); utterance.lang = lang;
            utterance.onend = () => {
                isTTSPlaying = false;
                if (wasRecording && !isUserRequestedStop) {
                    recognition.lang = localeMap[getSourceLang()];
                    try { recognition.start(); } catch(e) {}
                }
            };
            utterance.onerror = utterance.onend; 
            window.speechSynthesis.speak(utterance);
        },
        copyText: () => {
            let lines = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active:not(.is-empty)')).reverse();
            let textToCopy = lines.map(wrapper => {
                let orig = Array.from(wrapper.querySelectorAll('.ruby-char, .jp-kanji')).map(n => n.textContent).join('');
                let trans = wrapper.querySelector('.translation-text')?.textContent || '';
                return orig + (trans && trans !== "即時翻譯中..." ? '\n' + trans : '');
            }).filter(t => t.trim() !== '').join('\n\n');

            if (!textToCopy) return;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('btn-copy'); const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> <span class="btn-text-full" style="font-weight:bold;">複製成功</span><span class="btn-text-short">成功</span>`;
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                setTimeout(() => { btn.innerHTML = originalHtml; btn.style.background = ''; }, 2000);
            });
        },
        clearSystem: () => {
            const allWrappers = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper.active'));
            allWrappers.forEach(wrapper => {
                const lineObj = wrapper.lineObj;
                if(lineObj && !lineObj.isTagged) removeCard(lineObj, true);
            });
        }
    };
})();
</script>
</body>
</html>
