<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>專業雙語注音即時翻譯系統</title>
    <style>
        /* ==========================================
           1. 現代隱性骨架與動態視窗防禦
           ========================================== */
        :root {
            --bg-color1: #0f172a; 
            --bg-color2: #1e293b; 
            --text-main: #f8fafc;
            --text-zhuyin: #ffffff; 
            --tone-color: #38bdf8;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --trans-color: #7dd3fc; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color1);
            background-image: radial-gradient(circle at center, var(--bg-color1) 0%, var(--bg-color2) 100%);
            color: var(--text-main);
            font-family: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            height: 100dvh; min-height: 100dvh; max-height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; overscroll-behavior: none;
        }

        /* ==========================================
           2. 系統狀態與動態提示列
           ========================================== */
        #statusBanner {
            width: 100%; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600;
            padding: 14px 0; font-size: 1.1rem; letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 10;
        }
        #statusBanner svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        body.state-listening #statusBanner {
            color: #4ade80; background: rgba(16, 185, 129, 0.15); border-bottom: 1px solid rgba(74, 222, 128, 0.4); text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .spin { animation: spin 1.5s linear infinite; }

        /* ==========================================
           3. 瀑布流顯示容器與翻譯專屬樣式
           ========================================== */
        #displayContainer {
            flex: 1 1 auto; width: 100%; max-width: 1400px; overflow-y: auto; padding: 30px 24px;
            overscroll-behavior-y: contain; display: block; scroll-behavior: smooth;
        }
        #displayContainer::-webkit-scrollbar { width: 8px; }
        #displayContainer::-webkit-scrollbar-track { background: transparent; }
        #displayContainer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        #linesContainer { display: flex; flex-direction: column; width: 100%; gap: 16px; }

        .speech-line-wrapper {
            display: grid; grid-template-rows: 0fr; opacity: 0;
            transition: grid-template-rows 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
        }
        .speech-line-wrapper.active { grid-template-rows: 1fr; opacity: 1; }

        .speech-line {
            min-height: 0; overflow: hidden; display: flex; flex-direction: column;
            width: 100%; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(30, 41, 59, 0.4); transition: padding 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s ease;
            padding: 0 24px;
        }
        .speech-line-wrapper.active .speech-line { padding: 20px 24px; }
        .speech-line-wrapper:nth-child(even) .speech-line { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.02); }
        .speech-line-wrapper:first-child .speech-line {
            background: rgba(56, 189, 248, 0.12); border-left: 6px solid #38bdf8; border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* 點擊發音游標樣式，不帶任何多餘特效 */
        .original-text, .translation-text { cursor: pointer; }

        .original-text { display: flex; flex-wrap: wrap; align-items: flex-end; align-content: flex-start; width: 100%; }
        
        .translation-text {
            width: 100%; margin-top: 12px; font-size: 1.6rem; color: var(--trans-color); font-weight: 500;
            letter-spacing: 0.5px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 12px;
            opacity: 0; transition: opacity 0.5s ease; display: none; line-height: 1.4;
        }
        .translation-text.show { opacity: 1; display: block; }
        .trans-loading { font-size: 1.2rem; color: #94a3b8; animation: pulse 1.5s infinite; font-weight: normal; display: inline-block; padding-top: 5px;}

        .final-anchor, .interim-anchor { display: contents; }

        /* ==========================================
           4. 注音排版 CSS (防重疊絕對對齊)
           ========================================== */
        .ruby-container {
            display: inline-flex; align-items: flex-end; height: 5.8rem; margin-right: 12px; margin-bottom: 8px;
            font-family: "標楷體", "DFKai-SB", 'Microsoft JhengHei', serif; transition: all 0.2s ease;
        }
        .ruby-char { font-size: 4.5rem; font-weight: bold; color: var(--text-main); line-height: 1; height: 4.5rem; display: flex; align-items: flex-end; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        
        .ruby-zhuyin {
            display: flex; flex-direction: column; justify-content: center; align-items: center; margin-left: 8px; font-size: 1.65rem; line-height: 1;
            color: var(--text-zhuyin); position: relative; font-weight: 900; text-shadow: 0 0 8px rgba(255, 255, 255, 0.4); padding-right: 0.9em; padding-top: 0.8em; height: 4.5rem; 
            /* 讓連續選取時，完美略過注音符號 */
            user-select: none; -webkit-user-select: none;
        }

        .zhuyin-symbol { position: relative; }
        .zhuyin-symbol.tone-light { position: absolute; top: 0.1em; left: 50%; transform: translateX(-50%); color: var(--tone-color); font-size: 1.25em; }
        .zhuyin-symbol.tone-mark { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--tone-color); font-size: 1.15em; }

        .ruby-container.is-interim { opacity: 0.65; transform: scale(0.96); }
        .ruby-container.is-interim .ruby-char { color: #94a3b8; text-shadow: none; }
        .ruby-container.is-interim .ruby-zhuyin { color: #cbd5e1; }
        
        .ruby-container.is-english .ruby-char { font-size: 3.5rem; color: #fcd34d; padding: 0 8px; letter-spacing: 1px; font-family: 'Microsoft JhengHei', sans-serif; white-space: pre-wrap; align-items: center; }
        .ruby-container.is-foreign .ruby-char { font-size: 3.5rem; color: #f8fafc; padding: 0 8px; font-family: -apple-system, sans-serif; white-space: pre-wrap; align-items: center; }
        .ruby-container.is-punctuation .ruby-char { font-size: 3.5rem; color: #64748b; padding: 0 4px; align-items: center;}

        /* ==========================================
           5. 控制面板與純淨下拉箭頭切換 UI
           ========================================== */
        #controlPanel {
            flex-shrink: 0; width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 16px;
            padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 10;
        }

        .lang-switcher { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; }
        .lang-switcher select { 
            background: rgba(15, 23, 42, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 10px 14px; border-radius: 12px; outline: none; font-weight: bold; font-size: 1rem;
            flex: 1; max-width: 200px; text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            appearance: none; -webkit-appearance: none; cursor: pointer;
        }
        .lang-switcher select:focus { border-color: #38bdf8; }
        
        .dir-btn {
            background: linear-gradient(135deg, #475569, #334155); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0;
        }
        .dir-btn:active { transform: scale(0.9); }
        .dir-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s ease;}
        .dir-btn.left svg { transform: rotate(180deg); }

        .btn-group { display: flex; gap: 16px; width: 100%; }
        .magic-btn {
            flex: 1; padding: 16px 8px; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 18px; cursor: pointer; color: #ffffff;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 6px 15px rgba(0,0,0,0.2); letter-spacing: 1px;
        }
        .magic-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .magic-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        body.state-listening .btn-primary { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-danger { background: linear-gradient(135deg, #64748b, #475569); }

        @media (max-width: 768px) {
            #linesContainer { gap: 12px; }
            .speech-line-wrapper.active .speech-line { padding: 16px 16px; }
            .translation-text { font-size: 1.25rem; margin-top: 10px; padding-top: 10px; }
            .ruby-container { height: 4.8rem; margin-right: 8px; margin-bottom: 4px; }
            .ruby-char { font-size: 3.2rem; height: 3.2rem; }
            .ruby-zhuyin { font-size: 1.35rem; margin-left: 6px; padding-right: 0.9em; padding-top: 0.7em; height: 3.2rem;}
            .ruby-container.is-english .ruby-char, .ruby-container.is-punctuation .ruby-char, .ruby-container.is-foreign .ruby-char { font-size: 2.5rem; height: auto; }
            
            #controlPanel { padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); gap: 12px; border-radius: 20px 20px 0 0;}
            .lang-switcher select { font-size: 0.95rem; padding: 10px 4px; max-width: 140px;}
            .dir-btn { width: 38px; height: 38px; }
            .magic-btn { padding: 12px 4px; font-size: 1rem; border-radius: 14px;}
            .magic-btn svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

<div id="statusBanner">
    <svg id="icon-status" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

</div>

<div id="displayContainer">
    <div id="linesContainer"></div>
</div>

<div id="controlPanel">
    <!-- 純下拉雙向箭頭選單 -->
    <div class="lang-switcher">
        <select id="langA">
            <option value="zh-TW" selected>正體中文 (Chinese)</option>
            <option value="en">英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="ko">韓文 (한국어)</option>

            <option value="ru">俄文 (Русский)</option>

        <button id="btn-dir" class="dir-btn" onclick="ControlSystem.toggleDirection()" title="切換翻譯方向">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        
        <select id="langB">
            <option value="zh-TW">正體中文 (Chinese)</option>
            <option value="en" selected>英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="ko">韓文 (한국어)</option>
            <option value="es">西班牙文 (Español)</option>
            <option value="de">德文 (Deutsch)</option>
            <option value="ru">俄文 (Русский)</option>
            <option value="fr">法文 (Français)</option>

    </div>

    <div class="btn-group">
        <button id="btn-mic" class="magic-btn btn-primary" onclick="ControlSystem.toggleMic()">
            <svg id="icon-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            <span id="text-mic">開始錄音</span>
        </button>
        <button id="btn-copy" class="magic-btn btn-secondary" onclick="ControlSystem.copyText()">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="text-copy">複製對照</span>
        </button>
        <button id="btn-clear" class="magic-btn btn-danger" onclick="ControlSystem.clearSystem()">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span>清空畫面</span>
        </button>
    </div>
</div>

(async function initExternalDict() {
    const iconEl = document.getElementById('icon-status'); const textEl = document.getElementById('statusText');
    try {
        textEl.innerText = "正在同步教育部雲端成語字典..."; iconEl.innerHTML = SVG_ICONS.cloud; iconEl.classList.add('spin');
        const url = "https://raw.githubusercontent.com/kemdict/kemdict-data-ministry-of-education/main/dict_mini.json";
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network load failed");
        const data = await response.json();
        const processEntry = (word, bpmf) => {
            if (!word || !bpmf || typeof word !== 'string') return;
            let cleanBpmf = "";
            if (Array.isArray(bpmf)) cleanBpmf = bpmf.join(',');
            else if (typeof bpmf === 'string') cleanBpmf = bpmf.replace(/（[^）]*）|\([^)]*\)|<[^>]+>/g, '').trim().split(/[\s　_]+/).filter(s => s).join(',');
            if (!cleanBpmf || cleanBpmf.split(',').length !== word.length) return;
            if (!PHRASE_BPMF_DICT[word]) PHRASE_BPMF_DICT[word] = cleanBpmf;
            if (word.length > currentMaxPhraseLen) currentMaxPhraseLen = word.length;
        };
        if (Array.isArray(data)) {
            data.forEach(item => {
                if (Array.isArray(item) && item.length >= 2) processEntry(item[0], item[1]);
                else if (typeof item === 'object' && item !== null) {
                    let word = item['title'] || item['word'] || item['t'] || item['字詞'];
                    let bpmf = item['bopomofo'] || item['bpmf'] || item['pinyin'] || item['p'] || item['注音'];
                    if (!bpmf && item['heteronyms'] && item['heteronyms'][0]) bpmf = item['heteronyms'][0]['bopomofo'];
                    if (word && bpmf) processEntry(word, bpmf);
                }
            });
        } else if (typeof data === 'object') {
            for (let word in data) processEntry(word, data[word]);
        }
        textEl.innerText = "系統已就緒：點擊下方按鈕開始";
    } catch(err) {
        textEl.innerText = "連線字典異常，使用核心詞庫（就緒）";
    } finally {
        iconEl.innerHTML = SVG_ICONS.idle; iconEl.classList.remove('spin');
    }
})();

// 2. 顯示渲染引擎與分詞演算法 (Max Match)
// ==========================================
function parseSentence(text) {
    let result = []; let i = 0;
    while (i < text.length) {
        let matched = false;
        let limit = Math.min(currentMaxPhraseLen, text.length - i);
        for (let len = limit; len >= 2; len--) {
            let word = text.slice(i, i + len);
            if (PHRASE_BPMF_DICT[word]) {
                let bpmfs = PHRASE_BPMF_DICT[word].split(',');
                if (bpmfs.length === len) {
                    for (let j = 0; j < len; j++) result.push({ char: word[j], bpmf: bpmfs[j] });
                    i += len; matched = true; break;
                }
            }
        }
        if (!matched) {
            let char = text[i];
            result.push({ char: char, bpmf: charToBpmfCache[char] || "" }); i++;
        }
    }
    return result;
}

function extractBpmf(bpmfString) {
    if (!bpmfString) return { symbols: [], lightTone: '', markTone: '' };
    let lightTone = '', markTone = '', symbols = [];
    for (let char of bpmfString) {
        if (char === '˙') lightTone = '˙';
        else if (['ˊ', 'ˇ', 'ˋ'].includes(char)) markTone = char;
        else symbols.push(char);
    }
    return { symbols, lightTone, markTone };
}

function createCharBox(char, bpmfString, isInterim, isPunctuation = false, isEnglish = false, isForeign = false) {
    const box = document.createElement('div');
    const classNameExt = isEnglish ? 'is-english' : (isForeign ? 'is-foreign' : (isPunctuation ? 'is-punctuation' : ''));
    box.className = `ruby-container ${isInterim ? 'is-interim' : ''} ${classNameExt}`;
    
    if (isEnglish || isForeign || isPunctuation || !bpmfString) { box.innerHTML = `<div class="ruby-char">${char}</div>`; return box; }

    const { symbols, lightTone, markTone } = extractBpmf(bpmfString);
    let zhuyinHtml = `<div class="ruby-zhuyin">`;
    if (lightTone) zhuyinHtml += `<span class="zhuyin-symbol tone-light">${lightTone}</span>`;
    symbols.forEach(sym => zhuyinHtml += `<span class="zhuyin-symbol">${sym}</span>`);
    if (markTone) zhuyinHtml += `<span class="zhuyin-symbol tone-mark">${markTone}</span>`;
    zhuyinHtml += `</div>`;
    box.innerHTML = `<div class="ruby-char">${char}</div>${zhuyinHtml}`;
    return box;
}

function parseTokensToNodes(text, isInterim = false, isZhInput = true) {
    if (!text || text === "undefined") return [];
    let nodes = [];
    
    if (!isZhInput) {
        const tokens = text.match(/[\s\S]/g) || [];
        let buffer = "";
        tokens.forEach(char => {
            if (/^[，。！？、：；,.?!;: ]$/.test(char)) {
                if (buffer) { nodes.push(createCharBox(buffer, '', isInterim, false, false, true)); buffer = ""; }
                nodes.push(createCharBox(char, '', isInterim, true, false, false));
            } else {
                buffer += char;
            }
        });
        if (buffer) nodes.push(createCharBox(buffer, '', isInterim, false, false, true));
        return nodes;
    }

    const tokens = text.match(/[\u4e00-\u9fa5]+|[a-zA-Z0-9\s'-]+|[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+/g) || [];
    tokens.forEach(token => {
        if (/^[a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, false, true, false));
        else if (/^[^\u4e00-\u9fa5a-zA-Z0-9\s'-]+$/.test(token)) nodes.push(createCharBox(token, '', isInterim, true, false, false));
        else {
            const parsedItems = parseSentence(token);
            parsedItems.forEach(item => nodes.push(createCharBox(item.char, item.bpmf, isInterim, false, false, false)));
        }
    });
    return nodes;
}

    }

    async function translateText(text, srcLang, tgtLang) {
        if (!text.trim() || /^[0-9\s\W_]+$/.test(text)) return text;
        try {
            // 明確指定來源與目標語言，徹底解決亂翻或翻譯失敗問題
            const sl = srcLang === 'zh-TW' ? 'zh-TW' : srcLang.split('-')[0];
            const tl = tgtLang === 'zh-TW' ? 'zh-TW' : tgtLang.split('-')[0];
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error();
            const data = await response.json();
            return data[0].map(item => item[0]).join('');
        } catch (error) { return "翻譯連線失敗..."; }
    }

    async function triggerTranslation(lineObj) {
        if (!lineObj || !lineObj.fullText.trim() || lineObj.translated) return;
        lineObj.translated = true;
        
        const tgtLang = getTargetLang();
        const srcLang = getSourceLang();
        
        lineObj.translationContainer.innerHTML = '<span class="trans-loading">即時翻譯中...</span>';
        lineObj.translationContainer.classList.add('show');
        
        try {
            const translatedText = await translateText(lineObj.fullText, srcLang, tgtLang);
            lineObj.translationContainer.textContent = translatedText;
        } catch(e) {
            lineObj.translationContainer.textContent = "翻譯失敗";
        }
    }

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            document.body.className = "state-listening";
            statusText.innerText = "正在即時雙語轉錄...";
            iconStatus.innerHTML = SVG_ICONS.rec;
            textMic.innerText = "暫停錄音";
            if (!currentLineObj) currentLineObj = createNewActiveLine();
        };

        recognition.onresult = (event) => {
            let interimHTML = document.createDocumentFragment();
            let finalAdded = false;
            let lastFinalTranscript = '';
            
            let isZhInput = (getSourceLang() === 'zh-TW');

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                let transcript = event.results[i][0].transcript;
                if (typeof transcript === 'undefined') continue;
                
                if (event.results[i].isFinal) {
                    let nodes = parseTokensToNodes(transcript, false, isZhInput);
                    nodes.forEach(n => currentLineObj.finalAnchor.appendChild(n));
                    finalAdded = true;
                    lastFinalTranscript = transcript;
                    currentLineObj.fullText += transcript;
                } else {
                    let nodes = parseTokensToNodes(transcript, true, isZhInput);
                    nodes.forEach(n => interimHTML.appendChild(n));
                }
            }

            currentLineObj.interimAnchor.innerHTML = '';
            currentLineObj.interimAnchor.appendChild(interimHTML);

            if (finalAdded || interimHTML.childNodes.length > 0) {
                document.getElementById('displayContainer').scrollTo({ top: 0, behavior: 'smooth' });
            }

            if (finalAdded && /[。！？，、：；\n]/.test(lastFinalTranscript)) {
                triggerTranslation(currentLineObj);
                currentLineObj = createNewActiveLine();
            }

            clearTimeout(lineBreakTimer);
            lineBreakTimer = setTimeout(() => {
                if (currentLineObj && currentLineObj.finalAnchor.childNodes.length > 0) {
                    triggerTranslation(currentLineObj);
                    currentLineObj = createNewActiveLine();
                }
            }, 1500);
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed' || event.error === 'audio-capture') {
                isUserRequestedStop = true;
                document.body.className = "";
                statusText.innerText = "麥克風存取被拒絕，請檢查權限配置";
                iconStatus.innerHTML = SVG_ICONS.error;
                textMic.innerText = "授權異常";
            }
        };

        recognition.onend = () => {
            // 當 TTS 正在播放時，不要重啟麥克風，避免錄到系統音
            if (!isUserRequestedStop && !isTTSPlaying) { 
                recognition.lang = localeMap[getSourceLang()];
                try { recognition.start(); } catch(e) {} 
            } else if (isUserRequestedStop) {
                document.body.className = ""; statusText.innerText = "系統已暫停：隨時點擊按鈕繼續";
                iconStatus.innerHTML = SVG_ICONS.idle; textMic.innerText = "開始錄音";
            }
        };
    }

    return {
        toggleDirection: () => {
            isDirectionRight = !isDirectionRight;
            if(isDirectionRight) { btnDir.classList.remove('left'); } 
            else { btnDir.classList.add('left'); }
            restartSpeechIfRecording();
        },
        toggleMic: () => {
            if (!SpeechRecognition) { alert("此瀏覽器不支援 Web Speech API。"); return; }
            if (isUserRequestedStop) { 
                isUserRequestedStop = false; 
                recognition.lang = localeMap[getSourceLang()];
                try { recognition.start(); } catch(e) {} 
            } else { 
                isUserRequestedStop = true; 
                try { recognition.stop(); } catch(e) {} 
            }
        },
        playSpeech: (text, lang) => {
            if (!text || text === "即時翻譯中..." || text === "翻譯連線失敗...") return;
            window.speechSynthesis.cancel(); 
            
            isTTSPlaying = true;
            let wasRecording = !isUserRequestedStop;
            // 點擊瞬間，立刻關閉麥克風收音，避免錄到機器聲音
            if (wasRecording && recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            
            utterance.onend = () => {
                isTTSPlaying = false;
                // 發音結束後，如果原本是在錄音狀態，就無縫切回錄音
                if (wasRecording && !isUserRequestedStop) {
                    recognition.lang = localeMap[getSourceLang()];
                    try { recognition.start(); } catch(e) {}
                }
            };
            utterance.onerror = utterance.onend; // 發生錯誤時同樣恢復麥克風
            
            window.speechSynthesis.speak(utterance);
        },
        copyText: () => {
            let lines = Array.from(linesContainer.querySelectorAll('.speech-line-wrapper')).reverse();
            let textToCopy = lines.map(wrapper => {
                let orig = Array.from(wrapper.querySelectorAll('.ruby-char')).map(n => n.textContent).join('');
                let trans = wrapper.querySelector('.translation-text')?.textContent || '';
                return orig + (trans && trans !== "即時翻譯中..." ? '\n' + trans : '');
            }).filter(t => t.trim() !== '').join('\n\n');

            if (!textToCopy) { alert("目前沒有內容可以複製！"); return; }
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('btn-copy'); const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> <span style="font-weight:bold;">複製成功！</span>`;
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                setTimeout(() => { btn.innerHTML = originalHtml; btn.style.background = ''; }, 2000);
            });
        },
        clearSystem: () => {
            linesContainer.innerHTML = '';
            currentLineObj = null;
            currentLineObj = createNewActiveLine();
        }
    };
})();
</script>
</body>
</html>
